<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝 Formuláre – ErikAI HTML Kniha</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #f8fbff);
      color: #222;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      background: #0077cc;
      color: white;
      width: 100%;
      text-align: center;
      padding: 20px 0;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }

    main {
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 600px;
    }

    h2 {
      text-align: center;
      color: #0077cc;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-weight: bold;
    }

    input, textarea, button {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      background: #0077cc;
      color: white;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #005fa3;
      transform: scale(1.03);
    }

    footer {
      margin-top: auto;
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: gray;
    }
  </style>
</head>
<body>

  <header>
    <h1>📝 Kapitola 07 – Formuláre</h1>
    <p>Ukážka, ako zbierať údaje od používateľa</p>
  </header>

  <main>
    <h2>Jednoduchý kontaktný formulár</h2>
    <form>
      <label for="meno">Meno:</label>
      <input type="text" id="meno" name="meno" placeholder="Zadaj svoje meno" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="napr. erik@example.com" required>

      <label for="sprava">Správa:</label>
      <textarea id="sprava" name="sprava" rows="4" placeholder="Napíš svoju správu..."></textarea>

      <button type="submit">Odoslať</button>
    </form>
  </main>

  <footer>
    © 2025 Erik Mohylák • Kapitola 07 – Formuláre
  </footer>

</body>
</html>
