<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>ErikAI Pro 3D CATIA Studio v8.3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three-csg-ts@3.1.16/lib/bundle.js"></script>

<style>
:root{
  --bg-color: #0b0d13;
  --panel-bg: #1e222d;
  --border-color: #2e364f;
  --accent-green: #10b981;
  --accent-blue: #3b82f6;
  --accent-red: #ef4444;
  --accent-amber: #f59e0b;
  --accent-purple: #8b5cf6;
  --text-main: #ffffff;
  --text-muted: #94a3b8;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg-color);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  touch-action: none;
}
header{
  padding: 8px 12px;
  background: var(--panel-bg);
  border-bottom: 2px solid var(--border-color);
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  justify-content: space-between;
  z-index: 10;
}
.panel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

#workspaceContainer {
  flex: 1;
  overflow: hidden;
  position: relative;
  background: #0b0d13;
}

#model3DContainer {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
}

button, select.format-select{
  padding:7px 12px;
  border:none;
  border-radius:6px;
  background: var(--accent-green);
  color:#000;
  font-weight: bold;
  cursor:pointer;
  font-size: 0.85rem;
  transition: all 0.2s;
  box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
button:hover, select.format-select:hover{filter: brightness(1.1); transform: translateY(-1px);}
button.ghost{background: var(--panel-bg);border:1px solid var(--border-color);color:var(--text-main);}
button.danger{background: var(--accent-red); color:white;}

select.format-select {
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  outline: none;
}

.info{padding:5px 12px;background: var(--panel-bg);font-size:0.8rem;color:var(--text-muted);border-top:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;}

#dimensionsPanel{
  position:fixed;
  top:60px;
  right:15px;
  background:var(--panel-bg);
  border:1px solid var(--border-color);
  padding:12px;
  border-radius:10px;
  max-height:82vh;
  overflow-y: auto;
  overflow-x: hidden;
  display:block;
  box-shadow: 0 15px 40px rgba(0,0,0,0.8);
  width: 380px;
  max-width: 95vw;
  z-index: 1000;
}
.panel-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  cursor: grab;
  user-select: none;
  background: rgba(255,255,255,0.04);
  padding: 6px 10px;
  border-radius: 6px;
}
.panel-header h3{margin:0;color:var(--accent-green);font-size:0.9rem;}
.close-btn{
  background: transparent; border: none; color: var(--text-muted); font-size: 1.1rem; font-weight: bold; cursor: pointer; padding: 0 4px; box-shadow: none;
}

.shape-card{
  background: #121216;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.shape-card.active{
  border-color: var(--accent-blue);
  background: #1a233a;
}
.shape-title-row{
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.input-group-title{ font-size: 0.72rem; color: var(--accent-blue); font-weight: bold; margin-top: 4px; }
.input-row{ display: flex; gap: 6px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
.input-row label{ font-size: 0.73rem; color: var(--text-muted); white-space: nowrap; width: 55px; }
.input-row input, .input-row select{
  width: 65px;
  padding: 4px;
  border-radius: 4px;
  border: 1px solid var(--border-color);
  background: #090b10;
  color: white;
  font-size: 0.82rem;
}
.input-row input[type="color"]{
  width: 35px;
  height: 28px;
  padding: 0;
  cursor: pointer;
}
</style>
</head>
<body>

<header>
  <div class="panel">
    <select id="shapeSelector" class="format-select">
      <option value="box">🧊 Kocka / Kváder</option>
      <option value="cylinder">🧪 Kruh / Valec</option>
      <option value="pipe">⭕ Rúra s otvorom</option>
      <option value="elbow90">↩️ Koleno 90°</option>
      <option value="triangle">📐 Trojuholník</option>
      <option value="trapezoid">⏢ Lichobežník</option>
      <option value="oval">⬭ Ovál</option>
      <option value="parallelogram">▰ Rovnoběžník</option>
      <option value="rhombus">🔷 Kosoštvorec</option>
      <option value="semicircle">🌗 Polkruh</option>
      <option value="kite">🪁 Šarkan</option>
      <option value="pie">🥧 Koláč (výsek)</option>
      <option value="pentagon">⬟ 5-uholník</option>
      <option value="hexagon">⬢ 6-uholník</option>
      <option value="heptagon">⬣ 7-uholník</option>
      <option value="octagon">🛑 8-uholník</option>
      <option value="heart">❤️ Srdce</option>
      <option value="star">⭐ Hviezda</option>
      <option value="crescent">🌙 Kosačik</option>
      <option value="cross">➕ Kríž</option>
      <option value="arrow">⬆️ Šípka</option>
      <option value="keyway">🔑 Drážka pre pero</option>
    </select>

    <select id="csgOperationSelector" class="format-select" style="border-color: var(--accent-blue);">
      <option value="add">➕ Pridať teleso</option>
      <option value="subtract">➖ Odobrať materiál</option>
    </select>

    <button onclick="addNewShape()" style="background:var(--accent-green);">➕ Vytvoriť Tvar</button>
  </div>

  <div class="panel">
    <button class="ghost" onclick="togglePanel()" style="background:#4f46e5; color:white;">⚙️ Správa Tvarov</button>
    <button class="ghost" onclick="export3DHTML()" style="background:#d97706; color:white;">💾 Stiahnuť 3D HTML</button>
    <button class="ghost" onclick="clearAll()" style="background:#dc2626; color:white;">🗑️ Zmazať všetko</button>
  </div>
</header>

<div id="workspaceContainer">
  <div id="model3DContainer"></div>
</div>

<div class="info" id="info">
  <span id="infoCoords">3D CATIA Z-Up Studio v8.3 | Z >= 0 | Otáčanie: Ľavé tlačidlo myši | Posun: Pravé tlačidlo</span>
  <span id="infoCount">Počet dielov: 0</span>
</div>

<!-- Panel Správcu 3D Dielov -->
<div id="dimensionsPanel">
  <div class="panel-header">
    <h3>CATIA Editor Tvarov & Rotácií</h3>
    <button class="close-btn" onclick="togglePanel()">✕</button>
  </div>
  <div id="dimsContent">Zatiaľ žiadne telesá v scéne. Vytvorte nové teleso.</div>
</div>

<script>
THREE.Object3D.DefaultUp.set(0, 0, 1);

let shapes = [
  { type: 'box', op: 'add', x: 0, y: 0, z: 0, w: 120, h: 120, d: 40, r: 50, wall: 10, rx: 0, ry: 0, rz: 0, color: '#10b981' },
  { type: 'cylinder', op: 'subtract', x: 0, y: 0, z: 0, w: 100, h: 100, d: 50, r: 30, wall: 10, rx: 0, ry: 0, rz: 0, color: '#ef4444' }
];

let selectedShapeIndex = 0;
let scene, camera, renderer, controls;

const container3D = document.getElementById('model3DContainer');
const infoCount = document.getElementById('infoCount');
const dimsContent = document.getElementById('dimsContent');
const dimsPanel = document.getElementById('dimensionsPanel');

function togglePanel(){
  const show = dimsPanel.style.display !== 'none';
  dimsPanel.style.display = show ? 'none' : 'block';
}

function addNewShape(){
  const type = document.getElementById('shapeSelector').value;
  const op = document.getElementById('csgOperationSelector').value;
  
  shapes.push({
    type: type, op: op,
    x: 0, y: 0, z: 0,
    w: 100, h: 100, d: 60, r: 40, wall: 10,
    rx: 0, ry: 0, rz: 0,
    color: op === 'subtract' ? '#ef4444' : '#10b981'
  });

  selectedShapeIndex = shapes.length - 1;
  updateScene3D();
  updatePanel();
}

function clearAll(){
  shapes = [];
  selectedShapeIndex = null;
  updateScene3D();
  updatePanel();
}

// ----------------------------------------------------
// 📐 GENERÁTOR 2D PROFILOV NA EXTRÚZIU
// ----------------------------------------------------
function buildCustom2DShape(type, scW, scH, scR, scWall){
  const shape = new THREE.Shape();
  
  if(type === 'triangle'){
    shape.moveTo(-scW/2, -scH/2);
    shape.lineTo(scW/2, -scH/2);
    shape.lineTo(0, scH/2);
    shape.closePath();
  } else if(type === 'trapezoid'){
    shape.moveTo(-scW/2, -scH/2);
    shape.lineTo(scW/2, -scH/2);
    shape.lineTo(scW/4, scH/2);
    shape.lineTo(-scW/4, scH/2);
    shape.closePath();
  } else if(type === 'oval'){
    shape.absellipse(0, 0, scW/2, scH/2, 0, Math.PI * 2, false, 0);
  } else if(type === 'parallelogram'){
    shape.moveTo(-scW/2, -scH/2);
    shape.lineTo(scW/4, -scH/2);
    shape.lineTo(scW/2, scH/2);
    shape.lineTo(-scW/4, scH/2);
    shape.closePath();
  } else if(type === 'rhombus'){
    shape.moveTo(0, -scH/2);
    shape.lineTo(scW/2, 0);
    shape.lineTo(0, scH/2);
    shape.lineTo(-scW/2, 0);
    shape.closePath();
  } else if(type === 'semicircle'){
    shape.absarc(0, 0, scR, 0, Math.PI, false);
    shape.closePath();
  } else if(type === 'kite'){
    shape.moveTo(0, -scH/2);
    shape.lineTo(scW/2, 0);
    shape.lineTo(0, scH/2);
    shape.lineTo(-scW/2, 0);
    shape.closePath();
  } else if(type === 'pie'){
    shape.moveTo(0,0);
    shape.absarc(0, 0, scR, 0, Math.PI * 0.75, false);
    shape.closePath();
  } else if(type === 'pentagon' || type === 'hexagon' || type === 'heptagon' || type === 'octagon'){
    const sides = type==='pentagon'?5:(type==='hexagon'?6:(type==='heptagon'?7:8));
    for(let i=0; i<sides; i++){
      const a = (i / sides) * Math.PI * 2;
      const x = Math.cos(a) * scR;
      const y = Math.sin(a) * scR;
      if(i===0) shape.moveTo(x,y); else shape.lineTo(x,y);
    }
    shape.closePath();
  } else if(type === 'heart'){
    const x = 0, y = 0;
    shape.moveTo(x + scR*0.25, y + scR*0.25);
    shape.bezierCurveTo(x + scR*0.25, y + scR*0.25, x, y, x, y - scR*0.25);
    shape.bezierCurveTo(x, y - scR*0.6, x - scR*0.6, y - scR*0.6, x - scR*0.6, y - scR*0.6);
    shape.bezierCurveTo(x - scR, y - scR*0.6, x - scR, y, x - scR, y);
    shape.bezierCurveTo(x - scR, y + scR*0.4, x - scR*0.4, y + scR*0.8, x, y + scR);
    shape.bezierCurveTo(x + scR*0.4, y + scR*0.8, x + scR, y + scR*0.4, x + scR, y);
    shape.bezierCurveTo(x + scR, y, x + scR, y - scR*0.6, x + scR*0.6, y - scR*0.6);
    shape.bezierCurveTo(x + scR*0.4, y - scR*0.6, x, y - scR*0.6, x, y - scR*0.25);
    shape.closePath();
  } else if(type === 'star'){
    const points = 5;
    for(let i=0; i<points*2; i++){
      const r = i%2===0 ? scR : scR*0.4;
      const a = (i / (points*2)) * Math.PI * 2 - Math.PI/2;
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r;
      if(i===0) shape.moveTo(x,y); else shape.lineTo(x,y);
    }
    shape.closePath();
  } else if(type === 'crescent'){
    shape.absarc(0, 0, scR, 0, Math.PI * 2, false);
    const holePath = new THREE.Path();
    holePath.absarc(scR*0.4, 0, scR*0.8, 0, Math.PI * 2, true);
    shape.holes.push(holePath);
  } else if(type === 'cross'){
    const w = scW/2, t = scW/6;
    shape.moveTo(-t, -w); shape.lineTo(t, -w); shape.lineTo(t, -t);
    shape.lineTo(w, -t); shape.lineTo(w, t); shape.lineTo(t, t);
    shape.lineTo(t, w); shape.lineTo(-t, w); shape.lineTo(-t, t);
    shape.lineTo(-w, t); shape.lineTo(-w, -t); shape.lineTo(-t, -t);
    shape.closePath();
  } else if(type === 'arrow'){
    shape.moveTo(-scW/4, -scH/2);
    shape.lineTo(scW/4, -scH/2);
    shape.lineTo(scW/4, 0);
    shape.lineTo(scW/2, 0);
    shape.lineTo(0, scH/2);
    shape.lineTo(-scW/2, 0);
    shape.lineTo(-scW/4, 0);
    shape.closePath();
  } else if(type === 'keyway'){
    shape.absarc(-scW/4, 0, scH/2, Math.PI/2, Math.PI*1.5, false);
    shape.absarc(scW/4, 0, scH/2, -Math.PI/2, Math.PI/2, false);
    shape.closePath();
    const keyHole = new THREE.Path();
    keyHole.absarc(0, 0, scH/4, 0, Math.PI*2, true);
    shape.holes.push(keyHole);
  }
  return shape;
}

function createGeometryForShape(s){
  let geo;
  const scW = (s.w || 100) / 10;
  const scH = (s.h || 100) / 10;
  const scD = (s.d || 60) / 10;
  const scR = (s.r || 40) / 10;
  const scWall = (s.wall || 10) / 10;

  if(s.type === 'box') {
    geo = new THREE.BoxGeometry(scW, scH, scD);
    geo.translate(0, 0, scD / 2);
  } else if(s.type === 'cylinder') {
    geo = new THREE.CylinderGeometry(scR, scR, scD, 32);
    geo.rotateX(Math.PI / 2);
    geo.translate(0, 0, scD / 2);
  } else if(s.type === 'pipe') {
    const shape = new THREE.Shape();
    shape.absarc(0, 0, scR, 0, Math.PI * 2, false);
    const innerR = Math.max(0.5, scR - scWall);
    const holePath = new THREE.Path();
    holePath.absarc(0, 0, innerR, 0, Math.PI * 2, true);
    shape.holes.push(holePath);
    geo = new THREE.ExtrudeGeometry(shape, { depth: scD, bevelEnabled: false, curveSegments: 32 });
    geo.center(); geo.translate(0, 0, scD / 2);
  } else if(s.type === 'elbow90') {
    const pipeShape = new THREE.Shape();
    pipeShape.absarc(0, 0, scR, 0, Math.PI * 2, false);
    const curve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0, scD),
      new THREE.Vector3(scD, 0, scD)
    );
    geo = new THREE.ExtrudeGeometry(pipeShape, { steps: 20, extrudePath: curve, bevelEnabled: false });
  } else {
    const shape2D = buildCustom2DShape(s.type, scW, scH, scR, scWall);
    geo = new THREE.ExtrudeGeometry(shape2D, { depth: scD, bevelEnabled: false, curveSegments: 32 });
    geo.center(); geo.translate(0, 0, scD / 2);
  }
  return geo;
}

// ----------------------------------------------------
// 🚀 3D SCÉNA & CATIA MODELÁR
// ----------------------------------------------------
function init3D(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0d13);

  camera = new THREE.PerspectiveCamera(45, container3D.clientWidth / container3D.clientHeight, 0.1, 1000);
  camera.position.set(180, -220, 160);
  camera.up.set(0, 0, 1);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container3D.clientWidth, container3D.clientHeight);
  container3D.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  let dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(150, 200, 250);
  scene.add(dirLight);

  let grid = new THREE.GridHelper(400, 40, 0x10b981, 0x2e364f);
  grid.rotateX(Math.PI / 2);
  scene.add(grid);

  updateScene3D();
  updatePanel();
  animate3D();
}

function updateScene3D(){
  const removeObjects = [];
  scene.traverse(child => { if(child.isMesh) removeObjects.push(child); });
  removeObjects.forEach(m => scene.remove(m));

  let baseMesh = null;
  let subtractiveShapes = [];

  shapes.forEach((s, idx) => {
    const geo = createGeometryForShape(s);
    const isSelected = idx === selectedShapeIndex;
    const meshColor = s.color || (s.op === 'subtract' ? '#ef4444' : '#10b981');
    const mat = new THREE.MeshStandardMaterial({ 
      color: isSelected ? '#3b82f6' : meshColor, 
      roughness: 0.3, metalness: 0.2, transparent: s.op === 'subtract', opacity: s.op === 'subtract' ? 0.6 : 1.0 
    });
    const mesh = new THREE.Mesh(geo, mat);
    
    let worldX = (s.x || 0) / 10;
    let worldY = (s.y || 0) / 10;
    let worldZ = Math.max(0, (s.z || 0)) / 10;

    mesh.position.set(worldX, worldY, worldZ);
    mesh.rotation.set(
      THREE.MathUtils.degToRad(s.rx || 0),
      THREE.MathUtils.degToRad(s.ry || 0),
      THREE.MathUtils.degToRad(s.rz || 0)
    );
    mesh.updateMatrix();

    if(s.op === 'subtract') {
      subtractiveShapes.push({ mesh, index: idx });
      scene.add(mesh); // V editori ukazujeme červené rezné teleso
    } else {
      if(!baseMesh){
        baseMesh = mesh;
        scene.add(baseMesh);
      } else {
        scene.add(mesh);
      }
    }
  });

  if(baseMesh && subtractiveShapes.length > 0 && typeof CSG !== 'undefined'){
    try {
      let csgBase = CSG.fromMesh(baseMesh);
      subtractiveShapes.forEach(sub => {
        const csgSub = CSG.fromMesh(sub.mesh);
        csgBase = csgBase.subtract(csgSub);
      });
      scene.remove(baseMesh);
      const resultingMesh = CSG.toMesh(csgBase, baseMesh.matrix);
      resultingMesh.material = new THREE.MeshStandardMaterial({ color: baseMesh.material.color, roughness: 0.2, metalness: 0.3 });
      scene.add(resultingMesh);
    } catch(err){}
  }

  infoCount.textContent = `Počet dielov: ${shapes.length}`;
}

function updateShapeParam(index, field, value){
  if(!shapes[index]) return;
  if(field === 'color'){
    shapes[index][field] = value;
  } else {
    shapes[index][field] = parseFloat(value) || 0;
    if(field === 'z') shapes[index].z = Math.max(0, shapes[index].z);
  }
  updateScene3D();
}

function animate3D(){
  requestAnimationFrame(animate3D);
  controls.update();
  renderer.render(scene, camera);
}

function updatePanel(){
  dimsContent.innerHTML = '';
  if(shapes.length === 0){
    dimsContent.innerHTML = 'Žiadne telesá v scéne.';
    return;
  }
  shapes.forEach((s, i) => {
    let card = document.createElement('div');
    card.className = `shape-card ${i === selectedShapeIndex ? 'active' : ''}`;
    card.onclick = (e) => { 
      if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT' && e.target.tagName !== 'BUTTON'){
        selectedShapeIndex = i; 
        updateScene3D(); 
        updatePanel();
      }
    };
    
    card.innerHTML = `
      <div class="shape-title-row">
        <strong>#${i+1} ${s.type.toUpperCase()} (${s.op})</strong>
        <button class="danger" style="padding:2px 6px;" onclick="event.stopPropagation(); shapes.splice(${i},1); selectedShapeIndex=0; updateScene3D(); updatePanel();">🗑️ Zmazať</button>
      </div>
      <div class="input-group-title">Súradnice [Z >= 0] & Farba (mm):</div>
      <div class="input-row">
        <label>X:</label><input type="number" value="${s.x||0}" oninput="updateShapeParam(${i}, 'x', this.value)">
        <label>Y:</label><input type="number" value="${s.y||0}" oninput="updateShapeParam(${i}, 'y', this.value)">
        <label>Z:</label><input type="number" min="0" value="${Math.max(0, s.z||0)}" oninput="updateShapeParam(${i}, 'z', this.value)">
        <label>Farba:</label><input type="color" value="${s.color||'#10b981'}" oninput="updateShapeParam(${i}, 'color', this.value)">
      </div>
      <div class="input-group-title">Rotácie (stupne):</div>
      <div class="input-row">
        <label>Rot X:</label><input type="number" value="${s.rx||0}" oninput="updateShapeParam(${i}, 'rx', this.value)">
        <label>Rot Y:</label><input type="number" value="${s.ry||0}" oninput="updateShapeParam(${i}, 'ry', this.value)">
        <label>Rot Z:</label><input type="number" value="${s.rz||0}" oninput="updateShapeParam(${i}, 'rz', this.value)">
      </div>
      <div class="input-group-title">Rozmery (mm):</div>
      <div class="input-row">
        <label>Šírka:</label><input type="number" value="${s.w||100}" oninput="updateShapeParam(${i}, 'w', this.value)">
        <label>Hĺbka:</label><input type="number" value="${s.h||100}" oninput="updateShapeParam(${i}, 'h', this.value)">
        <label>Výška:</label><input type="number" value="${s.d||60}" oninput="updateShapeParam(${i}, 'd', this.value)">
        <label>Polomer:</label><input type="number" value="${s.r||40}" oninput="updateShapeParam(${i}, 'r', this.value)">
      </div>
    `;
    dimsContent.appendChild(card);
  });
}

function export3DHTML(){
  const htmlContent = `<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8"/>
<title>ErikAI CATIA 3D Model</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"><\/script>
<script src="https://cdn.jsdelivr.net/npm/three-csg-ts@3.1.16/lib/bundle.js"><\/script>
<style>
  body { margin: 0; overflow: hidden; background: #0b0d13; font-family: sans-serif; color: white; }
  #info { position: absolute; top: 10px; left: 10px; padding: 8px 12px; background: rgba(30,34,45,0.8); border-radius: 6px; }
</style>
</head>
<body>
<div id="info"><h3>ErikAI CATIA 3D Model</h3><p>Interaktívny 3D model (Plný export s vyrezaním CSG)</p></div>
<script>
  THREE.Object3D.DefaultUp.set(0, 0, 1);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0d13);
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(180, -220, 160);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(150, 200, 250);
  scene.add(dirLight);
  const grid = new THREE.GridHelper(400, 40, 0x10b981, 0x2e364f);
  grid.rotateX(Math.PI / 2);
  scene.add(grid);

  ${buildCustom2DShape.toString()}
  ${createGeometryForShape.toString()}

  const shapesData = ${JSON.stringify(shapes)};
  let baseMesh = null;
  let subtractiveMeshes = [];

  shapesData.forEach((s, idx) => {
    const geo = createGeometryForShape(s);
    const mat = new THREE.MeshStandardMaterial({ 
      color: s.color || (s.op === 'subtract' ? '#ef4444' : '#10b981'), 
      roughness: 0.3, metalness: 0.2 
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set((s.x||0)/10, (s.y||0)/10, Math.max(0, (s.z||0))/10);
    mesh.rotation.set(
      THREE.MathUtils.degToRad(s.rx || 0),
      THREE.MathUtils.degToRad(s.ry || 0),
      THREE.MathUtils.degToRad(s.rz || 0)
    );
    mesh.updateMatrix();

    if(s.op === 'subtract') {
      subtractiveMeshes.push(mesh);
    } else {
      if(!baseMesh){
        baseMesh = mesh;
        scene.add(baseMesh);
      } else {
        scene.add(mesh);
      }
    }
  });

  if(baseMesh && subtractiveMeshes.length > 0 && typeof CSG !== 'undefined'){
    try {
      let csgBase = CSG.fromMesh(baseMesh);
      subtractiveMeshes.forEach(sub => {
        const csgSub = CSG.fromMesh(sub);
        csgBase = csgBase.subtract(csgSub);
      });
      scene.remove(baseMesh);
      const resultingMesh = CSG.toMesh(csgBase, baseMesh.matrix);
      resultingMesh.material = baseMesh.material;
      scene.add(resultingMesh);
    } catch(err){}
  }

  function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
  animate();
  window.onresize = () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
<\/script>
</body>
</html>`;

  const blob = new Blob([htmlContent], { type: 'text/html' });
  const link = document.createElement('a');
  link.download = `ErikAI_CATIA_3D_model.html`;
  link.href = URL.createObjectURL(blob);
  link.click();
}
