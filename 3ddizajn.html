<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>ErikAI Pro 3D CATIA Studio v8.0</title>
<!-- Three.js, OrbitControls a Three-CSG -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three-csg-ts@3.1.16/lib/bundle.js"></script>

<style>
:root{
  --bg-color: #0b0d13;
  --panel-bg: #1e222d;
  --border-color: #2e364f;
  --accent-green: #10b981;
  --accent-blue: #3b82f6;
  --accent-red: #ef4444;
  --accent-amber: #f59e0b;
  --accent-purple: #8b5cf6;
  --text-main: #ffffff;
  --text-muted: #94a3b8;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg-color);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  touch-action: none;
}
header{
  padding: 8px 12px;
  background: var(--panel-bg);
  border-bottom: 2px solid var(--border-color);
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  justify-content: space-between;
  z-index: 10;
}
.panel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

#workspaceContainer {
  flex: 1;
  overflow: hidden;
  position: relative;
  background: #0b0d13;
}

#model3DContainer {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
}

button, select.format-select{
  padding:7px 12px;
  border:none;
  border-radius:6px;
  background: var(--accent-green);
  color:#000;
  font-weight: bold;
  cursor:pointer;
  font-size: 0.85rem;
  transition: all 0.2s;
  box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
button:hover, select.format-select:hover{filter: brightness(1.1); transform: translateY(-1px);}
button.ghost{background: var(--panel-bg);border:1px solid var(--border-color);color:var(--text-main);}
button.danger{background: var(--accent-red); color:white;}

select.format-select {
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  outline: none;
}

.info{padding:5px 12px;background: var(--panel-bg);font-size:0.8rem;color:var(--text-muted);border-top:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;}

#dimensionsPanel{
  position:fixed;
  top:60px;
  right:15px;
  background:var(--panel-bg);
  border:1px solid var(--border-color);
  padding:12px;
  border-radius:10px;
  max-height:80vh;
  overflow-y: auto;
  overflow-x: hidden;
  display:block;
  box-shadow: 0 15px 40px rgba(0,0,0,0.8);
  width: 360px;
  max-width: 95vw;
  z-index: 1000;
}
.panel-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  cursor: grab;
  user-select: none;
  background: rgba(255,255,255,0.04);
  padding: 6px 10px;
  border-radius: 6px;
}
.panel-header h3{margin:0;color:var(--accent-green);font-size:0.9rem;}
.close-btn{
  background: transparent; border: none; color: var(--text-muted); font-size: 1.1rem; font-weight: bold; cursor: pointer; padding: 0 4px; box-shadow: none;
}

.shape-card{
  background: #121216;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.shape-card.active{
  border-color: var(--accent-blue);
  background: #1a233a;
}
.shape-title-row{
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.input-group-title{ font-size: 0.72rem; color: var(--accent-blue); font-weight: bold; margin-top: 4px; }
.input-row{ display: flex; gap: 6px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
.input-row label{ font-size: 0.73rem; color: var(--text-muted); white-space: nowrap; width: 55px; }
.input-row input, .input-row select{
  width: 65px;
  padding: 4px;
  border-radius: 4px;
  border: 1px solid var(--border-color);
  background: #090b10;
  color: white;
  font-size: 0.82rem;
}
</style>
</head>
<body>

<header>
  <div class="panel">
    <select id="shapeSelector" class="format-select">
      <option value="box">🧊 Kocka / Kváder</option>
      <option value="cylinder">🧪 Valec</option>
      <option value="pipe">⭕ Rúra s otvorom</option>
      <option value="sphere">🔮 Guľa</option>
      <option value="pyramid">📐 Ihlan</option>
    </select>

    <select id="csgOperationSelector" class="format-select" style="border-color: var(--accent-blue);">
      <option value="add">➕ Pridať teleso</option>
      <option value="subtract">➖ Odobrať materiál</option>
    </select>

    <button onclick="addNewShape()" style="background:var(--accent-green);">➕ Vytvoriť Tvar</button>
  </div>

  <div class="panel">
    <button class="ghost" onclick="export3DHTML()" style="background:#d97706; color:white;">💾 Stiahnuť 3D HTML</button>
    <button class="ghost" onclick="clearAll()" style="background:#dc2626; color:white;">🗑️ Zmazať všetko</button>
  </div>
</header>

<div id="workspaceContainer">
  <div id="model3DContainer"></div>
</div>

<div class="info" id="info">
  <span id="infoCoords">3D CATIA Z-Up Studio | Z >= 0 (Zem) | Otáčanie: Ľavé tlačidlo myši | Posun: Pravé tlačidlo</span>
  <span id="infoCount">Počet dielov: 0</span>
</div>

<!-- Panel Správcu 3D Dielov -->
<div id="dimensionsPanel">
  <div class="panel-header">
    <h3>CATIA Modelár Dielov & Rotácií</h3>
    <button class="close-btn" onclick="togglePanel()">✕</button>
  </div>
  <div id="dimsContent">Zatiaľ žiadne telesá v scéne. Vytvorte nové teleso.</div>
</div>

<script>
THREE.Object3D.DefaultUp.set(0, 0, 1);

let shapes = [
  { type: 'box', op: 'add', x: 0, y: 0, z: 0, w: 120, h: 120, d: 40, r: 50, wall: 10, rx: 0, ry: 0, rz: 0 },
  { type: 'cylinder', op: 'subtract', x: 0, y: 0, z: 0, w: 100, h: 100, d: 50, r: 30, wall: 10, rx: 0, ry: 0, rz: 0 }
];

let selectedShapeIndex = null;
let scene, camera, renderer, controls;

const container3D = document.getElementById('model3DContainer');
const infoCount = document.getElementById('infoCount');
const dimsContent = document.getElementById('dimsContent');
const dimsPanel = document.getElementById('dimensionsPanel');

function togglePanel(){
  const show = dimsPanel.style.display !== 'none';
  dimsPanel.style.display = show ? 'none' : 'block';
}

function addNewShape(){
  const type = document.getElementById('shapeSelector').value;
  const op = document.getElementById('csgOperationSelector').value;
  
  shapes.push({
    type: type, op: op,
    x: 0, y: 0, z: 0,
    w: 100, h: 100, d: 100, r: 40, wall: 10,
    rx: 0, ry: 0, rz: 0
  });

  selectedShapeIndex = shapes.length - 1;
  updateScene3D();
  updatePanel();
}

function clearAll(){
  shapes = [];
  selectedShapeIndex = null;
  updateScene3D();
  updatePanel();
}

// ----------------------------------------------------
// 🚀 3D SCÉNA & CATIA MODELÁR
// ----------------------------------------------------
function init3D(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0d13);

  camera = new THREE.PerspectiveCamera(45, container3D.clientWidth / container3D.clientHeight, 0.1, 1000);
  camera.position.set(180, -220, 160);
  camera.up.set(0, 0, 1);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container3D.clientWidth, container3D.clientHeight);
  container3D.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  let dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(150, 200, 250);
  scene.add(dirLight);

  let grid = new THREE.GridHelper(400, 40, 0x10b981, 0x2e364f);
  grid.rotateX(Math.PI / 2);
  scene.add(grid);

  updateScene3D();
  animate3D();
}

function createGeometryForShape(s){
  let geo;
  const scW = (s.w || 100) / 10;
  const scH = (s.h || 100) / 10;
  const scD = (s.d || 100) / 10;
  const scR = (s.r || 40) / 10;
  const scWall = (s.wall || 10) / 10;

  if(s.type === 'box') {
    geo = new THREE.BoxGeometry(scW, scH, scD);
    geo.translate(0, 0, scD / 2);
  } else if(s.type === 'cylinder') {
    geo = new THREE.CylinderGeometry(scR, scR, scD, 32);
    geo.translate(0, 0, scD / 2);
  } else if(s.type === 'sphere') {
    geo = new THREE.SphereGeometry(scR, 32, 32);
    geo.translate(0, 0, scR);
  } else if(s.type === 'pyramid') {
    geo = new THREE.ConeGeometry(scR, scD, 4);
    geo.translate(0, 0, scD / 2);
  } else if(s.type === 'pipe') {
    const shape = new THREE.Shape();
    shape.absarc(0, 0, scR, 0, Math.PI * 2, false);
    const innerR = Math.max(0.5, scR - scWall);
    const holePath = new THREE.Path();
    holePath.absarc(0, 0, innerR, 0, Math.PI * 2, true);
    shape.holes.push(holePath);
    geo = new THREE.ExtrudeGeometry(shape, { depth: scD, bevelEnabled: false, curveSegments: 32 });
    geo.center(); geo.translate(0, 0, scD / 2);
  } else {
    geo = new THREE.BoxGeometry(10, 10, 10);
    geo.translate(0, 0, 5);
  }
  return geo;
}

function updateScene3D(){
  // Vyčistenie objektov okrem svetiel a gridu
  const removeObjects = [];
  scene.traverse(child => { if(child.isMesh) removeObjects.push(child); });
  removeObjects.forEach(m => scene.remove(m));

  let baseMesh = null;
  let subtractiveShapes = [];

  shapes.forEach((s, idx) => {
    const geo = createGeometryForShape(s);
    const mat = new THREE.MeshStandardMaterial({ 
      color: s.op === 'subtract' ? '#ef4444' : (idx === selectedShapeIndex ? '#3b82f6' : '#10b981'), 
      roughness: 0.3, metalness: 0.1, transparent: true, opacity: s.op === 'subtract' ? 0.6 : 1.0 
    });
    const mesh = new THREE.Mesh(geo, mat);
    
    let worldX = (s.x || 0) / 10;
    let worldY = (s.y || 0) / 10;
    let worldZ = Math.max(0, (s.z || 0)) / 10;

    mesh.position.set(worldX, worldY, worldZ);
    mesh.rotation.set(
      THREE.MathUtils.degToRad(s.rx || 0),
      THREE.MathUtils.degToRad(s.ry || 0),
      THREE.MathUtils.degToRad(s.rz || 0)
    );
    mesh.updateMatrix();

    if(s.op === 'subtract') {
      subtractiveShapes.push({ mesh, index: idx });
    } else {
      if(!baseMesh){
        baseMesh = mesh;
        scene.add(baseMesh);
      } else {
        scene.add(mesh);
      }
    }
  });

  if(baseMesh && subtractiveShapes.length > 0 && typeof CSG !== 'undefined'){
    try {
      let csgBase = CSG.fromMesh(baseMesh);
      subtractiveShapes.forEach(sub => {
        const csgSub = CSG.fromMesh(sub.mesh);
        csgBase = csgBase.subtract(csgSub);
      });
      scene.remove(baseMesh);
      const resultingMesh = CSG.toMesh(csgBase, baseMesh.matrix);
      resultingMesh.material = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.2, metalness: 0.3 });
      scene.add(resultingMesh);
    } catch(err){}
  }

  infoCount.textContent = `Počet dielov: ${shapes.length}`;
}

function animate3D(){
  requestAnimationFrame(animate3D);
  controls.update();
  renderer.render(scene, camera);
}

function updatePanel(){
  dimsContent.innerHTML = '';
  if(shapes.length === 0){
    dimsContent.innerHTML = 'Žiadne telesá v scéne.';
    return;
  }
  shapes.forEach((s, i) => {
    let card = document.createElement('div');
    card.className = `shape-card ${i === selectedShapeIndex ? 'active' : ''}`;
    card.onclick = () => { selectedShapeIndex = i; updateScene3D(); updatePanel(); };
    
    card.innerHTML = `
      <div class="shape-title-row">
        <strong>#${i+1} ${s.type.toUpperCase()} (${s.op})</strong>
        <button class="danger" style="padding:2px 6px;" onclick="event.stopPropagation(); shapes.splice(${i},1); updateScene3D(); updatePanel();">🗑️ Zmazať</button>
      </div>
      <div class="input-group-title">Súradnice [Z >= 0] (mm):</div>
      <div class="input-row">
        <label>X:</label><input type="number" value="${s.x||0}" onchange="shapes[${i}].x=parseFloat(this.value); updateScene3D();">
        <label>Y:</label><input type="number" value="${s.y||0}" onchange="shapes[${i}].y=parseFloat(this.value); updateScene3D();">
        <label>Z:</label><input type="number" min="0" value="${Math.max(0, s.z||0)}" onchange="shapes[${i}].z=Math.max(0, parseFloat(this.value)); updateScene3D();">
      </div>
      <div class="input-group-title">Rotácie (stupne):</div>
      <div class="input-row">
        <label>Rot X:</label><input type="number" value="${s.rx||0}" onchange="shapes[${i}].rx=parseFloat(this.value); updateScene3D();">
        <label>Rot Y:</label><input type="number" value="${s.ry||0}" onchange="shapes[${i}].ry=parseFloat(this.value); updateScene3D();">
        <label>Rot Z:</label><input type="number" value="${s.rz||0}" onchange="shapes[${i}].rz=parseFloat(this.value); updateScene3D();">
      </div>
      <div class="input-group-title">Rozmery (mm):</div>
      <div class="input-row">
        <label>Šírka:</label><input type="number" value="${s.w||100}" onchange="shapes[${i}].w=parseFloat(this.value); updateScene3D();">
        <label>Hĺbka:</label><input type="number" value="${s.h||100}" onchange="shapes[${i}].h=parseFloat(this.value); updateScene3D();">
        <label>Výška:</label><input type="number" value="${s.d||100}" onchange="shapes[${i}].d=parseFloat(this.value); updateScene3D();">
        <label>Polomer:</label><input type="number" value="${s.r||40}" onchange="shapes[${i}].r=parseFloat(this.value); updateScene3D();">
      </div>
    `;
    dimsContent.appendChild(card);
  });
}

function export3DHTML(){
  const htmlContent = `<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8"/>
<title>ErikAI CATIA 3D Model</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"><\/script>
<style>
  body { margin: 0; overflow: hidden; background: #0b0d13; font-family: sans-serif; color: white; }
  #info { position: absolute; top: 10px; left: 10px; padding: 8px 12px; background: rgba(30,34,45,0.8); border-radius: 6px; }
</style>
</head>
<body>
<div id="info"><h3>ErikAI CATIA 3D Model</h3><p>Interaktívny 3D model (Z-Up)</p></div>
<script>
  THREE.Object3D.DefaultUp.set(0, 0, 1);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0d13);
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(180, -220, 160);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(150, 200, 250);
  scene.add(dirLight);
  const grid = new THREE.GridHelper(400, 40, 0x10b981, 0x2e364f);
  grid.rotateX(Math.PI / 2);
  scene.add(grid);

  const shapesData = ${JSON.stringify(shapes)};
  shapesData.forEach(s => {
    let geo;
    const scW = s.w / 10, scH = s.h / 10, scD = s.d / 10, scR = s.r / 10;
    if(s.type === 'box') { geo = new THREE.BoxGeometry(scW, scH, scD); geo.translate(0, 0, scD / 2); }
    else if(s.type === 'cylinder') { geo = new THREE.CylinderGeometry(scR, scR, scD, 32); geo.translate(0, 0, scD / 2); }
    else if(s.type === 'sphere') { geo = new THREE.SphereGeometry(scR, 32, 32); geo.translate(0, 0, scR); }
    else if(s.type === 'pyramid') { geo = new THREE.ConeGeometry(scR, scD, 4); geo.translate(0, 0, scD / 2); }
    else if(s.type === 'pipe') {
      const shape = new THREE.Shape(); shape.absarc(0, 0, scR, 0, Math.PI * 2, false);
      const innerR = Math.max(0.5, scR - (s.wall/10));
      const holePath = new THREE.Path(); holePath.absarc(0, 0, innerR, 0, Math.PI * 2, true);
      shape.holes.push(holePath);
      geo = new THREE.ExtrudeGeometry(shape, { depth: scD, bevelEnabled: false, curveSegments: 32 });
      geo.center(); geo.translate(0, 0, scD / 2);
    }
    const mat = new THREE.MeshStandardMaterial({ color: s.op === 'subtract' ? 0xef4444 : 0x3b82f6, roughness: 0.2, metalness: 0.3 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set((s.x||0)/10, (s.y||0)/10, Math.max(0, (s.z||0))/10);
    mesh.rotation.set(
      THREE.MathUtils.degToRad(s.rx || 0),
      THREE.MathUtils.degToRad(s.ry || 0),
      THREE.MathUtils.degToRad(s.rz || 0)
    );
    scene.add(mesh);
  });

  function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
  animate();
  window.onresize = () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
<\/script>
</body>
</html>`;

  const blob = new Blob([htmlContent], { type: 'text/html' });
  const link = document.createElement('a');
  link.download = `ErikAI_CATIA_3D_model.html`;
  link.href = URL.createObjectURL(blob);
  link.click();
}

// Spustenie 3D prostredia
init3D();
updatePanel();
</script>
</body>
</html>
