<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI TV Režim</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    margin: 0; padding: 0;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
  }
  h1 { margin: 20px; color: #1a73e8; }
  input {
    width: 80%;
    padding: 10px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    margin-bottom: 10px;
  }
  button {
    padding: 10px 20px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background-color: #1a73e8;
    color: white;
    cursor: pointer;
    margin-bottom: 20px;
  }
  button:hover { background-color: #1558a5; }
  #videoContainer {
    flex: 1;
    width: 90%;
    max-width: 1200px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  iframe {
    width: 100%;
    height: 80%;
    border: none;
    border-radius: 12px;
  }
  .external {
    font-size: 20px;
    color: #1a73e8;
    text-decoration: underline;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>📺 ErikAI TV Režim</h1>
<input type="text" id="linkInput" placeholder="Vlož odkaz na YouTube, Vimeo alebo Instagram/TikTok">
<button onclick="prehrat()">▶️ Prehrať</button>

<div id="videoContainer">
  <p>Sem sa zobrazí video alebo odkaz...</p>
</div>

<script>
function prehrat() {
  const link = document.getElementById('linkInput').value.trim();
  const container = document.getElementById('videoContainer');
  container.innerHTML = '';

  if (!link) {
    container.innerHTML = '<p>Zadaj prosím odkaz!</p>';
    return;
  }

  // YouTube
  if (link.includes('youtube.com') || link.includes('youtu.be')) {
    let videoID = '';
    if (link.includes('youtu.be/')) {
      videoID = link.split('youtu.be/')[1].split(/[?&]/)[0];
    } else {
      const urlParams = new URLSearchParams(new URL(link).search);
      videoID = urlParams.get('v');
    }
    container.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoID}" allowfullscreen></iframe>`;
    return;
  }

  // Vimeo
  if (link.includes('vimeo.com')) {
    const videoID = link.split('vimeo.com/')[1].split(/[?&]/)[0];
    container.innerHTML = `<iframe src="https://player.vimeo.com/video/${videoID}" allowfullscreen></iframe>`;
    return;
  }

  // Instagram / TikTok / ostatné (iframe nepodporuje)
  container.innerHTML = `<p>Pre túto platformu klikni sem pre otvorenie:</p>
  <a class="external" href="${link}" target="_blank">Otvoriť obsah</a>`;
}
</script>

</body>
</html>
