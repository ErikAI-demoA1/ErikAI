<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI TV Režim</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #000;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    height: 100vh;
  }
  h1 {
    margin: 10px;
    color: #1a73e8;
  }
  iframe {
    border: none;
    width: 90%;
    max-width: 1280px;
    height: 70vh;
    margin-top: 20px;
    border-radius: 10px;
  }
  .controls {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 90%;
    max-width: 400px;
  }
  input, button {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border-radius: 5px;
    border: none;
    font-size: 1rem;
  }
  input {
    font-size: 1rem;
  }
  button {
    background-color: #1a73e8;
    color: white;
    cursor: pointer;
  }
  button:hover {
    background-color: #1558a5;
  }
</style>
</head>
<body>

<h1>📺 ErikAI TV Režim</h1>

<iframe id="tvScreen" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>

<div class="controls">
  <input type="text" id="videoURL" placeholder="Vlož URL videa (YouTube, Vimeo...)">
  <button onclick="playVideo()">▶️ Prehrať video</button>
</div>

<script>
function playVideo() {
  const url = document.getElementById('videoURL').value.trim();
  if (!url) return alert("Zadaj URL videa!");
  
  let embedURL = url;

  // Automatická konverzia YouTube URL na embed
  if (url.includes("youtube.com/watch?v=")) {
    const videoId = url.split("v=")[1].split("&")[0];
    embedURL = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
  }
  // Automatická konverzia youtu.be URL
  else if (url.includes("youtu.be/")) {
    const videoId = url.split("youtu.be/")[1].split("?")[0];
    embedURL = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
  }

  // Vimeo embed
  else if (url.includes("vimeo.com/")) {
    const videoId = url.split("vimeo.com/")[1].split("?")[0];
    embedURL = `https://player.vimeo.com/video/${videoId}?autoplay=1`;
  }

  document.getElementById('tvScreen').src = embedURL;
}
</script>

</body>
</html>
