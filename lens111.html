<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ErikAI Vision 4.0</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090b10;color:#fff;font-family:Arial,sans-serif;
}
.app{
 max-width:700px;margin:auto;padding:18px;
}
h1{margin:0 0 5px;font-size:28px}
.sub{color:#9aa0aa;margin-bottom:18px}
.card{
 background:#11151d;border:1px solid #252b36;border-radius:18px;
 padding:15px;margin-bottom:14px;
}
button{
 border:0;border-radius:13px;padding:13px 16px;
 background:#fff;color:#111;font-weight:bold;font-size:15px;
 cursor:pointer;margin:4px;
}
button.secondary{background:#242a34;color:#fff}
input{display:none}
.upload{
 display:block;text-align:center;background:#fff;color:#111;
 padding:14px;border-radius:13px;font-weight:bold;cursor:pointer;
}
#preview{
 width:100%;max-height:430px;object-fit:contain;
 border-radius:14px;background:#050609;display:none;
}
#canvas{
 width:100%;border-radius:14px;display:none;
}
.status{
 padding:12px;border-radius:12px;background:#181d26;
 color:#cfd3da;font-size:14px;
}
.result{
 margin-top:12px;padding:14px;border-radius:14px;
 background:#191e27;
}
.mainResult{
 font-size:24px;font-weight:bold;margin-bottom:5px;
}
.score{color:#8ee28e;font-weight:bold}
.warning{color:#ffcc66}
.error{color:#ff7777}
.item{
 display:flex;justify-content:space-between;
 padding:9px 0;border-bottom:1px solid #292f39;
}
.item:last-child{border-bottom:0}
.small{font-size:12px;color:#8f96a3}
#objects{margin-top:8px}
</style>
</head>

<body>

<div class="app">

<h1>🤖 ErikAI Vision 4.0</h1>
<div class="sub">Real Object Detection • YOLOS • WebGPU/WASM</div>

<div class="card">

<label class="upload" for="file">
 📷 Vybrať obrázok
</label>

<input id="file" type="file" accept="image/*">

<div style="text-align:center;margin:10px 0">
<button id="cameraBtn">📸 Kamera</button>
<button id="analyseBtn" class="secondary" disabled>🔎 Analyzovať</button>
</div>

<video id="video" autoplay playsinline
 style="width:100%;border-radius:14px;display:none"></video>

<button id="takeBtn" style="display:none;width:100%">
📷 Odfotiť
</button>

<img id="preview">

<canvas id="canvas"></canvas>

</div>

<div class="card">
<div id="status" class="status">
⏳ Model ešte nie je načítaný.
</div>
</div>

<div id="result"></div>

</div>

<script type="module">

import { pipeline, env } from
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

env.useBrowserCache = true;

let detector = null;
let currentImage = null;
let stream = null;

const fileInput = document.getElementById("file");
const preview = document.getElementById("preview");
const canvas = document.getElementById("canvas");
const video = document.getElementById("video");
const cameraBtn = document.getElementById("cameraBtn");
const takeBtn = document.getElementById("takeBtn");
const analyseBtn = document.getElementById("analyseBtn");
const statusBox = document.getElementById("status");
const resultBox = document.getElementById("result");

const SK = {
 person:"človek",
 bicycle:"bicykel",
 car:"auto",
 motorcycle:"motocykel",
 airplane:"lietadlo",
 bus:"autobus",
 train:"vlak",
 truck:"nákladné auto",
 boat:"loď",

 traffic_light:"semafor",
 fire_hydrant:"hydrant",
 stop_sign:"stopka",
 parking_meter:"parkovací automat",
 bench:"lavička",
 bird:"vták",
 cat:"mačka",
 dog:"pes",
 horse:"kôň",
 sheep:"ovca",
 cow:"krava",
 elephant:"slon",
 bear:"medveď",
 zebra:"zebra",
 giraffe:"žirafa",

 backpack:"batoh",
 umbrella:"dáždnik",
 handbag:"kabelka",
 tie:"kravata",
 suitcase:"kufor",

 frisbee:"frisbee",
 skis:"lyže",
 snowboard:"snowboard",
 sports_ball:"športová lopta",
 kite:"šarkan",
 baseball_bat:"basebalová pálka",
 baseball_glove:"basebalová rukavica",
 skateboard:"skateboard",
 surfboard:"surf",
 tennis_racket:"tenisová raketa",

 bottle:"fľaša",
 wine_glass:"pohár",
 cup:"šálka",
 fork:"vidlička",
 knife:"nôž",
 spoon:"lyžica",
 bowl:"miska",

 banana:"banán",
 apple:"jablko",
 sandwich:"sendvič",
 orange:"pomaranč",
 broccoli:"brokolica",
 carrot:"mrkva",
 hot_dog:"hotdog",
 pizza:"pizza",
 donut:"šiška",
 cake:"koláč",

 chair:"stolička",
 couch:"gauč",
 potted_plant:"rastlina",
 bed:"posteľ",
 dining_table:"jedálenský stôl",
 toilet:"toaleta",
 tv:"televízor",
 laptop:"notebook",
 mouse:"počítačová myš",
 remote:"diaľkový ovládač",
 keyboard:"klávesnica",
 cell_phone:"mobil",
 microwave:"mikrovlnka",
 oven:"rúra",
 toaster:"toastovač",
 sink:"umývadlo",
 refrigerator:"chladnička",

 book:"kniha",
 clock:"hodiny",
 vase:"váza",
 scissors:"nožnice",
 teddy_bear:"plyšový medveď",
 hair_drier:"fén",
 toothbrush:"zubná kefka"
};


/*
====================================================
 MODEL
====================================================
*/

async function loadModel(){

 statusBox.innerHTML =
 "🧠 Načítavam ErikAI Vision model...<br>" +
 "<span class='small'>Prvé načítanie môže trvať dlhšie.</span>";

 try{

   detector = await pipeline(
     "object-detection",
     "Xenova/yolos-tiny",
     {device:"webgpu"}
   );

   statusBox.innerHTML =
   "🟢 ErikAI Vision je pripravený.<br>" +
   "<span class='small'>Používa sa WebGPU.</span>";

 }catch(e){

   console.warn("WebGPU nedostupné:",e);

   try{

     detector = await pipeline(
       "object-detection",
       "Xenova/yolos-tiny"
     );

     statusBox.innerHTML =
     "🟢 ErikAI Vision je pripravený.<br>" +
     "<span class='small'>WebGPU nebolo dostupné → použitý WASM.</span>";

   }catch(err){

     console.error(err);

     statusBox.innerHTML =
     "<span class='error'>❌ Model sa nepodarilo načítať.</span>";
   }
 }
}

loadModel();


/*
====================================================
 IMAGE INPUT
====================================================
*/

fileInput.addEventListener("change",e=>{

 const file=e.target.files[0];

 if(!file)return;

 const reader=new FileReader();

 reader.onload=()=>{

   preview.src=reader.result;
   preview.style.display="block";
   canvas.style.display="none";

   currentImage=preview;
   analyseBtn.disabled=false;

   resultBox.innerHTML="";
 };

 reader.readAsDataURL(file);

});


/*
====================================================
 CAMERA
====================================================
*/

cameraBtn.onclick=async()=>{

 try{

   stream=await navigator.mediaDevices.getUserMedia({
     video:{
       facingMode:"environment",
       width:{ideal:1280},
       height:{ideal:720}
     },
     audio:false
   });

   video.srcObject=stream;
   video.style.display="block";
   takeBtn.style.display="block";
   preview.style.display="none";

 }catch(e){

   alert("Kamera nie je dostupná alebo jej nebolo povolené použitie.");
 }
};


takeBtn.onclick=()=>{

 if(!stream)return;

 canvas.width=video.videoWidth;
 canvas.height=video.videoHeight;

 const ctx=canvas.getContext("2d");

 ctx.drawImage(
   video,
   0,0,
   canvas.width,
   canvas.height
 );

 canvas.style.display="block";
 video.style.display="none";
 takeBtn.style.display="none";

 currentImage=canvas;
 analyseBtn.disabled=false;

 stream.getTracks().forEach(t=>t.stop());
 stream=null;

 resultBox.innerHTML="";
};


/*
====================================================
 ANALÝZA
====================================================
*/

analyseBtn.onclick=async()=>{

 if(!detector || !currentImage)return;

 analyseBtn.disabled=true;

 statusBox.innerHTML="🔎 ErikAI analyzuje obrázok...";

 resultBox.innerHTML="";

 try{

   /*
   Vyšší threshold = menej falošných detekcií.
   Začíname na 0.45 a potom ešte výsledky
   filtrujeme vlastným systémom.
   */

   const output=await detector(
     currentImage,
     {
       threshold:0.45
     }
   );

   processResults(output);

 }catch(e){

   console.error(e);

   resultBox.innerHTML=
   "<div class='result error'>❌ Analýza zlyhala.</div>";

   statusBox.innerHTML="⚠️ Chyba pri analýze.";

 }

 analyseBtn.disabled=false;
};


/*
====================================================
 RESULT ENGINE
====================================================
*/

function processResults(output){

 if(!output || !output.length){

   resultBox.innerHTML=`
   <div class="result">
      <div class="mainResult">🤔 Neviem</div>
      <div class="warning">
      ErikAI nenašiel objekt s dostatočnou istotou.
      </div>
   </div>`;

   statusBox.innerHTML=
   "🟡 Objekt nebol dostatočne spoľahlivo rozpoznaný.";

   return;
 }


 /*
 Odstránime extrémne slabé výsledky.
 */

 let objects=output
   .filter(x=>x.score>=0.45)
   .sort((a,b)=>b.score-a.score);


 /*
 Odstránenie takmer rovnakých detekcií.
 */

 objects=removeDuplicates(objects);


 if(!objects.length){

   resultBox.innerHTML=`
   <div class="result">
      <div class="mainResult">🤔 Neviem</div>
      <div class="warning">
      Výsledok nie je dostatočne spoľahlivý.
      </div>
   </div>`;

   return;
 }


 const main=objects[0];

 const confidence=main.score;

 /*
 Dynamický systém dôvery:
 
 > 0.85 = veľmi silný výsledok
 > 0.70 = dobrý výsledok
 > 0.55 = neistý
 < 0.55 = neviem
 */

 let state="";

 if(confidence>=0.85){
   state="🟢 Veľmi vysoká istota";
 }
 else if(confidence>=0.70){
   state="🟢 Vysoká istota";
 }
 else if(confidence>=0.55){
   state="🟡 Stredná istota";
 }
 else{
   state="🔴 Nízka istota";
 }


 /*
 Ak je výsledok príliš slabý,
 radšej nepovieme nezmysel.
 */

 if(confidence<0.55){

   resultBox.innerHTML=`
   <div class="result">
      <div class="mainResult">🤔 Neviem</div>
      <div class="warning">
      Najlepší výsledok bol iba
      ${(confidence*100).toFixed(1)} %.
      </div>
   </div>`;

   return;
 }


 const label=SK[main.label] || main.label;

 const score=(confidence*100).toFixed(1);


 let html=`

 <div class="result">

   <div class="mainResult">
     ${label}
   </div>

   <div class="score">
     ${score} % • ${state}
   </div>

   <div class="small" style="margin-top:6px">
     Model: YOLOS-Tiny • ${main.label}
   </div>

 </div>

 `;


 /*
 Všetky ďalšie objekty
 */

 if(objects.length>1){

   html+=`
   <div class="result">
   <b>🔎 Ďalšie nájdené objekty</b>
   <div id="objects">
   `;

   objects.slice(1,10).forEach(o=>{

     const name=SK[o.label] || o.label;

     html+=`
     <div class="item">
       <span>${name}</span>
       <span>${(o.score*100).toFixed(1)} %</span>
     </div>
     `;
   });

   html+=`
   </div>
   </div>
   `;
 }


 /*
 Diagnostika
 */

 html+=`

 <div class="result">

   <b>🧠 ErikAI diagnostika</b>

   <div class="small" style="margin-top:8px">
     Detekovaných objektov:
     ${objects.length}
   </div>

   <div class="small">
     Najlepší výsledok:
     ${(confidence*100).toFixed(1)} %
   </div>

   <div class="small">
     Prah detekcie:
     45 %
   </div>

 </div>

 `;


 resultBox.innerHTML=html;

 statusBox.innerHTML=
 "🟢 Analýza dokončená.";

 /*
 Nakreslíme bounding boxy.
 */

 drawBoxes(objects);

}


/*
====================================================
 DUPLICATE FILTER
====================================================
*/

function removeDuplicates(arr){

 const result=[];

 for(const item of arr){

   let duplicate=false;

   for(const old of result){

     if(item.label!==old.label)continue;

     const a=item.box;
     const b=old.box;

     const ix=Math.max(
       0,
       Math.min(a.xmax,b.xmax) -
       Math.max(a.xmin,b.xmin)
     );

     const iy=Math.max(
       0,
       Math.min(a.ymax,b.ymax) -
       Math.max(a.ymin,b.ymin)
     );

     const inter=ix*iy;

     const areaA=
       (a.xmax-a.xmin)*
       (a.ymax-a.ymin);

     const areaB=
       (b.xmax-b.xmin)*
       (b.ymax-b.ymin);

     const union=areaA+areaB-inter;

     const iou=union>0 ? inter/union : 0;

     if(iou>0.65){

       duplicate=true;
       break;
     }
   }

   if(!duplicate)result.push(item);
 }

 return result;
}


/*
====================================================
 BOUNDING BOXES
====================================================
*/

function drawBoxes(objects){

 const source=currentImage;

 const w=source.videoWidth ||
         source.naturalWidth ||
         source.width;

 const h=source.videoHeight ||
         source.naturalHeight ||
         source.height;

 if(!w || !h)return;

 const overlay=document.createElement("canvas");

 overlay.width=w;
 overlay.height=h;

 overlay.style.width="100%";
 overlay.style.display="block";
 overlay.style.borderRadius="14px";

 const ctx=overlay.getContext("2d");

 ctx.drawImage(source,0,0,w,h);

 objects.slice(0,10).forEach((o,i)=>{

   const b=o.box;

   const x=b.xmin;
   const y=b.ymin;
   const bw=b.xmax-b.xmin;
   const bh=b.ymax-b.ymin;

   ctx.lineWidth=Math.max(3,w/300);
   ctx.strokeStyle="#00ff88";
   ctx.strokeRect(x,y,bw,bh);

   const name=SK[o.label] || o.label;
   const txt=
     name+" "+
     (o.score*100).toFixed(0)+"%";

   const fs=Math.max(16,w/45);

   ctx.font=`bold ${fs}px Arial`;

   const pad=8;
   const tw=ctx.measureText(txt).width;

   ctx.fillStyle="rgba(0,0,0,.75)";
   ctx.fillRect(
     x,
     Math.max(0,y-fs-pad*2),
     tw+pad*2,
     fs+pad*2
   );

   ctx.fillStyle="#fff";

   ctx.fillText(
     txt,
     x+pad,
     Math.max(fs,y-pad)
   );

 });

 /*
 Ak existuje starý overlay, odstránime ho.
 */

 const old=document.getElementById("overlay");

 if(old)old.remove();

 overlay.id="overlay";

 preview.style.display="none";
 canvas.style.display="none";

 document.querySelector(".card").appendChild(overlay);
}

</script>

</body>
</html>
