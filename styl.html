<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌌 Extrémny Dizajn</title>
<style>
  /* --- Základné nastavenie --- */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Poppins', sans-serif;
    overflow-x: hidden;
    perspective: 1200px;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #fff;
  }

  /* --- Extrémne pozadie s animovanými gradientmi --- */
  body::before {
    content:'';
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: linear-gradient(45deg, #ff4e50, #f9d423, #24fe41, #00c6ff);
    background-size: 600% 600%;
    animation: gradientBG 20s ease infinite;
    z-index: -1;
    filter: blur(60px);
  }

  @keyframes gradientBG {
    0% {background-position:0% 50%;}
    50% {background-position:100% 50%;}
    100% {background-position:0% 50%;}
  }

  /* --- Centrálny container --- */
  .hero {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    text-align: center;
    transform-style: preserve-3d;
    perspective: 1000px;
  }

  /* --- Extrémny text --- */
  h1 {
    font-size: 6vw;
    background: linear-gradient(90deg, #ff6a00, #ee0979, #00c6ff);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    text-transform: uppercase;
    letter-spacing: 8px;
    animation: floatText 4s ease-in-out infinite alternate;
    text-shadow: 0 0 20px rgba(255,255,255,0.4), 0 0 50px rgba(255,255,255,0.2);
  }

  @keyframes floatText {
    0% { transform: translateY(0px) rotateX(0deg);}
    50% { transform: translateY(-20px) rotateX(10deg);}
    100% { transform: translateY(0px) rotateX(0deg);}
  }

  /* --- Pulsujúci podtext --- */
  p {
    font-size: 2vw;
    margin-top: 20px;
    background: linear-gradient(120deg, #ffb347, #ffcc33, #00c6ff);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    animation: pulseText 2s ease-in-out infinite alternate;
    text-shadow: 0 0 15px rgba(255,255,255,0.3);
  }

  @keyframes pulseText {
    0% { transform: scale(1) rotateZ(0deg);}
    50% { transform: scale(1.1) rotateZ(3deg);}
    100% { transform: scale(1) rotateZ(0deg);}
  }

  /* --- Floating shapes --- */
  .shape {
    position: absolute;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(45deg, #ff6a00, #ee0979);
    animation: floatShapes 8s linear infinite;
    opacity: 0.7;
    mix-blend-mode: screen;
  }

  @keyframes floatShapes {
    0% { transform: translateY(100vh) rotate(0deg) scale(0.5);}
    100% { transform: translateY(-200px) rotate(720deg) scale(1.5);}
  }

  /* --- Responsívne --- */
  @media (max-width: 768px) {
    h1 { font-size: 12vw; letter-spacing: 4px; }
    p { font-size: 4vw; }
    .shape { width: 30px; height: 30px; }
  }

  @media (max-width: 480px) {
    h1 { font-size: 14vw; letter-spacing: 2px; }
    p { font-size: 5vw; }
    .shape { width: 20px; height: 20px; }
  }
</style>
</head>
<body>

<div class="hero">
  <h1>LEGENDÁRNY DIZAJN</h1>
  <p>Extrémne vizuálne efekty & 3D animácie</p>
</div>

<!-- Random shapes -->
<script>
for(let i=0;i<40;i++){
  const shape = document.createElement('div');
  shape.className = 'shape';
  shape.style.left = Math.random()*100 + 'vw';
  shape.style.width = shape.style.height = (Math.random()*50+10)+'px';
  shape.style.animationDuration = (Math.random()*10 + 5)+'s';
  shape.style.background = `linear-gradient(${Math.random()*360}deg, rgba(${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)},0.7), rgba(${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)},0.5))`;
  document.body.appendChild(shape);
}
</script>

</body>
</html>
