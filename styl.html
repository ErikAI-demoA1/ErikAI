<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI OS - Extrémny dizajn</title>
<style>
  /* --- Reset & Base --- */
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
  body { overflow:hidden; background:#0f0c29; color:#fff; perspective:1200px; }

  /* --- Animated Background --- */
  body::before {
    content:""; position:fixed; top:0; left:0; width:100%; height:100%;
    background: radial-gradient(circle at 30% 30%, #ff3cac, #784ba0, #2b86c5);
    background-size: 300% 300%; animation:bgMove 25s linear infinite;
    filter: blur(90px); z-index:-1;
  }
  @keyframes bgMove { 0%{background-position:0% 0%} 50%{background-position:100% 100%} 100%{background-position:0% 0%} }

  /* --- Central OS container --- */
  .os-container {
    position:relative; width:90vw; max-width:1400px; height:90vh;
    margin:auto; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  }

  /* --- OS Title --- */
  h1 {
    font-size:5vw; text-transform:uppercase;
    background: linear-gradient(120deg,#ff6a00,#ee0979,#00c6ff); -webkit-background-clip:text; color:transparent;
    letter-spacing:6px; text-shadow:0 0 20px rgba(255,255,255,0.3);
    animation: floatTitle 6s ease-in-out infinite alternate;
  }
  @keyframes floatTitle { 0%{transform:translateY(0) rotateX(0deg)} 50%{transform:translateY(-15px) rotateX(5deg)} 100%{transform:translateY(0) rotateX(0deg)} }

  /* --- SubText / OS version --- */
  p {
    font-size:1.5vw; margin:10px 0 40px 0;
    background: linear-gradient(120deg,#ffb347,#ffcc33,#00c6ff);
    -webkit-background-clip:text; color:transparent;
    text-shadow:0 0 15px rgba(255,255,255,0.3);
    animation: pulseText 3s ease-in-out infinite alternate;
  }
  @keyframes pulseText { 0%{transform:scale(1) rotateZ(0deg)} 50%{transform:scale(1.05) rotateZ(2deg)} 100%{transform:scale(1) rotateZ(0deg)} }

  /* --- OS Windows Panel --- */
  .window {
    background: rgba(20,20,35,0.7);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:12px;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 50px rgba(0,255,255,0.2);
    width:80%; max-width:900px; margin:20px 0; padding:20px;
    display:flex; flex-direction:column; align-items:center;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .window:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 0 80px rgba(0,255,255,0.5); }

  .window h2 {
    font-size:2vw; color:#00ffff; margin-bottom:10px;
    text-shadow:0 0 10px rgba(0,255,255,0.5);
  }

  .window p {
    font-size:1.2vw; color:#fff; opacity:0.8;
    text-align:center; line-height:1.5;
  }

  /* --- Animated shapes for OS --- */
  .shape {
    position:absolute; border-radius:50%; mix-blend-mode:screen;
    opacity:0.6; animation:floatShape 10s linear infinite;
  }
  @keyframes floatShape { 0%{transform:translateY(100vh) rotate(0deg) scale(0.5)} 100%{transform:translateY(-200px) rotate(720deg) scale(1.5)} }

  /* --- Cursor hover effect --- */
  body:hover { cursor:crosshair; }

  /* --- Responsívne --- */
  @media(max-width:768px){
    h1{font-size:8vw;} p{font-size:3vw;} .window h2{font-size:3vw;} .window p{font-size:2vw;}
  }
  @media(max-width:480px){
    h1{font-size:10vw;} p{font-size:4vw;} .window h2{font-size:4vw;} .window p{font-size:3vw;}
  }
</style>
</head>
<body>

<div class="os-container">
  <h1>ErikAI OS</h1>
  <p>Extrémny futuristický vizuál</p>

  <div class="window">
    <h2>Dashboard</h2>
    <p>Interaktívne panely, živé efekty a futuristické rozhranie.</p>
  </div>

  <div class="window">
    <h2>Analytics</h2>
    <p>Real-time vizualizácie a glowy efekty s parallax animáciami.</p>
  </div>

  <div class="window">
    <h2>Control Panel</h2>
    <p>Neónové tlačidlá a hover efekty s 3D pocitom.</p>
  </div>
</div>

<!-- Shapes -->
<script>
for(let i=0;i<60;i++){
  const shape = document.createElement('div');
  shape.className='shape';
  shape.style.left=Math.random()*100+'vw';
  shape.style.width=shape.style.height=(Math.random()*50+10)+'px';
  shape.style.animationDuration=(Math.random()*12+6)+'s';
  shape.style.background=`linear-gradient(${Math.random()*360}deg, rgba(${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)},0.7), rgba(${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)},0.3))`;
  document.body.appendChild(shape);
}
</script>

</body>
</html>
