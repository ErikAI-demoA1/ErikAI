<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ErikAI Studios — Krátky film</title>

<style>
:root{
  --bg:#05070b;
  --panel:rgba(10,14,21,.88);
  --text:#f5f7fb;
  --muted:#aab3c0;
  --accent:#5aa7ff;
  --gold:#f5c96a;
  --road:#30343a;
  --line:rgba(255,255,255,.12);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070b;
  color:var(--text);
  font-family:Inter,Segoe UI,Arial,sans-serif;
}

button{
  font:inherit;
}

#film{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#101722;
  isolation:isolate;
}

/* =========================================================
   FILMOVÉ PROSTREDIE
   ========================================================= */

.scene{
  position:absolute;
  inset:0;
  overflow:hidden;
  transition:background 1.4s ease;
}

.sky{
  position:absolute;
  inset:0 0 45% 0;
  background:linear-gradient(#71b9ee,#d9edff);
  transition:background 1.5s ease;
}

.ground{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:56%;
  background:#66705c;
}

.horizon{
  position:absolute;
  left:0;
  right:0;
  bottom:43%;
  height:2px;
  background:rgba(255,255,255,.12);
}

/* =========================================================
   BUDOVY
   ========================================================= */

.buildings{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.building{
  position:absolute;
  bottom:42%;
  background:linear-gradient(90deg,#29313d,#45505d);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 15px 35px rgba(0,0,0,.18);
}

.building:after{
  content:"";
  position:absolute;
  inset:10px;
  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,222,130,.65) 0 7px,
      transparent 7px 19px
    ),
    repeating-linear-gradient(
      180deg,
      rgba(255,222,130,.55) 0 8px,
      transparent 8px 20px
    );
  opacity:.55;
}

/* =========================================================
   CESTA
   ========================================================= */

.road{
  position:absolute;
  left:-10%;
  width:120%;
  bottom:0;
  height:48%;
  background:
    linear-gradient(
      90deg,
      transparent 0 12%,
      #272b31 12% 88%,
      transparent 88%
    );
  clip-path:polygon(17% 0,83% 0,100% 100%,0 100%);
}

.road:before,
.road:after{
  content:"";
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:7px;
  height:100%;
  background:
    repeating-linear-gradient(
      180deg,
      #f6e8a0 0 45px,
      transparent 45px 85px
    );
  opacity:.9;
}

.road-edge{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:48%;
  pointer-events:none;
  border-top:3px solid rgba(255,255,255,.25);
}

/* =========================================================
   CHODNÍK
   ========================================================= */

.sidewalk{
  position:absolute;
  bottom:0;
  height:27%;
  width:100%;
  background:
    repeating-linear-gradient(
      90deg,
      #777c80 0 80px,
      #686d71 80px 82px
    );
  clip-path:polygon(0 35%,100% 0,100% 100%,0 100%);
}

/* =========================================================
   STROMY
   ========================================================= */

.tree{
  position:absolute;
  bottom:30%;
  width:80px;
  height:170px;
}

.tree .trunk{
  position:absolute;
  bottom:0;
  left:35px;
  width:14px;
  height:80px;
  background:#5b402b;
  border-radius:5px;
}

.tree .crown{
  position:absolute;
  left:0;
  top:0;
  width:80px;
  height:90px;
  border-radius:50%;
  background:#315b3a;
  box-shadow:
    20px 20px 0 #396b42,
    -18px 28px 0 #294e32;
}

/* =========================================================
   SVETLÁ
   ========================================================= */

.street-light{
  position:absolute;
  bottom:26%;
  width:8px;
  height:170px;
  background:#22272d;
}

.street-light:before{
  content:"";
  position:absolute;
  width:45px;
  height:12px;
  top:0;
  left:-18px;
  border-radius:10px;
  background:#272c32;
}

.street-light:after{
  content:"";
  position:absolute;
  width:25px;
  height:25px;
  top:4px;
  left:-8px;
  border-radius:50%;
  background:#fff0a8;
  box-shadow:0 0 35px #fff0a8;
}

/* =========================================================
   AUTÁ
   ========================================================= */

.vehicles{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:20;
}

.car{
  position:absolute;
  width:82px;
  height:35px;
  border-radius:9px 12px 7px 7px;
  background:var(--car,#d44747);
  box-shadow:0 8px 15px rgba(0,0,0,.3);
  transform-origin:center;
}

.car:before{
  content:"";
  position:absolute;
  left:18px;
  top:-14px;
  width:43px;
  height:19px;
  border-radius:10px 12px 2px 2px;
  background:rgba(180,220,245,.75);
}

.car:after{
  content:"";
  position:absolute;
  left:9px;
  bottom:-7px;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#111;
  box-shadow:52px 0 #111;
}

/* =========================================================
   POSTAVY
   ========================================================= */

.people{
  position:absolute;
  inset:0;
  z-index:30;
  pointer-events:none;
}

.person{
  position:absolute;
  width:25px;
  height:65px;
}

.person .head{
  position:absolute;
  top:0;
  left:6px;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#d9a47d;
}

.person .body{
  position:absolute;
  top:14px;
  left:4px;
  width:18px;
  height:27px;
  border-radius:8px 8px 4px 4px;
  background:var(--shirt,#3676b9);
}

.person .leg{
  position:absolute;
  top:38px;
  width:6px;
  height:25px;
  background:#222733;
  transform-origin:top;
  animation:walkLeg .42s infinite alternate ease-in-out;
}

.person .leg.one{left:5px}
.person .leg.two{
  left:14px;
  animation-delay:-.21s;
}

@keyframes walkLeg{
  from{transform:rotate(22deg)}
  to{transform:rotate(-22deg)}
}

/* =========================================================
   PARK
   ========================================================= */

.park-elements{
  position:absolute;
  inset:0;
  z-index:10;
}

/* =========================================================
   FABRIKA
   ========================================================= */

.factory{
  position:absolute;
  bottom:39%;
  left:7%;
  width:430px;
  height:180px;
  background:#454b52;
  border:2px solid #30353b;
  box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.factory-roof{
  position:absolute;
  left:-20px;
  right:-20px;
  top:-22px;
  height:25px;
  background:#30363c;
}

.chimney{
  position:absolute;
  width:32px;
  height:100px;
  right:65px;
  top:-100px;
  background:#555c63;
}

.smoke{
  position:absolute;
  right:40px;
  top:-145px;
  width:80px;
  height:80px;
  border-radius:50%;
  background:rgba(220,225,230,.3);
  filter:blur(6px);
  animation:smoke 5s infinite ease-in-out;
}

@keyframes smoke{
  0%{transform:translate(0,10px) scale(.7);opacity:.2}
  50%{transform:translate(20px,-20px) scale(1);opacity:.45}
  100%{transform:translate(50px,-60px) scale(1.5);opacity:0}
}

/* =========================================================
   HUD
   ========================================================= */

#hud{
  position:absolute;
  inset:0;
  z-index:100;
  pointer-events:none;
}

.topbar{
  position:absolute;
  left:24px;
  right:24px;
  top:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-weight:800;
  letter-spacing:.12em;
  font-size:13px;
  text-transform:uppercase;
  opacity:.9;
}

.scene-name{
  padding:8px 13px;
  border:1px solid var(--line);
  border-radius:20px;
  background:rgba(0,0,0,.28);
  backdrop-filter:blur(12px);
  font-size:12px;
  color:#fff;
}

.subtitle{
  position:absolute;
  left:50%;
  bottom:11%;
  transform:translateX(-50%);
  width:min(900px,90vw);
  text-align:center;
  opacity:0;
  transition:opacity .35s ease;
}

.subtitle.show{
  opacity:1;
}

.speaker{
  font-weight:800;
  color:var(--gold);
  font-size:14px;
  margin-bottom:5px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.dialogue{
  display:inline-block;
  padding:9px 16px;
  border-radius:9px;
  background:rgba(0,0,0,.66);
  backdrop-filter:blur(8px);
  font-size:18px;
  line-height:1.4;
}

.controls{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:22px;
  display:flex;
  gap:8px;
  pointer-events:auto;
  padding:7px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(5,8,12,.72);
  backdrop-filter:blur(15px);
}

.controls button{
  border:0;
  color:#fff;
  background:rgba(255,255,255,.08);
  border-radius:9px;
  padding:9px 13px;
  cursor:pointer;
  transition:.2s;
}

.controls button:hover{
  background:rgba(255,255,255,.17);
  transform:translateY(-1px);
}

.progress{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:3px;
  background:rgba(255,255,255,.15);
}

.progress-bar{
  width:0;
  height:100%;
  background:#fff;
  transform-origin:left;
}

/* =========================================================
   FILMOVÉ PRECHODY
   ========================================================= */

.fade{
  position:absolute;
  inset:0;
  z-index:200;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:opacity .7s ease;
}

.fade.active{
  opacity:1;
}

.title-card{
  position:absolute;
  inset:0;
  z-index:250;
  display:grid;
  place-items:center;
  text-align:center;
  background:#05070b;
  transition:opacity 1s ease;
}

.title-card.hidden{
  opacity:0;
  pointer-events:none;
}

.title-card h1{
  margin:0;
  font-size:clamp(35px,7vw,82px);
  letter-spacing:.08em;
}

.title-card p{
  margin:15px 0 0;
  color:#aab3c0;
  letter-spacing:.2em;
  text-transform:uppercase;
  font-size:12px;
}

/* =========================================================
   KONIEC
   ========================================================= */

.ending{
  position:absolute;
  inset:0;
  z-index:300;
  display:grid;
  place-items:center;
  text-align:center;
  background:#05070b;
  opacity:0;
  pointer-events:none;
  transition:opacity 1s ease;
}

.ending.show{
  opacity:1;
  pointer-events:auto;
}

.ending h2{
  font-size:clamp(30px,6vw,65px);
  margin:0 0 10px;
}

.ending p{
  color:var(--muted);
  margin:0 0 25px;
}

.replay{
  border:1px solid rgba(255,255,255,.2);
  background:#fff;
  color:#07090d;
  border-radius:10px;
  padding:12px 22px;
  font-weight:700;
  cursor:pointer;
}

.replay:hover{
  transform:translateY(-2px);
}

/* =========================================================
   NOČNÝ REŽIM
   ========================================================= */

.night .sky{
  background:linear-gradient(#081326,#15263c);
}

.night .ground{
  background:#28352c;
}

.night .building{
  background:linear-gradient(90deg,#171c25,#252d38);
}

.night .road{
  filter:brightness(.7);
}

.night .street-light:after{
  opacity:1;
}

.night .tree .crown{
  filter:brightness(.65);
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:600px){
  .topbar{
    left:12px;
    right:12px;
    top:12px;
  }

  .dialogue{
    font-size:15px;
  }

  .subtitle{
    bottom:14%;
  }

  .controls{
    bottom:14px;
  }

  .controls button{
    padding:8px 10px;
    font-size:12px;
  }

  .car{
    transform:scale(.8);
  }
}

@media(prefers-reduced-motion:reduce){
  *,
  *:before,
  *:after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
  }
}
</style>
</head>

<body>

<div id="film">

  <div class="scene" id="scene">

    <div class="sky"></div>
    <div class="ground"></div>
    <div class="horizon"></div>

    <div class="buildings" id="buildings"></div>

    <div class="park-elements" id="park"></div>

    <div class="factory" id="factory" hidden>
      <div class="factory-roof"></div>
      <div class="chimney"></div>
      <div class="smoke"></div>
    </div>

    <div class="sidewalk"></div>
    <div class="road"></div>
    <div class="road-edge"></div>

    <div id="lights"></div>
    <div class="vehicles" id="vehicles"></div>
    <div class="people" id="people"></div>

  </div>

  <div id="hud">

    <div class="topbar">
      <div class="logo">ERIKAI STUDIOS</div>
      <div class="scene-name" id="sceneName">Úvod</div>
    </div>

    <div class="subtitle" id="subtitle">
      <div class="speaker" id="speaker"></div>
      <div class="dialogue" id="dialogue"></div>
    </div>

    <div class="controls">
      <button id="pauseBtn">Ⅱ</button>
      <button id="restartBtn">↻</button>
      <button id="muteBtn">🔇</button>
    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

  </div>

  <div class="fade" id="fade"></div>

  <div class="title-card" id="titleCard">
    <div>
      <h1>THE LAST ROUTE</h1>
      <p>ErikAI Studios • krátky animovaný film</p>
    </div>
  </div>

  <div class="ending" id="ending">
    <div>
      <h2>KONIEC</h2>
      <p>Ďakujeme za pozretie.</p>
      <button class="replay" id="replayBtn">↻ Pozrieť znova</button>
    </div>
  </div>

</div>

<script>
"use strict";

/* =========================================================
   FILMOVÝ ENGINE
   ========================================================= */

const film = document.getElementById("film");
const scene = document.getElementById("scene");
const buildings = document.getElementById("buildings");
const park = document.getElementById("park");
const factory = document.getElementById("factory");
const lights = document.getElementById("lights");
const vehicles = document.getElementById("vehicles");
const people = document.getElementById("people");

const sceneName = document.getElementById("sceneName");
const subtitle = document.getElementById("subtitle");
const speaker = document.getElementById("speaker");
const dialogue = document.getElementById("dialogue");

const progressBar = document.getElementById("progressBar");
const pauseBtn = document.getElementById("pauseBtn");
const restartBtn = document.getElementById("restartBtn");
const replayBtn = document.getElementById("replayBtn");

const titleCard = document.getElementById("titleCard");
const ending = document.getElementById("ending");
const fade = document.getElementById("fade");

/*
  Každá scéna má vlastné prostredie,
  čas, postavy a dialógy.
*/

const scenes = [

  {
    name:"Centrum mesta",
    duration:34,
    type:"city",
    time:"day",
    dialogue:[
      [3,"ERIK","Myslel som, že dnešok bude úplne obyčajný."],
      [11,"ERIK","Ale niečo mi hovorí, že sa to práve mení."],
      [21,"MARTIN","Erik! Počkaj na mňa!"],
      [29,"ERIK","Poď. Nemáme veľa času."]
    ]
  },

  {
    name:"Obytná štvrť",
    duration:32,
    type:"residential",
    time:"day",
    dialogue:[
      [2,"MARTIN","Kam vlastne ideme?"],
      [10,"ERIK","Na miesto, o ktorom som ti včera hovoril."],
      [20,"MARTIN","A myslíš, že tam niečo nájdeme?"],
      [27,"ERIK","To zistíme až tam."]
    ]
  },

  {
    name:"Most",
    duration:32,
    type:"bridge",
    time:"sunset",
    dialogue:[
      [3,"ERIK","Pozri sa na druhú stranu."],
      [12,"MARTIN","Tam? Pri tých svetlách?"],
      [20,"ERIK","Áno. Presne tam."],
      [27,"MARTIN","Tak poďme."]
    ]
  },

  {
    name:"Priemyselná zóna",
    duration:34,
    type:"industrial",
    time:"sunset",
    dialogue:[
      [3,"MARTIN","Toto miesto vyzerá opustene."],
      [12,"ERIK","Práve preto sme sem prišli."],
      [21,"MARTIN","Počul si to?"],
      [28,"ERIK","Áno. Buď pripravený."]
    ]
  },

  {
    name:"Nočné centrum",
    duration:38,
    type:"night",
    dialogue:[
      [3,"ERIK","Takže sme späť tam, kde to celé začalo."],
      [13,"MARTIN","A pritom je všetko úplne iné."],
      [23,"ERIK","Možno sme sa zmenili my."],
      [32,"MARTIN","Myslíš, že sa sem ešte vrátime?"]
    ]
  },

  {
    name:"Záver",
    duration:30,
    type:"city",
    time:"night",
    dialogue:[
      [4,"ERIK","Niektoré cesty nemajú skutočný koniec."],
      [15,"MARTIN","Tak kam pôjdeme teraz?"],
      [24,"ERIK","To necháme na ďalší príbeh."]
    ]
  }

];

let currentScene = 0;
let sceneTime = 0;
let playing = true;
let lastFrame = performance.now();
let vehiclePool = [];
let peoplePool = [];
let currentDialogue = -1;

/* =========================================================
   POMOCNÉ FUNKCIE
   ========================================================= */

function clear(el){
  el.replaceChildren();
}

function createElement(tag,className,parent){
  const el=document.createElement(tag);
  if(className) el.className=className;
  if(parent) parent.appendChild(el);
  return el;
}

/* =========================================================
   BUDOVY
   ========================================================= */

function createBuildings(type){

  clear(buildings);

  const count =
    type==="city" ? 10 :
    type==="night" ? 10 :
    type==="residential" ? 7 :
    type==="bridge" ? 5 :
    type==="industrial" ? 6 : 7;

  for(let i=0;i<count;i++){

    const b=createElement("div","building",buildings);

    const width=70+Math.random()*100;
    const height=
      type==="city" || type==="night"
      ? 130+Math.random()*260
      : 90+Math.random()*150;

    b.style.width=width+"px";
    b.style.height=height+"px";
    b.style.left=(i/(count-1))*100+"%";
    b.style.transform=
      "translateX(-50%) scale("+(0.75+Math.random()*.35)+")";

    b.style.opacity=.65+Math.random()*.3;
  }
}

/* =========================================================
   PARK / OKOLIE
   ========================================================= */

function createPark(type){

  clear(park);

  if(type==="residential"){

    for(let i=0;i<8;i++){

      const tree=createElement("div","tree",park);

      tree.style.left=(5+i*12+Math.random()*5)+"%";
      tree.style.bottom=(27+Math.random()*7)+"%";

      createElement("div","trunk",tree);
      createElement("div","crown",tree);
    }
  }

  if(type==="bridge"){

    const bridge=createElement("div",null,park);

    bridge.style.position="absolute";
    bridge.style.left="0";
    bridge.style.right="0";
    bridge.style.bottom="38%";
    bridge.style.height="100px";
    bridge.style.background="#555d66";
    bridge.style.borderTop="10px solid #32383e";
    bridge.style.borderBottom="10px solid #32383e";
  }
}

/* =========================================================
   LAMPY
   ========================================================= */

function createLights(type){

  clear(lights);

  if(type==="city" || type==="night" || type==="residential"){

    for(let i=0;i<6;i++){

      const l=createElement("div","street-light",lights);

      l.style.left=(8+i*17)+"%";
      l.style.bottom=(23+i%2*3)+"%";
      l.style.transform=
        "scale("+(0.7+i*.05)+")";
    }
  }
}

/* =========================================================
   AUTÁ
   ========================================================= */

function createVehicles(type){

  clear(vehicles);
  vehiclePool=[];

  const count =
    type==="city" || type==="night" ? 7 :
    type==="residential" ? 4 :
    type==="bridge" ? 5 :
    type==="industrial" ? 4 : 5;

  for(let i=0;i<count;i++){

    const car=createElement("div","car",vehicles);

    const colors=[
      "#c94747",
      "#3e78b8",
      "#e0a82e",
      "#555d66",
      "#eeeeee",
      "#4b9b6a"
    ];

    car.style.setProperty(
      "--car",
      colors[i%colors.length]
    );

    /*
      Všetky vozidlá dostanú vlastný jazdný pruh.
      Preto neprechádzajú náhodne cez chodník.
    */

    const lane=i%3;

    vehiclePool.push({
      el:car,
      x:-120-i*160,
      lane,
      speed:55+Math.random()*35,
      direction:i%2===0?1:-1,
      scale:.65+lane*.12
    });
  }

  updateVehicles(0);
}

function updateVehicles(dt){

  for(const v of vehiclePool){

    v.x+=v.speed*v.direction*dt;

    if(v.direction>0 && v.x>window.innerWidth+120)
      v.x=-150;

    if(v.direction<0 && v.x<-150)
      v.x=window.innerWidth+120;

    /*
      Cesta je rozdelená na tri jazdné línie.
    */

    const laneY=[
      69,
      78,
      87
    ][v.lane];

    v.el.style.left=v.x+"px";
    v.el.style.top=laneY+"%";
    v.el.style.transform=
      `translateY(-50%) scale(${v.scale}) scaleX(${v.direction})`;
  }
}

/* =========================================================
   POSTAVY
   ========================================================= */

function createPeople(type){

  clear(people);
  peoplePool=[];

  const count=
    type==="city" ? 6 :
    type==="night" ? 5 :
    type==="residential" ? 7 :
    type==="bridge" ? 3 :
    type==="industrial" ? 3 : 4;

  for(let i=0;i<count;i++){

    const p=createElement("div","person",people);

    createElement("div","head",p);
    createElement("div","body",p);

    const leg1=createElement("div","leg one",p);
    const leg2=createElement("div","leg two",p);

    p.style.setProperty(
      "--shirt",
      ["#3975ad","#a94b4b","#4f8b62","#7653a8","#b57d35"][i%5]
    );

    peoplePool.push({
      el:p,
      x:Math.random()*window.innerWidth,
      speed:18+Math.random()*25,
      direction:i%2?1:-1,
      baseY:73+Math.random()*13,
      phase:Math.random()*10
    });
  }

  updatePeople(0);
}

function updatePeople(dt){

  for(const p of peoplePool){

    p.x+=p.speed*p.direction*dt;

    if(p.x>window.innerWidth+50)
      p.x=-50;

    if(p.x<-50)
      p.x=window.innerWidth+50;

    p.phase+=dt*6;

    const bob=Math.sin(p.phase)*1.5;

    p.el.style.left=p.x+"px";
    p.el.style.top=
      `calc(${p.baseY}% + ${bob}px)`;

    p.el.style.transform=
      `scaleX(${p.direction})`;
  }
}

/* =========================================================
   INDUSTRIÁLNE PROSTREDIE
   ========================================================= */

function setupFactory(type){

  factory.hidden=type!=="industrial";
}

/* =========================================================
   PROSTREDIE
   ========================================================= */

function setupEnvironment(data){

  scene.className="scene";

  if(data.time==="night")
    scene.classList.add("night");

  createBuildings(data.type);
  createPark(data.type);
  createLights(data.type);
  createVehicles(data.type);
  createPeople(data.type);
  setupFactory(data.type);

  sceneName.textContent=data.name;
}

/* =========================================================
   DIALÓGY
   ========================================================= */

function updateDialogue(){

  const data=scenes[currentScene];

  let found=-1;

  for(let i=0;i<data.dialogue.length;i++){

    if(sceneTime>=data.dialogue[i][0])
      found=i;
  }

  if(found!==currentDialogue){

    currentDialogue=found;

    if(found<0){

      subtitle.classList.remove("show");

    }else{

      const line=data.dialogue[found];

      speaker.textContent=line[1];
      dialogue.textContent=line[2];

      subtitle.classList.remove("show");

      requestAnimationFrame(()=>{
        subtitle.classList.add("show");
      });
    }
  }
}

/* =========================================================
   SCÉNY
   ========================================================= */

function loadScene(index){

  currentScene=index;
  sceneTime=0;
  currentDialogue=-1;

  setupEnvironment(scenes[index]);
  updateDialogue();
}

function nextScene(){

  if(currentScene<scenes.length-1){

    fade.classList.add("active");

    setTimeout(()=>{

      loadScene(currentScene+1);

      setTimeout(()=>{
        fade.classList.remove("active");
      },120);

    },650);

  }else{

    finishFilm();
  }
}

/* =========================================================
   KONIEC
   ========================================================= */

function finishFilm(){

  playing=false;
  ending.classList.add("show");
  subtitle.classList.remove("show");
  progressBar.style.width="100%";
}

/* =========================================================
   REŠTART
   ========================================================= */

function restart(){

  ending.classList.remove("show");

  fade.classList.add("active");

  setTimeout(()=>{

    loadScene(0);

    titleCard.classList.add("hidden");

    playing=true;
    lastFrame=performance.now();

    setTimeout(()=>{
      fade.classList.remove("active");
    },150);

  },600);
}

/* =========================================================
   OVLÁDANIE
   ========================================================= */

pauseBtn.addEventListener("click",()=>{

  playing=!playing;

  pauseBtn.textContent=
    playing ? "Ⅱ" : "▶";

  lastFrame=performance.now();
});

restartBtn.addEventListener("click",restart);
replayBtn.addEventListener("click",restart);

/*
  Zvuk v tomto filme nie je použitý.
  Tlačidlo je ponechané ako filmový prvok.
*/

document.getElementById("muteBtn").addEventListener("click",e=>{
  e.currentTarget.textContent=
    e.currentTarget.textContent==="🔇" ? "🔈" : "🔇";
});

/* =========================================================
   HLAVNÁ ANIMÁCIA
   ========================================================= */

function loop(now){

  const dt=Math.min(
    (now-lastFrame)/1000,
    .05
  );

  lastFrame=now;

  if(playing){

    sceneTime+=dt;

    updateVehicles(dt);
    updatePeople(dt);
    updateDialogue();

    const data=scenes[currentScene];

    const totalDuration=
      scenes.reduce((sum,s)=>sum+s.duration,0);

    const elapsed=
      scenes
        .slice(0,currentScene)
        .reduce((sum,s)=>sum+s.duration,0)
      +sceneTime;

    progressBar.style.width=
      Math.min(100,elapsed/totalDuration*100)+"%";

    if(sceneTime>=data.duration)
      nextScene();
  }

  requestAnimationFrame(loop);
}

/* =========================================================
   ŠTART
   ========================================================= */

loadScene(0);

setTimeout(()=>{
  titleCard.classList.add("hidden");
},2200);

requestAnimationFrame(loop);

</script>
