<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErikAI • QR Studio Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.85);
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: rgba(15, 23, 42, 0.08);
      --shadow: 0 20px 40px rgba(15, 23, 42, 0.06);
      --success: #10b981;
    }

    body.dark-mode {
      --bg: #030712;
      --card-bg: rgba(15, 23, 42, 0.8);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: rgba(248, 250, 252, 0.08);
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      --success: #34d399;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(37, 99, 235, 0.06), transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(16, 185, 129, 0.04), transparent 45%);
      color: var(--text);
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.4s ease, color 0.4s ease;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    /* TOPBAR */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 15px 22px;
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .clock-box {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .theme-btn {
      background: var(--accent);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: transform 0.2s ease;
    }
    .theme-btn:hover { transform: scale(1.1) rotate(15deg); }

    /* HEADER */
    .header-box {
      text-align: center;
      margin-bottom: 25px;
    }

    h2 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    h2 span { color: var(--accent); }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* CARD */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 30px;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      text-align: left;
    }

    input[type="text"], select {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 0.95rem;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: all 0.2s ease;
      margin-bottom: 15px;
    }
    input[type="text"]:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    button.primary-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
      transition: all 0.2s ease;
    }
    button.primary-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    button.secondary-btn {
      padding: 12px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button.secondary-btn:hover {
      border-color: var(--accent);
      background: rgba(37, 99, 235, 0.05);
    }

    #qrcode {
      margin-top: 20px;
      padding: 15px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: inline-block;
    }

    canvas {
      image-rendering: pixelated;
      display: block;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>
<body class="dark-mode">

<div class="container">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="clock-box" id="cas">Načítavam čas...</div>
    <button class="theme-btn" onclick="toggleTheme()" title="Zmeniť režim">🌓</button>
  </div>

  <div class="header-box">
    <h2>ErikAI <span>QR Studio</span></h2>
    <p class="subtitle">Generujte a ukladajte QR kódy rýchlo a bezpečne</p>
  </div>

  <div id="google_translate_element" style="text-align:center; margin-bottom: 20px;"></div>

  <div class="card">
    
    <label for="text">📝 Obsah QR kódu (Text alebo URL):</label>
    <input type="text" id="text" placeholder="Sem vlož text alebo webovú adresu...">

    <div class="btn-grid">
      <button class="primary-btn" onclick="generateQR()" style="grid-column: span 2;">✨ Generovať QR kód</button>
      <button class="secondary-btn" onclick="downloadQR()">📥 Stiahnuť PNG</button>
      <button class="secondary-btn" onclick="ulozitQR()">💾 Uložiť do pamäte</button>
    </div>

    <label for="ulozeneQRs">📂 Uložené QR kódy:</label>
    <select id="ulozeneQRs" onchange="zobrazUlozenyQR()">
      <option value="">-- Vyber uložený QR kód --</option>
    </select>

    <div id="qrcode"></div>

  </div>

  <footer>
    This work is licensed under the Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International License.<br>
    © 2026 Erik Mohylák – All rights reserved.
  </footer>

</div>

<script>
  // === TÉMA ===
  function toggleTheme() {
    document.body.classList.toggle('dark-mode');
    localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
  }
  if (localStorage.getItem('darkMode') === 'false') {
    document.body.classList.remove('dark-mode');
  }

  // === ČAS ===
  function aktualizujCas() {
    const teraz = new Date();
    const moznosti = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
    document.getElementById('cas').innerText = "🕓 " + teraz.toLocaleDateString('sk-SK', moznosti);
  }
  setInterval(aktualizujCas, 1000);
  aktualizujCas();

  // === GOOGLE TRANSLATE ===
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'sk',
      includedLanguages: 'en,cs,fr,hu,de,pl,ro,ru,es,it,uk,sr,bn,ko,ja,zh-CN',
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE
    }, 'google_translate_element');
  }
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script>
  let canvas;

  function ulozitQR() {
    const text = document.getElementById("text").value.trim();
    if (!text) {
      alert("Najprv zadaj text na uloženie!");
      return;
    }

    let ulozene = JSON.parse(localStorage.getItem("qrZoznam")) || [];

    if (ulozene.includes(text)) {
      alert("Tento QR kód je už uložený.");
      return;
    }

    if (ulozene.length >= 10) {
      ulozene.shift();
    }

    ulozene.push(text);
    localStorage.setItem("qrZoznam", JSON.stringify(ulozene));
    nacitajQRZoznam();
    alert("✅ QR kód bol úspešne uložený!");
  }

  function nacitajQRZoznam() {
    const select = document.getElementById("ulozeneQRs");
    select.innerHTML = `<option value="">-- Vyber uložený QR kód --</option>`;
    const ulozene = JSON.parse(localStorage.getItem("qrZoznam")) || [];
    ulozene.forEach((t, i) => {
      const opt = document.createElement("option");
      opt.value = t;
      opt.textContent = `QR #${i+1}: ${t.substring(0, 25)}${t.length > 25 ? "..." : ""}`;
      select.appendChild(opt);
    });
  }

  function zobrazUlozenyQR() {
    const val = document.getElementById("ulozeneQRs").value;
    if (val) {
      document.getElementById("text").value = val;
      generateQR();
    }
  }

  window.onload = function () {
    nacitajQRZoznam();
  };

  function generateQR() {
    const text = document.getElementById("text").value.trim();
    if (!text) {
      alert("Zadaj text alebo odkaz.");
      return;
    }

    document.getElementById("qrcode").innerHTML = "";

    QRCode.toCanvas(text, {
      errorCorrectionLevel: 'H',
      width: 250,
      margin: 2,
      color: {
        dark: "#000000",
        light: "#ffffff"
      }
    }, function (err, c) {
      if (err) console.error(err);
      canvas = c;
      document.getElementById("qrcode").appendChild(canvas);
    });
  }

  function downloadQR() {
    if (!canvas) {
      alert("Najprv vygeneruj QR kód.");
      return;
    }

    const link = document.createElement('a');
    link.download = 'erikai-qr.png';
    link.href = canvas.toDataURL("image/png");
    link.click();
  }
</script>

</body>
</html>
