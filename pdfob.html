<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErikAI • Image to PDF Express</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --border: #e2e8f0;
    }

    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.3s, color 0.3s;
    }

    .app-container {
      width: 100%;
      max-width: 580px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    p.sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    .upload-box {
      border: 2px dashed var(--primary);
      background: var(--bg);
      padding: 20px;
      text-align: center;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 15px;
      transition: background 0.2s;
    }
    .upload-box:hover {
      background: rgba(37, 99, 235, 0.05);
    }
    .upload-box p { font-weight: 600; font-size: 0.95rem; }
    .upload-box span { font-size: 0.75rem; color: var(--muted); }
    #imageFiles { display: none; }

    .file-list {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .file-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 250px;
    }

    .file-actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 4px 6px;
      margin-left: 2px;
      border-radius: 4px;
    }
    .file-actions button:hover { background: var(--border); }
    .file-actions .del { color: var(--danger); }

    .btn-container {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      color: white;
      transition: filter 0.2s;
    }
    .btn-primary { background: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-print { background: var(--success); }
    .btn-print:hover { filter: brightness(1.1); }

    .status {
      margin-top: 15px;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
    }

    footer {
      margin-top: 25px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 15px;
    }
  </style>
</head>
<body class="dark">

<div class="app-container">
  <div class="top-header">
    <h1>🖼️ Image to PDF Express</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌓 Téma</button>
  </div>
  <p class="sub">Preveďte obrázky na A4 PDF okamžite a bezpečne.</p>

  <div class="form-group">
    <label>Názov súboru:</label>
    <input type="text" id="outputName" value="ErikAI_Dokument">
  </div>

  <div class="upload-box" onclick="document.getElementById('imageFiles').click()">
    <p>📁 Kliknite pre výber obrázkov</p>
    <span>Podporované: JPG, PNG (viac naraz)</span>
    <input type="file" id="imageFiles" accept="image/jpeg, image/png" multiple onchange="handleFiles(event)">
  </div>

  <div class="file-list" id="fileList">
    <div style="color: var(--muted); text-align: center; font-size: 0.85rem; padding: 15px;">Žiadne vybrané súbory.</div>
  </div>

  <div class="btn-container">
    <button class="btn btn-primary" onclick="generatePDF()">💾 Stiahnuť PDF</button>
    <button class="btn btn-print" onclick="printPDF()">🖨️ Tlačiť PDF</button>
  </div>

  <div class="status" id="statusMsg"></div>

  <footer>
    ErikAI Studio • © 2026 Erik Mohylák
  </footer>
</div>

<script>
  let selectedFiles = [];

  function toggleTheme() {
    document.body.classList.toggle('dark');
  }

  function handleFiles(e) {
    const files = Array.from(e.target.files);
    files.forEach(f => {
      if(f.type.startsWith('image/')) {
        selectedFiles.push(f);
      }
    });
    renderList();
    e.target.value = '';
  }

  function renderList() {
    const container = document.getElementById('fileList');
    if(selectedFiles.length === 0) {
      container.innerHTML = `<div style="color: var(--muted); text-align: center; font-size: 0.85rem; padding: 15px;">Žiadne vybrané súbory.</div>`;
      return;
    }
    container.innerHTML = '';
    selectedFiles.forEach((file, index) => {
      container.innerHTML += `
        <div class="file-row">
          <span class="file-name">${index + 1}. ${file.name}</span>
          <div class="file-actions">
            ${index > 0 ? `<button onclick="move(${index}, -1)">⬆️</button>` : ''}
            ${index < selectedFiles.length - 1 ? `<button onclick="move(${index}, 1)">⬇️</button>` : ''}
            <button class="del" onclick="removeFile(${index})">❌</button>
          </div>
        </div>
      `;
    });
  }

  function move(index, dir) {
    const target = index + dir;
    const temp = selectedFiles[index];
    selectedFiles[index] = selectedFiles[target];
    selectedFiles[target] = temp;
    renderList();
  }

  function removeFile(index) {
    selectedFiles.splice(index, 1);
    renderList();
  }

  async function createPdfBytes() {
    if (selectedFiles.length === 0) return null;
    
    const pdfDoc = await PDFLib.PDFDocument.create();
    for (let file of selectedFiles) {
      const buffer = await file.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      let img = file.type === 'image/png' ? await pdfDoc.embedPng(bytes) : await pdfDoc.embedJpg(bytes);

      // Štandard A4
      const pW = 595.28, pH = 841.89, margin = 30;
      const dims = img.scaleToFit(pW - (margin * 2), pH - (margin * 2));
      
      const page = pdfDoc.addPage([pW, pH]);
      page.drawImage(img, {
        x: (pW - dims.width) / 2,
        y: (pH - dims.height) / 2,
        width: dims.width,
        height: dims.height,
      });
    }
    const pdfBytes = await pdfDoc.save();
    return pdfBytes;
  }

  // Pomocná funkcia na konverziu Uint8Array na Base64 (zaručene funguje v každom prehliadači)
  function uint8ToBase64(u8Arr) {
    const CHUNK_SIZE = 0x8000;
    let index = 0;
    let length = u8Arr.length;
    let result = '';
    let slice;
    while (index < length) {
      slice = u8Arr.subarray(index, Math.min(index + CHUNK_SIZE, length));
      result += String.fromCharCode.apply(null, slice);
      index += CHUNK_SIZE;
    }
    return btoa(result);
  }

  async function generatePDF() {
    const status = document.getElementById('statusMsg');
    if (selectedFiles.length === 0) {
      alert("Najprv vyber aspoň jeden obrázok!");
      return;
    }

    status.style.color = "var(--text)";
    status.textContent = "⏳ Generujem PDF...";

    try {
      const pdfBytes = await createPdfBytes();
      let name = document.getElementById('outputName').value.trim() || "ErikAI_Dokument";
      if(!name.toLowerCase().endsWith('.pdf')) name += ".pdf";

      // Použitie Base64 Data URI – 100% spoľahlivé sťahovanie v PC aj mobile
      const base64Data = uint8ToBase64(pdfBytes);
      const dataUri = "data:application/pdf;base64," + base64Data;

      const link = document.createElement('a');
      link.href = dataUri;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      status.style.color = "var(--success)";
      status.textContent = "✅ PDF súbor bol úspešne stiahnutý!";
    } catch(err) {
      console.error(err);
      status.style.color = "var(--danger)";
      status.textContent = "❌ Chyba pri vytváraní PDF.";
    }
  }

  async function printPDF() {
    const status = document.getElementById('statusMsg');
    if (selectedFiles.length === 0) {
      alert("Najprv vyber aspoň jeden obrázok!");
      return;
    }

    status.style.color = "var(--text)";
    status.textContent = "⏳ Pripravujem tlač...";

    try {
      const pdfBytes = await createPdfBytes();
      const base64Data = uint8ToBase64(pdfBytes);
      const dataUri = "data:application/pdf;base64," + base64Data;

      // Otvorenie PDF v novom okne / karte na priamu tlač alebo uloženie cez systém
      const win = window.open();
      if (win) {
        win.document.write(`
          <html>
            <head><title>Tlač PDF</title></head>
            <body style="margin:0; background:#000;">
              <embed src="${dataUri}" type="application/pdf" width="100%" height="100%" />
            </body>
          </html>
        `);
        status.style.color = "var(--success)";
        status.textContent = "✅ Otvorené na tlač!";
      } else {
        alert("Prehliadač zablokoval vyskakovacie okno. Povoľte vyskakovacie okná pre túto stránku.");
      }
    } catch(err) {
      console.error(err);
      status.style.color = "var(--danger)";
      status.textContent = "❌ Chyba pri tlači.";
    }
  }
</script>

</body>
</html>
