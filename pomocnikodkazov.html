<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErikAI - Generátor Navigačných Kódov</title>
  <style>
    :root {
      --bg: #090a0f;
      --card: #131722;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #10b981;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at top, #161b29 0%, var(--bg) 100%);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 6px;
      color: #60a5fa;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 22px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b0d14;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    .output-section {
      margin-top: 22px;
    }

    .output-box {
      background: #0b0d14;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      word-break: break-all;
      margin-top: 6px;
      position: relative;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    .btn-copy {
      background: var(--green);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-copy:hover { opacity: 0.9; }

    .preview-box {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    .nav-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e2530;
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 10px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🛠️ ErikAI Code & Link Generator</h1>
    <p class="subtitle">Zadaj názov súboru a popis, generátor ti okamžite vytvorí obidva formáty kódov.</p>

    <div class="input-group">
      <label for="fileName">Názov HTML súboru (napr. eshop.html):</label>
      <input type="text" id="fileName" value="eshop.html" oninput="generateCodes()">
    </div>

    <div class="input-group">
      <label for="fileTitle">Textový názov / Popis (s emoji):</label>
      <input type="text" id="fileTitle" value="🏙️ ErikAI Šablóna na inzeracie tovaru/produktu 19" oninput="generateCodes()">
    </div>

    <!-- Výstup 1: HTML Tlačidlo -->
    <div class="output-section">
      <div class="output-header">
        <label>1. HTML Tlačidlo (`&lt;a class="nav-btn"...&gt;`):</label>
        <button class="btn-copy" onclick="copyText('codeHtml')">Kopírovať</button>
      </div>
      <div class="output-box" id="codeHtml"></div>
    </div>

    <!-- Výstup 2: JS Objekt -->
    <div class="output-section">
      <div class="output-header">
        <label>2. JavaScript Objekt (`{file: ..., name: ...}`):</label>
        <button class="btn-copy" onclick="copyText('codeJs')">Kopírovať</button>
      </div>
      <div class="output-box" id="codeJs"></div>
    </div>

    <!-- Živá ukážka -->
    <div class="preview-box">
      <label>Živá náhľad tlačidla:</label>
      <div id="buttonPreview"></div>
    </div>
  </div>

  <script>
    function generateCodes() {
      const file = document.getElementById('fileName').value.trim();
      const title = document.getElementById('fileTitle').value.trim();

      // Formát 1: HTML tlačidlo
      const htmlCode = `<a class="nav-btn" href="${file}"><span class="nav-btn-text">${title}</span><span class="nav-arrow">→</span></a>`;
      document.getElementById('codeHtml').textContent = htmlCode;

      // Formát 2: JS objekt
      const jsCode = `{file: "${file}", name: "${title}"},`;
      document.getElementById('codeJs').textContent = jsCode;

      // Živý náhľad
      document.getElementById('buttonPreview').innerHTML = htmlCode;
    }

    function copyText(elementId) {
      const text = document.getElementById(elementId).textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert("Skopírované do schránky!");
      });
    }

    // Spustenie pri štarte
    generateCodes();
  </script>
</body>
</html>
