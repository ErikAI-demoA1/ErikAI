<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErikAI Master Code Generator</title>
  <style>
    :root {
      --bg: #090a0f;
      --card: #131722;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #10b981;
      --purple: #8b5cf6;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at top, #161b29 0%, var(--bg) 100%);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 750px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 6px;
      color: #60a5fa;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 22px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b0d14;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    .action-row {
      margin-top: 15px;
      margin-bottom: 25px;
    }

    .btn-add {
      width: 100%;
      background: var(--purple);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-add:hover { opacity: 0.9; }

    .output-section {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .output-box {
      background: #0b0d14;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      word-break: break-all;
      margin-top: 6px;
      max-height: 140px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn-copy {
      background: var(--green);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-copy:hover { opacity: 0.9; }

    .btn-clear {
      background: #dc2626;
    }

    .preview-box {
      margin-top: 15px;
      padding: 10px;
      background: #1e2530;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🛠️ ErikAI Master Code Generator</h1>
    <p class="subtitle">Zadaj modul raz, pridaj do samostatných hromadných zoznamov a kopíruj!</p>

    <div class="input-group">
      <label for="fileName">Názov HTML súboru (napr. rychlost.html):</label>
      <input type="text" id="fileName" value="rychlost.html" oninput="generateLive()">
    </div>

    <div class="input-group">
      <label for="fileTitle">Textový názov / Popis (s emoji):</label>
      <input type="text" id="fileTitle" value="🪪 ERIKAI Kalkulačka Rýchlosť" oninput="generateLive()">
    </div>

    <div class="action-row">
      <button class="btn-add" onclick="addAllLists()">➕ Pridať do všetkých 3 hromadných zoznamov</button>
    </div>

    <!-- Zoznam 1: Hromadné HTML Tlačidlá -->
    <div class="output-section">
      <div class="output-header">
        <label>1. Hromadný zoznam: HTML Tlačidlá (`nav-btn`)</label>
        <div class="btn-group">
          <button class="btn-copy btn-clear" onclick="clearList(1)">Vymazať</button>
          <button class="btn-copy" onclick="copyText('list1Output')">Kopírovať zoznam</button>
        </div>
      </div>
      <div class="output-box" id="list1Output" style="color: #f1f5f9;"></div>
    </div>

    <!-- Zoznam 2: Hromadné JS Polia -->
    <div class="output-section">
      <div class="output-header">
        <label>2. Hromadný zoznam: JavaScript Polia (`{file: ..., name: ...}`)</label>
        <div class="btn-group">
          <button class="btn-copy btn-clear" onclick="clearList(2)">Vymazať</button>
          <button class="btn-copy" onclick="copyText('list2Output')">Kopírovať zoznam</button>
        </div>
      </div>
      <div class="output-box" id="list2Output" style="color: #38bdf8;">[ ]</div>
    </div>

    <!-- Zoznam 3: Hromadné Jednoduché Odkazy -->
    <div class="output-section">
      <div class="output-header">
        <label>3. Hromadný zoznam: Jednoduché odkazy (`&lt;a href="..."&gt;Názov&lt;/a&gt;`)</label>
        <div class="btn-group">
          <button class="btn-copy btn-clear" onclick="clearList(3)">Vymazať</button>
          <button class="btn-copy" onclick="copyText('list3Output')">Kopírovať zoznam</button>
        </div>
      </div>
      <div class="output-box" id="list3Output" style="color: #10b981;"></div>
    </div>

  </div>

  <script>
    // Pamäte pre 3 samostatné zoznamy
    let list1 = [];
    let list2 = [];
    let list3 = [];

    function generateLive() {
      // Len pomocná pre prípadnú live ukážku, ak by bolo treba
    }

    function addAllLists() {
      const file = document.getElementById('fileName').value.trim();
      const title = document.getElementById('fileTitle').value.trim();
      if (!file || !title) return;

      // Formát 1
      const item1 = `<a class="nav-btn" href="${file}"><span class="nav-btn-text">${title}</span><span class="nav-arrow">→</span></a>`;
      list1.push(item1);

      // Formát 2
      const item2 = { file: file, name: title };
      list2.push(item2);

      // Formát 3
      const item3 = `<a href="${file}">${title}</a>`;
      list3.push(item3);

      renderOutputs();
    }

    function renderOutputs() {
      // Zoznam 1 render
      document.getElementById('list1Output').textContent = list1.join('\n');

      // Zoznam 2 render (štruktúrované JS pole)
      let jsFormatted = "[\n";
      list2.forEach(i => {
        jsFormatted += `  {file: "${i.file}", name: "${i.name}"},\n`;
      });
      jsFormatted += "]";
      document.getElementById('list2Output').textContent = jsFormatted;

      // Zoznam 3 render
      document.getElementById('list3Output').textContent = list3.join('\n');
    }

    function clearList(listNum) {
      if (listNum === 1) list1 = [];
      if (listNum === 2) list2 = [];
      if (listNum === 3) list3 = [];
      renderOutputs();
    }

    function copyText(elementId) {
      const text = document.getElementById(elementId).textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert("Zoznam úspešne skopírovaný do schránky!");
      });
    }

    // Inicializácia pri štarte
    renderOutputs();
  </script>
</body>
</html>
