<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErikAI - Pokročilý Generátor Navigačných Kódov</title>
  <style>
    :root {
      --bg: #090a0f;
      --card: #131722;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #10b981;
      --purple: #8b5cf6;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at top, #161b29 0%, var(--bg) 100%);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 6px;
      color: #60a5fa;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 22px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b0d14;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    .action-row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-add {
      flex: 1;
      background: var(--purple);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-add:hover { opacity: 0.9; }

    .output-section {
      margin-top: 22px;
    }

    .output-box {
      background: #0b0d14;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      word-break: break-all;
      margin-top: 6px;
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    .btn-copy {
      background: var(--green);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-copy:hover { opacity: 0.9; }

    .preview-box {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    .multi-list-section {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 2px dashed var(--border);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🛠️ ErikAI Master Code Generator</h1>
    <p class="subtitle">Generuj všetky 3 štýly odkazov a hromadný zoznam do svojho ErikAI OS.</p>

    <div class="input-group">
      <label for="fileName">Názov HTML súboru (napr. rychlost.html):</label>
      <input type="text" id="fileName" value="rychlost.html" oninput="generateCodes()">
    </div>

    <div class="input-group">
      <label for="fileTitle">Textový názov / Popis (s emoji):</label>
      <input type="text" id="fileTitle" value="🪪 ERIKAI Kalkulačka Rýchlosť" oninput="generateCodes()">
    </div>

    <div class="action-row">
      <button class="btn-add" onclick="addItemToList()">➕ Pridať položku do hromadného zoznamu</button>
    </div>

    <!-- Výstup 1: HTML Tlačidlo so spanmi -->
    <div class="output-section">
      <div class="output-header">
        <label>1. HTML Tlačidlo (nav-btn štýl):</label>
        <button class="btn-copy" onclick="copyText('codeHtml')">Kopírovať</button>
      </div>
      <div class="output-box" id="codeHtml"></div>
    </div>

    <!-- Výstup 2: JS Objekt -->
    <div class="output-section">
      <div class="output-header">
        <label>2. JavaScript Objekt (`{file: ..., name: ...}`):</label>
        <button class="btn-copy" onclick="copyText('codeJs')">Kopírovať</button>
      </div>
      <div class="output-box" id="codeJs"></div>
    </div>

    <!-- Výstup 3: Jednoduchý odkaz -->
    <div class="output-section">
      <div class="output-header">
        <label>3. Jednoduchý odkaz (`&lt;a href="..."&gt;Názov&lt;/a&gt;`):</label>
        <button class="btn-copy" onclick="copyText('codeSimple')">Kopírovať</button>
      </div>
      <div class="output-box" id="codeSimple"></div>
    </div>

    <!-- Živá ukážka -->
    <div class="preview-box">
      <label>Živá náhľad tlačidla:</label>
      <div id="buttonPreview" style="margin-top: 8px;"></div>
    </div>

    <!-- Hromadný zoznam -->
    <div class="multi-list-section">
      <h3 style="color: #a78bfa; font-size: 1.1rem; margin-bottom: 10px;">📋 Hromadný JS Zoznam (Všetky pridané)</h3>
      <div class="output-header" style="margin-top: 0;">
        <label>Skopíruj naraz celú zmes:</label>
        <div>
          <button class="btn-copy" style="background:#dc2626; margin-right:6px;" onclick="clearList()">Vymazať</button>
          <button class="btn-copy" onclick="copyText('multiOutput')">Kopírovať zoznam</button>
        </div>
      </div>
      <div class="output-box" id="multiOutput" style="color: #10b981; min-height: 80px;">[ ]</div>
    </div>
  </div>

  <script>
    let itemsList = [];

    function generateCodes() {
      const file = document.getElementById('fileName').value.trim();
      const title = document.getElementById('fileTitle').value.trim();

      // Formát 1: HTML tlačidlo
      const htmlCode = `<a class="nav-btn" href="${file}"><span class="nav-btn-text">${title}</span><span class="nav-arrow">→</span></a>`;
      document.getElementById('codeHtml').textContent = htmlCode;

      // Formát 2: JS objekt
      const jsCode = `{file: "${file}", name: "${title}"},`;
      document.getElementById('codeJs').textContent = jsCode;

      // Formát 3: Jednoduchý odkaz
      const simpleCode = `<a href="${file}">${title}</a>`;
      document.getElementById('codeSimple').textContent = simpleCode;

      // Živý náhľad
      document.getElementById('buttonPreview').innerHTML = simpleCode;
    }

    function addItemToList() {
      const file = document.getElementById('fileName').value.trim();
      const title = document.getElementById('fileTitle').value.trim();
      if (!file || !title) return;

      itemsList.push({ file, name: title });
      updateMultiOutput();
    }

    function updateMultiOutput() {
      let formatted = "[\n";
      itemsList.forEach(item => {
        formatted += `  {file: "${item.file}", name: "${item.name}"},\n`;
      });
      formatted += "]";
      document.getElementById('multiOutput').textContent = formatted;
    }

    function clearList() {
      itemsList = [];
      updateMultiOutput();
    }

    function copyText(elementId) {
      const text = document.getElementById(elementId).textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert("Skopírované do schránky!");
      });
    }

    // Spustenie pri štarte
    generateCodes();
    updateMultiOutput();
  </script>
</body>
</html>
