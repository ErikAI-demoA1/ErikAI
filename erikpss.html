<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI Joystick</title>
<style>
  body, html { margin:0; padding:0; height:100%; overflow:hidden; }
  #playarea { width:100%; height:100%; position:relative; overflow:auto; border:1px solid #333; }
  #joystick { position:absolute; width:30px; height:30px; background:red; border-radius:50%; pointer-events:none; z-index:999; }
  #controls { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:10px; }
  button { padding:15px; font-size:16px; }
</style>
</head>
<body>

<div id="playarea">
  <iframe src="luxuss.html" id="gameframe" style="width:100%; height:100%; border:none;"></iframe>
  <div id="joystick"></div>
</div>

<div id="controls">
  <button id="btnUp">↑</button>
  <button id="btnDown">↓</button>
  <button id="btnLeft">←</button>
  <button id="btnRight">→</button>
  <button id="btnX">X</button>
  <button id="btnO">O</button>
</div>

<script>
const joystick = document.getElementById('joystick');
const playarea = document.getElementById('playarea');
let pos = {x: playarea.clientWidth/2, y: playarea.clientHeight/2};

function updateJoystick() {
  joystick.style.left = pos.x - joystick.offsetWidth/2 + 'px';
  joystick.style.top = pos.y - joystick.offsetHeight/2 + 'px';
}

function move(dx, dy) {
  pos.x += dx;
  pos.y += dy;

  // Obmedzenie v rámci plochy
  pos.x = Math.max(0, Math.min(playarea.scrollWidth, pos.x));
  pos.y = Math.max(0, Math.min(playarea.scrollHeight, pos.y));

  // Scroll podľa pohybu ukazovákom
  playarea.scrollLeft = pos.x - playarea.clientWidth/2;
  playarea.scrollTop = pos.y - playarea.clientHeight/2;

  updateJoystick();
}

// Kliknutie tlačidlom X
document.getElementById('btnX').addEventListener('click', () => {
  const elem = document.elementFromPoint(pos.x, pos.y);
  if (elem) elem.click();
});

// Tlačidlo O - reset ukazovák do stredu
document.getElementById('btnO').addEventListener('click', () => {
  pos.x = playarea.clientWidth/2;
  pos.y = playarea.clientHeight/2;
  updateJoystick();
});

// Pohybové tlačidlá
document.getElementById('btnUp').addEventListener('click', () => move(0, -40));
document.getElementById('btnDown').addEventListener('click', () => move(0, 40));
document.getElementById('btnLeft').addEventListener('click', () => move(-40, 0));
document.getElementById('btnRight').addEventListener('click', () => move(40, 0));

updateJoystick();
</script>

</body>
</html>
