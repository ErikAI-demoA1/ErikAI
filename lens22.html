<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ErikAI Vision</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#101114;
  color:#fff;
  font-family:Arial,sans-serif
}
.app{
  max-width:700px;
  margin:auto;
  padding:16px
}
h1{margin:4px 0 3px}
.sub{color:#999;margin-bottom:15px}
.preview{
  position:relative;
  width:100%;
  aspect-ratio:4/3;
  border-radius:18px;
  overflow:hidden;
  background:#1b1d22;
  display:flex;
  align-items:center;
  justify-content:center
}
#image,#video{
  width:100%;
  height:100%;
  object-fit:contain;
  display:none
}
#placeholder{color:#777}
.controls{
  display:flex;
  gap:8px;
  margin:12px 0
}
button,.upload{
  flex:1;
  padding:13px 8px;
  border:0;
  border-radius:12px;
  background:#252830;
  color:#fff;
  font-size:15px;
  text-align:center
}
button:disabled{
  opacity:.45
}
.primary{background:#356df3}
.status{
  min-height:22px;
  color:#aaa;
  margin:12px 0
}
.result{
  display:none;
  background:#1b1d22;
  padding:15px;
  border-radius:16px
}
.result h2{margin:0 0 10px}
.item{
  padding:11px 0;
  border-bottom:1px solid #303238
}
.item:last-child{border:0}
.score{
  float:right;
  color:#72a0ff
}
.search{
  display:flex;
  gap:7px;
  margin-top:9px
}
.search a{
  flex:1;
  padding:9px;
  background:#292c34;
  border-radius:9px;
  color:#fff;
  text-decoration:none;
  text-align:center
}
.small{
  color:#666;
  font-size:12px;
  margin-top:14px
}
</style>
</head>

<body>

<div class="app">

<h1>👁️ ErikAI Vision</h1>
<div class="sub">Transformers.js • CLIP AI</div>

<div class="preview">
  <img id="image">
  <video id="video" autoplay playsinline></video>
  <span id="placeholder">📷 Vyber obrázok alebo zapni kameru</span>
</div>

<div class="controls">

<label class="upload">
🖼️ Fotka
<input id="file" type="file" accept="image/*" hidden>
</label>

<button id="camera">📷 Kamera</button>

<button id="snap" class="primary" hidden>
📸 Odfotiť
</button>

</div>

<button id="analyze" class="primary" disabled>
🤖 Analyzovať
</button>

<div id="status" class="status">
⏳ Pripravujem AI...
</div>

<div id="result" class="result"></div>

<div class="small">
ErikAI Vision Lite
</div>

</div>


<script type="module">

import {
  pipeline,
  env
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1/+esm";


// --------------------------------
// NASTAVENIE
// --------------------------------

env.useBrowserCache = true;
env.allowLocalModels = false;

const MODEL = "Xenova/clip-vit-base-patch32";


// --------------------------------
// ELEMENTY
// --------------------------------

const img = document.getElementById("image");
const video = document.getElementById("video");
const file = document.getElementById("file");
const camera = document.getElementById("camera");
const snap = document.getElementById("snap");
const analyze = document.getElementById("analyze");
const status = document.getElementById("status");
const result = document.getElementById("result");
const placeholder = document.getElementById("placeholder");

let ai = null;
let stream = null;
let readyImage = null;


// --------------------------------
// AI
// --------------------------------

async function loadAI(){

  status.textContent = "🤖 Načítavam CLIP model...";

  try{

    if(navigator.gpu){

      try{

        status.textContent =
          "⚡ Skúšam WebGPU...";

        ai = await pipeline(
          "zero-shot-image-classification",
          MODEL,
          {
            device:"webgpu"
          }
        );

        status.textContent =
          "✅ AI pripravená • WebGPU";

        return;

      }catch(e){

        console.warn(
          "WebGPU nefunguje, používam WASM:",
          e
        );

      }

    }

    status.textContent =
      "🧠 Načítavam WASM verziu...";

    ai = await pipeline(
      "zero-shot-image-classification",
      MODEL
    );

    status.textContent =
      "✅ AI pripravená • WASM";

  }catch(e){

    console.error(e);

    status.textContent =
      "❌ AI sa nepodarilo načítať: " +
      (e.message || e);

  }

}

loadAI();


// --------------------------------
// ZOBRAZENIE OBRÁZKU
// --------------------------------

function showImage(src){

  img.src = src;

  img.onload = ()=>{

    img.style.display = "block";
    video.style.display = "none";
    placeholder.style.display = "none";

    readyImage = img;

    analyze.disabled = false;

    result.style.display = "none";

  };

}


// --------------------------------
// UPLOAD
// --------------------------------

file.addEventListener("change",e=>{

  const f = e.target.files[0];

  if(!f)return;

  const url = URL.createObjectURL(f);

  showImage(url);

  if(stream){

    stream.getTracks().forEach(
      t=>t.stop()
    );

    stream = null;

  }

  camera.textContent = "📷 Kamera";
  snap.hidden = true;

});


// --------------------------------
// KAMERA
// --------------------------------

camera.onclick = async()=>{

  if(stream){

    stream.getTracks().forEach(
      t=>t.stop()
    );

    stream = null;

    video.style.display = "none";
    img.style.display = "block";

    snap.hidden = true;
    camera.textContent = "📷 Kamera";

    return;

  }

  try{

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          }
        },

        audio:false

      });

    video.srcObject = stream;

    img.style.display = "none";
    video.style.display = "block";
    placeholder.style.display = "none";

    snap.hidden = false;
    camera.textContent = "✖ Zavrieť";

  }catch(e){

    console.error(e);

    status.textContent =
      "❌ Kamera: " +
      (e.message || "nedostupná");

  }

};


// --------------------------------
// ODFOTENIE
// --------------------------------

snap.onclick = ()=>{

  if(!stream)return;

  const canvas =
    document.createElement("canvas");

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  showImage(
    canvas.toDataURL(
      "image/jpeg",
      .9
    )
  );

  stream.getTracks().forEach(
    t=>t.stop()
  );

  stream = null;

  snap.hidden = true;
  camera.textContent = "📷 Kamera";

};


// --------------------------------
// PREVOD OBRÁZKU NA CANVAS
// --------------------------------

async function imageToCanvas(){

  if(!readyImage)
    throw new Error(
      "Obrázok nie je pripravený."
    );

  await new Promise((resolve,reject)=>{

    if(readyImage.complete)
      resolve();
    else{
      readyImage.onload = resolve;
      readyImage.onerror = reject;
    }

  });

  const max = 1024;

  let w = readyImage.naturalWidth;
  let h = readyImage.naturalHeight;

  if(!w || !h)
    throw new Error(
      "Nepodarilo sa načítať rozmery obrázka."
    );

  const scale =
    Math.min(1,max/Math.max(w,h));

  w = Math.round(w*scale);
  h = Math.round(h*scale);

  const canvas =
    document.createElement("canvas");

  canvas.width = w;
  canvas.height = h;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    readyImage,
    0,
    0,
    w,
    h
  );

  return canvas;

}


// --------------------------------
// KANDIDÁTI
// --------------------------------

const labels = [

  "a person",

  "a car",
  "a motorcycle",
  "a bicycle",
  "a truck",
  "a bus",

  "a smartphone",
  "a mobile phone",
  "a laptop",
  "a computer",
  "a television",
  "a camera",

  "a watch",
  "a shoe",
  "a backpack",

  "a chair",
  "a table",
  "a sofa",

  "a dog",
  "a cat",
  "a bird",
  "a horse",

  "food",
  "fruit",
  "a flower",

  "a house",
  "a building",

  "a book",
  "a bottle",
  "a cup",

  "a tool",
  "electronics",
  "a toy",
  "clothing",

  "an object"
];


// --------------------------------
// ANALÝZA
// --------------------------------

analyze.onclick = async()=>{

  if(!ai){

    status.textContent =
      "⏳ AI ešte nie je pripravená.";

    return;

  }

  if(!readyImage){

    status.textContent =
      "📷 Najprv vyber obrázok.";

    return;

  }

  analyze.disabled = true;

  result.style.display = "none";

  status.textContent =
    "🧠 AI analyzuje...";

  try{

    const canvas =
      await imageToCanvas();

    console.log(
      "Canvas:",
      canvas.width,
      canvas.height
    );

    const output =
      await ai(
        canvas,
        labels
      );

    console.log(
      "CLIP výsledok:",
      output
    );

    showResults(output);

    status.textContent =
      "✅ Analýza dokončená.";

  }catch(e){

    console.error(
      "ANALÝZA ERROR:",
      e
    );

    status.textContent =
      "❌ Analýza zlyhala: " +
      (e.message || e);

  }

  analyze.disabled = false;

};


// --------------------------------
// VÝSLEDKY
// --------------------------------

function showResults(data){

  result.innerHTML =
    "<h2>🔎 AI výsledok</h2>";

  data
    .slice(0,5)
    .forEach((x,i)=>{

      const name =
        x.label
          .replace(/^a /,"")
          .replace(/^an /,"");

      const score =
        (x.score*100).toFixed(1);

      const item =
        document.createElement("div");

      item.className = "item";

      item.innerHTML = `

        <b>${i+1}. ${name}</b>

        <span class="score">
          ${score}%
        </span>

        <div class="search">

          <a
            target="_blank"
            href="https://www.google.com/search?q=${encodeURIComponent(name)}"
          >
            🔎 Hľadať
          </a>

          <a
            target="_blank"
            href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(name)}"
          >
            🖼️ Obrázky
          </a>

        </div>

      `;

      result.appendChild(item);

    });

  result.style.display = "block";

}

</script>

</body>
</html>
