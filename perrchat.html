<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI Peer Chat – Jeden klik</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; text-align: center; }
  h2 { color: #1a73e8; }
  textarea, input[type=text] { width: 100%; padding: 10px; margin-bottom: 10px; font-size: 1rem; }
  button { padding: 10px 20px; margin: 5px; border: none; border-radius: 5px; background: #1a73e8; color: white; cursor: pointer; font-weight: bold; }
  button:hover { background: #1558a5; }
  .log { height: 200px; overflow-y: auto; border: 1px solid #ccc; background: #fff; padding: 10px; margin-top: 10px; text-align: left; }
  .status { font-weight: bold; margin: 10px 0; }
</style>
</head>
<body>

<h2>💬 ErikAI Peer Chat</h2>

<p class="status" id="status">❌ Zatiaľ nie ste spojení</p>

<!-- Kód na pripojenie -->
<button onclick="vytvorKod()">🔐 Generovať a skopírovať kód</button>
<textarea id="kod" placeholder="Tu sa zobrazí kód..." readonly></textarea>

<input type="text" id="vlozKod" placeholder="Sem vlož kód od kamoša">
<button onclick="pripojSa()">🔓 Pripojiť sa k priateľovi</button>

<input type="text" id="sprava" placeholder="Napíš správu...">
<button onclick="odosliSpravu()">✉️ Poslať správu</button>

<div class="log" id="chat"></div>

<script>
let pc, dc, spojene = false;

// Automatické nastavenie chatu
function nastavChat() {
  dc.onopen = () => {
    spojene = true;
    document.getElementById("status").textContent = "✅ Ste spojení!";
    document.getElementById("status").style.color = "green";
  };
  dc.onmessage = e => {
    const chat = document.getElementById("chat");
    chat.innerHTML += `<div><b>🟢 Kamoš:</b> ${e.data}</div>`;
    chat.scrollTop = chat.scrollHeight;
  };
}

// Generovanie kódu
async function vytvorKod() {
  pc = new RTCPeerConnection();
  dc = pc.createDataChannel("chat");
  nastavChat();

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  const kod = btoa(JSON.stringify(offer));
  document.getElementById("kod").value = kod;

  // Automaticky skopíruj do schránky
  navigator.clipboard.writeText(kod).then(() => {
    alert("Kód skopírovaný do schránky! Pošli ho kamoškovi.");
  });
}

// Pripojenie sa k priateľovi
async function pripojSa() {
  const vlozenyKod = document.getElementById("vlozKod").value;
  if (!vlozenyKod) return alert("Sem vlož kód od kamoša!");
  const offer = JSON.parse(atob(vlozenyKod));

  pc = new RTCPeerConnection();
  pc.ondatachannel = e => { dc = e.channel; nastavChat(); };
  await pc.setRemoteDescription(offer);

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  // Automaticky skopírovať answer kód a pošli späť prvému
  const kodAnswer = btoa(JSON.stringify(answer));
  navigator.clipboard.writeText(kodAnswer).then(() => {
    alert("✅ Pripojenie pripravené! Skopíruj a pošli spätný kód prvému kamarátovi.");
  });
}

// Posielanie správ
function odosliSpravu() {
  const sprava = document.getElementById("sprava").value;
  if (!spojene) return alert("Najprv sa pripojte k priateľovi!");
  dc.send(sprava);
  const chat = document.getElementById("chat");
  chat.innerHTML += `<div><b>🔵 Ty:</b> ${sprava}</div>`;
  chat.scrollTop = chat.scrollHeight;
  document.getElementById("sprava").value = "";
}
</script>

</body>
</html>
