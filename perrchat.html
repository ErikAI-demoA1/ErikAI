<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI QR Peer Chat</title>
<style>
  body { font-family: sans-serif; padding: 20px; text-align: center; background: #f4f4f4; }
  #qr { margin: 20px auto; }
  #chat { width: 100%; height: 200px; border: 1px solid #ccc; overflow-y: auto; margin-bottom: 10px; padding: 5px; background: white; }
  #message { width: 80%; padding: 5px; }
  button { padding: 10px 15px; margin: 5px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<h2>ErikAI QR Peer Chat</h2>
<div>
  <button onclick="generateOffer()">🔐 Vytvoriť QR pre spojenie</button>
</div>
<div id="qr"></div>

<div id="chat"></div>
<input type="text" id="message" placeholder="Napíš správu...">
<button onclick="sendMessage()">✉️ Poslať</button>

<script>
let pc, dc;

// Vytvorenie QR a offer
async function generateOffer() {
  pc = new RTCPeerConnection();
  dc = pc.createDataChannel("chat");
  setupChat();

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  const offerStr = btoa(JSON.stringify(offer));
  document.getElementById("qr").innerHTML = "";
  new QRCode(document.getElementById("qr"), offerStr);

  pc.onicecandidate = event => {
    if (event.candidate) return;
    // Offer už kompletný
  };
}

// Druhý používateľ naskenuje QR a nastaví answer
async function connectWithOffer(offerStr) {
  const offer = JSON.parse(atob(offerStr));
  pc = new RTCPeerConnection();
  pc.ondatachannel = e => { dc = e.channel; setupChat(); };

  await pc.setRemoteDescription(offer);
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  const answerStr = btoa(JSON.stringify(answer));
  prompt("Pošli tento spätný QR kód naspäť prvému používateľovi (A) alebo ho nechaj vygenerovať QR)", answerStr);
}

// Chat
function setupChat() {
  dc.onopen = () => alert("✅ Spojenie aktívne!");
  dc.onmessage = e => {
    document.getElementById("chat").innerHTML += `<div><b>Partner:</b> ${e.data}</div>`;
  };
}

function sendMessage() {
  const msg = document.getElementById("message").value;
  if (!dc || dc.readyState !== "open") { alert("Spojenie nie je otvorené!"); return; }
  dc.send(msg);
  document.getElementById("chat").innerHTML += `<div><b>Ty:</b> ${msg}</div>`;
  document.getElementById("message").value = "";
}
</script>

</body>
</html>
