<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI QR Peer Chat – Jednoduchý</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f4; }
  #qr { margin: 20px auto; }
  #chat { width: 100%; height: 200px; border: 1px solid #ccc; overflow-y: auto; margin-bottom: 10px; padding: 5px; background: white; }
  #message { width: 80%; padding: 5px; }
  button { padding: 10px 15px; margin: 5px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<h2>ErikAI QR Peer Chat</h2>

<div>
  <button onclick="generateOffer()">🔐 Vytvoriť QR pre spojenie</button>
</div>
<div id="qr"></div>

<div>
  <input type="text" id="offerInput" placeholder="Sem vlož kód od kamaráta">
  <button onclick="connectWithOffer()">🔓 Pripojiť sa</button>
</div>

<div id="chat"></div>
<input type="text" id="message" placeholder="Napíš správu...">
<button onclick="sendMessage()">✉️ Poslať</button>

<script>
let pc, dc;

// Funkcia na vytvorenie QR kódu s krátkym tokenom
async function generateOffer() {
  pc = new RTCPeerConnection();
  dc = pc.createDataChannel("chat");
  setupChat();

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  // Vygenerujeme krátky token pre jednoduché QR
  const shortToken = btoa(JSON.stringify({ type: offer.type, sdp: offer.sdp.slice(0, 200) }));
  document.getElementById("qr").innerHTML = "";
  new QRCode(document.getElementById("qr"), shortToken);

  pc.onicecandidate = event => {
    if (!event.candidate) return;
  };

  alert("✅ QR kód pripravený na skenovanie!");
}

// Funkcia pre druhú stranu (vložiť token)
async function connectWithOffer() {
  const token = document.getElementById("offerInput").value.trim();
  if (!token) return alert("Zadaj kód!");

  const offerData = JSON.parse(atob(token));
  pc = new RTCPeerConnection();
  pc.ondatachannel = e => { dc = e.channel; setupChat(); };

  await pc.setRemoteDescription({ type: offerData.type, sdp: offerData.sdp + '...' }); // doplníme skrátené
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  alert("✅ Spojenie pripravené! Odosiel správy.");
}

// Chat
function setupChat() {
  dc.onopen = () => alert("✅ Spojenie aktívne!");
  dc.onmessage = e => document.getElementById("chat").innerHTML += `<div><b>Partner:</b> ${e.data}</div>`;
}

function sendMessage() {
  const msg = document.getElementById("message").value;
  if (!dc || dc.readyState !== "open") { alert("Spojenie nie je otvorené!"); return; }
  dc.send(msg);
  document.getElementById("chat").innerHTML += `<div><b>Ty:</b> ${msg}</div>`;
  document.getElementById("message").value = "";
}
</script>

</body>
</html>
