<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI QR Pozvánka Kontakt</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; background: #f9f9f9; padding: 2rem; }
  body.dark-mode { background: #121212; color: white; }
  input, textarea { width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
  button { padding: 10px 20px; font-weight: bold; border: none; border-radius: 5px; background: #1a73e8; color: white; cursor: pointer; }
  button:hover { background: #1558a5; }
  #qrcode { margin-top: 20px; }
</style>
</head>
<body>

<h1>📲 ErikAI QR Kontakt</h1>

<button onclick="toggleTheme()">🌓 Zmeniť režim</button>

<div>
  <input type="text" id="kontaktMeno" placeholder="Meno kontaktu">
  <textarea id="pozvankaText" placeholder="Správa / pozvánka na kontakt (Messenger, WhatsApp...)"></textarea>
  <br>
  <button onclick="generujQR()">🖨 Generovať QR kód</button>
</div>

<div id="qrcode"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<script>
function toggleTheme() { document.body.classList.toggle('dark-mode'); }

function generujQR() {
  const meno = document.getElementById('kontaktMeno').value.trim();
  const sprava = document.getElementById('pozvankaText').value.trim();
  if (!meno || !sprava) return alert("❌ Vyplň meno aj správu!");

  const data = `Kontakt: ${meno}\nPozvánka: ${sprava}`;
  const qrContainer = document.getElementById('qrcode');
  qrContainer.innerHTML = "";
  
  QRCode.toCanvas(qrContainer, data, { width: 220, margin: 2 }, function(error) {
    if (error) console.error(error);
    else console.log('✅ QR kód vygenerovaný!');
  });
}
</script>

</body>
</html>
