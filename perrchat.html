<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI QR Kontakt</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; background: #f9f9f9; padding: 2rem; }
  body.dark-mode { background: #121212; color: white; }
  input, textarea { width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
  button { padding: 10px 20px; font-weight: bold; border: none; border-radius: 5px; background: #1a73e8; color: white; cursor: pointer; margin: 5px;}
  button:hover { background: #1558a5; }
  canvas { margin-top: 20px; border: 1px solid #ccc; }
</style>
</head>
<body>

<h1>📲 ErikAI QR Kontakt</h1>

<button onclick="toggleTheme()">🌓 Zmeniť režim</button>

<div>
  <input type="text" id="kontaktMeno" placeholder="Meno kontaktu">
  <textarea id="pozvankaText" placeholder="Správa / pozvánka na kontakt (Messenger, WhatsApp...)"></textarea>
  <br>
  <button onclick="generujQR()">🖨 Generovať QR kód</button>
  <button onclick="stiahniQR()">💾 Stiahnuť QR</button>
  <button onclick="zdieľajQR()">📤 Zdieľať QR</button>
</div>

<canvas id="qrcode"></canvas>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<script>
function toggleTheme() { document.body.classList.toggle('dark-mode'); }

function generujQR() {
  const meno = document.getElementById('kontaktMeno').value.trim();
  const sprava = document.getElementById('pozvankaText').value.trim();
  if (!meno || !sprava) return alert("❌ Vyplň meno aj správu!");

  const data = `Kontakt: ${meno}\nPozvánka: ${sprava}`;
  const qrCanvas = document.getElementById('qrcode');

  QRCode.toCanvas(qrCanvas, data, { width: 220, margin: 2 }, function(error) {
    if (error) {
      console.error(error);
      alert("❌ Chyba pri generovaní QR kódu!");
    }
  });
}

// Stiahnuť QR kód
function stiahniQR() {
  const canvas = document.getElementById('qrcode');
  const url = canvas.toDataURL("image/png");
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ErikAI_QR.png';
  a.click();
}

// Zdieľať QR kód (ak prehliadač podporuje)
async function zdieľajQR() {
  if (!navigator.canShare || !navigator.canShare()) {
    alert("📱 Zdieľanie nie je podporované týmto prehliadačom.");
    return;
  }
  const canvas = document.getElementById('qrcode');
  canvas.toBlob(async function(blob) {
    try {
      await navigator.share({
        files: [new File([blob], 'ErikAI_QR.png', { type: 'image/png' })],
        title: 'ErikAI QR Kontakt',
        text: 'Pozri si môj QR kód na kontakt!'
      });
    } catch (err) {
      console.error(err);
    }
  });
}
</script>

</body>
</html>
