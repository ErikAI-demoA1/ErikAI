<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🎨 ErikAI Kreslenie — Profi</title>
<style>
  :root{
    --bg:#071026; --panel:#0f1724; --muted:#94a3b8; --accent1:#34d399; --accent2:#60a5fa; --danger:#ef4444;
    --card: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  }
  html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#071026,#071022);color:#e6eef6}
  .app{max-width:1200px;margin:18px auto;padding:18px;border-radius:12px;background:var(--card);box-shadow:0 8px 30px rgba(0,0,0,0.6)}
  header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .brand{display:flex;gap:12px;align-items:center}
  .logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#ef4444,#fb923c);display:flex;align-items:center;justify-content:center;font-weight:800;color:white}
  h1{margin:0;font-size:18px}
  .meta{color:var(--muted);font-size:13px}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .toolbar{display:flex;gap:8px;align-items:center;padding:10px;border-radius:10px;background:rgba(255,255,255,0.02)}
  .toolbtn{background:transparent;border:1px solid rgba(255,255,255,0.06);color:inherit;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600}
  .toolbtn.active{background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#041014;border:1px solid rgba(255,255,255,0.06)}
  .right{display:flex;gap:8px;align-items:center}
  .canvas-wrap{display:flex;gap:18px;margin-top:18px;flex-wrap:wrap}
  .left-col{flex:1;min-width:320px;display:flex;flex-direction:column;gap:10px}
  .canvas-box{background:#071425;border-radius:10px;padding:12px;display:flex;flex-direction:column;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,0.5);position:relative}
  canvas{background:white;border-radius:6px;display:block;touch-action:none}
  #mainCanvas{position:absolute; left:12px; top:86px; pointer-events:none;} /* key fix */
  .props{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:8px}
  label{font-size:13px;color:var(--muted)}
  input[type=number],input[type=text],select{padding:6px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit}
  .small{font-size:13px;color:var(--muted)}
  .panel{background:rgba(255,255,255,0.02);padding:10px;border-radius:10px}
  .right-col{width:320px;min-width:260px;display:flex;flex-direction:column;gap:10px}
  .list{background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;min-height:120px}
  button.primary{background:linear-gradient(90deg,var(--accent1),var(--accent2));border:none;padding:8px 10px;border-radius:8px;color:#041014;font-weight:800;cursor:pointer}
  button.warn{background:var(--danger);border:none;padding:8px 10px;border-radius:8px;color:white;cursor:pointer}
  footer{margin-top:12px;color:var(--muted);font-size:13px;text-align:center}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:9999}
  .modal{background:#0b1220;color:#e6eef6;padding:18px;border-radius:10px;width:320px;box-shadow:0 12px 40px rgba(0,0,0,0.6)}
  .modal input, .modal label{display:block;width:100%;margin:8px 0}
  .selinfo pre{white-space:pre-wrap;font-size:13px;color:var(--muted)}
  @media (max-width:900px){ .right-col{width:100%} .canvas-wrap{flex-direction:column} .canvas-box{padding:8px} }
</style>
</head>
<body>
<div class="app" role="application">
  <header>
    <div class="brand">
      <div class="logo">EA</div>
      <div>
        <h1>🎨 ErikAI Kreslenie — Profi</h1>
        <div class="meta">Tvary, text, kreslenie, guma, uloženie, export PNG — všetko lokálne</div>
      </div>
    </div>
    <div class="right">
      <div class="meta" id="cas">🕓 …</div>
      <button class="toolbtn" id="themeToggle" title="Tmavý / Svetlý">🌓</button>
    </div>
  </header>

  <div class="controls">
    <div class="toolbar panel">
      <button class="toolbtn" id="selectBtn">Select</button>
      <button class="toolbtn" id="drawBtn">Draw</button>
      <button class="toolbtn" id="eraserBtn">Guma</button>
      <button class="toolbtn" id="rectBtn">Rect</button>
      <button class="toolbtn" id="circleBtn">Circle</button>
      <button class="toolbtn" id="lineBtn">Line</button>
      <button class="toolbtn" id="textBtn">Text</button>
      <button class="toolbtn" id="deleteBtn">Delete</button>
      <button class="toolbtn" id="lockBtn">Lock</button>
    </div>

    <div class="panel props">
      <label>Farba: <input type="color" id="color" value="#ff0000"></label>
      <label>Hrúbka: <input type="range" id="size" min="1" max="40" value="5"></label>
      <label>Text veľkosť: <input type="number" id="fontSize" min="8" max="72" value="20" style="width:80px"></label>
      <label>Plátno — W: <input type="number" id="canvasW" value="800" style="width:90px"> H: <input type="number" id="canvasH" value="500" style="width:90px"></label>
      <button class="primary" id="setCanvasBtn">Nastaviť plátno</button>
    </div>

    <div class="panel props" style="margin-left:auto">
      <button id="saveBtn" class="primary">💾 Uložiť</button>
      <button id="loadBtn" class="toolbtn">📂 Načítať</button>
      <button id="exportBtn" class="primary">⬇ Export PNG</button>
      <button id="clearBtn" class="warn">🧹 Vyčistiť</button>
    </div>
  </div>

  <div class="canvas-wrap">
    <div class="left-col">
      <div class="canvas-box" id="canvasBox">
        <canvas id="rasterCanvas" width="800" height="500"></canvas>
        <canvas id="mainCanvas" width="800" height="500"></canvas>
        <div style="width:100%;display:flex;justify-content:center;margin-top:10px">
          <div class="small" id="status">Nástroj: Select</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ======= JS skript (upravený) ======= */
const raster = document.getElementById('rasterCanvas');
const main = document.getElementById('mainCanvas');
const rCtx = raster.getContext('2d');
const mCtx = main.getContext('2d');

let tool='select';
let color='#ff0000', sizeVal=5, fontSizeVal=20;
let drawing=false, currentStroke=null;

document.getElementById('drawBtn').addEventListener('click',()=>tool='draw');
document.getElementById('eraserBtn').addEventListener('click',()=>tool='eraser');

function getPos(e){
  const rect = raster.getBoundingClientRect();
  const x = (e.clientX - rect.left)*(raster.width/rect.width);
  const y = (e.clientY - rect.top)*(raster.height/rect.height);
  return {x,y};
}

raster.addEventListener('pointerdown', e=>{
  const p = getPos(e);
  if(tool==='draw'){ drawing=true; currentStroke={color,size:sizeVal,points:[p]}; }
  else if(tool==='eraser'){ drawing=true; rCtx.globalCompositeOperation='destination-out'; rCtx.beginPath(); rCtx.arc(p.x,p.y,sizeVal*1.2,0,Math.PI*2); rCtx.fill(); rCtx.globalCompositeOperation='source-over'; }
});

raster.addEventListener('pointermove', e=>{
  if(!drawing) return;
  const p = getPos(e);
  if(tool==='draw'){
    const pts=currentStroke.points; const last=pts[pts.length-1]; pts.push(p);
    rCtx.save(); rCtx.lineJoin=rCtx.lineCap='round'; rCtx.strokeStyle=currentStroke.color; rCtx.lineWidth=currentStroke.size;
    rCtx.beginPath(); rCtx.moveTo(last.x,last.y); rCtx.lineTo(p.x,p.y); rCtx.stroke(); rCtx.restore();
  } else if(tool==='eraser'){
    rCtx.save(); rCtx.globalCompositeOperation='destination-out'; rCtx.beginPath(); rCtx.arc(p.x,p.y,sizeVal*1.2,0,Math.PI*2); rCtx.fill(); rCtx.restore();
  }
});

window.addEventListener('pointerup', ()=>{ drawing=false; });

</script>
</body>
  </html>
