<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎨 ErikAI Kreslenie — Jedno plátno</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#071026;color:#e6eef6;display:flex;flex-direction:column;align-items:center;padding:10px}
canvas{background:white;border:1px solid #333;border-radius:6px;touch-action:none}
.toolbar{margin:10px;display:flex;gap:8px;flex-wrap:wrap}
.toolbtn{padding:6px 10px;border:none;border-radius:6px;cursor:pointer;background:#0f1724;color:white;font-weight:600}
.toolbtn.active{background:#34d399;color:#041014}
.props{margin:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>

<h1>🎨 ErikAI — Jedno plátno</h1>

<div class="toolbar">
  <button class="toolbtn" id="drawBtn">Kresliť</button>
  <button class="toolbtn" id="eraserBtn">Guma</button>
  <button class="toolbtn" id="rectBtn">Obdĺžnik</button>
  <button class="toolbtn" id="circleBtn">Kruh</button>
  <button class="toolbtn" id="lineBtn">Čiara</button>
  <button class="toolbtn" id="textBtn">Text</button>
  <button class="toolbtn" id="selectBtn">Select</button>
  <button class="toolbtn" id="deleteBtn">Zmazať</button>
</div>

<div class="props">
  <label>Farba: <input type="color" id="color" value="#ff0000"></label>
  <label>Hrúbka: <input type="range" id="size" min="1" max="40" value="5"></label>
  <label>Text veľkosť: <input type="number" id="fontSize" min="8" max="72" value="20"></label>
</div>

<canvas id="canvas" width="800" height="500"></canvas>

<div class="props">
  <button id="clearBtn">Vyčistiť</button>
  <button id="exportBtn">Export PNG</button>
  <button id="saveBtn">Uložiť</button>
  <button id="loadBtn">Načítať</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let tool = 'draw';
let color = '#ff0000';
let size = 5;
let fontSize = 20;

let drawing = false;
let startX=0, startY=0;
let objects = []; // tvary a text
let selectedId = null;

function setTool(t){
  tool=t;
  document.querySelectorAll('.toolbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById(t+'Btn')?.classList.add('active');
}
setTool('draw');

document.getElementById('drawBtn').onclick = ()=>setTool('draw');
document.getElementById('eraserBtn').onclick = ()=>setTool('eraser');
document.getElementById('rectBtn').onclick = ()=>setTool('rect');
document.getElementById('circleBtn').onclick = ()=>setTool('circle');
document.getElementById('lineBtn').onclick = ()=>setTool('line');
document.getElementById('textBtn').onclick = ()=>setTool('text');
document.getElementById('selectBtn').onclick = ()=>setTool('select');
document.getElementById('deleteBtn').onclick = ()=>{
  if(selectedId!==null){ objects = objects.filter(o=>o.id!==selectedId); selectedId=null; renderAll(); }
};

document.getElementById('color').oninput = e=>color=e.target.value;
document.getElementById('size').oninput = e=>size=parseInt(e.target.value);
document.getElementById('fontSize').oninput = e=>fontSize=parseInt(e.target.value);

function genId(){ return 'o_'+Math.random().toString(36).substr(2,9); }

canvas.addEventListener('pointerdown', e=>{
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left);
  const y = (e.clientY - rect.top);
  startX = x; startY = y;

  if(tool==='draw' || tool==='eraser'){ drawing=true; }
  else if(tool==='text'){
    const txt = prompt('Napíš text:','');
    if(txt){ objects.push({id:genId(),type:'text',x,y,text:txt,color,fontSize}); renderAll(); }
  } else if(tool==='select'){
    selectedId = objects.findIndex(o=>{
      if(o.type==='rect') return x>=o.x && x<=o.x+o.w && y>=o.y && y<=o.y+o.h;
      if(o.type==='circle'){ const dx=x-(o.x+o.r); const dy=y-(o.y+o.r); return dx*dx+dy*dy<=o.r*o.r; }
      if(o.type==='line'){ const d = pointToSegmentDistance({x,y},{x:o.x,y:o.y},{x:o.x2,y:o.y2}); return d<=Math.max(6,o.size||4); }
      if(o.type==='text'){ ctx.font = o.fontSize+'px Arial'; const w=ctx.measureText(o.text).width; const h=o.fontSize*1.2; return x>=o.x && x<=o.x+w && y>=o.y-h && y<=o.y; }
      return false;
    });
    if(selectedId!==-1) selectedId=objects[selectedId].id; else selectedId=null;
  }
});

canvas.addEventListener('pointermove', e=>{
  if(!drawing) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left);
  const y = (e.clientY - rect.top);

  if(tool==='draw'){
    ctx.strokeStyle=color;
    ctx.lineWidth=size;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(startX,startY);
    ctx.lineTo(x,y);
    ctx.stroke();
    startX=x; startY=y;
  } else if(tool==='eraser'){
    ctx.clearRect(x-size,y-size,size*2,size*2);
  }
});

canvas.addEventListener('pointerup', e=>{
  drawing=false;
  if(tool==='rect' || tool==='circle' || tool==='line'){
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left);
    const y = (e.clientY - rect.top);
    if(tool==='rect') objects.push({id:genId(),type:'rect',x:startX,y:startY,w:x-startX,h:y-startY,color,size});
    if(tool==='circle'){ const r=Math.sqrt((x-startX)**2+(y-startY)**2); objects.push({id:genId(),type:'circle',x:startX,y:startY,r,color,size}); }
    if(tool==='line') objects.push({id:genId(),type:'line',x:startX,y:startY,x2:x,y2:y,color,size});
    renderAll();
  }
});

function renderAll(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const o of objects){
    ctx.lineWidth=o.size||size;
    ctx.strokeStyle=o.color||color;
    ctx.fillStyle=o.color||color;
    if(o.type==='rect'){ ctx.strokeRect(o.x,o.y,o.w,o.h); }
    else if(o.type==='circle'){ ctx.beginPath(); ctx.arc(o.x+o.r,o.y+o.r,o.r,0,Math.PI*2); ctx.stroke(); }
    else if(o.type==='line'){ ctx.beginPath(); ctx.moveTo(o.x,o.y); ctx.lineTo(o.x2,o.y2); ctx.stroke(); }
    else if(o.type==='text'){ ctx.font=o.fontSize+'px Arial'; ctx.fillText(o.text,o.x,o.y); }
    if(selectedId===o.id){ ctx.save(); ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.setLineDash([5,5]);
      if(o.type==='rect') ctx.strokeRect(o.x-4,o.y-4,o.w+8,o.h+8);
      else if(o.type==='circle') ctx.strokeRect(o.x- o.r -4, o.y- o.r -4, o.r*2+8, o.r*2+8);
      else if(o.type==='line') ctx.strokeRect(Math.min(o.x,o.x2)-4, Math.min(o.y,o.y2)-4, Math.abs(o.x2-o.x)+8, Math.abs(o.y2-o.y)+8);
      else if(o.type==='text'){ const w=ctx.measureText(o.text).width; const h=o.fontSize*1.2; ctx.strokeRect(o.x-4,o.y-h-4,w+8,h+8); }
      ctx.restore();
    }
  }
}

function pointToSegmentDistance(p,a,b){
  const vx=b.x-a.x, vy=b.y-a.y;
  const wx=p.x-a.x, wy=p.y-a.y;
  const c=(vx*wx+vy*wy)/(vx*vx+vy*vy||1);
  const t=Math.max(0,Math.min(1,c));
  const proj={x:a.x+vx*t,y:a.y+vy*t};
  const dx=p.x-proj.x, dy=p.y-proj.y;
  return Math.sqrt(dx*dx+dy*dy);
}

document.getElementById('clearBtn').onclick = ()=>{
  if(confirm('Vymazať plátno?')){ ctx.clearRect(0,0,canvas.width,canvas.height); objects=[]; selectedId=null; }
};

document.getElementById('exportBtn').onclick = ()=>{
  const link = document.createElement('a');
  link.href = canvas.toDataURL('image/png');
  link.download = 'erikai_canvas.png';
  link.click();
};

document.getElementById('saveBtn').onclick = ()=>{
  const name = prompt('Názov projektu','projekt1'); if(!name) return;
  const data = {objects, image: canvas.toDataURL()};
  localStorage.setItem('erikai_'+name, JSON.stringify(data));
  alert('Uložené: '+name);
};

document.getElementById('loadBtn').onclick = ()=>{
  const keys = Object.keys(localStorage).filter(k=>k.startsWith('erikai_'));
  if(keys.length===0){ alert('Žiadne uložené projekty'); return; }
  const name = prompt('Názov projektu na načítanie:\n'+keys.join('\n'), keys[0]);
  if(!name) return;
  const raw = localStorage.getItem(name); 
  if(!raw) return alert('Projekt nenájdený');
  const data = JSON.parse(raw);
  objects = data.objects||[];
  const img = new Image();
  img.onload = ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); renderAll(); };
  img.src = data.image||'';
};
</script>
</body>
</html>
