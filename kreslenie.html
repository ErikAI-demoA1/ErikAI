<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erakai - Kresliaca App (ISO Formáty & Vektory)</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #071026 0%, #0d1b3e 100%);
      --panel-bg: rgba(255, 255, 255, 0.04);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text-color: #e6eef6;
      --accent: #3b82f6;
    }
    .light-mode {
      --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #d9e4ff 100%);
      --panel-bg: rgba(0, 0, 0, 0.03);
      --panel-border: rgba(0, 0, 0, 0.08);
      --text-color: #0b1220;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
      background: var(--bg-gradient);
      color: var(--text-color);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .container { 
      display: flex; 
      flex-direction: column;
      gap: 16px; 
      max-width: 1400px; 
      width: 100%;
      margin: 0 auto;
    }
    
    @media (min-width: 900px) {
      .container {
        flex-direction: row;
        align-items: flex-start;
      }
      .sidebar { 
        width: 320px; 
        flex-shrink: 0; 
      }
      .main-area {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 600px;
      }
    }
    
    .panel { 
      background: var(--panel-bg); 
      backdrop-filter: blur(12px);
      border-radius: 14px; 
      padding: 14px; 
      margin-bottom: 12px; 
      border: 1px solid var(--panel-border); 
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    
    h3 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      opacity: 0.9;
    }

    .toolbtn { 
      background: rgba(255,255,255,0.06); 
      border: 1px solid var(--panel-border); 
      color: inherit; 
      padding: 9px 12px; 
      border-radius: 8px; 
      cursor: pointer; 
      margin: 2px; 
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
      font-size: 13px;
      font-weight: 500;
      flex: 1;
      min-width: 65px;
      text-align: center;
    }
    .toolbtn:hover { background: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.4); }
    .toolbtn.active { background: var(--accent); border-color: var(--accent); color: white; box-shadow: 0 0 12px rgba(59,130,246,0.4); }
    
    /* CANVAS CONTAINER WITH DYNAMIC ASPECT RATIO */
    .canvas-container { 
      position: relative; 
      background: white; 
      border-radius: 12px; 
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border: 1px solid var(--panel-border);
      width: 100%;
      max-width: 850px;
      max-height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    #raster, #main { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #raster { z-index: 1; }
    #main { z-index: 2; background: transparent; }
    
    input[type="color"] { width: 44px; height: 32px; border: none; border-radius: 6px; cursor: pointer; background: transparent; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    input[type="number"], select { background: rgba(0,0,0,0.2); border: 1px solid var(--panel-border); color: inherit; padding: 6px; border-radius: 6px; text-align: center; font-size: 13px; width: 100%; }
    .light-mode input[type="number"], .light-mode select { background: rgba(0,0,0,0.05); color: #000; }
    option { background: #111827; color: white; }

    .small { font-size: 12px; opacity: 0.8; }
    pre { background: rgba(0,0,0,0.25); padding: 8px; border-radius: 6px; overflow: auto; max-height: 120px; font-size: 11px; font-family: monospace; }
    .light-mode pre { background: rgba(0,0,0,0.06); }
    
    #modalBg {
      display: none; position: fixed; top:0; left:0; width:100%; height:100%; 
      background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center;
      padding: 20px;
    }
    .modal { 
      background: #111827; 
      color: #f3f4f6; 
      padding: 24px; 
      border-radius: 16px; 
      width: 100%;
      max-width: 320px; 
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; background: rgba(0,0,0,0.3); color: white; }
    
    .tools-row { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 6px; 
      margin-bottom: 8px;
    }
    
    .mobile-warning {
      display: none;
      background: #f59e0b;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
    }
    @media (max-width: 767px) { .mobile-warning { display: block; } }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 4px; }
  </style>
</head>
<body>
  <div class="mobile-warning">
    💡 Pre lepšiu prácu otoč zariadenie na šírku
  </div>
  
  <div class="container">
    <div class="sidebar">
      <div class="panel">
        <h3>Nástroje</h3>
        <div class="tools-row">
          <button class="toolbtn active" data-tool="select">Výber</button>
          <button class="toolbtn" data-tool="draw">Kresliť</button>
          <button class="toolbtn" data-tool="eraser">Guma</button>
        </div>
        <div class="tools-row">
          <button class="toolbtn" data-tool="rect">Obdĺžnik</button>
          <button class="toolbtn" data-tool="circle">Kruh</button>
          <button class="toolbtn" data-tool="line">Čiara</button>
          <button class="toolbtn" data-tool="text">Text</button>
        </div>
      </div>
      
      <div class="panel">
        <h3>Vlastnosti</h3>
        <div style="margin-bottom:12px; display: flex; align-items: center; justify-content: space-between;">
          <label class="small">Farba čiary / textu:</label>
          <input type="color" id="colorPicker" value="#000000">
        </div>
        <div>
          <label class="small">Veľkosť štetca: <span id="sizeValue">5</span>px</label>
          <input type="range" id="sizeSlider" min="1" max="50" value="5">
        </div>
      </div>
      
      <div class="panel">
        <h3>Výber & Úpravy</h3>
        <div id="selInfo" style="margin-bottom: 8px;"><div class="small">Žiadny výber</div></div>
        <div style="display:flex; gap:4px; flex-wrap:wrap;">
          <button class="toolbtn" id="deleteBtn">Zmazať</button>
          <button class="toolbtn" id="lockBtn">Zamknúť</button>
          <button class="toolbtn" id="editText">Upraviť text</button>
          <button class="toolbtn" id="bringFront">Dopredu</button>
          <button class="toolbtn" id="sendBack">Dozadu</button>
        </div>
      </div>
      
      <div class="panel">
        <h3>Plátno & Formát Papiera</h3>
        <div style="margin-bottom: 8px;">
          <label class="small">ISO Formát (300 DPI):</label>
          <select id="paperPreset" style="margin-top: 4px;">
            <option value="A4" selected>A4 (2480 × 3508 px)</option>
            <option value="A0">A0 (9933 × 14043 px)</option>
            <option value="A1">A1 (7016 × 9933 px)</option>
            <option value="A2">A2 (4960 × 7016 px)</option>
            <option value="A3">A3 (3508 × 4960 px)</option>
            <option value="A5">A5 (1748 × 2480 px)</option>
            <option value="A6">A6 (1240 × 1748 px)</option>
            <option value="custom">Vlastné rozmery...</option>
          </select>
        </div>

        <div style="display:flex; gap:6px; margin-bottom:8px;">
          <button class="toolbtn active" id="btnPortrait">Portrét 📄</button>
          <button class="toolbtn" id="btnLandscape">Krajinka 🖼️</button>
        </div>

        <div style="display:flex; gap:6px; margin-bottom:8px;">
          <input type="number" id="canvasW" placeholder="Šírka" value="2480">
          <input type="number" id="canvasH" placeholder="Výška" value="3508">
          <button class="toolbtn" id="setCanvasBtn" style="flex:unset; padding:6px 12px;">OK</button>
        </div>

        <button class="toolbtn" id="clearBtn" style="width:100%; margin-bottom:6px; display:block;">Vymazať plátno</button>
        <button class="toolbtn" id="themeToggle" style="width:100%; display:block;">Prepnúť tému</button>
      </div>
      
      <div class="panel">
        <h3>Projekty</h3>
        <div style="display:flex; gap:6px; margin-bottom:6px;">
          <button class="toolbtn" id="saveBtn" style="flex:1;">Uložiť</button>
          <button class="toolbtn" id="loadBtn" style="flex:1;">Načítať</button>
        </div>
        <div style="display:flex; gap:6px; margin-bottom:6px;">
          <button class="toolbtn" id="downloadProject" style="flex:1;">Stiahnuť</button>
          <button class="toolbtn" id="uploadProjectBtn" style="flex:1;">Nahrať</button>
          <input type="file" id="uploadProject" accept=".json" style="display:none;">
        </div>
        <button class="toolbtn" id="exportBtn" style="width:100%; display:block; background: #2563eb; border-color: #2563eb; color:white;">Exportovať PNG</button>
        <div id="projects" style="margin-top:10px;"></div>
      </div>
    </div>
    
    <div class="main-area">
      <div id="viewportContainer" class="canvas-container">
        <canvas id="raster" width="2480" height="3508"></canvas>
        <canvas id="main" width="2480" height="3508"></canvas>
      </div>
    </div>
  </div>

  <div id="modalBg">
    <div class="modal">
      <h3 id="modalTitle" style="margin-bottom: 12px; color: white;">Pridať tvar</h3>
      <div id="modalContent">
        <input type="number" id="mWidth" placeholder="Šírka" value="300">
        <input type="number" id="mHeight" placeholder="Výška" value="200">
        <input type="number" id="mRadius" placeholder="Polomer" value="150">
      </div>
      <div style="margin-top:16px; display:flex; gap:8px; justify-content:flex-end;">
        <button class="toolbtn" id="modalCancel" style="background: rgba(255,255,255,0.1);">Zrušiť</button>
        <button class="toolbtn active" id="modalOk" style="flex:unset; padding: 8px 16px;">OK</button>
      </div>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
const raster = $('raster');
const main = $('main');
const rCtx = raster.getContext('2d');
const ctx = main.getContext('2d');

let tool = 'select';
let drawing = false;
let dragging = false;
let resizing = false;
let resizeHandle = null;
let selectedId = null;
let dragOffset = {x:0, y:0};
let color = '#000000';
let sizeVal = 5;
let objects = [];
let strokes = [];
let pendingShape = null;

// Presné ISO rozmery v pixeloch (pri štandarde 300 DPI pre kvalitnú tlač)
const isoPaperSizes = {
  A0: { w: 9933, h: 14043 },
  A1: { w: 7016, h: 9933 },
  A2: { w: 4960, h: 7016 },
  A3: { w: 3508, h: 4960 },
  A4: { w: 2480, h: 3508 },
  A5: { w: 1748, h: 2480 },
  A6: { w: 1240, h: 1748 }
};

let currentOrientation = 'portrait';

$('paperPreset').addEventListener('change', (e) => {
  const val = e.target.value;
  if(isoPaperSizes[val]) {
    applyPaperSize(isoPaperSizes[val].w, isoPaperSizes[val].h);
  }
});

$('btnPortrait').addEventListener('click', () => {
  currentOrientation = 'portrait';
  $('btnPortrait').classList.add('active');
  $('btnLandscape').classList.remove('active');
  const w = Math.min(parseInt($('canvasW').value), parseInt($('canvasH').value));
  const h = Math.max(parseInt($('canvasW').value), parseInt($('canvasH').value));
  applyPaperSize(w, h);
});

$('btnLandscape').addEventListener('click', () => {
  currentOrientation = 'landscape';
  $('btnLandscape').classList.add('active');
  $('btnPortrait').classList.remove('active');
  const w = Math.max(parseInt($('canvasW').value), parseInt($('canvasH').value));
  const h = Math.min(parseInt($('canvasW').value), parseInt($('canvasH').value));
  applyPaperSize(w, h);
});

function applyPaperSize(width, height) {
  let targetW = width;
  let targetH = height;

  if(currentOrientation === 'landscape' && targetW < targetH) {
    targetW = height; targetH = width;
  } else if(currentOrientation === 'portrait' && targetW > targetH) {
    targetW = height; targetH = width;
  }

  $('canvasW').value = targetW;
  $('canvasH').value = targetH;
  resizeCanvas(targetW, targetH);
}

function initCanvas() {
  applyPaperSize(2480, 3508);
}

function resizeCanvas(width, height) {
  const oldRaster = raster.toDataURL();

  raster.width = main.width = width;
  raster.height = main.height = height;
  
  // Nastavenie aspect-ratio pre responzívny výhľad plátna
  const viewport = $('viewportContainer');
  viewport.style.aspectRatio = `${width} / ${height}`;

  rCtx.fillStyle = '#ffffff';
  rCtx.fillRect(0, 0, width, height);
  
  rCtx.lineCap = 'round';
  rCtx.lineJoin = 'round';
  rCtx.strokeStyle = color;
  rCtx.lineWidth = sizeVal;

  const img = new Image();
  img.onload = () => {
    rCtx.drawImage(img, 0, 0);
    renderAll();
  };
  img.src = oldRaster;
}

document.querySelectorAll('[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => setTool(btn.dataset.tool));
});

function setTool(t){
  tool = t;
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
  const targetBtn = document.querySelector(`[data-tool="${t}"]`);
  if(targetBtn) targetBtn.classList.add('active');
  
  if(t === 'draw' || t === 'eraser'){
    main.style.cursor = 'crosshair';
  } else {
    main.style.cursor = 'default';
  }
}

$('colorPicker').addEventListener('input', e => { 
  color = e.target.value; 
  rCtx.strokeStyle = color; 
});
$('sizeSlider').addEventListener('input', e => { 
  sizeVal = e.target.value; 
  $('sizeValue').textContent = sizeVal; 
  rCtx.lineWidth = sizeVal; 
});

function getCanvasPos(e){
  const rect = main.getBoundingClientRect();
  const scaleX = main.width / rect.width;
  const scaleY = main.height / rect.height;
  
  let clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
  let clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
  
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function startStroke(pos){
  drawing = true;
  strokes.push([{...pos}]);
  rCtx.beginPath();
  rCtx.moveTo(pos.x, pos.y);
}

function continueStroke(pos){
  if(!drawing) return;
  strokes[strokes.length-1].push({...pos});
  rCtx.lineTo(pos.x, pos.y);
  rCtx.stroke();
  renderAll();
}

function endStroke(){
  drawing = false;
}

function createShape(type, pos){
  if(type === 'text'){
    const text = prompt('Zadaj text:','Text');
    if(text){
      const o = {
        id: genId(),
        type: 'text',
        x: pos.x, y: pos.y,
        text: text,
        fontSize: Math.round(main.width * 0.03),
        color: color,
        locked: false
      };
      objects.push(o);
      selectedId = o.id;
      renderAll();
      updateSelInfo();
    }
    return;
  }
  
  pendingShape = {...pos, type};
  $('modalBg').style.display = 'flex';
  $('mWidth').style.display = (type==='rect'||type==='line') ? 'block' : 'none';
  $('mHeight').style.display = (type==='rect') ? 'block' : 'none';
  $('mRadius').style.display = (type==='circle') ? 'block' : 'none';
}

function genId(){ return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }

function getHandles(o) {
  let bx = o.x, by = o.y, bw = 0, bh = 0;
  if(o.type==='rect') { bw = o.w; bh = o.h; }
  else if(o.type==='circle') { bx = o.x; by = o.y; bw = o.r*2; bh = o.r*2; }
  else if(o.type==='line') { 
    bx = Math.min(o.x, o.x2); by = Math.min(o.y, o.y2); 
    bw = Math.abs(o.x2 - o.x); bh = Math.abs(o.y2 - o.y); 
  }
  else if(o.type==='text') {
    ctx.font = `${o.fontSize||30}px Inter, Arial`;
    bw = ctx.measureText(o.text).width;
    bh = o.fontSize || 30;
    by = o.y - bh;
  }
  return {
    nw: {x: bx, y: by},
    ne: {x: bx + bw, y: by},
    se: {x: bx + bw, y: by + bh},
    sw: {x: bx, y: by + bh}
  };
}

function hitTestHandle(x, y, o) {
  const h = getHandles(o);
  const radius = Math.max(12, main.width * 0.012);
  for(let key in h) {
    let dx = x - h[key].x;
    let dy = y - h[key].y;
    if(dx*dx + dy*dy <= radius*radius) return key;
  }
  return null;
}

function hitTest(x,y){
  for(let i=objects.length-1; i>=0; i--){
    const o = objects[i];
    if(o.locked) continue;
    
    if(o.type==='rect' && x>=o.x && x<=o.x+o.w && y>=o.y && y<=o.y+o.h) return o.id;
    if(o.type==='circle'){
      const dx = x - (o.x+o.r), dy = y - (o.y+o.r);
      if(dx*dx + dy*dy <= o.r*o.r) return o.id;
    }
    if(o.type==='line'){
      const d = distToSegment(x,y, o.x,o.y, o.x2,o.y2);
      if(d < 15) return o.id;
    }
    if(o.type==='text'){
      ctx.font = `${o.fontSize}px Inter, Arial`;
      const w = ctx.measureText(o.text).width;
      if(x>=o.x && x<=o.x+w && y<=o.y && y>=o.y-o.fontSize) return o.id;
    }
  }
  return null;
}

function distToSegment(px,py, x1,y1, x2,y2){
  const A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
  const dot = A*C + B*D, lenSq = C*C + D*D;
  let param = -1;
  if(lenSq !== 0) param = dot / lenSq;
  let xx,yy;
  if(param < 0){ xx=x1; yy=y1; }
  else if(param > 1){ xx=x2; yy=y2; }
  else { xx=x1+param*C; yy=y1+param*D; }
  const dx = px-xx, dy = py-yy;
  return Math.sqrt(dx*dx + dy*dy);
}

function renderAll(){
  ctx.clearRect(0, 0, main.width, main.height);
  
  for(const o of objects){
    ctx.save();
    if(o.type==='rect'){
      ctx.lineWidth = o.stroke || Math.max(3, sizeVal);
      ctx.strokeStyle = o.color || '#000';
      if(o.fill){ ctx.fillStyle=o.fill; ctx.fillRect(o.x,o.y,o.w,o.h); }
      ctx.strokeRect(o.x,o.y,o.w,o.h);
    } else if(o.type==='circle'){
      ctx.lineWidth = o.stroke || Math.max(3, sizeVal);
      ctx.strokeStyle = o.color || '#000';
      ctx.beginPath(); 
      ctx.arc(o.x+o.r,o.y+o.r,o.r,0,Math.PI*2);
      if(o.fill){ ctx.fillStyle=o.fill; ctx.fill(); }
      ctx.stroke();
    } else if(o.type==='line'){
      ctx.lineWidth = o.stroke || Math.max(3, sizeVal);
      ctx.strokeStyle = o.color || '#000';
      ctx.beginPath(); ctx.moveTo(o.x,o.y); ctx.lineTo(o.x2,o.y2); ctx.stroke();
    } else if(o.type==='text'){
      ctx.fillStyle = o.color || '#000'; 
      ctx.font = `${o.fontSize||30}px Inter, Arial`; 
      ctx.fillText(o.text,o.x,o.y);
    }

    if(o.id===selectedId){ 
      const h = getHandles(o);
      ctx.setLineDash([8,6]); ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = Math.max(2, main.width*0.0015);
      
      let bx = o.x, by = o.y, bw = 0, bh = 0;
      if(o.type==='rect') { bw = o.w; bh = o.h; }
      else if(o.type==='circle') { bx = o.x; by = o.y; bw = o.r*2; bh = o.r*2; }
      else if(o.type==='line') { 
        bx = Math.min(o.x, o.x2); by = Math.min(o.y, o.y2); 
        bw = Math.abs(o.x2 - o.x); bh = Math.abs(o.y2 - o.y); 
      }
      else if(o.type==='text') {
        const w = ctx.measureText(o.text).width;
        bw = w; bh = o.fontSize || 30; by = o.y - bh;
      }
      ctx.strokeRect(bx-4, by-4, bw+8, bh+8);
      
      // Rohové uzly
      ctx.setLineDash([]);
      ctx.fillStyle = '#3b82f6';
      const handleRadius = Math.max(8, main.width * 0.006);
      Object.values(h).forEach(pt => {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, handleRadius, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      });
    }
    ctx.restore();
  }
}

function onDown(e){
  const pos = getCanvasPos(e);
  
  if(tool==='draw'){
    startStroke(pos);
    return;
  }
  
  if(tool==='eraser'){
    drawing = true;
    rCtx.strokeStyle = '#ffffff';
    rCtx.globalCompositeOperation = 'destination-out';
    rCtx.beginPath();
    rCtx.moveTo(pos.x, pos.y);
    return;
  }
  
  if(tool==='select'){
    if(selectedId) {
      const o = objects.find(x => x.id === selectedId);
      if(o && !o.locked) {
        const handle = hitTestHandle(pos.x, pos.y, o);
        if(handle) {
          resizing = true;
          resizeHandle = handle;
          return;
        }
      }
    }
    
    selectedId = hitTest(pos.x,pos.y);
    if(selectedId){
      const o = objects.find(x=>x.id===selectedId);
      if(o && !o.locked){
        dragging = true;
        dragOffset.x = pos.x - o.x;
        dragOffset.y = pos.y - o.y;
      }
    }
    updateSelInfo();
    renderAll();
    return;
  }
  
  if(['rect','circle','line','text'].includes(tool)){
    createShape(tool, pos);
  }
}

function onMove(e){
  const pos = getCanvasPos(e);
  
  if(tool==='draw' && drawing){
    continueStroke(pos);
    return;
  }
  
  if(tool==='eraser' && drawing){
    rCtx.lineTo(pos.x, pos.y);
    rCtx.stroke();
    renderAll();
    return;
  }
  
  if(resizing && selectedId) {
    const o = objects.find(x => x.id === selectedId);
    if(o) {
      if(o.type === 'rect') {
        if(resizeHandle === 'se') { o.w = Math.max(20, pos.x - o.x); o.h = Math.max(20, pos.y - o.y); }
        if(resizeHandle === 'nw') { 
          let right = o.x + o.w, bottom = o.y + o.h;
          o.x = Math.min(pos.x, right - 20); o.y = Math.min(pos.y, bottom - 20);
          o.w = right - o.x; o.h = bottom - o.y;
        }
      } else if(o.type === 'circle') {
        if(resizeHandle === 'se') { o.r = Math.max(10, (pos.x - o.x)/2); }
      } else if(o.type === 'line') {
        if(resizeHandle === 'se') { o.x2 = pos.x; o.y2 = pos.y; }
        if(resizeHandle === 'nw') { o.x = pos.x; o.y = pos.y; }
      } else if(o.type === 'text') {
        if(resizeHandle === 'se') { o.fontSize = Math.max(12, Math.round(pos.y - o.y + 30)); }
      }
      renderAll();
    }
    return;
  }
  
  if(dragging && selectedId){
    const o = objects.find(x=>x.id===selectedId);
    if(o && !o.locked){
      o.x = pos.x - dragOffset.x;
      o.y = pos.y - dragOffset.y;
    }
    renderAll(); 
    updateSelInfo();
  }
}

function onUp(e){
  if(tool==='draw' && drawing) endStroke();
  if(tool==='eraser' && drawing){ 
    drawing=false; 
    rCtx.globalCompositeOperation = 'source-over';
    rCtx.strokeStyle = color;
  }
  if(dragging) dragging=false;
  if(resizing) resizing=false;
}

main.addEventListener('mousedown', onDown);
main.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);

main.addEventListener('touchstart', onDown);
main.addEventListener('touchmove', onMove);
window.addEventListener('touchend', onUp);

$('modalCancel').addEventListener('click', ()=>{ $('modalBg').style.display='none'; pendingShape=null; });
$('modalOk').addEventListener('click', ()=>{
  if(!pendingShape){ $('modalBg').style.display='none'; return; }
  const w = parseFloat($('mWidth').value)||300;
  const h = parseFloat($('mHeight').value)||200;
  const r = parseFloat($('mRadius').value)||150;
  const pos = pendingShape;
  
  if(pos.type==='rect'){ 
    const o={id:genId(),type:'rect',x:pos.x,y:pos.y,w:w,h:h,color:color,stroke:Math.max(3,sizeVal),locked:false}; 
    objects.push(o); selectedId=o.id; 
  } else if(pos.type==='circle'){ 
    const o={id:genId(),type:'circle',x:pos.x,y:pos.y,r:r,color:color,stroke:Math.max(3,sizeVal),locked:false}; 
    objects.push(o); selectedId=o.id; 
  } else if(pos.type==='line'){ 
    const o={id:genId(),type:'line',x:pos.x,y:pos.y,x2:pos.x+w,y2:pos.y+h,color:color,stroke:Math.max(3,sizeVal),locked:false}; 
    objects.push(o); selectedId=o.id; 
  }
  $('modalBg').style.display='none'; pendingShape=null; renderAll(); updateProjectsList(); updateSelInfo();
});

function updateSelInfo(){
  const box = $('selInfo'); box.innerHTML = '';
  if(!selectedId){ box.innerHTML = '<div class="small">Žiadny výber</div>'; return; }
  const o = objects.find(x=>x.id===selectedId);
  if(!o){ box.innerHTML = '<div class="small">Žiadny výber</div>'; return; }
  const pre = document.createElement('pre'); 
  pre.textContent = JSON.stringify(o, ['id','type','x','y','w','h','r','x2','y2','text','fontSize','locked','color','stroke'], 2);
  box.appendChild(pre);
}

$('deleteBtn').addEventListener('click', ()=>{
  if(!selectedId) return alert('Vyber objekt');
  objects = objects.filter(o => o.id !== selectedId);
  selectedId = null; 
  updateSelInfo(); 
  renderAll(); 
  updateProjectsList();
});

$('lockBtn').addEventListener('click', ()=>{
  if(!selectedId) return alert('Vyber objekt');
  const o = objects.find(o=>o.id===selectedId);
  if(o){ o.locked = !o.locked; updateSelInfo(); renderAll(); }
});

$('editText').addEventListener('click', ()=>{
  if(!selectedId) return alert('Vyber text');
  const o = objects.find(o=>o.id===selectedId);
  if(!o || o.type!=='text') return alert('Vybratý objekt nie je text');
  const t = prompt('Uprav text', o.text);
  if(t!==null){ o.text = t; renderAll(); updateProjectsList(); updateSelInfo(); }
});

$('bringFront').addEventListener('click', ()=>{
  if(!selectedId) return;
  const i=objects.findIndex(o=>o.id===selectedId);
  if(i>=0){ const [o]=objects.splice(i,1); objects.push(o); renderAll(); updateProjectsList(); }
});

$('sendBack').addEventListener('click', ()=>{
  if(!selectedId) return;
  const i=objects.findIndex(o=>o.id===selectedId);
  if(i>=0){ const [o]=objects.splice(i,1); objects.unshift(o); renderAll(); updateProjectsList(); }
});

$('setCanvasBtn').addEventListener('click', ()=>{
  const w = Math.max(100, parseInt($('canvasW').value)||2480);
  const h = Math.max(100, parseInt($('canvasH').value)||3508);
  $('paperPreset').value = "custom";
  applyPaperSize(w, h);
});

$('clearBtn').addEventListener('click', ()=>{
  if(!confirm('Vymazať celú plochu?')) return;
  objects=[]; 
  strokes=[]; 
  rCtx.fillStyle = '#ffffff';
  rCtx.fillRect(0,0,raster.width,raster.height);
  selectedId=null; 
  updateSelInfo(); 
  renderAll(); 
  updateProjectsList();
});

function saveProject(){
  const name = prompt('Názov projektu:','moj_projekt');
  if(!name) return;
  const payload = { objects, rasterData: raster.toDataURL('image/png'), meta:{savedAt:Date.now(), w:raster.width, h:raster.height, orientation: currentOrientation} };
  localStorage.setItem('erakai_proj_'+name, JSON.stringify(payload));
  updateProjectsList(); 
  alert('Uložené: '+name);
}
$('saveBtn').addEventListener('click', saveProject);

function loadProject(){
  const keys = Object.keys(localStorage).filter(k=>k.startsWith('erakai_proj_'));
  if(keys.length===0) return alert('Žiadne projekty uložené');
  const list = keys.map(k=>k.replace('erakai_proj_',''));
  const name = prompt('Vyber projekt:\n'+list.join('\n'), list[0]);
  if(!name) return;
  const raw = localStorage.getItem('erakai_proj_'+name);
  if(!raw) return alert('Projekt nenájdený');
  try{
    const payload = JSON.parse(raw);
    objects = payload.objects || [];
    const img = new Image();
    img.onload = ()=>{ 
      if(payload.meta) {
        currentOrientation = payload.meta.orientation || 'portrait';
        applyPaperSize(payload.meta.w, payload.meta.h);
      } else {
        applyPaperSize(img.width, img.height);
      }
      rCtx.drawImage(img,0,0); 
      renderAll(); 
      updateSelInfo(); 
      updateProjectsList(); 
    };
    img.src = payload.rasterData || '';
  }catch(err){ alert('Chyba pri načítaní projektu'); }
}
$('loadBtn').addEventListener('click', loadProject);

function updateProjectsList(){
  const cont = $('projects'); cont.innerHTML='';
  const keys = Object.keys(localStorage).filter(k=>k.startsWith('erakai_proj_'));
  if(keys.length===0){ cont.innerHTML='<div class="small" style="margin-top:4px">Žiadne projekty</div>'; return; }
  keys.forEach(k=>{
    const name = k.replace('erakai_proj_','');
    const row = document.createElement('div'); 
    row.style.display='flex'; 
    row.style.justifyContent='space-between'; 
    row.style.alignItems='center'; 
    row.style.padding='6px 0';
    row.style.borderBottom='1px solid rgba(255,255,255,0.05)';
    
    const left = document.createElement('div'); left.textContent = name; left.style.fontSize='12px'; left.style.fontWeight='500';
    const right = document.createElement('div'); right.style.display='flex'; right.style.gap='4px';
    
    const btnLoad = document.createElement('button'); btnLoad.textContent='Načítať'; btnLoad.className='toolbtn'; btnLoad.style.padding='4px 8px'; btnLoad.style.minWidth='unset';
    btnLoad.onclick=()=>{ 
      const raw = localStorage.getItem('erakai_proj_'+name); 
      const p = JSON.parse(raw); 
      objects = p.objects||[]; 
      const img = new Image(); 
      img.onload=()=>{ 
        if(p.meta) {
          currentOrientation = p.meta.orientation || 'portrait';
          applyPaperSize(p.meta.w, p.meta.h);
        } else {
          applyPaperSize(img.width, img.height);
        }
        rCtx.drawImage(img,0,0); 
        renderAll(); 
      }; 
      img.src = p.rasterData||''; 
      selectedId=null; 
      updateSelInfo(); 
      updateProjectsList(); 
    };
    
    const btnDel = document.createElement('button'); btnDel.textContent='X'; btnDel.className='toolbtn'; btnDel.style.padding='4px 8px'; btnDel.style.minWidth='unset'; btnDel.style.background='rgba(239,68,68,0.2)';
    btnDel.onclick=()=>{ if(confirm('Zmazať '+name+'?')){ localStorage.removeItem('erakai_proj_'+name); updateProjectsList(); } };
    
    right.appendChild(btnLoad); right.appendChild(btnDel);
    row.appendChild(left); row.appendChild(right); cont.appendChild(row);
  });
}

$('exportBtn').addEventListener('click', ()=>{
  const tmp = document.createElement('canvas');
  tmp.width = raster.width; tmp.height = raster.height;
  const tctx = tmp.getContext('2d');
  
  tctx.fillStyle = '#ffffff';
  tctx.fillRect(0, 0, tmp.width, tmp.height);
  tctx.drawImage(raster,0,0);
  
  for(const o of objects){
    tctx.save();
    if(o.type==='rect'){
      tctx.lineWidth = o.stroke||Math.max(3,sizeVal);
      tctx.strokeStyle = o.color||'#000';
      if(o.fill){ tctx.fillStyle=o.fill; tctx.fillRect(o.x,o.y,o.w,o.h); }
      tctx.strokeRect(o.x,o.y,o.w,o.h);
    } else if(o.type==='circle'){
      tctx.lineWidth = o.stroke||Math.max(3,sizeVal);
      tctx.strokeStyle = o.color||'#000';
      tctx.beginPath(); tctx.arc(o.x+o.r,o.y+o.r,o.r,0,Math.PI*2);
      if(o.fill){ tctx.fillStyle=o.fill; tctx.fill(); }
      tctx.stroke();
    } else if(o.type==='line'){
      tctx.lineWidth = o.stroke||Math.max(3,sizeVal);
      tctx.strokeStyle = o.color||'#000';
      tctx.beginPath(); tctx.moveTo(o.x,o.y); tctx.lineTo(o.x2,o.y2); tctx.stroke();
    } else if(o.type==='text'){
      tctx.fillStyle = o.color||'#000'; tctx.font = `${o.fontSize||30}px Inter, Arial`; tctx.fillText(o.text,o.x,o.y);
    }
    tctx.restore();
  }
  
  const url = tmp.toDataURL('image/png');
  const a = document.createElement('a'); a.href = url; a.download = `erakai_export_${$('paperPreset').value}.png`; a.click();
});

$('downloadProject').addEventListener('click', ()=>{
  const data = { objects, rasterData: raster.toDataURL('image/png'), meta:{w:raster.width,h:raster.height, orientation: currentOrientation} };
  const blob = new Blob([JSON.stringify(data)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'erakai_project.json'; a.click();
});
$('uploadProjectBtn').addEventListener('click', ()=>$('uploadProject').click());
$('uploadProject').addEventListener('change', function(){
  const file = this.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=> {
    try{
      const payload = JSON.parse(e.target.result);
      objects = payload.objects||[];
      const img = new Image(); 
      img.onload=()=>{ 
        if(payload.meta) {
          currentOrientation = payload.meta.orientation || 'portrait';
          applyPaperSize(payload.meta.w, payload.meta.h);
        } else {
          applyPaperSize(img.width, img.height);
        }
        rCtx.drawImage(img,0,0); 
        renderAll(); 
        updateProjectsList(); 
        alert('Projekt načítaný'); 
      }; 
      img.src = payload.rasterData||'';
    }catch(err){ alert('Neplatný JSON'); }
  };
  reader.readAsText(file);
});

window.addEventListener('keydown', e=>{
  if((e.key==='Delete' || e.key==='Backspace') && document.activeElement.tagName !== 'INPUT'){ 
    if(selectedId){ 
      objects = objects.filter(o => o.id !== selectedId);
      selectedId = null; updateSelInfo(); renderAll(); updateProjectsList(); 
    } 
  }
  if(e.key==='d' && document.activeElement.tagName !== 'INPUT') setTool('draw');
  if(e.key==='v' && document.activeElement.tagName !== 'INPUT') setTool('select');
  if(e.key==='e' && document.activeElement.tagName !== 'INPUT') setTool('eraser');
});

$('themeToggle').addEventListener('click', ()=>{
  document.body.classList.toggle('light-mode');
});

initCanvas();
updateProjectsList();
</script>
</body>
</html>
