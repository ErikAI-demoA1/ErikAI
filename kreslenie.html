<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ErikAI Kreslenie Pro</title>
  <style>
    body {
      background-color: #0f1116;
      color: #e0e0e0;
      font-family: "Segoe UI", sans-serif;
      text-align: center;
      padding: 10px;
      margin: 0;
    }

    header {
      background: linear-gradient(90deg, #0078d7, #00bfa5);
      color: white;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      margin-bottom: 15px;
    }

    canvas {
      border: 2px solid #555;
      background-color: #fff;
      border-radius: 8px;
      touch-action: none;
      box-shadow: 0 0 10px rgba(255,255,255,0.1);
    }

    .toolbar {
      background-color: #1c1f26;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px;
      margin-bottom: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    input, select, button {
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 14px;
      cursor: pointer;
    }

    button {
      background-color: #0078d7;
      color: white;
      transition: 0.2s;
    }

    button:hover {
      background-color: #00bfa5;
    }

    input[type="color"] {
      cursor: pointer;
    }

    .dark-mode {
      background-color: #121212;
      color: white;
    }

    footer {
      font-size: 13px;
      color: #aaa;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎨 ErikAI Kreslenie Pro</h1>
  </header>

  <button onclick="toggleTheme()">🌓 Zmeniť režim</button>
  <p id="cas"></p>

  <div id="google_translate_element"></div>
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'sk',
        includedLanguages: 'en,cs,fr,hu,de,pl,ro,ru,es,it,uk,sr,bn,ko,ja,zh-CN',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <div class="toolbar">
    <label>Farba <input type="color" id="colorPicker" value="#ff0000"></label>
    <label>Hrúbka <input type="range" id="brushSize" min="1" max="30" value="5"></label>

    <select id="toolSelector">
      <option value="draw">✏️ Kresliť</option>
      <option value="erase">🩹 Guma</option>
      <option value="line">📏 Čiara</option>
      <option value="rect">⬛ Obdĺžnik</option>
      <option value="circle">⚪ Kruh</option>
      <option value="text">🔤 Text</option>
    </select>

    <button onclick="clearCanvas()">🧹 Vyčistiť</button>
    <button onclick="saveCanvas()">💾 Uložiť ako PNG</button>

    <select id="drawingSelector" onchange="loadDrawing(this.value)">
      <option value="">-- Vyber uložený výtvor --</option>
    </select>
  </div>

  <canvas id="drawingCanvas" width="800" height="500"></canvas>

  <script>
    const canvas = document.getElementById("drawingCanvas");
    const ctx = canvas.getContext("2d");
    const colorPicker = document.getElementById("colorPicker");
    const brushSize = document.getElementById("brushSize");
    const toolSelector = document.getElementById("toolSelector");
    let tool = "draw";
    let drawing = false;
    let startX, startY;

    toolSelector.addEventListener("change", () => tool = toolSelector.value);

    // kreslenie
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      return { x, y };
    }

    function startDraw(e) {
      drawing = true;
      const pos = getPos(e);
      startX = pos.x;
      startY = pos.y;

      if (tool === "text") {
        const text = prompt("Zadaj text:");
        if (text) {
          ctx.fillStyle = colorPicker.value;
          ctx.font = `${brushSize.value * 3}px Arial`;
          ctx.fillText(text, startX, startY);
        }
        drawing = false;
      } else if (tool === "draw" || tool === "erase") {
        draw(e);
      }
    }

    function endDraw(e) {
      if (!drawing) return;
      if (tool === "line" || tool === "rect" || tool === "circle") {
        const pos = getPos(e);
        ctx.lineWidth = brushSize.value;
        ctx.strokeStyle = colorPicker.value;
        ctx.fillStyle = colorPicker.value;
        ctx.beginPath();

        if (tool === "line") {
          ctx.moveTo(startX, startY);
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
        } else if (tool === "rect") {
          ctx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
        } else if (tool === "circle") {
          const r = Math.sqrt(Math.pow(pos.x - startX, 2) + Math.pow(pos.y - startY, 2));
          ctx.arc(startX, startY, r, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      drawing = false;
      ctx.beginPath();
    }

    function draw(e) {
      if (!drawing) return;
      const pos = getPos(e);
      ctx.lineWidth = brushSize.value;
      ctx.lineCap = "round";
      ctx.strokeStyle = (tool === "erase") ? "#ffffff" : colorPicker.value;

      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function saveCanvas() {
      const link = document.createElement("a");
      link.download = "erikai_kresba.png";
      link.href = canvas.toDataURL();
      link.click();

      let drawings = JSON.parse(localStorage.getItem("erikai_drawings")) || [];
      drawings.push(link.href);
      localStorage.setItem("erikai_drawings", JSON.stringify(drawings));
      updateDrawingSelector();
    }

    function loadDrawing(index) {
      const drawings = JSON.parse(localStorage.getItem("erikai_drawings")) || [];
      if (drawings[index]) {
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0);
        img.src = drawings[index];
      }
    }

    function updateDrawingSelector() {
      const select = document.getElementById('drawingSelector');
      select.innerHTML = '<option value="">-- Vyber uložený výtvor --</option>';
      const drawings = JSON.parse(localStorage.getItem('erikai_drawings')) || [];
      drawings.slice(-10).forEach((_, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `Výtvor ${index + 1}`;
        select.appendChild(option);
      });
    }
    updateDrawingSelector();

    // eventy
    canvas.addEventListener("mousedown", startDraw);
    canvas.addEventListener("mouseup", endDraw);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("touchstart", startDraw);
    canvas.addEventListener("touchend", endDraw);
    canvas.addEventListener("touchmove", draw);

    // čas
    function aktualizujCas() {
      const teraz = new Date();
      const moznosti = { hour:'2-digit', minute:'2-digit', second:'2-digit' };
      document.getElementById('cas').innerText = `🕓 ${teraz.toLocaleTimeString('sk-SK', moznosti)}`;
    }
    setInterval(aktualizujCas, 1000);
    aktualizujCas();

    function toggleTheme() {
      document.body.classList.toggle("dark-mode");
    }
  </script>

  <footer>
    © 2025 Erik Mohylák – All rights reserved.  
    Licensed under CC BY-NC-ND 4.0
  </footer>
</body>
</html>
