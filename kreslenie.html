<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erakai - Kresliaca App</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: linear-gradient(180deg, #071026, #071022);
      color: #e6eef6;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
    }
    .light-mode {
      background: linear-gradient(180deg, #f6f9ff, #eef4ff) !important;
      color: #0b1220 !important;
    }
    
    /* Mobile first responsive design */
    .container { 
      display: flex; 
      flex-direction: column;
      gap: 15px; 
      max-width: 1200px; 
      margin: 0 auto;
    }
    
    @media (min-width: 768px) {
      .container {
        flex-direction: row;
      }
      .sidebar { 
        width: 280px; 
        flex-shrink: 0; 
      }
    }
    
    .panel { 
      background: rgba(255,255,255,0.05); 
      border-radius: 12px; 
      padding: 12px; 
      margin-bottom: 12px; 
      border: 1px solid rgba(255,255,255,0.1); 
    }
    .light-mode .panel { background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.1); }
    
    .toolbtn { 
      background: rgba(255,255,255,0.1); 
      border: 1px solid rgba(255,255,255,0.2); 
      color: white; 
      padding: 8px 12px; 
      border-radius: 6px; 
      cursor: pointer; 
      margin: 2px; 
      transition: all 0.2s; 
      font-size: 13px;
      flex: 1;
      min-width: 60px;
    }
    .light-mode .toolbtn { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.2); color: #333; }
    .toolbtn:hover { background: rgba(255,255,255,0.2); }
    .light-mode .toolbtn:hover { background: rgba(0,0,0,0.1); }
    .toolbtn.active { background: #3b82f6; border-color: #3b82f6; }
    
    /* Canvas container - RESPONSIVE */
    .canvas-container { 
      position: relative; 
      background: white; 
      border-radius: 8px; 
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
      width: 100%;
      height: 500px;
      margin-bottom: 10px;
    }
    
    @media (max-width: 767px) {
      .canvas-container {
        height: 400px;
      }
    }
    
    @media (max-width: 480px) {
      .canvas-container {
        height: 350px;
      }
    }
    
    #raster, #main { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100% !important;
      height: 100% !important;
      cursor: crosshair;
      touch-action: none;
    }
    #raster { z-index: 1; }
    #main { z-index: 2; background: transparent; }
    
    input[type="color"] { width: 40px; height: 30px; border: none; border-radius: 4px; cursor: pointer; }
    input[type="range"] { width: 100%; }
    
    .small { font-size: 12px; opacity: 0.8; }
    pre { background: rgba(0,0,0,0.2); padding: 8px; border-radius: 4px; overflow: auto; max-height: 150px; font-size: 11px; }
    .light-mode pre { background: rgba(0,0,0,0.05); }
    
    #modalBg {
      display: none; position: fixed; top:0; left:0; width:100%; height:100%; 
      background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;
      padding: 20px;
    }
    .modal { 
      background: white; 
      color: #333; 
      padding: 20px; 
      border-radius: 12px; 
      width: 100%;
      max-width: 300px; 
    }
    .modal input { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }
    
    .tools-row { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 4px; 
      margin-bottom: 8px;
      justify-content: center;
    }
    
    /* Mobile specific improvements */
    .mobile-warning {
      display: none;
      background: #f39c12;
      color: white;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      text-align: center;
      font-size: 12px;
    }
    
    @media (max-width: 767px) {
      .mobile-warning {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div class="mobile-warning">
    💡 Pre lepšiu prácu otoč zariadenie na šírku
  </div>
  
  <div class="container">
    <div class="sidebar">
      <div class="panel">
        <h3>Nástroje</h3>
        <div class="tools-row">
          <button class="toolbtn active" data-tool="select">Výber</button>
          <button class="toolbtn" data-tool="draw">Kresliť</button>
          <button class="toolbtn" data-tool="eraser">Guma</button>
        </div>
        <div class="tools-row">
          <button class="toolbtn" data-tool="rect">Obdĺžnik</button>
          <button class="toolbtn" data-tool="circle">Kruh</button>
          <button class="toolbtn" data-tool="line">Čiara</button>
          <button class="toolbtn" data-tool="text">Text</button>
        </div>
      </div>
      
      <div class="panel">
        <h3>Vlastnosti</h3>
        <div style="margin-bottom:10px; display: flex; align-items: center; gap: 10px;">
          <label class="small">Farba:</label>
          <input type="color" id="colorPicker" value="#000000">
        </div>
        <div style="margin-bottom:10px;">
          <label class="small">Veľkosť štetca: <span id="sizeValue">5</span>px</label>
          <input type="range" id="sizeSlider" min="1" max="50" value="5">
        </div>
      </div>
      
      <div class="panel">
        <h3>Výber</h3>
        <div id="selInfo"><div class="small">Žiadny výber</div></div>
        <div style="margin-top:10px; display:flex; gap:4px; flex-wrap:wrap;">
          <button class="toolbtn" id="deleteBtn">Zmazať</button>
          <button class="toolbtn" id="lockBtn">Zamknúť</button>
          <button class="toolbtn" id="editText">Upraviť text</button>
          <button class="toolbtn" id="bringFront">Dopredu</button>
          <button class="toolbtn" id="sendBack">Dozadu</button>
        </div>
      </div>
      
      <div class="panel">
        <h3>Plátno</h3>
        <div style="display:flex; gap:4px; margin-bottom:8px;">
          <input type="number" id="canvasW" placeholder="Šírka" value="800" style="flex:1;">
          <input type="number" id="canvasH" placeholder="Výška" value="500" style="flex:1;">
          <button class="toolbtn" id="setCanvasBtn">Nastaviť</button>
        </div>
        <button class="toolbtn" id="clearBtn" style="width:100%; margin-bottom:8px;">Vymazať plátno</button>
        <button class="toolbtn" id="themeToggle" style="width:100%;">Prepnúť tému</button>
      </div>
      
      <div class="panel">
        <h3>Projekty</h3>
        <div style="display:flex; gap:4px; margin-bottom:8px;">
          <button class="toolbtn" id="saveBtn" style="flex:1;">Uložiť</button>
          <button class="toolbtn" id="loadBtn" style="flex:1;">Načítať</button>
        </div>
        <div style="display:flex; gap:4px; margin-bottom:8px;">
          <button class="toolbtn" id="downloadProject" style="flex:1;">Stiahnuť</button>
          <button class="toolbtn" id="uploadProjectBtn" style="flex:1;">Nahrať</button>
          <input type="file" id="uploadProject" accept=".json" style="display:none;">
        </div>
        <button class="toolbtn" id="exportBtn" style="width:100%;">Exportovať PNG</button>
        <div id="projects" style="margin-top:10px;"></div>
      </div>
    </div>
    
    <div class="main-area">
      <div class="canvas-container">
        <canvas id="raster" width="800" height="500"></canvas>
        <canvas id="main" width="800" height="500"></canvas>
      </div>
    </div>
  </div>

  <div id="modalBg">
    <div class="modal">
      <h3 id="modalTitle">Pridať tvar</h3>
      <div id="modalContent">
        <input type="number" id="mWidth" placeholder="Šírka" value="100">
        <input type="number" id="mHeight" placeholder="Výška" value="80">
        <input type="number" id="mRadius" placeholder="Polomer" value="50">
      </div>
      <div style="margin-top:15px; display:flex; gap:8px; justify-content:flex-end;">
        <button class="toolbtn" id="modalCancel">Zrušiť</button>
        <button class="toolbtn" id="modalOk">OK</button>
      </div>
    </div>
  </div>

<script>
// DOM elements
const $ = id => document.getElementById(id);
const raster = $('raster');
const main = $('main');
const rCtx = raster.getContext('2d');
const ctx = main.getContext('2d');

// State
let tool = 'select';
let drawing = false;
let dragging = false;
let selectedId = null;
let dragOffset = {x:0, y:0};
let color = '#000000';
let sizeVal = 5;
let objects = [];
let strokes = [];
let pendingShape = null;

// Initialize
function initCanvas() {
  rCtx.lineCap = 'round';
  rCtx.lineJoin = 'round';
  rCtx.strokeStyle = color;
  rCtx.lineWidth = sizeVal;
  
  // Set canvas sizes based on container
  const container = document.querySelector('.canvas-container');
  const width = container.clientWidth;
  const height = container.clientHeight;
  
  raster.width = main.width = width;
  raster.height = main.height = height;
  
  // Clear both canvases
  rCtx.clearRect(0, 0, width, height);
  ctx.clearRect(0, 0, width, height);
  
  // Draw initial white background
  rCtx.fillStyle = '#ffffff';
  rCtx.fillRect(0, 0, width, height);
  
  renderAll();
}

// Tool selection
document.querySelectorAll('[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => setTool(btn.dataset.tool));
});

function setTool(t){
  tool = t;
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-tool="${t}"]`).classList.add('active');
  
  if(t === 'draw' || t === 'eraser'){
    main.style.cursor = 'crosshair';
    raster.style.cursor = 'crosshair';
  } else {
    main.style.cursor = 'default';
    raster.style.cursor = 'default';
  }
}

// Color & size
$('colorPicker').addEventListener('input', e => { color = e.target.value; rCtx.strokeStyle = color; });
$('sizeSlider').addEventListener('input', e => { 
  sizeVal = e.target.value; 
  $('sizeValue').textContent = sizeVal; 
  rCtx.lineWidth = sizeVal; 
});

// Drawing functions
function getCanvasPos(e){
  const rect = main.getBoundingClientRect();
  const scaleX = main.width / rect.width;
  const scaleY = main.height / rect.height;
  
  let clientX, clientY;
  
  // Handle both mouse and touch events
  if (e.type.includes('touch')) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function startStroke(pos){
  drawing = true;
  strokes.push([{...pos}]);
  rCtx.beginPath();
  rCtx.moveTo(pos.x, pos.y);
}

function continueStroke(pos){
  if(!drawing) return;
  strokes[strokes.length-1].push({...pos});
  rCtx.lineTo(pos.x, pos.y);
  rCtx.stroke();
  renderAll();
}

function endStroke(){
  drawing = false;
}

// Shape creation
function createShape(type, pos){
  if(type === 'text'){
    const text = prompt('Zadaj text:','Text');
    if(text){
      const o = {
        id: genId(),
        type: 'text',
        x: pos.x, y: pos.y,
        text: text,
        fontSize: 20,
        color: color,
        locked: false
      };
      objects.push(o);
      selectedId = o.id;
      renderAll();
      updateSelInfo();
    }
    return;
  }
  
  pendingShape = {...pos, type};
  $('modalBg').style.display = 'flex';
  // Show/hide relevant inputs
  $('mWidth').style.display = (type==='rect'||type==='line') ? 'block' : 'none';
  $('mHeight').style.display = (type==='rect') ? 'block' : 'none';
  $('mRadius').style.display = (type==='circle') ? 'block' : 'none';
}

function genId(){ return Date.now().toString(36) + Math.random().toString(36).substr(2); }

// Hit testing
function hitTest(x,y){
  for(let i=objects.length-1; i>=0; i--){
    const o = objects[i];
    if(o.locked) continue;
    
    if(o.type==='rect' && x>=o.x && x<=o.x+o.w && y>=o.y && y<=o.y+o.h) return o.id;
    if(o.type==='circle'){
      const dx = x - (o.x+o.r), dy = y - (o.y+o.r);
      if(dx*dx + dy*dy <= o.r*o.r) return o.id;
    }
    if(o.type==='line'){
      const d = distToSegment(x,y, o.x,o.y, o.x2,o.y2);
      if(d < 10) return o.id;
    }
    if(o.type==='text'){
      ctx.font = `${o.fontSize}px Arial`;
      const w = ctx.measureText(o.text).width;
      if(x>=o.x && x<=o.x+w && y<=o.y && y>=o.y-o.fontSize) return o.id;
    }
  }
  return null;
}

function distToSegment(px,py, x1,y1, x2,y2){
  const A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
  const dot = A*C + B*D, lenSq = C*C + D*D;
  let param = -1;
  if(lenSq !== 0) param = dot / lenSq;
  let xx,yy;
  if(param < 0){ xx=x1; yy=y1; }
  else if(param > 1){ xx=x2; yy=y2; }
  else { xx=x1+param*C; yy=y1+param*D; }
  const dx = px-xx, dy = py-yy;
  return Math.sqrt(dx*dx + dy*dy);
}

// Rendering - OPRAVENÉ
function renderAll(){
  // Clear main canvas but keep the white background from raster
  ctx.clearRect(0, 0, main.width, main.height);
  
  // Draw all objects
  for(const o of objects){
    if(o.type==='rect'){
      ctx.lineWidth = o.stroke || Math.max(2, sizeVal/1.5);
      ctx.strokeStyle = o.color || '#000';
      if(o.fill){ ctx.fillStyle=o.fill; ctx.fillRect(o.x,o.y,o.w,o.h); }
      ctx.strokeRect(o.x,o.y,o.w,o.h);
      if(o.id===selectedId){ ctx.setLineDash([5,5]); ctx.strokeRect(o.x-3,o.y-3,o.w+6,o.h+6); ctx.setLineDash([]); }
    } else if(o.type==='circle'){
      ctx.lineWidth = o.stroke || Math.max(2, sizeVal/1.5);
      ctx.strokeStyle = o.color || '#000';
      ctx.beginPath(); ctx.arc(o.x+o.r,o.y+o.r,o.r,0,Math.PI*2);
      if(o.fill){ ctx.fillStyle=o.fill; ctx.fill(); }
      ctx.stroke();
      if(o.id===selectedId){ ctx.setLineDash([5,5]); ctx.strokeRect(o.x-3,o.y-3,o.r*2+6,o.r*2+6); ctx.setLineDash([]); }
    } else if(o.type==='line'){
      ctx.lineWidth = o.stroke || Math.max(2, sizeVal/1.5);
      ctx.strokeStyle = o.color || '#000';
      ctx.beginPath(); ctx.moveTo(o.x,o.y); ctx.lineTo(o.x2,o.y2); ctx.stroke();
      if(o.id===selectedId){ ctx.setLineDash([5,5]); ctx.strokeRect(Math.min(o.x,o.x2)-3,Math.min(o.y,o.y2)-3,Math.abs(o.x2-o.x)+6,Math.abs(o.y2-o.y)+6); ctx.setLineDash([]); }
    } else if(o.type==='text'){
      ctx.fillStyle = o.color || '#000'; 
      ctx.font = `${o.fontSize||20}px Inter, Arial`; 
      ctx.fillText(o.text,o.x,o.y);
      if(o.id===selectedId){ 
        const w = ctx.measureText(o.text).width;
        ctx.setLineDash([5,5]); ctx.strokeRect(o.x-3,o.y-o.fontSize-3,w+6,o.fontSize+6); ctx.setLineDash([]); 
      }
    }
  }
}

// Event handlers - VYLEPŠENÉ PRE MOBIL
function onDown(e){
  e.preventDefault(); // Important for mobile
  const pos = getCanvasPos(e);
  
  if(tool==='draw'){
    startStroke(pos);
    renderAll();
    return;
  }
  
  if(tool==='eraser'){
    drawing = true;
    rCtx.strokeStyle = '#ffffff';
    rCtx.globalCompositeOperation = 'destination-out';
    rCtx.beginPath();
    rCtx.moveTo(pos.x, pos.y);
    renderAll();
    return;
  }
  
  if(tool==='select'){
    selectedId = hitTest(pos.x,pos.y);
    if(selectedId){
      const o = objects.find(x=>x.id===selectedId);
      if(o && !o.locked){
        dragging = true;
        dragOffset.x = pos.x - o.x;
        dragOffset.y = pos.y - o.y;
      }
    }
    updateSelInfo();
    renderAll();
    return;
  }
  
  if(['rect','circle','line','text'].includes(tool)){
    createShape(tool, pos);
  }
}

function onMove(e){
  e.preventDefault();
  if(!e.buttons && !e.touches) return;
  const pos = getCanvasPos(e);
  
  if(tool==='draw' && drawing){
    continueStroke(pos);
    return;
  }
  
  if(tool==='eraser' && drawing){
    rCtx.lineTo(pos.x, pos.y);
    rCtx.stroke();
    renderAll();
    return;
  }
  
  if(dragging && selectedId){
    const o = objects.find(x=>x.id===selectedId);
    if(o && !o.locked){
      o.x = pos.x - dragOffset.x;
      o.y = pos.y - dragOffset.y;
    }
    renderAll(); updateSelInfo();
  }
}

function onUp(e){
  e.preventDefault();
  if(tool==='draw' && drawing) endStroke();
  if(tool==='eraser' && drawing){ 
    drawing=false; 
    rCtx.globalCompositeOperation = 'source-over';
    rCtx.strokeStyle = color;
  }
  if(dragging) dragging=false;
}

// Event listeners - VYLEPŠENÉ PRE MOBIL
raster.addEventListener('pointerdown', onDown);
raster.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);

// Touch events for mobile
raster.addEventListener('touchstart', onDown);
raster.addEventListener('touchmove', onMove);
window.addEventListener('touchend', onUp);

main.addEventListener('pointerdown', onDown);
main.addEventListener('pointermove', onMove);
main.addEventListener('touchstart', onDown);
main.addEventListener('touchmove', onMove);

// Prevent scrolling when drawing on mobile
document.addEventListener('touchmove', function(e) {
  if(drawing || dragging) {
    e.preventDefault();
  }
}, { passive: false });

// Modal actions
$('modalCancel').addEventListener('click', ()=>{ $('modalBg').style.display='none'; pendingShape=null; });
$('modalOk').addEventListener('click', ()=>{
  if(!pendingShape){ $('modalBg').style.display='none'; return; }
  const w = parseFloat($('mWidth').value)||100;
  const h = parseFloat($('mHeight').value)||80;
  const r = parseFloat($('mRadius').value)||50;
  const pos = pendingShape;
  if(pos.type==='rect'){ const o={id:genId(),type:'rect',x:pos.x,y:pos.y,w:w,h:h,color:color,stroke:Math.max(2,sizeVal/1.2),locked:false}; objects.push(o); selectedId=o.id; }
  else if(pos.type==='circle'){ const o={id:genId(),type:'circle',x:pos.x,y:pos.y,r:r,color:color,stroke:Math.max(2,sizeVal/1.2),locked:false}; objects.push(o); selectedId=o.id; }
  else if(pos.type==='line'){ const o={id:genId(),type:'line',x:pos.x,y:pos.y,x2:pos.x+w,y2:pos.y+h,color:color,stroke:Math.max(2,sizeVal/1.2),locked:false}; objects.push(o); selectedId=o.id; }
  $('modalBg').style.display='none'; pendingShape=null; renderAll(); updateProjectsList(); updateSelInfo();
});

// Selection info & controls
function updateSelInfo(){
  const box = $('selInfo'); box.innerHTML = '';
  if(!selectedId){ box.innerHTML = '<div class="small">Žiadny výber</div>'; return; }
  const o = objects.find(x=>x.id===selectedId);
  if(!o){ box.innerHTML = '<div class="small">Žiadny výber</div>'; return; }
  const pre = document.createElement('pre'); pre.textContent = JSON.stringify(o, ['id','type','x','y','w','h','r','x2','y2','text','fontSize','locked','color','stroke'], 2);
  pre.className='small';
  box.appendChild(pre);
}

// Delete & lock & edit
$('deleteBtn').addEventListener('click', ()=>{
  if(!selectedId) return alert('Vyber objekt');
  const idx = objects.findIndex(o=>o.id===selectedId);
  if(idx>=0){ objects.splice(idx,1); selectedId=null; updateSelInfo(); renderAll(); updateProjectsList(); }
});
$('lockBtn').addEventListener('click', ()=>{
  if(!selectedId) return alert('Vyber objekt');
  const o = objects.find(o=>o.id===selectedId);
  if(o){ o.locked = !o.locked; updateSelInfo(); renderAll(); }
});
$('editText').addEventListener('click', ()=>{
  if(!selectedId) return alert('Vyber text');
  const o = objects.find(o=>o.id===selectedId);
  if(!o || o.type!=='text') return alert('Vybratý objekt nie je text');
  const t = prompt('Uprav text', o.text);
  if(t!==null){ o.text = t; renderAll(); updateProjectsList(); updateSelInfo(); }
});
main.addEventListener('dblclick', e=>{
  const pos = getCanvasPos(e);
  const id=hitTest(pos.x,pos.y);
  if(!id) return;
  const o = objects.find(x=>x.id===id);
  if(o && o.type==='text'){ const t = prompt('Uprav text', o.text); if(t!==null){ o.text=t; renderAll(); updateProjectsList(); updateSelInfo(); } }
});

// Bring front / send back
$('bringFront').addEventListener('click', ()=>{
  if(!selectedId) return;
  const i=objects.findIndex(o=>o.id===selectedId);
  if(i>=0){ const [o]=objects.splice(i,1); objects.push(o); renderAll(); updateProjectsList(); }
});
$('sendBack').addEventListener('click', ()=>{
  if(!selectedId) return;
  const i=objects.findIndex(o=>o.id===selectedId);
  if(i>=0){ const [o]=objects.splice(i,1); objects.unshift(o); renderAll(); updateProjectsList(); }
});

// Set canvas size
$('setCanvasBtn').addEventListener('click', ()=>{
  const w = Math.max(50, parseInt($('canvasW').value)||800);
  const h = Math.max(50, parseInt($('canvasH').value)||500);
  
  const data = raster.toDataURL();
  raster.width = w; 
  raster.height = h;
  main.width = w; 
  main.height = h;
  
  const img = new Image();
  img.onload = ()=>{ 
    rCtx.clearRect(0,0,raster.width,raster.height); 
    rCtx.drawImage(img,0,0); 
    renderAll(); 
  }
  img.src = data;
});

// Clear canvas
$('clearBtn').addEventListener('click', ()=>{
  if(!confirm('Vymazať celú plochu (tvary + kresba)?')) return;
  objects=[]; 
  strokes=[]; 
  rCtx.fillStyle = '#ffffff';
  rCtx.fillRect(0,0,raster.width,raster.height);
  selectedId=null; 
  updateSelInfo(); 
  renderAll(); 
  updateProjectsList();
});

// Save/load projects
function saveProject(){
  const name = prompt('Názov projektu:','moj_projekt');
  if(!name) return;
  const payload = { objects, rasterData: raster.toDataURL('image/png'), meta:{savedAt:Date.now(), w:raster.width, h:raster.height} };
  localStorage.setItem('erakai_proj_'+name, JSON.stringify(payload));
  updateProjectsList(); alert('Uložené: '+name);
}
$('saveBtn').addEventListener('click', saveProject);

function loadProject(){
  const keys = Object.keys(localStorage).filter(k=>k.startsWith('erakai_proj_'));
  if(keys.length===0) return alert('Žiadne projekty uložené');
  const list = keys.map(k=>k.replace('erakai_proj_',''));
  const name = prompt('Vyber projekt:\n'+list.join('\n'), list[0]);
  if(!name) return;
  const raw = localStorage.getItem('erakai_proj_'+name);
  if(!raw) return alert('Projekt nenájdený');
  try{
    const payload = JSON.parse(raw);
    objects = payload.objects || [];
    const img = new Image();
    img.onload = ()=>{ 
      rCtx.clearRect(0,0,raster.width,raster.height); 
      rCtx.drawImage(img,0,0); 
      renderAll(); 
      updateSelInfo(); 
      updateProjectsList(); 
    };
    img.src = payload.rasterData || '';
  }catch(err){ alert('Chyba pri načítaní projektu'); }
}
$('loadBtn').addEventListener('click', loadProject);

function updateProjectsList(){
  const cont = $('projects'); cont.innerHTML='';
  const keys = Object.keys(localStorage).filter(k=>k.startsWith('erakai_proj_'));
  if(keys.length===0){ cont.innerHTML='<div class="small">Žiadne</div>'; return; }
  keys.forEach(k=>{
    const name = k.replace('erakai_proj_','');
    const row = document.createElement('div'); 
    row.style.display='flex'; 
    row.style.justifyContent='space-between'; 
    row.style.alignItems='center'; 
    row.style.padding='6px';
    const left = document.createElement('div'); left.textContent = name; left.style.fontSize='13px';
    const right = document.createElement('div');
    const btnLoad = document.createElement('button'); btnLoad.textContent='Načítať'; btnLoad.className='toolbtn'; 
    btnLoad.onclick=()=>{ 
      if(confirm('Načítať '+name+'?')){ 
        const raw = localStorage.getItem('erakai_proj_'+name); 
        const p = JSON.parse(raw); 
        objects = p.objects||[]; 
        const img = new Image(); 
        img.onload=()=>{ 
          rCtx.clearRect(0,0,raster.width,raster.height); 
          rCtx.drawImage(img,0,0); 
          renderAll(); 
        }; 
        img.src = p.rasterData||''; 
        selectedId=null; 
        updateSelInfo(); 
        updateProjectsList(); 
      } 
    };
    const btnDel = document.createElement('button'); btnDel.textContent='Zmazať'; btnDel.className='toolbtn'; 
    btnDel.onclick=()=>{ if(confirm('Zmazať '+name+'?')){ localStorage.removeItem('erakai_proj_'+name); updateProjectsList(); } };
    right.appendChild(btnLoad); right.appendChild(btnDel);
    row.appendChild(left); row.appendChild(right); cont.appendChild(row);
  });
}

// Export PNG
$('exportBtn').addEventListener('click', ()=>{
  const tmp = document.createElement('canvas');
  tmp.width = raster.width; tmp.height = raster.height;
  const tctx = tmp.getContext('2d');
  
  // Draw white background
  tctx.fillStyle = '#ffffff';
  tctx.fillRect(0, 0, tmp.width, tmp.height);
  
  // Draw raster (drawing)
  tctx.drawImage(raster,0,0);
  
  // Draw objects
  for(const o of objects){
    if(o.type==='rect'){
      tctx.lineWidth = o.stroke||Math.max(2,sizeVal/1.5);
      tctx.strokeStyle = o.color||'#000';
      if(o.fill){ tctx.fillStyle=o.fill; tctx.fillRect(o.x,o.y,o.w,o.h); }
      tctx.strokeRect(o.x,o.y,o.w,o.h);
    } else if(o.type==='circle'){
      tctx.lineWidth = o.stroke||Math.max(2,sizeVal/1.5);
      tctx.strokeStyle = o.color||'#000';
      tctx.beginPath(); tctx.arc(o.x+o.r,o.y+o.r,o.r,0,Math.PI*2);
      if(o.fill){ tctx.fillStyle=o.fill; tctx.fill(); }
      tctx.stroke();
    } else if(o.type==='line'){
      tctx.lineWidth = o.stroke||Math.max(2,sizeVal/1.5);
      tctx.strokeStyle = o.color||'#000';
      tctx.beginPath(); tctx.moveTo(o.x,o.y); tctx.lineTo(o.x2,o.y2); tctx.stroke();
    } else if(o.type==='text'){
      tctx.fillStyle = o.color||'#000'; tctx.font = `${o.fontSize||20}px Inter, Arial`; tctx.fillText(o.text,o.x,o.y);
    }
  }
  
  const url = tmp.toDataURL('image/png');
  const a = document.createElement('a'); a.href = url; a.download = 'erakai_canvas.png'; a.click();
});

// Download/upload project JSON
$('downloadProject').addEventListener('click', ()=>{
  const data = { objects, rasterData: raster.toDataURL('image/png'), meta:{w:raster.width,h:raster.height} };
  const blob = new Blob([JSON.stringify(data)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'erakai_project.json'; a.click();
});
$('uploadProjectBtn').addEventListener('click', ()=>$('uploadProject').click());
$('uploadProject').addEventListener('change', function(){
  const file = this.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=> {
    try{
      const payload = JSON.parse(e.target.result);
      objects = payload.objects||[];
      const img = new Image(); img.onload=()=>{ rCtx.clearRect(0,0,raster.width,raster.height); rCtx.drawImage(img,0,0); renderAll(); updateProjectsList(); alert('Projekt načítaný'); }; img.src = payload.rasterData||'';
    }catch(err){ alert('Neplatný JSON'); }
  };
  reader.readAsText(file);
});

// Keyboard shortcuts
window.addEventListener('keydown', e=>{
  if(e.key==='Delete' || e.key==='Backspace'){ if(selectedId){ const idx = objects.findIndex(o=>o.id===selectedId); if(idx>=0){ objects.splice(idx,1); selectedId=null; updateSelInfo(); renderAll(); updateProjectsList(); } } }
  if(e.key==='d') setTool('draw');
  if(e.key==='v') setTool('select');
  if(e.key==='e') setTool('eraser');
});

// Theme toggle
$('themeToggle').addEventListener('click', ()=>{
  document.body.classList.toggle('light-mode');
  if(document.body.classList.contains('light-mode')){
    document.body.style.background = 'linear-gradient(180deg,#f6f9ff,#eef4ff)';
    document.body.style.color = '#0b1220';
  } else {
    document.body.style.background = 'linear-gradient(180deg,#071026,#071022)';
    document.body.style.color = '#e6eef6';
  }
});

// Handle window resize
window.addEventListener('resize', initCanvas);

// Initial render
initCanvas();
updateProjectsList();

</script>
</body>
</html>
