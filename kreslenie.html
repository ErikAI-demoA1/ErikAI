<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🎨 ErikAI Kreslenie</title>
<style>
body, html {margin:0;padding:0;height:100%;font-family:Arial,sans-serif;background:#071026;color:white;}
canvas {background:white; display:block; margin:auto; border:1px solid #444;}
.toolbar {text-align:center; margin:10px;}
button,input {margin:2px; padding:6px 10px; cursor:pointer;}
</style>
</head>
<body>

<div class="toolbar">
<button id="selectBtn">Select</button>
<button id="drawBtn">Draw</button>
<button id="eraserBtn">Guma</button>
<button id="rectBtn">Rect</button>
<button id="circleBtn">Circle</button>
<button id="lineBtn">Line</button>
<button id="textBtn">Text</button>
<button id="deleteBtn">Delete</button>
<button id="lockBtn">Lock</button>
<input type="color" id="color" value="#ff0000">
<input type="number" id="size" value="5" min="1" max="50">
<input type="number" id="fontSize" value="20" min="8" max="72">
<button id="saveBtn">💾 Uložiť</button>
<button id="loadBtn">📂 Načítať</button>
<button id="exportBtn">⬇ Export PNG</button>
<button id="clearBtn">🧹 Vyčistiť</button>
</div>

<canvas id="mainCanvas" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

let tool='select';
let color = document.getElementById('color').value;
let sizeVal = parseInt(document.getElementById('size').value);
let fontSize = parseInt(document.getElementById('fontSize').value);

document.getElementById('color').addEventListener('input', e=>color=e.target.value);
document.getElementById('size').addEventListener('input', e=>sizeVal=parseInt(e.target.value));
document.getElementById('fontSize').addEventListener('input', e=>fontSize=parseInt(e.target.value));

document.getElementById('selectBtn').onclick = ()=>tool='select';
document.getElementById('drawBtn').onclick = ()=>tool='draw';
document.getElementById('eraserBtn').onclick = ()=>tool='eraser';
document.getElementById('rectBtn').onclick = ()=>tool='rect';
document.getElementById('circleBtn').onclick = ()=>tool='circle';
document.getElementById('lineBtn').onclick = ()=>tool='line';
document.getElementById('textBtn').onclick = ()=>tool='text';
document.getElementById('deleteBtn').onclick = deleteSelected;
document.getElementById('lockBtn').onclick = lockSelected;

document.getElementById('clearBtn').onclick = ()=>{if(confirm('Vyčistiť plátno?')){objects=[];selectedId=null;redraw();}};
document.getElementById('exportBtn').onclick = ()=>{const url=canvas.toDataURL('image/png'); const a=document.createElement('a'); a.href=url;a.download='erikAI.png'; a.click();};
document.getElementById('saveBtn').onclick = saveProjects;
document.getElementById('loadBtn').onclick = loadProjects;

let objects=[], selectedId=null, currentStroke=null, drawing=false, dragging=false, dragOffset={x:0,y:0};

function genId(){return 'o_'+Math.random().toString(36).slice(2,9);}
function getPos(e){const r=canvas.getBoundingClientRect();const x=e.clientX||e.touches[0].clientX;const y=e.clientY||e.touches[0].clientY;return{x:(x-r.left)*canvas.width/r.width,y:(y-r.top)*canvas.height/r.height};}

canvas.addEventListener('mousedown',startDraw);
canvas.addEventListener('mousemove',moveDraw);
canvas.addEventListener('mouseup',endDraw);
canvas.addEventListener('touchstart',startDraw);
canvas.addEventListener('touchmove',moveDraw);
canvas.addEventListener('touchend',endDraw);

function startDraw(e){
  const p=getPos(e);
  drawing=true;
  if(tool==='draw'){currentStroke={id:genId(),type:'stroke',color,stroke:sizeVal,points:[p]}; objects.push(currentStroke);}
  else if(tool==='eraser'){currentStroke={id:genId(),type:'stroke',color:'#fff',stroke:sizeVal,points:[p]}; objects.push(currentStroke);}
  else if(tool==='rect'){objects.push({id:genId(),type:'rect',x:p.x,y:p.y,w:100,h:60,color,locked:false}); redraw();}
  else if(tool==='circle'){objects.push({id:genId(),type:'circle',x:p.x-50,y:p.y-50,r:50,color,locked:false}); redraw();}
  else if(tool==='line'){objects.push({id:genId(),type:'line',x:p.x,y:p.y,x2:p.x+100,y2:p.y,color,stroke:sizeVal,locked:false}); redraw();}
  else if(tool==='text'){const t=prompt('Zadaj text:'); if(t) objects.push({id:genId(),type:'text',x:p.x,y:p.y,text:t,fontSize,color,locked:false}); redraw();}
  else if(tool==='select'){selectedId=hitTest(p.x,p.y); if(selectedId){dragging=true; const o=objects.find(o=>o.id===selectedId); dragOffset={x:p.x-o.x,y:p.y-o.y};}}
}

function moveDraw(e){
  if(!drawing) return;
  const p=getPos(e);
  if(tool==='draw'||tool==='eraser'){currentStroke.points.push(p); redraw();}
  else if(tool==='select' && dragging){
    const o=objects.find(o=>o.id===selectedId);
    if(o && !o.locked){
      if(o.type==='line'){let dx=p.x-dragOffset.x-o.x; let dy=p.y-dragOffset.y-o.y; o.x=p.x-dragOffset.x; o.y=p.y-dragOffset.y; o.x2+=dx; o.y2+=dy;}
      else{o.x=p.x-dragOffset.x; o.y=p.y-dragOffset.y;}
      redraw();
    }
  }
}

function endDraw(){drawing=false; currentStroke=null; dragging=false;}

function hitTest(x,y){
  for(let i=objects.length-1;i>=0;i--){
    const o=objects[i];
    if(o.type==='rect' && x>=o.x && x<=o.x+o.w && y>=o.y && y<=o.y+o.h) return o.id;
    if(o.type==='circle'){ const dx=x-(o.x+o.r),dy=y-(o.y+o.r); if(dx*dx+dy*dy<=o.r*o.r) return o.id;}
    if(o.type==='line'){const d=pointToSegmentDistance({x,y},{x:o.x,y:o.y},{x:o.x2,y:o.y2}); if(d<=Math.max(6,o.stroke||4)) return o.id;}
    if(o.type==='text'){ctx.font=`${o.fontSize||20}px Arial`; const w=ctx.measureText(o.text).width,h=o.fontSize*1.2; if(x>=o.x && x<=o.x+w && y>=o.y-h && y<=o.y) return o.id;}
  }
  return null;
}

function pointToSegmentDistance(p,v,w){const l2=(w.x-v.x)**2+(w.y-v.y)**2; if(l2===0) return Math.hypot(p.x-v.x,p.y-v.y); let t=((p.x-v.x)*(w.x-v.x)+(p.y-v.y)*(w.y-v.y))/l2; t=Math.max(0,Math.min(1,t)); const proj={x:v.x+t*(w.x-v.x),y:v.y+t*(w.y-v.y)}; return Math.hypot(p.x-proj.x,p.y-proj.y);}

function redraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const o of objects){
    ctx.strokeStyle=o.color; ctx.fillStyle=o.color; ctx.lineWidth=o.stroke||2;
    ctx.globalAlpha=o.locked?0.4:1;
    if(o.type==='stroke'){ctx.beginPath(); ctx.moveTo(o.points[0].x,o.points[0].y); for(let p of o.points) ctx.lineTo(p.x,p.y); ctx.stroke();}
    else if(o.type==='rect'){ctx.fillRect(o.x,o.y,o.w,o.h); ctx.strokeRect(o.x,o.y,o.w,o.h);}
    else if(o.type==='circle'){ctx.beginPath(); ctx.arc(o.x+o.r,o.y+o.r,o.r,0,2*Math.PI); ctx.fill(); ctx.stroke();}
    else if(o.type==='line'){ctx.beginPath(); ctx.moveTo(o.x,o.y); ctx.lineTo(o.x2,o.y2); ctx.stroke();}
    else if(o.type==='text'){ctx.font=`${o.fontSize}px Arial`; ctx.fillText(o.text,o.x,o.y);}
    ctx.globalAlpha=1;
  }
}

function deleteSelected(){if(selectedId){objects=objects.filter(o=>o.id!==selectedId); selectedId=null; redraw();}}
function lockSelected(){if(selectedId){const o=objects.find(o=>o.id===selectedId); o.locked=!o.locked; redraw();}}

function saveProjects(){localStorage.setItem('erikAI',JSON.stringify(objects)); alert('Uložené!');}
function loadProjects(){const data=localStorage.getItem('erikAI'); if(data){objects=JSON.parse(data); redraw(); alert('Načítané!');}}
</script>

</body>
  </html>
