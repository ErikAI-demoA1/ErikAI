<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎨 ErikAI Kreslenie</title>
<style>
body{margin:0;font-family:sans-serif;background:#071026;color:#e6eef6}
header,footer{padding:10px;text-align:center;background:#0b1220}
canvas{border:1px solid #333;display:block;margin:10px auto;background:white;touch-action:none}
button,input[type=color],input[type=range],input[type=number]{margin:3px}
#toolbar{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
</style>
</head>
<body>
<header>🎨 ErikAI Kreslenie</header>

<div id="toolbar">
<button id="selectBtn">Select</button>
<button id="drawBtn">Draw</button>
<button id="eraserBtn">Guma</button>
<button id="rectBtn">Obdĺžnik</button>
<button id="circleBtn">Kruh</button>
<button id="textBtn">Text</button>
<button id="delBtn">Vymazať</button>
<label>Farba:<input type="color" id="color" value="#ff0000"></label>
<label>Hrúbka:<input type="range" id="size" min="1" max="40" value="5"></label>
<label>Text veľkosť:<input type="number" id="fontSize" min="8" max="72" value="20"></label>
<label>Plátno W:<input type="number" id="canvasW" value="600" style="width:60px"> H:<input type="number" id="canvasH" value="400" style="width:60px"></label>
<button id="setCanvasBtn">Nastaviť plátno</button>
<button id="saveBtn">Uložiť JSON</button>
<input type="file" id="loadFile" style="display:none">
<button id="loadBtn">Načítať JSON</button>
<button id="exportBtn">Export PNG</button>
</div>

<canvas id="canvas" width="600" height="400"></canvas>
<footer>© 2025 ErikAI</footer>

<script>
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
let tool='select', color='#ff0000', size=5, fontSize=20;
let objects=[], selected=null, drawing=false, currentStroke=null;
let offsetX=0, offsetY=0;

const selectBtn=document.getElementById('selectBtn');
const drawBtn=document.getElementById('drawBtn');
const eraserBtn=document.getElementById('eraserBtn');
const rectBtn=document.getElementById('rectBtn');
const circleBtn=document.getElementById('circleBtn');
const textBtn=document.getElementById('textBtn');
const delBtn=document.getElementById('delBtn');

document.getElementById('color').addEventListener('input', e=>color=e.target.value);
document.getElementById('size').addEventListener('input', e=>size=parseInt(e.target.value));
document.getElementById('fontSize').addEventListener('input', e=>fontSize=parseInt(e.target.value));
document.getElementById('setCanvasBtn').addEventListener('click', ()=>{
  canvas.width=parseInt(document.getElementById('canvasW').value)||600;
  canvas.height=parseInt(document.getElementById('canvasH').value)||400;
  render();
});

function setTool(t){tool=t;}
selectBtn.onclick=()=>setTool('select'); drawBtn.onclick=()=>setTool('draw'); eraserBtn.onclick=()=>setTool('eraser');
rectBtn.onclick=()=>setTool('rect'); circleBtn.onclick=()=>setTool('circle'); textBtn.onclick=()=>setTool('text');

canvas.onmousedown=canvas.ontouchstart=function(e){
  const rect=canvas.getBoundingClientRect();
  const x=((e.touches?e.touches[0].clientX:e.clientX)-rect.left)*(canvas.width/rect.width);
  const y=((e.touches?e.touches[0].clientY:e.clientY)-rect.top)*(canvas.height/rect.height);
  if(tool==='draw'){drawing=true; currentStroke={type:'stroke',color,size,points:[{x,y}]}; objects.push(currentStroke);}
  else if(tool==='eraser'){drawing=true; currentStroke={type:'stroke',color:'#fff',size,points:[{x,y}]}; objects.push(currentStroke);}
  else if(tool==='rect'){ const w=+prompt('Šírka','100'); const h=+prompt('Výška','80'); if(w&&h) objects.push({type:'rect',x,y,w,h,color,size}); render();}
  else if(tool==='circle'){ const r=+prompt('Polomer','50'); if(r) objects.push({type:'circle',x,y,r,color,size}); render();}
  else if(tool==='text'){ const t=prompt('Text',''); if(t) objects.push({type:'text',x,y,text:t,color,fontSize}); render();}
  else if(tool==='select'){selected=hitTest(x,y); if(selected){offsetX=x-selected.x; offsetY=y-selected.y;}}
};

canvas.onmousemove=canvas.ontouchmove=function(e){
  if(!drawing && tool!=='select') return;
  const rect=canvas.getBoundingClientRect();
  const x=((e.touches?e.touches[0].clientX:e.clientX)-rect.left)*(canvas.width/rect.width);
  const y=((e.touches?e.touches[0].clientY:e.clientY)-rect.top)*(canvas.height/rect.height);
  if(drawing && (tool==='draw'||tool==='eraser')){currentStroke.points.push({x,y}); render();}
  else if(tool==='select' && selected){selected.x=x-offsetX; selected.y=y-offsetY; render();}
};

canvas.onmouseup=canvas.ontouchend=function(){drawing=false; currentStroke=null; selected=null; render();};

delBtn.onclick=()=>{if(selected){objects=objects.filter(o=>o!==selected); selected=null; render();}};

function hitTest(x,y){for(let i=objects.length-1;i>=0;i--){const o=objects[i];
if(o.type==='rect'&&x>=o.x&&x<=o.x+o.w&&y>=o.y&&y<=o.y+o.h)return o;
if(o.type==='circle'){const dx=x-o.x,dy=y-o.y;if(dx*dx+dy*dy<=o.r*o.r)return o;}
if(o.type==='text'){ctx.font=o.fontSize+'px Arial';const w=ctx.measureText(o.text).width,h=o.fontSize;if(x>=o.x&&x<=o.x+w&&y>=o.y&&y<=o.y+h)return o;}
if(o.type==='stroke'){for(let p of o.points){if(Math.abs(p.x-x)<o.size && Math.abs(p.y-y)<o.size) return o;}}
} return null;}

function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const o of objects){
    if(o.type==='stroke'){ctx.strokeStyle=o.color; ctx.lineWidth=o.size; ctx.beginPath(); ctx.moveTo(o.points[0].x,o.points[0].y); for(let p of o.points) ctx.lineTo(p.x,p.y); ctx.stroke();}
    else if(o.type==='rect'){ctx.strokeStyle=o.color; ctx.lineWidth=o.size; ctx.strokeRect(o.x,o.y,o.w,o.h);}
    else if(o.type==='circle'){ctx.strokeStyle=o.color; ctx.lineWidth=o.size; ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,2*Math.PI); ctx.stroke();}
    else if(o.type==='text'){ctx.fillStyle=o.color; ctx.font=o.fontSize+'px Arial'; ctx.fillText(o.text,o.x,o.y);}
  }
  if(selected){ctx.save(); ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.setLineDash([6,6]);
    if(selected.type==='rect') ctx.strokeRect(selected.x-2,selected.y-2,selected.w+4,selected.h+4);
    if(selected.type==='circle') {ctx.beginPath(); ctx.arc(selected.x,selected.y,selected.r+2,0,2*Math.PI); ctx.stroke();}
    if(selected.type==='text'){const w=ctx.measureText(selected.text).width,h=selected.fontSize; ctx.strokeRect(selected.x-2,selected.y-2,w+4,h+4);}
    if(selected.type==='stroke'){ctx.beginPath(); for(let p of selected.points) ctx.lineTo(p.x,p.y); ctx.stroke();}
    ctx.restore();}
}

document.getElementById('exportBtn').onclick=function(){const a=document.createElement('a'); a.href=canvas.toDataURL(); a.download='drawing.png'; a.click();}
document.getElementById('saveBtn').onclick=function(){const data=JSON.stringify(objects); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download='drawing.json'; a.click();}
document.getElementById('loadBtn').onclick=function(){document.getElementById('loadFile').click();}
document.getElementById('loadFile').onchange=function(e){const file=e.target.files[0]; const reader=new FileReader(); reader.onload=function(evt){objects=JSON.parse(evt.target.result); render();}; reader.readAsText(file);}
</script>
</body>
  </html>
