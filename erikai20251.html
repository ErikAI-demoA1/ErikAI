<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8" />
<title>ErikAI OS — Premium Countdown</title>
<style>
html, body {
    width: 100vw;
    height: 100vh;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #020617;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* KONTAJNER VŠETKÉHO */
#container {
    width: 1280px;
    height: 720px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    text-align: center;
}

/* HOLOGRAFICKÉ LASEROVÉ POZADIE */
.laser {
    position: absolute;
    width: 140%;
    height: 140%;
    background: conic-gradient(from 0deg, #0ea5e9, #14b8a6, #3b82f6, #0ea5e9);
    filter: blur(160px);
    animation: spin 18s linear infinite;
    opacity: 0.15;
    z-index: -2;
}
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* 3D HOLOGRAFICKÉ HODINY */
#clock3d {
    width: 320px;
    height: 320px;
    border-radius: 50%;
    border: 6px solid rgba(255,255,255,0.15);
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 30px;
    box-shadow: 0 0 35px #0ea5e9 inset, 0 0 60px #0ea5e9;
    font-size: 48px;
    font-weight: 700;
    backdrop-filter: blur(14px);
    animation: glowPulse 4s ease-in-out infinite alternate;
}
@keyframes glowPulse { 0% { box-shadow:0 0 25px #0ea5e9 inset,0 0 40px #0ea5e9;} 100% { box-shadow:0 0 55px #0ea5e9 inset,0 0 90px #0ea5e9;} }

/* TITUL ERIKAI OS */
#titleAI {
    font-size: 72px;
    font-weight: 900;
    margin-bottom: 15px;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #0ea5e9, #38bdf8, #e0f2fe);
    -webkit-background-clip: text;
    color: transparent;
    animation: shine 6s infinite linear;
    text-shadow: 0 0 30px #0ea5e9, 0 0 40px #38bdf8;
}
@keyframes shine { 0% { filter:hue-rotate(0deg);} 50% { filter:hue-rotate(180deg);} 100%{filter:hue-rotate(360deg);} }

#year { font-size: 56px; font-weight: 800; margin-bottom:15px; animation: fadeInUp 2s ease forwards; }
#countdown { font-size: 32px; margin-bottom:25px; animation: fadeInUp 2s ease 0.5s forwards; }

.nav {
    font-size: 34px; cursor: pointer; user-select: none;
    margin: 10px; padding: 12px 30px; border-radius:18px;
    background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25);
    transition:0.4s; backdrop-filter: blur(6px);
    animation: fadeInUp 2s ease 1s forwards;
}
.nav:hover {
    background: #0ea5e9; color: black;
    box-shadow:0 0 30px #0ea5e9; transform: translateY(-4px) scale(1.05);
}

#msg {
    margin-top:25px;
    font-size:24px;
    opacity:0.85;
    animation: fadeInUp 2s ease 1.5s forwards;
}

/* ANIMÁCIE */
@keyframes fadeInUp {
    0% { opacity: 0; transform: translateY(20px);}
    100% { opacity: 1; transform: translateY(0);}
}
</style>
</head>
<body>
<div id="container">
    <div class="laser"></div>
    <div id="titleAI">ERIKAI OS</div>
    <div id="clock3d">00:00:00</div>
    <div id="year"></div>
    <div id="countdown"></div>
    <div style="display:flex; gap: 35px; justify-content:center; margin-top:10px;">
        <div class="nav" onclick="changeYear(-1)">⟵ MINULOSŤ</div>
        <div class="nav" onclick="changeYear(1)">BUDÚCNOSŤ ⟶</div>
    </div>
    <div id="msg"></div>
</div>

<!-- ZVUK -->
<audio id="tickSound" preload="auto" loop>
    <source src="Zvuk3.mp3" type="audio/mp3">
</audio>

<script>
let currentYear = new Date().getFullYear();
const tick = document.getElementById("tickSound");

// Spustenie zvuku po prvom kliknutí
document.body.addEventListener("click", ()=>{ tick.play().catch(()=>{}); }, {once:true});

// Hodiny
function updateClock3D() {
    const now = new Date();
    const h = now.getHours().toString().padStart(2,"0");
    const m = now.getMinutes().toString().padStart(2,"0");
    const s = now.getSeconds().toString().padStart(2,"0");
    document.getElementById("clock3d").textContent = `${h}:${m}:${s}`;
}

// Odpočet aktuálneho alebo vybraného roku
function updateDisplay() {
    const now = new Date();
    const target = new Date(currentYear+1,0,1); // koniec prítomného roku
    document.getElementById("year").textContent = "Rok: " + currentYear;
    const diff = target - now;

    if(diff>0){
        const d=Math.floor(diff/(1000*60*60*24));
        const h=Math.floor((diff/(1000*60*60))%24);
        const m=Math.floor((diff/(1000*60))%60);
        const s=Math.floor((diff/1000)%60);
        let msgText = (currentYear === new Date().getFullYear()) ?
            "Držíme sa prítomného roka — pomalý odchod, ďakujeme za všetko" :
            "Brzo sa dočkáš — ErikAI OS Premium • by Erik Mohylák";

        document.getElementById("countdown").textContent =
            `${d} dní • ${h} hod • ${m} min • ${s} sek`;
        document.getElementById("msg").textContent = msgText;
    } else {
        document.getElementById("countdown").textContent = "Už nastal koniec roka";
        document.getElementById("msg").textContent = "ErikAI OS pokračuje ďalej v prémiovom režime";
    }
}

// Zmena roku
function changeYear(direction){
    currentYear += direction;
    updateDisplay();
}

// Spustenie hodín a odpočtu
setInterval(()=>{ updateClock3D(); updateDisplay(); },1000);

updateClock3D();
updateDisplay();
</script>
</body>
</html>
