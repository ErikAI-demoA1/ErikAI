<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8" />
<title>ErikAI OS — Premium Countdown</title>
<style>
html, body {
    width: 100vw;
    height: 100vh;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #020617;
    font-family: 'Segoe UI', sans-serif;
    color: white;
}

#container {
    width: 1280px;   /* pevná šírka */
    height: 720px;   /* pevná výška */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
}

/* HOLOGRAFICKÉ LASEROVÉ POZADIE */
.laser {
    position: absolute;
    width: 140%;
    height: 140%;
    background: conic-gradient(from 0deg, #0ea5e9, #14b8a6, #3b82f6, #0ea5e9);
    filter: blur(160px);
    animation: spin 18s linear infinite;
    opacity: 0.15;
    z-index: -2;
}
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* 3D HOLOGRAFICKÉ HODINY */
#clock3d {
    width: 280px;
    height: 280px;
    border-radius: 50%;
    border: 6px solid rgba(255,255,255,0.15);
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 30px;
    box-shadow: 0 0 35px #0ea5e9 inset, 0 0 45px #0ea5e9;
    font-size: 42px;
    font-weight: 700;
    backdrop-filter: blur(12px);
    animation: glowPulse 4s ease-in-out infinite alternate;
}
@keyframes glowPulse { 0% { box-shadow:0 0 20px #0ea5e9 inset,0 0 25px #0ea5e9;} 100% { box-shadow:0 0 45px #0ea5e9 inset,0 0 70px #0ea5e9;} }

/* TITUL ERIKAI OS */
#titleAI {
    font-size: 64px;
    font-weight: 900;
    margin-bottom: 10px;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #0ea5e9, #38bdf8, #e0f2fe);
    -webkit-background-clip: text;
    color: transparent;
    animation: shine 4s infinite linear;
    text-shadow: 0 0 25px #0ea5e9;
}
@keyframes shine { 0% { filter:hue-rotate(0deg);} 100%{filter:hue-rotate(360deg);} }

#year { font-size: 52px; font-weight: 800; margin-bottom:10px; }
#countdown { font-size: 30px; margin-bottom:20px; }

.nav {
    font-size: 34px; cursor: pointer; user-select: none;
    margin: 10px; padding: 12px 30px; border-radius:18px;
    background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25);
    transition:0.3s; backdrop-filter: blur(6px);
}
.nav:hover {
    background: #0ea5e9; color: black;
    box-shadow:0 0 25px #0ea5e9; transform: translateY(-4px) scale(1.05);
}

#msg { margin-top:25px; font-size:22px; opacity:0.8; }
</style>
</head>
<body>
<div id="container">
    <div class="laser"></div>
    <div id="titleAI">ERIKAI OS</div>
    <div id="clock3d">00:00:00</div>
    <div id="year"></div>
    <div id="countdown"></div>
    <div style="display:flex; gap: 35px; z-index:5; margin-top:10px;">
        <div class="nav" onclick="changeYear(-1)">⟵ MINULOSŤ</div>
        <div class="nav" onclick="changeYear(1)">BUDÚCNOSŤ ⟶</div>
    </div>
    <div id="msg"></div>
</div>

<!-- SEM DAJ SVOJ ZVUK -->
<audio id="tickSound" preload="auto" loop>
    <source src="Zvuk2.mp3" type="audio/mp3">
</audio>

<script>
let currentYear = new Date().getFullYear();
const tick = document.getElementById("tickSound");

// SPUSTENIE ZVUKU PO KLIKNUTÍ (bude sa opakovať v slučke)
document.body.addEventListener("click", ()=>{
    tick.play().catch(()=>{});
}, {once:true});

// FUNKCIA PRE HODINY 3D
function updateClock3D() {
    const now = new Date();
    const h = now.getHours().toString().padStart(2,"0");
    const m = now.getMinutes().toString().padStart(2,"0");
    const s = now.getSeconds().toString().padStart(2,"0");
    document.getElementById("clock3d").textContent = `${h}:${m}:${s}`;
}

// ODPOČET ROKU
function updateDisplay() {
    const now = new Date();
    const target = new Date(currentYear,0,1);
    document.getElementById("year").textContent = "Rok: " + currentYear;
    const diff = target - now;

    if(diff>0){
        const d=Math.floor(diff/(1000*60*60*24));
        const h=Math.floor((diff/(1000*60*60))%24);
        const m=Math.floor((diff/(1000*60))%60);
        const s=Math.floor((diff/1000)%60);
        document.getElementById("countdown").textContent =
            `${d} dní • ${h} hod • ${m} min • ${s} sek`;
        document.getElementById("msg").textContent =
            "Brzo sa dočkáš — ErikAI OS Premium • by Erik Mohylák";
    } else {
        document.getElementById("countdown").textContent = "Už nastal koniec roka";
        document.getElementById("msg").textContent = "ErikAI OS pokračuje ďalej v prémiovom režime";
    }
}

// ZMENA ROKU
function changeYear(direction){
    currentYear += direction;
    updateDisplay();
}

// SPUSTENIE HODÍN A ODPOČTU
setInterval(()=>{
    updateClock3D();
    updateDisplay();
},1000);

updateClock3D();
updateDisplay();
</script>
</body>
</html>
