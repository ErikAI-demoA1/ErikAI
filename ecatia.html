<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mini CAD — Line, Circle, Rectangle</title>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#eee;}
header{padding:8px;background:#222;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
canvas{background:#1a1a1a;display:block;margin:0 auto;border:1px solid #333;}
button{padding:6px 10px;border:none;border-radius:5px;background:#34d399;color:#000;cursor:pointer;}
button.ghost{background:#222;border:1px solid #555;color:#eee;}
.panel{padding:8px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.info{padding:4px;color:#ccc;}
input[type=number]{width:60px;}
#dimensionsPanel{
  position:fixed;top:10px;right:10px;background:#222;padding:10px;border-radius:5px;
  max-height:90vh;overflow:auto;display:none;
}
#dimensionsPanel h3{margin:0 0 5px 0;color:#34d399;}
#dimensionsPanel div{margin-bottom:5px;}
</style>
</head>
<body>
<header>
  <div class="panel">
    <button id="lineBtn">Čiara</button>
    <button id="circleBtn">Kruh</button>
    <button id="rectBtn">Obdĺžnik</button>
    <button id="undoBtn" class="ghost">Undo</button>
    <button id="redoBtn" class="ghost">Redo</button>
    <button id="exportImg" class="ghost">Export obrázok</button>
    <button id="exportJSON" class="ghost">Export JSON</button>
    <button id="editDimsBtn" class="ghost">Upraviť kóty</button>
  </div>
</header>

<canvas id="cadCanvas" width="1200" height="800"></canvas>
<div class="info" id="info">Vybratý nástroj: Čiara | Nulový bod: (0,0)</div>

<div id="dimensionsPanel">
  <h3>Kóty</h3>
  <div id="dimsContent">Žiadne tvary</div>
</div>

<script>
const canvas = document.getElementById('cadCanvas');
const ctx = canvas.getContext('2d');

let shapes = [], undoStack = [], redoStack = [];
let tool = 'line';
let startPt = null;
let origin = {x: 100, y: 100};
let editMode = false;

const info = document.getElementById('info');
const dimsPanel = document.getElementById('dimensionsPanel');
const dimsContent = document.getElementById('dimsContent');
const editDimsBtn = document.getElementById('editDimsBtn');

document.getElementById('lineBtn').onclick = () => tool = 'line';
document.getElementById('circleBtn').onclick = () => tool = 'circle';
document.getElementById('rectBtn').onclick = () => tool = 'rect';

editDimsBtn.onclick = () => {
  editMode = !editMode;
  dimsPanel.style.display = editMode ? 'block' : 'none';
  updateDimensionsPanel();
  drawAll();
};

document.getElementById('undoBtn').onclick = () => {
  if (undoStack.length) {redoStack.push(JSON.parse(JSON.stringify(shapes))); shapes = undoStack.pop(); drawAll();}
};
document.getElementById('redoBtn').onclick = () => {
  if (redoStack.length) {undoStack.push(JSON.parse(JSON.stringify(shapes))); shapes = redoStack.pop(); drawAll();}
};

document.getElementById('exportImg').onclick = () => {
  const link = document.createElement('a');
  link.download = 'drawing.png';
  link.href = canvas.toDataURL();
  link.click();
};

document.getElementById('exportJSON').onclick = () => {
  const link = document.createElement('a');
  link.download = 'drawing.json';
  link.href = 'data:text/json,' + encodeURIComponent(JSON.stringify({origin, shapes}));
  link.click();
};

function drawGrid() {
  const step = 20;
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += step) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();}
  for (let y = 0; y < canvas.height; y += step) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();}
}

function drawAll() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawGrid();
  ctx.fillStyle = 'red';
  ctx.beginPath(); ctx.arc(origin.x,origin.y,5,0,Math.PI*2); ctx.fill();

  shapes.forEach(s => {
    ctx.strokeStyle = 'lime';
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (s.type === 'line') ctx.moveTo(s.x1,s.y1), ctx.lineTo(s.x2,s.y2);
    else if (s.type === 'circle') ctx.arc(s.cx,s.cy,s.r,0,Math.PI*2);
    else if (s.type === 'rect') ctx.rect(s.x,s.y,s.w,s.h);
    ctx.stroke();
    drawTechnicalDimension(s);
  });
}

function drawTechnicalDimension(s) {
  ctx.strokeStyle = 'yellow';
  ctx.fillStyle = 'yellow';
  ctx.lineWidth = 1;
  ctx.font = '12px monospace';

  if (s.type === 'line') {
    const midX = (s.x1+s.x2)/2, midY = (s.y1+s.y2)/2;
    const len = Math.hypot(s.x2-s.x1, s.y2-s.y1).toFixed(2);
    ctx.fillText(len, midX+5, midY-5);
  } else if (s.type === 'rect') {
    ctx.fillText(`W:${Math.abs(s.w)}`, s.x+s.w/2, s.y-5);
    ctx.fillText(`H:${Math.abs(s.h)}`, s.x+s.w+5, s.y+s.h/2);
  } else if (s.type === 'circle') {
    ctx.fillText(`R:${s.r.toFixed(2)}`, s.cx, s.cy - s.r - 5);
  }
}

canvas.onmousedown = (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const p = {x, y};

  if (!editMode) {
    if (!startPt) {startPt=p; return;}
    let shape = null;
    if (tool==='line') shape={type:'line',x1:startPt.x,y1:startPt.y,x2:p.x,y2:p.y};
    else if (tool==='circle') shape={type:'circle',cx:startPt.x,cy:startPt.y,r:Math.hypot(p.x-startPt.x,p.y-startPt.y)};
    else if (tool==='rect') shape={type:'rect',x:startPt.x,y:startPt.y,w:p.x-startPt.x,h:p.y-startPt.y};
    shapes.push(shape);
    undoStack.push(JSON.parse(JSON.stringify(shapes)));
    startPt = null;
    drawAll();
  }
};

function updateDimensionsPanel() {
  dimsContent.innerHTML = '';
  if (!editMode) return;

  shapes.forEach((s, i) => {
    const div = document.createElement('div');
    div.style.display = 'flex'; div.style.gap = '5px'; div.style.alignItems = 'center';
    div.innerHTML = `<strong>${s.type} ${i+1}</strong> `;

    if (s.type === 'line') {
      const inp = document.createElement('input'); inp.type = 'number';
      inp.value = Math.hypot(s.x2-s.x1, s.y2-s.y1).toFixed(2);
      inp.onchange = e => {
        const len = parseFloat(e.target.value);
        const angle = Math.atan2(s.y2-s.y1, s.x2-s.x1);
        s.x2 = s.x1 + len * Math.cos(angle);
        s.y2 = s.y1 + len * Math.sin(angle);
        drawAll();
      };
      div.appendChild(inp);
    } else if (s.type === 'rect') {
      const inpW = document.createElement('input'); inpW.type = 'number'; inpW.value = Math.abs(s.w);
      inpW.onchange = e => { s.w = parseFloat(e.target.value)*(s.w<0?-1:1); drawAll(); };
      const inpH = document.createElement('input'); inpH.type = 'number'; inpH.value = Math.abs(s.h);
      inpH.onchange = e => { s.h = parseFloat(e.target.value)*(s.h<0?-1:1); drawAll(); };
      div.appendChild(inpW); div.appendChild(inpH);
    } else if (s.type === 'circle') {
      const inpR = document.createElement('input'); inpR.type = 'number'; inpR.value = s.r.toFixed(2);
      inpR.onchange = e => { s.r = parseFloat(e.target.value); drawAll(); };
      div.appendChild(inpR);
    }

    dimsContent.appendChild(div);
  });
}

drawAll();
</script>
</body>
</html>
