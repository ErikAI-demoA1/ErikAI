<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ErikAI Pro 2D CAD — AutoCAD Style + Move & Real-time Dims</title>
<style>
:root{
  --bg-color: #121216;
  --panel-bg: #1e222d;
  --border-color: #2e364f;
  --accent-green: #10b981;
  --accent-blue: #3b82f6;
  --text-main: #ffffff;
  --text-muted: #94a3b8;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg-color);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
header{
  padding: 10px 15px;
  background: var(--panel-bg);
  border-bottom: 1px solid var(--border-color);
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  justify-content: space-between;
}
.panel{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

/* Kontajner pre plátno s posuvníkmi pre veľké výkresy */
#canvasContainer {
  flex: 1;
  overflow: auto;
  position: relative;
  background: #0b0d13;
}
canvas{background:#0b0d13;display:block;cursor:crosshair;}

button{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  background: var(--accent-green);
  color:#000;
  font-weight: bold;
  cursor:pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
button:hover{filter: brightness(1.1); transform: translateY(-1px);}
button.ghost{background: var(--panel-bg);border:1px solid var(--border-color);color:var(--text-main);}
button.active{background: var(--accent-blue); color:white;}

/* Príkazový riadok */
#commandLineContainer{
  background: #090b10;
  border-top: 1px solid var(--border-color);
  padding: 8px 15px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 0.95rem;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
#commandHistory{
  height: 40px;
  overflow-y: auto;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#commandInputRow{display: flex; align-items: center; gap: 8px;}
#commandPrompt{color: var(--accent-green); font-weight: bold;}
#commandInput{
  flex: 1;
  background: transparent;
  border: none;
  color: white;
  font-family: inherit;
  font-size: 1rem;
  outline: none;
}

.info{padding:4px 15px;background: var(--panel-bg);font-size:0.85rem;color:var(--text-muted);border-top:1px solid var(--border-color);}

#dimensionsPanel{position:fixed;top:60px;right:15px;background:var(--panel-bg);border:1px solid var(--border-color);padding:15px;border-radius:12px;max-height:80vh;overflow:auto;display:none;box-shadow: 0 10px 30px rgba(0,0,0,0.6);width: 280px; z-index: 100;}
#dimensionsPanel h3{margin:0 0 10px 0;color:var(--accent-green);font-size:1rem;}
#dimensionsPanel div{margin-bottom:8px;font-size:0.9rem;}
#dimensionsPanel input{width:80px;padding:4px;border-radius:4px;border:1px solid var(--border-color);background:#121216;color:white;}
</style>
</head>
<body>

<header>
  <div class="panel">
    <button id="lineBtn" class="active" onclick="setTool('line')">📏 Čiara</button>
    <button id="circleBtn" class="ghost" onclick="setTool('circle')">⭕ Kruh</button>
    <button id="rectBtn" class="ghost" onclick="setTool('rect')">⬜ Obdĺžnik</button>
    <button id="moveBtn" class="ghost" onclick="setTool('move')">🚚 Presunúť</button>
    <button id="undoBtn" class="ghost" onclick="undo()">↩️ Undo</button>
    <button id="redoBtn" class="ghost" onclick="redo()">↪️ Redo</button>
    <button id="editDimsBtn" class="ghost">📋 Koty a Vlastnosti</button>
  </div>
  <div class="panel">
    <button id="exportImg" class="ghost" onclick="exportImage()">📷 PNG</button>
    <button id="exportJSON" class="ghost" onclick="exportJSON()">💾 JSON</button>
    <button class="ghost" onclick="clearAll()" style="background:#dc2626; color:white;">🗑️ Vymazať vše</button>
  </div>
</header>

<div id="canvasContainer">
  <canvas id="cadCanvas" width="4000" height="4000"></canvas>
</div>

<div class="info" id="info">Súradnice: X: 0, Y: 0 | Nástroj: Čiara</div>

<div id="commandLineContainer">
  <div id="commandHistory"><div>Zadajte príkaz alebo vyberte nástroj z panelu...</div></div>
  <div id="commandInputRow">
    <span id="commandPrompt">Command:</span>
    <input type="text" id="commandInput" placeholder="napíš napr. 'line', 'move', 'undo'..." autocomplete="off">
  </div>
</div>

<div id="dimensionsPanel">
  <h3>Vlastnosti a Koty</h3>
  <div id="dimsContent">Žiadne tvary</div>
</div>

<script>
const canvas=document.getElementById('cadCanvas');
const ctx=canvas.getContext('2d');
const container=document.getElementById('canvasContainer');

let shapes=[],undoStack=[],redoStack=[];
let tool='line';
let startPt=null;
let currentMouse={x:0, y:0};
let selectedShapeIndex=null;
let editMode=false;

// Premenné pre presun (Move)
let isMoving=false;
let moveShapeIndex=null;
let moveOffset={x:0, y:0};

// DOM elementy
const info=document.getElementById('info');
const dimsPanel=document.getElementById('dimensionsPanel');
const dimsContent=document.getElementById('dimsContent');
const editDimsBtn=document.getElementById('editDimsBtn');
const commandHistory=document.getElementById('commandHistory');
const commandInput=document.getElementById('commandInput');

function logCommand(text){
  const div=document.createElement('div');
  div.textContent=`> ${text}`;
  commandHistory.appendChild(div);
  commandHistory.scrollTop=commandHistory.scrollHeight;
}

// Výber nástroja
function setTool(t){
  tool=t;
  document.querySelectorAll('header button').forEach(b=>{if(!b.getAttribute('onclick')?.includes('export') && !b.getAttribute('onclick')?.includes('clear')) b.classList.replace('active','ghost');});
  if(t==='line') document.getElementById('lineBtn').classList.replace('ghost','active');
  if(t==='circle') document.getElementById('circleBtn').classList.replace('ghost','active');
  if(t==='rect') document.getElementById('rectBtn').classList.replace('ghost','active');
  if(t==='move') document.getElementById('moveBtn').classList.replace('ghost','active');
  startPt=null;
  logCommand(`Zvolený nástroj: ${t.toUpperCase()}`);
  drawAll();
}

// Ovládanie príkazového riadku
commandInput.onkeydown=(e)=>{
  if(e.key==='Enter'){
    const val=commandInput.value.trim().toLowerCase();
    logCommand(val);
    commandInput.value='';
    if(val==='line' || val==='l') setTool('line');
    else if(val==='circle' || val==='c') setTool('circle');
    else if(val==='rect' || val==='r') setTool('rect');
    else if(val==='move' || val==='m') setTool('move');
    else if(val==='undo') undo();
    else if(val==='redo') redo();
    else if(val==='clear') clearAll();
    else logCommand(`Neznámy príkaz: ${val}`);
  }
};

// Undo / Redo
function pushState(){
  undoStack.push(JSON.parse(JSON.stringify(shapes)));
  redoStack=[];
}
function undo(){
  if(undoStack.length){
    redoStack.push(JSON.parse(JSON.stringify(shapes)));
    shapes=undoStack.pop();
    logCommand("Undo vykonané");
    drawAll();
  }
}
function redo(){
  if(redoStack.length){
    undoStack.push(JSON.parse(JSON.stringify(shapes)));
    shapes=redoStack.pop();
    logCommand("Redo vykonané");
    drawAll();
  }
}
function clearAll(){
  pushState();
  shapes=[];
  selectedShapeIndex=null;
  logCommand("Všetky tvary vymazané");
  drawAll();
}

// Exporty
function exportImage(){
  const link=document.createElement('a');
  link.download='erikai_cad_drawing.png';
  link.href=canvas.toDataURL();
  link.click();
  logCommand("Obrázok exportovaný ako PNG");
}
function exportJSON(){
  const link=document.createElement('a');
  link.download='erikai_cad_drawing.json';
  link.href='data:text/json,'+encodeURIComponent(JSON.stringify({shapes}));
  link.click();
  logCommand("Projekt exportovaný ako JSON");
}

editDimsBtn.onclick=()=>{
  editMode=!editMode;
  dimsPanel.style.display=editMode?'block':'none';
  drawAll();
};

// Kreslenie mriežky pre veľké plátno
function drawGrid(){
  const step=40;
  ctx.strokeStyle='rgba(255,255,255,0.04)';
  ctx.lineWidth=1;
  for(let x=0; x<canvas.width; x+=step){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
  }
  for(let y=0; y<canvas.height; y+=step){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
  }
}

// Vykreslenie všetkého
function drawAll(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawGrid();

  shapes.forEach((s, i)=>{
    ctx.strokeStyle = (i === selectedShapeIndex) ? '#3b82f6' : '#10b981';
    ctx.lineWidth = (i === selectedShapeIndex) ? 3 : 2;
    ctx.beginPath();

    if(s.type==='line'){
      ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2);
    }else if(s.type==='circle'){
      ctx.arc(s.cx, s.cy, s.r, 0, Math.PI*2);
    }else if(s.type==='rect'){
      ctx.rect(s.x, s.y, s.w, s.h);
    }
    ctx.stroke();

    drawDimension(s);
  });

  // Živý náhľad pri kreslení
  if(startPt && tool !== 'move'){
    ctx.strokeStyle='rgba(16, 185, 129, 0.6)';
    ctx.lineWidth=2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    if(tool==='line'){
      ctx.moveTo(startPt.x, startPt.y); ctx.lineTo(currentMouse.x, currentMouse.y);
    }else if(tool==='circle'){
      const r = Math.hypot(currentMouse.x - startPt.x, currentMouse.y - startPt.y);
      ctx.arc(startPt.x, startPt.y, r, 0, Math.PI*2);
    }else if(tool==='rect'){
      ctx.rect(startPt.x, startPt.y, currentMouse.x - startPt.x, currentMouse.y - startPt.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if(editMode) updateDimensionsPanel();
}

// Kóty a rozmery priamo na plátne
function drawDimension(s){
  ctx.fillStyle='#94a3b8'; ctx.font='12px monospace';
  if(s.type==='line'){
    const midX=(s.x1+s.x2)/2, midY=(s.y1+s.y2)/2;
    const len=Math.hypot(s.x2-s.x1,s.y2-s.y1).toFixed(1);
    ctx.fillText(`${len} mm`, midX+6, midY-6);
  }else if(s.type==='rect'){
    ctx.fillText(`W:${Math.abs(s.w).toFixed(1)} H:${Math.abs(s.h).toFixed(1)}`, s.x+s.w/2-20, s.y+s.h/2);
  }else if(s.type==='circle'){
    ctx.fillText(`R:${s.r.toFixed(1)}`, s.cx, s.cy - s.r - 6);
  }
}

// Snapovanie ku gridu
function snap(x, y){
  const gridStep = 20;
  return {
    x: Math.round(x / gridStep) * gridStep,
    y: Math.round(y / gridStep) * gridStep
  };
}

// Kontrola, či klikol na určitý tvar (pre nástroj MOVE)
function findShapeAt(x, y){
  for(let i = shapes.length - 1; i >= 0; i--){
    let s = shapes[i];
    if(s.type==='line'){
      const d = distToSegment({x, y}, {x:s.x1, y:s.y1}, {x:s.x2, y:s.y2});
      if(d < 10) return i;
    }else if(s.type==='circle'){
      if(Math.abs(Math.hypot(x-s.cx, y-s.cy) - s.r) < 10) return i;
    }else if(s.type==='rect'){
      if(x >= Math.min(s.x, s.x+s.w) && x <= Math.max(s.x, s.x+s.w) &&
         y >= Math.min(s.y, s.y+s.h) && y <= Math.max(s.y, s.y+s.h)) return i;
    }
  }
  return null;
}

function distToSegment(p, a, b) {
  const l2 = (b.x - a.x)*(b.x - a.x) + (b.y - a.y)*(b.y - a.y);
  if (l2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
  let t = ((p.x - a.x)*(b.x - a.x) + (p.y - a.y)*(b.y - a.y)) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t*(b.x - a.x)), p.y - (a.y + t*(b.y - a.y)));
}

// Myš - Interakcia
canvas.onmousedown=(e)=>{
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX - rect.left + container.scrollLeft;
  const y=e.clientY - rect.top + container.scrollTop;
  const p=snap(x, y);

  if(tool === 'move'){
    const hitIdx = findShapeAt(x, y);
    if(hitIdx !== null){
      pushState();
      isMoving = true;
      moveShapeIndex = hitIdx;
      selectedShapeIndex = hitIdx;
      
      let s = shapes[hitIdx];
      if(s.type==='line') moveOffset={x: x - s.x1, y: y - s.y1};
      else if(s.type==='circle') moveOffset={x: x - s.cx, y: y - s.cy};
      else if(s.type==='rect') moveOffset={x: x - s.x, y: y - s.y};
      logCommand(`Začatý presun tvaru #${hitIdx+1}`);
      drawAll();
    }
    return;
  }

  if(e.button === 0){
    if(!startPt){
      startPt=p;
      logCommand(`Začiatočný bod: (${p.x}, ${p.y})`);
      return;
    }

    pushState();
    let shape=null;
    if(tool==='line'){
      shape={type:'line', x1:startPt.x, y1:startPt.y, x2:p.x, y2:p.y};
      logCommand(`Vytvorená čiara`);
    }else if(tool==='circle'){
      shape={type:'circle', cx:startPt.x, cy:startPt.y, r:Math.hypot(p.x-startPt.x, p.y-startPt.y)};
      logCommand(`Vytvorený kruh`);
    }else if(tool==='rect'){
      shape={type:'rect', x:startPt.x, y:startPt.y, w:p.x-startPt.x, h:p.y-startPt.y};
      logCommand(`Vytvorený obdĺžnik`);
    }

    if(shape) shapes.push(shape);
    startPt=null;
    drawAll();
  }
};

canvas.onmousemove=(e)=>{
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX - rect.left + container.scrollLeft;
  const y=e.clientY - rect.top + container.scrollTop;
  currentMouse = snap(x, y);

  info.textContent=`Súradnice: X: ${currentMouse.x}, Y: ${currentMouse.y} | Nástroj: ${tool.toUpperCase()}`;

  if(isMoving && moveShapeIndex !== null){
    let s = shapes[moveShapeIndex];
    if(s.type==='line'){
      const dx = s.x2 - s.x1;
      const dy = s.y2 - s.y1;
      s.x1 = x - moveOffset.x;
      s.y1 = y - moveOffset.y;
      s.x2 = s.x1 + dx;
      s.y2 = s.y1 + dy;
    }else if(s.type==='circle'){
      s.cx = x - moveOffset.x;
      s.cy = y - moveOffset.y;
    }else if(s.type==='rect'){
      s.x = x - moveOffset.x;
      s.y = y - moveOffset.y;
    }
    drawAll();
    return;
  }

  if(startPt) drawAll();
};

canvas.onmouseup=()=>{
  if(isMoving){
    isMoving=false;
    logCommand("Presun dokončený");
  }
};

canvas.oncontextmenu=(e)=>{
  e.preventDefault();
  if(startPt){
    startPt=null;
    logCommand("Kreslenie zrušené");
    drawAll();
  }
};

// Mazanie klávesom Delete
window.onkeydown=(e)=>{
  if(e.key==='Delete' && selectedShapeIndex!==null){
    pushState();
    logCommand(`Vymazaný tvar #${selectedShapeIndex+1}`);
    shapes.splice(selectedShapeIndex, 1);
    selectedShapeIndex=null;
    drawAll();
  }
};

// Panel vlastností s REÁLNOU živou aktualizáciou kot a rozmerov
function updateDimensionsPanel(){
  dimsContent.innerHTML='';
  if(shapes.length===0){
    dimsContent.innerHTML='Žiadne tvary';
    return;
  }
  shapes.forEach((s,i)=>{
    const div=document.createElement('div');
    div.style.padding='6px'; div.style.borderRadius='6px';
    div.style.background = (i===selectedShapeIndex)?'#1e3a8a':'#121216';
    div.style.cursor='pointer';
    div.onclick=()=>{ selectedShapeIndex=i; drawAll(); };

    div.innerHTML=`<strong>#${i+1} (${s.type})</strong><br>`;
    if(s.type==='line'){
      const inp=document.createElement('input'); inp.type='number'; inp.value=Math.hypot(s.x2-s.x1,s.y2-s.y1).toFixed(1);
      inp.oninput=(e)=>{
        pushState();
        const len=parseFloat(e.target.value);
        if(!isNaN(len)){
          const angle=Math.atan2(s.y2-s.y1, s.x2-s.x1);
          s.x2=s.x1 + len * Math.cos(angle);
          s.y2=s.y1 + len * Math.sin(angle);
          drawAll();
        }
      };
      div.appendChild(document.createTextNode('Dĺžka: ')); div.appendChild(inp);
    }else if(s.type==='rect'){
      const inpW=document.createElement('input'); inpW.type='number'; inpW.value=Math.abs(s.w).toFixed(1);
      inpW.oninput=(e)=>{ 
        pushState(); 
        const val=parseFloat(e.target.value);
        if(!isNaN(val)) { s.w=val*(s.w<0?-1:1); drawAll(); }
      };
      const inpH=document.createElement('input'); inpH.type='number'; inpH.value=Math.abs(s.h).toFixed(1);
      inpH.oninput=(e)=>{ 
        pushState(); 
        const val=parseFloat(e.target.value);
        if(!isNaN(val)) { s.h=val*(s.h<0?-1:1); drawAll(); }
      };
      div.appendChild(document.createTextNode('Š: ')); div.appendChild(inpW);
      div.appendChild(document.createTextNode(' V: ')); div.appendChild(inpH);
    }else if(s.type==='circle'){
      const inpR=document.createElement('input'); inpR.type='number'; inpR.value=s.r.toFixed(1);
      inpR.oninput=(e)=>{ 
        pushState(); 
        const val=parseFloat(e.target.value);
        if(!isNaN(val)) { s.r=val; drawAll(); }
      };
      div.appendChild(document.createTextNode('Polomer: ')); div.appendChild(inpR);
    }
    dimsContent.appendChild(div);
  });
}

drawAll();
</script>
</body>
</html>
