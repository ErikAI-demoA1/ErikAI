<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini 2D CAD — Demo</title>
<style>
  body { margin:0; font-family:sans-serif; background:#071021; color:#e6eef6; }
  canvas { background:#0d1624; display:block; margin:0 auto; border-radius:8px; }
  #toolbar { text-align:center; margin:10px; }
  button { margin:0 4px; padding:6px 10px; border:none; border-radius:6px; cursor:pointer; background:#34d399; color:#041014; font-weight:700; }
</style>
</head>
<body>
<div id="toolbar">
  <button onclick="setMode('line')">Čiara</button>
  <button onclick="setMode('circle')">Kruh</button>
  <button onclick="setMode('rect')">Obdĺžnik</button>
</div>
<canvas id="cadCanvas" width="1000" height="600"></canvas>

<script>
const canvas = document.getElementById('cadCanvas');
const ctx = canvas.getContext('2d');

let shapes = [];  // všetky tvary
let mode = 'line';
let tempPoints = []; // body počas kreslenia
let snapDistance = 10; // vzdialenosť na snap

function setMode(m) {
  mode = m;
  tempPoints = [];
  drawAll();
}

// Utility: vzdialenosť bodov
function dist(p1,p2){ return Math.hypot(p1.x-p2.x,p1.y-p2.y); }

// Snap na existujúci bod
function snapPoint(p){
  for(const s of shapes){
    for(const pt of s.points){
      if(dist(p,pt)<snapDistance){
        return {...pt};
      }
    }
  }
  return p;
}

// Automatické koty
function computeDimensions(shape){
  if(shape.type==='line'){
    shape.dimensions = { length: dist(shape.points[0], shape.points[1]) };
  } else if(shape.type==='circle'){
    shape.dimensions = { radius: dist(shape.points[0], shape.points[1]) };
  } else if(shape.type==='rect'){
    shape.dimensions = {
      width: Math.abs(shape.points[1].x - shape.points[0].x),
      height: Math.abs(shape.points[1].y - shape.points[0].y)
    };
  }
}

// Kreslenie všetkého
function drawAll(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // existujúce tvary
  for(const s of shapes){
    drawShape(s);
    drawDimensions(s);
  }

  // dočasný tvar počas kreslenia
  if(tempPoints.length>0){
    const tempShape = { type: mode, points: tempPoints };
    drawShape(tempShape, true);
    drawDimensions(tempShape, true);
  }
}

// Kreslenie tvaru
function drawShape(s, temp=false){
  ctx.strokeStyle = temp ? '#60a5fa' : '#34d399';
  ctx.lineWidth = temp ? 2 : 3;
  if(s.type==='line'){
    ctx.beginPath();
    ctx.moveTo(s.points[0].x,s.points[0].y);
    ctx.lineTo(s.points[1].x,s.points[1].y);
    ctx.stroke();
  } else if(s.type==='circle'){
    const r = dist(s.points[0],s.points[1]);
    ctx.beginPath();
    ctx.arc(s.points[0].x,s.points[0].y,r,0,Math.PI*2);
    ctx.stroke();
  } else if(s.type==='rect'){
    const x = Math.min(s.points[0].x,s.points[1].x);
    const y = Math.min(s.points[0].y,s.points[1].y);
    const w = Math.abs(s.points[1].x-s.points[0].x);
    const h = Math.abs(s.points[1].y-s.points[0].y);
    ctx.strokeRect(x,y,w,h);
  }
}

// Kreslenie kot
function drawDimensions(s, temp=false){
  ctx.fillStyle = temp ? '#60a5fa' : '#ffa500';
  ctx.font='12px monospace';
  if(s.type==='line'){
    const mid = { x:(s.points[0].x+s.points[1].x)/2, y:(s.points[0].y+s.points[1].y)/2 };
    ctx.fillText(s.dimensions.length.toFixed(1), mid.x+5, mid.y-5);
  } else if(s.type==='circle'){
    const r = s.dimensions.radius;
    ctx.fillText('R:'+r.toFixed(1), s.points[0].x+r+5, s.points[0].y);
  } else if(s.type==='rect'){
    const w = s.dimensions.width;
    const h = s.dimensions.height;
    ctx.fillText('W:'+w.toFixed(1), s.points[1].x+5, s.points[0].y-5);
    ctx.fillText('H:'+h.toFixed(1), s.points[1].x+5, s.points[1].y+12);
  }
}

// Kliknutie
canvas.addEventListener('mousedown', e=>{
  const rect = canvas.getBoundingClientRect();
  const p = snapPoint({ x: e.clientX - rect.left, y: e.clientY - rect.top });
  tempPoints.push(p);

  if(mode==='line' && tempPoints.length===2) finishShape();
  else if(mode==='circle' && tempPoints.length===2) finishShape();
  else if(mode==='rect' && tempPoints.length===2) finishShape();
});

function finishShape(){
  const newShape = { type: mode, points: [...tempPoints] };
  computeDimensions(newShape);
  shapes.push(newShape);
  tempPoints = [];
  drawAll();
}

drawAll();
</script>
</body>
</html>
