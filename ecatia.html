<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini CAD — Catia-like 2D</title>
<style>
  body{margin:0;font-family:sans-serif;background:#1a1a1a;color:#fff;}
  canvas{background:#111;width:100%;height:80vh;display:block;}
  .toolbar{padding:8px;background:#222;display:flex;gap:8px;flex-wrap:wrap;}
  .toolbar button{padding:6px 10px;cursor:pointer;border:none;background:#34d399;color:#111;border-radius:4px;}
  .toolbar label{margin-left:4px;}
  .kota{position:absolute;color:#0af;font-size:12px;background:#0008;padding:2px 4px;border-radius:3px;}
</style>
</head>
<body>

<div class="toolbar">
  <button id="lineBtn">Čiara</button>
  <button id="rectBtn">Obdĺžnik</button>
  <button id="circleBtn">Kruh</button>
  <button id="exportImg">Export obrázok</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let width, height;

function resize(){width=canvas.width=canvas.clientWidth;height=canvas.height=canvas.clientHeight;drawAll();}
window.addEventListener('resize',resize);
resize();

// Stav kreslenia
let mode='line'; // line, rect, circle
let shapes=[];
let current=null;
const zeroPoint={x:100,y:height-100}; // pevný nulový bod

// Tlačidlá
document.getElementById('lineBtn').onclick=()=>mode='line';
document.getElementById('rectBtn').onclick=()=>mode='rect';
document.getElementById('circleBtn').onclick=()=>mode='circle';
document.getElementById('exportImg').onclick=()=>{
  const link=document.createElement('a');
  link.href=canvas.toDataURL();
  link.download='cad.png';
  link.click();
};

// Pomocné funkcie
function drawAll(){
  ctx.clearRect(0,0,width,height);

  // nulový bod
  ctx.fillStyle='red';
  ctx.beginPath();
  ctx.arc(zeroPoint.x,zeroPoint.y,5,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='white';
  ctx.fillText('0,0',zeroPoint.x+6,zeroPoint.y-6);

  // všetky tvary
  for(const s of shapes){
    ctx.strokeStyle='white';ctx.fillStyle='transparent';
    ctx.lineWidth=2;
    if(s.type==='line'){
      ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
      drawKotaLine(s);
    }else if(s.type==='rect'){
      ctx.strokeRect(s.x,s.y,s.w,s.h);
      drawKotaRect(s);
    }else if(s.type==='circle'){
      ctx.beginPath();ctx.arc(s.cx,s.cy,s.r,0,Math.PI*2);ctx.stroke();
      drawKotaCircle(s);
    }
  }

  // aktuálny tvar pri kreslení
  if(current){
    ctx.strokeStyle='lime';
    ctx.lineWidth=2;
    if(current.type==='line'){
      ctx.beginPath();ctx.moveTo(current.x1,current.y1);ctx.lineTo(current.x2,current.y2);ctx.stroke();
      drawKotaLine(current);
    }else if(current.type==='rect'){
      ctx.strokeRect(current.x,current.y,current.w,current.h);
      drawKotaRect(current);
    }else if(current.type==='circle'){
      ctx.beginPath();ctx.arc(current.cx,current.cy,current.r,0,Math.PI*2);ctx.stroke();
      drawKotaCircle(current);
    }
  }
}

// Kota funkcie
function drawKotaLine(s){
  const midX=(s.x1+s.x2)/2, midY=(s.y1+s.y2)/2;
  ctx.fillStyle='cyan';
  ctx.fillText(`L:${Math.hypot(s.x2-s.x1,s.y2-s.y1).toFixed(1)}`,midX,midY-6);
}
function drawKotaRect(s){
  ctx.fillStyle='cyan';
  ctx.fillText(`W:${s.w.toFixed(1)}`,s.x+s.w/2,s.y-6);
  ctx.fillText(`H:${s.h.toFixed(1)}`,s.x+s.w+4,s.y+s.h/2);
}
function drawKotaCircle(s){
  ctx.fillStyle='cyan';
  ctx.fillText(`R:${s.r.toFixed(1)}`,s.cx+s.r+4,s.cy);
}

// Myš kreslenie
canvas.addEventListener('mousedown',e=>{
  const x=e.offsetX,y=e.offsetY;
  if(mode==='line') current={type:'line',x1:x,y1:y,x2:x,y2:y};
  else if(mode==='rect') current={type:'rect',x:x,y:y,w:0,h:0};
  else if(mode==='circle') current={type:'circle',cx:x,cy:y,r:0};
});
canvas.addEventListener('mousemove',e=>{
  if(!current)return;
  const x=e.offsetX,y=e.offsetY;
  if(current.type==='line'){current.x2=x;current.y2=y;}
  else if(current.type==='rect'){current.w=x-current.x;current.h=y-current.y;}
  else if(current.type==='circle'){current.r=Math.hypot(x-current.cx,y-current.cy);}
  drawAll();
});
canvas.addEventListener('mouseup',e=>{
  if(current){shapes.push(current);current=null;drawAll();}
});
</script>
</body>
</html>
