<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>ErikAI 2D-to-3D Professional CAD Studio</title>
<!-- Three.js pre 3D renderovanie -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
:root{
  --bg-color: #121216;
  --panel-bg: #1e222d;
  --border-color: #2e364f;
  --accent-green: #10b981;
  --accent-blue: #3b82f6;
  --accent-purple: #8b5cf6;
  --text-main: #ffffff;
  --text-muted: #94a3b8;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg-color);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  touch-action: none;
}
header{
  padding: 8px 12px;
  background: var(--panel-bg);
  border-bottom: 2px solid var(--border-color);
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  justify-content: space-between;
  z-index: 10;
}
.panel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

#workspaceContainer {
  flex: 1;
  overflow: hidden;
  position: relative;
  background: #0b0d13;
  display: flex;
}

#sketchContainer, #model3DContainer {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
}

#model3DContainer {
  display: none;
  background: #0b0d13;
}

canvas.sketch-canvas {
  background: #0b0d13;
  display: block;
  cursor: crosshair;
  transform-origin: 0 0;
  position: absolute;
}

button, label.file-btn, select.format-select{
  padding:7px 12px;
  border:none;
  border-radius:6px;
  background: var(--accent-green);
  color:#000;
  font-weight: bold;
  cursor:pointer;
  font-size: 0.85rem;
  transition: all 0.2s;
  box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
button:hover, label.file-btn:hover, select.format-select:hover{filter: brightness(1.1); transform: translateY(-1px);}
button.ghost{background: var(--panel-bg);border:1px solid var(--border-color);color:var(--text-main);}
button.active{background: var(--accent-blue); color:white;}
button.danger{background: #dc2626; color:white;}
button.warning{background: #f59e0b; color:black;}

select.format-select {
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  outline: none;
}

#commandLineContainer{
  background: #090b10;
  border-top: 1px solid var(--border-color);
  padding: 6px 12px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 0.85rem;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#commandHistory{
  height: 28px;
  overflow-y: auto;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#commandInputRow{display: flex; align-items: center; gap: 6px;}
#commandPrompt{color: var(--accent-green); font-weight: bold;}
#commandInput{
  flex: 1;
  background: transparent;
  border: none;
  color: white;
  font-family: inherit;
  font-size: 0.9rem;
  outline: none;
}

.info{padding:5px 12px;background: var(--panel-bg);font-size:0.8rem;color:var(--text-muted);border-top:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;}

#dimensionsPanel{
  position:fixed;
  top:60px;
  right:15px;
  background:var(--panel-bg);
  border:1px solid var(--border-color);
  padding:12px;
  border-radius:10px;
  max-height:80vh;
  overflow-y: auto;
  overflow-x: hidden;
  display:none;
  box-shadow: 0 15px 40px rgba(0,0,0,0.8);
  width: 450px;
  max-width: 95vw;
  z-index: 1000;
}
.panel-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  cursor: grab;
  user-select: none;
  background: rgba(255,255,255,0.04);
  padding: 6px 10px;
  border-radius: 6px;
}
.panel-header:active{ cursor: grabbing; }
#dimensionsPanel h3{margin:0;color:var(--accent-green);font-size:0.9rem;}
.close-btn{
  background: transparent; border: none; color: var(--text-muted); font-size: 1.1rem; font-weight: bold; cursor: pointer; padding: 0 4px; box-shadow: none;
}

.shape-card{
  background: #121216;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.shape-card.active{
  border-color: var(--accent-blue);
  background: #1a233a;
}
.shape-title-row{
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.input-row{ display: flex; gap: 6px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
.input-row label{ font-size: 0.73rem; color: var(--text-muted); white-space: nowrap; width: 20px; }
.input-row input, .input-row select{
  width: 65px;
  padding: 4px;
  border-radius: 4px;
  border: 1px solid var(--border-color);
  background: #090b10;
  color: white;
  font-size: 0.82rem;
}
</style>
</head>
<body>

<header>
  <div class="panel">
    <button id="lineBtn" class="active" onclick="setTool('line')">📏 Čiara</button>
    <button id="circleBtn" class="ghost" onclick="setTool('circle')">⭕ Kruh</button>
    <button id="rectBtn" class="ghost" onclick="setTool('rect')">⬜ Obdĺžnik</button>
    <button id="textBtn" class="ghost" onclick="setTool('text')">🔤 Text / Pozn.</button>
    <button id="moveBtn" class="ghost" onclick="setTool('move')">🚚 Presun</button>
    <button class="ghost" onclick="resetSketchZoom()">🔍 Reset</button>
    <button id="editDimsBtn" class="ghost">📋 2D Vlastnosti & Koty</button>
  </div>
  <div class="panel">
    <button class="ghost" onclick="toggleMode()" id="modeToggleBtn" style="background:var(--accent-purple); color:white;">🚀 Vygenerovať 3D Model</button>
    <button class="ghost" onclick="clearAll()" style="background:#dc2626; color:white;">🗑️ Zmazať</button>
  </div>
</header>

<div id="workspaceContainer">
  <div id="sketchContainer">
    <canvas id="sketchCanvas" class="sketch-canvas" width="4000" height="4000"></canvas>
  </div>
  <div id="model3DContainer"></div>
</div>

<div class="info" id="info">
  <span id="infoCoords">X: 0 mm, Y: 0 mm | 2D Skicár (Nakreslite tvar a kliknite na Vygenerovať 3D)</span>
  <span id="infoCount">Prvkov v skici: 0</span>
</div>

<div id="commandLineContainer">
  <div id="commandHistory"><div>ErikAI 2D Skicár pripravený. Nakreslite 2D profil a preveďte ho do 3D.</div></div>
  <div id="commandInputRow">
    <span id="commandPrompt">&gt;</span>
    <input type="text" id="commandInput" placeholder="Príkaz (line, circle, rect, 3d)..." autocomplete="off">
  </div>
</div>

<div id="dimensionsPanel">
  <div class="panel-header" id="panelHeader">
    <h3>Správca 2D Skice & Kót (mm)</h3>
    <button class="close-btn" onclick="toggleDimensionsPanel()">✕</button>
  </div>
  <div id="dimsContent">Žiadne tvary v skici</div>
</div>

<script>
let shapes = [];
let tool = 'line';
let startPt = null;
let currentMouse = {x: 0, y: 0};
let selectedShapeIndex = null;
let editMode = false;
let is3DMode = false;

let scale = 1, panX = 0, panY = 0, isPanning = false, panStart = {x:0, y:0};
let isMoving = false, moveShapeIndex = null, moveOffset = {x:0, y:0};

// Three.js prepojenie pre 3D režim
let scene, camera, renderer, controls;

const canvas = document.getElementById('sketchCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('sketchContainer');
const container3D = document.getElementById('model3DContainer');
const infoCoords = document.getElementById('infoCoords');
const infoCount = document.getElementById('infoCount');
const dimsPanel = document.getElementById('dimensionsPanel');
const panelHeader = document.getElementById('panelHeader');
const dimsContent = document.getElementById('dimsContent');
const commandHistory = document.getElementById('commandHistory');
const commandInput = document.getElementById('commandInput');

let isDraggingPanel = false, panelDragOffset = {x: 0, y: 0};
function startPanelDrag(clientX, clientY){
  isDraggingPanel = true;
  const rect = dimsPanel.getBoundingClientRect();
  panelDragOffset.x = clientX - rect.left; panelDragOffset.y = clientY - rect.top;
}
function movePanelDrag(clientX, clientY){
  if(!isDraggingPanel) return;
  dimsPanel.style.left = (clientX - panelDragOffset.x) + 'px';
  dimsPanel.style.top = (clientY - panelDragOffset.y) + 'px';
}
panelHeader.onmousedown = (e) => { if(e.target.tagName !== 'BUTTON'){ startPanelDrag(e.clientX, e.clientY); e.preventDefault(); } };
window.onmousemove = (e) => movePanelDrag(e.clientX, e.clientY);
window.onmouseup = () => { isDraggingPanel = false; };

function logCommand(text){
  const div = document.createElement('div');
  div.textContent = `> ${text}`;
  commandHistory.appendChild(div);
  commandHistory.scrollTop = commandHistory.scrollHeight;
}

function setTool(t){
  tool = t;
  document.querySelectorAll('header button').forEach(b => {
    if(!b.getAttribute('onclick')?.includes('toggleMode') && !b.getAttribute('onclick')?.includes('clear') && !b.getAttribute('onclick')?.includes('reset') && !b.getAttribute('onclick')?.includes('editDims')) {
      b.classList.replace('active', 'ghost');
    }
  });
  if(t==='line') document.getElementById('lineBtn').classList.replace('ghost', 'active');
  if(t==='circle') document.getElementById('circleBtn').classList.replace('ghost', 'active');
  if(t==='rect') document.getElementById('rectBtn').classList.replace('ghost', 'active');
  if(t==='text') document.getElementById('textBtn').classList.replace('ghost', 'active');
  if(t==='move') document.getElementById('moveBtn').classList.replace('ghost', 'active');
  startPt = null;
  logCommand(`2D Nástroj: ${t.toUpperCase()}`);
  drawSketch();
}

function toggleMode(){
  is3DMode = !is3DMode;
  const btn = document.getElementById('modeToggleBtn');
  
  if(is3DMode){
    container.style.display = 'none';
    container3D.style.display = 'block';
    btn.textContent = '✏️ Upraviť 2D Skicu';
    btn.style.background = '#10b981';
    btn.style.color = '#000';
    infoCoords.textContent = "3D Z-Up Studio (Vygenerované z 2D skice)";
    init3DFromSketch();
    logCommand("🚀 2D skica úspešne prenesená do 3D priestoru!");
  } else {
    container3D.style.display = 'none';
    container.style.display = 'block';
    btn.textContent = '🚀 Vygenerovať 3D Model';
    btn.style.background = '#8b5cf6';
    btn.style.color = '#fff';
    infoCoords.textContent = "2D Skicár (Nakreslite tvar a kliknite na Vygenerovať 3D)";
    logCommand("Návrat do 2D skicára.");
  }
}

// 2D Kreslenie a mriežka
function drawGrid(){
  const step = 40;
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  ctx.setLineDash([]);
  for(let x = 0; x < canvas.width; x += step){
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for(let y = 0; y < canvas.height; y += step){
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }
}

function drawSketch(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid();

  shapes.forEach((s, i) => {
    ctx.beginPath();
    ctx.strokeStyle = (i === selectedShapeIndex) ? '#3b82f6' : (s.color || '#10b981');
    ctx.lineWidth = s.lineWidth || 2;

    if(s.type === 'line'){
      ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2);
    } else if(s.type === 'circle'){
      ctx.arc(s.cx, s.cy, s.r, 0, Math.PI * 2);
    } else if(s.type === 'rect'){
      ctx.rect(s.x, s.y, s.w, s.h);
    } else if(s.type === 'text'){
      ctx.fillStyle = s.color || '#ffffff';
      ctx.font = `${s.size || 16}px monospace`;
      ctx.fillText(s.text, s.x, s.y);
    }
    if(s.type !== 'text') ctx.stroke();

    // Automatická kóta vo 2D
    ctx.fillStyle = '#94a3b8';
    ctx.font = '11px monospace';
    if(s.type === 'line'){
      let len = Math.hypot(s.x2 - s.x1, s.y2 - s.y1).toFixed(0);
      ctx.fillText(`${len} mm`, (s.x1+s.x2)/2 + 5, (s.y1+s.y2)/2 - 5);
    } else if(s.type === 'rect'){
      ctx.fillText(`W:${Math.abs(s.w).toFixed(0)} H:${Math.abs(s.h).toFixed(0)}`, s.x + 5, s.y - 5);
    } else if(s.type === 'circle'){
      ctx.fillText(`R:${s.r.toFixed(0)}`, s.cx + 5, s.cy - 5);
    }
  });

  if(startPt){
    ctx.strokeStyle = 'rgba(16, 185, 129, 0.6)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    if(tool === 'line'){
      ctx.moveTo(startPt.x, startPt.y); ctx.lineTo(currentMouse.x, currentMouse.y);
    } else if(tool === 'circle'){
      let r = Math.hypot(currentMouse.x - startPt.x, currentMouse.y - startPt.y);
      ctx.arc(startPt.x, startPt.y, r, 0, Math.PI * 2);
    } else if(tool === 'rect'){
      ctx.rect(startPt.x, startPt.y, currentMouse.x - startPt.x, currentMouse.y - startPt.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if(editMode) updateDimensionsPanel();
  infoCount.textContent = `Prvkov v skici: ${shapes.length}`;
}

function snap(x, y){
  const grid = 20;
  return { x: Math.round(x / grid) * grid, y: Math.round(y / grid) * grid };
}

function getCanvasPoint(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) / scale,
    y: (clientY - rect.top) / scale
  };
}

canvas.onmousedown = (e) => {
  const pt = getCanvasPoint(e.clientX, e.clientY);
  const p = snap(pt.x, pt.y);

  if(tool === 'move'){
    for(let i = shapes.length - 1; i >= 0; i--){
      let s = shapes[i];
      if(Math.hypot(pt.x - (s.x1 || s.cx || s.x), pt.y - (s.y1 || s.cy || s.y)) < 30){
        selectedShapeIndex = i;
        isMoving = true;
        moveShapeIndex = i;
        moveOffset = { x: pt.x - (s.x1 || s.cx || s.x), y: pt.y - (s.y1 || s.cy || s.y) };
        drawSketch();
        return;
      }
    }
    selectedShapeIndex = null;
    drawSketch();
    return;
  }

  if(tool === 'text'){
    let txt = prompt("Zadajte text / popis:", "Diel 1");
    if(txt){
      shapes.push({type:'text', text:txt, x:p.x, y:p.y, color:'#ffffff', size:16});
      drawSketch();
    }
    return;
  }

  if(!startPt){
    startPt = p;
    return;
  }

  let shape = null;
  if(tool === 'line') shape = {type:'line', x1:startPt.x, y1:startPt.y, x2:p.x, y2:p.y, lineWidth:2};
  else if(tool === 'circle') shape = {type:'circle', cx:startPt.x, cy:startPt.y, r:Math.hypot(p.x-startPt.x, p.y-startPt.y), lineWidth:2};
  else if(tool === 'rect') shape = {type:'rect', x:startPt.x, y:startPt.y, w:p.x-startPt.x, h:p.y-startPt.y, lineWidth:2};

  if(shape) shapes.push(shape);
  startPt = null;
  drawSketch();
};

canvas.onmousemove = (e) => {
  const pt = getCanvasPoint(e.clientX, e.clientY);
  currentMouse = snap(pt.x, pt.y);
  infoCoords.textContent = `X: ${currentMouse.x} mm, Y: ${currentMouse.y} mm | Nástroj: ${tool.toUpperCase()}`;

  if(isMoving && moveShapeIndex !== null){
    let s = shapes[moveShapeIndex];
    if(s.type==='line'){
      let dx = s.x2 - s.x1, dy = s.y2 - s.y1;
      s.x1 = pt.x - moveOffset.x; s.y1 = pt.y - moveOffset.y;
      s.x2 = s.x1 + dx; s.y2 = s.y1 + dy;
    } else if(s.type==='circle'){
      s.cx = pt.x - moveOffset.x; s.cy = pt.y - moveOffset.y;
    } else if(s.type==='rect'){
      s.x = pt.x - moveOffset.x; s.y = pt.y - moveOffset.y;
    }
    drawSketch();
    return;
  }

  if(startPt) drawSketch();
};

canvas.onmouseup = () => { isMoving = false; };

function resetSketchZoom(){
  scale = 1; panX = 0; panY = 0;
  canvas.style.transform = `translate(0px, 0px) scale(1)`;
}

function clearAll(){
  shapes = []; selectedShapeIndex = null;
  drawSketch();
  logCommand("Skica vymazaná.");
}

// ----------------------------------------------------
// 🚀 3D GENERÁTOR: PREVOD 2D SKICE NA 3D MODEL
// ----------------------------------------------------
function init3DFromSketch(){
  container3D.innerHTML = '';
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0d13);

  camera = new THREE.PerspectiveCamera(45, container3D.clientWidth / container3D.clientHeight, 0.1, 1000);
  camera.position.set(160, -200, 140);
  camera.up.set(0, 0, 1); // Z-Up súradnicový systém

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container3D.clientWidth, container3D.clientHeight);
  container3D.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  let dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(150, 200, 250);
  scene.add(dirLight);

  let grid = new THREE.GridHelper(300, 30, 0x10b981, 0x2e364f);
  grid.rotateX(Math.PI / 2);
  scene.add(grid);

  // Prevod každého 2D tvaru zo skice na 3D teleso vyrastajúce nahor (Z-Up)
  shapes.forEach((s) => {
    let geo, mesh;
    let mat = new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.3, metalness: 0.2 });

    if(s.type === 'rect'){
      let w = Math.abs(s.w) / 10, h = Math.abs(s.h) / 10, depth = 5.0; // 50mm výška telesa
      geo = new THREE.BoxGeometry(w, h, depth);
      geo.translate(0, 0, depth / 2);
      mesh = new THREE.Mesh(geo, mat);
      mesh.position.set((s.x + s.w/2)/10, (s.y + s.h/2)/10, 0);
    } else if(s.type === 'circle'){
      let r = s.r / 10, depth = 5.0;
      geo = new THREE.CylinderGeometry(r, r, depth, 32);
      geo.rotateX(Math.PI / 2);
      geo.translate(0, 0, depth / 2);
      mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(s.cx/10, s.cy/10, 0);
    } else if(s.type === 'line'){
      let len = Math.hypot(s.x2 - s.x1, s.y2 - s.y1) / 10;
      geo = new THREE.CylinderGeometry(0.5, 0.5, len, 16);
      geo.rotateZ(Math.PI / 2);
      mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color: 0x3b82f6}));
      mesh.position.set((s.x1+s.x2)/20, (s.y1+s.y2)/20, 2.5);
    }

    if(mesh) scene.add(mesh);
  });

  animate3D();
}

function animate3D(){
  if(!is3DMode) return;
  requestAnimationFrame(animate3D);
  controls.update();
  renderer.render(scene, camera);
}

// Správca vlastností a kót
editDimsBtn.onclick = () => {
  editMode = !editMode;
  dimsPanel.style.display = editMode ? 'block' : 'none';
  if(editMode) updateDimensionsPanel();
};
function toggleDimensionsPanel(){ editMode = false; dimsPanel.style.display = 'none'; }

function updateDimensionsPanel(){
  dimsContent.innerHTML = '';
  if(shapes.length === 0){
    dimsContent.innerHTML = 'Žiadne tvary v skici.';
    return;
  }
  shapes.forEach((s, i) => {
    let card = document.createElement('div');
    card.className = `shape-card ${i === selectedShapeIndex ? 'active' : ''}`;
    card.innerHTML = `
      <div class="shape-title-row">
        <strong>#${i+1} ${s.type.toUpperCase()}</strong>
        <button class="danger" style="padding:2px 6px;" onclick="shapes.splice(${i},1);drawSketch();updateDimensionsPanel();">🗑️ Zmazať</button>
      </div>
      <div class="input-row">
        ${s.type==='rect' ? `<label>Š:</label><input type="number" value="${s.w}" onchange="shapes[${i}].w=parseFloat(this.value);drawSketch();"><label>V:</label><input type="number" value="${s.h}" onchange="shapes[${i}].h=parseFloat(this.value);drawSketch();">` : ''}
        ${s.type==='circle' ? `<label>R:</label><input type="number" value="${s.r}" onchange="shapes[${i}].r=parseFloat(this.value);drawSketch();">` : ''}
        ${s.type==='line' ? `<label>X1:</label><input type="number" value="${s.x1}" onchange="shapes[${i}].x1=parseFloat(this.value);drawSketch();"><label>Y1:</label><input type="number" value="${s.y1}" onchange="shapes[${i}].y1=parseFloat(this.value);drawSketch();">` : ''}
      </div>
    `;
    dimsContent.appendChild(card);
  });
}

// Spustenie
applyGridAndInit();
function applyGridAndInit(){
  canvas.width = 4000;
  canvas.height = 4000;
  drawSketch();
}
</script>



</body>
</html>
