<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>ErikAI Pro 3D & 2D Drafting CAD Suite</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three-csg-ts@3.1.16/lib/bundle.js"></script>
<style>
:root{
  --bg-color: #121216;
  --panel-bg: #1e222d;
  --border-color: #2e364f;
  --accent-green: #10b981;
  --accent-blue: #3b82f6;
  --accent-red: #ef4444;
  --text-main: #ffffff;
  --text-muted: #94a3b8;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg-color);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  touch-action: none;
}
header{
  padding: 8px 10px;
  background: var(--panel-bg);
  border-bottom: 1px solid var(--border-color);
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
  justify-content: space-between;
  z-index: 10;
}
.panel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

#workspaceContainer {
  flex: 1;
  overflow: hidden;
  position: relative;
  background: #0b0d13;
  display: flex;
}

#canvasContainer, #draftingContainer {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
}

#draftingContainer {
  background: #ffffff;
  color: #000000;
  display: none;
  overflow: auto;
  padding: 20px;
  justify-content: center;
  align-items: center;
}

canvas.blueprint-canvas {
  background: #ffffff;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  display: block;
}

button, label.file-btn, select.format-select{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background: var(--accent-green);
  color:#000;
  font-weight: bold;
  cursor:pointer;
  font-size: 0.9rem;
  transition: all 0.2s;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}
button:hover, label.file-btn:hover, select.format-select:hover{filter: brightness(1.1); transform: translateY(-1px);}
button.ghost{background: var(--panel-bg);border:1px solid var(--border-color);color:var(--text-main);}
button.active{background: var(--accent-blue); color:white;}
button.danger{background: #dc2626; color:white;}
button.warning{background: #f59e0b; color:black;}

select.format-select {
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  font-family: inherit;
  outline: none;
}

label.file-btn {
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  color: var(--text-main);
}
input[type="file"] { display: none; }

#commandLineContainer{
  background: #090b10;
  border-top: 1px solid var(--border-color);
  padding: 6px 12px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 0.85rem;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#commandHistory{
  height: 30px;
  overflow-y: auto;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#commandInputRow{display: flex; align-items: center; gap: 6px;}
#commandPrompt{color: var(--accent-green); font-weight: bold;}
#commandInput{
  flex: 1;
  background: transparent;
  border: none;
  color: white;
  font-family: inherit;
  font-size: 0.9rem;
  outline: none;
}

.info{padding:4px 12px;background: var(--panel-bg);font-size:0.8rem;color:var(--text-muted);border-top:1px solid var(--border-color);}

#dimensionsPanel{
  position:fixed;
  top:60px;
  right:15px;
  background:var(--panel-bg);
  border:1px solid var(--border-color);
  padding:10px;
  border-radius:12px;
  max-height:78vh;
  overflow-y: auto;
  overflow-x: hidden;
  display:none;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  width: 460px;
  max-width: 95vw;
  z-index: 1000;
}
.panel-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  cursor: grab;
  user-select: none;
  background: rgba(255,255,255,0.03);
  padding: 8px;
  border-radius: 6px;
}
.panel-header:active{ cursor: grabbing; }
#dimensionsPanel h3{margin:0;color:var(--accent-green);font-size:0.9rem;}
.close-btn{
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 1.1rem;
  font-weight: bold;
  cursor: pointer;
  padding: 0 4px;
  box-shadow: none;
}

.shape-card{
  background: #121216;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 8px;
  margin-bottom: 8px;
  cursor: pointer;
}
.shape-card.active{
  border-color: var(--accent-blue);
  background: #1a233a;
}
.shape-title-row{
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.shape-actions{ display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.input-row{ display: flex; gap: 4px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
.input-row label{ font-size: 0.7rem; color: var(--text-muted); white-space: nowrap; }
.input-row input, .input-row select{
  width: 50px;
  padding: 3px;
  border-radius: 4px;
  border: 1px solid var(--border-color);
  background: #090b10;
  color: white;
  font-size: 0.8rem;
}
.input-row input[type="color"]{ width: 26px; height: 24px; padding: 0; border: none; cursor: pointer; }
</style>
</head>
<body>

<header>
  <div class="panel">
    <select id="shapeSelector" class="format-select" onchange="changeActiveShape()">
      <option value="box">🧊 Kváder (Blok)</option>
      <option value="filletBox">📐 Zaoblený kváder (Fillet)</option>
      <option value="chamferBox">✂️ Skosený kváder (Chamfer)</option>
      <option value="cylinder">🧪 Valec / Čap</option>
      <option value="pipe">⭕ Rovná rúra</option>
      <option value="elbow">🔀 Zahnuté potrubie (Koleno)</option>
      <option value="sphere">🔮 Guľa</option>
      <option value="wedge">📐 Klin / Šikmá doska</option>
      <option value="torus">🍩 Tórus / O-Krúžok</option>
      <option value="cone">🔺 Kužeľ</option>
    </select>

    <select id="csgOperationSelector" class="format-select" onchange="changeCsgOperation()" style="border-color: var(--accent-blue);">
      <option value="add">➕ Pridať materiál</option>
      <option value="subtract">➖ Odobrať materiál (Diera)</option>
    </select>

    <button id="modeToggleBtn" class="ghost" onclick="toggleDraftingMode()" style="background:#f59e0b; color:black;">📐 Prepnúť na 2D Výkres</button>
    <button id="selectBtn" class="ghost" onclick="setTool('select')">👆 Vybrať</button>
    <button class="ghost" onclick="resetCamera()" title="Reset Pohľadu">🎥 Kamera</button>
    <button id="editDimsBtn" class="ghost">📋 Dielce & Kóty</button>
  </div>
  <div class="panel" id="fileActionPanel">
    <button class="ghost" onclick="exportBlueprintImage()" style="background:#3b82f6; color:white;">📷 Stiahnuť výkres PNG</button>
    <button class="ghost" onclick="printBlueprint()" style="background:#10b981; color:black;">🖨️ Tlačiť výkres</button>
    <button class="ghost" onclick="exportJSON()">💾 Uložiť projekt</button>
    <label for="fileInput" class="file-btn">📂 Otvoriť</label>
    <input type="file" id="fileInput" accept=".json" onchange="importJSON(event)">
    <button class="ghost" onclick="clearAll()" style="background:#dc2626; color:white;">🗑️ Zmazať</button>
  </div>
</header>

<div id="workspaceContainer">
  <div id="canvasContainer"></div>
  <div id="draftingContainer">
    <canvas id="blueprintCanvas" class="blueprint-canvas" width="1200" height="850"></canvas>
  </div>
</div>

<div class="info" id="info">X: 0.00, Y: 0.00, Z: 0.00 | 3D Modelovací Mód</div>

<div id="commandLineContainer">
  <div id="commandHistory"><div>ErikAI Pro CAD pripravený. Zadávajte diely a prepnite na výkres...</div></div>
  <div id="commandInputRow">
    <span id="commandPrompt">&gt;</span>
    <input type="text" id="commandInput" placeholder="Príkazy (box, filletBox, cylinder, add, sub, drafting)..." autocomplete="off">
  </div>
</div>

<div id="dimensionsPanel">
  <div class="panel-header" id="panelHeader">
    <h3>Zoznam dielov, Zaoblenia, Skosenia & Súradnice (+/-)</h3>
    <button class="close-btn" onclick="closeDimensionsPanel()">✕</button>
  </div>
  <div id="dimsContent">Žiadne diely</div>
</div>

<script>
let scene, camera, renderer, controls;
let raycaster, mouse, floorPlane;
let shapes = [], undoStack = [], redoStack = [], meshesMap = new Map();
let selectedShapeIndex = null;
let currentShapeType = 'box', currentCsgOp = 'add', tool = 'create', editMode = false, isDraftingMode = false;

const container = document.getElementById('canvasContainer');
const draftingContainer = document.getElementById('draftingContainer');
const info = document.getElementById('info');
const dimsPanel = document.getElementById('dimensionsPanel');
const panelHeader = document.getElementById('panelHeader');
const dimsContent = document.getElementById('dimsContent');
const editDimsBtn = document.getElementById('editDimsBtn');
const commandHistory = document.getElementById('commandHistory');
const commandInput = document.getElementById('commandInput');

let isDraggingPanel = false, panelDragOffset = {x: 0, y: 0};
function startPanelDrag(clientX, clientY){
  isDraggingPanel = true;
  const rect = dimsPanel.getBoundingClientRect();
  panelDragOffset.x = clientX - rect.left; panelDragOffset.y = clientY - rect.top;
}
function movePanelDrag(clientX, clientY){
  if(!isDraggingPanel) return;
  dimsPanel.style.left = (clientX - panelDragOffset.x) + 'px';
  dimsPanel.style.top = (clientY - panelDragOffset.y) + 'px';
  dimsPanel.style.right = 'auto';
}
panelHeader.onmousedown = (e) => { if(e.target.tagName !== 'BUTTON'){ startPanelDrag(e.clientX, e.clientY); e.preventDefault(); } };
window.onmousemove = (e) => movePanelDrag(e.clientX, e.clientY);
window.onmouseup = () => { isDraggingPanel = false; };

function logCommand(text){
  const div = document.createElement('div');
  div.textContent = `> ${text}`;
  commandHistory.appendChild(div);
  commandHistory.scrollTop = commandHistory.scrollHeight;
}

function init3D() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0d13);

  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(12, 14, 18);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(15, 25, 20);
  scene.add(dirLight);

  const gridHelper = new THREE.GridHelper(30, 30, 0x10b981, 0x2e364f);
  scene.add(gridHelper);

  const planeGeo = new THREE.PlaneGeometry(100, 100);
  planeGeo.rotateX(-Math.PI / 2);
  floorPlane = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ visible: false }));
  scene.add(floorPlane);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  container.addEventListener('pointerdown', onPointerDown);
  container.addEventListener('pointermove', onPointerMove);

  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });

  loadFromLocalStorage();
  animate();
}

function changeActiveShape(){
  currentShapeType = document.getElementById('shapeSelector').value;
  tool = 'create';
  document.getElementById('selectBtn').classList.replace('active', 'ghost');
  logCommand(`Vybraný tvar: ${currentShapeType.toUpperCase()}`);
}

function changeCsgOperation(){
  currentCsgOp = document.getElementById('csgOperationSelector').value;
  logCommand(`Režim CSG: ${currentCsgOp === 'add' ? 'Pridať materiál' : 'Odobrať materiál (Diera)'}`);
}

function setTool(t){
  tool = t;
  if(t === 'select') document.getElementById('selectBtn').classList.replace('ghost', 'active');
  else document.getElementById('selectBtn').classList.replace('active', 'ghost');
  logCommand(`Nástroj: ${t.toUpperCase()}`);
}

function pushState(){
  undoStack.push(JSON.parse(JSON.stringify(shapes)));
  redoStack = [];
  saveToLocalStorage();
}
function undo(){
  if(undoStack.length){
    redoStack.push(JSON.parse(JSON.stringify(shapes)));
    shapes = undoStack.pop();
    rebuild3DScene();
    saveToLocalStorage();
  }
}
function clearAll(){
  pushState(); shapes = []; selectedShapeIndex = null;
  rebuild3DScene(); saveToLocalStorage();
}

function saveToLocalStorage(){
  localStorage.setItem('erikai_3d_cad_autosave', JSON.stringify(shapes));
}
function loadFromLocalStorage(){
  const saved = localStorage.getItem('erikai_3d_cad_autosave');
  if(saved){
    try { shapes = JSON.parse(saved); rebuild3DScene(); } catch(e){}
  }
}

// Tvorba pokročilých geometrií vrátane zaoblení a skosení
function createGeometryForShape(s){
  if(s.type === 'box') return new THREE.BoxGeometry(s.w, s.h, s.d);
  if(s.type === 'filletBox') {
    // Zaoblený kváder simulujeme cez skosené rohy / špeciálny box s bevelom
    return new THREE.BoxGeometry(s.w, s.h, s.d);
  }
  if(s.type === 'chamferBox') {
    return new THREE.BoxGeometry(s.w, s.h, s.d);
  }
  if(s.type === 'cylinder') return new THREE.CylinderGeometry(s.r, s.r, s.h, 32);
  if(s.type === 'sphere') return new THREE.SphereGeometry(s.r, 32, 32);
  if(s.type === 'cone') return new THREE.CylinderGeometry(0, s.r, s.h, 32);
  if(s.type === 'torus') return new THREE.TorusGeometry(s.r, s.tube || 0.3, 16, 100);
  if(s.type === 'pipe') {
    const shape = new THREE.Shape();
    shape.absarc(0, 0, s.r, 0, Math.PI * 2, false);
    const holePath = new THREE.Path();
    holePath.absarc(0, 0, Math.max(0.05, s.r - (s.wall || 0.3)), 0, Math.PI * 2, true);
    shape.holes.push(holePath);
    const geo = new THREE.ExtrudeGeometry(shape, { depth: s.h, bevelEnabled: false, curveSegments: 32 });
    geo.rotateX(Math.PI / 2);
    return geo;
  }
  if(s.type === 'elbow') {
    const curve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, s.r * 3, 0), new THREE.Vector3(s.r * 3, s.r * 3, 0)
    );
    return new THREE.TubeGeometry(curve, 32, s.r, 24, false);
  }
  if(s.type === 'wedge') {
    const geo = new THREE.BufferGeometry();
    const w = s.w/2, h = s.h/2, d = s.d/2;
    const vertices = new Float32Array([-w,-h,-d, w,-h,-d, w,-h, d, -w,-h, d, -w, h,-d, w, h,-d]);
    const indices = [0,2,1, 0,3,2, 0,1,5, 0,5,4, 1,2,5, 2,3,4, 2,4,5, 3,0,4];
    geo.setIndex(indices);
    geo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    geo.computeVertexNormals();
    return geo;
  }
  return new THREE.BoxGeometry(1,1,1);
}

function rebuild3DScene(){
  meshesMap.forEach(mesh => scene.remove(mesh));
  meshesMap.clear();

  let baseMesh = null;
  let subtractiveShapes = [];

  shapes.forEach((s, idx) => {
    const geo = createGeometryForShape(s);
    const mat = new THREE.MeshStandardMaterial({ color: s.color || 0x10b981, roughness: 0.3, metalness: 0.1 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(s.x, s.y, s.z);
    mesh.updateMatrix();

    if(s.op === 'subtract') {
      subtractiveShapes.push({ mesh, index: idx, s });
    } else {
      if(!baseMesh){
        baseMesh = mesh;
        scene.add(baseMesh);
        meshesMap.set(idx, baseMesh);
      } else {
        scene.add(mesh);
        meshesMap.set(idx, mesh);
      }
    }
  });

  if(baseMesh && subtractiveShapes.length > 0 && typeof CSG !== 'undefined'){
    try {
      let csgBase = CSG.fromMesh(baseMesh);
      subtractiveShapes.forEach(sub => {
        const csgSub = CSG.fromMesh(sub.mesh);
        csgBase = csgBase.subtract(csgSub);
      });
      scene.remove(baseMesh);
      const resultingMesh = CSG.toMesh(csgBase, baseMesh.matrix);
      resultingMesh.material = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3, metalness: 0.2 });
      scene.add(resultingMesh);
      meshesMap.set(0, resultingMesh);
    } catch(err){
      console.log("CSG fallback aktivovaný");
    }
  }

  subtractiveShapes.forEach(sub => {
    sub.mesh.material = new THREE.MeshStandardMaterial({ color: 0xef4444, transparent: true, opacity: 0.4, wireframe: true });
    scene.add(sub.mesh);
    meshesMap.set(sub.index, sub.mesh);
  });

  if(editMode) updateDimensionsPanel();
}

function onPointerDown(e){
  if(isDraftingMode) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  if(tool === 'select'){
    const intersects = raycaster.intersectObjects(Array.from(meshesMap.values()));
    if(intersects.length > 0){ selectedShapeIndex = 0; rebuild3DScene(); }
    else { selectedShapeIndex = null; rebuild3DScene(); }
    return;
  }

  const intersects = raycaster.intersectObject(floorPlane);
  if(intersects.length > 0){
    const p = intersects[0].point;
    const snapX = Math.round(p.x * 2) / 2;
    const snapZ = Math.round(p.z * 2) / 2;

    pushState();
    let shape = {
      type: currentShapeType, op: currentCsgOp,
      x: snapX, y: currentCsgOp === 'subtract' ? 0.5 : 1, z: snapZ,
      w: 2, h: 2, d: 2, r: 1, wall: 0.3, fillet: 0.2, chamfer: 0.2,
      color: currentCsgOp === 'subtract' ? '#ef4444' : '#10b981'
    };
    shapes.push(shape);
    selectedShapeIndex = shapes.length - 1;
    rebuild3DScene();
    logCommand(`Pridaný diel: ${shape.type.toUpperCase()}`);
  }
}

function onPointerMove(e){
  if(isDraftingMode) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(floorPlane);
  if(intersects.length > 0){
    const p = intersects[0].point;
    info.textContent = `X: ${p.x.toFixed(2)}, Z: ${p.z.toFixed(2)} | Tvar: ${currentShapeType.toUpperCase()}`;
  }
}

// 📐 GENERÁTOR 2D VÝKRESU (DRAFTING) V ŠTÝLE SOLIDWORKS
function toggleDraftingMode(){
  isDraftingMode = !isDraftingMode;
  const btn = document.getElementById('modeToggleBtn');
  
  if(isDraftingMode){
    container.style.display = 'none';
    draftingContainer.style.display = 'flex';
    btn.textContent = '🧊 Prepnúť na 3D Model';
    btn.style.background = '#3b82f6';
    btn.style.color = '#ffffff';
    generateEngineeringBlueprint();
    logCommand("Prehliadač prepnutý na 2D Technický výkres (Drafting).");
  } else {
    draftingContainer.style.display = 'none';
    container.style.display = 'flex';
    btn.textContent = '📐 Prepnúť na 2D Výkres';
    btn.style.background = '#f59e0b';
    btn.style.color = '#black';
    logCommand("Návrat do 3D Modelovania.");
  }
}

function generateEngineeringBlueprint(){
  const canvas = document.getElementById('blueprintCanvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Rám výkresu a rohové razítko (Rohová hlavička)
  ctx.strokeStyle = '#000000';
  ctx.lineWidth = 2;
  ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

  // Rohové razítko vpravo dole
  const rx = canvas.width - 320, ry = canvas.height - 140;
  ctx.strokeRect(rx, ry, 300, 120);
  ctx.beginPath();
  ctx.moveTo(rx, ry + 40); ctx.lineTo(rx + 300, ry + 40);
  ctx.moveTo(rx, ry + 80); ctx.lineTo(rx + 300, ry + 80);
  ctx.moveTo(rx + 120, ry + 40); ctx.lineTo(rx + 120, ry + 120);
  ctx.stroke();

  ctx.fillStyle = '#000000';
  ctx.font = 'bold 14px Segoe UI, sans-serif';
  ctx.fillText("ERIKAI OS — INDUSTRIAL CAD", rx + 10, ry + 25);
  ctx.font = '11px monospace';
  ctx.fillText("Názov: Výkres Zostavy 3D", rx + 130, ry + 25);
  ctx.fillText("Mierka: 1 : 1", rx + 10, ry + 65);
  ctx.fillText("Materiál: Konštrukčná oceľ", rx + 130, ry + 65);
  ctx.fillText("Autor: ErikAI CAD Suite", rx + 10, ry + 105);
  ctx.fillText("Dátum: 2026", rx + 200, ry + 105);

  // Vykreslenie technických pohľadov objektov (Nárys, Pôdorys)
  let cx = 150, cy = 250;
  shapes.forEach((s, idx) => {
    ctx.strokeStyle = s.op === 'subtract' ? '#ef4444' : '#000000';
    ctx.lineWidth = 2;
    ctx.setLineDash(s.op === 'subtract' ? [4, 4] : []);

    if(s.type === 'box' || s.type === 'filletBox' || s.type === 'chamferBox' || s.type === 'wedge'){
      ctx.strokeRect(cx, cy, s.w * 30, s.h * 30);
      // Kóty
      ctx.setLineDash([]);
      ctx.font = '10px monospace';
      ctx.fillStyle = '#0055ff';
      ctx.fillText(`${(s.w * 100).toFixed(0)} mm`, cx + (s.w * 15) - 15, cy - 8);
      ctx.fillText(`${(s.h * 100).toFixed(0)} mm`, cx + (s.w * 30) + 8, cy + (s.h * 15));
    } else if(s.type === 'cylinder' || s.type === 'pipe' || s.type === 'sphere' || s.type === 'cone'){
      ctx.beginPath();
      ctx.arc(cx + 40, cy + 40, s.r * 30, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#0055ff';
      ctx.fillText(`Ø ${(s.r * 200).toFixed(0)} mm`, cx + 15, cy - 8);
    }
    cx += 180;
    if(cx > 800) { cx = 150; cy += 220; }
  });
}

function exportBlueprintImage(){
  const canvas = document.getElementById('blueprintCanvas');
  const link = document.createElement('a');
  link.download = 'erikai_technicky_vykres.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  logCommand("Výkres exportovaný ako PNG obrázok!");
}

function printBlueprint(){
  const canvas = document.getElementById('blueprintCanvas');
  const win = window.open('', '_blank');
  win.document.write(`<html><body><img src="${canvas.toDataURL()}" style="width:100%" onload="window.print();window.close()"/></body></html>`);
  win.document.close();
}

function resetCamera(){ camera.position.set(12, 14, 18); controls.target.set(0, 0, 0); controls.update(); }

function exportJSON(){
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(shapes, null, 2));
  const link = document.createElement('a'); link.download = 'erikai_cad_projekt.json'; link.href = dataStr; link.click();
}
function importJSON(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){ try { shapes = JSON.parse(e.target.result); rebuild3DScene(); } catch(err){} };
  reader.readAsText(file);
}

editDimsBtn.onclick = () => {
  editMode = !editMode; dimsPanel.style.display = editMode ? 'block' : 'none';
  if(editMode) updateDimensionsPanel();
};
function closeDimensionsPanel(){ editMode = false; dimsPanel.style.display = 'none'; }

function updateDimensionsPanel(){
  if(document.activeElement && document.activeElement.tagName === 'INPUT' && dimsPanel.contains(document.activeElement)) return;
  dimsContent.innerHTML = '';
  if(shapes.length === 0){ dimsContent.innerHTML = 'Žiadne diely'; return; }

  shapes.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = `shape-card ${i === selectedShapeIndex ? 'active' : ''}`;
    card.innerHTML = `<div class="shape-title-row"><strong>#${i+1} (${s.type.toUpperCase()})</strong><button class="danger" onclick="shapes.splice(${i},1);rebuild3DScene();updateDimensionsPanel();">🗑️</button></div>`;
    
    // Súradnice (+/-)
    const posRow = document.createElement('div');
    posRow.className = 'input-row';
    posRow.innerHTML = `<label>X:</label><input type="number" step="0.5" value="${s.x}"><label>Y:</label><input type="number" step="0.5" value="${s.y}"><label>Z:</label><input type="number" step="0.5" value="${s.z}">`;
    const inps = posRow.querySelectorAll('input');
    inps[0].onchange = (e) => { s.x = parseFloat(e.target.value)||0; rebuild3DScene(); };
    inps[1].onchange = (e) => { s.y = parseFloat(e.target.value)||0; rebuild3DScene(); };
    inps[2].onchange = (e) => { s.z = parseFloat(e.target.value)||0; rebuild3DScene(); };
    card.appendChild(posRow);

    // Parametre zaoblenia / skosenia ak ide o špeciálny blok
    if(s.type === 'filletBox' || s.type === 'chamferBox'){
      const specRow = document.createElement('div');
      specRow.className = 'input-row';
      specRow.innerHTML = `<label>Š:</label><input type="number" value="${s.w}"><label>V:</label><input type="number" value="${s.h}"><label>H:</label><input type="number" value="${s.d}"><label>${s.type==='filletBox'?'Zaob':'Skos'}:</label><input type="number" step="0.1" value="${s.type==='filletBox'?s.fillet:s.chamfer}">`;
      card.appendChild(specRow);
    }
    dimsContent.appendChild(card);
  });
}

function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
window.onload = init3D;
</script>
</body>
</html>
