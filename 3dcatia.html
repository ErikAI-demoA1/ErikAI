<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>ErikAI Pro CAD & 2D Drafting Studio</title>
<!-- Three.js, OrbitControls a Three-CSG -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three-csg-ts@3.1.16/lib/bundle.js"></script>

<style>
:root{
  --bg-color: #121216;
  --panel-bg: #1e222d;
  --border-color: #2e364f;
  --accent-green: #10b981;
  --accent-blue: #3b82f6;
  --accent-red: #ef4444;
  --accent-amber: #f59e0b;
  --accent-purple: #8b5cf6;
  --text-main: #ffffff;
  --text-muted: #94a3b8;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg-color);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  touch-action: none;
}
header{
  padding: 8px 12px;
  background: var(--panel-bg);
  border-bottom: 2px solid var(--border-color);
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  justify-content: space-between;
  z-index: 10;
}
.panel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

#workspaceContainer {
  flex: 1;
  overflow: hidden;
  position: relative;
  background: #0b0d13;
  display: flex;
}

#canvasContainer, #draftingContainer {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
}

#draftingContainer {
  background: #0f172a;
  color: #0f172a;
  display: none;
  overflow: hidden;
  position: relative;
  cursor: grab;
}
#draftingContainer:active { cursor: grabbing; }

canvas.blueprint-canvas {
  background: #ffffff;
  box-shadow: 0 15px 40px rgba(0,0,0,0.6);
  display: block;
  transform-origin: 0 0;
  position: absolute;
}

button, label.file-btn, select.format-select{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  background: var(--accent-green);
  color:#000;
  font-weight: bold;
  cursor:pointer;
  font-size: 0.82rem;
  transition: all 0.2s;
  box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
button:hover, label.file-btn:hover, select.format-select:hover{filter: brightness(1.1); transform: translateY(-1px);}
button.ghost{background: var(--panel-bg);border:1px solid var(--border-color);color:var(--text-main);}
button.active{background: var(--accent-blue); color:white;}
button.danger{background: var(--accent-red); color:white;}
button.warning{background: var(--accent-amber); color:black;}

select.format-select {
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  outline: none;
}

label.file-btn {
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  color: var(--text-main);
}
input[type="file"] { display: none; }

#commandLineContainer{
  background: #090b10;
  border-top: 1px solid var(--border-color);
  padding: 6px 12px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 0.85rem;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#commandHistory{
  height: 28px;
  overflow-y: auto;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#commandInputRow{display: flex; align-items: center; gap: 6px;}
#commandPrompt{color: var(--accent-green); font-weight: bold;}
#commandInput{
  flex: 1;
  background: transparent;
  border: none;
  color: white;
  font-family: inherit;
  font-size: 0.9rem;
  outline: none;
}

.info{padding:5px 12px;background: var(--panel-bg);font-size:0.8rem;color:var(--text-muted);border-top:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;}

#dimensionsPanel{
  position:fixed;
  top:60px;
  right:15px;
  background:var(--panel-bg);
  border:1px solid var(--border-color);
  padding:12px;
  border-radius:10px;
  max-height:80vh;
  overflow-y: auto;
  overflow-x: hidden;
  display:none;
  box-shadow: 0 15px 40px rgba(0,0,0,0.8);
  width: 480px;
  max-width: 95vw;
  z-index: 1000;
}
.panel-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  cursor: grab;
  user-select: none;
  background: rgba(255,255,255,0.04);
  padding: 6px 10px;
  border-radius: 6px;
}
.panel-header:active{ cursor: grabbing; }
#dimensionsPanel h3{margin:0;color:var(--accent-green);font-size:0.9rem;}
.close-btn{
  background: transparent; border: none; color: var(--text-muted); font-size: 1.1rem; font-weight: bold; cursor: pointer; padding: 0 4px; box-shadow: none;
}

.shape-card{
  background: #121216;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 8px;
}
.shape-card.active{
  border-color: var(--accent-blue);
  background: #1a233a;
}
.shape-title-row{
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.input-group-title{ font-size: 0.72rem; color: var(--accent-blue); font-weight: bold; margin-top: 6px; }
.input-row{ display: flex; gap: 6px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
.input-row label{ font-size: 0.73rem; color: var(--text-muted); white-space: nowrap; }
.input-row input, .input-row select{
  width: 58px;
  padding: 4px;
  border-radius: 4px;
  border: 1px solid var(--border-color);
  background: #090b10;
  color: white;
  font-size: 0.8rem;
}

#blueprintOverlayControls {
  position: absolute;
  top: 15px;
  left: 15px;
  z-index: 5;
  background: rgba(30, 34, 45, 0.95);
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

#confirmDimBtn {
  display: none;
  background: var(--accent-amber);
  color: #000;
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}
</style>
</head>
<body>

<header>
  <div class="panel">
    <select id="shapeSelector" class="format-select" onchange="changeActiveShape()">
      <option value="box">🧊 Kváder (Blok)</option>
      <option value="filletBox">📐 Zaoblený kváder (Fillet)</option>
      <option value="chamferBox">✂️ Skosený kváder (Chamfer)</option>
      <option value="cylinder">🧪 Valec / Čap</option>
      <option value="threadedRod">🔩 Závitová tyč / Čap (Metrický)</option>
      <option value="pipe">⭕ Rúra (S dierou)</option>
      <option value="elbow">🔀 Koleno 90°</option>
      <option value="sphere">🔮 Guľa</option>
      <option value="wedge">📐 Klin / Šikmá doska</option>
      <option value="torus">🍩 Tórus / O-Krúžok</option>
      <option value="cone">🔺 Kužeľ</option>
    </select>

    <select id="csgOperationSelector" class="format-select" onchange="changeCsgOperation()" style="border-color: var(--accent-blue);">
      <option value="add">➕ Pridať materiál</option>
      <option value="subtract">➖ Odobrať materiál (Prierez)</option>
    </select>

    <button id="modeToggleBtn" class="ghost" onclick="toggleDraftingMode()" style="background:var(--accent-amber); color:#000;">📐 Prepnúť na 2D Výkres</button>
    <button id="selectBtn" class="ghost" onclick="setTool('select')">👆 Vybrať</button>
    <button class="ghost" onclick="resetCamera()">🎥 Kamera</button>
    <button id="editDimsBtn" class="ghost">📋 Parametre & Diely</button>
  </div>
  <div class="panel">
    <button class="ghost" onclick="exportBlueprintImage()" style="background:var(--accent-blue); color:white;">📷 PNG</button>
    <button class="ghost" onclick="exportSVG()" style="background:var(--accent-purple); color:white;">✂️ SVG (CNC)</button>
    <button class="ghost" onclick="printBlueprint()" style="background:var(--accent-green); color:#000;">🖨️ Tlačiť</button>
    <button class="ghost" onclick="exportJSON()">💾 Uložiť JSON</button>
    <label for="fileInput" class="file-btn">📂 Otvoriť JSON</label>
    <input type="file" id="fileInput" accept=".json" onchange="importJSON(event)">
    <button class="ghost" onclick="clearAll()" style="background:var(--accent-red); color:white;">🗑️ Zmazať</button>
  </div>
</header>

<div id="workspaceContainer">
  <div id="canvasContainer"></div>
  <div id="draftingContainer">
    <div id="blueprintOverlayControls">
      <select id="viewCountSelector" class="format-select" onchange="changeViewLayout()">
        <option value="1">1 Pohľad</option>
        <option value="2">2 Pohľady</option>
        <option value="3" selected>3 Pohľady (ISO)</option>
        <option value="4">4 Pohľady</option>
        <option value="5">5 Pohľadov + Rez A-A</option>
      </select>

      <select id="dimTypeSelector" class="format-select" onchange="changeDimType()">
        <option value="smart">📏 Vzdialenosť (Smart)</option>
        <option value="horiz">↔️ Horizontálna</option>
        <option value="vert">↕️ Vertikálna</option>
        <option value="radius">⭕ Polomer (R)</option>
        <option value="diameter">⌀ Priemer (Ø)</option>
        <option value="angular">📐 Uhol (°)</option>
      </select>

      <button id="addDimensionBtn" class="ghost" onclick="toggleManualDimensionMode()">📏 Kótovať</button>
      <button id="confirmDimBtn" onclick="confirmCurrentPendingDimension()">✅ Potvrdiť Kótu (Enter)</button>
      <button class="ghost" onclick="resetBlueprintPanZoom()">🔍 Reset</button>
      <span style="font-size:0.75rem; color:var(--text-muted);">Pohyb: ťahanie | Zoom: koliesko / pinch</span>
    </div>
    <canvas id="blueprintCanvas" class="blueprint-canvas" width="1600" height="1100"></canvas>
  </div>
</div>

<div class="info" id="info">
  <span id="infoCoords">X: 0.00, Y: 0.00, Z: 0.00 | Režim: 3D Studio</span>
  <span id="infoCount">Počet dielov: 0</span>
</div>

<div id="commandLineContainer">
  <div id="commandHistory"><div>ErikAI Pro CAD Engine. Komplexné modelovanie a ISO 2D výkresy.</div></div>
  <div id="commandInputRow">
    <span id="commandPrompt">&gt;</span>
    <input type="text" id="commandInput" placeholder="Príkaz (box, pipe, drafting, clear)..." autocomplete="off">
  </div>
</div>

<div id="dimensionsPanel">
  <div class="panel-header" id="panelHeader">
    <h3>Správca Parametrov & Razítka</h3>
    <button class="close-btn" onclick="closeDimensionsPanel()">✕</button>
  </div>
  <div id="dimsContent">Žiadne diely v zostave</div>
</div>

<script>
let scene, camera, renderer, controls;
let raycaster, mouse, floorPlane;
let shapes = [], undoStack = [], redoStack = [], meshesMap = new Map();
let selectedShapeIndex = null;
let currentShapeType = 'box', currentCsgOp = 'add', tool = 'create', editMode = false, isDraftingMode = false;

// 2D Výkres & Kótovanie
let bpScale = 1.0, bpPanX = 50, bpPanY = 50, isBpDragging = false, bpStartMouse = {x:0, y:0};
let manualDimensions = [];
let manualDimStep = 0, firstDimPoint = null, manualDimModeActive = false;
let currentDimType = 'smart';
let hoveredEdge = null, pendingDimension = null;
let viewLayoutCount = 3;

let blueprintMeta = {
  title: "MECH. ZOSTAVA - HRIADEĽ A POUZDRO",
  material: "Oceľ 11 523 / S235JR",
  author: "ErikAI CAD Studio",
  scale: "1 : 1",
  docNo: "DWG-2026-001",
  date: "2026-11-08"
};

const container = document.getElementById('canvasContainer');
const draftingContainer = document.getElementById('draftingContainer');
const infoCoords = document.getElementById('infoCoords');
const infoCount = document.getElementById('infoCount');
const dimsPanel = document.getElementById('dimensionsPanel');
const panelHeader = document.getElementById('panelHeader');
const dimsContent = document.getElementById('dimsContent');
const editDimsBtn = document.getElementById('editDimsBtn');
const commandHistory = document.getElementById('commandHistory');
const commandInput = document.getElementById('commandInput');

let isDraggingPanel = false, panelDragOffset = {x: 0, y: 0};
function startPanelDrag(clientX, clientY){
  isDraggingPanel = true;
  const rect = dimsPanel.getBoundingClientRect();
  panelDragOffset.x = clientX - rect.left; panelDragOffset.y = clientY - rect.top;
}
function movePanelDrag(clientX, clientY){
  if(!isDraggingPanel) return;
  dimsPanel.style.left = (clientX - panelDragOffset.x) + 'px';
  dimsPanel.style.top = (clientY - panelDragOffset.y) + 'px';
  dimsPanel.style.right = 'auto';
}
panelHeader.onmousedown = (e) => { if(e.target.tagName !== 'BUTTON'){ startPanelDrag(e.clientX, e.clientY); e.preventDefault(); } };
window.onmousemove = (e) => movePanelDrag(e.clientX, e.clientY);
window.onmouseup = () => { isDraggingPanel = false; };

function logCommand(text){
  const div = document.createElement('div');
  div.textContent = `> ${text}`;
  commandHistory.appendChild(div);
  commandHistory.scrollTop = commandHistory.scrollHeight;
}

function init3D() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0d13);

  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(14, 16, 20);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(15, 25, 20);
  scene.add(dirLight);

  const gridHelper = new THREE.GridHelper(30, 30, 0x10b981, 0x2e364f);
  scene.add(gridHelper);

  const planeGeo = new THREE.PlaneGeometry(100, 100);
  planeGeo.rotateX(-Math.PI / 2);
  floorPlane = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ visible: false }));
  scene.add(floorPlane);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  container.addEventListener('pointerdown', onPointerDown);
  container.addEventListener('pointermove', onPointerMove);

  window.addEventListener('resize', () => {
    if(!isDraftingMode){
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }
  });

  setupBlueprintInteraction();
  loadFromLocalStorage();
  animate();
}

function changeActiveShape(){
  currentShapeType = document.getElementById('shapeSelector').value;
  tool = 'create';
  document.getElementById('selectBtn').classList.replace('active', 'ghost');
  logCommand(`Aktívny tvar: ${currentShapeType.toUpperCase()}`);
}

function changeCsgOperation(){
  currentCsgOp = document.getElementById('csgOperationSelector').value;
  logCommand(`CSG Režim: ${currentCsgOp === 'add' ? 'Pridať' : 'Odobrať'}`);
}

function changeDimType(){
  currentDimType = document.getElementById('dimTypeSelector').value;
  logCommand(`Režim kótovania: ${currentDimType.toUpperCase()}`);
}

function changeViewLayout(){
  viewLayoutCount = parseInt(document.getElementById('viewCountSelector').value) || 3;
  generateEngineeringBlueprint();
  logCommand(`Pohľady výkresu nastavené na: ${viewLayoutCount}`);
}

function setTool(t){
  tool = t;
  if(t === 'select') document.getElementById('selectBtn').classList.replace('ghost', 'active');
  else document.getElementById('selectBtn').classList.replace('active', 'ghost');
  logCommand(`Nástroj: ${t.toUpperCase()}`);
}

function pushState(){
  undoStack.push(JSON.parse(JSON.stringify(shapes)));
  redoStack = [];
  saveToLocalStorage();
}

function clearAll(){
  pushState(); shapes = []; manualDimensions = []; selectedShapeIndex = null;
  rebuild3DScene(); saveToLocalStorage();
  logCommand("Všetko vymazané.");
}

function saveToLocalStorage(){
  localStorage.setItem('erikai_cad_adv_state', JSON.stringify({ shapes, blueprintMeta, manualDimensions, viewLayoutCount }));
  infoCount.textContent = `Počet dielov: ${shapes.length}`;
}

function loadFromLocalStorage(){
  const saved = localStorage.getItem('erikai_cad_adv_state');
  if(saved){
    try { 
      const data = JSON.parse(saved); 
      shapes = data.shapes || [];
      blueprintMeta = data.blueprintMeta || blueprintMeta;
      manualDimensions = data.manualDimensions || [];
      viewLayoutCount = data.viewLayoutCount || 3;
      document.getElementById('viewCountSelector').value = viewLayoutCount;
      rebuild3DScene(); 
    } catch(e){}
  }
}

function createGeometryForShape(s){
  let geo;
  if(s.type === 'box') {
    geo = new THREE.BoxGeometry(s.w, s.h, s.d);
  } else if(s.type === 'filletBox') {
    const filletR = Math.min(s.fillet || 0.2, s.w/2 - 0.05, s.d/2 - 0.05);
    const shape = new THREE.Shape();
    const w2 = s.w/2, d2 = s.d/2;
    shape.moveTo(-w2 + filletR, -d2);
    shape.lineTo(w2 - filletR, -d2);
    shape.quadraticCurveTo(w2, -d2, w2, -d2 + filletR);
    shape.lineTo(w2, d2 - filletR);
    shape.quadraticCurveTo(w2, d2, w2 - filletR, d2);
    shape.lineTo(-w2 + filletR, d2);
    shape.quadraticCurveTo(-w2, d2, -w2, d2 - filletR);
    shape.lineTo(-w2, -d2 + filletR);
    shape.quadraticCurveTo(-w2, -d2, -w2 + filletR, -d2);
    geo = new THREE.ExtrudeGeometry(shape, { depth: s.h, bevelEnabled: true, bevelSegments: 4, steps: 1, bevelSize: filletR*0.5, bevelThickness: filletR*0.5 });
    geo.center();
  } else if(s.type === 'chamferBox') {
    const chamf = Math.min(s.chamfer || 0.2, s.w/2 - 0.05, s.d/2 - 0.05);
    const shape = new THREE.Shape();
    const w2 = s.w/2, d2 = s.d/2;
    shape.moveTo(-w2 + chamf, -d2);
    shape.lineTo(w2 - chamf, -d2);
    shape.lineTo(w2, -d2 + chamf);
    shape.lineTo(w2, d2 - chamf);
    shape.lineTo(w2 - chamf, d2);
    shape.lineTo(-w2 + chamf, d2);
    shape.lineTo(-w2, d2 - chamf);
    shape.lineTo(-w2, -d2 + chamf);
    geo = new THREE.ExtrudeGeometry(shape, { depth: s.h, bevelEnabled: false });
    geo.center();
  } else if(s.type === 'cylinder' || s.type === 'threadedRod') {
    geo = new THREE.CylinderGeometry(s.r, s.r, s.h, 32);
  } else if(s.type === 'sphere') {
    geo = new THREE.SphereGeometry(s.r, 32, 32);
  } else if(s.type === 'cone') {
    geo = new THREE.CylinderGeometry(0, s.r, s.h, 32);
  } else if(s.type === 'torus') {
    geo = new THREE.TorusGeometry(s.r, s.tube || 0.3, 16, 100);
  } else if(s.type === 'pipe') {
    const shape = new THREE.Shape();
    shape.absarc(0, 0, s.r, 0, Math.PI * 2, false);
    const innerR = Math.max(0.05, s.r - (s.wall || 0.3));
    const holePath = new THREE.Path();
    holePath.absarc(0, 0, innerR, 0, Math.PI * 2, true);
    shape.holes.push(holePath);
    geo = new THREE.ExtrudeGeometry(shape, { depth: s.h, bevelEnabled: false, curveSegments: 32 });
    geo.rotateX(Math.PI / 2);
    geo.center();
  } else if(s.type === 'elbow') {
    const curve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, s.r * 2.5, 0), new THREE.Vector3(s.r * 2.5, s.r * 2.5, 0)
    );
    geo = new THREE.TubeGeometry(curve, 32, s.r, 24, false);
  } else if(s.type === 'wedge') {
    geo = new THREE.BufferGeometry();
    const w = s.w/2, h = s.h/2, d = s.d/2;
    const vertices = new Float32Array([-w,-h,-d, w,-h,-d, w,-h, d, -w,-h, d, -w, h,-d, w, h,-d]);
    const indices = [0,2,1, 0,3,2, 0,1,5, 0,5,4, 1,2,5, 2,3,4, 2,4,5, 3,0,4];
    geo.setIndex(indices);
    geo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    geo.computeVertexNormals();
  } else {
    geo = new THREE.BoxGeometry(1, 1, 1);
  }
  return geo;
}

function rebuild3DScene(){
  meshesMap.forEach(mesh => scene.remove(mesh));
  meshesMap.clear();

  let baseMesh = null;
  let subtractiveShapes = [];

  shapes.forEach((s, idx) => {
    const geo = createGeometryForShape(s);
    const mat = new THREE.MeshStandardMaterial({ color: s.color || 0x10b981, roughness: 0.3, metalness: 0.1 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(s.x, s.y, s.z);
    mesh.rotation.set((s.rx||0)*Math.PI/180, (s.ry||0)*Math.PI/180, (s.rz||0)*Math.PI/180);
    mesh.updateMatrix();

    if(s.op === 'subtract') {
      subtractiveShapes.push({ mesh, index: idx, s });
    } else {
      if(!baseMesh){
        baseMesh = mesh;
        scene.add(baseMesh);
        meshesMap.set(idx, baseMesh);
      } else {
        scene.add(mesh);
        meshesMap.set(idx, mesh);
      }
    }
  });

  if(baseMesh && subtractiveShapes.length > 0 && typeof CSG !== 'undefined'){
    try {
      let csgBase = CSG.fromMesh(baseMesh);
      subtractiveShapes.forEach(sub => {
        const csgSub = CSG.fromMesh(sub.mesh);
        csgBase = csgBase.subtract(csgSub);
      });
      scene.remove(baseMesh);
      const resultingMesh = CSG.toMesh(csgBase, baseMesh.matrix);
      resultingMesh.material = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3, metalness: 0.2 });
      scene.add(resultingMesh);
      meshesMap.set(0, resultingMesh);
    } catch(err){}
  }

  subtractiveShapes.forEach(sub => {
    sub.mesh.material = new THREE.MeshStandardMaterial({ color: 0xef4444, transparent: true, opacity: 0.45, wireframe: true });
    scene.add(sub.mesh);
    meshesMap.set(sub.index, sub.mesh);
  });

  if(editMode) updateDimensionsPanel();
  if(isDraftingMode) generateEngineeringBlueprint();
}

function onPointerDown(e){
  if(isDraftingMode) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  if(tool === 'select'){
    const intersects = raycaster.intersectObjects(Array.from(meshesMap.values()));
    if(intersects.length > 0){ selectedShapeIndex = 0; rebuild3DScene(); }
    else { selectedShapeIndex = null; rebuild3DScene(); }
    return;
  }

  const intersects = raycaster.intersectObject(floorPlane);
  if(intersects.length > 0){
    const p = intersects[0].point;
    const snapX = Math.round(p.x * 2) / 2;
    const snapZ = Math.round(p.z * 2) / 2;

    pushState();
    let shape = {
      type: currentShapeType, op: currentCsgOp,
      x: snapX, y: currentCsgOp === 'subtract' ? 0.5 : 1, z: snapZ,
      rx: 0, ry: 0, rz: 0,
      w: 2, h: 2, d: 2, r: 1, wall: 0.3, fillet: 0.2, chamfer: 0.2, tube: 0.3,
      color: currentCsgOp === 'subtract' ? '#ef4444' : '#10b981'
    };
    shapes.push(shape);
    selectedShapeIndex = shapes.length - 1;
    rebuild3DScene();
    saveToLocalStorage();
    logCommand(`Pridaný: ${shape.type.toUpperCase()}`);
  }
}

function onPointerMove(e){
  if(isDraftingMode) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(floorPlane);
  if(intersects.length > 0){
    const p = intersects[0].point;
    infoCoords.textContent = `X: ${p.x.toFixed(2)}, Z: ${p.z.toFixed(2)} | 3D Studio`;
  }
}

function setupBlueprintInteraction(){
  const draftingDiv = document.getElementById('draftingContainer');

  draftingDiv.addEventListener('mousedown', (e) => {
    if(e.target.closest('#blueprintOverlayControls')) return;
    if(manualDimModeActive){ handleDimensioningClick(e.clientX, e.clientY); return; }
    isBpDragging = true;
    bpStartMouse = { x: e.clientX - bpPanX, y: e.clientY - bpPanY };
  });

  draftingDiv.addEventListener('touchstart', (e) => {
    if(e.target.closest('#blueprintOverlayControls')) return;
    if(manualDimModeActive){ handleDimensioningClick(e.touches[0].clientX, e.touches[0].clientY); return; }
    if(e.touches.length === 1){
      isBpDragging = true;
      bpStartMouse = { x: e.touches[0].clientX - bpPanX, y: e.touches[0].clientY - bpPanY };
    }
  });

  window.addEventListener('mousemove', (e) => {
    if(isBpDragging){
      bpPanX = e.clientX - bpStartMouse.x;
      bpPanY = e.clientY - bpStartMouse.y;
      applyCanvasTransform();
    } else if(manualDimModeActive){
      const canvas = document.getElementById('blueprintCanvas');
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) / bpScale;
      const clickY = (e.clientY - rect.top) / bpScale;
      hoveredEdge = detectClickedEdge(clickX, clickY);
      generateEngineeringBlueprint();
    }
  });

  window.addEventListener('touchmove', (e) => {
    if(isBpDragging && e.touches.length === 1){
      bpPanX = e.touches[0].clientX - bpStartMouse.x;
      bpPanY = e.touches[0].clientY - bpStartMouse.y;
      applyCanvasTransform();
    }
  });

  window.addEventListener('mouseup', () => { isBpDragging = false; });
  window.addEventListener('touchend', () => { isBpDragging = false; });

  draftingDiv.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
    bpScale = Math.max(0.3, Math.min(4.0, bpScale * zoomFactor));
    applyCanvasTransform();
  }, { passive: false });
}

function applyCanvasTransform(){
  const canvas = document.getElementById('blueprintCanvas');
  canvas.style.transform = `translate(${bpPanX}px, ${bpPanY}px) scale(${bpScale})`;
}

function resetBlueprintPanZoom(){
  bpScale = 1.0; bpPanX = 40; bpPanY = 40;
  applyCanvasTransform();
}

function toggleManualDimensionMode(){
  manualDimModeActive = !manualDimModeActive;
  manualDimStep = 0; firstDimPoint = null; pendingDimension = null;
  const btn = document.getElementById('addDimensionBtn');
  const confirmBtn = document.getElementById('confirmDimBtn');
  if(manualDimModeActive){
    btn.classList.replace('ghost', 'active');
    logCommand("Kótovanie: Kliknite na zvýraznenú hranu alebo 2 body...");
  } else {
    btn.classList.replace('active', 'ghost');
    confirmBtn.style.display = 'none';
    hoveredEdge = null;
    generateEngineeringBlueprint();
    logCommand("Kótovanie vypnuté.");
  }
}

function handleDimensioningClick(clientX, clientY){
  const canvas = document.getElementById('blueprintCanvas');
  const rect = canvas.getBoundingClientRect();
  const clickX = (clientX - rect.left) / bpScale;
  const clickY = (clientY - rect.top) / bpScale;

  const snappedEdge = detectClickedEdge(clickX, clickY);
  if(snappedEdge){
    let formattedText = "";
    const distMM = (snappedEdge.lengthUnits * 100).toFixed(1);

    if(currentDimType === 'radius') formattedText = `R ${distMM/2}`;
    else if(currentDimType === 'diameter') formattedText = `Ø ${distMM}`;
    else if(currentDimType === 'angular') formattedText = `90.0°`;
    else if(currentDimType === 'horiz') formattedText = `${(Math.abs(snappedEdge.x2 - snappedEdge.x1) * 4).toFixed(1)} mm`;
    else if(currentDimType === 'vert') formattedText = `${(Math.abs(snappedEdge.y2 - snappedEdge.y1) * 4).toFixed(1)} mm`;
    else formattedText = `${distMM} mm`;

    pendingDimension = {
      x1: snappedEdge.x1, y1: snappedEdge.y1,
      x2: snappedEdge.x2, y2: snappedEdge.y2,
      text: formattedText
    };

    document.getElementById('confirmDimBtn').style.display = 'inline-flex';
    generateEngineeringBlueprint();
    logCommand(`Zvolená kóta: ${formattedText}. Potvrďte stlačením tlačidla.`);
    return;
  }

  if(manualDimStep === 0){
    firstDimPoint = { x: clickX, y: clickY };
    manualDimStep = 1;
    logCommand("1. bod zvolený. Kliknite na 2. bod...");
  } else if(manualDimStep === 1){
    const dx = clickX - firstDimPoint.x;
    const dy = clickY - firstDimPoint.y;
    const distMM = (Math.sqrt(dx*dx + dy*dy) * 2.5).toFixed(1);

    pendingDimension = {
      x1: firstDimPoint.x, y1: firstDimPoint.y,
      x2: clickX, y2: clickY,
      text: `${distMM} mm`
    };

    document.getElementById('confirmDimBtn').style.display = 'inline-flex';
    manualDimStep = 0; firstDimPoint = null;
    generateEngineeringBlueprint();
    logCommand(`Ručná kóta: ${distMM} mm. Potvrďte.`);
  }
}

function confirmCurrentPendingDimension(){
  if(pendingDimension){
    manualDimensions.push(pendingDimension);
    pendingDimension = null;
    document.getElementById('confirmDimBtn').style.display = 'none';
    toggleManualDimensionMode();
    generateEngineeringBlueprint();
    saveToLocalStorage();
    logCommand("Kóta úspešne pridaná do výkresu!");
  }
}

function detectClickedEdge(cx, cy){
  const views = getActiveLayoutViews();
  const sc = 25, threshold = 22;

  for(let s of shapes){
    for(let v of views){
      let px = v.offsetX + s.x * sc;
      let py = v.offsetY + (v.name==='top' ? s.z : -s.y) * sc;
      
      let edges = [];
      if(s.type === 'box' || s.type === 'filletBox' || s.type === 'chamferBox'){
        let w = s.w * sc, h = s.h * sc;
        edges = [
          { x1: px - w/2, y1: py - h/2 - 12, x2: px + w/2, y2: py - h/2 - 12, lengthUnits: s.w },
          { x1: px - w/2, y1: py + h/2 + 12, x2: px + w/2, y2: py + h/2 + 12, lengthUnits: s.w },
          { x1: px - w/2 - 12, y1: py - h/2, x2: px - w/2 - 12, y2: py + h/2, lengthUnits: s.h },
          { x1: px + w/2 + 12, y1: py - h/2, x2: px + w/2 + 12, y2: py + h/2, lengthUnits: s.h }
        ];
      } else if(s.type === 'cylinder' || s.type === 'pipe' || s.type === 'threadedRod'){
        let r = s.r * sc;
        if(v.name === 'top'){
          edges = [{ x1: px - r, y1: py - r - 12, x2: px + r, y2: py - r - 12, lengthUnits: s.r * 2 }];
        } else {
          let h = (s.h || 2) * sc;
          edges = [
            { x1: px - r, y1: py - h/2 - 12, x2: px + r, y2: py - h/2 - 12, lengthUnits: s.r * 2 },
            { x1: px + r + 12, y1: py - h/2, x2: px + r + 12, y2: py + h/2, lengthUnits: s.h || 2 }
          ];
        }
      }

      for(let edge of edges){
        let dist = pointToSegmentDistance(cx, cy, edge.x1, edge.y1, edge.x2, edge.y2);
        if(dist <= threshold) return edge;
      }
    }
  }
  return null;
}

function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
  let l2 = (x2 - x1)*(x2 - x1) + (y2 - y1)*(y2 - y1);
  if (l2 === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1)*(x2 - x1) + (py - y1)*(y2 - y1)) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t*(x2 - x1)), py - (y1 + t*(y2 - y1)));
}

function getActiveLayoutViews(){
  if(viewLayoutCount === 1){
    return [{ name: 'front', title: 'NÁRYS (FRONT VIEW)', offsetX: 750, offsetY: 450 }];
  } else if(viewLayoutCount === 2){
    return [
      { name: 'front', title: 'NÁRYS (FRONT VIEW)', offsetX: 750, offsetY: 280 },
      { name: 'top', title: 'PÔDORYS (TOP VIEW)', offsetX: 750, offsetY: 750 }
    ];
  } else if(viewLayoutCount === 3){
    return [
      { name: 'front', title: 'NÁRYS (FRONT VIEW)', offsetX: 250, offsetY: 300 },
      { name: 'top', title: 'PÔDORYS (TOP VIEW)', offsetX: 250, offsetY: 800 },
      { name: 'side', title: 'BOKORYS (SIDE VIEW)', offsetX: 1050, offsetY: 300 }
    ];
  } else if(viewLayoutCount === 4){
    return [
      { name: 'front', title: 'NÁRYS (FRONT VIEW)', offsetX: 250, offsetY: 300 },
      { name: 'top', title: 'PÔDORYS (TOP VIEW)', offsetX: 250, offsetY: 800 },
      { name: 'side', title: 'BOKORYS (SIDE VIEW)', offsetX: 1050, offsetY: 300 },
      { name: 'rear', title: 'ZADNÝ POHĽAD', offsetX: 1050, offsetY: 800 }
    ];
  } else {
    return [
      { name: 'front', title: 'NÁRYS (FRONT VIEW)', offsetX: 250, offsetY: 300 },
      { name: 'top', title: 'PÔDORYS (TOP VIEW)', offsetX: 250, offsetY: 800 },
      { name: 'side', title: 'BOKORYS (SIDE VIEW)', offsetX: 1050, offsetY: 300 },
      { name: 'iso', title: '3D IZOMETRIA', offsetX: 1050, offsetY: 800 },
      { name: 'section', title: 'REZ A-A (ISO 128)', offsetX: 650, offsetY: 540 }
    ];
  }
}

function generateEngineeringBlueprint(){
  const canvas = document.getElementById('blueprintCanvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 3;
  ctx.strokeRect(25, 25, canvas.width - 50, canvas.height - 50);

  const views = getActiveLayoutViews();

  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  if(viewLayoutCount >= 3){
    ctx.moveTo(780, 25); ctx.lineTo(780, canvas.height - 25);
    ctx.moveTo(25, 550); ctx.lineTo(canvas.width - 25, 550);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 12px Segoe UI, sans-serif';
  views.forEach(v => ctx.fillText(v.title, v.offsetX - 180, v.offsetY - 210));

  shapes.forEach((s) => {
    views.forEach(v => renderAccurateProjection(ctx, s, v.offsetX, v.offsetY, v.name));
  });

  if(viewLayoutCount >= 3){
    renderSectionLine(ctx, 250, 180, 250, 420, "A-A");
  }

  if(hoveredEdge){
    ctx.save();
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(hoveredEdge.x1, hoveredEdge.y1);
    ctx.lineTo(hoveredEdge.x2, hoveredEdge.y2);
    ctx.stroke();
    ctx.restore();
  }

  if(pendingDimension){
    drawCadDimensionLine(ctx, pendingDimension.x1, pendingDimension.y1, pendingDimension.x2, pendingDimension.y2, pendingDimension.text, '#f59e0b');
  }

  manualDimensions.forEach(dim => drawCadDimensionLine(ctx, dim.x1, dim.y1, dim.x2, dim.y2, dim.text, '#2563eb'));
  renderTitleBlock(ctx, canvas.width - 430, canvas.height - 160);
}

function renderAccurateProjection(ctx, s, offsetX, offsetY, viewType){
  ctx.save();
  let px = offsetX + s.x * 25;
  let py = offsetY + (viewType==='top' ? s.z : -s.y) * 25;
  ctx.translate(px, py);
  ctx.rotate((s.rz || 0) * Math.PI / 180);

  const sc = 25;
  const isSub = s.op === 'subtract';

  if(isSub){
    ctx.strokeStyle = '#dc2626';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
  } else {
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2;
  }

  if(s.type === 'box' || s.type === 'filletBox' || s.type === 'chamferBox'){
    let w = s.w * sc, h = s.h * sc;
    ctx.strokeRect(-w/2, -h/2, w, h);
    if(viewType === 'section' || isSub){
      drawHatching45(ctx, -w/2, -h/2, w, h);
    }
  } else if(s.type === 'cylinder' || s.type === 'cone' || s.type === 'sphere'){
    let r = s.r * sc;
    if(viewType === 'top'){
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
      drawCenterCross(ctx, 0, 0, r + 10);
    } else {
      let h = (s.h || 2) * sc;
      ctx.strokeRect(-r, -h/2, r*2, h);
      drawCenterLine(ctx, 0, -h/2 - 10, 0, h/2 + 10);
    }
  } else if(s.type === 'pipe'){
    let r = s.r * sc, h = (s.h || 2) * sc;
    let innerR = Math.max(0.1, s.r - (s.wall || 0.3)) * sc;
    if(viewType === 'top'){
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(0, 0, innerR, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      drawCenterCross(ctx, 0, 0, r + 10);
    } else {
      ctx.strokeRect(-r, -h/2, r*2, h);
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(-innerR, -h/2); ctx.lineTo(-innerR, h/2);
      ctx.moveTo(innerR, -h/2); ctx.lineTo(innerR, h/2);
      ctx.stroke();
      ctx.setLineDash([]);
      drawCenterLine(ctx, 0, -h/2 - 10, 0, h/2 + 10);
    }
  } else if(s.type === 'threadedRod'){
    let r = s.r * sc, h = (s.h || 2) * sc;
    let threadR = r * 0.85;
    if(viewType === 'top'){
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 0, threadR, 0, Math.PI * 1.5); ctx.stroke();
    } else {
      ctx.strokeRect(-r, -h/2, r*2, h);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-threadR, -h/2); ctx.lineTo(-threadR, h/2);
      ctx.moveTo(threadR, -h/2); ctx.lineTo(threadR, h/2);
      ctx.stroke();
      drawCenterLine(ctx, 0, -h/2 - 10, 0, h/2 + 10);
    }
  }
  ctx.restore();
}

function drawHatching45(ctx, x, y, w, h){
  ctx.save();
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  for(let i = -h; i < w; i += 12){
    ctx.moveTo(x + i, y);
    ctx.lineTo(x + i + h, y + h);
  }
  ctx.stroke();
  ctx.restore();
}

function drawCenterLine(ctx, x1, y1, x2, y2){
  ctx.save();
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 1;
  ctx.setLineDash([12, 3, 3, 3]);
  ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

function drawCenterCross(ctx, cx, cy, size){
  drawCenterLine(ctx, cx - size, cy, cx + size, cy);
  drawCenterLine(ctx, cx, cy - size, cx, cy + size);
}

function renderSectionLine(ctx, x1, y1, x2, y2, label){
  ctx.save();
  ctx.strokeStyle = '#000000';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x1 - 20, y1); ctx.lineTo(x1, y1);
  ctx.moveTo(x2, y2); ctx.lineTo(x2 + 20, y2);
  ctx.stroke();

  ctx.fillStyle = '#000000';
  ctx.font = 'bold 14px monospace';
  ctx.fillText(label, x1 - 35, y1 + 5);
  ctx.fillText(label, x2 + 28, y2 + 5);
  ctx.restore();
}

function drawCadDimensionLine(ctx, x1, y1, x2, y2, text, color = '#2563eb'){
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 1.5;

  ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.stroke();

  const angle = Math.atan2(y2 - y1, x2 - x1);
  const headLen = 6;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 + headLen * Math.cos(angle + Math.PI/6), y1 + headLen * Math.sin(angle + Math.PI/6));
  ctx.lineTo(x1 + headLen * Math.cos(angle - Math.PI/6), y1 + headLen * Math.sin(angle - Math.PI/6));
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI/6), y2 - headLen * Math.sin(angle + Math.PI/6));
  ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI/6), y2 - headLen * Math.sin(angle - Math.PI/6));
  ctx.fill();

  const midX = (x1 + x2) / 2;
  const midY = (y1 + y2) / 2;
  ctx.font = 'bold 10px monospace';
  ctx.fillText(text, midX - 18, midY - 5);
  ctx.restore();
}

function renderTitleBlock(ctx, x, y){
  ctx.save();
  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, 400, 135);

  ctx.beginPath();
  ctx.moveTo(x, y + 40); ctx.lineTo(x + 400, y + 40);
  ctx.moveTo(x, y + 85); ctx.lineTo(x + 400, y + 85);
  ctx.moveTo(x + 160, y + 40); ctx.lineTo(x + 160, y + 135);
  ctx.stroke();

  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 12px Segoe UI, sans-serif';
  ctx.fillText(blueprintMeta.title, x + 10, y + 25);

  ctx.font = '10px monospace';
  ctx.fillText(`Materiál: ${blueprintMeta.material}`, x + 10, y + 65);
  ctx.fillText(`Autor: ${blueprintMeta.author}`, x + 10, y + 112);
  ctx.fillText(`Výkres: ${blueprintMeta.docNo}`, x + 170, y + 65);
  ctx.fillText(`Mierka: ${blueprintMeta.scale}`, x + 170, y + 112);
  ctx.restore();
}

function exportSVG(){
  let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="25" y="25" width="1550" height="1050" fill="none" stroke="#000000" stroke-width="3"/>`;

  shapes.forEach(s => {
    const cx = 250 + s.x * 25, cy = 300 - s.y * 25;
    if(s.type==='box'||s.type==='pipe'){
      svgContent += `<rect x="${cx - s.w*12.5}" y="${cy - s.h*12.5}" width="${s.w*25}" height="${s.h*25}" fill="none" stroke="#000000" stroke-width="2"/>`;
    } else {
      svgContent += `<circle cx="${cx}" cy="${cy}" r="${s.r*25}" fill="none" stroke="#000000" stroke-width="2"/>`;
    }
  });

  svgContent += `</svg>`;
  const blob = new Blob([svgContent], {type: 'image/svg+xml'});
  const link = document.createElement('a');
  link.download = `erikai_cnc_cut_${Date.now()}.svg`;
  link.href = URL.createObjectURL(blob);
  link.click();
  logCommand("SVG pre CNC stiahnuté.");
}

function printBlueprint(){
  const canvas = document.getElementById('blueprintCanvas');
  const win = window.open('', '_blank');
  win.document.write(`<html><body><img src="${canvas.toDataURL()}" style="width:100%" onload="window.print();window.close()"/></body></html>`);
  win.document.close();
}

function resetCamera(){ camera.position.set(14, 16, 20); controls.target.set(0, 0, 0); controls.update(); }

function exportJSON(){
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ shapes, blueprintMeta, manualDimensions, viewLayoutCount }, null, 2));
  const link = document.createElement('a'); 
  link.download = `erikai_project_${Date.now()}.json`; 
  link.href = dataStr; 
  link.click();
  logCommand("Projekt uložený.");
}

function importJSON(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const data = JSON.parse(e.target.result);
      shapes = data.shapes || [];
      blueprintMeta = data.blueprintMeta || blueprintMeta;
      manualDimensions = data.manualDimensions || [];
      viewLayoutCount = data.viewLayoutCount || 3;
      document.getElementById('viewCountSelector').value = viewLayoutCount;
      rebuild3DScene(); 
      logCommand("Projekt načítaný.");
    } catch(err){ alert("Chyba."); }
  };
  reader.readAsText(file);
}

editDimsBtn.onclick = () => {
  editMode = !editMode; 
  dimsPanel.style.display = editMode ? 'block' : 'none';
  if(editMode) editDimsBtn.classList.replace('ghost', 'active');
  else editDimsBtn.classList.replace('active', 'ghost');
  if(editMode) updateDimensionsPanel();
};
function closeDimensionsPanel(){ editMode = false; dimsPanel.style.display = 'none'; editDimsBtn.classList.replace('active', 'ghost'); }

// 📋 KOMPLETNÝ SPRÁVCA PARAMETROV, ROZMEROV A KÓT
function updateDimensionsPanel(){
  if(document.activeElement && document.activeElement.tagName === 'INPUT' && dimsPanel.contains(document.activeElement)) return;
  dimsContent.innerHTML = '';

  const metaCard = document.createElement('div');
  metaCard.className = 'shape-card';
  metaCard.innerHTML = `<strong style="color:var(--accent-green); font-size:0.8rem;">📝 Rohové razítko & Meta</strong>
    <div class="input-row"><label>Názov:</label><input type="text" id="metaTitle" style="width:200px" value="${blueprintMeta.title}"></div>
    <div class="input-row"><label>Materiál:</label><input type="text" id="metaMat" style="width:200px" value="${blueprintMeta.material}"></div>`;
  metaCard.querySelector('#metaTitle').onchange = (e) => { blueprintMeta.title = e.target.value; if(isDraftingMode) generateEngineeringBlueprint(); };
  metaCard.querySelector('#metaMat').onchange = (e) => { blueprintMeta.material = e.target.value; if(isDraftingMode) generateEngineeringBlueprint(); };
  dimsContent.appendChild(metaCard);

  // Zoznam pridaných kót s možnosťou vymazania
  if(manualDimensions.length > 0){
    const dimCard = document.createElement('div');
    dimCard.className = 'shape-card';
    dimCard.innerHTML = `<strong style="color:var(--accent-blue); font-size:0.8rem;">📏 Zoznam kót vo výkrese</strong>`;
    manualDimensions.forEach((dim, dIdx) => {
      const dRow = document.createElement('div');
      dRow.className = 'input-row';
      dRow.style.justifyContent = 'space-between';
      dRow.innerHTML = `<span style="font-size:0.8rem; color:white;">• ${dim.text}</span> <button class="danger" style="padding:2px 6px;" onclick="manualDimensions.splice(${dIdx},1);generateEngineeringBlueprint();saveToLocalStorage();updateDimensionsPanel();">🗑️</button>`;
      dimCard.appendChild(dRow);
    });
    dimsContent.appendChild(dimCard);
  }

  if(shapes.length === 0){
    const ed = document.createElement('div'); ed.textContent = 'Žiadne diely v zostave.'; ed.style.padding = '8px'; ed.style.color = 'var(--text-muted)';
    dimsContent.appendChild(ed);
    return;
  }

  shapes.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = `shape-card ${i === selectedShapeIndex ? 'active' : ''}`;
    card.innerHTML = `<div class="shape-title-row"><strong>#${i+1} ${s.type.toUpperCase()} (${s.op})</strong><button class="danger" style="padding:2px 5px;" onclick="shapes.splice(${i},1);rebuild3DScene();updateDimensionsPanel();">🗑️ Zmazať diel</button></div>`;
    
    // Súradnice X, Y, Z
    const posRow = document.createElement('div');
    posRow.className = 'input-row';
    posRow.innerHTML = `<div class="input-group-title">Pozícia (X, Y, Z):</div><label>X:</label><input type="number" step="0.5" value="${s.x}"><label>Y:</label><input type="number" step="0.5" value="${s.y}"><label>Z:</label><input type="number" step="0.5" value="${s.z}">`;
    const pInps = posRow.querySelectorAll('input');
    pInps[0].onchange = (e) => { s.x = parseFloat(e.target.value)||0; rebuild3DScene(); };
    pInps[1].onchange = (e) => { s.y = parseFloat(e.target.value)||0; rebuild3DScene(); };
    pInps[2].onchange = (e) => { s.z = parseFloat(e.target.value)||0; rebuild3DScene(); };
    card.appendChild(posRow);

    // Rotácia RX, RY, RZ
    const rotRow = document.createElement('div');
    rotRow.className = 'input-row';
    rotRow.innerHTML = `<div class="input-group-title">Rotácia (°):</div><label>RX:</label><input type="number" step="15" value="${s.rx||0}"><label>RY:</label><input type="number" step="15" value="${s.ry||0}"><label>RZ:</label><input type="number" step="15" value="${s.rz||0}">`;
    const rInps = rotRow.querySelectorAll('input');
    rInps[0].onchange = (e) => { s.rx = parseFloat(e.target.value)||0; rebuild3DScene(); };
    rInps[1].onchange = (e) => { s.ry = parseFloat(e.target.value)||0; rebuild3DScene(); };
    rInps[2].onchange = (e) => { s.rz = parseFloat(e.target.value)||0; rebuild3DScene(); };
    card.appendChild(rotRow);

    // Konkrétne rozmery pre daný tvar (Š, V, H, R, Fillet, Chamfer, Stena)
    const dimRow = document.createElement('div');
    dimRow.className = 'input-row';
    dimRow.innerHTML = `<div class="input-group-title">Rozmery & Modifikátory:</div>`;
    if(s.type === 'box' || s.type === 'wedge'){
      dimRow.innerHTML += `<label>Š:</label><input type="number" value="${s.w}"><label>V:</label><input type="number" value="${s.h}"><label>H:</label><input type="number" value="${s.d}">`;
      const dInps = dimRow.querySelectorAll('input');
      dInps[0].onchange = (e) => { s.w = parseFloat(e.target.value)||1; rebuild3DScene(); };
      dInps[1].onchange = (e) => { s.h = parseFloat(e.target.value)||1; rebuild3DScene(); };
      dInps[2].onchange = (e) => { s.d = parseFloat(e.target.value)||1; rebuild3DScene(); };
    } else if(s.type === 'filletBox'){
      dimRow.innerHTML += `<label>Š:</label><input type="number" value="${s.w}"><label>V:</label><input type="number" value="${s.h}"><label>H:</label><input type="number" value="${s.d}"><label>Zaoblenie:</label><input type="number" step="0.05" value="${s.fillet||0.2}">`;
      const dInps = dimRow.querySelectorAll('input');
      dInps[0].onchange = (e) => { s.w = parseFloat(e.target.value)||1; rebuild3DScene(); };
      dInps[1].onchange = (e) => { s.h = parseFloat(e.target.value)||1; rebuild3DScene(); };
      dInps[2].onchange = (e) => { s.d = parseFloat(e.target.value)||1; rebuild3DScene(); };
      dInps[3].onchange = (e) => { s.fillet = parseFloat(e.target.value)||0.2; rebuild3DScene(); };
    } else if(s.type === 'chamferBox'){
      dimRow.innerHTML += `<label>Š:</label><input type="number" value="${s.w}"><label>V:</label><input type="number" value="${s.h}"><label>H:</label><input type="number" value="${s.d}"><label>Skosenie:</label><input type="number" step="0.05" value="${s.chamfer||0.2}">`;
      const dInps = dimRow.querySelectorAll('input');
      dInps[0].onchange = (e) => { s.w = parseFloat(e.target.value)||1; rebuild3DScene(); };
      dInps[1].onchange = (e) => { s.h = parseFloat(e.target.value)||1; rebuild3DScene(); };
      dInps[2].onchange = (e) => { s.d = parseFloat(e.target.value)||1; rebuild3DScene(); };
      dInps[3].onchange = (e) => { s.chamfer = parseFloat(e.target.value)||0.2; rebuild3DScene(); };
    } else if(s.type === 'pipe'){
      dimRow.innerHTML += `<label>R:</label><input type="number" value="${s.r}"><label>Dĺžka:</label><input type="number" value="${s.h}"><label>Stena:</label><input type="number" step="0.1" value="${s.wall||0.3}">`;
      const dInps = dimRow.querySelectorAll('input');
      dInps[0].onchange = (e) => { s.r = parseFloat(e.target.value)||0.5; rebuild3DScene(); };
      dInps[1].onchange = (e) => { s.h = parseFloat(e.target.value)||1; rebuild3DScene(); };
      dInps[2].onchange = (e) => { s.wall = parseFloat(e.target.value)||0.1; rebuild3DScene(); };
    } else if(s.type === 'cylinder' || s.type === 'cone' || s.type === 'threadedRod' || s.type === 'elbow'){
      dimRow.innerHTML += `<label>R:</label><input type="number" value="${s.r}"><label>V:</label><input type="number" value="${s.h||2}">`;
      const dInps = dimRow.querySelectorAll('input');
      dInps[0].onchange = (e) => { s.r = parseFloat(e.target.value)||0.5; rebuild3DScene(); };
      dInps[1].onchange = (e) => { s.h = parseFloat(e.target.value)||1; rebuild3DScene(); };
    } else if(s.type === 'sphere'){
      dimRow.innerHTML += `<label>R:</label><input type="number" value="${s.r}">`;
      const dInps = dimRow.querySelectorAll('input');
      dInps[0].onchange = (e) => { s.r = parseFloat(e.target.value)||0.5; rebuild3DScene(); };
    }
    card.appendChild(dimRow);
    dimsContent.appendChild(card);
  });
}

commandInput.onkeydown = (e) => {
  if(e.key === 'Enter'){
    if(pendingDimension){
      confirmCurrentPendingDimension();
      return;
    }
    const val = commandInput.value.trim().toLowerCase();
    logCommand(val);
    commandInput.value = '';
    if(['box', 'filletbox', 'chamferbox', 'cylinder', 'pipe', 'elbow', 'sphere', 'wedge', 'torus', 'cone', 'threadedrod'].includes(val)){
      currentShapeType = val; document.getElementById('shapeSelector').value = val;
    } else if(val === 'add' || val === '+'){ currentCsgOp = 'add'; document.getElementById('csgOperationSelector').value = 'add'; }
    else if(val === 'sub' || val === '-'){ currentCsgOp = 'subtract'; document.getElementById('csgOperationSelector').value = 'subtract'; }
    else if(val === 'drafting') toggleDraftingMode();
    else if(val === 'clear') clearAll();
  }
};

function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
window.onload = init3D;
</script>
