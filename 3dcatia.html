<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>ErikAI Pro 3D CAD Studio (Z-Up Professional)</title>
<!-- Three.js, OrbitControls a Three-CSG -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three-csg-ts@3.1.16/lib/bundle.js"></script>

<style>
:root{
  --bg-color: #121216;
  --panel-bg: #1e222d;
  --border-color: #2e364f;
  --accent-green: #10b981;
  --accent-blue: #3b82f6;
  --accent-red: #ef4444;
  --accent-amber: #f59e0b;
  --accent-purple: #8b5cf6;
  --text-main: #ffffff;
  --text-muted: #94a3b8;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg-color);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  touch-action: none;
}
header{
  padding: 10px 15px;
  background: var(--panel-bg);
  border-bottom: 2px solid var(--border-color);
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  justify-content: space-between;
  z-index: 10;
}
.panel{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

#workspaceContainer {
  flex: 1;
  overflow: hidden;
  position: relative;
  background: #0b0d13;
}

#canvasContainer {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
}

button, label.file-btn, select.format-select{
  padding:7px 12px;
  border:none;
  border-radius:6px;
  background: var(--accent-green);
  color:#000;
  font-weight: bold;
  cursor:pointer;
  font-size: 0.85rem;
  transition: all 0.2s;
  box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
button:hover, label.file-btn:hover, select.format-select:hover{filter: brightness(1.1); transform: translateY(-1px);}
button.ghost{background: var(--panel-bg);border:1px solid var(--border-color);color:var(--text-main);}
button.active{background: var(--accent-blue); color:white;}
button.danger{background: var(--accent-red); color:white;}

select.format-select {
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  outline: none;
}

label.file-btn {
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  color: var(--text-main);
}
input[type="file"] { display: none; }

#commandLineContainer{
  background: #090b10;
  border-top: 1px solid var(--border-color);
  padding: 8px 15px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 0.85rem;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#commandHistory{
  height: 28px;
  overflow-y: auto;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#commandInputRow{display: flex; align-items: center; gap: 8px;}
#commandPrompt{color: var(--accent-green); font-weight: bold;}
#commandInput{
  flex: 1;
  background: transparent;
  border: none;
  color: white;
  font-family: inherit;
  font-size: 0.9rem;
  outline: none;
}

.info{padding:6px 15px;background: var(--panel-bg);font-size:0.8rem;color:var(--text-muted);border-top:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;}

#dimensionsPanel{
  position:fixed;
  top:70px;
  right:15px;
  background:var(--panel-bg);
  border:1px solid var(--border-color);
  padding:15px;
  border-radius:10px;
  max-height:82vh;
  overflow-y: auto;
  overflow-x: hidden;
  display:none;
  box-shadow: 0 15px 40px rgba(0,0,0,0.8);
  width: 480px;
  max-width: 95vw;
  z-index: 1000;
}
.panel-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  cursor: grab;
  user-select: none;
  background: rgba(255,255,255,0.04);
  padding: 6px 10px;
  border-radius: 6px;
}
.panel-header:active{ cursor: grabbing; }
#dimensionsPanel h3{margin:0;color:var(--accent-green);font-size:0.95rem;}
.close-btn{
  background: transparent; border: none; color: var(--text-muted); font-size: 1.1rem; font-weight: bold; cursor: pointer; padding: 0 4px; box-shadow: none;
}

.shape-card{
  background: #121216;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.shape-card.active{
  border-color: var(--accent-blue);
  background: #1a233a;
}
.shape-title-row{
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.input-group-title{ font-size: 0.75rem; color: var(--accent-blue); font-weight: bold; margin-top: 4px; }
.input-row{ display: flex; gap: 6px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
.input-row label{ font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; width: 22px; }
.input-row input, .input-row select{
  width: 70px;
  padding: 5px;
  border-radius: 4px;
  border: 1px solid var(--border-color);
  background: #090b10;
  color: white;
  font-size: 0.85rem;
}
</style>
</head>
<body>

<header>
  <div class="panel">
    <select id="shapeSelector" class="format-select" onchange="changeActiveShape()">
      <option value="box">🧊 Kváder (Blok)</option>
      <option value="filletBox">📐 Zaoblený kváder (Fillet)</option>
      <option value="chamferBox">✂️ Skosený kváder (Chamfer)</option>
      <option value="cylinder">🧪 Valec / Čap</option>
      <option value="threadedRod">🔩 Závitová tyč / Čap</option>
      <option value="pipe">⭕ Rúra (S dierou)</option>
      <option value="elbow">🔀 Koleno 90° (Potrubie)</option>
      <option value="sphere">🔮 Guľa</option>
      <option value="wedge">📐 Klin / Šikmá doska</option>
      <option value="torus">🍩 Tórus / O-Krúžok</option>
      <option value="cone">🔺 Kužeľ</option>
    </select>

    <select id="csgOperationSelector" class="format-select" onchange="changeCsgOperation()" style="border-color: var(--accent-blue);">
      <option value="add">➕ Pridať materiál</option>
      <option value="subtract">➖ Odobrať materiál (Dierovanie)</option>
    </select>

    <button id="selectBtn" class="ghost" onclick="setTool('select')">👆 Vybrať objekt</button>
    <button class="ghost" onclick="resetCamera()">🎥 Reset Kamery</button>
    <button class="ghost" onclick="toggleDimensionsPanel()" style="background:var(--accent-purple); color:white;">📋 Správca Dielov & Parametrov</button>
  </div>
  <div class="panel">
    <button class="ghost" onclick="exportJSON()" style="background:var(--accent-blue); color:white;">💾 Uložiť Projekt (JSON)</button>
    <label for="fileInput" class="file-btn">📂 Otvoriť JSON</label>
    <input type="file" id="fileInput" accept=".json" onchange="importJSON(event)">
    <button class="ghost" onclick="clearAll()" style="background:var(--accent-red); color:white;">🗑️ Zmazať všetko</button>
  </div>
</header>

<div id="workspaceContainer">
  <div id="canvasContainer"></div>
</div>

<div class="info" id="info">
  <span id="infoCoords">X: 0 mm, Y: 0 mm, Z: 0 mm | Kliknutím na plochu umiestnite 3D objekt</span>
  <span id="infoCount">Počet dielov v zostave: 0</span>
</div>

<div id="commandLineContainer">
  <div id="commandHistory"><div>ErikAI Pro 3D CAD Studio inicializované. Všetky rozmery v mm. Z-Up súradnicový systém.</div></div>
  <div id="commandInputRow">
    <span id="commandPrompt">&gt;</span>
    <input type="text" id="commandInput" placeholder="Príkaz (box, pipe, elbow, clear)..." autocomplete="off">
  </div>
</div>

<div id="dimensionsPanel">
  <div class="panel-header" id="panelHeader">
    <h3>📋 Správca 3D Dielov & Parametrov (mm / °)</h3>
    <button class="close-btn" onclick="toggleDimensionsPanel()">✕</button>
  </div>
  <div id="dimsContent">Žiadne diely v zostave</div>
</div>

<script>
THREE.Object3D.DefaultUp.set(0, 0, 1);

let scene, camera, renderer, controls;
let raycaster, mouse, floorPlane;
let shapes = [], meshesMap = new Map();
let selectedShapeIndex = null;
let currentShapeType = 'box', currentCsgOp = 'add', tool = 'create', editMode = false;

const container = document.getElementById('canvasContainer');
const infoCoords = document.getElementById('infoCoords');
const infoCount = document.getElementById('infoCount');
const dimsPanel = document.getElementById('dimensionsPanel');
const panelHeader = document.getElementById('panelHeader');
const dimsContent = document.getElementById('dimsContent');
const commandHistory = document.getElementById('commandHistory');
const commandInput = document.getElementById('commandInput');

let isDraggingPanel = false, panelDragOffset = {x: 0, y: 0};
function startPanelDrag(clientX, clientY){
  isDraggingPanel = true;
  const rect = dimsPanel.getBoundingClientRect();
  panelDragOffset.x = clientX - rect.left; panelDragOffset.y = clientY - rect.top;
}
function movePanelDrag(clientX, clientY){
  if(!isDraggingPanel) return;
  dimsPanel.style.left = (clientX - panelDragOffset.x) + 'px';
  dimsPanel.style.top = (clientY - panelDragOffset.y) + 'px';
  dimsPanel.style.right = 'auto';
}
panelHeader.onmousedown = (e) => { if(e.target.tagName !== 'BUTTON'){ startPanelDrag(e.clientX, e.clientY); e.preventDefault(); } };
window.onmousemove = (e) => movePanelDrag(e.clientX, e.clientY);
window.onmouseup = () => { isDraggingPanel = false; };

function logCommand(text){
  const div = document.createElement('div');
  div.textContent = `> ${text}`;
  commandHistory.appendChild(div);
  commandHistory.scrollTop = commandHistory.scrollHeight;
}

function init3D() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0d13);

  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(160, -200, 140);
  camera.up.set(0, 0, 1);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(150, 200, 250);
  scene.add(dirLight);

  const gridHelper = new THREE.GridHelper(300, 30, 0x10b981, 0x2e364f);
  gridHelper.rotateX(Math.PI / 2);
  scene.add(gridHelper);

  const planeGeo = new THREE.PlaneGeometry(1000, 1000);
  floorPlane = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ visible: false }));
  scene.add(floorPlane);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  container.addEventListener('pointerdown', onPointerDown);
  container.addEventListener('pointermove', onPointerMove);

  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });

  loadFromLocalStorage();
  animate();
}

function changeActiveShape(){
  currentShapeType = document.getElementById('shapeSelector').value;
  tool = 'create';
  document.getElementById('selectBtn').classList.replace('active', 'ghost');
  logCommand(`Aktívny tvar: ${currentShapeType.toUpperCase()}`);
}

function changeCsgOperation(){
  currentCsgOp = document.getElementById('csgOperationSelector').value;
  logCommand(`CSG Režim: ${currentCsgOp === 'add' ? 'Pridať materiál' : 'Odobrať materiál'}`);
}

function setTool(t){
  tool = t;
  if(t === 'select') document.getElementById('selectBtn').classList.replace('ghost', 'active');
  else document.getElementById('selectBtn').classList.replace('active', 'ghost');
  logCommand(`Nástroj: ${t.toUpperCase()}`);
}

function clearAll(){
  shapes = []; selectedShapeIndex = null;
  rebuild3DScene(); saveToLocalStorage();
  logCommand("Všetko zmazané.");
}

function saveToLocalStorage(){
  localStorage.setItem('erikai_3d_cad_state', JSON.stringify(shapes));
  infoCount.textContent = `Počet dielov v zostave: ${shapes.length}`;
}

function loadFromLocalStorage(){
  const saved = localStorage.getItem('erikai_3d_cad_state');
  if(saved){
    try { shapes = JSON.parse(saved) || []; rebuild3DScene(); } catch(e){}
  }
}

// 3D Geometria (Z-Up, od Z = 0 nahor)
function createGeometryForShape(s){
  let geo;
  const scW = (s.w || 100) / 10;
  const scH = (s.h || 100) / 10;
  const scD = (s.d || 100) / 10;
  const scR = (s.r || 50) / 10;
  const scWall = (s.wall || 10) / 10;
  const scFillet = (s.fillet || 10) / 10;
  const scChamfer = (s.chamfer || 10) / 10;
  const scTube = (s.tube || 15) / 10;

  if(s.type === 'box') {
    geo = new THREE.BoxGeometry(scW, scH, scD);
    geo.translate(0, 0, scD / 2);
  } else if(s.type === 'filletBox') {
    const filletR = Math.min(scFillet, scW/2 - 0.5, scH/2 - 0.5);
    const shape = new THREE.Shape();
    const w2 = scW/2, h2 = scH/2;
    shape.moveTo(-w2 + filletR, -h2);
    shape.lineTo(w2 - filletR, -h2);
    shape.quadraticCurveTo(w2, -h2, w2, -h2 + filletR);
    shape.lineTo(w2, h2 - filletR);
    shape.quadraticCurveTo(w2, h2, w2 - filletR, h2);
    shape.lineTo(-w2 + filletR, h2);
    shape.quadraticCurveTo(-w2, h2, -w2, h2 - filletR);
    shape.lineTo(-w2, -h2 + filletR);
    shape.quadraticCurveTo(-w2, -h2, -w2 + filletR, -h2);
    geo = new THREE.ExtrudeGeometry(shape, { depth: scD, bevelEnabled: true, bevelSegments: 4, steps: 1, bevelSize: filletR*0.5, bevelThickness: filletR*0.5 });
    geo.center();
    geo.translate(0, 0, scD / 2);
  } else if(s.type === 'chamferBox') {
    const chamf = Math.min(scChamfer, scW/2 - 0.5, scH/2 - 0.5);
    const shape = new THREE.Shape();
    const w2 = scW/2, h2 = scH/2;
    shape.moveTo(-w2 + chamf, -h2);
    shape.lineTo(w2 - chamf, -h2);
    shape.lineTo(w2, -h2 + chamf);
    shape.lineTo(w2, h2 - chamf);
    shape.lineTo(w2 - chamf, h2);
    shape.lineTo(-w2 + chamf, h2);
    shape.lineTo(-w2, h2 - chamf);
    shape.lineTo(-w2, -h2 + chamf);
    geo = new THREE.ExtrudeGeometry(shape, { depth: scD, bevelEnabled: false });
    geo.center();
    geo.translate(0, 0, scD / 2);
  } else if(s.type === 'cylinder' || s.type === 'threadedRod') {
    geo = new THREE.CylinderGeometry(scR, scR, scD, 32);
    geo.rotateX(Math.PI / 2);
    geo.translate(0, 0, scD / 2);
  } else if(s.type === 'sphere') {
    geo = new THREE.SphereGeometry(scR, 32, 32);
    geo.translate(0, 0, scR);
  } else if(s.type === 'cone') {
    geo = new THREE.CylinderGeometry(0, scR, scD, 32);
    geo.rotateX(Math.PI / 2);
    geo.translate(0, 0, scD / 2);
  } else if(s.type === 'torus') {
    geo = new THREE.TorusGeometry(scR, scTube, 16, 100);
    geo.translate(0, 0, scTube);
  } else if(s.type === 'pipe') {
    const shape = new THREE.Shape();
    shape.absarc(0, 0, scR, 0, Math.PI * 2, false);
    const innerR = Math.max(0.5, scR - scWall);
    const holePath = new THREE.Path();
    holePath.absarc(0, 0, innerR, 0, Math.PI * 2, true);
    shape.holes.push(holePath);
    geo = new THREE.ExtrudeGeometry(shape, { depth: scD, bevelEnabled: false, curveSegments: 32 });
    geo.center();
    geo.translate(0, 0, scD / 2);
  } else if(s.type === 'elbow') {
    const rBend = scR * 2.0;
    const curve = new THREE.CubicBezierCurve3(
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(rBend, 0, 0),
      new THREE.Vector3(rBend, 0, rBend),
      new THREE.Vector3(rBend, 0, rBend + scR)
    );
    geo = new THREE.TubeGeometry(curve, 36, scR, 24, false);
  } else if(s.type === 'wedge') {
    geo = new THREE.BufferGeometry();
    const w = scW/2, h = scH/2, d = scD;
    const vertices = new Float32Array([-w,-h,0, w,-h,0, w,h,0, -w,h,0, -w,-h,d, w,-h,d]);
    const indices = [0,1,2, 0,2,3, 0,4,5, 0,5,1, 1,5,2, 3,2,4, 2,5,4];
    geo.setIndex(indices);
    geo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    geo.computeVertexNormals();
  } else {
    geo = new THREE.BoxGeometry(10, 10, 10);
    geo.translate(0, 0, 5);
  }
  return geo;
}

function rebuild3DScene(){
  meshesMap.forEach(mesh => scene.remove(mesh));
  meshesMap.clear();

  let baseMesh = null;
  let subtractiveShapes = [];

  shapes.forEach((s, idx) => {
    if(s.z < 0) s.z = 0;
    const geo = createGeometryForShape(s);
    const mat = new THREE.MeshStandardMaterial({ 
      color: s.color || (s.op === 'subtract' ? '#ef4444' : '#10b981'), 
      roughness: 0.3, 
      metalness: 0.1 
    });
    const mesh = new THREE.Mesh(geo, mat);
    
    mesh.position.set((s.x||0)/10, (s.y||0)/10, (s.z||0)/10);
    mesh.rotation.set((s.rx || 0) * Math.PI / 180, (s.ry || 0) * Math.PI / 180, (s.rz || 0) * Math.PI / 180, 'XYZ');
    mesh.updateMatrix();

    if(s.op === 'subtract') {
      subtractiveShapes.push({ mesh, index: idx, s });
    } else {
      if(!baseMesh){
        baseMesh = mesh;
        scene.add(baseMesh);
        meshesMap.set(idx, baseMesh);
      } else {
        scene.add(mesh);
        meshesMap.set(idx, mesh);
      }
    }
  });

  if(baseMesh && subtractiveShapes.length > 0 && typeof CSG !== 'undefined'){
    try {
      let csgBase = CSG.fromMesh(baseMesh);
      subtractiveShapes.forEach(sub => {
        const csgSub = CSG.fromMesh(sub.mesh);
        csgBase = csgBase.subtract(csgSub);
      });
      scene.remove(baseMesh);
      const resultingMesh = CSG.toMesh(csgBase, baseMesh.matrix);
      resultingMesh.material = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3, metalness: 0.2 });
      scene.add(resultingMesh);
      meshesMap.set(0, resultingMesh);
    } catch(err){}
  }

  subtractiveShapes.forEach(sub => {
    sub.mesh.material = new THREE.MeshStandardMaterial({ color: 0xef4444, transparent: true, opacity: 0.5 });
    scene.add(sub.mesh);
    meshesMap.set(sub.index, sub.mesh);
  });

  infoCount.textContent = `Počet dielov v zostave: ${shapes.length}`;
  if(editMode) updateDimensionsPanel();
}

function onPointerDown(e){
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  if(tool === 'select'){
    const intersects = raycaster.intersectObjects(Array.from(meshesMap.values()));
    if(intersects.length > 0){
      selectedShapeIndex = 0; 
      logCommand("Objekt vybratý.");
    }
    return;
  }

  const intersects = raycaster.intersectObject(floorPlane);
  if(intersects.length > 0){
    const p = intersects[0].point;
    let shape = {
      type: currentShapeType, op: currentCsgOp,
      x: Math.round(p.x * 20), y: Math.round(p.y * 20), z: 0,
      rx: 0, ry: 0, rz: 0,
      w: 100, h: 100, d: 100, r: 50, wall: 10, fillet: 10, chamfer: 10, tube: 15,
      color: currentCsgOp === 'subtract' ? '#ef4444' : '#10b981'
    };
    shapes.push(shape);
    selectedShapeIndex = shapes.length - 1;
    rebuild3DScene();
    saveToLocalStorage();
    logCommand(`Pridaný 3D diel: ${shape.type.toUpperCase()} na Z = 0 mm`);
  }
}

function onPointerMove(e){
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(floorPlane);
  if(intersects.length > 0){
    const p = intersects[0].point;
    infoCoords.textContent = `X: ${(p.x*10).toFixed(0)} mm, Y: ${(p.y*10).toFixed(0)} mm | Z = 0 mm`;
  }
}

function toggleDimensionsPanel(){
  editMode = !editMode;
  dimsPanel.style.display = editMode ? 'block' : 'none';
  if(editMode) updateDimensionsPanel();
}

function updateDimensionsPanel(){
  if(document.activeElement && document.activeElement.tagName === 'INPUT' && dimsPanel.contains(document.activeElement)) return;
  dimsContent.innerHTML = '';
  if(shapes.length === 0){
    dimsContent.innerHTML = '<div style="padding:10px; color:var(--text-muted);">Žiadne diely v zostave. Kliknite do plochy pre pridanie.</div>';
    return;
  }
  shapes.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = `shape-card ${i === selectedShapeIndex ? 'active' : ''}`;
    
    let dimHtml = '';
    if(s.type === 'box' || s.type === 'wedge' || s.type === 'filletBox' || s.type === 'chamferBox'){
      dimHtml = `<label>Š:</label><input type="number" value="${s.w||100}" onchange="shapes[${i}].w=parseFloat(this.value);rebuild3DScene();">
                 <label>H:</label><input type="number" value="${s.h||100}" onchange="shapes[${i}].h=parseFloat(this.value);rebuild3DScene();">
                 <label>V:</label><input type="number" value="${s.d||100}" onchange="shapes[${i}].d=parseFloat(this.value);rebuild3DScene();">`;
      if(s.type === 'filletBox') dimHtml += `<label>R:</label><input type="number" value="${s.fillet||10}" onchange="shapes[${i}].fillet=parseFloat(this.value);rebuild3DScene();">`;
      if(s.type === 'chamferBox') dimHtml += `<label>C:</label><input type="number" value="${s.chamfer||10}" onchange="shapes[${i}].chamfer=parseFloat(this.value);rebuild3DScene();">`;
    } else if(s.type === 'cylinder' || s.type === 'cone' || s.type === 'threadedRod' || s.type === 'elbow'){
      dimHtml = `<label>R:</label><input type="number" value="${s.r||50}" onchange="shapes[${i}].r=parseFloat(this.value);rebuild3DScene();">
                 <label>V:</label><input type="number" value="${s.d||100}" onchange="shapes[${i}].d=parseFloat(this.value);rebuild3DScene();">`;
    } else if(s.type === 'pipe'){
      dimHtml = `<label>R:</label><input type="number" value="${s.r||50}" onchange="shapes[${i}].r=parseFloat(this.value);rebuild3DScene();">
                 <label>V:</label><input type="number" value="${s.d||100}" onchange="shapes[${i}].d=parseFloat(this.value);rebuild3DScene();">
                 <label>St:</label><input type="number" value="${s.wall||10}" onchange="shapes[${i}].wall=parseFloat(this.value);rebuild3DScene();">`;
    } else if(s.type === 'sphere'){
      dimHtml = `<label>R:</label><input type="number" value="${s.r||50}" onchange="shapes[${i}].r=parseFloat(this.value);rebuild3DScene();">`;
    } else if(s.type === 'torus'){
      dimHtml = `<label>R:</label><input type="number" value="${s.r||50}" onchange="shapes[${i}].r=parseFloat(this.value);rebuild3DScene();">
                 <label>r:</label><input type="number" value="${s.tube||15}" onchange="shapes[${i}].tube=parseFloat(this.value);rebuild3DScene();">`;
    }

    card.innerHTML = `
      <div class="shape-title-row">
        <strong>#${i+1} ${s.type.toUpperCase()} (${s.op})</strong>
        <button class="danger" style="padding:2px 6px;" onclick="shapes.splice(${i},1);rebuild3DScene();updateDimensionsPanel(); saveToLocalStorage();">🗑️ Zmazať</button>
      </div>
      <div class="input-group-title">Pozícia X, Y, Z (mm):</div>
      <div class="input-row">
        <label>X:</label><input type="number" value="${s.x||0}" onchange="shapes[${i}].x=parseFloat(this.value);rebuild3DScene(); saveToLocalStorage();">
        <label>Y:</label><input type="number" value="${s.y||0}" onchange="shapes[${i}].y=parseFloat(this.value);rebuild3DScene(); saveToLocalStorage();">
        <label>Z:</label><input type="number" value="${s.z||0}" onchange="shapes[${i}].z=Math.max(0,parseFloat(this.value));rebuild3DScene(); saveToLocalStorage();">
      </div>
      <div class="input-group-title">Rotácia (°):</div>
      <div class="input-row">
        <label>RX:</label><input type="number" value="${s.rx||0}" onchange="shapes[${i}].rx=parseFloat(this.value);rebuild3DScene(); saveToLocalStorage();">
        <label>RY:</label><input type="number" value="${s.ry||0}" onchange="shapes[${i}].ry=parseFloat(this.value);rebuild3DScene(); saveToLocalStorage();">
        <label>RZ:</label><input type="number" value="${s.rz||0}" onchange="shapes[${i}].rz=parseFloat(this.value);rebuild3DScene(); saveToLocalStorage();">
      </div>
      <div class="input-group-title">Rozmery (mm):</div>
      <div class="input-row">${dimHtml}</div>
    `;
    dimsContent.appendChild(card);
  });
}

function resetCamera(){ camera.position.set(160, -200, 140); controls.target.set(0, 0, 0); controls.update(); }

function exportJSON(){
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(shapes, null, 2));
  const link = document.createElement('a'); link.download = `erikai_3d_projekt_${Date.now()}.json`; link.href = dataStr; link.click();
  logCommand("3D projekt uložený.");
}

function importJSON(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      shapes = JSON.parse(e.target.result) || [];
      rebuild3DScene(); 
      saveToLocalStorage();
      logCommand("3D projekt načítaný.");
    } catch(err){ alert("Chyba pri čítaní súboru."); }
  };
  reader.readAsText(file);
}

commandInput.onkeydown = (e) => {
  if(e.key === 'Enter'){
    const val = commandInput.value.trim().toLowerCase();
    logCommand(val);
    commandInput.value = '';
    if(['box', 'filletbox', 'chamferbox', 'cylinder', 'pipe', 'elbow', 'sphere', 'wedge', 'torus', 'cone', 'threadedrod'].includes(val)){
      currentShapeType = val; document.getElementById('shapeSelector').value = val;
    } else if(val === 'clear') clearAll();
  }
};

function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
window.onload = init3D;
</script>
</body>
</html>
