<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>ErikAI Pro CAD & 2D Drafting Studio</title>
<!-- Three.js and OrbitControls -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<!-- Three-CSG Bundle -->
<script src="https://cdn.jsdelivr.net/npm/three-csg-ts@3.1.16/lib/bundle.js"></script>
<style>
:root{
  --bg-color: #121216;
  --panel-bg: #1e222d;
  --border-color: #2e364f;
  --accent-green: #10b981;
  --accent-blue: #3b82f6;
  --accent-red: #ef4444;
  --accent-amber: #f59e0b;
  --text-main: #ffffff;
  --text-muted: #94a3b8;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg-color);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  touch-action: none;
}
header{
  padding: 8px 12px;
  background: var(--panel-bg);
  border-bottom: 2px solid var(--border-color);
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  justify-content: space-between;
  z-index: 10;
}
.panel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

#workspaceContainer {
  flex: 1;
  overflow: hidden;
  position: relative;
  background: #0b0d13;
  display: flex;
}

#canvasContainer, #draftingContainer {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
}

#draftingContainer {
  background: #0f172a;
  color: #0f172a;
  display: none;
  overflow: hidden;
  position: relative;
  cursor: grab;
}
#draftingContainer:active { cursor: grabbing; }

canvas.blueprint-canvas {
  background: #ffffff;
  box-shadow: 0 15px 40px rgba(0,0,0,0.6);
  display: block;
  transform-origin: 0 0;
  position: absolute;
}

button, label.file-btn, select.format-select{
  padding:7px 12px;
  border:none;
  border-radius:6px;
  background: var(--accent-green);
  color:#000;
  font-weight: bold;
  cursor:pointer;
  font-size: 0.85rem;
  transition: all 0.2s;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
button:hover, label.file-btn:hover, select.format-select:hover{filter: brightness(1.1); transform: translateY(-1px);}
button.ghost{background: var(--panel-bg);border:1px solid var(--border-color);color:var(--text-main);}
button.active{background: var(--accent-blue); color:white;}
button.danger{background: var(--accent-red); color:white;}
button.warning{background: var(--accent-amber); color:black;}

select.format-select {
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  outline: none;
}

label.file-btn {
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  color: var(--text-main);
}
input[type="file"] { display: none; }

#commandLineContainer{
  background: #090b10;
  border-top: 1px solid var(--border-color);
  padding: 6px 12px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 0.85rem;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#commandHistory{
  height: 28px;
  overflow-y: auto;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#commandInputRow{display: flex; align-items: center; gap: 6px;}
#commandPrompt{color: var(--accent-green); font-weight: bold;}
#commandInput{
  flex: 1;
  background: transparent;
  border: none;
  color: white;
  font-family: inherit;
  font-size: 0.9rem;
  outline: none;
}

.info{padding:5px 12px;background: var(--panel-bg);font-size:0.8rem;color:var(--text-muted);border-top:1px solid var(--border-color);display:flex;justify-space-between;align-items:center;}

#dimensionsPanel{
  position:fixed;
  top:60px;
  right:15px;
  background:var(--panel-bg);
  border:1px solid var(--border-color);
  padding:12px;
  border-radius:10px;
  max-height:80vh;
  overflow-y: auto;
  overflow-x: hidden;
  display:none;
  box-shadow: 0 15px 40px rgba(0,0,0,0.8);
  width: 460px;
  max-width: 95vw;
  z-index: 1000;
}
.panel-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  cursor: grab;
  user-select: none;
  background: rgba(255,255,255,0.04);
  padding: 6px 10px;
  border-radius: 6px;
}
.panel-header:active{ cursor: grabbing; }
#dimensionsPanel h3{margin:0;color:var(--accent-green);font-size:0.9rem;}
.close-btn{
  background: transparent; border: none; color: var(--text-muted); font-size: 1.1rem; font-weight: bold; cursor: pointer; padding: 0 4px; box-shadow: none;
}

.shape-card{
  background: #121216;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 8px;
}
.shape-card.active{
  border-color: var(--accent-blue);
  background: #1a233a;
}
.shape-title-row{
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.shape-actions{ display: flex; gap: 4px; align-items: center; }
.input-group-title{ font-size: 0.72rem; color: var(--accent-blue); font-weight: bold; margin-top: 6px; }
.input-row{ display: flex; gap: 6px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
.input-row label{ font-size: 0.73rem; color: var(--text-muted); white-space: nowrap; }
.input-row input, .input-row select{
  width: 58px;
  padding: 4px;
  border-radius: 4px;
  border: 1px solid var(--border-color);
  background: #090b10;
  color: white;
  font-size: 0.8rem;
}
.input-row input[type="color"]{ width: 28px; height: 26px; padding: 0; border: none; cursor: pointer; }

/* Blueprint controls overlay */
#blueprintOverlayControls {
  position: absolute;
  top: 15px;
  left: 15px;
  z-index: 5;
  background: rgba(30, 34, 45, 0.9);
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
  display: flex;
  gap: 8px;
  align-items: center;
}
</style>
</head>
<body>

<header>
  <div class="panel">
    <select id="shapeSelector" class="format-select" onchange="changeActiveShape()">
      <option value="box">🧊 Kváder (Blok)</option>
      <option value="filletBox">📐 Zaoblený kváder (Fillet)</option>
      <option value="chamferBox">✂️ Skosený kváder (Chamfer)</option>
      <option value="cylinder">🧪 Valec / Čap</option>
      <option value="pipe">⭕ Rúra (S vnútorným dierovaním)</option>
      <option value="elbow">🔀 Zahnuté potrubie (Koleno 90°)</option>
      <option value="sphere">🔮 Guľa</option>
      <option value="wedge">📐 Klin / Šikmá doska</option>
      <option value="torus">🍩 Tórus / O-Krúžok</option>
      <option value="cone">🔺 Kužeľ</option>
    </select>

    <select id="csgOperationSelector" class="format-select" onchange="changeCsgOperation()" style="border-color: var(--accent-blue);">
      <option value="add">➕ Pridať materiál</option>
      <option value="subtract">➖ Odobrať materiál (Vyrezanie diery)</option>
    </select>

    <button id="modeToggleBtn" class="ghost" onclick="toggleDraftingMode()" style="background:var(--accent-amber); color:#000;">📐 Prepnúť na 2D Výkres</button>
    <button id="selectBtn" class="ghost" onclick="setTool('select')">👆 Vybrať</button>
    <button class="ghost" onclick="resetCamera()">🎥 Kamera</button>
    <button id="editDimsBtn" class="ghost">📋 Dielce & Parametre</button>
  </div>
  <div class="panel">
    <button class="ghost" onclick="exportBlueprintImage()" style="background:var(--accent-blue); color:white;">📷 Stiahnuť PNG</button>
    <button class="ghost" onclick="exportSVG()" style="background:#8b5cf6; color:white;">✂️ Export SVG (Laser/CNC)</button>
    <button class="ghost" onclick="printBlueprint()" style="background:var(--accent-green); color:#000;">🖨️ Tlačiť výkres</button>
    <button class="ghost" onclick="exportJSON()">💾 Uložiť JSON</button>
    <label for="fileInput" class="file-btn">📂 Otvoriť JSON</label>
    <input type="file" id="fileInput" accept=".json" onchange="importJSON(event)">
    <button class="ghost" onclick="clearAll()" style="background:var(--accent-red); color:white;">🗑️ Zmazať</button>
  </div>
</header>

<div id="workspaceContainer">
  <div id="canvasContainer"></div>
  <div id="draftingContainer">
    <div id="blueprintOverlayControls">
      <button class="ghost" onclick="resetBlueprintPanZoom()">🔍 Reset Pohľadu</button>
      <button id="addDimensionBtn" class="ghost" onclick="toggleManualDimensionMode()">📏 Pridať Kótu (Klikni 2 body)</button>
      <span style="font-size:0.8rem; color:var(--text-muted);">Posun: Ťahanie myšou | Zoom: Koliesko</span>
    </div>
    <canvas id="blueprintCanvas" class="blueprint-canvas" width="1600" height="1100"></canvas>
  </div>
</div>

<div class="info" id="info">
  <span id="infoCoords">X: 0.00, Y: 0.00, Z: 0.00 | Režim: 3D Studio</span>
  <span id="infoCount">Počet dielov: 0</span>
</div>

<div id="commandLineContainer">
  <div id="commandHistory"><div>ErikAI Pro CAD Engine pripravený. 3D & 2D Štúdio s podporou kótovania a vyrezávania.</div></div>
  <div id="commandInputRow">
    <span id="commandPrompt">&gt;</span>
    <input type="text" id="commandInput" placeholder="Zadajte príkaz (box, pipe, filletBox, add, sub, drafting, clear)..." autocomplete="off">
  </div>
</div>

<div id="dimensionsPanel">
  <div class="panel-header" id="panelHeader">
    <h3>Správca Parametrov, Geometrie & Rohového Razítka</h3>
    <button class="close-btn" onclick="closeDimensionsPanel()">✕</button>
  </div>
  <div id="dimsContent">Žiadne diely v zostave</div>
</div>

<script>
let scene, camera, renderer, controls;
let raycaster, mouse, floorPlane;
let shapes = [], undoStack = [], redoStack = [], meshesMap = new Map();
let selectedShapeIndex = null;
let currentShapeType = 'box', currentCsgOp = 'add', tool = 'create', editMode = false, isDraftingMode = false;

// 2D Drafting state variables
let bpScale = 1.0, bpPanX = 50, bpPanY = 50, isBpDragging = false, bpStartMouse = {x:0, y:0};
let manualDimensions = []; // Array of manual dimension lines [{x1, y1, x2, y2, text}]
let manualDimStep = 0, firstDimPoint = null;
let manualDimModeActive = false;

// Editable Drawing Title Block (Rohové Razítko)
let blueprintMeta = {
  title: "ZOSTAVA MECHANICKÉHO DIELU",
  material: "Oceľ 11 523 / S235JR",
  author: "ErikAI CAD Studio",
  scale: "1 : 1",
  docNo: "DWG-2026-001",
  date: "2026-11-08"
};

const container = document.getElementById('canvasContainer');
const draftingContainer = document.getElementById('draftingContainer');
const infoCoords = document.getElementById('infoCoords');
const infoCount = document.getElementById('infoCount');
const dimsPanel = document.getElementById('dimensionsPanel');
const panelHeader = document.getElementById('panelHeader');
const dimsContent = document.getElementById('dimsContent');
const editDimsBtn = document.getElementById('editDimsBtn');
const commandHistory = document.getElementById('commandHistory');
const commandInput = document.getElementById('commandInput');

let isDraggingPanel = false, panelDragOffset = {x: 0, y: 0};
function startPanelDrag(clientX, clientY){
  isDraggingPanel = true;
  const rect = dimsPanel.getBoundingClientRect();
  panelDragOffset.x = clientX - rect.left; panelDragOffset.y = clientY - rect.top;
}
function movePanelDrag(clientX, clientY){
  if(!isDraggingPanel) return;
  dimsPanel.style.left = (clientX - panelDragOffset.x) + 'px';
  dimsPanel.style.top = (clientY - panelDragOffset.y) + 'px';
  dimsPanel.style.right = 'auto';
}
panelHeader.onmousedown = (e) => { if(e.target.tagName !== 'BUTTON'){ startPanelDrag(e.clientX, e.clientY); e.preventDefault(); } };
window.onmousemove = (e) => movePanelDrag(e.clientX, e.clientY);
window.onmouseup = () => { isDraggingPanel = false; };

function logCommand(text){
  const div = document.createElement('div');
  div.textContent = `> ${text}`;
  commandHistory.appendChild(div);
  commandHistory.scrollTop = commandHistory.scrollHeight;
}

function init3D() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0d13);

  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(14, 16, 20);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(15, 25, 20);
  scene.add(dirLight);

  const gridHelper = new THREE.GridHelper(30, 30, 0x10b981, 0x2e364f);
  scene.add(gridHelper);

  const planeGeo = new THREE.PlaneGeometry(100, 100);
  planeGeo.rotateX(-Math.PI / 2);
  floorPlane = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ visible: false }));
  scene.add(floorPlane);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  container.addEventListener('pointerdown', onPointerDown);
  container.addEventListener('pointermove', onPointerMove);

  window.addEventListener('resize', () => {
    if(!isDraftingMode){
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }
  });

  setupBlueprintInteraction();
  loadFromLocalStorage();
  animate();
}

function changeActiveShape(){
  currentShapeType = document.getElementById('shapeSelector').value;
  tool = 'create';
  document.getElementById('selectBtn').classList.replace('active', 'ghost');
  logCommand(`Aktívny tvar nastavený na: ${currentShapeType.toUpperCase()}`);
}

function changeCsgOperation(){
  currentCsgOp = document.getElementById('csgOperationSelector').value;
  logCommand(`CSG Režim: ${currentCsgOp === 'add' ? 'Pridať materiál' : 'Odobrať materiál (Diera)'}`);
}

function setTool(t){
  tool = t;
  if(t === 'select') document.getElementById('selectBtn').classList.replace('ghost', 'active');
  else document.getElementById('selectBtn').classList.replace('active', 'ghost');
  logCommand(`Nástroj: ${t.toUpperCase()}`);
}

function pushState(){
  undoStack.push(JSON.parse(JSON.stringify(shapes)));
  redoStack = [];
  saveToLocalStorage();
}

function clearAll(){
  pushState(); 
  shapes = []; 
  manualDimensions = [];
  selectedShapeIndex = null;
  rebuild3DScene(); 
  saveToLocalStorage();
  logCommand("Všetky tvary a kóty vymazané.");
}

function saveToLocalStorage(){
  localStorage.setItem('erikai_cad_full_state', JSON.stringify({ shapes, blueprintMeta, manualDimensions }));
  infoCount.textContent = `Počet dielov: ${shapes.length}`;
}

function loadFromLocalStorage(){
  const saved = localStorage.getItem('erikai_cad_full_state');
  if(saved){
    try { 
      const data = JSON.parse(saved); 
      shapes = data.shapes || [];
      blueprintMeta = data.blueprintMeta || blueprintMeta;
      manualDimensions = data.manualDimensions || [];
      rebuild3DScene(); 
    } catch(e){}
  }
}

// Full 3D Geometries with Fillet, Chamfer, Pipe Wall, Rotation and CSG
function createGeometryForShape(s){
  let geo;
  if(s.type === 'box') {
    geo = new THREE.BoxGeometry(s.w, s.h, s.d);
  } else if(s.type === 'filletBox') {
    // Real Filleted Box using ExtrudeGeometry with Rounded Corners
    const filletR = Math.min(s.fillet || 0.2, s.w/2 - 0.05, s.d/2 - 0.05);
    const shape = new THREE.Shape();
    const w2 = s.w/2, d2 = s.d/2;
    shape.moveTo(-w2 + filletR, -d2);
    shape.lineTo(w2 - filletR, -d2);
    shape.quadraticCurveTo(w2, -d2, w2, -d2 + filletR);
    shape.lineTo(w2, d2 - filletR);
    shape.quadraticCurveTo(w2, d2, w2 - filletR, d2);
    shape.lineTo(-w2 + filletR, d2);
    shape.quadraticCurveTo(-w2, d2, -w2, d2 - filletR);
    shape.lineTo(-w2, -d2 + filletR);
    shape.quadraticCurveTo(-w2, -d2, -w2 + filletR, -d2);
    geo = new THREE.ExtrudeGeometry(shape, { depth: s.h, bevelEnabled: true, bevelSegments: 4, steps: 1, bevelSize: filletR*0.5, bevelThickness: filletR*0.5 });
    geo.center();
  } else if(s.type === 'chamferBox') {
    // Real Chamfered Box
    const chamf = Math.min(s.chamfer || 0.2, s.w/2 - 0.05, s.d/2 - 0.05);
    const shape = new THREE.Shape();
    const w2 = s.w/2, d2 = s.d/2;
    shape.moveTo(-w2 + chamf, -d2);
    shape.lineTo(w2 - chamf, -d2);
    shape.lineTo(w2, -d2 + chamf);
    shape.lineTo(w2, d2 - chamf);
    shape.lineTo(w2 - chamf, d2);
    shape.lineTo(-w2 + chamf, d2);
    shape.lineTo(-w2, d2 - chamf);
    shape.lineTo(-w2, -d2 + chamf);
    geo = new THREE.ExtrudeGeometry(shape, { depth: s.h, bevelEnabled: false });
    geo.center();
  } else if(s.type === 'cylinder') {
    geo = new THREE.CylinderGeometry(s.r, s.r, s.h, 32);
  } else if(s.type === 'sphere') {
    geo = new THREE.SphereGeometry(s.r, 32, 32);
  } else if(s.type === 'cone') {
    geo = new THREE.CylinderGeometry(0, s.r, s.h, 32);
  } else if(s.type === 'torus') {
    geo = new THREE.TorusGeometry(s.r, s.tube || 0.3, 16, 100);
  } else if(s.type === 'pipe') {
    // Pipe with outer radius 'r', wall thickness 'wall' and inner radius
    const shape = new THREE.Shape();
    shape.absarc(0, 0, s.r, 0, Math.PI * 2, false);
    const innerR = Math.max(0.05, s.r - (s.wall || 0.3));
    const holePath = new THREE.Path();
    holePath.absarc(0, 0, innerR, 0, Math.PI * 2, true);
    shape.holes.push(holePath);
    geo = new THREE.ExtrudeGeometry(shape, { depth: s.h, bevelEnabled: false, curveSegments: 32 });
    geo.rotateX(Math.PI / 2);
    geo.center();
  } else if(s.type === 'elbow') {
    const curve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, s.r * 2.5, 0),
      new THREE.Vector3(s.r * 2.5, s.r * 2.5, 0)
    );
    geo = new THREE.TubeGeometry(curve, 32, s.r, 24, false);
  } else if(s.type === 'wedge') {
    geo = new THREE.BufferGeometry();
    const w = s.w/2, h = s.h/2, d = s.d/2;
    const vertices = new Float32Array([-w,-h,-d, w,-h,-d, w,-h, d, -w,-h, d, -w, h,-d, w, h,-d]);
    const indices = [0,2,1, 0,3,2, 0,1,5, 0,5,4, 1,2,5, 2,3,4, 2,4,5, 3,0,4];
    geo.setIndex(indices);
    geo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    geo.computeVertexNormals();
  } else {
    geo = new THREE.BoxGeometry(1, 1, 1);
  }
  return geo;
}

function rebuild3DScene(){
  meshesMap.forEach(mesh => scene.remove(mesh));
  meshesMap.clear();

  let baseMesh = null;
  let subtractiveShapes = [];

  shapes.forEach((s, idx) => {
    const geo = createGeometryForShape(s);
    const mat = new THREE.MeshStandardMaterial({ 
      color: s.color || 0x10b981, 
      roughness: 0.3, 
      metalness: 0.1 
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(s.x, s.y, s.z);
    mesh.rotation.set(
      (s.rx || 0) * Math.PI / 180,
      (s.ry || 0) * Math.PI / 180,
      (s.rz || 0) * Math.PI / 180
    );
    mesh.updateMatrix();

    if(s.op === 'subtract') {
      subtractiveShapes.push({ mesh, index: idx, s });
    } else {
      if(!baseMesh){
        baseMesh = mesh;
        scene.add(baseMesh);
        meshesMap.set(idx, baseMesh);
      } else {
        scene.add(mesh);
        meshesMap.set(idx, mesh);
      }
    }
  });

  // True CSG subtraction boolean processing
  if(baseMesh && subtractiveShapes.length > 0 && typeof CSG !== 'undefined'){
    try {
      let csgBase = CSG.fromMesh(baseMesh);
      subtractiveShapes.forEach(sub => {
        const csgSub = CSG.fromMesh(sub.mesh);
        csgBase = csgBase.subtract(csgSub);
      });
      scene.remove(baseMesh);
      const resultingMesh = CSG.toMesh(csgBase, baseMesh.matrix);
      resultingMesh.material = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3, metalness: 0.2 });
      scene.add(resultingMesh);
      meshesMap.set(0, resultingMesh);
    } catch(err){
      console.log("CSG processing fallback to wireframe highlight:", err);
    }
  }

  subtractiveShapes.forEach(sub => {
    sub.mesh.material = new THREE.MeshStandardMaterial({ color: 0xef4444, transparent: true, opacity: 0.45, wireframe: true });
    scene.add(sub.mesh);
    meshesMap.set(sub.index, sub.mesh);
  });

  if(editMode) updateDimensionsPanel();
  if(isDraftingMode) generateEngineeringBlueprint();
}

function onPointerDown(e){
  if(isDraftingMode) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  if(tool === 'select'){
    const intersects = raycaster.intersectObjects(Array.from(meshesMap.values()));
    if(intersects.length > 0){ 
      selectedShapeIndex = 0; 
      rebuild3DScene(); 
      logCommand(`Vybraný 3D diel #${selectedShapeIndex + 1}`);
    } else { 
      selectedShapeIndex = null; 
      rebuild3DScene(); 
    }
    return;
  }

  const intersects = raycaster.intersectObject(floorPlane);
  if(intersects.length > 0){
    const p = intersects[0].point;
    const snapX = Math.round(p.x * 2) / 2;
    const snapZ = Math.round(p.z * 2) / 2;

    pushState();
    let shape = {
      type: currentShapeType, op: currentCsgOp,
      x: snapX, y: currentCsgOp === 'subtract' ? 0.5 : 1, z: snapZ,
      rx: 0, ry: 0, rz: 0,
      w: 2, h: 2, d: 2, r: 1, wall: 0.3, fillet: 0.2, chamfer: 0.2, tube: 0.3,
      color: currentCsgOp === 'subtract' ? '#ef4444' : '#10b981'
    };
    shapes.push(shape);
    selectedShapeIndex = shapes.length - 1;
    rebuild3DScene();
    saveToLocalStorage();
    logCommand(`Pridaný nový 3D diel: ${shape.type.toUpperCase()} na [${snapX}, ${snapZ}]`);
  }
}

function onPointerMove(e){
  if(isDraftingMode) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(floorPlane);
  if(intersects.length > 0){
    const p = intersects[0].point;
    infoCoords.textContent = `X: ${p.x.toFixed(2)}, Y: 0.00, Z: ${p.z.toFixed(2)} | Tvar: ${currentShapeType.toUpperCase()}`;
  }
}

function setupBlueprintInteraction(){
  const canvas = document.getElementById('blueprintCanvas');

  draftingContainer.addEventListener('mousedown', (e) => {
    if(e.target.closest('#blueprintOverlayControls')) return;
    if(manualDimModeActive) {
      handleManualDimClick(e);
      return;
    }
    isBpDragging = true;
    bpStartMouse = { x: e.clientX - bpPanX, y: e.clientY - bpPanY };
  });

  window.addEventListener('mousemove', (e) => {
    if(isBpDragging){
      bpPanX = e.clientX - bpStartMouse.x;
      bpPanY = e.clientY - bpStartMouse.y;
      applyCanvasTransform();
    }
  });

  window.addEventListener('mouseup', () => { isBpDragging = false; });

  draftingContainer.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
    bpScale = Math.max(0.3, Math.min(4.0, bpScale * zoomFactor));
    applyCanvasTransform();
  });
}

function applyCanvasTransform(){
  const canvas = document.getElementById('blueprintCanvas');
  canvas.style.transform = `translate(${bpPanX}px, ${bpPanY}px) scale(${bpScale})`;
}

function resetBlueprintPanZoom(){
  bpScale = 1.0; bpPanX = 50; bpPanY = 50;
  applyCanvasTransform();
}

function toggleManualDimensionMode(){
  manualDimModeActive = !manualDimModeActive;
  manualDimStep = 0;
  firstDimPoint = null;
  const btn = document.getElementById('addDimensionBtn');
  if(manualDimModeActive){
    btn.classList.replace('ghost', 'active');
    logCommand("Kótovací režim: Kliknite na prvý bod výkresu...");
  } else {
    btn.classList.replace('active', 'ghost');
    logCommand("Kótovací režim vypnutý.");
  }
}

function handleManualDimClick(e){
  const canvas = document.getElementById('blueprintCanvas');
  const rect = canvas.getBoundingClientRect();
  const clickX = (e.clientX - rect.left) / bpScale;
  const clickY = (e.clientY - rect.top) / bpScale;

  if(manualDimStep === 0){
    firstDimPoint = { x: clickX, y: clickY };
    manualDimStep = 1;
    logCommand("Prvý bod kóty zvolený. Kliknite na druhý bod...");
  } else if(manualDimStep === 1){
    const dx = clickX - firstDimPoint.x;
    const dy = clickY - firstDimPoint.y;
    const distanceMM = (Math.sqrt(dx*dx + dy*dy) * 2.5).toFixed(1); // Scale factor to mm
    manualDimensions.push({
      x1: firstDimPoint.x, y1: firstDimPoint.y,
      x2: clickX, y2: clickY,
      text: `${distanceMM} mm`
    });
    manualDimStep = 0;
    firstDimPoint = null;
    toggleManualDimensionMode();
    generateEngineeringBlueprint();
    saveToLocalStorage();
    logCommand(`Kóta úspešne pridaná: ${distanceMM} mm`);
  }
}

function generateEngineeringBlueprint(){
  const canvas = document.getElementById('blueprintCanvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Outer Drawing Border (A2 ISO Drawing Standard)
  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 3;
  ctx.strokeRect(25, 25, canvas.width - 50, canvas.height - 50);

  // View Division Grids
  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(25, 550); ctx.lineTo(canvas.width - 25, 550);
  ctx.moveTo(800, 25); ctx.lineTo(800, canvas.height - 25);
  ctx.stroke();

  // Orthographic Projections Titles
  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 14px Segoe UI, sans-serif';
  ctx.fillText("NÁRYS (FRONT VIEW - X/Y)", 45, 55);
  ctx.fillText("PÔDORYS (TOP VIEW - X/Z)", 45, 580);
  ctx.fillText("BOKORYS (SIDE VIEW - Y/Z)", 820, 55);
  ctx.fillText("IZOMETRICKÝ NÁHĽAD (3D AXONOMETRY)", 820, 580);

  // Render Objects into views
  shapes.forEach((s) => {
    renderOrthographicShape(ctx, s, 250, 300, 'front');
    renderOrthographicShape(ctx, s, 250, 800, 'top');
    renderOrthographicShape(ctx, s, 1050, 300, 'side');
  });

  // Render Manual User Dimensions (Kóty)
  manualDimensions.forEach(dim => drawCadDimensionLine(ctx, dim.x1, dim.y1, dim.x2, dim.y2, dim.text));

  // Render Editable Title Block (Rohové Razítko)
  renderTitleBlock(ctx, canvas.width - 450, canvas.height - 170);
}

function renderOrthographicShape(ctx, s, offsetX, offsetY, viewType){
  ctx.save();
  ctx.translate(offsetX + s.x * 25, offsetY + (viewType==='top'? s.z : -s.y) * 25);
  ctx.rotate((s.rz || 0) * Math.PI / 180);

  ctx.strokeStyle = s.op === 'subtract' ? '#dc2626' : '#0f172a';
  ctx.lineWidth = 2;
  if(s.op === 'subtract') ctx.setLineDash([5, 5]);

  const scale = 25; // 1 unit = 25px

  if(s.type === 'box' || s.type === 'filletBox' || s.type === 'chamferBox' || s.type === 'wedge'){
    let w = s.w * scale, h = s.h * scale;
    ctx.strokeRect(-w/2, -h/2, w, h);
    
    // Auto-Dimension Lines
    ctx.setLineDash([]);
    drawCadDimensionLine(ctx, -w/2, -h/2 - 15, w/2, -h/2 - 15, `${(s.w*100).toFixed(0)} mm`);
    drawCadDimensionLine(ctx, w/2 + 15, -h/2, w/2 + 15, h/2, `${(s.h*100).toFixed(0)} mm`);
  } else if(s.type === 'cylinder' || s.type === 'cone' || s.type === 'sphere'){
    let r = s.r * scale;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    drawCadDimensionLine(ctx, -r, -r - 15, r, -r - 15, `Ø ${(s.r*200).toFixed(0)} mm`);
  } else if(s.type === 'pipe'){
    let outerR = s.r * scale;
    let innerR = Math.max(0.1, s.r - (s.wall || 0.3)) * scale;
    
    // Outer Circle
    ctx.beginPath();
    ctx.arc(0, 0, outerR, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Hole Circle (Dashed)
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(0, 0, innerR, 0, Math.PI * 2);
    ctx.stroke();

    // Pipe Dimensions
    ctx.setLineDash([]);
    drawCadDimensionLine(ctx, -outerR, -outerR - 15, outerR, -outerR - 15, `Vonk. Ø ${(s.r*200).toFixed(0)} mm`);
    drawCadDimensionLine(ctx, -innerR, outerR + 15, innerR, outerR + 15, `Vnút. Ø ${((s.r - s.wall)*200).toFixed(0)} mm`);
  }
  ctx.restore();
}

// Standard CAD Dimension line with arrows and text
function drawCadDimensionLine(ctx, x1, y1, x2, y2, text){
  ctx.save();
  ctx.strokeStyle = '#2563eb';
  ctx.fillStyle = '#2563eb';
  ctx.lineWidth = 1.5;

  // Extension lines
  ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.stroke();

  // Arrowheads
  const angle = Math.atan2(y2 - y1, x2 - x1);
  const headLen = 7;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 + headLen * Math.cos(angle + Math.PI/6), y1 + headLen * Math.sin(angle + Math.PI/6));
  ctx.lineTo(x1 + headLen * Math.cos(angle - Math.PI/6), y1 + headLen * Math.sin(angle - Math.PI/6));
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI/6), y2 - headLen * Math.sin(angle + Math.PI/6));
  ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI/6), y2 - headLen * Math.sin(angle - Math.PI/6));
  ctx.fill();

  // Dimension Text
  const midX = (x1 + x2) / 2;
  const midY = (y1 + y2) / 2;
  ctx.font = 'bold 11px monospace';
  ctx.fillStyle = '#1e3a8a';
  ctx.fillText(text, midX - 20, midY - 5);
  ctx.restore();
}

function renderTitleBlock(ctx, x, y){
  ctx.save();
  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, 425, 145);

  ctx.beginPath();
  ctx.moveTo(x, y + 45); ctx.lineTo(x + 425, y + 45);
  ctx.moveTo(x, y + 95); ctx.lineTo(x + 425, y + 95);
  ctx.moveTo(x + 180, y + 45); ctx.lineTo(x + 180, y + 145);
  ctx.stroke();

  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 13px Segoe UI, sans-serif';
  ctx.fillText(blueprintMeta.title, x + 15, y + 28);

  ctx.font = '11px monospace';
  ctx.fillText(`Materiál: ${blueprintMeta.material}`, x + 15, y + 72);
  ctx.fillText(`Autor: ${blueprintMeta.author}`, x + 15, y + 122);
  ctx.fillText(`Číslo výkresu: ${blueprintMeta.docNo}`, x + 195, y + 72);
  ctx.fillText(`Mierka: ${blueprintMeta.scale} | Dátum: ${blueprintMeta.date}`, x + 195, y + 122);
  ctx.restore();
}

function exportSVG(){
  let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="25" y="25" width="1550" height="1050" fill="none" stroke="#000000" stroke-width="3"/>`;

  shapes.forEach(s => {
    const cx = 250 + s.x * 25, cy = 300 - s.y * 25;
    if(s.type==='box'||s.type==='pipe'){
      svgContent += `<rect x="${cx - s.w*12.5}" y="${cy - s.h*12.5}" width="${s.w*25}" height="${s.h*25}" fill="none" stroke="#000000" stroke-width="2"/>`;
    } else {
      svgContent += `<circle cx="${cx}" cy="${cy}" r="${s.r*25}" fill="none" stroke="#000000" stroke-width="2"/>`;
    }
  });

  svgContent += `</svg>`;
  const blob = new Blob([svgContent], {type: 'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.download = `erikai_cnc_cut_${Date.now()}.svg`;

function importJSON(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){ 
    try { 
      const data = JSON.parse(e.target.result); 
      shapes = data.shapes || [];
      blueprintMeta = data.blueprintMeta || blueprintMeta;
      manualDimensions = data.manualDimensions || [];
      rebuild3DScene(); 
      logCommand("Projekt úspešne načítaný zo súboru!");
    } catch(err){ alert("Chyba čítania JSON."); } 
  };
  reader.readAsText(file);
}

    <div class="input-row"><label>Názov:</label><input type="text" id="metaTitle" style="width:230px" value="${blueprintMeta.title}"></div>
    <div class="input-row"><label>Materiál:</label><input type="text" id="metaMat" style="width:230px" value="${blueprintMeta.material}"></div>
    <div class="input-row"><label>Autor:</label><input type="text" id="metaAuthor" style="width:230px" value="${blueprintMeta.author}"></div>`;

  metaCard.querySelector('#metaMat').onchange = (e) => { blueprintMeta.material = e.target.value; if(isDraftingMode) generateEngineeringBlueprint(); };

      <button class="danger" style="padding:2px 6px;" onclick="shapes.splice(${i},1);rebuild3DScene();updateDimensionsPanel();">🗑️</button>

    pInps[1].onchange = (e) => { pushState(); s.y = parseFloat(e.target.value)||0; rebuild3DScene(); };
    pInps[2].onchange = (e) => { pushState(); s.z = parseFloat(e.target.value)||0; rebuild3DScene(); };
    card.appendChild(posRow);

    // Rotation Controls RX, RY, RZ

                       `<label>RY:</label><input type="number" step="15" value="${s.ry||0}">` +

      const dInps = dimRow.querySelectorAll('input');
      dInps[0].onchange = (e) => { pushState(); s.r = parseFloat(e.target.value)||0.5; rebuild3DScene(); };
      dInps[1].onchange = (e) => { pushState(); s.tube = parseFloat(e.target.value)||0.1; rebuild3DScene(); };
    }

    card.appendChild(dimRow);
    dimsContent.appendChild(card);
  });
}

commandInput.onkeydown = (e) => {
  if(e.key === 'Enter'){
    const val = commandInput.value.trim().toLowerCase();
    logCommand(val);
    commandInput.value = '';
    
    if(['box', 'filletbox', 'chamferbox', 'cylinder', 'pipe', 'elbow', 'sphere', 'wedge', 'torus', 'cone'].includes(val)){
      currentShapeType = val;
      document.getElementById('shapeSelector').value = val;
      logCommand(`Tvar: ${val.toUpperCase()}`);
    } else if(val === 'add' || val === '+'){
      currentCsgOp = 'add';
      document.getElementById('csgOperationSelector').value = 'add';
      logCommand("Režim CSG: PRIDAŤ");
    } else if(val === 'sub' || val === 'subtract' || val === '-'){
      currentCsgOp = 'subtract';
      document.getElementById('csgOperationSelector').value = 'subtract';
      logCommand("Režim CSG: ODOBRAŤ (DIERA)");
    } else if(val === 'drafting' || val === '2d') toggleDraftingMode();
    else if(val === 'clear') clearAll();
    else logCommand("Neznámy príkaz.");
  }
};

function animate(){ 
  requestAnimationFrame(animate); 
  controls.update(); 
  renderer.render(scene, camera); 
}

window.onload = init3D;
</script>
</body>
</html>
