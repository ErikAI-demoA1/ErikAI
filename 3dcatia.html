<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>ErikAI Pro 2D-to-3D ISO Drafting Studio</title>
<!-- Three.js, OrbitControls a Three-CSG -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three-csg-ts@3.1.16/lib/bundle.js"></script>

<style>
:root{
  --bg-color: #121216;
  --panel-bg: #1e222d;
  --border-color: #2e364f;
  --accent-green: #10b981;
  --accent-blue: #3b82f6;
  --accent-red: #ef4444;
  --accent-amber: #f59e0b;
  --accent-purple: #8b5cf6;
  --text-main: #ffffff;
  --text-muted: #94a3b8;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg-color);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  touch-action: none;
}
header{
  padding: 8px 12px;
  background: var(--panel-bg);
  border-bottom: 2px solid var(--border-color);
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  justify-content: space-between;
  z-index: 10;
}
.panel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

#workspaceContainer {
  flex: 1;
  overflow: hidden;
  position: relative;
  background: #0b0d13;
  display: flex;
}

#sketchContainer, #model3DContainer {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
}

#model3DContainer {
  display: none;
  background: #0b0d13;
}

#sketchContainer {
  background: #0f172a;
  cursor: grab;
  position: relative;
  overflow: hidden;
}
#sketchContainer:active { cursor: grabbing; }

canvas.sketch-canvas {
  background: #ffffff;
  display: block;
  transform-origin: 0 0;
  position: absolute;
  box-shadow: 0 15px 40px rgba(0,0,0,0.6);
}

button, label.file-btn, select.format-select{
  padding:7px 12px;
  border:none;
  border-radius:6px;
  background: var(--accent-green);
  color:#000;
  font-weight: bold;
  cursor:pointer;
  font-size: 0.85rem;
  transition: all 0.2s;
  box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
button:hover, label.file-btn:hover, select.format-select:hover{filter: brightness(1.1); transform: translateY(-1px);}
button.ghost{background: var(--panel-bg);border:1px solid var(--border-color);color:var(--text-main);}
button.active{background: var(--accent-blue); color:white;}
button.danger{background: var(--accent-red); color:white;}

select.format-select {
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  outline: none;
}

#commandLineContainer{
  background: #090b10;
  border-top: 1px solid var(--border-color);
  padding: 6px 12px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 0.85rem;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#commandHistory{
  height: 28px;
  overflow-y: auto;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#commandInputRow{display: flex; align-items: center; gap: 6px;}
#commandPrompt{color: var(--accent-green); font-weight: bold;}
#commandInput{
  flex: 1;
  background: transparent;
  border: none;
  color: white;
  font-family: inherit;
  font-size: 0.9rem;
  outline: none;
}

.info{padding:5px 12px;background: var(--panel-bg);font-size:0.8rem;color:var(--text-muted);border-top:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;}

#dimensionsPanel{
  position:fixed;
  top:60px;
  right:15px;
  background:var(--panel-bg);
  border:1px solid var(--border-color);
  padding:12px;
  border-radius:10px;
  max-height:80vh;
  overflow-y: auto;
  overflow-x: hidden;
  display:none;
  box-shadow: 0 15px 40px rgba(0,0,0,0.8);
  width: 500px;
  max-width: 95vw;
  z-index: 1000;
}
.panel-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  cursor: grab;
  user-select: none;
  background: rgba(255,255,255,0.04);
  padding: 6px 10px;
  border-radius: 6px;
}
.panel-header:active{ cursor: grabbing; }
#dimensionsPanel h3{margin:0;color:var(--accent-green);font-size:0.9rem;}
.close-btn{
  background: transparent; border: none; color: var(--text-muted); font-size: 1.1rem; font-weight: bold; cursor: pointer; padding: 0 4px; box-shadow: none;
}

.shape-card{
  background: #121216;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.shape-card.active{
  border-color: var(--accent-blue);
  background: #1a233a;
}
.shape-title-row{
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.input-group-title{ font-size: 0.72rem; color: var(--accent-blue); font-weight: bold; margin-top: 2px; }
.input-row{ display: flex; gap: 6px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
.input-row label{ font-size: 0.73rem; color: var(--text-muted); white-space: nowrap; width: 24px; }
.input-row input, .input-row select{
  width: 60px;
  padding: 4px;
  border-radius: 4px;
  border: 1px solid var(--border-color);
  background: #090b10;
  color: white;
  font-size: 0.82rem;
}
</style>
</head>
<body>

<header>
  <div class="panel">
    <select id="shapeSelector" class="format-select" onchange="changeActiveShape()">
      <option value="box">🧊 Kváder (Blok)</option>
      <option value="filletBox">📐 Zaoblený kváder</option>
      <option value="chamferBox">✂️ Skosený kváder</option>
      <option value="cylinder">🧪 Valec / Čap</option>
      <option value="threadedRod">🔩 Závitová tyč</option>
      <option value="pipe">⭕ Rúra (S dierou)</option>
      <option value="elbow">🔀 Koleno 90°</option>
      <option value="sphere">🔮 Guľa</option>
      <option value="wedge">📐 Klin</option>
      <option value="torus">🍩 Tórus</option>
      <option value="cone">🔺 Kužeľ</option>
    </select>

    <select id="csgOperationSelector" class="format-select" onchange="changeCsgOperation()" style="border-color: var(--accent-blue);">
      <option value="add">➕ Pridať teleso</option>
      <option value="subtract">➖ Odobrať materiál</option>
    </select>

    <button id="toolModeBtn" class="ghost" onclick="toggleToolMode()" style="background:var(--accent-blue); color:white;">✋ Režim: Posun / Kóta</button>

    <select id="paperFormat" class="format-select" onchange="changePaperFormat()">
      <option value="A4">📄 A4 (1169 x 827)</option>
      <option value="A3" selected>📜 A3 (1654 x 1169)</option>
    </select>

    <button class="ghost" onclick="resetSketchPanZoom()">🔍 Reset Zoom</button>
    <button id="modeToggleBtn" class="ghost" onclick="toggleMode()" style="background:var(--accent-purple); color:white;">🚀 Generovať 3D</button>
    <button class="ghost" onclick="toggleDimensionsPanel()">📋 Správca Prvkov & Kót</button>
  </div>
  <div class="panel">
    <button class="ghost" onclick="clearAll()" style="background:#dc2626; color:white;">🗑️ Zmazať všetko</button>
  </div>
</header>

<div id="workspaceContainer">
  <div id="sketchContainer">
    <canvas id="sketchCanvas" class="sketch-canvas" width="1654" height="1169"></canvas>
  </div>
  <div id="model3DContainer"></div>
</div>

<div class="info" id="info">
  <span id="infoCoords">Režim: Pridávanie tvarov | Ťahanie prstom/myšou = posun plátna</span>
  <span id="infoCount">Počet dielov: 0</span>
</div>

<div id="commandLineContainer">
  <div id="commandHistory"><div>ErikAI Studio pripravené. Voľný pohyb a interaktívne kótovanie zapnuté.</div></div>
  <div id="commandInputRow">
    <span id="commandPrompt">&gt;</span>
    <input type="text" id="commandInput" placeholder="Príkaz (box, pipe, clear)..." autocomplete="off">
  </div>
</div>

<div id="dimensionsPanel">
  <div class="panel-header" id="panelHeader">
    <h3>Správca 2D Dielov, Kotvenia & Rotácií</h3>
    <button class="close-btn" onclick="toggleDimensionsPanel()">✕</button>
  </div>
  <div id="dimsContent">Žiadne diely v skici</div>
</div>

<script>
THREE.Object3D.DefaultUp.set(0, 0, 1);

let shapes = [];
let currentShapeType = 'box', currentCsgOp = 'add';
let selectedShapeIndex = null;
let editMode = false, is3DMode = false;
let interactionMode = 'create'; // 'create' alebo 'select'

// Voľný Pan & Zoom pre 2D výkres (podpora pre myš aj dotyk)
let bpScale = 1.0, bpPanX = 100, bpPanY = 100;
let isDragging = false, startMouse = {x:0, y:0};

let scene, camera, renderer, controls;

const canvas = document.getElementById('sketchCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('sketchContainer');
const container3D = document.getElementById('model3DContainer');
const infoCoords = document.getElementById('infoCoords');
const infoCount = document.getElementById('infoCount');
const dimsPanel = document.getElementById('dimensionsPanel');
const panelHeader = document.getElementById('panelHeader');
const dimsContent = document.getElementById('dimsContent');
const commandHistory = document.getElementById('commandHistory');
const commandInput = document.getElementById('commandInput');

let isDraggingPanel = false, panelDragOffset = {x: 0, y: 0};
function startPanelDrag(clientX, clientY){
  isDraggingPanel = true;
  const rect = dimsPanel.getBoundingClientRect();
  panelDragOffset.x = clientX - rect.left; panelDragOffset.y = clientY - rect.top;
}
function movePanelDrag(clientX, clientY){
  if(!isDraggingPanel) return;
  dimsPanel.style.left = (clientX - panelDragOffset.x) + 'px';
  dimsPanel.style.top = (clientY - panelDragOffset.y) + 'px';
}
panelHeader.onmousedown = (e) => { if(e.target.tagName !== 'BUTTON'){ startPanelDrag(e.clientX, e.clientY); e.preventDefault(); } };
window.onmousemove = (e) => movePanelDrag(e.clientX, e.clientY);
window.onmouseup = () => { isDraggingPanel = false; };

function logCommand(text){
  const div = document.createElement('div');
  div.textContent = `> ${text}`;
  commandHistory.appendChild(div);
  commandHistory.scrollTop = commandHistory.scrollHeight;
}

function changeActiveShape(){
  currentShapeType = document.getElementById('shapeSelector').value;
  logCommand(`Aktívny tvar: ${currentShapeType.toUpperCase()}`);
}

function changeCsgOperation(){
  currentCsgOp = document.getElementById('csgOperationSelector').value;
  logCommand(`Operácia: ${currentCsgOp === 'add' ? 'Pridať teleso' : 'Odobrať materiál'}`);
}

function toggleToolMode(){
  if(interactionMode === 'create'){
    interactionMode = 'select';
    document.getElementById('toolModeBtn').textContent = '🎯 Režim: Výber / Kótovanie';
    document.getElementById('toolModeBtn').style.background = '#10b981';
    infoCoords.textContent = "Režim: Výber a kliknutie na hrany / diely";
    logCommand("Prepnuté do režimu výberu a kótovania.");
  } else {
    interactionMode = 'create';
    document.getElementById('toolModeBtn').textContent = '✋ Režim: Posun / Kóta';
    document.getElementById('toolModeBtn').style.background = '#3b82f6';
    infoCoords.textContent = "Režim: Pridávanie tvarov | Ťahanie = posun plátna";
    logCommand("Prepnuté do režimu pridávania a posunu plátna.");
  }
}

function changePaperFormat(){
  const fmt = document.getElementById('paperFormat').value;
  if(fmt === 'A4'){ canvas.width = 1169; canvas.height = 827; }
  else { canvas.width = 1654; canvas.height = 1169; }
  resetSketchPanZoom();
  draw2DSketch();
  logCommand(`Formát výkresu zmenený na ${fmt}`);
}

// Univerzálne ovládanie plátna (Myš aj Dotyk pre voľný pohyb)
function setupSketchInteraction(){
  const startDrag = (clientX, clientY) => {
    isDragging = true;
    startMouse = { x: clientX - bpPanX, y: clientY - bpPanY };
  };

  const moveDrag = (clientX, clientY) => {
    if(!isDragging) return;
    bpPanX = clientX - startMouse.x;
    bpPanY = clientY - startMouse.y;
    applyCanvasTransform();
  };

  const endDrag = () => { isDragging = false; };

  container.addEventListener('mousedown', (e) => {
    if(e.target.closest('#dimensionsPanel') || e.target.closest('header')) return;
    if(interactionMode === 'create'){
      startDrag(e.clientX, e.clientY);
    }
  });

  window.addEventListener('mousemove', (e) => {
    if(isDragging) moveDrag(e.clientX, e.clientY);
  });

  window.addEventListener('mouseup', endDrag);

  // Podpora pre mobily (dotyky)
  container.addEventListener('touchstart', (e) => {
    if(e.target.closest('#dimensionsPanel') || e.target.closest('header')) return;
    if(e.touches.length === 1 && interactionMode === 'create'){
      startDrag(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, {passive: true});

  window.addEventListener('touchmove', (e) => {
    if(isDragging && e.touches.length === 1){
      moveDrag(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, {passive: true});

  window.addEventListener('touchend', endDrag);

  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
    bpScale = Math.max(0.2, Math.min(4.0, bpScale * zoomFactor));
    applyCanvasTransform();
  }, { passive: false });
}

function applyCanvasTransform(){
  canvas.style.transform = `translate(${bpPanX}px, ${bpPanY}px) scale(${bpScale})`;
}

function resetSketchPanZoom(){
  bpScale = 1.0; bpPanX = 100; bpPanY = 100;
  applyCanvasTransform();
}

function toggleMode(){
  is3DMode = !is3DMode;
  const btn = document.getElementById('modeToggleBtn');
  
  if(is3DMode){
    container.style.display = 'none';
    container3D.style.display = 'block';
    btn.textContent = '✏️ Upraviť 2D Výkres';
    btn.style.background = '#10b981';
    btn.style.color = '#000';
    infoCoords.textContent = "3D Z-Up Studio (Vygenerované zo 2D výkresu)";
    init3DFromSketch();
    logCommand("🚀 2D výkres prenesený a vyrenderovaný do 3D!");
  } else {
    container3D.style.display = 'none';
    container.style.display = 'block';
    btn.textContent = '🚀 Generovať 3D';
    btn.style.background = '#8b5cf6';
    btn.style.color = '#fff';
    infoCoords.textContent = "2D Výkres (Voľný pohyb aktívny)";
    logCommand("Návrat do 2D výkresu.");
  }
}

// ----------------------------------------------------
// 📐 2D VÝKRES SO 3 POHĽADMI A INTERAKTÍVNYM KÓTOVANÍM
// ----------------------------------------------------
function draw2DSketch(){
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 3;
  ctx.strokeRect(25, 25, canvas.width - 50, canvas.height - 50);

  const w = canvas.width, h = canvas.height;
  const views = [
    { name: 'front', title: 'NÁRYS (X-Z)', offsetX: w * 0.3, offsetY: h * 0.35 },
    { name: 'top', title: 'PÔDORYS (X-Y)', offsetX: w * 0.3, offsetY: h * 0.75 },
    { name: 'side', title: 'BOKORYS (Y-Z)', offsetX: w * 0.75, offsetY: h * 0.35 }
  ];

  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 12px Segoe UI, sans-serif';
  views.forEach(v => ctx.fillText(v.title, v.offsetX - 70, v.offsetY - 170));

  shapes.forEach((s, i) => {
    views.forEach(v => render2DProjection(ctx, s, v.offsetX, v.offsetY, v.name, i + 1, i === selectedShapeIndex));
  });

  renderTitleBlock(ctx, canvas.width - 480, canvas.height - 185);

  if(editMode) updateDimensionsPanel();
  infoCount.textContent = `Počet dielov: ${shapes.length}`;
}

function render2DProjection(ctx, s, offsetX, offsetY, viewType, index, isSelected){
  ctx.save();
  let isSub = s.op === 'subtract';
  ctx.strokeStyle = isSelected ? '#3b82f6' : (isSub ? '#dc2626' : '#0f172a');
  ctx.lineWidth = isSelected ? 3.5 : 2.0;

  ctx.translate(
    offsetX + (s.x || 0) * 0.5, 
    offsetY + (viewType === 'top' ? -(s.y || 0) * 0.5 : -(s.z || 0) * 0.5)
  );
  ctx.rotate((s.rz || 0) * Math.PI / 180);

  let w = (s.w || 100) * 0.6;
  let h = (s.h || 100) * 0.6;
  let d = (s.d || 100) * 0.6;
  let r = (s.r || 50) * 0.6;

  if(s.type === 'box' || s.type === 'filletBox' || s.type === 'chamferBox'){
    let dimY = viewType === 'top' ? h : d;
    ctx.strokeRect(-w/2, -dimY, w, dimY);
    if(isSub) drawHatching(ctx, -w/2, -dimY, w, dimY);
    
    // Zobrazenie kót na kliknutom prvku
    if(isSelected && viewType === 'front'){
      drawDimensionLine(ctx, -w/2, -dimY - 15, w/2, -dimY - 15, `W: ${s.w} mm`);
      drawDimensionLine(ctx, w/2 + 15, -dimY, w/2 + 15, 0, `V: ${s.d || s.h} mm`);
    }
  } else if(s.type === 'cylinder' || s.type === 'threadedRod' || s.type === 'cone' || s.type === 'pipe' || s.type === 'sphere'){
    if(viewType === 'top'){
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
      if(s.type === 'pipe'){
        let innerR = Math.max(2, r - (s.wall||10)*0.6);
        ctx.beginPath(); ctx.arc(0, 0, innerR, 0, Math.PI * 2); ctx.stroke();
      }
      if(isSelected) drawDimensionLine(ctx, 0, 0, r, 0, `R: ${s.r} mm`);
    } else {
      let topR = s.type === 'cone' ? 0 : r;
      ctx.beginPath();
      ctx.moveTo(-r, 0); ctx.lineTo(-topR, -d); ctx.lineTo(topR, -d); ctx.lineTo(r, 0); ctx.closePath();
      ctx.stroke();
      if(isSelected && viewType === 'front') {
        drawDimensionLine(ctx, r + 15, -d, r + 15, 0, `V: ${s.d} mm`);
      }
    }
    if(isSub) drawHatching(ctx, -r, -d, r*2, d);
  } else if(s.type === 'elbow'){
    let bendR = r * 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, bendR + r, Math.PI, Math.PI * 1.5, false);
    ctx.lineTo(bendR + r, 0);
    ctx.arc(0, 0, bendR - r, Math.PI * 1.5, Math.PI, true);
    ctx.closePath(); ctx.stroke();
    if(isSelected) drawDimensionLine(ctx, 0, -bendR-r-15, bendR, -bendR-r-15, `R_koleno: ${s.r} mm`);
  } else if(s.type === 'wedge'){
    ctx.beginPath(); ctx.moveTo(-w/2, 0); ctx.lineTo(w/2, 0); ctx.lineTo(w/2, -d); ctx.closePath(); ctx.stroke();
  } else if(s.type === 'torus'){
    ctx.beginPath(); ctx.ellipse(0, -r, r, r*0.4, 0, 0, Math.PI * 2); ctx.stroke();
  }

  if(viewType === 'front'){
    ctx.fillStyle = isSelected ? '#3b82f6' : '#0f172a';
    ctx.font = 'bold 10px monospace';
    ctx.fillText(`#${index} ${s.type.toUpperCase()}`, -w/2, -d - 6);
  }

  ctx.restore();
}

function drawDimensionLine(ctx, x1, y1, x2, y2, text){
  ctx.save();
  ctx.strokeStyle = '#3b82f6';
  ctx.fillStyle = '#3b82f6';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.font = '10px monospace';
  ctx.fillText(text, (x1+x2)/2 + 4, (y1+y2)/2 - 4);
  ctx.restore();
}

function drawHatching(ctx, x, y, w, h){
  ctx.save();
  ctx.strokeStyle = '#dc2626';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  for(let i = -h; i < w; i += 10){
    ctx.moveTo(x + i, y); ctx.lineTo(x + i + h, y + h);
  }
  ctx.stroke();
  ctx.restore();
}

function renderTitleBlock(ctx, x, y){
  ctx.save();
  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, 450, 150);
  ctx.beginPath();
  ctx.moveTo(x, y + 30); ctx.lineTo(x + 450, y + 30);
  ctx.moveTo(x, y + 65); ctx.lineTo(x + 450, y + 65);
  ctx.moveTo(x + 180, y + 30); ctx.lineTo(x + 180, y + 150);
  ctx.moveTo(x + 320, y + 65); ctx.lineTo(x + 320, y + 150);
  ctx.stroke();

  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 11px Segoe UI, sans-serif';
  ctx.fillText("ERIKAI PRO STROJÁRSKA ZOSTAVA", x + 10, y + 20);
  ctx.font = '10px monospace';
  ctx.fillText("Materiál: S235JR / Oceľ", x + 10, y + 48);
  ctx.fillText("Vypracoval: ErikAI CAD", x + 10, y + 90);
  ctx.fillText("Mierka: 1:1", x + 190, y + 90);
  ctx.fillText("Výkres: DWG-2026-001", x + 190, y + 130);
  ctx.restore();
}

canvas.onclick = (e) => {
  const rect = canvas.getBoundingClientRect();
  const clickX = (e.clientX - rect.left) / bpScale;
  const clickY = (e.clientY - rect.top) / bpScale;

  if(interactionMode === 'select'){
    // Detekcia kliknutia na tvar pre výber a kótovanie
    let found = null;
    shapes.forEach((s, i) => {
      let wx = 1654 * 0.3 + (s.x || 0) * 0.5;
      let wy = 1169 * 0.35 - (s.z || 0) * 0.5;
      if(Math.hypot(clickX - wx, clickY - wy) < 60){
        found = i;
      }
    });
    selectedShapeIndex = found;
    if(found !== null){
      logCommand(`Označený prvok #${found + 1} (${shapes[found].type.toUpperCase()}) — kótovanie aktívne.`);
    } else {
      logCommand("Žiadny prvok nebol zvolený.");
    }
    draw2DSketch();
  } else {
    // Režim pridávania nového tvaru
    let newShape = {
      type: currentShapeType, op: currentCsgOp,
      x: Math.round(clickX - canvas.width/4), 
      y: Math.round(canvas.height/2 - clickY), 
      z: 0,
      rx: 0, ry: 0, rz: 0,
      w: 100, h: 100, d: 100, r: 50, wall: 10, fillet: 10, chamfer: 10, tube: 15
    };
    shapes.push(newShape);
    selectedShapeIndex = shapes.length - 1;
    draw2DSketch();
    logCommand(`Pridaný diel: ${newShape.type.toUpperCase()}`);
  }
};

function clearAll(){
  shapes = []; selectedShapeIndex = null;
  draw2DSketch();
  logCommand("Všetko zmazané.");
}

// ----------------------------------------------------
// 🚀 3D GENERÁTOR (THREE.JS + CSG S ROTÁCIAMI A Z-VÝŠKOU)
// ----------------------------------------------------
function createGeometryForShape(s){
  let geo;
  const scW = (s.w || 100) / 10;
  const scH = (s.h || 100) / 10;
  const scD = (s.d || 100) / 10;
  const scR = (s.r || 50) / 10;
  const scWall = (s.wall || 10) / 10;
  const scFillet = (s.fillet || 10) / 10;
  const scChamfer = (s.chamfer || 10) / 10;
  const scTube = (s.tube || 15) / 10;

  if(s.type === 'box') {
    geo = new THREE.BoxGeometry(scW, scH, scD);
    geo.translate(0, 0, scD / 2);
  } else if(s.type === 'filletBox') {
    const filletR = Math.min(scFillet, scW/2 - 0.5, scH/2 - 0.5);
    const shape = new THREE.Shape();
    const w2 = scW/2, h2 = scH/2;
    shape.moveTo(-w2 + filletR, -h2);
    shape.lineTo(w2 - filletR, -h2);
    shape.quadraticCurveTo(w2, -h2, w2, -h2 + filletR);
    shape.lineTo(w2, h2 - filletR);
    shape.quadraticCurveTo(w2, h2, w2 - filletR, h2);
    shape.lineTo(-w2 + filletR, h2);
    shape.quadraticCurveTo(-w2, h2, -w2, h2 - filletR);
    shape.lineTo(-w2, -h2 + filletR);
    shape.quadraticCurveTo(-w2, -h2, -w2 + filletR, -h2);
    geo = new THREE.ExtrudeGeometry(shape, { depth: scD, bevelEnabled: true, bevelSegments: 4, steps: 1, bevelSize: filletR*0.5, bevelThickness: filletR*0.5 });
    geo.center(); geo.translate(0, 0, scD / 2);
  } else if(s.type === 'chamferBox') {
    const chamf = Math.min(scChamfer, scW/2 - 0.5, scH/2 - 0.5);
    const shape = new THREE.Shape();
    const w2 = scW/2, h2 = scH/2;
    shape.moveTo(-w2 + chamf, -h2); shape.lineTo(w2 - chamf, -h2);
    shape.lineTo(w2, -h2 + chamf); shape.lineTo(w2, h2 - chamf);
    shape.lineTo(w2 - chamf, h2); shape.lineTo(-w2 + chamf, h2);
    shape.lineTo(-w2, h2 - chamf); shape.lineTo(-w2, -h2 + chamf);
    geo = new THREE.ExtrudeGeometry(shape, { depth: scD, bevelEnabled: false });
    geo.center(); geo.translate(0, 0, scD / 2);
  } else if(s.type === 'cylinder' || s.type === 'threadedRod') {
    geo = new THREE.CylinderGeometry(scR, scR, scD, 32);
    geo.rotateX(Math.PI / 2); geo.translate(0, 0, scD / 2);
  } else if(s.type === 'sphere') {
    geo = new THREE.SphereGeometry(scR, 32, 32);
    geo.translate(0, 0, scR);
  } else if(s.type === 'cone') {
    geo = new THREE.CylinderGeometry(0, scR, scD, 32);
    geo.rotateX(Math.PI / 2); geo.translate(0, 0, scD / 2);
  } else if(s.type === 'torus') {
    geo = new THREE.TorusGeometry(scR, scTube, 16, 100);
    geo.translate(0, 0, scTube);
  } else if(s.type === 'pipe') {
    const shape = new THREE.Shape();
    shape.absarc(0, 0, scR, 0, Math.PI * 2, false);
    const innerR = Math.max(0.5, scR - scWall);
    const holePath = new THREE.Path();
    holePath.absarc(0, 0, innerR, 0, Math.PI * 2, true);
    shape.holes.push(holePath);
    geo = new THREE.ExtrudeGeometry(shape, { depth: scD, bevelEnabled: false, curveSegments: 32 });
    geo.center(); geo.translate(0, 0, scD / 2);
  } else if(s.type === 'elbow') {
    const rBend = scR * 2.0;
    const curve = new THREE.CubicBezierCurve3(
      new THREE.Vector3(0, 0, 0), new THREE.Vector3(rBend, 0, 0),
      new THREE.Vector3(rBend, 0, rBend), new THREE.Vector3(rBend, 0, rBend + scR)
    );
    geo = new THREE.TubeGeometry(curve, 36, scR, 24, false);
  } else if(s.type === 'wedge') {
    geo = new THREE.BufferGeometry();
    const w = scW/2, h = scH/2, d = scD;
    const vertices = new Float32Array([-w,-h,0, w,-h,0, w,h,0, -w,h,0, -w,-h,d, w,-h,d]);
    const indices = [0,1,2, 0,2,3, 0,4,5, 0,5,1, 1,5,2, 3,2,4, 2,5,4];
    geo.setIndex(indices); geo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    geo.computeVertexNormals();
  } else {
    geo = new THREE.BoxGeometry(10, 10, 10);
    geo.translate(0, 0, 5);
  }
  return geo;
}

function init3DFromSketch(){
  container3D.innerHTML = '';
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0d13);

  camera = new THREE.PerspectiveCamera(45, container3D.clientWidth / container3D.clientHeight, 0.1, 1000);
  camera.position.set(160, -200, 140);
  camera.up.set(0, 0, 1);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container3D.clientWidth, container3D.clientHeight);
  container3D.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  let dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(150, 200, 250);
  scene.add(dirLight);

  let grid = new THREE.GridHelper(300, 30, 0x10b981, 0x2e364f);
  grid.rotateX(Math.PI / 2);
  scene.add(grid);

  let baseMesh = null;
  let subtractiveShapes = [];

  shapes.forEach((s, idx) => {
    const geo = createGeometryForShape(s);
    const mat = new THREE.MeshStandardMaterial({ color: s.op === 'subtract' ? '#ef4444' : '#10b981', roughness: 0.3, metalness: 0.1 });
    const mesh = new THREE.Mesh(geo, mat);
    
    let worldX = (s.x || 0) / 10;
    let worldY = (s.y || 0) / 10;
    let worldZ = (s.z || 0) / 10;

    mesh.position.set(worldX, worldY, worldZ);
    mesh.rotation.set((s.rx||0)*Math.PI/180, (s.ry||0)*Math.PI/180, (s.rz||0)*Math.PI/180, 'XYZ');
    mesh.updateMatrix();

    if(s.op === 'subtract') {
      subtractiveShapes.push({ mesh, index: idx });
    } else {
      if(!baseMesh){
        baseMesh = mesh;
        scene.add(baseMesh);
      } else {
        scene.add(mesh);
      }
    }
  });

  if(baseMesh && subtractiveShapes.length > 0 && typeof CSG !== 'undefined'){
    try {
      let csgBase = CSG.fromMesh(baseMesh);
      subtractiveShapes.forEach(sub => {
        const csgSub = CSG.fromMesh(sub.mesh);
        csgBase = csgBase.subtract(csgSub);
      });
      scene.remove(baseMesh);
      const resultingMesh = CSG.toMesh(csgBase, baseMesh.matrix);
      resultingMesh.material = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3, metalness: 0.2 });
      scene.add(resultingMesh);
    } catch(err){}
  }

  animate3D();
}

function animate3D(){
  if(!is3DMode) return;
  requestAnimationFrame(animate3D);
  controls.update();
  renderer.render(scene, camera);
}

// Správca rozmerov a rotácií
function toggleDimensionsPanel(){
  editMode = !editMode;
  dimsPanel.style.display = editMode ? 'block' : 'none';
  if(editMode) updateDimensionsPanel();
}

function updateDimensionsPanel(){
  dimsContent.innerHTML = '';
  if(shapes.length === 0){
    dimsContent.innerHTML = 'Žiadne diely v skici.';
    return;
  }
  shapes.forEach((s, i) => {
    let card = document.createElement('div');
    card.className = `shape-card ${i === selectedShapeIndex ? 'active' : ''}`;
    
    let dimHtml = `<label>Š:</label><input type="number" value="${s.w||100}" onchange="shapes[${i}].w=parseFloat(this.value);draw2DSketch();">
                   <label>H:</label><input type="number" value="${s.h||100}" onchange="shapes[${i}].h=parseFloat(this.value);draw2DSketch();">
                   <label>V:</label><input type="number" value="${s.d||100}" onchange="shapes[${i}].d=parseFloat(this.value);draw2DSketch();">`;

    card.innerHTML = `
      <div class="shape-title-row">
        <strong>#${i+1} ${s.type.toUpperCase()} (${s.op})</strong>
        <button class="danger" style="padding:2px 6px;" onclick="shapes.splice(${i},1);draw2DSketch();updateDimensionsPanel();">🗑️ Zmazať</button>
      </div>
      <div class="input-group-title">Pozícia X, Y, Z (mm):</div>
      <div class="input-row">
        <label>X:</label><input type="number" value="${s.x||0}" onchange="shapes[${i}].x=parseFloat(this.value);draw2DSketch();">
        <label>Y:</label><input type="number" value="${s.y||0}" onchange="shapes[${i}].y=parseFloat(this.value);draw2DSketch();">
        <label>Z:</label><input type="number" value="${s.z||0}" onchange="shapes[${i}].z=parseFloat(this.value);draw2DSketch();">
      </div>
      <div class="input-group-title">Rotácia RX, RY, RZ (°):</div>
      <div class="input-row">
        <label>RX:</label><input type="number" value="${s.rx||0}" onchange="shapes[${i}].rx=parseFloat(this.value);draw2DSketch();">
        <label>RY:</label><input type="number" value="${s.ry||0}" onchange="shapes[${i}].ry=parseFloat(this.value);draw2DSketch();">
        <label>RZ:</label><input type="number" value="${s.rz||0}" onchange="shapes[${i}].rz=parseFloat(this.value);draw2DSketch();">
      </div>
      <div class="input-group-title">Rozmery (mm):</div>
      <div class="input-row">${dimHtml}</div>
    `;
    dimsContent.appendChild(card);
  });
}

setupSketchInteraction();
draw2DSketch();
