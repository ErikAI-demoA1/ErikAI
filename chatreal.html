<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ERIKAI OS Chat TEST</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#f2f4f7;
    color:#111;
    font-family:Arial,sans-serif;
    display:flex;
    flex-direction:column;
}

header{
    padding:18px;
    text-align:center;
    background:#ffffff;
    color:#111;
    border-bottom:1px solid #d9dee5;
}

h1{
    margin:0;
    font-size:22px;
}

p{
    margin:6px 0 0;
    color:#68717c;
    font-size:13px;
}

.chat{
    flex:1;
    width:100%;
    min-height:500px;
    background:#ffffff;
}

iframe{
    width:100%;
    height:100%;
    min-height:500px;
    border:0;
    display:block;
}
</style>
</head>

<body>

<header>
    <h1>🔐 ERIKAI OS CHAT</h1>
    <p>Testovacia verzia</p>
</header>

<div class="chat">

    <iframe
        src="https://iframe.chat/embed/index.html?chat=000"
        id="erikaiChat"
        frameborder="0">
    </iframe>

</div>

<script src="https://iframe.chat/scripts/main.min.js"></script>

<script>

chattable.initialize({
    theme: "Professional"
});

</script>
<script>
  // ==========================================
  // ERIKAI OS — UNIVERZÁLNY BEZPEČNOSTNÝ STRÁŽCA
  // ==========================================
  const povolenyHostitel = "erikai-demoa1.github.io";
  
  // Overenie, či prebehol proces v session pamäti alebo či prichádza zo správnej domény
  const jeOvereny = sessionStorage.getItem('erikai_auth_token') === 'VERIFIED_OK';
  let pristupOk = jeOvereny || document.referrer.includes(povolenyHostitel);

  // Ak sa niekto pokúsi otvoriť podstránku napriamo (na čierno)
  if (!pristupOk && window.location.hostname !== "127.0.0.1" && window.location.hostname !== "localhost") {
    
    // Vtipné upozornenie
    alert("🚨 Haha, chcel si sa sem dostať zadarmo bez overenia?! Tak takto teda nie! Šup-šup naspäť na začiatok, pekne od 1. kroku sa prihlásiť! 🏃‍♂️💨");
    
    // Presmerovanie na hlavnú vstupnú bránu ErikAI OS
    window.location.href = "https://erikai-demoa1.github.io/ErikAI/";
  }
</script>

</body>
</html>
