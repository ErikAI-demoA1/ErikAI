<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERIKAI OS Chat</title>

<style>
body{
    margin:0;
    background:#0b0f14;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
}

.box{
    width:90%;
    max-width:500px;
    padding:30px;
    background:#151b23;
    border-radius:20px;
    text-align:center;
}

h1{
    margin-top:0;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    border-radius:10px;
    border:1px solid #333;
    background:#0d1218;
    color:white;
    margin:10px 0;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#45bdd1;
    color:white;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
    <h1>🔐 ERIKAI OS Chat</h1>
    <p>End-to-end encrypted SimpleX chat</p>

    <input id="name" placeholder="Tvoje meno">

    <button onclick="openChat()">
        💬 Otvoriť zabezpečený chat
    </button>
</div>

<script>
function openChat(){

    const name =
        document.getElementById("name").value.trim()
        || "ERIKAI používateľ";

    const script=document.createElement("script");

    script.src="https://cdn.simplego.dev/gochat.js";

    script.dataset.contactAddress="SEM_DAJ_TVOJU_SIMPLEX_CONTACT_ADDRESS";
    script.dataset.serverUrl="wss://smp.simplego.dev";

    script.dataset.trigger="floating";
    script.dataset.name="ERIKAI OS Chat";
    script.dataset.lang="sk";
    script.dataset.color="#45bdd1";
    script.dataset.welcome=
        "Vitaj v ERIKAI OS 🔐 E2E šifrovaný chat";

    script.async=true;

    document.body.appendChild(script);

    setTimeout(()=>{
        if(window.GoChat){
            GoChat.open();
        }
    },1500);
}
</script>

</body>
</html>
