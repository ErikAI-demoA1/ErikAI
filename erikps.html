<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI Mobil Ovládanie</title>
<style>
  body { margin:0; font-family:sans-serif; overflow:hidden; background:#111; }
  #gameArea { position: relative; width:100%; height:100vh; background:#222; overflow:hidden; }

  /* iframe hracia plocha */
  #playFrame {
    position:absolute; top:0; left:0; width:100%; height:100%;
    border:none;
    transform-origin: top left;
  }

  /* dotykový ukazovák */
  #pointer {
    position:absolute; width:30px; height:30px; background:red; border-radius:50%;
    pointer-events:none; z-index:10;
  }

  /* joystick L1 */
  #joystick {
    position:absolute; bottom:100px; left:50px; width:80px; height:80px;
    background:rgba(255,255,255,0.2); border-radius:50%;
    touch-action:none;
  }
  #joystickInner {
    width:40px; height:40px; background:rgba(255,255,255,0.6); border-radius:50%;
    position:absolute; top:20px; left:20px;
  }

  /* tlačidlá */
  .btn { position:absolute; width:60px; height:60px; border-radius:50%; background:orange; color:#fff; font-size:24px; text-align:center; line-height:60px; user-select:none; }
  #btnX { bottom:100px; right:50px; }
  #btnO { bottom:180px; right:50px; }

</style>
</head>
<body>

<div id="gameArea">
  <iframe id="playFrame" src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
  <div id="pointer"></div>

  <!-- joystick -->
  <div id="joystick">
    <div id="joystickInner"></div>
  </div>

  <!-- tlačidlá -->
  <div id="btnX" class="btn">X</div>
  <div id="btnO" class="btn">O</div>
</div>

<script>
const pointer = document.getElementById('pointer');
const iframe = document.getElementById('playFrame');

let pointerX = window.innerWidth/2;
let pointerY = window.innerHeight/2;
pointer.style.left = pointerX+'px';
pointer.style.top = pointerY+'px';

function movePointer(dx, dy){
  pointerX += dx;
  pointerY += dy;
  pointerX = Math.max(0, Math.min(window.innerWidth-30, pointerX));
  pointerY = Math.max(0, Math.min(window.innerHeight-30, pointerY));
  pointer.style.left = pointerX+'px';
  pointer.style.top = pointerY+'px';

  // automatický scroll iframe ak pointer ide hore/dole
  iframe.scrollIntoView({behavior:'smooth'});
}

/* joystick touch */
const joystick = document.getElementById('joystick');
const joystickInner = document.getElementById('joystickInner');
let active = false;
let startX, startY;

joystick.addEventListener('touchstart', e=>{
  active = true;
  const touch = e.touches[0];
  startX = touch.clientX;
  startY = touch.clientY;
});

joystick.addEventListener('touchmove', e=>{
  if(!active) return;
  const touch = e.touches[0];
  let dx = touch.clientX - startX;
  let dy = touch.clientY - startY;

  // obmedzenie vnútri joystick
  const maxDist = 30;
  const dist = Math.min(maxDist, Math.sqrt(dx*dx+dy*dy));
  const angle = Math.atan2(dy, dx);
  joystickInner.style.left = 20 + dist*Math.cos(angle) + 'px';
  joystickInner.style.top = 20 + dist*Math.sin(angle) + 'px';

  movePointer(dx/5, dy/5); // rýchlosť pohybu
});

joystick.addEventListener('touchend', e=>{
  active = false;
  joystickInner.style.left = '20px';
  joystickInner.style.top = '20px';
});

/* tlačidlá X/O */
document.getElementById('btnX').addEventListener('touchstart', ()=>{
  pointer.click(); // klik na ukazovák
});
document.getElementById('btnO').addEventListener('touchstart', ()=>{
  alert('Späť alebo iná akcia'); // sem môžeš vložiť funkciu späť
});
</script>

</body>
</html>
