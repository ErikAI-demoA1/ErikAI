<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joystick Myška Pre iframe</title>
<style>
  body { margin:0; overflow:hidden; background:#111; }
  #gameArea {
    position: relative;
    width: 100vw; height: 100vh;
    background:#222;
    overflow: hidden;
  }
  #cursor {
    position: absolute;
    width: 20px; height: 20px;
    background: #ff4500;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
  }
  #iframeContainer {
    position: absolute;
    top:0; left:0;
    width:100%; height:100%;
    pointer-events: none; /* aby sa dalo kliknúť cez JS */
  }
  #iframeContainer iframe {
    width:100%; height:100%;
    border:none;
  }
</style>
</head>
<body>

<div id="gameArea">
  <div id="cursor"></div>
  <div id="iframeContainer">
    <iframe id="contentFrame" src="https://www.youtube.com/"></iframe>
  </div>
</div>

<script>
const cursor = document.getElementById('cursor');
const iframe = document.getElementById('contentFrame');
const gameArea = document.getElementById('gameArea');

let pos = {x: window.innerWidth/2, y: window.innerHeight/2};
let speed = 10; // rýchlosť pohybu
let keys = {ArrowUp:false, ArrowDown:false, ArrowLeft:false, ArrowRight:false};

// ovládanie šípkami
document.addEventListener('keydown', e => {
  if(keys.hasOwnProperty(e.key)) keys[e.key] = true;
  if(e.key === 'x' || e.key === 'X') clickAtCursor();
});
document.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

// hlavný update loop
function update() {
  if(keys.ArrowUp) pos.y -= speed;
  if(keys.ArrowDown) pos.y += speed;
  if(keys.ArrowLeft) pos.x -= speed;
  if(keys.ArrowRight) pos.x += speed;

  // udržať kurzor v hraniciach
  pos.x = Math.max(0, Math.min(window.innerWidth, pos.x));
  pos.y = Math.max(0, Math.min(window.innerHeight, pos.y));
  
  cursor.style.left = pos.x+'px';
  cursor.style.top = pos.y+'px';

  // posúvanie iframe ak kurzor blízko okraja
  const scrollMargin = 50;
  const iframeDoc = iframe.contentWindow.document;
  try {
    if(pos.y < scrollMargin) iframe.contentWindow.scrollBy(0, -speed);
    if(pos.y > window.innerHeight - scrollMargin) iframe.contentWindow.scrollBy(0, speed);
    if(pos.x < scrollMargin) iframe.contentWindow.scrollBy(-speed, 0);
    if(pos.x > window.innerWidth - scrollMargin) iframe.contentWindow.scrollBy(speed, 0);
  } catch(e){ /* CORS iframe, funguje iba na vlastné HTML */ }

  requestAnimationFrame(update);
}
update();

// simulovanie kliknutia
function clickAtCursor(){
  try {
    const rect = iframe.getBoundingClientRect();
    const x = pos.x - rect.left;
    const y = pos.y - rect.top;
    const el = iframe.contentWindow.document.elementFromPoint(x, y);
    if(el) el.click();
  } catch(e){
    console.log("Nie je možné kliknúť do externého iframe (CORS)");
  }
}
</script>

</body>
</html>
