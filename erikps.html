<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ErikAI Mobile Controller</title>
<style>
body { margin:0; overflow:hidden; font-family:sans-serif; background:#111; color:#fff; }
#iframeContainer { position:relative; width:100%; height:100vh; overflow:hidden; border:2px solid #ff4500; }
#contentFrame { width:100%; height:100%; border:none; }
#controller { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:10px; }
.joystick, .btn { width:60px; height:60px; background:linear-gradient(135deg,#ff7f50,#ff4500); border-radius:50%; display:flex; justify-content:center; align-items:center; color:#fff; font-weight:bold; font-size:20px; user-select:none; touch-action:none; }
#joystick { position:relative; }
#pointer { position:absolute; width:20px; height:20px; background:#0f0; border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%); }
</style>
</head>
<body>

<div id="iframeContainer">
  <iframe id="contentFrame" src=""></iframe>
  <div id="pointer"></div>
</div>

<div id="controller">
  <div id="joystick" class="joystick">L1</div>
  <div id="btnX" class="btn">X</div>
  <div id="btnO" class="btn">O</div>
</div>

<script>
const iframe = document.getElementById('contentFrame');
const pointer = document.getElementById('pointer');
const iframeContainer = document.getElementById('iframeContainer');

// Nastavenie hraníc hracej plochy
const bounds = { minX:0, minY:0, maxX:window.innerWidth, maxY:window.innerHeight };

// Ukazovák pohyb a scroll
let pointerPos = { x: window.innerWidth/2, y: window.innerHeight/2 };
function movePointer(dx, dy){
    pointerPos.x = Math.min(bounds.maxX, Math.max(bounds.minX, pointerPos.x + dx));
    pointerPos.y = Math.min(bounds.maxY, Math.max(bounds.minY, pointerPos.y + dy));
    pointer.style.left = pointerPos.x+'px';
    pointer.style.top = pointerPos.y+'px';
    // Scroll iframe podľa pohybu ukazovák
    iframe.contentWindow.scrollBy(dx, dy);
}

// Joystick dotyk
const joystick = document.getElementById('joystick');
let touchStart = null;
joystick.addEventListener('touchstart', e=>{ touchStart = e.touches[0]; });
joystick.addEventListener('touchmove', e=>{
    if(!touchStart) return;
    let dx = e.touches[0].clientX - touchStart.clientX;
    let dy = e.touches[0].clientY - touchStart.clientY;
    movePointer(dx, dy);
    touchStart = e.touches[0];
});
joystick.addEventListener('touchend', e=>{ touchStart=null; });

// Tlačidlo X – kliknutie na iframe obsah
document.getElementById('btnX').addEventListener('click', ()=>{
    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
    const el = iframeDoc.elementFromPoint(pointerPos.x - iframe.getBoundingClientRect().left, pointerPos.y - iframe.getBoundingClientRect().top);
    if(el) el.click();
});

// Tlačidlo O – späť v histórii iframe
document.getElementById('btnO').addEventListener('click', ()=>{
    iframe.contentWindow.history.back();
});

// Na začiatok – stred
pointer.style.left = pointerPos.x+'px';
pointer.style.top = pointerPos.y+'px';

// Pre jednoduché testovanie môžeš nastaviť iframe src
iframe.src = "https://rawcdn.githack.com/ErikAI-demoA1/ErikAI/main/01zaklad.html";

</script>
</body>
</html>
