<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Joystick / Ovládanie</title>
<style>
  body { background: #111; color: #fff; font-family: Arial, sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; margin:0; padding:0; height:100vh; }
  #urlInput { margin:10px; width:80%; padding:8px; font-size:16px; }
  #playArea { position:relative; width:90%; height:400px; background:#222; margin-bottom:10px; border:2px solid #ff4500; }
  #cursor { position:absolute; width:20px; height:20px; background:#ff4500; border-radius:50%; pointer-events:none; }
  #buttons { display:flex; gap:10px; margin-bottom:10px; }
  .btn { padding:10px 20px; font-size:16px; background:#ff4500; border:none; border-radius:8px; cursor:pointer; color:#fff; }
  iframe { width:90%; height:400px; border:none; }
</style>
</head>
<body>

<input id="urlInput" type="text" placeholder="Vlož odkaz, napr. YouTube URL" />
<div id="playArea">
  <div id="cursor"></div>
</div>
<div id="buttons">
  <button class="btn" data-action="L1">L1</button>
  <button class="btn" data-action="Up">↑</button>
  <button class="btn" data-action="Down">↓</button>
  <button class="btn" data-action="Left">←</button>
  <button class="btn" data-action="Right">→</button>
  <button class="btn" data-action="X">X</button>
  <button class="btn" data-action="O">O</button>
</div>

<iframe id="iframeContent" src=""></iframe>

<script>
const cursor = document.getElementById('cursor');
const playArea = document.getElementById('playArea');
const iframe = document.getElementById('iframeContent');
const urlInput = document.getElementById('urlInput');
const buttons = document.querySelectorAll('.btn');

let cursorPos = {x:100, y:100};

playArea.addEventListener('mousemove', (e)=>{
    const rect = playArea.getBoundingClientRect();
    cursorPos.x = e.clientX - rect.left;
    cursorPos.y = e.clientY - rect.top;
    cursor.style.left = cursorPos.x - 10 + 'px';
    cursor.style.top = cursorPos.y - 10 + 'px';
});

urlInput.addEventListener('change', ()=>{
    iframe.src = urlInput.value;
});

// Tlačidlá - pre demo iba logovanie akcie
buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
        const action = btn.getAttribute('data-action');
        console.log("Tlačidlo stlačené:", action);
        // Tu môžeme posielať signály do iframe alebo na server
    });
});
</script>

</body>
</html>
