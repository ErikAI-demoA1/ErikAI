<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobilný joystick + X tlačidlo</title>
<style>
  body { margin:0; background:#111; color:#fff; font-family:sans-serif; }
  #gameArea { position: relative; width: 100%; height: 80vh; border: 2px solid #ff4500; overflow: hidden; margin:20px auto; }
  iframe { width:100%; height:100%; border:none; }
  #pointer {
    position: absolute;
    width: 20px; height: 20px;
    background: #ff4500;
    border-radius: 50%;
    pointer-events: none;
  }
  #controls { text-align:center; margin-top:10px; }
  button { font-size:18px; padding:10px 20px; margin:5px; }
</style>
</head>
<body>

<div id="gameArea">
  <iframe id="gameFrame" src="01zaklad.html"></iframe>
  <div id="pointer"></div>
</div>

<div id="controls">
  <button id="up">↑</button>
  <button id="down">↓</button>
  <button id="left">←</button>
  <button id="right">→</button>
  <button id="X">X (klik)</button>
</div>

<script>
const pointer = document.getElementById('pointer');
const iframe = document.getElementById('gameFrame');

let pos = { x: 50, y: 50 };
pointer.style.left = pos.x + 'px';
pointer.style.top = pos.y + 'px';

function movePointer(dx, dy){
  const area = document.getElementById('gameArea').getBoundingClientRect();
  pos.x = Math.min(Math.max(pos.x + dx, 0), area.width - 20);
  pos.y = Math.min(Math.max(pos.y + dy, 0), area.height - 20);
  pointer.style.left = pos.x + 'px';
  pointer.style.top = pos.y + 'px';
}

// Šípky
document.getElementById('up').addEventListener('click', ()=>movePointer(0,-10));
document.getElementById('down').addEventListener('click', ()=>movePointer(0,10));
document.getElementById('left').addEventListener('click', ()=>movePointer(-10,0));
document.getElementById('right').addEventListener('click', ()=>movePointer(10,0));

// X tlačidlo - klik na element pod ukazovák
document.getElementById('X').addEventListener('click', ()=>{
  try{
    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
    const el = iframeDoc.elementFromPoint(pos.x, pos.y);
    if(el) el.click();
    else alert('Ničoho sa nedotýka ukazovák!');
  } catch(e){
    alert('Externé stránky nemôžu byť kliknuté kvôli bezpečnosti.');
  }
});
</script>

</body>
</html>
