<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🕓 ErikAI Time Pro</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      text-align: center;
      background: #000;
      color: lime;
      margin: 0;
      padding: 0;
    }
    h1 {
      color: lime;
      margin-top: 20px;
      text-shadow: 0 0 10px lime;
    }
    #clockCanvas {
      background: radial-gradient(circle at center, #111 60%, #000 100%);
      border-radius: 50%;
      box-shadow: 0 0 20px lime;
      margin: 30px auto;
      display: block;
    }
    .stopky {
      margin-top: 20px;
      font-size: 2em;
    }
    button {
      font-size: 1em;
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    .start { background: lime; color: black; }
    .stop { background: red; color: white; }
    .reset { background: dodgerblue; color: white; }
    .lap { background: orange; color: black; }
    button:hover { transform: scale(1.1); }

    #laps {
      margin-top: 15px;
      font-size: 1em;
      max-height: 200px;
      overflow-y: auto;
      text-align: left;
      display: inline-block;
      border: 1px solid lime;
      padding: 10px;
      border-radius: 10px;
      width: 250px;
    }

    .themeBtn {
      position: fixed;
      top: 10px;
      right: 10px;
      background: none;
      border: 1px solid lime;
      color: lime;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 18px;
    }

    body.light {
      background: #f5f5f5;
      color: #111;
    }
    body.light h1 { color: red; text-shadow: none; }
    body.light #clockCanvas { background: white; box-shadow: 0 0 10px gray; }
    body.light button { color: white; }
  </style>
</head>
<body>
  <button class="themeBtn" onclick="toggleTheme()">🌓</button>
  <h1>🕓 ErikAI – Time Pro</h1>

  <canvas id="clockCanvas" width="250" height="250"></canvas>

  <div class="stopky">
    ⏱ <span id="stopwatch">00:00:00.0</span><br>
    <button class="start" onclick="startStopwatch()">▶ Štart</button>
    <button class="stop" onclick="stopStopwatch()">⏸ Stop</button>
    <button class="reset" onclick="resetStopwatch()">🔄 Reset</button>
    <button class="lap" onclick="recordLap()">📍 Medzičas</button>
  </div>

  <div id="laps"><b>Medzičasy:</b><br></div>

  <p id="cas" style="font-size: 16px; margin-top: 30px;"></p>

  <script>
    // === Téma ===
    function toggleTheme() {
      document.body.classList.toggle('light');
    }

    // === Hodiny ===
    const canvas = document.getElementById("clockCanvas");
    const ctx = canvas.getContext("2d");
    const radius = canvas.height / 2;
    ctx.translate(radius, radius);

    function drawClock() {
      const now = new Date();
      ctx.clearRect(-radius, -radius, canvas.width, canvas.height);

      // ciferník
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.95, 0, 2 * Math.PI);
      ctx.fillStyle = "transparent";
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "lime";
      ctx.stroke();

      // čísla
      ctx.font = radius * 0.15 + "px Arial";
      ctx.textBaseline = "middle";
      ctx.textAlign = "center";
      for (let num = 1; num <= 12; num++) {
        let ang = num * Math.PI / 6;
        ctx.rotate(ang);
        ctx.translate(0, -radius * 0.8);
        ctx.rotate(-ang);
        ctx.fillText(num.toString(), 0, 0);
        ctx.rotate(ang);
        ctx.translate(0, radius * 0.8);
        ctx.rotate(-ang);
      }

      // ručičky
      const hour = now.getHours();
      const minute = now.getMinutes();
      const second = now.getSeconds() + now.getMilliseconds() / 1000;

      const hourAngle = ((hour % 12) + minute / 60) * Math.PI / 6;
      const minuteAngle = (minute + second / 60) * Math.PI / 30;
      const secondAngle = second * Math.PI / 30;

      drawHand(hourAngle, radius * 0.5, 6);
      drawHand(minuteAngle, radius * 0.7, 4);
      drawHand(secondAngle, radius * 0.9, 2, "red");
    }

    function drawHand(pos, length, width, color = "lime") {
      ctx.beginPath();
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.strokeStyle = color;
      ctx.moveTo(0, 0);
      ctx.rotate(pos);
      ctx.lineTo(0, -length);
      ctx.stroke();
      ctx.rotate(-pos);
    }

    setInterval(drawClock, 50);

    // === Stopky ===
    let startTime, stopwatchInterval;
    let elapsedTime = 0;
    let running = false;

    function startStopwatch() {
      if (!running) {
        startTime = Date.now() - elapsedTime;
        stopwatchInterval = setInterval(updateStopwatch, 100);
        running = true;
      }
    }

    function stopStopwatch() {
      if (running) {
        clearInterval(stopwatchInterval);
        elapsedTime = Date.now() - startTime;
        running = false;
      }
    }

    function resetStopwatch() {
      clearInterval(stopwatchInterval);
      elapsedTime = 0;
      running = false;
      document.getElementById("stopwatch").textContent = "00:00:00.0";
      document.getElementById("laps").innerHTML = "<b>Medzičasy:</b><br>";
    }

    function updateStopwatch() {
      const time = Date.now() - startTime;
      const totalSeconds = time / 1000;
      const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
      const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const seconds = String(Math.floor(totalSeconds % 60)).padStart(2, '0');
      const tenths = String(Math.floor((time % 1000) / 100));
      document.getElementById("stopwatch").textContent = `${hours}:${minutes}:${seconds}.${tenths}`;
    }

    function recordLap() {
      if (elapsedTime > 0) {
        const lapList = document.getElementById("laps");
        const currentTime = document.getElementById("stopwatch").textContent;
        const entry = document.createElement("div");
        entry.textContent = "⏱ " + currentTime;
        lapList.appendChild(entry);
      }
    }

    // === Aktuálny dátum/čas ===
    function aktualizujCas() {
      const teraz = new Date();
      const moznosti = {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      };
      document.getElementById('cas').innerText = `📅 ${teraz.toLocaleDateString('sk-SK', moznosti)}`;
    }
    setInterval(aktualizujCas, 1000);
    aktualizujCas();
  </script>

  <p style="font-size: 13px; color: gray; margin-top: 30px;">
    © 2025 Erik Mohylák – ErikAI Time Pro | Creative Commons BY-NC-ND 4.0  
  </p>
</body>
</html>
