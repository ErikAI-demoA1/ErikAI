<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 MemoryMatch</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    color: white;
    flex-direction: column;
  }

  h1 {
    margin-bottom: 20px;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.5);
  }

  .stats {
    margin-bottom: 15px;
    font-size: 18px;
  }

  #game {
    display: grid;
    gap: 10px;
    justify-content: center;
  }

  .card {
    width: 100px;
    height: 100px;
    perspective: 1000px;
    cursor: pointer;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.6s;
    transform-style: preserve-3d;
    border-radius: 12px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  }

  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
  }

  .card-front {
    background: #fff;
    color: #333;
  }

  .card-back {
    background: #ff6f61;
    transform: rotateY(180deg);
    color: white;
    font-weight: bold;
  }

  button {
    margin-top: 20px;
    padding: 10px 20px;
    background-color: #2575fc;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background-color: #6a11cb;
  }

  @media (max-width: 600px) {
    #game {
      grid-template-columns: repeat(4, 70px);
    }
    .card {
      width: 70px;
      height: 70px;
    }
  }
</style>
</head>
<body>

<h1>🧠 MemoryMatch</h1>
<div class="stats">
  Pokusy: <span id="moves">0</span> | Nájdené dvojice: <span id="matches">0</span>
</div>
<div id="game"></div>
<button onclick="startGame()">🔄 Nová Hra</button>

<script>
const gameElement = document.getElementById('game');
const movesElement = document.getElementById('moves');
const matchesElement = document.getElementById('matches');

let cards = [];
let flippedCards = [];
let moves = 0;
let matches = 0;

const symbols = ['🍎','🍌','🍇','🍒','🥝','🍍','🍓','🍉'];

function shuffle(array) {
  return array.sort(() => Math.random() - 0.5);
}

function createCards() {
  cards = [];
  symbols.forEach(sym => {
    cards.push(sym, sym); // dvojice
  });
  cards = shuffle(cards);
}

function startGame() {
  createCards();
  moves = 0;
  matches = 0;
  movesElement.textContent = moves;
  matchesElement.textContent = matches;

  gameElement.innerHTML = '';
  gameElement.style.gridTemplateColumns = `repeat(${Math.sqrt(cards.length)}, 100px)`;

  cards.forEach(sym => {
    const card = document.createElement('div');
    card.classList.add('card');
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-front">${sym}</div>
        <div class="card-back">?</div>
      </div>
    `;
    card.addEventListener('click', () => flipCard(card));
    gameElement.appendChild(card);
  });
}

function flipCard(card) {
  if (flippedCards.length < 2 && !card.classList.contains('flipped')) {
    card.classList.add('flipped');
    flippedCards.push(card);

    if (flippedCards.length === 2) {
      moves++;
      movesElement.textContent = moves;
      checkMatch();
    }
  }
}

function checkMatch() {
  const [card1, card2] = flippedCards;
  const sym1 = card1.querySelector('.card-front').textContent;
  const sym2 = card2.querySelector('.card-front').textContent;

  if (sym1 === sym2) {
    matches++;
    matchesElement.textContent = matches;
    flippedCards = [];
  } else {
    setTimeout(() => {
      card1.classList.remove('flipped');
      card2.classList.remove('flipped');
      flippedCards = [];
    }, 800);
  }
}

startGame();
</script>

</body>
</html>
