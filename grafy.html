<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mini Excel Pro — Vedecká verzia</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- SheetJS pre export XLSX -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.19.2/dist/xlsx.full.min.js"></script>

<style>
:root {
  --bg:#060b18;
  --panel:#0d162b;
  --muted:#9ca3af;
  --accent:#3b82f6;
  --green:#22c55e;
  --border:rgba(255,255,255,0.08);
}
html,body {
  margin:0; padding:0;
  background:var(--bg);
  color:#e5e7eb;
  font-family:"Inter",system-ui,Arial;
}
h1 {margin:0;font-size:20px;}
.wrap {
  max-width:1300px;
  margin:30px auto;
  background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));
  border-radius:16px;
  box-shadow:0 0 40px rgba(0,0,0,0.6);
  padding:24px;
}
header {display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:12px;}
.meta {font-size:13px;color:var(--muted);}
.btn {
  border:1px solid var(--border);
  border-radius:8px;
  background:transparent;
  color:inherit;
  padding:8px 12px;
  cursor:pointer;
  font-weight:600;
  transition:0.2s;
}
.btn:hover {background:rgba(255,255,255,0.06);}
.primary {
  background:linear-gradient(90deg,var(--green),var(--accent));
  color:#0b1220;
  border:none;
}
.panel {
  background:var(--panel);
  padding:14px;
  border-radius:12px;
  box-shadow:inset 0 0 15px rgba(255,255,255,0.02);
}
.layout {
  display:grid;
  grid-template-columns:1fr 440px;
  gap:18px;
}
.sheet-wrap {
  overflow:auto;
  border-radius:8px;
}
.sheet {
  border-collapse:collapse;
  min-width:700px;
  width:100%;
}
.sheet th, .sheet td {
  border:1px solid rgba(255,255,255,0.05);
  padding:6px 8px;
  min-width:80px;
  max-width:200px;
}
.sheet th {
  background:rgba(255,255,255,0.04);
  color:var(--muted);
  position:sticky;
  top:0;
  z-index:2;
}
.sheet td.cell {
  cursor:text;
  transition:background 0.1s;
}
.sheet td.cell:hover {
  background:rgba(255,255,255,0.04);
}
.sheet td.cell[contenteditable="true"]:focus {
  outline:2px solid var(--accent);
  background:rgba(59,130,246,0.08);
}
.controls-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
input,select {
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px;
  color:inherit;
}
.chart-panel {display:flex;flex-direction:column;gap:10px;}
.status {
  font-size:12px;
  color:var(--muted);
  text-align:right;
  margin-top:6px;
}
footer {
  margin-top:20px;
  text-align:center;
  font-size:13px;
  color:var(--muted);
}
@media (max-width:1000px){.layout{grid-template-columns:1fr}}
</style>
</head>

<body>
<div class="wrap">
  <header>
    <div>
      <h1>📊 Mini Excel Pro — Vedecká verzia</h1>
      <div class="meta">Pre vedcov, študentov a analytikov — lokálne bez servera</div>
    </div>
    <div class="meta">© 2025 — Lokálny výpočtový modul</div>
  </header>

  <div class="panel controls-row">
    <button id="addRow" class="btn">+ Riadok</button>
    <button id="delRow" class="btn">– Riadok</button>
    <button id="addCol" class="btn">+ Stĺpec</button>
    <button id="delCol" class="btn">– Stĺpec</button>
    <button id="saveBtn" class="btn">💾 Uložiť</button>
    <button id="loadBtn" class="btn">📂 Načítať</button>
    <button id="exportCsv" class="btn">⬇ CSV</button>
    <button id="exportXlsx" class="btn">⬇ XLSX</button>
    <button id="clearBtn" class="btn">🧹 Vyčistiť</button>
    <label style="margin-left:auto">Auto graf <input type="checkbox" id="autoChart"></label>
  </div>

  <div class="layout" style="margin-top:16px">
    <div class="panel sheet-wrap"><table id="sheetTable" class="sheet"></table></div>
    <aside class="panel chart-panel">
      <div class="meta">Rozsah pre graf (napr. A1:B10)</div>
      <input id="chartRange" placeholder="A1:B10">
      <select id="chartType">
        <option value="bar">Stĺpcový</option>
        <option value="line">Čiarový</option>
        <option value="area">Plošný</option>
        <option value="pie">Koláčový</option>
        <option value="scatter">Bodový</option>
      </select>
      <button id="makeChart" class="btn primary">📈 Generovať graf</button>
      <button id="exportChartPng" class="btn">⬇ Export PNG</button>
      <button id="exportChartSvg" class="btn">⬇ Export SVG</button>
      <button id="clearChart" class="btn">🗑 Vymazať graf</button>
      <canvas id="chartCanvas" height="250"></canvas>
      <div class="status" id="statusInfo">Bez grafu</div>
    </aside>
  </div>

  <footer>Mini Excel Pro — Vedecká verzia • Všetko beží offline</footer>
</div>

<script>
/* === Skrátená a bezpečná logika === */
const table = document.getElementById('sheetTable');
let rows=10, cols=8, data={}, chart=null;
function colName(n){let s='';n++;while(n>0){s=String.fromCharCode(65+(n-1)%26)+s;n=Math.floor((n-1)/26);}return s;}
function render(){table.innerHTML='';const thead=document.createElement('thead');const hr=document.createElement('tr');hr.appendChild(document.createElement('th'));for(let c=0;c<cols;c++){let th=document.createElement('th');th.textContent=colName(c);hr.appendChild(th);}thead.appendChild(hr);table.appendChild(thead);const tb=document.createElement('tbody');for(let r=0;r<rows;r++){let tr=document.createElement('tr');let th=document.createElement('th');th.textContent=r+1;tr.appendChild(th);for(let c=0;c<cols;c++){let td=document.createElement('td');td.className='cell';td.contentEditable='true';td.dataset.r=r;td.dataset.c=c;td.textContent=data[`${r},${c}`]?.raw||'';td.oninput=e=>{data[`${r},${c}`]={raw:td.textContent};update();};tr.appendChild(td);}tb.appendChild(tr);}table.appendChild(tb);}
function get(r,c){return data[`${r},${c}`]?.raw||'';}
function val(r,c){let raw=get(r,c);if(!raw.startsWith('='))return raw;try{let ex=raw.slice(1).replace(/([A-Z]+)(\d+)/g,(m,a,b)=>val(parseInt(b)-1,a.charCodeAt(0)-65)||0);return Function('return '+ex)();}catch{return '#ERR';}}
function update(){for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){let td=table.rows[r+1].cells[c+1];let raw=get(r,c);td.textContent=raw.startsWith('=')?val(r,c):raw;}}if(document.getElementById('autoChart').checked)makeChart();}
function rangeToCoords(rng){let [a,b]=rng.split(':');if(!b)b=a;let A=a.match(/([A-Z]+)(\d+)/),B=b.match(/([A-Z]+)(\d+)/);if(!A||!B)return[];let c1=A[1].charCodeAt(0)-65,c2=B[1].charCodeAt(0)-65,r1=+A[2]-1,r2=+B[2]-1;let arr=[];for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)arr.push({r,c});return arr;}
function makeChart(){const rng=document.getElementById('chartRange').value;if(!rng)return;const type=document.getElementById('chartType').value;let coords=rangeToCoords(rng),rowsSet=[...new Set(coords.map(x=>x.r))].sort((a,b)=>a-b),colsSet=[...new Set(coords.map(x=>x.c))];const labels=rowsSet.map(r=>'R'+(r+1));const datasets=colsSet.map(cc=>({label:colName(cc),data:rowsSet.map(r=>+val(r,cc)||0)}));if(chart)chart.destroy();chart=new Chart(document.getElementById('chartCanvas'),{type:type==='area'?'line':type,data:{labels,datasets},options:{plugins:{legend:{labels:{color:'#e5e7eb'}}},scales:{x:{ticks:{color:'#ccc'}},y:{ticks:{color:'#ccc'}}}}});document.getElementById('statusInfo').textContent='Graf: '+type.toUpperCase()+' | Rozsah '+rng;}
document.getElementById('makeChart').onclick=makeChart;
document.getElementById('clearChart').onclick=()=>{if(chart){chart.destroy();chart=null;document.getElementById('statusInfo').textContent='Bez grafu';}};
document.getElementById('exportChartPng').onclick=()=>{if(!chart)return;let a=document.createElement('a');a.href=chart.toBase64Image();a.download='chart.png';a.click();};
document.getElementById('exportChartSvg').onclick=()=>{if(!chart)return;let svg=document.querySelector('canvas').toDataURL('image/svg+xml');let a=document.createElement('a');a.href=svg;a.download='chart.svg';a.click();};
document.getElementById('addRow').onclick=()=>{rows++;render();update();};
document.getElementById('delRow').onclick=()=>{if(rows>1)rows--;render();update();};
document.getElementById('addCol').onclick=()=>{cols++;render();update();};
document.getElementById('delCol').onclick=()=>{if(cols>1)cols--;render();update();};
document.getElementById('clearBtn').onclick=()=>{if(confirm('Vymazať všetko?')){data={};render();update();}};
document.getElementById('saveBtn').onclick=()=>localStorage.setItem('miniExcelV2',JSON.stringify({rows,cols,data}));
document.getElementById('loadBtn').onclick=()=>{let j=localStorage.getItem('miniExcelV2');if(j){let o=JSON.parse(j);rows=o.rows;cols=o.cols;data=o.data;render();update();}};
document.getElementById('exportCsv').onclick=()=>{let csv='';for(let r=0;r<rows;r++){let arr=[];for(let c=0;c<cols;c++)arr.push('"'+(get(r,c)||'').replace(/"/g,'""')+'"');csv+=arr.join(',')+'\n';}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='data.csv';a.click();};
document.getElementById('exportXlsx').onclick=()=>{let sheet=[];for(let r=0;r<rows;r++){let row=[];for(let c=0;c<cols;c++)row.push(get(r,c));sheet.push(row);}let wb=XLSX.utils.book_new();let ws=XLSX.utils.aoa_to_sheet(sheet);XLSX.utils.book_append_sheet(wb,ws,'Data');XLSX.writeFile(wb,'data.xlsx');};
render();update();
</script>
</body>
</html>
