<!doctype html>

<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vedecká tabuľka a detailný graf</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body{font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial}
    .card{background:linear-gradient(180deg, #ffffff 0%, #f8fafc 100%); border-radius:12px; box-shadow:0 6px 24px rgba(2,6,23,0.08);}
    .table-wrap{max-height:420px; overflow:auto}
    .download-btn{background:#0f172a;color:#fff;padding:8px 12px;border-radius:8px}
  </style>
</head>
<body class="bg-gray-50 p-6">
  <div class="max-w-6xl mx-auto">
    <header class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-semibold text-red-600">Detailný vedecký graf a tabuľka</h1>
      <div class="space-x-2">
        <button id="download-xlsx" class="download-btn">Stiahnuť .xlsx</button>
        <button id="download-png" class="download-btn">Stiahnuť graf</button>
      </div>
    </header><div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
  <section class="lg:col-span-2 card p-4">
    <h2 class="text-lg font-medium mb-2 text-red-600">Graf s detailnými údajmi</h2>
    <canvas id="mainChart" height="350"></canvas>
    <div class="flex gap-3 mt-3">
      <label class="flex items-center gap-2"><input id="smooth" type="checkbox"> Hladké krivky</label>
      <label class="flex items-center gap-2"><input id="showPoints" type="checkbox" checked> Zobraziť body</label>
    </div>
  </section>

  <aside class="card p-4">
    <h3 class="text-md font-medium text-red-600">Tabuľka údajov</h3>
    <div class="mt-3 table-wrap">
      <table id="dataTable" class="min-w-full text-sm">
        <thead class="bg-gray-100 sticky top-0">
          <tr>
            <th class="p-2">ID</th>
            <th class="p-2">Čas</th>
            <th class="p-2">Hodnota A</th>
            <th class="p-2">Hodnota B</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="mt-4">
      <button id="addRow" class="download-btn">Pridať riadok</button>
    </div>
  </aside>
</div>

<section class="card p-4 mt-6">
  <h3 class="font-medium text-red-600">Pokročilé nastavenia</h3>
  <div class="mt-3 grid grid-cols-1 md:grid-cols-3 gap-3">
    <div>
      <label>Vyber sérií pre zobrazenie</label>
      <div>
        <label><input type="checkbox" class="toggleSeries" data-series="A" checked> Séria A</label><br>
        <label><input type="checkbox" class="toggleSeries" data-series="B" checked> Séria B</label>
      </div>
    </div>
    <div>
      <label>Orez exportu (PNG)</label>
      <input id="dpi" type="number" min="1" value="2" class="w-full p-1 rounded border">
    </div>
    <div>
      <label>Formát času</label>
      <select id="timeFormat" class="w-full p-1 rounded border">
        <option value="iso">ISO 8601</option>
        <option value="short">DD.MM.YYYY HH:mm</option>
      </select>
    </div>
  </div>
</section>

  </div>  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>  <script>
    let data = [];
    for(let i=0;i<20;i++) data.push({id:i+1, time:new Date(Date.now()-(19-i)*3600*1000).toISOString(), A:Math.random()*50+10, B:Math.random()*30+20});

    const tbody=document.querySelector('#dataTable tbody');
    function renderTable(){
      tbody.innerHTML='';
      data.forEach((r,idx)=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td class='p-2'>${r.id}</td><td class='p-2'><input data-idx='${idx}' data-field='time' value='${r.time}' class='w-full border rounded'></td><td class='p-2'><input data-idx='${idx}' data-field='A' value='${r.A.toFixed(3)}' class='w-full border rounded'></td><td class='p-2'><input data-idx='${idx}' data-field='B' value='${r.B.toFixed(3)}' class='w-full border rounded'></td>`;
        tbody.appendChild(tr);
      });
    }
    renderTable();

    tbody.addEventListener('change', e=>{
      const inp=e.target;const i=+inp.dataset.idx;const f=inp.dataset.field;
      if(f==='time') data[i][f]=inp.value; else data[i][f]=parseFloat(inp.value);
      updateChart();
    });

    document.getElementById('addRow').addEventListener('click',()=>{
      const id=data.length+1;
      data.push({id,time:new Date().toISOString(),A:10+Math.random()*10,B:20+Math.random()*10});
      renderTable();updateChart();
    });

    const ctx=document.getElementById('mainChart');
    const chart=new Chart(ctx,{
      type:'line',
      data:{labels:data.map(d=>d.time),datasets:[{label:'A',data:data.map(d=>d.A),borderColor:'black',backgroundColor:'rgba(0,0,0,0.1)',borderWidth:2,tension:0.4,pointRadius:3,pointBackgroundColor:'red'},{label:'B',data:data.map(d=>d.B),borderColor:'black',backgroundColor:'rgba(0,0,0,0.1)',borderWidth:2,tension:0.4,pointRadius:3,pointBackgroundColor:'red'}]},
      options:{
        plugins:{
          legend:{labels:{color:'red',font:{weight:'bold'}}},
          tooltip:{titleColor:'black',bodyColor:'red',backgroundColor:'white',borderColor:'black',borderWidth:1}
        },
        scales:{
          x:{ticks:{color:'black'},grid:{color:'black'}},
          y:{ticks:{color:'black'},grid:{color:'black'}}
        }
      }
    });

    function updateChart(){
      chart.data.labels=data.map(d=>d.time);
      chart.data.datasets[0].data=data.map(d=>d.A);
      chart.data.datasets[1].data=data.map(d=>d.B);
      chart.update();
      renderTable();
    }

    document.querySelectorAll('.toggleSeries').forEach(ch=>ch.addEventListener('change',e=>{const s=e.target.dataset.series;chart.getDatasetMeta(s==='A'?0:1).hidden=!e.target.checked;chart.update();}));

    document.getElementById('smooth').addEventListener('change',e=>{chart.data.datasets.forEach(ds=>ds.tension=e.target.checked?0.4:0);chart.update();});
    document.getElementById('showPoints').addEventListener('change',e=>{chart.data.datasets.forEach(ds=>ds.pointRadius=e.target.checked?3:0);chart.update();});

    document.getElementById('download-png').addEventListener('click',()=>{
      const link=document.createElement('a');link.href=chart.toBase64Image();link.download='graf_detailny.png';link.click();
    });

    document.getElementById('download-xlsx').addEventListener('click',()=>{
      const ws_data=[["ID","Time","A","B"],...data.map(r=>[r.id,r.time,r.A,r.B])];
      const wb=XLSX.utils.book_new();const ws=XLSX.utils.aoa_to_sheet(ws_data);XLSX.utils.book_append_sheet(wb,ws,'Data');XLSX.writeFile(wb,'data_detailna.xlsx');
    });
  </script></body>
</html>
