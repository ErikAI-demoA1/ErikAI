<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Excel Pro — ErikAI</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #071026, #04101a);
  color: #ff0000;
  margin: 0; padding: 0;
}
.container {
  max-width: 1200px;
  margin: 20px auto;
  padding: 15px;
  background: rgba(255,255,255,0.02);
  border-radius: 10px;
}
header { display: flex; justify-content: space-between; align-items: center; }
h1 { margin: 0; font-size: 22px; }
.toolbar, .layout, .footer { margin-top: 15px; }
button { padding: 6px 12px; border-radius: 6px; cursor: pointer; border: 1px solid rgba(255,0,0,0.5); background: transparent; color: #ff0000; }
button.primary { background: linear-gradient(90deg, #34d399, #60a5fa); border: none; }
table { border-collapse: collapse; width: 100%; margin-top: 10px; }
table th, table td { border: 1px solid rgba(255,0,0,0.5); padding: 6px; text-align: center; color: #ff0000; }
td.cell { min-width: 80px; }
td.cell:focus { outline: 2px solid rgba(255,0,0,0.5); background: rgba(255,255,255,0.01); }
aside { background: rgba(11,18,32,1); padding: 10px; border-radius: 8px; color: #ff0000; }
select, input { padding: 6px; border-radius: 6px; border: 1px solid rgba(255,0,0,0.5); background: transparent; color: #ff0000; width: 100%; margin-top: 4px; }
.row { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
.footer { font-size: 13px; text-align: center; margin-top: 12px; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Mini Excel Pro — ErikAI</h1>
    <div>© ErikAI</div>
  </header>

  <div class="toolbar">
    <button id="addRow">➕ Riadok</button>
    <button id="delRow">➖ Riadok</button>
    <button id="addCol">➕ Stĺpec</button>
    <button id="delCol">➖ Stĺpec</button>
    <button id="autoDerive">🔁 Auto-derive</button>
  </div>

  <div class="layout" style="display: flex; gap: 20px; flex-wrap: wrap;">
    <div style="flex: 1; min-width: 400px;">
      <table id="sheetTable"></table>
    </div>

    <aside style="flex: 1; min-width: 300px;">
      <div>
        <label>Názov grafu</label>
        <input id="chartTitle" placeholder="Názov grafu...">
      </div>
      <div>
        <label>X os</label>
        <select id="xColumn"></select>
      </div>
      <div>
        <label>Y os (Ctrl pre viac)</label>
        <select id="yColumns" multiple size="6"></select>
      </div>
      <div class="row">
        <select id="chartType">
          <option value="line">Čiarový</option>
          <option value="bar">Stĺpcový</option>
          <option value="pie">Koláčový</option>
          <option value="scatter">Bodový</option>
          <option value="area">Plošný</option>
        </select>
        <button id="generateChart" class="primary">📈 Generovať</button>
      </div>
      <canvas id="chartCanvas" style="margin-top:10px; max-height:400px;"></canvas>
      <div id="chartInfo" style="margin-top:8px; font-size:13px;"></div>
    </aside>
  </div>

  <div class="footer">Tip: hlavičky stĺpcov = názov + jednotka (U [V], I [A]).</div>
</div>

<script>
/* ---------------- Grid & Spreadsheet ---------------- */
let rows = 10, cols = 5;
let headers = [], grid = {};
const sheetTable = document.getElementById('sheetTable');
const xColumnSel = document.getElementById('xColumn');
const yColumnsSel = document.getElementById('yColumns');

function colName(i){ return String.fromCharCode(65+i); }
function key(r,c){ return r+','+c; }
function getRaw(r,c){ return grid[key(r,c)]||''; }
function setRaw(r,c,v){ if(!v) delete grid[key(r,c)]; else grid[key(r,c)]=v; }

function initHeaders(){ headers=[]; for(let i=0;i<cols;i++) headers.push(colName(i)); }
function renderGrid(){
  sheetTable.innerHTML='';
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  trh.appendChild(document.createElement('th'));
  headers.forEach(h=>{
    const th = document.createElement('th');
    th.contentEditable = true; th.textContent=h;
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  sheetTable.appendChild(thead);

  const tbody = document.createElement('tbody');
  for(let r=0;r<rows;r++){
    const tr = document.createElement('tr');
    const th = document.createElement('th'); th.textContent=r+1; tr.appendChild(th);
    for(let c=0;c<cols;c++){
      const td = document.createElement('td'); td.className='cell';
      td.contentEditable=true; td.dataset.r=r; td.dataset.c=c;
      td.textContent = getRaw(r,c);
      td.addEventListener('input', e=>{
        setRaw(r,c,e.target.textContent); 
      });
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  sheetTable.appendChild(tbody);
  updateColumnSelectors();
}

/* Add / Remove rows & columns */
document.getElementById('addRow').onclick = ()=>{ rows++; renderGrid(); }
document.getElementById('delRow').onclick = ()=>{ if(rows>1){ rows--; renderGrid(); } }
document.getElementById('addCol').onclick = ()=>{ cols++; initHeaders(); renderGrid(); }
document.getElementById('delCol').onclick = ()=>{ if(cols>1){ cols--; initHeaders(); renderGrid(); } }

/* Column selectors for chart */
function updateColumnSelectors(){
  xColumnSel.innerHTML=''; yColumnsSel.innerHTML='';
  headers.forEach((h,i)=>{
    const optX = document.createElement('option'); optX.value=i; optX.textContent=h; xColumnSel.appendChild(optX);
    const optY = document.createElement('option'); optY.value=i; optY.textContent=h; yColumnsSel.appendChild(optY);
  });
}

/* ---------------- Auto-Derive simple physics ---------------- */
document.getElementById('autoDerive').onclick = ()=>{
  const uCol = headers.findIndex(h=>h.toLowerCase().includes('u'));
  const iCol = headers.findIndex(h=>h.toLowerCase().includes('i'));
  if(uCol>=0 && iCol>=0){
    headers.push('R [Ω]'); cols++;
    for(let r=0;r<rows;r++){
      const U = Number(getRaw(r,uCol)||0);
      const I = Number(getRaw(r,iCol)||0);
      setRaw(r,cols-1, I? (U/I).toFixed(2): '');
    }
    renderGrid();
  }else alert('Hlavičky U a I neexistujú.');
};

/* ---------------- Chart.js ---------------- */
let chart = null;
const ctx = document.getElementById('chartCanvas').getContext('2d');

document.getElementById('generateChart').onclick = ()=>{
  const xIndex = Number(xColumnSel.value||0);
  const yIndices = Array.from(yColumnsSel.selectedOptions).map(o=>Number(o.value));
  if(yIndices.length===0) yIndices.push(0);

  const labels = [];
  for(let r=0;r<rows;r++){
    const v=getRaw(r,xIndex); labels.push(v||String(r+1));
  }

  const datasets = yIndices.map((y,i)=>{
    const data = [];
    for(let r=0;r<rows;r++) data.push(Number(getRaw(r,y))||0);
    const colors = ['#60a5fa','#34d399','#f97316','#f43f5e'];
    return {label: headers[y], data, borderColor:colors[i%colors.length], backgroundColor:colors[i%colors.length]+'33', fill:false};
  });

  if(chart) chart.destroy();
  chart = new Chart(ctx, {type: document.getElementById('chartType').value==='area'?'line':document.getElementById('chartType').value, data:{labels,datasets}});
};
initHeaders(); renderGrid();
</script>
</body>
</html>
