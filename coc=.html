<!DOCTYPE html>
<html lang="sk" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash of Clans // Ultimate TH19 Matrix (A-Z)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        coc: {
                            dark: '#0f172a',
                            panel: '#1e293b',
                            border: '#334155',
                            gold: '#fbbf24',
                            accent: '#38bdf8',
                            danger: '#f43f5e',
                            success: '#10b981'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .coc-card { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(251, 191, 36, 0.3); }
    </style>
</head>
<body class="min-h-screen p-3 sm:p-6 flex flex-col items-center">

    <!-- HLAVIČKA -->
    <header class="w-full max-w-6xl text-center mb-6">
        <h1 class="text-2xl sm:text-4xl font-black tracking-wider text-coc-gold uppercase drop-shadow-lg">
            ⚔️ Clash of Clans: TH19 Ultimate Matrix (A-Z)
        </h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1 font-mono">Kompletný detailný porovnávač pre hrdinov, petov, bodyguardov, budovy a laboratórium od A po Z</p>
    </header>

    <!-- DVA HRÁČI -->
    <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">

        <!-- HRÁČ 1 -->
        <div class="coc-card rounded-2xl p-4 sm:p-6 shadow-2xl flex flex-col">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-700">
                <input type="text" id="p1-name" value="Hráč 1 (Kamoš)" class="bg-slate-900 border border-slate-700 text-coc-gold font-bold px-3 py-1.5 rounded-xl text-sm w-3/5 focus:outline-none focus:border-coc-gold">
                <div class="text-right">
                    <span class="text-xs font-mono text-slate-400">Skóre: </span>
                    <span id="p1-score" class="text-lg font-mono font-black text-coc-gold">0 pts</span>
                </div>
            </div>

            <div class="flex justify-between items-center mb-4">
                <button onclick="setMaxForPlayer(1)" class="px-3 py-1 bg-amber-500/20 border border-amber-500/50 text-amber-300 text-xs font-bold rounded-xl active:scale-95 transition">⚡ Všetko Max (TH19)</button>
                <button onclick="setZeroForPlayer(1)" class="px-3 py-1 bg-rose-500/20 border border-rose-500/50 text-rose-300 text-xs font-bold rounded-xl active:scale-95 transition">❌ Všetko 0</button>
            </div>

            <div id="p1-items-container" class="space-y-3 flex-1 overflow-y-auto max-h-[560px] pr-1"></div>
        </div>

        <!-- HRÁČ 2 -->
        <div class="coc-card rounded-2xl p-4 sm:p-6 shadow-2xl flex flex-col">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-700">
                <input type="text" id="p2-name" value="Erik PRO (TH19)" class="bg-slate-900 border border-slate-700 text-coc-gold font-bold px-3 py-1.5 rounded-xl text-sm w-3/5 focus:outline-none focus:border-coc-gold">
                <div class="text-right">
                    <span class="text-xs font-mono text-slate-400">Skóre: </span>
                    <span id="p2-score" class="text-lg font-mono font-black text-coc-gold">0 pts</span>
                </div>
            </div>

            <div class="flex justify-between items-center mb-4">
                <button onclick="setMaxForPlayer(2)" class="px-3 py-1 bg-amber-500/20 border border-amber-500/50 text-amber-300 text-xs font-bold rounded-xl active:scale-95 transition">⚡ Všetko Max (TH19)</button>
                <button onclick="setZeroForPlayer(2)" class="px-3 py-1 bg-rose-500/20 border border-rose-500/50 text-rose-300 text-xs font-bold rounded-xl active:scale-95 transition">❌ Všetko 0</button>
            </div>

            <div id="p2-items-container" class="space-y-3 flex-1 overflow-y-auto max-h-[560px] pr-1"></div>
        </div>

    </div>

    <!-- VÝSLEDKOVÝ PANEL -->
    <div class="w-full max-w-6xl coc-card rounded-2xl p-6 text-center shadow-2xl border-2 border-coc-gold/40">
        <h2 class="text-lg font-black text-coc-gold uppercase tracking-wider mb-2">🏆 Clash Verdict (Celkové vyhodnotenie)</h2>
        <p id="verdict-text" class="text-sm sm:text-base font-semibold text-slate-200">Zadaj levely položiek a porovnanie sa vyhodnotí automaticky.</p>
    </div>

    <!-- JAVASCRIPT MASTER ZOZNAM OD A PO Z -->
    <script>
        const masterItems = [
            // 1. Hlavné budovy
            { id: 'th', name: 'Town Hall (Hlavná budova)', category: '🏛️ Hlavná dedina', maxLevel: 19, weight: 100 },
            { id: 'clan_castle', name: 'Clan Castle (Klanový hrad)', category: '🏛️ Hlavná dedina', maxLevel: 13, weight: 50 },
            { id: 'guardian_shrine', name: 'Guardian Shrine', category: '🏛️ Hlavná dedina', maxLevel: 4, weight: 60 },

            // 2. Hrdinovia (Samostatne)
            { id: 'hero_bk', name: 'Barbarian King', category: '👑 Hrdinovia', maxLevel: 105, weight: 45 },
            { id: 'hero_aq', name: 'Archer Queen', category: '👑 Hrdinovia', maxLevel: 105, weight: 45 },
            { id: 'hero_gw', name: 'Grand Warden', category: '👑 Hrdinovia', maxLevel: 80, weight: 50 },
            { id: 'hero_rc', name: 'Royal Champion', category: '👑 Hrdinovia', maxLevel: 55, weight: 50 },
            { id: 'hero_minion', name: 'Minion Prince (5. Hrdina)', category: '👑 Hrdinovia', maxLevel: 45, weight: 50 },

            // 3. Pety / Bodyguardi (Každý osobitne)
            { id: 'pet_lassi', name: 'L.A.S.S.I', category: '🐾 Pety & Bodyguardi', maxLevel: 10, weight: 30 },
            { id: 'pet_owl', name: 'Electro Owl', category: '🐾 Pety & Bodyguardi', maxLevel: 10, weight: 30 },
            { id: 'pet_yak', name: 'Mighty Yak', category: '🐾 Pety & Bodyguardi', maxLevel: 10, weight: 30 },
            { id: 'pet_unicorn', name: 'Unicorn', category: '🐾 Pety & Bodyguardi', maxLevel: 10, weight: 35 },
            { id: 'pet_diggy', name: 'Diggy', category: '🐾 Pety & Bodyguardi', maxLevel: 10, weight: 35 },
            { id: 'pet_lizard', name: 'Poison Lizard', category: '🐾 Pety & Bodyguardi', maxLevel: 10, weight: 30 },
            { id: 'pet_phoenix', name: 'Phoenix', category: '🐾 Pety & Bodyguardi', maxLevel: 10, weight: 35 },
            { id: 'pet_fox', name: 'Spirit Fox', category: '🐾 Pety & Bodyguardi', maxLevel: 10, weight: 35 },

            // 4. Guardians / Strážcovia (Z fotky č.2)
            { id: 'guardian_1', name: 'Guardian Smasher / Hlavný strážca', category: '🛡️ Guardians', maxLevel: 10, weight: 40 },
            { id: 'guardian_2', name: 'Guardian Tank / Druhý strážca', category: '🛡️ Guardians', maxLevel: 10, weight: 40 },
            { id: 'guardian_3', name: 'Guardian Support / Tretí strážca', category: '🛡️ Guardians', maxLevel: 10, weight: 40 },

            // 5. Merge & Endgame Obrany
            { id: 'monolith', name: 'Monolith', category: '🔥 Merge & Endgame Obrany', maxLevel: 5, weight: 70 },
            { id: 'spell_tower', name: 'Spell Tower', category: '🔥 Merge & Endgame Obrany', maxLevel: 5, weight: 60 },
            { id: 'firecracker_tower', name: 'Firecracker Tower', category: '🔥 Merge & Endgame Obrany', maxLevel: 6, weight: 65 },
            { id: 'spiky_tower', name: 'Spiky Tower', category: '🔥 Merge & Endgame Obrany', maxLevel: 6, weight: 70 },
            { id: 'multi_archer', name: 'Multi-Archer Tower (Merge)', category: '🔥 Merge & Endgame Obrany', maxLevel: 5, weight: 55 },
            { id: 'ricochet_cannon', name: 'Ricochet Cannon (Merge)', category: '🔥 Merge & Endgame Obrany', maxLevel: 5, weight: 55 },

            // 6. Klasické obrany (Priemerný level)
            { id: 'cannon', name: 'Cannon (Priemer všetkých)', category: '🏰 Klasické Obrany', maxLevel: 22, weight: 35 },
            { id: 'archer_tower', name: 'Archer Tower (Priemer všetkých)', category: '🏰 Klasické Obrany', maxLevel: 22, weight: 35 },
            { id: 'mortar', name: 'Mortar (Priemer všetkých)', category: '🏰 Klasické Obrany', maxLevel: 17, weight: 30 },
            { id: 'air_defense', name: 'Air Defense (Priemer všetkých)', category: '🏰 Klasické Obrany', maxLevel: 15, weight: 45 },
            { id: 'wizard_tower', name: 'Wizard Tower (Priemer všetkých)', category: '🏰 Klasické Obrany', maxLevel: 17, weight: 40 },
            { id: 'inferno', name: 'Inferno Tower (Priemer všetkých)', category: '🏰 Klasické Obrany', maxLevel: 11, weight: 50 },
            { id: 'xbow', name: 'X-Bow (Priemer všetkých)', category: '🏰 Klasické Obrany', maxLevel: 13, weight: 40 },
            { id: 'scattershot', name: 'Scattershot (Priemer všetkých)', category: '🏰 Klasické Obrany', maxLevel: 7, weight: 50 },
            { id: 'eagle_artillery', name: 'Eagle Artillery', category: '🏰 Klasické Obrany', maxLevel: 7, weight: 50 },

            // 7. Múry a pasce
            { id: 'walls', name: 'Múry (Priemerný level)', category: '🧱 Múry & Pasce', maxLevel: 20, weight: 100 },
            { id: 'traps', name: 'Pasce (Pokrok pascí)', category: '🧱 Múry & Pasce', maxLevel: 10, weight: 40 }
        ];

        function renderPlayerUI(playerNum) {
            const container = document.getElementById(`p${playerNum}-items-container`);
            container.innerHTML = '';

            const categories = [...new Set(masterItems.map(i => i.category))];

            categories.forEach(cat => {
                const catItems = masterItems.filter(item => item.category === cat);
                if (catItems.length === 0) return;

                let catHtml = `<div class="text-xs font-mono font-bold text-coc-gold uppercase tracking-wider mt-3 mb-1">${cat}</div>`;
                
                catItems.forEach(item => {
                    catHtml += `
                        <div class="flex items-center justify-between bg-slate-900/80 border border-slate-800 p-2.5 rounded-xl gap-2">
                            <div class="flex flex-col flex-1 min-w-0">
                                <span class="text-xs text-slate-200 font-medium truncate">${item.name}</span>
                                <span class="text-[10px] font-mono text-slate-400">Max: ${item.maxLevel}</span>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <input type="number" min="0" max="${item.maxLevel}" value="${item.maxLevel}" 
                                    data-item="${item.id}" data-max="${item.maxLevel}" data-player="${playerNum}"
                                    oninput="calculateScores()"
                                    class="p${playerNum}-input w-16 bg-slate-950 border border-slate-700 text-coc-gold text-xs font-mono font-bold text-center rounded-lg focus:outline-none focus:border-coc-gold py-1">
                            </div>
                        </div>
                    `;
                });
                container.innerHTML += catHtml;
            });
            calculateScores();
        }

        function setMaxForPlayer(playerNum) {
            document.querySelectorAll(`.p${playerNum}-input`).forEach(input => {
                input.value = input.getAttribute('data-max');
            });
            calculateScores();
        }

        function setZeroForPlayer(playerNum) {
            document.querySelectorAll(`.p${playerNum}-input`).forEach(input => {
                input.value = 0;
            });
            calculateScores();
        }

        function calculateScores() {
            const p1Name = document.getElementById('p1-name').value || 'Hráč 1';
            const p2Name = document.getElementById('p2-name').value || 'Hráč 2';
            
            let p1Total = 0;
            let p2Total = 0;

            document.querySelectorAll('.p1-input').forEach(input => {
                const itemId = input.getAttribute('data-item');
                const val = parseInt(input.value) || 0;
                const itemDef = masterItems.find(i => i.id === itemId);
                if (itemDef && val > 0) {
                    p1Total += (val / itemDef.maxLevel) * itemDef.weight;
                }
            });

            document.querySelectorAll('.p2-input').forEach(input => {
                const itemId = input.getAttribute('data-item');
                const val = parseInt(input.value) || 0;
                const itemDef = masterItems.find(i => i.id === itemId);
                if (itemDef && val > 0) {
                    p2Total += (val / itemDef.maxLevel) * itemDef.weight;
                }
            });

            document.getElementById('p1-score').textContent = `${Math.round(p1Total)} pts`;
            document.getElementById('p2-score').textContent = `${Math.round(p2Total)} pts`;

            const verdictEl = document.getElementById('verdict-text');
            if (p2Total > p1Total) {
                const diff = Math.round(p2Total - p1Total);
                verdictEl.innerHTML = `🔥 <span class="text-coc-gold font-bold">${p2Name}</span> víťazí a je napred o <span class="text-emerald-400">${diff} bodov</span> v celkovom progrese!`;
            } else if (p1Total > p2Total) {
                const diff = Math.round(p1Total - p2Total);
                verdictEl.innerHTML = `🔥 <span class="text-coc-gold font-bold">${p1Name}</span> víťazí a je napred o <span class="text-emerald-400">${diff} bodov</span> v celkovom progrese!`;
            } else {
                verdictEl.innerHTML = `⚖️ Obaja hráči majú presne <span class="text-cyan-400">rovnaké skóre</span>!`;
            }
        }

        window.addEventListener('load', () => {
            renderPlayerUI(1);
            renderPlayerUI(2);
        });
    </script>
</body>
</html>
