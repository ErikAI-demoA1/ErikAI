                extend: {
                    colors: {
                        coc: {
                            dark: '#0f172a',
                            panel: '#1e293b',
                            border: '#334155',

            .coc-card { background: #ffffff !important; border: 1px solid #94a3b8 !important; box-shadow: none !important; }
            .row-item { background: #f8fafc !important; border-color: #cbd5e1 !important; page-break-inside: avoid; }
            .text-slate-200 { color: #0f172a !important; }
            .text-slate-400 { color: #475569 !important; }
            .text-coc-gold { color: #b45309 !important; }

            { id: 'arm_pethouse', name: 'Pet House', category: '⚡ Resource & Armáda', maxLevel: 12, weight: 35 },

            // 🧱 PASCE (TRAPS)
            { id: 'tr_bomb', name: 'Bomb', category: '🧱 Pasce', maxLevel: 14, weight: 15 },
            { id: 'tr_spring', name: 'Spring Trap', category: '🧱 Pasce', maxLevel: 14, weight: 15 },
            { id: 'tr_abomb', name: 'Air Bomb', category: '🧱 Pasce', maxLevel: 14, weight: 15 },
            { id: 'tr_gbomb', name: 'Giant Bomb', category: '🧱 Pasce', maxLevel: 12, weight: 20 },
            { id: 'tr_sam', name: 'Seeking Air Mine', category: '🧱 Pasce', maxLevel: 8, weight: 20 },
            { id: 'tr_skeleton', name: 'Skeleton Trap', category: '🧱 Pasce', maxLevel: 5, weight: 15 },
            { id: 'tr_tornado', name: 'Tornado Trap', category: '🧱 Pasce', maxLevel: 3, weight: 20 },
            { id: 'tr_gigabomb', name: 'Giga Bomb', category: '🧱 Pasce', maxLevel: 4, weight: 25 }
        ];

        function renderMatrix() {
            const container = document.getElementById('matrix-container');
            container.innerHTML = '';

            const saved1 = JSON.parse(localStorage.getItem('coc_player_1') || '{}');
            const saved2 = JSON.parse(localStorage.getItem('coc_player_2') || '{}');

            if (saved1.name) document.getElementById('p1-name').value = saved1.name;
            if (saved2.name) document.getElementById('p2-name').value = saved2.name;

            const categories = [...new Set(masterItems.map(i => i.category))];

            categories.forEach(cat => {
                const catItems = masterItems.filter(item => item.category === cat);
                if (catItems.length === 0) return;

                let categoryHTML = `
                    <div class="space-y-1.5">
                        <div class="text-xs font-mono font-bold text-coc-gold uppercase tracking-wider pt-2 pb-1 border-b border-slate-700">${cat}</div>
                `;

                catItems.forEach(item => {
                    const val1 = (saved1.items && saved1.items[item.id] !== undefined) ? saved1.items[item.id] : item.maxLevel;
                    const val2 = (saved2.items && saved2.items[item.id] !== undefined) ? saved2.items[item.id] : item.maxLevel;

                    categoryHTML += `
                        <div class="row-item grid grid-cols-12 gap-2 items-center bg-slate-900/80 border border-slate-800 px-2.5 py-1.5 rounded-lg">
                            <div class="col-span-4 flex flex-col min-w-0">
                                <span class="text-xs text-slate-200 font-medium truncate">${item.name}</span>
                                <span class="text-[10px] font-mono text-slate-400">Max: ${item.maxLevel}</span>
                            </div>
                            <div class="col-span-4 flex justify-center">
                                <input type="number" min="0" max="${item.maxLevel}" value="${val1}"
                                    data-item="${item.id}" data-max="${item.maxLevel}"
                                    oninput="saveData(); calculateScores();"
                                    class="export-input p1-input w-16 sm:w-20 bg-slate-950 border border-slate-700 text-cyan-400 text-xs font-mono font-bold text-center rounded-md focus:outline-none focus:border-cyan-400 py-1">
                            </div>
                            <div class="col-span-4 flex justify-center">
                                <input type="number" min="0" max="${item.maxLevel}" value="${val2}"
                                    data-item="${item.id}" data-max="${item.maxLevel}"
                                    oninput="saveData(); calculateScores();"
                                    class="export-input p2-input w-16 sm:w-20 bg-slate-950 border border-slate-700 text-emerald-400 text-xs font-mono font-bold text-center rounded-md focus:outline-none focus:border-emerald-400 py-1">
                            </div>
                        </div>
                    `;
                });

                categoryHTML += `</div>`;
                container.innerHTML += categoryHTML;
            });

            calculateScores();
        }

        function saveData() {
            const p1Items = {};
            const p2Items = {};

            document.querySelectorAll('.p1-input').forEach(inp => {
                p1Items[inp.getAttribute('data-item')] = parseInt(inp.value) || 0;
            });
            document.querySelectorAll('.p2-input').forEach(inp => {
                p2Items[inp.getAttribute('data-item')] = parseInt(inp.value) || 0;
            });

            localStorage.setItem('coc_player_1', JSON.stringify({
                name: document.getElementById('p1-name').value,
                items: p1Items
            }));
            localStorage.setItem('coc_player_2', JSON.stringify({
                name: document.getElementById('p2-name').value,
                items: p2Items
            }));
        }

        function setMaxForPlayer(playerNum) {
            document.querySelectorAll(`.p${playerNum}-input`).forEach(inp => {
                inp.value = inp.getAttribute('data-max');
            });
            saveData();
            calculateScores();
        }

        function setZeroForPlayer(playerNum) {
            document.querySelectorAll(`.p${playerNum}-input`).forEach(inp => {
                inp.value = 0;
            });
            saveData();
            calculateScores();
        }

        function calculateScores() {
            let p1Total = 0;
            let p2Total = 0;

            document.querySelectorAll('.p1-input').forEach(inp => {
                const val = parseInt(inp.value) || 0;
                const def = masterItems.find(i => i.id === inp.getAttribute('data-item'));
                if (def && val > 0) p1Total += (val / def.maxLevel) * def.weight;
            });

            document.querySelectorAll('.p2-input').forEach(inp => {
                const val = parseInt(inp.value) || 0;
                const def = masterItems.find(i => i.id === inp.getAttribute('data-item'));
                if (def && val > 0) p2Total += (val / def.maxLevel) * def.weight;
            });

            document.getElementById('p1-score').textContent = `${Math.round(p1Total)} pts`;
            document.getElementById('p2-score').textContent = `${Math.round(p2Total)} pts`;

            const p1Name = document.getElementById('p1-name').value || 'Hráč 1';
            const p2Name = document.getElementById('p2-name').value || 'Hráč 2';
            const verdict = document.getElementById('verdict-text');

            if (p2Total > p1Total) {
                verdict.innerHTML = `🏆 <span class="text-emerald-400">${p2Name}</span> vedie o <span class="text-coc-gold">${Math.round(p2Total - p1Total)} bodov</span> oproti hráčovi ${p1Name}!`;
            } else if (p1Total > p2Total) {
                verdict.innerHTML = `🏆 <span class="text-cyan-400">${p1Name}</span> vedie o <span class="text-coc-gold">${Math.round(p1Total - p2Total)} bodov</span> oproti hráčovi ${p2Name}!`;
            } else {
                verdict.innerHTML = `⚖️ Remíza! Obaja hráči majú presne <span class="text-coc-gold">${Math.round(p1Total)} bodov</span>.`;
            }
        }

        // EXPORT OBRÁZKA (PNG)
        function exportAsImage() {
            const container = document.getElementById('export-container');
            const matrixBox = document.getElementById('matrix-container');
            const noPrints = container.querySelectorAll('.no-print');
            const inputs = container.querySelectorAll('.export-input');

            noPrints.forEach(el => el.style.display = 'none');
            matrixBox.style.maxHeight = 'none';
            matrixBox.style.overflow = 'visible';

            const tempSpans = [];
            inputs.forEach(inp => {
                const span = document.createElement('span');
                span.textContent = inp.value;
                span.className = inp.className;
                span.style.display = 'inline-block';
                span.style.lineHeight = '1.4';
                inp.style.display = 'none';
                inp.parentNode.insertBefore(span, inp);
                tempSpans.push({ span, inp });
            });

            html2canvas(container, {
                backgroundColor: '#0b0f19',
                scale: 2,
                useCORS: true,
                windowWidth: 950
            }).then(canvas => {
                tempSpans.forEach(({ span, inp }) => {
                    span.remove();
                    inp.style.display = '';
                });
                noPrints.forEach(el => el.style.display = '');
                matrixBox.style.maxHeight = '65vh';
                matrixBox.style.overflow = 'auto';

                const link = document.createElement('a');
                link.download = 'coc_th19_porovnanie.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function exportAsJSON() {
            const data = {
                player1: JSON.parse(localStorage.getItem('coc_player_1') || '{}'),
                player2: JSON.parse(localStorage.getItem('coc_player_2') || '{}')
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'coc_matrix_data.json';
            a.click();
        }

        function exportAsHTML() {
            const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'coc_th19_matrix.html';
            a.click();
        }

        window.addEventListener('load', renderMatrix);
    </script>
</body>
</html>
