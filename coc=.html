<!DOCTYPE html>
<html lang="sk" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash of Clans // Ultimate TH19 Power Matrix</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        coc: {
                            dark: '#0f172a',
                            panel: '#1e293b',
                            border: '#334155',
                            gold: '#fbbf24',
                            accent: '#38bdf8',
                            danger: '#f43f5e',
                            success: '#10b981'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .coc-card { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(251, 191, 36, 0.25); }
    </style>
</head>
<body class="min-h-screen p-3 sm:p-6 flex flex-col items-center">

    <!-- HLAVIČKA -->
    <header class="w-full max-w-6xl text-center mb-6">
        <h1 class="text-2xl sm:text-4xl font-black tracking-wider text-coc-gold uppercase drop-shadow-lg">
            ⚔️ Clash of Clans: Ultimate TH19 Matrix
        </h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1 font-mono">Detailný porovnávač všetkých budov, merge obrán, hrdinov a petov od A po Z (S automatickým sprievodcom TH)</p>
    </header>

    <!-- DVA HRÁČI -->
    <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">

        <!-- HRÁČ 1 -->
        <div class="coc-card rounded-2xl p-4 sm:p-6 shadow-2xl flex flex-col">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-700">
                <input type="text" id="p1-name" value="Hráč 1 (napr. Kamoš)" class="bg-slate-900 border border-slate-700 text-coc-gold font-bold px-3 py-1.5 rounded-xl text-sm w-3/5 focus:outline-none focus:border-coc-gold">
                <div class="text-right">
                    <span class="text-xs font-mono text-slate-400">Skóre: </span>
                    <span id="p1-score" class="text-lg font-mono font-black text-coc-gold">0 pts</span>
                </div>
            </div>

            <div class="flex justify-between items-center mb-4">
                <button onclick="setMaxForPlayer(1)" class="px-3 py-1 bg-amber-500/20 border border-amber-500/50 text-amber-300 text-xs font-bold rounded-xl active:scale-95 transition">⚡ Všetko Max (TH19)</button>
                <button onclick="setZeroForPlayer(1)" class="px-3 py-1 bg-rose-500/20 border border-rose-500/50 text-rose-300 text-xs font-bold rounded-xl active:scale-95 transition">❌ Všetko 0</button>
            </div>

            <div id="p1-items-container" class="space-y-3 flex-1 overflow-y-auto max-h-[520px] pr-1"></div>
        </div>

        <!-- HRÁČ 2 -->
        <div class="coc-card rounded-2xl p-4 sm:p-6 shadow-2xl flex flex-col">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-700">
                <input type="text" id="p2-name" value="Hráč 2 (Ja)" class="bg-slate-900 border border-slate-700 text-coc-gold font-bold px-3 py-1.5 rounded-xl text-sm w-3/5 focus:outline-none focus:border-coc-gold">
                <div class="text-right">
                    <span class="text-xs font-mono text-slate-400">Skóre: </span>
                    <span id="p2-score" class="text-lg font-mono font-black text-coc-gold">0 pts</span>
                </div>
            </div>

            <div class="flex justify-between items-center mb-4">
                <button onclick="setMaxForPlayer(2)" class="px-3 py-1 bg-amber-500/20 border border-amber-500/50 text-amber-300 text-xs font-bold rounded-xl active:scale-95 transition">⚡ Všetko Max (TH19)</button>
                <button onclick="setZeroForPlayer(2)" class="px-3 py-1 bg-rose-500/20 border border-rose-500/50 text-rose-300 text-xs font-bold rounded-xl active:scale-95 transition">❌ Všetko 0</button>
            </div>

            <div id="p2-items-container" class="space-y-3 flex-1 overflow-y-auto max-h-[520px] pr-1"></div>
        </div>

    </div>

    <!-- VÝSLEDKOVÝ PANEL -->
    <div class="w-full max-w-6xl coc-card rounded-2xl p-6 text-center shadow-2xl border-2 border-coc-gold/40">
        <h2 class="text-lg font-black text-coc-gold uppercase tracking-wider mb-2">🏆 Clash Verdict (Celkové vyhodnotenie)</h2>
        <p id="verdict-text" class="text-sm sm:text-base font-semibold text-slate-200">Zadaj levely položiek a porovnanie sa vyhodnotí automaticky.</p>
    </div>

    <!-- JAVASCRIPT LOGIKA -->
    <script>
        // Detailný master zoznam pre TH1 až TH19 (Vrátane Merge obrán a Petov/Bodyguardov)
        const masterItems = [
            // Hlavné
            { id: 'th', name: 'Town Hall (Hlavná budova)', category: 'Hlavná dedina', maxLevel: 19, weight: 120, info: 'Max TH19' },
            { id: 'clan_castle', name: 'Clan Castle (Hrad)', category: 'Hlavná dedina', maxLevel: 13, weight: 60, info: 'Zvoľ priemerný level' },
            { id: 'guardian_shrine', name: 'Guardian Shrine (Endgame svätyňa)', category: 'Hlavná dedina', maxLevel: 4, weight: 80, info: 'TH17+' },
            
            // Hrdinovia & Bodyguardi/Pety
            { id: 'hero_bk', name: 'Barbarian King', category: 'Hrdinovia & Pety', maxLevel: 105, weight: 45, info: 'Level hrdinu' },
            { id: 'hero_aq', name: 'Archer Queen', category: 'Hrdinovia & Pety', maxLevel: 105, weight: 45, info: 'Level hrdinu' },
            { id: 'hero_gw', name: 'Grand Warden', category: 'Hrdinovia & Pety', maxLevel: 80, weight: 50, info: 'Level hrdinu' },
            { id: 'hero_rc', name: 'Royal Champion', category: 'Hrdinovia & Pety', maxLevel: 55, weight: 50, info: 'Level hrdinu' },
            { id: 'hero_minion', name: 'Minion Prince (5. Hrdina)', category: 'Hrdinovia & Pety', maxLevel: 45, weight: 50, info: 'TH16+' },
            { id: 'pets_primary', name: 'Hlavní Pety / Bodyguardi (Priemer 3 naj)', category: 'Hrdinovia & Pety', maxLevel: 10, weight: 55, info: 'Zadaj priemer levelov' },

            // Špeciálne & Merge Obrany
            { id: 'monolith', name: 'Monolith', category: 'Merge & Špeciálne Obrany', maxLevel: 5, weight: 75, info: 'TH15+' },
            { id: 'spell_tower', name: 'Spell Tower', category: 'Merge & Špeciálne Obrany', maxLevel: 5, weight: 65, info: 'TH15+' },
            { id: 'firecracker_tower', name: 'Firecracker Tower', category: 'Merge & Špeciálne Obrany', maxLevel: 6, weight: 70, info: 'TH17+' },
            { id: 'spiky_tower', name: 'Spiky Tower', category: 'Merge & Špeciálne Obrany', maxLevel: 6, weight: 75, info: 'TH18+' },
            { id: 'multi_archer_tower', name: 'Multi-Archer Tower (Merge)', category: 'Merge & Špeciálne Obrany', maxLevel: 5, weight: 60, info: 'TH15+' },
            { id: 'ricochet_cannon', name: 'Ricochet Cannon (Merge)', category: 'Merge & Špeciálne Obrany', maxLevel: 5, weight: 60, info: 'TH15+' },

            // Klasické obrany (s poznámkou o priemere)
            { id: 'cannon', name: 'Cannon (Priemer všetkých)', category: 'Klasické Obrany', maxLevel: 22, weight: 40, info: 'Zadaj priemer (napr. 15)' },
            { id: 'archer_tower', name: 'Archer Tower (Priemer všetkých)', category: 'Klasické Obrany', maxLevel: 22, weight: 40, info: 'Zadaj priemer' },
            { id: 'mortar', name: 'Mortar (Priemer všetkých)', category: 'Klasické Obrany', maxLevel: 17, weight: 35, info: 'Zadaj priemer' },
            { id: 'air_defense', name: 'Air Defense (Priemer všetkých)', category: 'Klasické Obrany', maxLevel: 15, weight: 50, info: 'Zadaj priemer' },
            { id: 'wizard_tower', name: 'Wizard Tower (Priemer všetkých)', category: 'Klasické Obrany', maxLevel: 17, weight: 45, info: 'Zadaj priemer' },
            { id: 'inferno', name: 'Inferno Tower (Priemer všetkých)', category: 'Klasické Obrany', maxLevel: 11, weight: 55, info: 'Zadaj priemer' },
            { id: 'xbow', name: 'X-Bow (Priemer všetkých)', category: 'Klasické Obrany', maxLevel: 13, weight: 45, info: 'Zadaj priemer' },
            { id: 'scattershot', name: 'Scattershot (Priemer všetkých)', category: 'Klasické Obrany', maxLevel: 7, weight: 55, info: 'Zadaj priemer' },
            { id: 'eagle_artillery', name: 'Eagle Artillery', category: 'Klasické Obrany', maxLevel: 7, weight: 55, info: 'Max level' },
            { id: 'builder_huts', name: 'Builder Huts (Bojové budovy)', category: 'Klasické Obrany', maxLevel: 6, weight: 60, info: 'Priemer levelov' },

            // Múry a pasce
            { id: 'walls', name: 'Múry (Priemerný level múrov)', category: 'Múry & Pasce', maxLevel: 20, weight: 130, info: 'Zadaj priemerný level' },
            { id: 'traps', name: 'Pasce (Celkový pokrok pascí)', category: 'Múry & Pasce', maxLevel: 10, weight: 50, info: 'Odhad 1-10' }
        ];

        // Funkcia na odhad Town Hall podľa zadaného levelu a budovy
        function guessTownHall(itemId, level) {
            if (level <= 0) return 'Žiadne / X';
            if (itemId === 'th') return `TH ${level}`;
            if (itemId === 'cannon') {
                if (level <= 3) return 'TH1-2';
                if (level <= 7) return 'TH3-5';
                if (level <= 11) return 'TH6-8';
                if (level <= 15) return 'TH9-11';
                if (level <= 19) return 'TH12-14';
                return 'TH15-19 (Endgame)';
            }
            if (level >= 5 && (itemId.includes('monolith') || itemId.includes('spell_tower'))) return 'TH15+';
            if (level >= 5 && itemId.includes('firecracker')) return 'TH17+';
            return 'Aktivované';
        }

        function renderPlayerUI(playerNum) {
            const container = document.getElementById(`p${playerNum}-items-container`);
            container.innerHTML = '';

            const categories = [...new Set(masterItems.map(i => i.category))];

            categories.forEach(cat => {
                const catItems = masterItems.filter(item => item.category === cat);
                if (catItems.length === 0) return;

                let catHtml = `<div class="text-xs font-mono font-bold text-coc-gold uppercase tracking-wider mt-3 mb-1">${cat}</div>`;
                
                catItems.forEach(item => {
                    catHtml += `
                        <div class="flex items-center justify-between bg-slate-900/80 border border-slate-800 p-2.5 rounded-xl gap-2">
                            <div class="flex flex-col flex-1 min-w-0">
                                <span class="text-xs text-slate-200 font-medium truncate">${item.name}</span>
                                <span class="text-[10px] font-mono text-slate-400">${item.info} • Max: ${item.maxLevel}</span>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <span id="hint-${playerNum}-${item.id}" class="text-[10px] font-mono text-cyan-400 bg-cyan-950/60 px-1.5 py-0.5 rounded border border-cyan-800/50">Max</span>
                                <input type="number" min="0" max="${item.maxLevel}" value="${item.maxLevel}" 
                                    data-item="${item.id}" data-max="${item.maxLevel}" data-player="${playerNum}"
                                    oninput="handleInput(${playerNum}, '${item.id}', this.value)"
                                    class="p${playerNum}-input w-16 bg-slate-950 border border-slate-700 text-coc-gold text-xs font-mono font-bold text-center rounded-lg focus:outline-none focus:border-coc-gold py-1">
                            </div>
                        </div>
                    `;
                });
                container.innerHTML += catHtml;
            });
            calculateScores();
        }

        function handleInput(playerNum, itemId, valStr) {
            let val = parseInt(valStr);
            const itemDef = masterItems.find(i => i.id === itemId);
            const hintEl = document.getElementById(`hint-${playerNum}-${itemId}`);

            if (isNaN(val) || val < 0) val = 0;
            if (val > itemDef.maxLevel) val = itemDef.maxLevel;

            if (hintEl) {
                hintEl.textContent = guessTownHall(itemId, val);
            }
            calculateScores();
        }

        function setMaxForPlayer(playerNum) {
            const inputs = document.querySelectorAll(`.p${playerNum}-input`);
            inputs.forEach(input => {
                const max = input.getAttribute('data-max');
                input.value = max;
                const itemId = input.getAttribute('data-item');
                const hintEl = document.getElementById(`hint-${playerNum}-${itemId}`);
                if (hintEl) hintEl.textContent = 'Max';
            });
            calculateScores();
        }

        function setZeroForPlayer(playerNum) {
            const inputs = document.querySelectorAll(`.p${playerNum}-input`);
            inputs.forEach(input => {
                input.value = 0;
                const itemId = input.getAttribute('data-item');
                const hintEl = document.getElementById(`hint-${playerNum}-${itemId}`);
                if (hintEl) hintEl.textContent = '0 / X';
            });
            calculateScores();
        }

        function calculateScores() {
            const p1Name = document.getElementById('p1-name').value || 'Hráč 1';
            const p2Name = document.getElementById('p2-name').value || 'Hráč 2';
            
            let p1Total = 0;
            let p2Total = 0;

            document.querySelectorAll('.p1-input').forEach(input => {
                const itemId = input.getAttribute('data-item');
                const val = parseInt(input.value) || 0;
                const itemDef = masterItems.find(i => i.id === itemId);
                if (itemDef && val > 0) {
                    p1Total += (val / itemDef.maxLevel) * itemDef.weight;
                }
            });

            document.querySelectorAll('.p2-input').forEach(input => {
                const itemId = input.getAttribute('data-item');
                const val = parseInt(input.value) || 0;
                const itemDef = masterItems.find(i => i.id === itemId);
                if (itemDef && val > 0) {
                    p2Total += (val / itemDef.maxLevel) * itemDef.weight;
                }
            });

            document.getElementById('p1-score').textContent = `${Math.round(p1Total)} pts`;
            document.getElementById('p2-score').textContent = `${Math.round(p2Total)} pts`;

            const verdictEl = document.getElementById('verdict-text');
            if (p2Total > p1Total) {
                const diff = Math.round(p2Total - p1Total);
                verdictEl.innerHTML = `🔥 <span class="text-coc-gold font-bold">${p2Name}</span> víťazí a je napred o <span class="text-emerald-400">${diff} bodov</span> v celkovom reálnom pokroku!`;
            } else if (p1Total > p2Total) {
                const diff = Math.round(p1Total - p2Total);
                verdictEl.innerHTML = `🔥 <span class="text-coc-gold font-bold">${p1Name}</span> víťazí a je napred o <span class="text-emerald-400">${diff} bodov</span> v celkovom reálnom pokroku!`;
            } else {
                verdictEl.innerHTML = `⚖️ Obaja hráči majú presne <span class="text-cyan-400">rovnaké skóre</span>!`;
            }
        }

        window.addEventListener('load', () => {
            renderPlayerUI(1);
            renderPlayerUI(2);
        });
    </script>
</body>
</html>
