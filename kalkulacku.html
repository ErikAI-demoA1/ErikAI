<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI Profesionálna Vedecká Kalkulačka</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #e0e0e0, #ffffff);
    color: #222;
    text-align: center;
    padding: 2rem;
  }
  body.dark-mode { background: #121212; color: white; }
  h1 { color: #d62828; margin-bottom: 1rem; font-weight: 700; }
  #calcDisplay {
    width: 100%;
    max-width: 400px;
    font-size: 2rem;
    padding: 1rem;
    margin-bottom: 1rem;
    border: 2px solid #d62828;
    border-radius: 12px;
    text-align: right;
    outline: none;
    background: #fff;
    color: #222;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }
  body.dark-mode #calcDisplay { background: #1e1e1e; color: white; border-color: #ff5555; }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    max-width: 400px;
    margin: 0 auto;
  }
  .buttons button {
    padding: 1rem;
    font-size: 1.2rem;
    background-color: #d62828;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
  }
  .buttons button:hover { background-color: #b71d1d; }
  #cas { font-size: 16px; margin-top: 1rem; }
</style>
</head>
<body>

<button onclick="toggleTheme()">🌓 Zmeniť režim</button>

<h1>🧪 ErikAI Profesionálna Vedecká Kalkulačka</h1>
<input type="text" id="calcDisplay" spellcheck="false" autocapitalize="off" autocomplete="off">

<div class="buttons">
  <button onclick="appendCalc('sin(')">sin</button>
  <button onclick="appendCalc('cos(')">cos</button>
  <button onclick="appendCalc('tan(')">tan</button>
  <button onclick="appendCalc('sqrt(')">√</button>

  <button onclick="appendCalc('7')">7</button>
  <button onclick="appendCalc('8')">8</button>
  <button onclick="appendCalc('9')">9</button>
  <button onclick="appendCalc('/')">÷</button>

  <button onclick="appendCalc('4')">4</button>
  <button onclick="appendCalc('5')">5</button>
  <button onclick="appendCalc('6')">6</button>
  <button onclick="appendCalc('*')">×</button>

  <button onclick="appendCalc('1')">1</button>
  <button onclick="appendCalc('2')">2</button>
  <button onclick="appendCalc('3')">3</button>
  <button onclick="appendCalc('-')">−</button>

  <button onclick="appendCalc('0')">0</button>
  <button onclick="appendCalc('^')">^</button>
  <button onclick="calculate()">=</button>
  <button onclick="appendCalc('+')">+</button>

  <button onclick="appendCalc('log(')">log</button>
  <button onclick="appendCalc('ln(')">ln</button>
  <button onclick="appendCalc('π')">π</button>
  <button onclick="appendCalc('e')">e</button>

  <button onclick="clearCalc()">C</button>
</div>

<p id="cas"></p>

<script>
const display = document.getElementById("calcDisplay");

function toggleTheme() { document.body.classList.toggle('dark-mode'); }

function appendCalc(value) {
  const start = display.selectionStart;
  const end = display.selectionEnd;
  display.value = display.value.slice(0, start) + value + display.value.slice(end);
  display.selectionStart = display.selectionEnd = start + value.length;
  display.focus();
}

function clearCalc() { display.value = ''; }

function degToRad(deg) { return deg * Math.PI / 180; }

function calculate() {
  try {
    let expr = display.value
      .replace(/π/g, Math.PI)
      .replace(/e/g, Math.E)
      .replace(/√\(/g, 'Math.sqrt(')
      .replace(/sin\(/g, x => 'Math.sin(')
      .replace(/cos\(/g, x => 'Math.cos(')
      .replace(/tan\(/g, x => 'Math.tan(')
      .replace(/log\(/g, 'Math.log10(')
      .replace(/ln\(/g, 'Math.log(')
      .replace(/\^/g, '**');

    expr = expr.replace(/Math\.sin\(([^)]+)\)/g, (_, x) => `Math.sin(${x}*Math.PI/180)`);
    expr = expr.replace(/Math\.cos\(([^)]+)\)/g, (_, x) => `Math.cos(${x}*Math.PI/180)`);
    expr = expr.replace(/Math\.tan\(([^)]+)\)/g, (_, x) => `Math.tan(${x}*Math.PI/180)`);

    display.value = eval(expr);
  } catch { display.value = "Chyba"; }
}

// Aktuálny čas
function aktualizujCas() {
  const teraz = new Date();
  const moznosti = { weekday:'long', year:'numeric', month:'long', day:'numeric',
                     hour:'2-digit', minute:'2-digit', second:'2-digit'};
  document.getElementById('cas').innerText = `🕓 Aktuálny čas: ${teraz.toLocaleDateString('sk-SK', moznosti)}`;
}
setInterval(aktualizujCas, 1000);
aktualizujCas();
</script>

<p style="font-size: 14px; color: gray; margin-top: 20px;">

</body>
  </html>
