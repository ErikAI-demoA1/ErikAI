<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧪 ErikAI – Profesionálna Vedecká Kalkulačka</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      text-align: center;
      background: linear-gradient(145deg, #f0f0f0, #e0e0ff);
      color: #222;
      transition: 0.3s;
    }
    body.dark-mode {
      background: #121212;
      color: white;
    }
    h1 { color: #d62828; margin-bottom: 1rem; }
    #calcDisplayWrapper {
      display: flex;
      flex-direction: column;
      max-width: 350px;
      margin: 0 auto 1.5rem;
    }
    #expression, #result {
      font-size: 1.8rem;
      padding: 0.8rem;
      margin: 5px 0;
      border-radius: 8px;
      border: 2px solid #d62828;
      text-align: right;
      background: white;
      color: #222;
      outline: none;
    }
    body.dark-mode #expression, body.dark-mode #result {
      background: #222;
      color: #fff;
      border-color: #ff5555;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      max-width: 350px;
      margin: 0 auto;
    }
    .buttons button {
      padding: 1rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-number { background: #0077cc; color: white; }
    .btn-function { background: #d62828; color: white; }
    .buttons button:hover { opacity: 0.85; transform: scale(1.05); }
    #toggleTheme { margin-bottom: 1rem; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; background: #555; color: white; border: none; }
    #toggleTheme:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <h1>🧪 ErikAI Profesionálna Vedecká Kalkulačka</h1>

  <button id="toggleTheme">🌓 Zmeniť režim</button>

  <div id="calcDisplayWrapper">
    <input type="text" id="expression" readonly placeholder="Vlož výraz...">
    <input type="text" id="result" readonly placeholder="Výsledok...">
  </div>

  <div class="buttons">
    <button class="btn-function" onclick="appendCalc('sin(')">sin</button>
    <button class="btn-function" onclick="appendCalc('cos(')">cos</button>
    <button class="btn-function" onclick="appendCalc('tan(')">tan</button>
    <button class="btn-function" onclick="appendCalc('log(')">log</button>
    <button class="btn-function" onclick="appendCalc('ln(')">ln</button>

    <button class="btn-number" onclick="appendCalc('7')">7</button>
    <button class="btn-number" onclick="appendCalc('8')">8</button>
    <button class="btn-number" onclick="appendCalc('9')">9</button>
    <button class="btn-function" onclick="appendCalc('/')">÷</button>
    <button class="btn-function" onclick="appendCalc('^')">^</button>

    <button class="btn-number" onclick="appendCalc('4')">4</button>
    <button class="btn-number" onclick="appendCalc('5')">5</button>
    <button class="btn-number" onclick="appendCalc('6')">6</button>
    <button class="btn-function" onclick="appendCalc('*')">×</button>
    <button class="btn-function" onclick="appendCalc('%')">%</button>

    <button class="btn-number" onclick="appendCalc('1')">1</button>
    <button class="btn-number" onclick="appendCalc('2')">2</button>
    <button class="btn-number" onclick="appendCalc('3')">3</button>
    <button class="btn-function" onclick="appendCalc('-')">−</button>
    <button class="btn-function" onclick="appendCalc('!')">!</button>

    <button class="btn-number" onclick="appendCalc('0')">0</button>
    <button class="btn-function" onclick="appendCalc('.')">.</button>
    <button class="btn-function" onclick="calculate()">=</button>
    <button class="btn-function" onclick="appendCalc('+')">+</button>
    <button class="btn-function" onclick="clearCalc()">C</button>

    <button class="btn-function" onclick="appendCalc('√(')">√</button>
    <button class="btn-function" onclick="appendCalc('π')">π</button>
    <button class="btn-function" onclick="appendCalc('e')">e</button>
  </div>

<script>
  const expr = document.getElementById("expression");
  const res = document.getElementById("result");

  function appendCalc(value) {
    expr.value += value;
  }

  function clearCalc() {
    expr.value = "";
    res.value = "";
  }

  function factorial(n) { return n <= 1 ? 1 : n * factorial(n - 1); }
  function degToRad(deg) { return deg * Math.PI / 180; }

  function calculate() {
    try {
      let expression = expr.value
        .replace(/π/g, Math.PI)
        .replace(/e/g, Math.E)
        .replace(/√\(/g, 'Math.sqrt(')
        .replace(/sin\(/g, (_, v) => 'Math.sin(')
        .replace(/cos\(/g, (_, v) => 'Math.cos(')
        .replace(/tan\(/g, (_, v) => 'Math.tan(')
        .replace(/log\(/g, (_, v) => 'Math.log10(')
        .replace(/ln\(/g, (_, v) => 'Math.log(')
        .replace(/(\d+)!/g, (_, n) => factorial(parseInt(n)))
        .replace(/\^/g, '**')
        .replace(/(\d+)%/g, '($1/100)');
      res.value = eval(expression);
    } catch {
      res.value = "Chyba";
    }
  }

  // Téma
  document.getElementById("toggleTheme").addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");
  });
</script>
</body>
</html>
