<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI Vedecká Kalkulačka</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f8f9fa;
    color: #222;
    text-align: center;
    padding: 2rem;
  }
  body.dark-mode { background-color: #121212; color: white; }
  h1 { color: #d62828; margin-bottom: 1rem; }
  #calcDisplay { width: 100%; font-size: 2rem; padding: 1rem; margin-bottom: 1rem; text-align: right; }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    max-width: 340px;
    margin: 0 auto;
  }
  .buttons button {
    padding: 1rem;
    font-size: 1.2rem;
    background-color: #d62828;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
  }
  .buttons button:hover { background-color: #b71d1d; }
  #cas { font-size: 18px; margin-top: 1rem; }
</style>
</head>
<body>

<button onclick="toggleTheme()">🌓 Zmeniť režim</button>

<h1>🧪 ErikAI Vedecká Kalkulačka</h1>
<input type="text" id="calcDisplay" readonly>

<div class="buttons">
  <button onclick="appendCalc('sin(')">sin</button>
  <button onclick="appendCalc('cos(')">cos</button>
  <button onclick="appendCalc('tan(')">tan</button>
  <button onclick="appendCalc('sqrt(')">√</button>

  <button onclick="appendCalc('7')">7</button>
  <button onclick="appendCalc('8')">8</button>
  <button onclick="appendCalc('9')">9</button>
  <button onclick="appendCalc('/')">÷</button>

  <button onclick="appendCalc('4')">4</button>
  <button onclick="appendCalc('5')">5</button>
  <button onclick="appendCalc('6')">6</button>
  <button onclick="appendCalc('*')">×</button>

  <button onclick="appendCalc('1')">1</button>
  <button onclick="appendCalc('2')">2</button>
  <button onclick="appendCalc('3')">3</button>
  <button onclick="appendCalc('-')">−</button>

  <button onclick="appendCalc('0')">0</button>
  <button onclick="appendCalc('^')">^</button>
  <button onclick="calculate()">=</button>
  <button onclick="appendCalc('+')">+</button>

  <button onclick="appendCalc('log(')">log</button>
  <button onclick="appendCalc('ln(')">ln</button>
  <button onclick="appendCalc('π')">π</button>
  <button onclick="appendCalc('e')">e</button>

  <button onclick="clearCalc()">C</button>
</div>

<p id="cas"></p>

<script>
const display = document.getElementById("calcDisplay");

function toggleTheme() {
  document.body.classList.toggle('dark-mode');
}

function appendCalc(value) {
  const funcs = ['sin(', 'cos(', 'tan(', 'log(', 'ln(', 'sqrt('];
  if (funcs.includes(value)) {
    display.value += value + ')';
    display.selectionStart = display.selectionEnd = display.value.length - 1;
  } else {
    display.value += value;
  }
}

function clearCalc() {
  display.value = '';
}

function degToRad(deg) {
  return deg * Math.PI / 180;
}

function factorial(n) {
  return n <= 1 ? 1 : n * factorial(n - 1);
}

function calculate() {
  try {
    let expr = display.value
      .replace(/π/g, Math.PI)
      .replace(/e/g, Math.E)
      .replace(/√\(/g, 'Math.sqrt(')
      .replace(/sin\(/g, v => 'Math.sin(')
      .replace(/cos\(/g, v => 'Math.cos(')
      .replace(/tan\(/g, v => 'Math.tan(')
      .replace(/log\(/g, 'Math.log10(')
      .replace(/ln\(/g, 'Math.log(')
      .replace(/\^/g, '**');
    
    // Trigonometria: prevod stupne → radiány
    expr = expr.replace(/Math\.sin\(([^)]+)\)/g, (_, x) => `Math.sin(${x}*Math.PI/180)`);
    expr = expr.replace(/Math\.cos\(([^)]+)\)/g, (_, x) => `Math.cos(${x}*Math.PI/180)`);
    expr = expr.replace(/Math\.tan\(([^)]+)\)/g, (_, x) => `Math.tan(${x}*Math.PI/180)`);

    display.value = eval(expr);
  } catch {
    display.value = "Chyba";
  }
}

// Aktuálny čas
function aktualizujCas() {
  const teraz = new Date();
  const moznosti = { weekday:'long', year:'numeric', month:'long', day:'numeric',
                     hour:'2-digit', minute:'2-digit', second:'2-digit'};
  const casText = teraz.toLocaleDateString('sk-SK', moznosti);
  document.getElementById('cas').innerText = `🕓 Aktuálny čas: ${casText}`;
}
setInterval(aktualizujCas, 1000);
aktualizujCas();
</script>

<p style="font-size: 14px; color: gray; margin-top: 20px;">

</body>
</html>
