<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ErikAI Electronics — Schematické značky</title>

<style>
:root{
  --bg:#eef5fb;
  --card:#ffffff;
  --text:#101820;
  --muted:#667382;
  --accent:#0b6ffe;
  --line:#dce5ee;
  --shadow:0 8px 30px rgba(0,0,0,.07);
}

[data-theme="dark"]{
  --bg:#0d1117;
  --card:#161b22;
  --text:#edf2f7;
  --muted:#9da8b5;
  --accent:#5b9bff;
  --line:#29313b;
  --shadow:0 8px 30px rgba(0,0,0,.25);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:linear-gradient(135deg,var(--bg),var(--card));
  color:var(--text);
  min-height:100vh;
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:25px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:55px;
  height:55px;
  border-radius:15px;
  display:grid;
  place-items:center;
  color:#fff;
  font-size:24px;
  font-weight:800;
  background:linear-gradient(135deg,#0b6ffe,#7c3aed);
  box-shadow:var(--shadow);
  flex-shrink:0;
}

h1{
  margin:0;
  font-size:24px;
}

.sub{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

button{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  transition:.15s ease;
  font:inherit;
}

button:hover{
  transform:translateY(-1px);
}

button:active{
  transform:translateY(0);
}

.search{
  width:100%;
  padding:15px 17px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--card);
  color:var(--text);
  font-size:16px;
  outline:none;
  box-shadow:var(--shadow);
}

.search:focus{
  border-color:var(--accent);
}

.categories{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:15px 0 22px;
}

.categories button.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:17px;
  box-shadow:var(--shadow);
  transition:.2s ease;
}

.card:hover{
  transform:translateY(-3px);
}

.symbol{
  height:130px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:rgba(127,127,127,.06);
  margin-bottom:13px;
}

.symbol svg{
  width:190px;
  height:105px;
  stroke:var(--text);
  fill:none;
  stroke-width:3;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.card h2{
  font-size:18px;
  margin:5px 0;
}

.tag{
  display:inline-block;
  padding:4px 8px;
  border-radius:7px;
  background:rgba(11,111,254,.1);
  color:var(--accent);
  font-size:12px;
  font-weight:700;
  margin-bottom:7px;
}

.desc{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

.meta{
  margin-top:10px;
  font-size:12px;
  color:var(--muted);
}

.meta b{
  color:var(--text);
}

.empty{
  grid-column:1/-1;
  text-align:center;
  color:var(--muted);
  padding:50px;
}

.count{
  color:var(--muted);
  font-size:13px;
  margin:-8px 0 16px;
}

footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
  margin:30px 0 10px;
}

@media(max-width:650px){

  .wrap{
    padding:16px;
  }

  header{
    align-items:flex-start;
  }

  .logo{
    width:48px;
    height:48px;
    font-size:21px;
  }

  h1{
    font-size:20px;
  }

  .sub{
    font-size:12px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .symbol{
    height:120px;
  }
}
</style>
</head>

<body>

<header>

  </div>

  <button type="button" onclick="theme()">

  </button>

</header>


<input

</div>

/* =========================================================
   KATEGÓRIE
   ========================================================= */

const categories = [
  "Všetky",
  ...new Set(data.map(item => item[0]))
];

let active = "Všetky";


/* =========================================================
   VYKRESLENIE KATEGÓRIÍ
   ========================================================= */

function renderCategories(){

  const cats = document.getElementById("cats");

  cats.innerHTML = categories.map(category => {

    const activeClass =
      category === active ? "active" : "";

    return `
      <button
        type="button"
        class="${activeClass}"
        data-category="${category}">
        ${category}
      </button>
    `;

  }).join("");

}


/* =========================================================
   VÝBER KATEGÓRIE
   ========================================================= */

function setCat(category){

  active = category;

  renderCategories();
  render();

}


/* =========================================================
   VYKRESLENIE ZNAČIEK
   ========================================================= */

function render(){

  const searchElement =
    document.getElementById("search");

  const query =
    searchElement.value
      .toLowerCase()
      .trim();


  const list = data.filter(item => {

    const categoryMatch =
      active === "Všetky" ||
      item[0] === active;


    const searchableText =
      item.slice(0,3)
        .join(" ")
        .concat(" ",item[4])
        .toLowerCase();


    const searchMatch =
      !query ||
      searchableText.includes(query);


    return categoryMatch && searchMatch;

  });


  const grid =
    document.getElementById("grid");


  const count =
    document.getElementById("count");


  count.textContent =
    `Zobrazené značky: ${list.length} z ${data.length}`;


  if(!list.length){

    grid.innerHTML = `
      <div class="empty">
        🔎 Žiadna značka nebola nájdená.
      </div>
    `;

    return;
  }


  grid.innerHTML = list.map(item => {

    const category = item[0];
    const name = item[1];
    const designation = item[2];
    const symbol = item[3];
    const description = item[4];


    return `
      <article class="card">

        <div class="symbol">
          ${S[symbol]}
        </div>

        <span class="tag">
          ${category}
        </span>

        <h2>
          ${name}
        </h2>

        <div class="desc">
          ${description}
        </div>

        <div class="meta">
          Označenie:
          <b>${designation}</b>
        </div>

      </article>
    `;

  }).join("");

}


/* =========================================================
   TÉMA
   ========================================================= */

function theme(){

  const isDark =
    document.documentElement
      .getAttribute("data-theme") === "dark";


  if(isDark){

    document.documentElement
      .removeAttribute("data-theme");

    localStorage.setItem(
      "erikai-electronics-theme",
      "light"
    );

  }else{

    document.documentElement
      .setAttribute("data-theme","dark");

    localStorage.setItem(
      "erikai-electronics-theme",
      "dark"
    );

  }

}


/* =========================================================
   ULOŽENÁ TÉMA
   ========================================================= */

if(
  localStorage.getItem(
    "erikai-electronics-theme"
  ) === "dark"
){

  document.documentElement
    .setAttribute("data-theme","dark");

}


/* =========================================================
   EVENT LISTENERY
   ========================================================= */

document
  .getElementById("cats")
  .addEventListener("click",event => {

    const button =
      event.target.closest("button");

    if(!button){
      return;
    }

    setCat(
      button.dataset.category
    );

  });


document
  .getElementById("search")
  .addEventListener("input",render);


/* =========================================================
   SPUSTENIE
   ========================================================= */

renderCategories();
render();

</script>
