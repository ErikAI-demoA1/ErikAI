<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ErikAI Electronics — Schematické značky</title>

<style>
:root{
  --bg:#eef5fb;
  --card:#fff;
  --text:#101820;
  --muted:#667382;
  --accent:#0b6ffe;
  --line:#dce5ee;
  --shadow:0 8px 30px rgba(0,0,0,.07)
}
[data-theme="dark"]{
  --bg:#0d1117;
  --card:#161b22;
  --text:#edf2f7;
  --muted:#9da8b5;
  --accent:#5b9bff;
  --line:#29313b;
  --shadow:0 8px 30px rgba(0,0,0,.25)
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:linear-gradient(135deg,var(--bg),var(--card));
  color:var(--text)
}
.wrap{max-width:1200px;margin:auto;padding:25px}
header{
  display:flex;justify-content:space-between;align-items:center;
  gap:15px;margin-bottom:25px
}
.brand{display:flex;align-items:center;gap:14px}
.logo{
  width:55px;height:55px;border-radius:15px;
  display:grid;place-items:center;
  color:#fff;font-size:24px;font-weight:800;
  background:linear-gradient(135deg,#0b6ffe,#7c3aed);
  box-shadow:var(--shadow)
}
h1{margin:0;font-size:24px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
button{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer
}
button:hover{transform:translateY(-1px)}
.search{
  width:100%;padding:15px 17px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--card);
  color:var(--text);
  font-size:16px;
  outline:none;
  box-shadow:var(--shadow)
}
.categories{
  display:flex;gap:8px;flex-wrap:wrap;
  margin:15px 0 22px
}
.categories button.active{
  background:var(--accent);
  color:white;
  border-color:var(--accent)
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:17px;
  box-shadow:var(--shadow);
  transition:.2s
}
.card:hover{
  transform:translateY(-3px)
}
.symbol{
  height:130px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:rgba(127,127,127,.06);
  margin-bottom:13px
}
.symbol svg{
  width:190px;
  height:105px;
  stroke:var(--text);
  fill:none;
  stroke-width:3;
  stroke-linecap:round;
  stroke-linejoin:round
}
.card h2{font-size:18px;margin:5px 0}
.tag{
  display:inline-block;
  padding:4px 8px;
  border-radius:7px;
  background:rgba(11,111,254,.1);
  color:var(--accent);
  font-size:12px;
  font-weight:700;
  margin-bottom:7px
}
.desc{
  color:var(--muted);
  font-size:14px;
  line-height:1.5
}
.meta{
  margin-top:10px;
  font-size:12px;
  color:var(--muted)
}
.empty{
  text-align:center;
  color:var(--muted);
  padding:50px
}
footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin:30px 0 10px
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <div class="brand">
    <div class="logo">E</div>
    <div>
      <h1>ErikAI Electronics</h1>
      <div class="sub">Knižnica elektronických a elektrotechnických schematických značiek</div>
    </div>
  </div>
  <button onclick="theme()">🌓 Režim</button>
</header>

<input
  id="search"
  class="search"
  placeholder="🔍 Hľadať značku, názov alebo označenie..."
  oninput="render()"
>

<div id="cats" class="categories"></div>
<div id="grid" class="grid"></div>

<footer>
  ErikAI Electronics • Referenčná knižnica schematických značiek<br>
  Grafické značky sú založené na bežných konvenciách pre elektrické a elektronické schémy, s preferenciou IEC symboliky.
</footer>

</div>

/* =========================================================
   DATABÁZA
   ========================================================= */

const data=[

["Základy","Vodič","W","wire",
"Elektrické spojenie medzi jednotlivými bodmi obvodu."],

["Základy","Spojenie vodičov","J","junction",
"Miesto, kde sú vodiče elektricky spojené. Bod označuje spojenie."],

["Základy","Križovanie bez spojenia","—","cross",
"Dva vodiče sa križujú, ale nie sú medzi sebou elektricky spojené."],

["Základy","Uzemnenie / GND","GND","ground",
"Určuje referenčný bod obvodu alebo pripojenie k zemi podľa použitia."],

["Zdroje","Batéria","BT","battery",
"Zdroj jednosmerného elektrického napätia vytvorený jedným alebo viacerými článkami."],

["Zdroje","DC zdroj","VDC","dc",
"Zdroj jednosmerného napätia s kladnou a zápornou polaritou."],

["Zdroje","AC zdroj","VAC","ac",
"Zdroj striedavého elektrického napätia, ktorého polarita alebo okamžitá hodnota sa mení v čase."],

"Obmedzuje prúd a vytvára úbytok napätia. Hodnota sa udáva v ohmoch (Ω)."],

["Pasívne","Potenciometer","RV","pot",
"Nastaviteľný rezistor. Zmenou polohy jazdca mení odpor alebo výstupné napätie."],

"Ukladá energiu v magnetickom poli a reaguje na zmeny prúdu. Hodnota sa udáva v henryoch (H)."],

"Prenáša elektrickú energiu medzi vinutiami pomocou magnetického poľa a môže meniť úroveň striedavého napätia."],

"Umožňuje prúd hlavne v jednom smere a v opačnom smere ho výrazne obmedzuje."],

["Diódy","LED","D","led",

["Diódy","Zenerova dióda","DZ","zener",

["Diódy","Fotodióda","PD","photo",
"Dióda citlivá na svetlo. Dopadajúce svetlo mení jej elektrické vlastnosti."],

["Spínanie","Vypínač SPST","S","switch",

["Tranzistory","NPN tranzistor","Q","npn",
"Polovodičový prvok používaný napríklad na spínanie alebo zosilňovanie signálov."],

["Tranzistory","PNP tranzistor","Q","pnp",
"Tranzistor s opačným typom polarity oproti NPN, používaný na spínanie a zosilňovanie."],

["Tranzistory","MOSFET","Q","mosfet",
"Napätím riadený tranzistor, často používaný ako elektronický spínač alebo zosilňovací prvok."],

["Výstupy","Motor","M","motor",
"Premieňa elektrickú energiu na mechanický pohyb."],

["Výstupy","Žiarovka / lampa","H","lamp",
"Elektrický prvok, ktorý premieňa elektrickú energiu na svetlo a teplo."],

["Výstupy","Reproduktor","LS","speaker",
"Premieňa elektrický signál na mechanické kmity a následne zvuk."],

["Výstupy","Bzučiak","BZ","buzzer",
"Elektronické zariadenie určené na vytváranie zvukového alebo výstražného signálu."],

["Meranie","Voltmeter","V","voltmeter",
"Meria elektrické napätie medzi dvoma bodmi obvodu. Jednotkou je volt (V)."],

["Meranie","Ampérmeter","A","ammeter",

["Meranie","Ohmmeter","Ω","ohmmeter",

["Logika","OR","≥1","or",
"Logický výstup je 1, keď je 1 aspoň jeden zo vstupov."],

["Logika","NOT","1","not",
"Invertuje logickú hodnotu: 1 zmení na 0 a 0 na 1."],

["Logika","NAND","⊼","nand",
"Negovaný AND. Výstup je 0 iba vtedy, keď sú všetky vstupy 1."],

["Logika","NOR","⊽","nor",
"Negovaný OR. Výstup je 1 iba vtedy, keď sú všetky vstupy 0."],

["Logika","XOR","=1","xor",
"Výstup je 1 vtedy, keď sa vstupy navzájom líšia. Pri dvoch vstupoch práve jeden musí byť 1."]

/* =========================================================
   KATEGÓRIE
   ========================================================= */

const categories=["Všetky",...new Set(data.map(x=>x[0]))];
let active="Všetky";

document.getElementById("cats").innerHTML=
categories.map(c=>`
<button class="${c==="Všetky"?"active":""}"
onclick="setCat('${c}')">${c}</button>
`).join("");

function setCat(c){
  active=c;
  document.querySelectorAll(".categories button")
    .forEach(b=>b.classList.toggle("active",b.textContent===c));
  render();
}


/* =========================================================
   VYKRESLENIE
   ========================================================= */

function render(){

  const q=document.getElementById("search").value.toLowerCase().trim();

  const list=data.filter(x=>{
    const category=active==="Všetky"||x[0]===active;
    const search=!q||x.slice(0,3).join(" ").toLowerCase().includes(q)
      ||x[4].toLowerCase().includes(q);
    return category&&search;
  });

  document.getElementById("grid").innerHTML=list.length
    ?list.map(x=>`
      <article class="card">
        <div class="symbol">${S[x[3]]}</div>
        <span class="tag">${x[0]}</span>
        <h2>${x[1]}</h2>
        <div class="desc">${x[4]}</div>
        <div class="meta">
          Označenie: <b>${x[2]}</b>
        </div>
      </article>
    `).join("")
    :`<div class="empty">🔎 Žiadna značka nebola nájdená.</div>`;
}

function theme(){
  const dark=document.documentElement.getAttribute("data-theme")==="dark";
  document.documentElement.toggleAttribute("data-theme",!dark);
  localStorage.setItem("erikai-electronics-theme",!dark?"dark":"light");
}

if(localStorage.getItem("erikai-electronics-theme")==="dark")
  document.documentElement.setAttribute("data-theme","dark");

render();

</script>
