<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ErikAI Electronics — University Edition</title>

<style>
:root{
 --bg:#edf4ff;--card:#fff;--text:#101828;--muted:#667085;
 --blue:#155eef;--line:#d9e2f0;--soft:#f5f8fc
}
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Inter,"Segoe UI",Arial,sans-serif;
 background:linear-gradient(135deg,var(--bg),#fff);
 color:var(--text);
 transition:.25s
}

header{
 padding:34px 20px;
 text-align:center;
 color:#fff;
 background:linear-gradient(135deg,#084ccf,#673de6);
 box-shadow:0 8px 30px #123b7a30
}

header h1{margin:0;font-size:30px}
header p{margin:8px 0 0;opacity:.85}

.wrap{
 max-width:1250px;
 margin:auto;
 padding:22px
}

.toolbar,.stats{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-bottom:18px
}

input,select{
 flex:1;
 min-width:190px;
 padding:13px 15px;
 border:1px solid var(--line);
 border-radius:12px;
 background:var(--card);
 color:var(--text);
 font-size:15px
}

.stat{
 background:var(--card);
 padding:12px 16px;
 border-radius:12px;
 box-shadow:0 8px 25px #18345b12;
 font-size:14px
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(245px,1fr));
 gap:16px
}

.item{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:16px;
 padding:16px;
 cursor:pointer;
 box-shadow:0 8px 25px #18345b12;
 transition:.2s
}

.item:hover{
 transform:translateY(-4px);
 border-color:#9dbbff
}

.symbol{
 height:125px;
 background:var(--soft);
 border-radius:12px;
 display:flex;
 align-items:center;
 justify-content:center;
 margin-bottom:14px
}

.symbol svg{
 width:200px;
 height:105px;
 color:#111
}

.item h3{margin:8px 0 5px}

.item p{
 margin:6px 0;
 color:var(--muted);
 font-size:13px;
 line-height:1.5
}

.tag{
 display:inline-block;
 padding:4px 8px;
 border-radius:7px;
 background:#eaf1ff;
 color:#1454c4;
 font-size:11px;
 font-weight:700
}

.empty{
 text-align:center;
 padding:50px;
 color:var(--muted)
}
  .modal{
 position:fixed;
 inset:0;
 background:#07111dcc;
 display:none;
 align-items:center;
 justify-content:center;
 padding:18px;
 z-index:5
}

.modal.show{display:flex}

.panel{
 width:min(760px,100%);
 max-height:90vh;
 overflow:auto;
 background:var(--card);
 border-radius:20px;
 padding:24px
}

.close{
 float:right;
 border:0;
 background:#edf1f6;
 padding:8px 12px;
 border-radius:9px;
 cursor:pointer
}

.big{
 height:190px;
 background:var(--soft);
 border-radius:15px;
 display:flex;
 align-items:center;
 justify-content:center;
 margin:15px 0
}

.big svg{
 width:350px;
 height:160px;
 color:#111
}

.info{
 margin-top:12px;
 padding:13px 15px;
 background:#f4f8ff;
 border-left:4px solid var(--blue);
 border-radius:8px;
 line-height:1.55
}

.theme{
 position:fixed;
 right:18px;
 bottom:18px;
 width:48px;
 height:48px;
 border:0;
 border-radius:50%;
 cursor:pointer;
 font-size:20px;
 box-shadow:0 8px 25px #0003
}

body.dark{
 --bg:#0b1018;
 --card:#121923;
 --text:#eef2f7;
 --muted:#9ba8b8;
 --line:#283546;
 --soft:#182230
}

body.dark .info{background:#182536}
body.dark .close{background:#273444;color:white}
body.dark .symbol,
body.dark .big{background:#182230}
body.dark .symbol svg,
body.dark .big svg{color:#f1f5f9}

footer{
 text-align:center;
 padding:30px;
 color:var(--muted);
 font-size:13px
}
</style>
</head>

<body>

<header>
 <h1>⚡ ErikAI Electronics</h1>
 <p>University Edition • Technická databáza elektrotechnických značiek</p>
</header>

<div class="wrap">

 <div class="toolbar">
  <input
   id="search"
   placeholder="🔎 Hľadať názov, označenie alebo použitie..."
  >

  <select id="category">
   <option value="all">📚 Všetky kategórie</option>
  </select>
 </div>

 <div class="stats">
  <div class="stat">
   📐 Zobrazené: <b id="count">0</b>
  </div>

  <div class="stat">
   📚 Databáza: <b id="total">0</b>
  </div>

  <div class="stat">
   🎓 Edícia: <b>Vysoká škola</b>
  </div>
 </div>

 <div id="grid" class="grid"></div>

</div>

<footer>
 ErikAI Electronics — University Edition<br>
 Technická pomôcka pre štúdium elektrotechniky, elektroniky a automatizácie.
</footer>

<button class="theme" id="theme">🌙</button>

<div class="modal" id="modal">

 <div class="panel">

  <button class="close" onclick="closeModal()">✕</button>

  <div id="detail"></div>

 </div>

</div>

<script>

  const S={

R:`<svg viewBox="0 0 240 120">
<path d="M10 60H45L55 35 70 85 85 35 100 85 115 35 130 85 145 35 160 85 175 60H230"/>
</svg>`,

C:`<svg viewBox="0 0 240 120">
<path d="M10 60H105M135 60H230M105 25V95M135 25V95"/>
</svg>`,

L:`<svg viewBox="0 0 240 120">
<path d="M10 60H40C40 20 65 20 65 60C65 20 90 20 90 60C90 20 115 20 115 60C115 20 140 20 140 60H230"/>
</svg>`,

D:`<svg viewBox="0 0 240 120">
<path d="M10 60H85M155 60H230M85 30V90L155 60 85 30M155 30V90"/>
</svg>`,

LED:`<svg viewBox="0 0 240 120">
<path d="M10 60H85M155 60H230M85 30V90L155 60 85 30M155 30V90M105 25L90 5M135 25L120 5"/>
</svg>`,

BAT:`<svg viewBox="0 0 240 120">
<path d="M10 60H85M155 60H230M95 25V95M120 15V105M145 25V95"/>
</svg>`,

SW:`<svg viewBox="0 0 240 120">
<path d="M10 70H75M165 70H230M75 70L145 30"/>
<circle cx="75" cy="70" r="5" fill="currentColor"/>
<circle cx="165" cy="70" r="5" fill="currentColor"/>
</svg>`,

GND:`<svg viewBox="0 0 240 120">
<path d="M120 20V65M80 65H160M90 78H150M105 91H135"/>
</svg>`,

V:`<svg viewBox="0 0 240 120">
<path d="M10 60H65M175 60H230M65 15V105H175V15Z"/>
<text x="120" y="75" text-anchor="middle"
font-size="42" fill="currentColor" stroke="none">V</text>
</svg>`,

A:`<svg viewBox="0 0 240 120">
<path d="M10 60H65M175 60H230"/>
<circle cx="120" cy="60" r="55"/>
<text x="120" y="75" text-anchor="middle"
font-size="42" fill="currentColor" stroke="none">A</text>
</svg>`,

M:`<svg viewBox="0 0 240 120">
<path d="M10 60H65M175 60H230"/>
<circle cx="120" cy="60" r="55"/>
<text x="120" y="75" text-anchor="middle"
font-size="40" fill="currentColor" stroke="none">M</text>
</svg>`,

OP:`<svg viewBox="0 0 240 120">
<path d="M70 20L180 60 70 100ZM10 45H70M10 75H70M180 60H230"/>
<text x="78" y="48" font-size="22"
fill="currentColor" stroke="none">−</text>
<text x="78" y="88" font-size="22"
fill="currentColor" stroke="none">+</text>
</svg>`,

AND:`<svg viewBox="0 0 240 120">
<path d="M60 20H120C200 20 200 100 120 100H60Z
M10 45H60M10 75H60M200 60H230"/>
</svg>`,

OR:`<svg viewBox="0 0 240 120">
<path d="M55 20C100 25 145 25 190 60
C145 95 100 95 55 100
C75 75 75 45 55 20ZM10 45H70
M10 75H70M190 60H230"/>
</svg>`,

NOT:`<svg viewBox="0 0 240 120">
<path d="M70 20L180 60 70 100Z
M10 60H70M190 60H230"/>
<circle cx="187" cy="60" r="7"/>
</svg>`,

PLC:`<svg viewBox="0 0 240 120">
<rect x="60" y="20" width="120" height="80"/>
<path d="M35 35H60M35 60H60M35 85H60
M180 35H205M180 60H205M180 85H205"/>
<text x="120" y="72" text-anchor="middle"
font-size="28" fill="currentColor" stroke="none">PLC</text>
</svg>`,

PID:`<svg viewBox="0 0 240 120">
<rect x="60" y="20" width="120" height="80"/>
<text x="120" y="72" text-anchor="middle"
font-size="28" fill="currentColor" stroke="none">PID</text>
</svg>`,

SENSOR:`<svg viewBox="0 0 240 120">
<rect x="65" y="25" width="110" height="70"/>
<circle cx="120" cy="60" r="20"/>
<path d="M35 45H65M35 75H65M175 45H205M175 75H205"/>
</svg>`,

TEMP:`<svg viewBox="0 0 240 120">
<path d="M120 25V75"/>
<circle cx="120" cy="85" r="15"/>
<path d="M120 25C105 25 105 40 105 50V75
M120 25C135 25 135 40 135 50V75"/>
</svg>`,

MOTOR:`<svg viewBox="0 0 240 120">
<path d="M10 60H65M175 60H230"/>
<circle cx="120" cy="60" r="55"/>
<text x="120" y="75" text-anchor="middle"
font-size="40" fill="currentColor" stroke="none">M</text>
</svg>`
};


const parts=[

["Rezistor","R","Pasívne","R",
"Elektrický odporový prvok.",
"Obmedzenie prúdu, delenie napätia a nastavenie pracovného bodu.","Ω"],

["Kondenzátor","C","Pasívne","C",
"Prvok akumulujúci energiu v elektrickom poli.",
"Filtrácia, väzba a časovacie obvody.","F"],

["Cievka","L","Pasívne","L",
"Prvok akumulujúci energiu v magnetickom poli.",
"Filtre, meniče a elektromagnetické obvody.","H"],

["Dióda","D","Diódy","D",
"Polovodičový prvok s preferovaným smerom vedenia.",
"Usmerňovanie a ochrana.","V/A"],

["LED","D","Diódy","LED",
"Dióda emitujúca svetlo.",
"Signalizácia a osvetlenie.","V/A"],

["Batéria","BT","Zdroje","BAT",
"Zdroj jednosmerného elektrického napätia.",
"Napájanie elektronických zariadení.","V"],

["Spínač","S","Spínacie prvky","SW",
"Mechanický spínací prvok.",
"Zapnutie alebo vypnutie elektrického obvodu.","—"],

["Voltmeter","V","Meranie","V",
"Prístroj na meranie elektrického napätia.",
"Meria napätie medzi dvoma bodmi.","V"],

["Ampérmeter","A","Meranie","A",
"Prístroj na meranie elektrického prúdu.",
"Zapája sa do meranej vetvy.","A"],

["Motor","M","Elektromechanika","MOTOR",
"Menič elektrickej energie na mechanickú.",
"Pohony a automatizácia.","W"],

["NPN tranzistor","Q","Tranzistory","R",
"Bipolárny tranzistor typu NPN.",
"Spínanie a zosilňovanie.","V/A"],

["Operačný zosilňovač","U","Integrované obvody","OP",
"Vysoko-zosilňovací analógový obvod.",
"Zosilňovače, filtre a regulačné obvody.","V"],

["AND hradlo","U","Logika","AND",
"Logické hradlo, ktorého výstup závisí od všetkých vstupov.",
"Digitálne obvody.","—"],

["OR hradlo","U","Logika","OR",
"Logické hradlo aktívne pri splnení aspoň jednej podmienky.",
"Digitálne obvody.","—"],

["NOT hradlo","U","Logika","NOT",
"Logické hradlo s negovaným výstupom.",
"Digitálne obvody.","—"],

["PLC","PLC","Automatizácia","PLC",
"Programovateľný logický automat.",
"Riadenie strojov a technologických procesov.","—"],

["PID regulátor","PID","Regulácia","PID",
"Regulátor s proporcionálnou, integračnou a derivačnou zložkou.",
"Regulácia teploty, otáčok a technologických procesov.","—"],

["Teplotný snímač","RT","Senzory","TEMP",
"Snímač určený na detekciu teploty.",
"Meranie a regulácia teploty.","°C"],

["Snímač","B","Senzory","SENSOR",
"Všeobecné schematické znázornenie snímača.",
"Meranie fyzikálnych veličín.","—"],

["Signálová zem","GND","Pripojenie","GND",
"Referenčný bod elektrického obvodu.",
"Definovanie referenčného potenciálu.","—"]

];


const grid=document.getElementById("grid");
const search=document.getElementById("search");
const category=document.getElementById("category");
const count=document.getElementById("count");
const total=document.getElementById("total");


total.textContent=parts.length;


[...new Set(parts.map(p=>p[2]))]
.sort()
.forEach(c=>{
 category.innerHTML+=`<option value="${c}">${c}</option>`;
});


function render(){

 const q=search.value.toLowerCase().trim();
 const cat=category.value;

 const list=parts.filter(p=>
  (!q||p.join(" ").toLowerCase().includes(q))&&
  (cat==="all"||p[2]===cat)
 );

 count.textContent=list.length;

 grid.innerHTML=list.length
 ?list.map(p=>`
  <article class="item"
   onclick="openDetail(${parts.indexOf(p)})">

   <div class="symbol">
    ${S[p[3]]||S.R}
   </div>

   <span class="tag">${p[2]}</span>

   <h3>${p[0]}</h3>

   <p>
    <b>${p[1]}</b> — ${p[4]}
   </p>

  </article>
 `).join("")

 :`<div class="empty">🔎 Žiadny výsledok.</div>`;
}


function openDetail(i){

 const p=parts[i];

 document.getElementById("detail").innerHTML=`

 <div class="big">
  ${S[p[3]]||S.R}
 </div>

 <span class="tag">${p[2]}</span>

 <h2>${p[0]}</h2>

 <div class="info">
  <b>📐 Schématické označenie</b><br>
  ${p[1]}
 </div>

 <div class="info">
  <b>📖 Odborný popis</b><br>
  ${p[4]}
 </div>

 <div class="info">
  <b>⚙️ Typické použitie</b><br>
  ${p[5]}
 </div>

 <div class="info">
  <b>📏 Veličina / jednotka</b><br>
  ${p[6]}
 </div>
 `;

 document.getElementById("modal").classList.add("show");
}


function closeModal(){
 document.getElementById("modal").classList.remove("show");
}


document.getElementById("modal").onclick=e=>{
 if(e.target.id==="modal")closeModal();
};


search.oninput=render;
category.onchange=render;


const theme=document.getElementById("theme");

theme.onclick=()=>{

 document.body.classList.toggle("dark");

 const dark=document.body.classList.contains("dark");

 theme.textContent=dark?"☀️":"🌙";

 localStorage.setItem(
  "electronicsTheme",
  dark?"dark":"light"
 );
};


if(localStorage.getItem("electronicsTheme")==="dark"){

 document.body.classList.add("dark");
 theme.textContent="☀️";

}


render();

</script>

</body>
</html>
