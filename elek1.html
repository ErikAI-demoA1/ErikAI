<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ErikAI Electronics Lab — Pokročilá knižnica schematických značiek</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#070d19;
  --card:#0d1527;
  --card-hover:#131f38;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --accent:#38bdf8;
  --accent-glow:rgba(56, 189, 248, 0.2);
  --line:rgba(255, 255, 255, 0.08);
  --shadow:0 12px 35px rgba(0,0,0,0.5);
  --tag-bg:rgba(56, 189, 248, 0.1);
}

[data-theme="light"]{
  --bg:#f1f5f9;
  --card:#ffffff;
  --card-hover:#f8fafc;
  --text:#0f172a;
  --muted:#64748b;
  --accent:#0284c7;
  --accent-glow:rgba(2, 132, 199, 0.15);
  --line:rgba(0, 0, 0, 0.08);
  --shadow:0 10px 30px rgba(0,0,0,0.06);
  --tag-bg:rgba(2, 132, 199, 0.08);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Inter',system-ui,sans-serif;
  background:radial-gradient(circle at top, #101c36 0%, var(--bg) 100%);
  color:var(--text);
  min-height:100vh;
  padding:30px 15px;
}

.wrap{
  max-width:1400px;
  margin:auto;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:30px;
  background:var(--card);
  border:1px solid var(--line);
  padding:20px 25px;
  border-radius:18px;
  box-shadow:var(--shadow);
}

.brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.logo{
  width:60px;
  height:60px;
  border-radius:14px;
  display:grid;
  place-items:center;
  color:#fff;
  font-size:26px;
  font-weight:800;
  background:linear-gradient(135deg,#38bdf8,#6366f1);
  box-shadow:0 0 20px var(--accent-glow);
  flex-shrink:0;
}

h1{
  font-size:1.5rem;
  font-weight:800;
  letter-spacing:-0.5px;
}

.sub{
  color:var(--muted);
  font-size:0.88rem;
  margin-top:4px;
}

.theme-btn{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  border-radius:10px;
  padding:10px 16px;
  cursor:pointer;
  transition:all 0.2s ease;
  font-weight:600;
  font-size:0.9rem;
  display:inline-flex;
  align-items:center;
  gap:8px;
}

.theme-btn:hover{
  border-color:var(--accent);
  background:var(--accent-glow);
  transform:translateY(-1px);
}

.search-box{
  position:relative;
  margin-bottom:20px;
}

.search{
  width:100%;
  padding:16px 20px 16px 50px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--card);
  color:var(--text);
  font-size:1rem;
  outline:none;
  box-shadow:var(--shadow);
  transition:all 0.2s ease;
}

.search:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px var(--accent-glow);
}

.search-icon{
  position:absolute;
  left:18px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  font-size:1.2rem;
}

.categories{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.categories button{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  border-radius:10px;
  padding:8px 16px;
  cursor:pointer;
  transition:all 0.2s ease;
  font-size:0.9rem;
  font-weight:600;
}

.categories button:hover{
  border-color:var(--accent);
}

.categories button.active{
  background:var(--accent);
  color:#070d19;
  border-color:var(--accent);
  box-shadow:0 4px 15px var(--accent-glow);
}

.count{
  color:var(--muted);
  font-size:0.9rem;
  margin-bottom:20px;
  font-weight:500;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px;
  box-shadow:var(--shadow);
  transition:all 0.25s ease;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.card:hover{
  transform:translateY(-4px);
  border-color:rgba(56, 189, 248, 0.4);
  background:var(--card-hover);
}

.symbol-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.tag{
  display:inline-block;
  padding:4px 10px;
  border-radius:6px;
  background:var(--tag-bg);
  color:var(--accent);
  font-size:0.75rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.5px;
}

.designation{
  font-family:'JetBrains Mono', monospace;
  font-size:0.85rem;
  font-weight:700;
  color:var(--muted);
  background:var(--line);
  padding:2px 8px;
  border-radius:4px;
}

.symbol{
  height:140px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:rgba(0,0,0,0.15);
  margin-bottom:16px;
  border:1px solid var(--line);
}

[data-theme="light"] .symbol{
  background:rgba(0,0,0,0.03);
}

.symbol svg{
  width:200px;
  height:110px;
  stroke:var(--text);
  fill:none;
  stroke-width:3;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.card h2{
  font-size:1.15rem;
  font-weight:700;
  margin-bottom:8px;
}

.desc{
  color:var(--muted);
  font-size:0.9rem;
  line-height:1.6;
  margin-bottom:14px;
}

.formula-box{
  background:var(--line);
  border-radius:8px;
  padding:10px 12px;
  font-family:'JetBrains Mono', monospace;
  font-size:0.82rem;
  color:var(--accent);
  margin-top:auto;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  color:var(--muted);
  padding:80px;
  font-size:1.1rem;
}

footer{
  text-align:center;
  color:var(--muted);
  font-size:0.85rem;
  line-height:1.7;
  margin-top:50px;
  border-top:1px solid var(--line);
  padding-top:25px;
}

@media(max-width:768px){
  header{
    flex-direction:column;
    align-items:flex-start;
  }
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body data-theme="dark">

<div class="wrap">

<header>
  <div class="brand">
    <div class="logo">EΩ</div>
    <div>
      <h1>ErikAI Electronics Lab</h1>
      <div class="sub">Vysokoškolská a vedecká referenčná knižnica schematických značiek (IEC / IEEE)</div>

  <button type="button" class="theme-btn" onclick="toggleTheme()">

const categories = ["Všetky", ...new Set(data.map(item => item[0]))];

function renderCategories() {
  const container = document.getElementById("cats");
  container.innerHTML = categories.map(cat => `
    <button type="button" class="${cat === activeCategory ? 'active' : ''}" onclick="setCategory('${cat}')">
      ${cat}
    </button>
  `).join("");
}

function setCategory(cat) {
  activeCategory = cat;
  renderCategories();
  renderGrid();
}

function renderGrid() {
  const query = document.getElementById("search").value.toLowerCase().trim();
  const grid = document.getElementById("grid");
  const countEl = document.getElementById("count");

  const filtered = data.filter(item => {
    const matchCat = activeCategory === "Všetky" || item[0] === activeCategory;
    const matchQuery = !query || item.slice(0, 5).join(" ").toLowerCase().includes(query);
    return matchCat && matchQuery;
  });

  countEl.textContent = `Zobrazené vedecké záznamy: ${filtered.length} z ${data.length}`;

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty">🔎 Žiadny prvok nezodpovedá zadaným kritériám.</div>`;
    return;
  }

  grid.innerHTML = filtered.map(item => `
    <article class="card">
      <div>
        <div class="symbol-header">
          <span class="tag">${item[0]}</span>
          <span class="designation">${item[2]}</span>
        </div>
        <div class="symbol">
          ${S[item[3]]}
        </div>
        <h2>${item[1]}</h2>
        <div class="desc">${item[4]}</div>
      </div>
      <div class="formula-box">
        ⚙️ ${item[5]}
      </div>
    </article>
  `).join("");
}

function toggleTheme() {
  const body = document.body;
  const icon = document.getElementById("themeIcon");
  const text = document.getElementById("themeText");
  
  if(body.getAttribute("data-theme") === "dark") {
    body.setAttribute("data-theme", "light");
    icon.textContent = "🌙";
    text.textContent = "Tmavý režim";
    localStorage.setItem("erik-theme", "light");
  } else {
    body.setAttribute("data-theme", "dark");
    icon.textContent = "☀️";
    text.textContent = "Svetlý režim";
    localStorage.setItem("erik-theme", "dark");
  }
}

// Inicializácia témy z pamäte
if(localStorage.getItem("erik-theme") === "light") {
  document.body.setAttribute("data-theme", "light");
  document.getElementById("themeIcon").textContent = "🌙";
  document.getElementById("themeText").textContent = "Tmavý režim";
}

document.getElementById("search").addEventListener("input", renderGrid);

renderCategories();
renderGrid();
</script>

</body>
</html>
