<!DOCTYPE html><html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ErikAI Electronics — Schematické značky</title><style>
:root{
  --bg:#eef5fb;
  --card:#fff;
  --text:#101820;
  --muted:#667382;
  --accent:#0b6ffe;
  --line:#dce5ee;
  --shadow:0 8px 30px rgba(0,0,0,.07)
}
[data-theme="dark"]{
  --bg:#0d1117;
  --card:#161b22;
  --text:#edf2f7;
  --muted:#9da8b5;
  --accent:#5b9bff;
  --line:#29313b;
  --shadow:0 8px 30px rgba(0,0,0,.25)
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:linear-gradient(135deg,var(--bg),var(--card));
  color:var(--text)
}
.wrap{max-width:1200px;margin:auto;padding:25px}
header{
  display:flex;justify-content:space-between;align-items:center;
  gap:15px;margin-bottom:25px
}
.brand{display:flex;align-items:center;gap:14px}
.logo{
  width:55px;height:55px;border-radius:15px;
  display:grid;place-items:center;
  color:#fff;font-size:24px;font-weight:800;
  background:linear-gradient(135deg,#0b6ffe,#7c3aed);
  box-shadow:var(--shadow)
}
h1{margin:0;font-size:24px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
button{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer
}
button:hover{transform:translateY(-1px)}
.search{
  width:100%;padding:15px 17px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--card);
  color:var(--text);
  font-size:16px;
  outline:none;
  box-shadow:var(--shadow)
}
.categories{
  display:flex;gap:8px;flex-wrap:wrap;
  margin:15px 0 22px
}
.categories button.active{
  background:var(--accent);
  color:white;
  border-color:var(--accent)
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:17px;
  box-shadow:var(--shadow);
  transition:.2s
}
.card:hover{
  transform:translateY(-3px)
}
.symbol{
  height:130px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:rgba(127,127,127,.06);
  margin-bottom:13px
}
.symbol svg{
  width:190px;
  height:105px;
  stroke:var(--text);
  fill:none;
  stroke-width:3;
  stroke-linecap:round;
  stroke-linejoin:round
}
.card h2{font-size:18px;margin:5px 0}
.tag{
  display:inline-block;
  padding:4px 8px;
  border-radius:7px;
  background:rgba(11,111,254,.1);
  color:var(--accent);
  font-size:12px;
  font-weight:700;
  margin-bottom:7px
}
.desc{
  color:var(--muted);
  font-size:14px;
  line-height:1.5
}
.meta{
  margin-top:10px;
  font-size:12px;
  color:var(--muted)
}
.empty{
  text-align:center;
  color:var(--muted);
  padding:50px
}
footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin:30px 0 10px
}
</style></head><body><div class="wrap"><header>
  <div class="brand">
    <div class="logo">E</div>
    <div>
      <h1>ErikAI Electronics</h1>
      <div class="sub">Knižnica elektronických a elektrotechnických schematických značiek</div>
    </div>
  </div><button onclick="theme()">🌓 Režim</button>

</header><input
id="search"
class="search"
placeholder="🔍 Hľadať značku, názov alebo označenie..."
oninput="render()"

«»

/* =========================================================
   DATABÁZA
   ========================================================= */

const data=[

["Základy","Vodič","W","wire",
"Elektricky vodivá cesta určená na prepojenie jednotlivých uzlov elektrického obvodu. V schémach sa znázorňuje čiarou."],

["Základy","Spojenie vodičov","—","junction",
"Elektrické spojenie dvoch alebo viacerých vodičov v spoločnom uzle. Spojenie je v schéme vyznačené plným bodom."],

["Základy","Križovanie bez spojenia","—","cross",
"Grafické križovanie vodičov bez elektrického spojenia. Samotné prekrižovanie čiar neznamená spoločný elektrický uzol."],

["Základy","Uzemnenie / GND","PE / GND","ground",
"Symbol označuje uzemnenie alebo referenčný potenciál obvodu. Význam závisí od konkrétneho zapojenia; GND nie je vo všetkých prípadoch totožné s ochranným vodičom PE."],

["Zdroje","Batéria","BT","battery",
"Zdroj jednosmerného elektrického napätia pozostávajúci z jedného alebo viacerých elektrochemických článkov. Polarita je určená kladným a záporným pólom."],

["Zdroje","Zdroj jednosmerného napätia","VDC","dc",
"Zdroj elektrickej energie s jednosmerným napätím. Polarita a veľkosť napätia sa v ideálnom prípade v čase nemenia."],

["Zdroje","Zdroj striedavého napätia","VAC","ac",

["Pasívne","Rezistor","R","resistor",
"Pasívny dvojpólový prvok, ktorý kladie elektrickému prúdu odpor. V ideálnom prípade platí Ohmov zákon U = R·I. Hodnota odporu sa udáva v ohmoch (Ω)."],

["Pasívne","Potenciometer","RP","pot",
"Nastaviteľný rezistor s pohyblivým jazdcom. Používa sa napríklad na plynulú zmenu odporu alebo vytvorenie nastaviteľného napäťového deliča."],

["Pasívne","Kondenzátor","C","capacitor",
"Pasívny dvojpólový prvok schopný akumulovať elektrický náboj a energiu v elektrickom poli. Kapacita sa udáva vo faradoch (F)."],

["Pasívne","Polarizovaný kondenzátor","C","polarCap",
"Kondenzátor s definovanou polaritou, typicky elektrolytický kondenzátor. Pri jednosmernom zapojení je potrebné dodržať predpísanú polaritu."],

["Pasívne","Cievka","L","inductor",
"Pasívny prvok, ktorý akumuluje energiu v magnetickom poli. Jeho impedancia závisí od frekvencie a ideálna induktancia sa udáva v henryoch (H)."],

["Pasívne","Transformátor","T","transformer",
"Elektromagnetické zariadenie s najmenej dvoma vinutiami, ktoré prenáša elektrickú energiu prostredníctvom meniaceho sa magnetického poľa. Používa sa najmä v obvodoch striedavého prúdu."],

["Diódy","Dióda","D","diode",
"Polovodičový dvojpólový prvok s usmerňovacím účinkom. V priepustnom smere umožňuje výraznejší prúd, zatiaľ čo v závernom smere prúd výrazne obmedzuje až do oblasti prierazu."],

["Diódy","LED","LED","led",
"Svetlo emitujúca dióda, ktorá pri priepustnej polarizácii premieňa časť elektrickej energie na optické žiarenie."],

["Diódy","Zenerova dióda","DZ","zener",
"Špeciálna dióda určená na stabilnú prevádzku v závernom smere v oblasti prierazu. Používa sa napríklad na stabilizáciu alebo referenciu napätia."],

["Diódy","Fotodióda","PD","photo",
"Polovodičová dióda citlivá na dopadajúce optické žiarenie. Osvetlenie ovplyvňuje jej prúdové charakteristiky a umožňuje detekciu svetla."],

["Spínanie","Vypínač SPST","S","switch",
"Jednopólový jednopolohový spínač (SPST), ktorý vytvára alebo prerušuje elektrickú vodivú cestu medzi dvoma kontaktmi."],

["Spínanie","Tlačidlo","S","button",
"Momentový spínací prvok, ktorého stav sa mení mechanickým stlačením. Môže byť normálne otvorený (NO) alebo normálne zatvorený (NC)."],

["Ochrana","Poistka","F","fuse",
"Ochranný prvok zapojený do série s obvodom. Pri prekročení určitej hodnoty prúdu dôjde k taveniu poistkového prvku a prerušeniu obvodu."],

["Tranzistory","NPN tranzistor","Q","npn",
"Bipolárny tranzistor s vrstvami typu N-P-N. Malý prúd bázy umožňuje riadiť podstatne väčší kolektorový prúd, preto sa používa na spínanie a zosilňovanie."],

["Tranzistory","PNP tranzistor","Q","pnp",
"Bipolárny tranzistor s vrstvami typu P-N-P. Jeho činnosť je komplementárna k NPN tranzistoru a používa sa najmä v zosilňovacích a spínacích obvodoch."],

["Tranzistory","MOSFET","Q","mosfet",
"Tranzistor s riadením pomocou elektrického poľa. Napätie medzi riadiacou elektródou a zdrojom ovplyvňuje vodivosť kanála. Vyznačuje sa vysokým vstupným odporom."],

["Výstupy","Motor","M","motor",
"Elektromechanický menič, ktorý premieňa elektrickú energiu na mechanickú energiu a vytvára rotačný alebo iný mechanický pohyb."],

["Výstupy","Žiarovka / lampa","H","lamp",
"Elektrický spotrebič alebo signalizačný prvok, ktorý premieňa elektrickú energiu najmä na svetelné žiarenie a teplo."],

["Výstupy","Reproduktor","LS","speaker",
"Elektroakustický menič, ktorý premieňa elektrický signál na mechanické kmity membrány a následne na akustické vlnenie."],

["Výstupy","Bzučiak","BZ","buzzer",
"Elektroakustický signalizačný prvok určený na vytváranie zvukového signálu pri privedení elektrického napätia alebo riadiaceho signálu."],

["Meranie","Voltmeter","V","voltmeter",
"Merací prístroj určený na meranie elektrického napätia medzi dvoma bodmi obvodu. Do obvodu sa pripája paralelne. Jednotkou je volt (V)."],

["Meranie","Ampérmeter","A","ammeter",
"Merací prístroj určený na meranie elektrického prúdu pretekajúceho obvodom. Do obvodu sa zapája sériovo. Jednotkou je ampér (A)."],

["Meranie","Ohmmeter","Ω","ohmmeter",
"Merací prístroj určený na meranie elektrického odporu. Pri meraní sa obvod spravidla odpojí od napájania. Jednotkou odporu je ohm (Ω)."],

["Logika","AND","&","and",
"Logický člen AND realizuje logickú konjunkciu. Výstup nadobúda logickú hodnotu 1 iba v prípade, že všetky vstupy majú hodnotu 1."],

["Logika","OR","≥1","or",
"Logický člen OR realizuje logickú disjunkciu. Výstup nadobúda hodnotu 1 vtedy, keď je aspoň jeden zo vstupov v logickom stave 1."],

["Logika","NOT","1","not",
"Logický invertor realizujúci negáciu vstupného signálu. Výstupná logická hodnota je opačná ako vstupná hodnota."],

["Logika","NAND","⊼","nand",
"Negovaný logický člen AND. Výstup má hodnotu 0 iba v prípade, keď všetky vstupy majú hodnotu 1; v ostatných prípadoch je výstup 1."],

["Logika","NOR","⊽","nor",
"Negovaný logický člen OR. Výstup má hodnotu 1 iba v prípade, keď všetky vstupy majú hodnotu 0."],

["Logika","XOR","=1","xor",
"Logický člen XOR realizuje výlučné ALEBO. Pri dvoch vstupoch je výstup 1 vtedy, keď práve jeden vstup má hodnotu 1."]

/* =========================================================
   KATEGÓRIE
   ========================================================= */

const categories=["Všetky",...new Set(data.map(x=>x[0]))];
let active="Všetky";

document.getElementById("cats").innerHTML=
categories.map(c=>`
<button class="${c==="Všetky"?"active":""}"
onclick="setCat('${c}')">${c}</button>
`).join("");

function setCat(c){
  active=c;

  document.querySelectorAll(".categories button")
    .forEach(b=>b.classList.toggle("active",b.textContent===c));

  render();
}


/* =========================================================
   VYKRESLENIE
   ========================================================= */

function render(){

  const q=document.getElementById("search").value.toLowerCase().trim();

  const list=data.filter(x=>{

    const category=
      active==="Všetky" || x[0]===active;

    const search=
      !q ||
      x.slice(0,3)
       .join(" ")
       .toLowerCase()
       .includes(q)
      ||
      x[4]
       .toLowerCase()
       .includes(q);

    return category && search;
  });

  document.getElementById("grid").innerHTML=

    list.length

    ? list.map(x=>`

      <article class="card">

        <div class="symbol">
          ${S[x[3]]}
        </div>

        <span class="tag">
          ${x[0]}
        </span>

        <h2>
          ${x[1]}
        </h2>

        <div class="desc">
          ${x[4]}
        </div>

        <div class="meta">
          Označenie: <b>${x[2]}</b>
        </div>

      </article>

    `).join("")

    :

    `<div class="empty">
      🔎 Žiadna značka nebola nájdená.
    </div>`;
}


/* =========================================================
   TMAVÝ REŽIM
   ========================================================= */

function theme(){

  const dark=
    document.documentElement
      .getAttribute("data-theme")==="dark";

  document.documentElement
    .toggleAttribute("data-theme",!dark);

  localStorage.setItem(
    "erikai-electronics-theme",
    !dark ? "dark" : "light"
  );
}


if(
  localStorage.getItem(
    "erikai-electronics-theme"
  )==="dark"
){

  document.documentElement
    .setAttribute("data-theme","dark");
}


/* =========================================================
   SPUSTENIE
   ========================================================= */

render();

</script></body>
</html>
