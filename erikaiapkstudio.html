<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML → Android APK Export</title>
</head>
<body>
<h1>Vyber HTML súbor pre Android Studio</h1>

<input type="file" id="fileInput" accept=".html">
<button id="downloadBtn">Stiahnuť pripravené pre Android</button>

<script>
let loadedHTML = '';

document.getElementById('fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    loadedHTML = await file.text(); // načíta celý obsah HTML vrátane <html>, <head>, <body>
});

document.getElementById('downloadBtn').addEventListener('click', () => {
    if (!loadedHTML) { 
        alert('Najprv vyber HTML súbor'); 
        return; 
    }

    // Vytvor Blob zo všetkého HTML obsahu
    const blob = new Blob([loadedHTML], {type:'text/html'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'html_for_android.html';
    document.body.appendChild(a); // potrebné na niektorých prehliadačoch
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
