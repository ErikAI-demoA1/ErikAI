<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML → APK Export</title>
</head>
<body>

<input type="file" id="fileInput" accept=".html">
<button id="downloadBtn">Stiahnuť pripravené pre APK</button>

<script>
let loadedHTML = '';

// Načítanie HTML súboru
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  loadedHTML = await file.text(); // necháme celý obsah HTML
});

// Stiahnutie pripraveného súboru
document.getElementById('downloadBtn').addEventListener('click', () => {
  if (!loadedHTML) {
    alert('Najprv vyber HTML súbor');
    return;
  }

  const blob = new Blob([loadedHTML], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'prepared_for_apk.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
});
</script>

</body>
</html>
