<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML → APK Launcher</title>
<style>
  body {font-family:sans-serif; margin:0; padding:16px; background:#071026; color:#e6eef6;}
  h1 {font-size:20px; margin-bottom:12px;}
  input, button {padding:8px 12px; border-radius:6px; border:none; margin:4px 0;}
  button {background:#34d399; color:#041014; cursor:pointer;}
  #preview {margin-top:16px; padding:12px; background:rgba(255,255,255,0.02); border-radius:8px; min-height:300px; overflow:auto;}
</style>
</head>
<body>
<h1>HTML → APK Launcher</h1>

<label>Vyber svoj HTML súbor:</label><br>
<input type="file" id="fileInput" accept=".html"><br>
<button id="downloadBtn">Stiahnuť pripravené pre APK</button>

<div id="preview"></div>

<script>
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
let loadedHTML = '';

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  loadedHTML = await file.text();
  preview.innerHTML = loadedHTML;
});

// export single-file HTML pre APK
document.getElementById('downloadBtn').addEventListener('click', () => {
  if(!loadedHTML) { alert('Najprv vyber HTML súbor'); return; }

  const wrapperHTML = `<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Export pre APK</title>
<style>
body{margin:0;font-family:sans-serif;background:#071026;color:#e6eef6}
</style>
</head>
<body>
${loadedHTML}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</body>
</html>`;

  const blob = new Blob([wrapperHTML], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'prepared_for_apk.html';
  a.click();
});
</script>
</body>
</html>
