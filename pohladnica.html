<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Univerzálna pohľadnica — ErikAI</title>
<style>
:root{
--bg:#071021;--card:#072034;--accent:#06b6d4;--muted:#9fb2d1;--text:#f3fcff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(180deg,#02061a,var(--bg));color:var(--text);display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;padding:18px;}
.panel{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.03);width:360px;}
h2{margin:6px 0 10px 0;font-size:16px}
label{font-size:13px;color:var(--muted);display:block;margin-top:8px}
select,textarea,input,button{width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--text);font-size:14px}
textarea{min-height:88px;resize:vertical}
.row{display:flex;gap:8px}
.row>*{flex:1}
button{cursor:pointer;background:linear-gradient(90deg,var(--accent),#8b5cf6);border:none;color:#021;font-weight:700}
.previewWrap{flex:1;min-width:360px;display:flex;align-items:center;justify-content:center;padding:12px}
.card{width:900px;height:600px;border-radius:12px;overflow:hidden;position:relative;background:linear-gradient(180deg,#072034,#051225);box-shadow:0 20px 60px rgba(2,6,23,0.7);display:block;}
.front{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px;text-align:center}
.headline{font-size:48px;font-weight:900;margin:6px 0;letter-spacing:1px}
.sub{font-size:20px;opacity:0.95;margin-top:6px}
.watermark{position:absolute;bottom:12px;right:12px;font-size:12px;color:rgba(255,255,255,0.25);font-weight:700;pointer-events:none;}
.decor{position:absolute;inset:0;pointer-events:none;}
.back{display:none;position:absolute;inset:0;padding:30px;color:#021;background:white;}
.small{font-size:13px;padding:6px}
.controlsRow{display:flex;gap:8px;margin-top:8px}
.muted{color:var(--muted);font-size:13px}
footer{width:100%;text-align:center;color:var(--muted);font-size:13px;margin-top:6px}
.snow,.lights,.fireworkCanvas{position:absolute;inset:0;pointer-events:none;}
.lights .bulb{position:absolute;border-radius:50%;box-shadow:0 0 18px rgba(255,255,255,0.06);}
@media print{body{background:white;padding:0}.panel,.previewWrap{display:none}.card{box-shadow:none;border-radius:0}}
@media (max-width:980px){body{flex-direction:column;align-items:stretch}.panel{width:100%}.previewWrap{width:100%}.card{width:95vw;height:63.333vw;max-height:95vh}}
</style>
</head>
<body>

<div class="panel">
<h2>Univerzálna pohľadnica — nastavenia</h2>
<label>Sviatok / štýl</label>
<select id="holiday">
<option value="universal">Univerzálne</option>
<option value="christmas">Vianoce (sneh + svetielka)</option>
<option value="newyear">Nový rok (ohňostroj)</option>
<option value="birthday">Narodeniny (confetti)</option>
<option value="custom">Vlastné (bez efektov)</option>
</select>
<label>Predný text (veľký nadpis)</label>
<input id="headline" value="Veselé sviatky"/>
<label>Podnadpis / krátka správa</label>
<textarea id="subtitle">Nech je tvoj rok naplnený radosťou a úsmevom.</textarea>
<label>Rozmery tlače</label>
<select id="size">
<option value="A6">A6 (105 × 148 mm)</option>
<option value="5x7">5 × 7 in (127 × 178 mm)</option>
<option value="A5fold">A5 (148 × 210 mm)</option>
<option value="DL">DL (99 × 210 mm)</option>
</select>
<label>Farba textu</label>
<input id="txtColor" type="color" value="#e6f6ff"/>
<div class="controlsRow">
<button id="apply" class="small">Aktualizovať náhľad</button>
<button id="downloadPng" class="small">Stiahnuť PNG</button>
</div>
<div class="controlsRow" style="margin-top:8px">
<button id="downloadSvg" class="small">Stiahnuť SVG</button>
<button id="printBtn" class="small">Tlačiť</button>
</div>
<label class="muted">Tip: pri tlači vyber rozlíšenie 300dpi a škálovanie 100%.</label>
<footer>ErikAI — Univerzálna pohľadnica</footer>
</div>

<div class="previewWrap">
<div id="card" class="card" role="img" aria-label="Pohľadnica náhľad">
<div class="decor snow" id="snowLayer"></div>
<div class="decor lights" id="lightsLayer"></div>
<canvas class="decor fireworkCanvas" id="fwCanvas"></canvas>
<div class="front" id="frontFace">
<div class="headline" id="headlineEl">Veselé sviatky</div>
<div class="sub" id="subtitleEl">Nech je tvoj rok naplnený radosťou a úsmevom.</div>
<div class="watermark">ErikAI OS</div>
</div>
<div class="back" id="backFace">
<div style="display:flex;justify-content:space-between;align-items:flex-start">
<div style="width:60%">
<h3 style="color:#021;margin:0 0 6px 0">Tvoje prianie</h3>
<p style="color:#021;opacity:0.8" id="backMessage">Tu napíš svoje prianie pred tlačou.</p>
</div>
<div style="width:36%;text-align:right;color:#021;font-size:12px">
<div>Od: ____________________</div>
<div style="margin-top:12px">Adresa príjemcu:</div>
<div style="margin-top:8px">____________________</div>
</div>
</div>
</div>
</div>
</div>

<script>
// --- references ---
const holiday=document.getElementById('holiday'),headline=document.getElementById('headline'),subtitle=document.getElementById('subtitle'),txtColor=document.getElementById('txtColor'),applyBtn=document.getElementById('apply'),card=document.getElementById('card'),headlineEl=document.getElementById('headlineEl'),subtitleEl=document.getElementById('subtitleEl'),snowLayer=document.getElementById('snowLayer'),lightsLayer=document.getElementById('lightsLayer'),fwCanvas=document.getElementById('fwCanvas'),sizeSel=document.getElementById('size'),downloadPng=document.getElementById('downloadPng'),downloadSvg=document.getElementById('downloadSvg'),printBtn=document.getElementById('printBtn');

// --- size ---
function applySizeToCardForPrint(){const map={'A6':{w:105,h:148},'5x7':{w:127,h:178},'A5fold':{w:148,h:210},'DL':{w:99,h:210}};const mm=map[sizeSel.value]||map['A6'];card.setAttribute('data-print-w-mm',mm.w);card.setAttribute('data-print-h-mm',mm.h);const baseW=127;const scale=mm.w/baseW;card.style.transform=`scale(${Math.min(1.0,0.95*scale)})`}
applySizeToCardForPrint();

// --- snow ---
function makeSnow(){snowLayer.innerHTML='';let N=40;for(let i=0;i<N;i++){const s=document.createElement('div');const size=4+Math.random()*8;s.style.position='absolute';s.style.left=(Math.random()*100)+'%';s.style.top=(-Math.random()*40)+'%';s.style.width=size+'px';s.style.height=size+'px';s.style.background='rgba(255,255,255,'+(0.7*Math.random()+0.15)+')';s.style.borderRadius='50%';s.style.filter='blur('+(Math.random()*1.3)+'px)';s.dataset.speed=0.3+Math.random()*1.2;s.style.transform='translateY(0)';snowLayer.appendChild(s);}let last=performance.now();function step(now){const dt=(now-last)/1000;last=now;Array.from(snowLayer.children).forEach(el=>{let top=parseFloat(el.style.top);top+=dt*(20*el.dataset.speed);if(top>110)top=-10-Math.random()*20,el.style.left=(Math.random()*100)+'%';el.style.top=top+'%';});snowLayer._r=requestAnimationFrame(step)}cancelAnimationFrame(snowLayer._r||0);snowLayer._r=requestAnimationFrame(step)}

// --- lights ---
function makeLights(){lightsLayer.innerHTML='';const colors=['#ffefc2','#ffd1dc','#bde6ff','#c8ffdf','#fff3b0'];const bulbs=12;for(let i=0;i<bulbs;i++){const b=document.createElement('div');b.className='bulb';const left=(i/(bulbs-1))*100;b.style.left=left+'%';b.style.top='6%';const size=12+Math.random()*8;b.style.width=size+'px';b.style.height=size+'px';b.style.background=colors[i%colors.length];b.style.boxShadow=`0 0 ${8+Math.random()*12}px ${colors[i%colors.length]}`;b.style.opacity=0.9;b.style.transform='translateX(-50%)';lightsLayer.appendChild(b);(function(el){let on=true;setInterval(()=>{el.style.opacity=on?0.18:0.95;on=!on},700+Math.random()*900)})(b)}}

// --- fireworks/confetti ---
function makeFireworks(){const c=fwCanvas;const ctx=c.getContext('2d');function resize(){c.width=card.clientWidth;c.height=card.clientHeight}resize();window.addEventListener('resize',resize);let particles=[];function launch(){const cx=Math.random()*c.width*0.6+c.width*0.2;const cy=Math.random()*c.height*0.4+c.height*0.1;const count=16+Math.floor(Math.random()*28);const hue=Math.floor(Math.random()*360);for(let i=0;i<count;i++){const angle=Math.random()*Math.PI*2;const speed=1.6+Math.random()*4.2;particles.push({x:cx,y:cy,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:100+Math.random()*80,color:`hsl(${hue+Math.random()*40-20},85%,60%)`})}}let last=performance.now();function tick(now){const dt=(now-last)/16.666;last=now;ctx.clearRect(0,0,c.width,c.height);ctx.globalCompositeOperation='lighter';for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt*0.8;p.y+=p.vy*dt*0.8+0.3*dt;p.vy+=0.02*dt;p.life-=dt*1.2;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0.8,p.life/30),0,Math.PI*2);ctx.fill();if(p.life<=0)particles.splice(i,1)}if(Math.random()<0.02)launch();fwCanvas._r=requestAnimationFrame(tick)}cancelAnimationFrame(fwCanvas._r||0);fwCanvas._r=requestAnimationFrame(tick)}

// --- apply settings ---
function applySettings(){
headlineEl.textContent=headline.value||'';subtitleEl.textContent=subtitle.value||'';headlineEl.style.color=txtColor.value;subtitleEl.style.color=txtColor.value;snowLayer.style.display='none';lightsLayer.style.display='none';fwCanvas.style.display='none';cancelAnimationFrame(snowLayer._r||0);cancelAnimationFrame(fwCanvas._r||0);
if(holiday.value==='christmas'){snowLayer.style.display='block';lightsLayer.style.display='block';makeSnow();makeLights();}
else if(holiday.value==='newyear'){fwCanvas.style.display='block';makeFireworks();}
else if(holiday.value==='birthday'){fwCanvas.style.display='block';makeFireworks();}
applySizeToCardForPrint();}

applyBtn.addEventListener('click',applySettings);
holiday.addEventListener('change',applySettings);
sizeSel.addEventListener('change',applySizeToCardForPrint);

// --- download PNG ---
downloadPng.addEventListener('click',function(){
const w=card.clientWidth,h=card.clientHeight;
const canvas=document.createElement('canvas');
canvas.width=w*2;canvas.height=h*2;
const ctx=canvas.getContext('2d');
ctx.fillStyle='#072034';ctx.fillRect(0,0,canvas.width,canvas.height);
// clone card
html2canvas(card,{canvas:canvas,scale:2,backgroundColor:null}).then(function(){canvas.toBlob(function(blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pohladnica.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);})})});

// --- download SVG ---
downloadSvg.addEventListener('click',function(){
const clone=card.cloneNode(true);const c=clone.querySelector('canvas');if(c)c.remove();const html=new XMLSerializer().serializeToString(clone);const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${card.clientWidth}" height="${card.clientHeight}"><foreignObject x="0" y="0" width="100%" height="100%">${html}</foreignObject></svg>`;const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='pohladnica.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);});

// --- print ---
printBtn.addEventListener('click',function(){
const mmW=card.getAttribute('data-print-w-mm')||105,mmH=card.getAttribute('data-print-h-mm')||148;const style=document.createElement('style');style.id='print-size-style';style.textContent=`@page{margin:0mm}@media print{body *{visibility:hidden !important}#card{visibility:visible !important;position:absolute !important;left:0;top:0;width:${mmW}mm !important;height:${mmH}mm !important;transform:none !important}}`;document.head.appendChild(style);setTimeout(()=>{window.print();setTimeout(()=>{style.remove()},500)},200);});

applySettings();
</script>
<!-- Add html2canvas CDN for PNG export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
