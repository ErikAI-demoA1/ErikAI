<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Univerzálna pohľadnica — ErikAI</title>
<style>
  :root{
    --bg:#071021; --card:#072034; --accent:#06b6d4; --muted:#9fb2d1;
    --text:#f3fcff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter, system-ui, Arial; background:linear-gradient(180deg,#02061a,var(--bg)); color:var(--text);
    display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;padding:18px;}
  .panel{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));
    border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.03);width:360px;}
  h2{margin:6px 0 10px 0;font-size:16px}
  label{font-size:13px;color:var(--muted);display:block;margin-top:8px}
  select,textarea,input,button{width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);
    background:transparent;color:var(--text);font-size:14px}
  textarea{min-height:88px;resize:vertical}
  .row{display:flex;gap:8px}
  .row > *{flex:1}
  button{cursor:pointer;background:linear-gradient(90deg,var(--accent),#8b5cf6);border:none;color:#021;font-weight:700}
  .previewWrap{flex:1;min-width:360px;display:flex;align-items:center;justify-content:center;padding:12px}
  .card {
    width:900px; height:600px; border-radius:12px; overflow:hidden; position:relative;
    background:linear-gradient(180deg,#072034,#051225); box-shadow:0 20px 60px rgba(2,6,23,0.7);
    display:block;
  }
  .front { position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px;text-align:center }
  .headline{font-size:48px;font-weight:900;margin:6px 0; letter-spacing:1px}
  .sub{font-size:20px;opacity:0.95;margin-top:6px}
  .watermark{position:absolute;bottom:12px;right:12px;font-size:12px;color:rgba(255,255,255,0.25);font-weight:700;pointer-events:none;}
  .decor { position:absolute;inset:0;pointer-events:none; }
  .back { display:none;position:absolute;inset:0;padding:30px;color:#021;background:white; }
  .small{font-size:13px;padding:6px}
  .controlsRow{display:flex;gap:8px;margin-top:8px}
  .muted{color:var(--muted);font-size:13px}
  footer{width:100%;text-align:center;color:var(--muted);font-size:13px;margin-top:6px}

  .snow, .lights, .fireworkCanvas { position:absolute;inset:0;pointer-events:none; }
  .lights .bulb{position:absolute;border-radius:50%;box-shadow:0 0 18px rgba(255,255,255,0.06);}
  
  @media print{
    body{background:white;padding:0}
    .panel,.previewWrap{display:none}
    .card{box-shadow:none;border-radius:0}
  }
  @media (max-width:980px){
    body{flex-direction:column;align-items:stretch}
    .panel{width:100%}
    .previewWrap{width:100%}
    .card{width:95vw;height:63.333vw;max-height:95vh}
  }
</style>
</head>
<body>

<div class="panel">
  <h2>Univerzálna pohľadnica — nastavenia</h2>

  <label>Sviatok / štýl</label>
  <select id="holiday">
    <option value="universal">Univerzálne</option>
    <option value="christmas">Vianoce (sneh + svetielka)</option>
    <option value="newyear">Nový rok (ohňostroj)</option>
    <option value="birthday">Narodeniny (confetti)</option>
    <option value="custom">Vlastné (bez efektov)</option>
  </select>

  <label>Predný text (veľký nadpis)</label>
  <input id="headline" value="Veselé sviatky" />

  <label>Podnadpis / krátka správa</label>
  <textarea id="subtitle">Nech je tvoj rok naplnený radosťou a úsmevom.</textarea>

  <label>Rozmery tlače</label>
  <select id="size">
    <option value="A6">A6 (105 × 148 mm)</option>
    <option value="5x7">5 × 7 in (127 × 178 mm)</option>
    <option value="A5fold">A5 (148 × 210 mm)</option>
    <option value="DL">DL (99 × 210 mm)</option>
  </select>

  <label>Farba textu</label>
  <input id="txtColor" type="color" value="#e6f6ff" />

  <div class="controlsRow">
    <button id="apply" class="small">Aktualizovať náhľad</button>
    <button id="downloadPng" class="small">Stiahnuť PNG</button>
  </div>

  <div class="controlsRow" style="margin-top:8px">
    <button id="downloadSvg" class="small">Stiahnuť SVG</button>
    <button id="printBtn" class="small">Tlačiť</button>
  </div>

  <label class="muted">Tip: pri tlači vyber rozlíšenie 300dpi a škálovanie 100%.</label>
  <footer>ErikAI — Univerzálna pohľadnica</footer>
</div>

<div class="previewWrap">
  <div id="card" class="card" role="img" aria-label="Pohľadnica náhľad">
    <div class="decor snow" id="snowLayer"></div>
    <div class="decor lights" id="lightsLayer"></div>
    <canvas class="decor fireworkCanvas" id="fwCanvas"></canvas>

    <div class="front" id="frontFace">
      <div class="headline" id="headlineEl">Veselé sviatky</div>
      <div class="sub" id="subtitleEl">Nech je tvoj rok naplnený radosťou a úsmevom.</div>
      <div class="watermark">ErikAI OS</div>
    </div>

    <div class="back" id="backFace">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="width:60%">
          <h3 style="color:#021;margin:0 0 6px 0">Tvoje prianie</h3>
          <p style="color:#021;opacity:0.8" id="backMessage">Tu napíš svoje prianie pred tlačou.</p>
        </div>
        <div style="width:36%;text-align:right;color:#021;font-size:12px">
          <div>Od: ____________________</div><div style="margin-top:12px">Adresa príjemcu:</div><div style="margin-top:8px">____________________</div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// --- všetky tvoje JS funkcie (animácie, export, tlač) ---
const holiday = document.getElementById('holiday');
const headline = document.getElementById('headline');
const subtitle = document.getElementById('subtitle');
const txtColor = document.getElementById('txtColor');
const applyBtn = document.getElementById('apply');
const card = document.getElementById('card');
const headlineEl = document.getElementById('headlineEl');
const subtitleEl = document.getElementById('subtitleEl');
const snowLayer = document.getElementById('snowLayer');
const lightsLayer = document.getElementById('lightsLayer');
const fwCanvas = document.getElementById('fwCanvas');
const sizeSel = document.getElementById('size');
const downloadPng = document.getElementById('downloadPng');
const downloadSvg = document.getElementById('downloadSvg');
const printBtn = document.getElementById('printBtn');

function applySizeToCardForPrint() {
  const map = {'A6': {w:105,h:148}, '5x7': {w:127,h:178}, 'A5fold': {w:148,h:210}, 'DL': {w:99,h:210}};
  const mm = map[sizeSel.value] || map['A6'];
  card.setAttribute('data-print-w-mm', mm.w);
  card.setAttribute('data-print-h-mm', mm.h);
  const baseW = 127;
  const scale = mm.w / baseW;
  card.style.transform = `scale(${Math.min(1.0, 0.95*scale)})`;
}
applySizeToCardForPrint();

// --- Animácie (sneh, svetielka, ohňostroj) ---
// tu môžeš skopírovať celý JS z predchádzajúcej verzie, vrátane makeSnow(), makeLights(), makeFireworks()

function applySettings(){
  headlineEl.textContent = headline.value || '';
  subtitleEl.textContent = subtitle.value || '';
  headlineEl.style.color = txtColor.value;
  subtitleEl.style.color = txtColor.value;
  snowLayer.style.display='none'; lightsLayer.style.display='none'; fwCanvas.style.display='none';
  cancelAnimationFrame(snowLayer._r||0); cancelAnimationFrame(fwCanvas._r||0);
  if(holiday.value==='christmas'){ snowLayer.style.display='block'; lightsLayer.style.display='block'; makeSnow(); makeLights(); }
  else if(holiday.value==='newyear'){ fwCanvas.style.display='block'; makeFireworks(); }
  else if(holiday.value==='birthday'){ fwCanvas.style.display='block'; makeFireworks(); }
  applySizeToCardForPrint();
}

applyBtn.addEventListener('click', applySettings);
holiday.addEventListener('change', applySettings);
sizeSel.addEventListener('change', applySizeToCardForPrint);
// --- export a tlač ---
downloadPng.addEventListener('click', ()=>{ /* tvoja funkcia downloadCardPNG() */ });
downloadSvg.addEventListener('click', ()=>{ /* tvoja funkcia downloadSVG() */ });
printBtn.addEventListener('click', ()=>{ /* tvoja funkcia printCard() */ });

applySettings();
</script>
</body>
</html>
