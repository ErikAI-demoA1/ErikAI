<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 TapRace - Klikni Rýchlo!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #162447);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 20px;
    text-align: center;
  }

  h1 {
    margin-top: 20px;
    color: #e94560;
    text-shadow: 2px 2px 5px #000;
    font-size: 3rem;
  }

  /* --- Výber módu --- */
  .mode-select {
    margin: 20px 0;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .mode-select button {
    background-color: #0f3460;
    border: none;
    padding: 15px 30px;
    color: #fff;
    font-size: 1.5rem;
    cursor: pointer;
    border-radius: 10px;
    transition: 0.3s;
    min-width: 140px;
  }
  .mode-select button:hover {
    background-color: #53354a;
  }

  /* --- Hra --- */
  .game-container {
    display: none;
    flex-direction: column;
    align-items: center;
    margin-top: 30px;
    width: 100%;
    max-width: 500px;
  }

  .click-btn {
    padding: 20px 40px;
    font-size: 2rem;
    border-radius: 15px;
    border: none;
    cursor: pointer;
    background-color: #e94560;
    color: #fff;
    margin: 20px;
    transition: 0.2s;
    width: 80%;
    max-width: 300px;
  }
  .click-btn:hover {
    background-color: #ff2e63;
  }

  .scoreboard {
    display: flex;
    justify-content: space-around;
    gap: 50px;
    margin-top: 20px;
    font-size: 1.5rem;
    flex-wrap: wrap;
  }

  .timer, .winner {
    font-size: 2rem;
    margin-top: 20px;
    word-wrap: break-word;
  }
  .timer { color: #ffda79; }
  .winner { color: #00ff85; }

  /* --- Reset button --- */
  .reset-btn {
    margin-top: 30px;
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    background: #53354a;
    color: #fff;
    border: none;
    font-size: 1rem;
    transition: 0.2s;
  }
  .reset-btn:hover { background-color: #0f3460; }

  /* --- Responsive --- */
  @media (max-width: 768px) {
    h1 { font-size: 2.5rem; }
    .mode-select button { font-size: 1.2rem; padding: 12px 24px; }
    .click-btn { font-size: 1.6rem; padding: 15px 30px; }
    .scoreboard { font-size: 1.2rem; gap: 20px; }
    .timer, .winner { font-size: 1.8rem; }
  }

  @media (max-width: 480px) {
    h1 { font-size: 2rem; }
    .mode-select button { font-size: 1rem; padding: 10px 20px; }
    .click-btn { font-size: 1.4rem; padding: 12px 25px; }
    .scoreboard { font-size: 1rem; gap: 15px; }
    .timer, .winner { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<h1>🎮 TapRace</h1>

<div class="mode-select">
  <button onclick="startGame('solo')">Solo</button>
  <button onclick="startGame('1v1')">1v1</button>
</div>

<div class="game-container" id="game">
  <div class="timer" id="timer">Čas: 10s</div>

  <!-- Solo mode -->
  <div id="solo-mode">
    <button class="click-btn" id="solo-btn">Klikni ma!</button>
    <div class="scoreboard">Skóre: <span id="solo-score">0</span></div>
  </div>

  <!-- 1v1 mode -->
  <div id="1v1-mode">
    <div class="scoreboard">
      <div>Hráč 1: <span id="p1-score">0</span></div>
      <div>Hráč 2: <span id="p2-score">0</span></div>
    </div>
    <div style="display:flex; gap:20px; margin-top:30px; flex-wrap: wrap; justify-content:center;">
      <button class="click-btn" id="p1-btn">Hráč 1 Klik</button>
      <button class="click-btn" id="p2-btn">Hráč 2 Klik</button>
    </div>
  </div>

  <div class="winner" id="winner"></div>
  <button class="reset-btn" id="resetBtn">🔄 Reset</button>
</div>

<script>
let timerInterval;
let time = 10;
let mode = '';
let soloScore = 0;
let p1Score = 0;
let p2Score = 0;

const timerEl = document.getElementById('timer');
const gameEl = document.getElementById('game');
const soloModeEl = document.getElementById('solo-mode');
const mode1v1El = document.getElementById('1v1-mode');
const winnerEl = document.getElementById('winner');
const resetBtn = document.getElementById('resetBtn');

// --- Funkcia štartu ---
function startGame(selectedMode){
  mode = selectedMode;
  gameEl.style.display = 'flex';
  winnerEl.innerText = '';
  
  soloModeEl.style.display = (mode==='solo') ? 'flex' : 'none';
  mode1v1El.style.display = (mode==='1v1') ? 'flex' : 'none';
  
  resetScores();
  time = 10;
  timerEl.innerText = `Čas: ${time}s`;
  
  // Povoliť klikacie tlačidlá
  enableButtons(true);

  clearInterval(timerInterval);
  timerInterval = setInterval(countDown, 1000);
}

// --- Odpočítavanie ---
function countDown(){
  time--;
  timerEl.innerText = `Čas: ${time}s`;
  if(time <= 0){
    clearInterval(timerInterval);
    endGame();
  }
}

// --- Solo klik ---
document.getElementById('solo-btn').addEventListener('click', ()=>{
  soloScore++;
  document.getElementById('solo-score').innerText = soloScore;
});

// --- 1v1 klik ---
document.getElementById('p1-btn').addEventListener('click', ()=>{ 
  p1Score++; 
  document.getElementById('p1-score').innerText = p1Score; 
});
document.getElementById('p2-btn').addEventListener('click', ()=>{ 
  p2Score++; 
  document.getElementById('p2-score').innerText = p2Score; 
});

// --- Koniec hry ---
function endGame(){
  enableButtons(false);
  if(mode==='solo'){
    winnerEl.innerText = `Koniec! Tvoje skóre: ${soloScore}`;
  } else if(mode==='1v1'){
    if(p1Score > p2Score) winnerEl.innerText = '🎉 Hráč 1 vyhráva!';
    else if(p2Score > p1Score) winnerEl.innerText = '🎉 Hráč 2 vyhráva!';
    else winnerEl.innerText = 'Remíza!';
  }
}

// --- Reset skóre ---
function resetScores(){
  soloScore = 0;
  p1Score = 0;
  p2Score = 0;
  document.getElementById('solo-score').innerText = soloScore;
  document.getElementById('p1-score').innerText = p1Score;
  document.getElementById('p2-score').innerText = p2Score;
}

// --- Povoliť / zakázať tlačidlá ---
function enableButtons(enable){
  document.getElementById('solo-btn').disabled = !enable;
  document.getElementById('p1-btn').disabled = !enable;
  document.getElementById('p2-btn').disabled = !enable;
  if(enable){
    document.getElementById('solo-btn').style.opacity = '1';
    document.getElementById('p1-btn').style.opacity = '1';
    document.getElementById('p2-btn').style.opacity = '1';
  } else {
    document.getElementById('solo-btn').style.opacity = '0.6';
    document.getElementById('p1-btn').style.opacity = '0.6';
    document.getElementById('p2-btn').style.opacity = '0.6';
  }
}

// --- Reset celej hry ---
resetBtn.addEventListener('click', ()=>{
  clearInterval(timerInterval);
  gameEl.style.display = 'none';
  winnerEl.innerText = '';
  resetScores();
});
</script>

</body>
  </html>
