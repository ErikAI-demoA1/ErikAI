<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 TapRace - Klikni Rýchlo!</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #162447);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
  }
  h1 {
    margin-top: 30px;
    color: #e94560;
    text-shadow: 2px 2px 5px #000;
  }
  .mode-select {
    margin: 20px;
  }
  .mode-select button {
    background-color: #0f3460;
    border: none;
    padding: 15px 30px;
    margin: 10px;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    border-radius: 10px;
    transition: 0.3s;
  }
  .mode-select button:hover {
    background-color: #53354a;
  }
  .game-container {
    display: none;
    flex-direction: column;
    align-items: center;
    margin-top: 30px;
  }
  .click-btn {
    padding: 25px 50px;
    font-size: 24px;
    border-radius: 15px;
    border: none;
    cursor: pointer;
    background-color: #e94560;
    color: #fff;
    margin: 20px;
    transition: 0.2s;
  }
  .click-btn:hover {
    background-color: #ff2e63;
  }
  .scoreboard {
    display: flex;
    justify-content: center;
    gap: 50px;
    margin-top: 20px;
    font-size: 22px;
  }
  .timer {
    font-size: 28px;
    margin-top: 20px;
    color: #ffda79;
  }
  .winner {
    font-size: 28px;
    margin-top: 20px;
    color: #00ff85;
  }
</style>
</head>
<body>

<h1>🎮 TapRace</h1>

<div class="mode-select">
  <button onclick="startGame('solo')">Solo</button>
  <button onclick="startGame('1v1')">1v1</button>
</div>

<div class="game-container" id="game">
  <div class="timer" id="timer">Čas: 10s</div>
  <div id="solo-mode">
    <button class="click-btn" id="solo-btn">Klikni ma!</button>
    <div class="scoreboard">Skóre: <span id="solo-score">0</span></div>
  </div>
  <div id="1v1-mode">
    <div class="scoreboard">
      <div>Hráč 1: <span id="p1-score">0</span></div>
      <div>Hráč 2: <span id="p2-score">0</span></div>
    </div>
    <div style="display:flex; gap:50px; margin-top:30px;">
      <button class="click-btn" id="p1-btn">Hráč 1 Klik</button>
      <button class="click-btn" id="p2-btn">Hráč 2 Klik</button>
    </div>
  </div>
  <div class="winner" id="winner"></div>
  <button onclick="resetGame()" style="margin-top:30px; padding:10px 20px; border-radius:10px; cursor:pointer; background:#53354a; color:#fff; border:none;">Reset</button>
</div>

<script>
let timerInterval;
let time = 10;
let mode = '';
let soloScore = 0;
let p1Score = 0;
let p2Score = 0;

const timerEl = document.getElementById('timer');
const gameEl = document.getElementById('game');
const soloModeEl = document.getElementById('solo-mode');
const mode1v1El = document.getElementById('1v1-mode');
const winnerEl = document.getElementById('winner');

function startGame(selectedMode){
  mode = selectedMode;
  gameEl.style.display = 'flex';
  winnerEl.innerText = '';
  soloModeEl.style.display = (mode==='solo') ? 'flex' : 'none';
  mode1v1El.style.display = (mode==='1v1') ? 'flex' : 'none';
  soloScore = 0; p1Score=0; p2Score=0;
  document.getElementById('solo-score').innerText = soloScore;
  document.getElementById('p1-score').innerText = p1Score;
  document.getElementById('p2-score').innerText = p2Score;
  time = 10;
  timerEl.innerText = `Čas: ${time}s`;
  timerInterval = setInterval(countDown, 1000);
}

function countDown(){
  time--;
  timerEl.innerText = `Čas: ${time}s`;
  if(time <= 0){
    clearInterval(timerInterval);
    endGame();
  }
}

// Solo klik
document.getElementById('solo-btn').addEventListener('click', ()=>{
  soloScore++;
  document.getElementById('solo-score').innerText = soloScore;
});

// 1v1 klik
document.getElementById('p1-btn').addEventListener('click', ()=>{ p1Score++; document.getElementById('p1-score').innerText = p1Score; });
document.getElementById('p2-btn').addEventListener('click', ()=>{ p2Score++; document.getElementById('p2-score').innerText = p2Score; });

function endGame(){
  if(mode==='solo'){
    winnerEl.innerText = `Koniec! Tvoje skóre: ${soloScore}`;
  } else if(mode==='1v1'){
    if(p1Score > p2Score) winnerEl.innerText = '🎉 Hráč 1 vyhráva!';
    else if(p2Score > p1Score) winnerEl.innerText = '🎉 Hráč 2 vyhráva!';
    else winnerEl.innerText = 'Remíza!';
  }
}

function resetGame(){
  clearInterval(timerInterval);
  gameEl.style.display = 'none';
  winnerEl.innerText = '';
}
</script>

</body>
</html>
