<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 TapRace - Klikni Rýchlo!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

  body {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
  }

  h1 {
    margin-top: 30px;
    font-size: 3em;
    color: #ff4b5c;
    text-shadow: 2px 2px 8px #000;
    text-align: center;
  }

  .mode-select {
    margin: 25px;
  }

  .mode-select button {
    background: linear-gradient(145deg, #1f4068, #2a5298);
    border: none;
    padding: 15px 40px;
    margin: 15px;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    border-radius: 15px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
  }

  .mode-select button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.4);
  }

  .game-container {
    display: none;
    flex-direction: column;
    align-items: center;
    margin-top: 30px;
  }

  .click-btn {
    padding: 25px 60px;
    font-size: 26px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    background: linear-gradient(145deg, #ff4b5c, #ff6b81);
    color: #fff;
    margin: 20px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    transition: all 0.2s ease;
  }

  .click-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 20px rgba(0,0,0,0.4);
  }

  .scoreboard {
    display: flex;
    justify-content: center;
    gap: 60px;
    margin-top: 25px;
    font-size: 24px;
    font-weight: 600;
    color: #ffda79;
  }

  .timer {
    font-size: 32px;
    margin-top: 15px;
    color: #00ffc8;
    font-weight: 700;
    text-shadow: 1px 1px 8px #000;
  }

  .winner {
    font-size: 32px;
    margin-top: 25px;
    color: #ffda79;
    text-shadow: 2px 2px 10px #000;
    animation: pulse 1s infinite alternate;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.1); }
  }

  .reset-btn {
    margin-top: 30px;
    padding: 12px 25px;
    border-radius: 15px;
    cursor: pointer;
    background: linear-gradient(145deg, #2a2a72, #4a4aa6);
    color: #fff;
    font-size: 18px;
    border: none;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
  }

  .reset-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 16px rgba(0,0,0,0.4);
  }

  /* 1v1 layout */
  #1v1-mode {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #1v1-buttons {
    display: flex;
    gap: 60px;
    margin-top: 20px;
  }
</style>
</head>
<body>

<h1>🎮 TapRace</h1>

<div class="mode-select">
  <button onclick="startGame('solo')">Solo</button>
  <button onclick="startGame('1v1')">1v1</button>
</div>

<div class="game-container" id="game">
  <div class="timer" id="timer">Čas: 10s</div>

  <div id="solo-mode">
    <button class="click-btn" id="solo-btn">Klikni ma!</button>
    <div class="scoreboard">Skóre: <span id="solo-score">0</span></div>
  </div>

  <div id="1v1-mode">
    <div class="scoreboard">
      <div>Hráč 1: <span id="p1-score">0</span></div>
      <div>Hráč 2: <span id="p2-score">0</span></div>
    </div>
    <div id="1v1-buttons">
      <button class="click-btn" id="p1-btn">Hráč 1 Klik</button>
      <button class="click-btn" id="p2-btn">Hráč 2 Klik</button>
    </div>
  </div>

  <div class="winner" id="winner"></div>
  <button class="reset-btn" onclick="resetGame()">🔄 Reset</button>
</div>

<script>
let timerInterval;
let time = 10;
let mode = '';
let soloScore = 0;
let p1Score = 0;
let p2Score = 0;

const timerEl = document.getElementById('timer');
const gameEl = document.getElementById('game');
const soloModeEl = document.getElementById('solo-mode');
const mode1v1El = document.getElementById('1v1-mode');
const winnerEl = document.getElementById('winner');

function startGame(selectedMode){
  mode = selectedMode;
  gameEl.style.display = 'flex';
  winnerEl.innerText = '';
  soloModeEl.style.display = (mode==='solo') ? 'flex' : 'none';
  mode1v1El.style.display = (mode==='1v1') ? 'flex' : 'none';
  soloScore = 0; p1Score=0; p2Score=0;
  document.getElementById('solo-score').innerText = soloScore;
  document.getElementById('p1-score').innerText = p1Score;
  document.getElementById('p2-score').innerText = p2Score;
  time = 10;
  timerEl.innerText = `Čas: ${time}s`;
  clearInterval(timerInterval);
  timerInterval = setInterval(countDown, 1000);
}

// Countdown timer
function countDown(){
  time--;
  timerEl.innerText = `Čas: ${time}s`;
  if(time <= 0){
    clearInterval(timerInterval);
    endGame();
  }
}

// Solo klik
document.getElementById('solo-btn').addEventListener('click', ()=>{
  soloScore++;
  document.getElementById('solo-score').innerText = soloScore;
});

// 1v1 klik
document.getElementById('p1-btn').addEventListener('click', ()=>{ p1Score++; document.getElementById('p1-score').innerText = p1Score; });
document.getElementById('p2-btn').addEventListener('click', ()=>{ p2Score++; document.getElementById('p2-score').innerText = p2Score; });

function endGame(){
  if(mode==='solo'){
    winnerEl.innerText = `Koniec! Tvoje skóre: ${soloScore}`;
  } else if(mode==='1v1'){
    if(p1Score > p2Score) winnerEl.innerText = '🎉 Hráč 1 vyhráva!';
    else if(p2Score > p1Score) winnerEl.innerText = '🎉 Hráč 2 vyhráva!';
    else winnerEl.innerText = 'Remíza!';
  }
}

function resetGame(){
  clearInterval(timerInterval);
  gameEl.style.display = 'none';
  winnerEl.innerText = '';
}
</script>

</body>
  </html>
