<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ErikAI Cinema — Animovaný film</title>

<style>
:root{
  --bg:#05070b;
  --panel:#0d1118;
  --panel2:#151b24;
  --text:#f4f7fb;
  --muted:#9aa5b3;
  --accent:#4da3ff;
  --accent2:#7c4dff;
  --line:rgba(255,255,255,.1);
  --shadow:0 20px 60px rgba(0,0,0,.45);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#000;
  color:var(--text);
  font-family:Inter,Segoe UI,Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  padding:24px;
}

.app{
  width:min(1450px,100%);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:50px;
  height:50px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:23px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:var(--shadow);
}

.title{
  margin:0;
  font-size:22px;
}

.subtitle{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

.player{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:22px;
  background:#111;
  box-shadow:var(--shadow);
  border:1px solid var(--line);
}

.scene{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:
    linear-gradient(to bottom,#182c4b 0%,#4b79a5 48%,#1b2028 49%,#080a0e 100%);
}

.sky{
  position:absolute;
  inset:0 0 42% 0;
  background:
    radial-gradient(circle at 75% 22%,rgba(255,255,255,.2),transparent 10%),
    linear-gradient(#172b49,#6386aa);
}

.sun{
  position:absolute;
  width:90px;
  height:90px;
  right:13%;
  top:12%;
  border-radius:50%;
  background:#ffd66b;
  box-shadow:0 0 80px rgba(255,214,107,.35);
}

.horizon{
  position:absolute;
  left:0;
  right:0;
  bottom:41%;
  height:4px;
  background:#222;
}

/* MESTO */

.city{
  position:absolute;
  inset:auto 0 39% 0;
  height:35%;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:0 3%;
}

.building{
  flex:1;
  min-width:45px;
  background:linear-gradient(90deg,#202733,#313b49);
  border:1px solid rgba(255,255,255,.08);
  position:relative;
}

.building:nth-child(1){height:75%}
.building:nth-child(2){height:100%}
.building:nth-child(3){height:62%}
.building:nth-child(4){height:87%}
.building:nth-child(5){height:70%}
.building:nth-child(6){height:110%}
.building:nth-child(7){height:80%}
.building:nth-child(8){height:96%}

.windows{
  position:absolute;
  inset:10px;
  background:
    repeating-linear-gradient(
      to right,
      transparent 0 13px,
      rgba(255,220,120,.6) 14px 20px
    ),
    repeating-linear-gradient(
      to bottom,
      transparent 0 16px,
      rgba(255,220,120,.55) 17px 23px
    );
  opacity:.55;
}

/* CESTA */

.road{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:41%;
  background:#15191f;
}

.road:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:48%;
  height:5px;
  background:repeating-linear-gradient(
    to right,
    #d9d9d9 0 55px,
    transparent 55px 105px
  );
}

.sidewalk{
  position:absolute;
  left:0;
  right:0;
  top:-16px;
  height:16px;
  background:#707782;
}

.lane{
  position:absolute;
  left:0;
  right:0;
  top:65%;
  height:3px;
  background:rgba(255,255,255,.25);
}

/* AUTÁ */

.car{
  position:absolute;
  width:95px;
  height:38px;
  border-radius:12px 16px 7px 7px;
  background:#d93636;
  bottom:27%;
  left:-130px;
  animation:drive 12s linear infinite;
  z-index:8;
}

.car:before{
  content:"";
  position:absolute;
  width:44px;
  height:20px;
  left:27px;
  top:-14px;
  border-radius:10px 10px 0 0;
  background:#b9d7ec;
}

.car:after{
  content:"";
  position:absolute;
  width:17px;
  height:17px;
  border-radius:50%;
  background:#080808;
  left:12px;
  bottom:-8px;
  box-shadow:58px 0 #080808;
}

.car.two{
  background:#3274d8;
  bottom:14%;
  animation-duration:15s;
  animation-delay:-5s;
  transform:scale(.82);
}

@keyframes drive{
  from{left:-140px}
  to{left:calc(100% + 140px)}
}

/* POSTAVY */

.person{
  position:absolute;
  bottom:12%;
  width:35px;
  height:100px;
  z-index:10;
}

.head{
  width:27px;
  height:27px;
  border-radius:50%;
  background:#d99b72;
  margin:auto;
}

.body{
  width:25px;
  height:45px;
  margin:auto;
  border-radius:9px 9px 4px 4px;
  background:#2456a6;
}

.legs{
  position:relative;
  width:25px;
  height:30px;
  margin:auto;
}

.legs:before,
.legs:after{
  content:"";
  position:absolute;
  top:0;
  width:8px;
  height:32px;
  border-radius:4px;
  background:#1c1f25;
  transform-origin:top;
  animation:walk .55s ease-in-out infinite alternate;
}

.legs:before{left:3px}
.legs:after{
  right:3px;
  animation-delay:-.27s;
}

.person.p1{
  left:27%;
  animation:personMove 7s ease-in-out infinite alternate;
}

.person.p2{
  left:66%;
  transform:scale(.82);
  animation:personMove2 9s ease-in-out infinite alternate;
}

@keyframes walk{
  from{transform:rotate(22deg)}
  to{transform:rotate(-22deg)}
}

@keyframes personMove{
  from{left:24%}
  to{left:39%}
}

@keyframes personMove2{
  from{left:62%}
  to{left:75%}
}

/* NOČ */

.night .scene{
  background:#070d1d;
}

.night .sky{
  background:linear-gradient(#050817,#162b49);
}

.night .sun{
  background:#e8edf7;
  box-shadow:0 0 60px rgba(220,230,255,.3);
}

.night .building{
  background:linear-gradient(90deg,#101722,#1d2633);
}

.night .windows{
  opacity:.9;
}

/* DAŽĎ */

.rain{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
  background:
    repeating-linear-gradient(
      105deg,
      transparent 0 13px,
      rgba(180,215,255,.28) 14px 15px,
      transparent 16px 25px
    );
  animation:rainMove .45s linear infinite;
}

.raining .rain{
  opacity:1;
}

@keyframes rainMove{
  from{transform:translateY(-20px)}
  to{transform:translateY(30px)}
}

/* TITULKY */

.subtitleBox{
  position:absolute;
  left:5%;
  right:5%;
  bottom:7%;
  z-index:30;
  text-align:center;
  pointer-events:none;
}

.subtitleText{
  display:inline-block;
  max-width:900px;
  padding:11px 18px;
  border-radius:10px;
  background:rgba(0,0,0,.78);
  color:#fff;
  font-size:clamp(14px,1.5vw,20px);
  line-height:1.4;
  box-shadow:0 8px 25px rgba(0,0,0,.35);
}

.subtitleText b{
  color:#71b5ff;
}

/* FILMOVÉ OVLÁDANIE */

.controls{
  margin-top:14px;
  padding:15px;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--panel);
}

.progress{
  width:100%;
  height:7px;
  border-radius:20px;
  background:#252d38;
  overflow:hidden;
  cursor:pointer;
}

.progressBar{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .1s linear;
}

.controlRow{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:12px;
  flex-wrap:wrap;
}

button{
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:10px;
  padding:9px 13px;
  cursor:pointer;
  font-size:14px;
}

button:hover{
  transform:translateY(-1px);
}

.time{
  font-variant-numeric:tabular-nums;
  color:var(--muted);
  font-size:14px;
}

.sceneInfo{
  margin-left:auto;
  color:var(--muted);
  font-size:13px;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:14px;
}

.infoCard{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px;
}

.infoTitle{
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.infoValue{
  margin-top:5px;
  font-size:17px;
  font-weight:700;
}

footer{
  text-align:center;
  color:#657180;
  font-size:12px;
  margin:20px 0 5px;
}

@media(max-width:700px){
  body{padding:10px}
  .header{align-items:flex-start}
  .info{grid-template-columns:1fr}
  .sceneInfo{
    width:100%;
    margin-left:0;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="brand">
    <div class="logo">E</div>
    <div>
      <h1 class="title">ErikAI Cinema</h1>
      <div class="subtitle">
        Interaktívny animovaný film • 2,5D prostredie • titulky
      </div>
    </div>
  </div>
</header>

<main>

<div id="player" class="player">

  <div id="scene" class="scene">

    <div class="sky"></div>
    <div class="sun"></div>

    <div class="city">
      <div class="building"><div class="windows"></div></div>
      <div class="building"><div class="windows"></div></div>
      <div class="building"><div class="windows"></div></div>
      <div class="building"><div class="windows"></div></div>
      <div class="building"><div class="windows"></div></div>
      <div class="building"><div class="windows"></div></div>
      <div class="building"><div class="windows"></div></div>
      <div class="building"><div class="windows"></div></div>
    </div>

    <div class="horizon"></div>

    <div class="road">
      <div class="sidewalk"></div>
      <div class="lane"></div>
    </div>

    <div class="car"></div>
    <div class="car two"></div>

    <div class="person p1">
      <div class="head"></div>
      <div class="body"></div>
      <div class="legs"></div>
    </div>

    <div class="person p2">
      <div class="head"></div>
      <div class="body"></div>
      <div class="legs"></div>
    </div>

    <div class="rain"></div>

    <div class="subtitleBox">
      <div id="subtitle" class="subtitleText">
        <b>Erik:</b> Príbeh sa začína...
      </div>
    </div>

  </div>

</div>

<div class="controls">

  <div id="progress" class="progress" title="Kliknutím preskoč na čas">
    <div id="progressBar" class="progressBar"></div>
  </div>

  <div class="controlRow">

    <button id="playBtn" onclick="togglePlay()">▶ Prehrať</button>

    <button onclick="restartFilm()">↺ Od začiatku</button>

    <span id="time" class="time">
      00:00 / 00:00
    </span>

    <span id="sceneInfo" class="sceneInfo">
      Scéna 1
    </span>

  </div>

</div>

<div class="info">

  <div class="infoCard">
    <div class="infoTitle">Aktuálna scéna</div>
    <div id="sceneName" class="infoValue">
      Príchod do mesta
    </div>
  </div>

  <div class="infoCard">
    <div class="infoTitle">Stav filmu</div>
    <div id="status" class="infoValue">
      Pripravené
    </div>
  </div>

</div>

</main>

<footer>
  ErikAI Cinema • Experimentálny animovaný film vytvorený pomocou HTML, CSS a JavaScriptu
</footer>

</div>

<script>

/* =========================================================
   SCENÁR FILMU
   ---------------------------------------------------------
   Každá scéna má iba údaje.
   Animácie sa vykonávajú samostatne.
   ========================================================= */

const scenes=[

{
  name:"Príchod do mesta",
  duration:120,
  type:"day",
  subtitle:[
    ["Erik","Konečne som tu."],
    ["Erik","Mesto vyzerá väčšie, než som čakal."]
  ]
},

{
  name:"Hlavná ulica",
  duration:150,
  type:"day",
  subtitle:[
    ["Erik","Musím zistiť, kam mám ísť."],
    ["Neznámy človek","Ak hľadáš centrum, pokračuj rovno."],
    ["Erik","Ďakujem."]
  ]
},

{
  name:"Centrum mesta",
  duration:180,
  type:"day",
  subtitle:[
    ["Erik","Tu je ale rušno."],
    ["Erik","Asi budem musieť chvíľu počkať."]
  ]
},

{
  name:"Večer",
  duration:150,
  type:"evening",
  subtitle:[
    ["Erik","Začína sa stmievať."],
    ["Erik","Mal by som sa ponáhľať."]
  ]
},

{
  name:"Nočné mesto",
  duration:180,
  type:"night",
  subtitle:[
    ["Erik","Tak toto vyzerá úplne inak v noci."],
    ["Erik","Ale stále mám pocit, že ma niekto sleduje."]
  ]
},

{
  name:"Daždivá noc",
  duration:180,
  type:"rain",
  subtitle:[
    ["Erik","Výborne... ešte aj dážď."],
    ["Erik","Musím nájsť nejaké miesto, kde sa schovám."]
  ]
},

{
  name:"Tichá ulica",
  duration:150,
  type:"night",
  subtitle:[
    ["Erik","Tu už nie je takmer nikto."],
    ["Erik","Možno je práve toto správna cesta."]
  ]
},

{
  name:"Ráno",
  duration:180,
  type:"morning",
  subtitle:[
    ["Erik","Nový deň."],
    ["Erik","Dnes to už dokončím."]
  ]
},

{
  name:"Cesta na okraj mesta",
  duration:210,
  type:"day",
  subtitle:[
    ["Erik","Centrum je za mnou."],
    ["Erik","Teraz už len pokračovať ďalej."]
  ]
},

{
  name:"Okraj mesta",
  duration:180,
  type:"day",
  subtitle:[
    ["Erik","Tu sa mesto končí."],
    ["Erik","Ale môj príbeh ešte nie."]
  ]
}

];


/* =========================================================
   AUTOMATICKÝ ČAS FILMU
   ========================================================= */

const totalDuration=
  scenes.reduce((sum,scene)=>sum+scene.duration,0);


/*
  Pri vývoji môžeme počet scén ľubovoľne zväčšovať.
  Celkový čas sa vždy vypočíta automaticky.
*/

let currentTime=0;
let playing=false;
let lastFrame=performance.now();
let currentSceneIndex=0;


/* =========================================================
   ELEMENTY
   ========================================================= */

const sceneEl=document.getElementById("scene");
const subtitleEl=document.getElementById("subtitle");
const progressEl=document.getElementById("progress");
const progressBar=document.getElementById("progressBar");
const timeEl=document.getElementById("time");
const sceneInfoEl=document.getElementById("sceneInfo");
const sceneNameEl=document.getElementById("sceneName");
const statusEl=document.getElementById("status");
const playBtn=document.getElementById("playBtn");


/* =========================================================
   FORMÁT ČASU
   ========================================================= */

function formatTime(seconds){

  seconds=Math.max(0,Math.floor(seconds));

  const h=Math.floor(seconds/3600);
  const m=Math.floor((seconds%3600)/60);
  const s=seconds%60;

  if(h>0){
    return String(h).padStart(2,"0")+":"+
           String(m).padStart(2,"0")+":"+
           String(s).padStart(2,"0");
  }

  return String(m).padStart(2,"0")+":"+
         String(s).padStart(2,"0");
}


/* =========================================================
   URČENIE AKTUÁLNEJ SCÉNY
   ========================================================= */

function getSceneAtTime(time){

  let elapsed=0;

  for(let i=0;i<scenes.length;i++){

    const scene=scenes[i];

    if(time < elapsed+scene.duration){
      return {
        index:i,
        scene:scene,
        localTime:time-elapsed
      };
    }

    elapsed+=scene.duration;
  }

  return {
    index:scenes.length-1,
    scene:scenes[scenes.length-1],
    localTime:scenes[scenes.length-1].duration
  };
}


/* =========================================================
   TITULKY
   ========================================================= */

function updateSubtitle(scene,localTime){

  const lines=scene.subtitle;

  if(!lines || !lines.length){
    subtitleEl.innerHTML="";
    return;
  }

  /*
    Titulky sa rozdelia automaticky podľa počtu dialógov.
  */

  const duration=scene.duration/lines.length;

  let index=Math.floor(localTime/duration);

  index=Math.min(index,lines.length-1);

  const [name,text]=lines[index];

  subtitleEl.innerHTML=
    `<b>${escapeHTML(name)}:</b> ${escapeHTML(text)}`;
}


/* =========================================================
   OCHRANA TEXTU
   ========================================================= */

function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================================
   VZHĽAD SCÉNY
   ========================================================= */

function updateSceneVisual(scene){

  sceneEl.classList.remove("night","raining");

  if(scene.type==="night"){
    sceneEl.classList.add("night");
  }

  if(scene.type==="rain"){
    sceneEl.classList.add("night","raining");
  }

  if(scene.type==="evening"){
    sceneEl.style.filter="brightness(.75)";
  }else if(scene.type==="morning"){
    sceneEl.style.filter="brightness(1.05)";
  }else{
    sceneEl.style.filter="none";
  }
}


/* =========================================================
   PREHRÁVANIE
   ========================================================= */

function togglePlay(){

  if(playing){
    pauseFilm();
  }else{
    playFilm();
  }
}

function playFilm(){

  if(currentTime>=totalDuration){
    currentTime=0;
  }

  playing=true;
  playBtn.textContent="⏸ Pauza";
  statusEl.textContent="Prehráva sa";

  lastFrame=performance.now();
}

function pauseFilm(){

  playing=false;
  playBtn.textContent="▶ Prehrať";
  statusEl.textContent="Pozastavené";
}


/* =========================================================
   RESET
   ========================================================= */

function restartFilm(){

  currentTime=0;
  playing=false;

  playBtn.textContent="▶ Prehrať";
  statusEl.textContent="Pripravené";

  update();
}


/* =========================================================
   POSUN NA ČAS
   ========================================================= */

progressEl.addEventListener("click",function(event){

  const rect=progressEl.getBoundingClientRect();

  const percent=
    Math.max(
      0,
      Math.min(
        1,
        (event.clientX-rect.left)/rect.width
      )
    );

  currentTime=totalDuration*percent;

  update();
});


/* =========================================================
   HLAVNÁ AKTUALIZÁCIA
   ========================================================= */

function update(){

  const info=getSceneAtTime(currentTime);

  currentSceneIndex=info.index;

  updateSceneVisual(info.scene);

  updateSubtitle(
    info.scene,
    info.localTime
  );

  const percent=
    totalDuration>0
      ?currentTime/totalDuration*100
      :0;

  progressBar.style.width=
    Math.min(100,percent)+"%";

  timeEl.textContent=
    `${formatTime(currentTime)} / ${formatTime(totalDuration)}`;

  sceneInfoEl.textContent=
    `Scéna ${info.index+1} / ${scenes.length}`;

  sceneNameEl.textContent=
    info.scene.name;
}


/* =========================================================
   ANIMAČNÁ SLUČKA
   ========================================================= */

function animationLoop(now){

  const delta=(now-lastFrame)/1000;

  lastFrame=now;

  if(playing){

    currentTime+=delta;

    if(currentTime>=totalDuration){

      currentTime=totalDuration;
      playing=false;

      playBtn.textContent="↻ Prehrať znova";
      statusEl.textContent="Film skončil";
    }

    update();
  }

  requestAnimationFrame(animationLoop);
}


/* =========================================================
   ŠTART
   ========================================================= */

update();
requestAnimationFrame(animationLoop);


/* =========================================================
   KLÁVESNICA
   ========================================================= */

document.addEventListener("keydown",function(e){

  if(e.code==="Space"){
    e.preventDefault();
    togglePlay();
  }

  if(e.code==="ArrowRight"){
    currentTime=Math.min(
      totalDuration,
      currentTime+10
    );
    update();
  }

  if(e.code==="ArrowLeft"){
    currentTime=Math.max(
      0,
      currentTime-10
    );
    update();
  }
});

</script>

</body>
      </html>
