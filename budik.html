<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI OS – Profesionálny Budík</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #030712;
    --card-glass: rgba(17, 24, 39, 0.75);
    --card-border: rgba(255, 255, 255, 0.08);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --neon-red: #ef4444;
    --neon-orange: #f97316;
    --accent-glow: rgba(239, 68, 68, 0.25);
  }

  body.light {
    --bg-deep: #f1f5f9;
    --card-glass: rgba(255, 255, 255, 0.85);
    --card-border: rgba(0, 0, 0, 0.08);
    --text-main: #0f172a;
    --text-muted: #64748b;
    --neon-red: #dc2626;
    --neon-orange: #ea580c;
    --accent-glow: rgba(220, 38, 38, 0.15);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: var(--bg-deep);
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(239, 68, 68, 0.06) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(249, 115, 22, 0.05) 0%, transparent 40%),
      linear-gradient(135deg, var(--bg-deep) 0%, #0b0f19 100%);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 30px 20px;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .main-container {
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-bar {
    width: 100%;
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
  }

  #themeToggle {
    background: var(--card-glass);
    border: 1px solid var(--card-border);
    color: var(--text-main);
    padding: 8px 16px;
    border-radius: 99px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.2s;
  }

  #themeToggle:hover {
    border-color: var(--neon-red);
  }

  h1 {
    font-size: 2.2rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--text-main) 40%, var(--neon-red), var(--neon-orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 25px;
    text-align: center;
  }

  /* Analógové hodiny s číslami */
  .clock {
    width: 240px;
    height: 240px;
    border: 3px solid var(--neon-red);
    border-radius: 50%;
    margin: 10px auto 20px auto;
    position: relative;
    background: var(--card-glass);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 0 0 15px rgba(0,0,0,0.2);
    backdrop-filter: blur(16px);
  }

  .clock-number {
    position: absolute;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text-muted);
  }
  .n-12 { top: 10px; left: 50%; transform: translateX(-50%); color: var(--neon-red); }
  .n-3  { top: 50%; right: 12px; transform: translateY(-50%); }
  .n-6  { bottom: 10px; left: 50%; transform: translateX(-50%); }
  .n-9  { top: 50%; left: 12px; transform: translateY(-50%); }

  .hand, .center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: bottom center;
    transform: translate(-50%, -100%) rotate(0deg);
    transition: transform 0.2s cubic-bezier(0.4, 2.3, 0.3, 1);
  }

  .hand.hour { width: 4px; height: 55px; background: var(--text-main); z-index: 3; border-radius: 2px; }
  .hand.minute { width: 3px; height: 75px; background: var(--text-muted); z-index: 2; border-radius: 2px; }
  .hand.second { width: 1.5px; height: 85px; background: var(--neon-red); z-index: 1; }
  .center { width: 10px; height: 10px; border-radius: 50%; background: var(--neon-red); transform: translate(-50%, -50%); z-index: 4; }

  #digitalTime {
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--text-main);
    margin-bottom: 25px;
    letter-spacing: 1px;
  }

  /* Nastavenie budíka karta */
  .alarm-form {
    background: var(--card-glass);
    border: 1px solid var(--card-border);
    padding: 20px;
    border-radius: 20px;
    width: 100%;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .form-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }

  select, input[type=text] {
    background: var(--bg-deep);
    color: var(--text-main);
    border: 1px solid var(--card-border);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    outline: none;
    cursor: pointer;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
  }

  input[type=checkbox] {
    width: 18px;
    height: 18px;
    accent-color: var(--neon-red);
    cursor: pointer;
  }

  button.action-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--neon-red), var(--neon-orange));
    color: white;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 4px 15px var(--accent-glow);
    transition: transform 0.2s;
  }

  button.action-btn:hover {
    transform: translateY(-2px);
  }

  /* Zoznam budíkov */
  .alarms {
    width: 100%;
    margin-top: 20px;
    text-align: left;
  }

  .alarms h3 {
    font-size: 1.1rem;
    margin-bottom: 10px;
    color: var(--text-main);
  }

  .alarm-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    margin-top: 10px;
    background: var(--card-glass);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    backdrop-filter: blur(12px);
    font-weight: 600;
  }

  .alarm-item button {
    background: rgba(239, 68, 68, 0.15);
    color: var(--neon-red);
    border: 1px solid rgba(239, 68, 68, 0.3);
    padding: 6px 12px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .alarm-item button:hover {
    background: var(--neon-red);
    color: white;
  }

  /* Zvonenie banner */
  #notificationBanner {
    display: none;
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, var(--neon-red), var(--neon-orange));
    color: white;
    padding: 18px 30px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(239, 68, 68, 0.5);
    z-index: 1000;
    text-align: center;
    font-weight: 800;
    font-size: 1.2rem;
    animation: pulseAlarm 1s infinite alternate;
  }

  @keyframes pulseAlarm {
    from { transform: translateX(-50%) scale(1); }
    to { transform: translateX(-50%) scale(1.05); }
  }

  #stopAlarmBtn {
    margin-top: 10px;
    background: white;
    color: var(--neon-red);
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 800;
    cursor: pointer;
  }

  footer {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 30px;
    line-height: 1.6;
    text-align: center;
  }
</style>
</head>
<body class="dark">

<div class="main-container">
  <div class="top-bar">
    <button id="themeToggle" onclick="toggleTheme()">☀️ Svetlý režim</button>
  </div>

  <h1>⏰ ErikAI Budík</h1>

  <!-- Analógové hodiny s číslami -->
  <div class="clock">
    <span class="clock-number n-12">12</span>
    <span class="clock-number n-3">3</span>
    <span class="clock-number n-6">6</span>
    <span class="clock-number n-9">9</span>
    <div class="hand hour" id="hourHand"></div>
    <div class="hand minute" id="minuteHand"></div>
    <div class="hand second" id="secondHand"></div>
    <div class="center"></div>
  </div>

  <p id="digitalTime">00:00:00</p>

  <!-- Ovládací panel pre budík -->
  <div class="alarm-form">
    <div class="form-row">
      <select id="alarmTime"></select>
      <input type="text" id="alarmLabel" placeholder="Popis (napr. Škola)" style="flex: 1; min-width: 140px;">
    </div>
    <div class="form-row" style="justify-content: space-between;">
      <label class="checkbox-label">
        <input type="checkbox" id="daily"> Opakovať každý deň
      </label>
    </div>
    <button class="action-btn" onclick="activateAlarm()">+ Aktivovať budík</button>
  </div>

  <div class="alarms" id="alarmList"></div>
</div>

<!-- Zvoniaci banner -->
<div id="notificationBanner">
  ⏰ ErikAI Budík zvoní!<br>
  <button id="stopAlarmBtn" onclick="stopAlarmSound()">Zastaviť zvonenie</button>
</div>

<audio id="alarmSound" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" loop preload="auto"></audio>

<footer>
  This work is licensed under the Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International License.<br>
  © 2025–2026 <strong>Erik Mohylák</strong> – All rights reserved.
</footer>

<script>
const hourHand = document.getElementById('hourHand');
const minuteHand = document.getElementById('minuteHand');
const secondHand = document.getElementById('secondHand');
const digitalTime = document.getElementById('digitalTime');
const alarmSelect = document.getElementById('alarmTime');
const alarmLabel = document.getElementById('alarmLabel');
const alarmSound = document.getElementById('alarmSound');
const daily = document.getElementById('daily');
const alarmList = document.getElementById('alarmList');
const notificationBanner = document.getElementById('notificationBanner');

let alarms = [];
let isRinging = false;

function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();

  hourHand.style.transform = `translate(-50%, -100%) rotate(${(h % 12 + m/60) * 30}deg)`;
  minuteHand.style.transform = `translate(-50%, -100%) rotate(${(m + s/60) * 6}deg)`;
  secondHand.style.transform = `translate(-50%, -100%) rotate(${s * 6}deg)`;

  const timeStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  const fullTimeStr = `${timeStr}:${String(s).padStart(2,'0')}`;
  digitalTime.textContent = fullTimeStr;

  alarms.forEach((alarm, index) => {
    if(alarm.time === timeStr && s === 0 && !isRinging){
      triggerAlarm(alarm);
      if(!alarm.repeat) removeAlarm(index);
    }
  });
}

function triggerAlarm(alarm) {
  isRinging = true;
  alarmSound.play().catch(e => console.log(e));
  notificationBanner.style.display = "block";
  if(navigator.vibrate) navigator.vibrate([500, 250, 500, 250]);
}

function stopAlarmSound() {
  alarmSound.pause();
  alarmSound.currentTime = 0;
  notificationBanner.style.display = "none";
  isRinging = false;
}

function fillTimes(){
  for(let h=0; h<24; h++){
    for(let m=0; m<60; m+=5){ // po 5 minútach pre prehľadnejší výber
      const t = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      const option = document.createElement('option');
      option.value = t; option.textContent = t;
      alarmSelect.appendChild(option);
    }
  }
}

function activateAlarm(){
  const selectedTime = alarmSelect.value;
  const label = alarmLabel.value.trim() || "Budík";
  const isDaily = daily.checked;
  
  alarms.push({time: selectedTime, label: label, repeat: isDaily});
  renderAlarms();
  alarmLabel.value = "";
  alert(`Budík "${label}" bol úspešne nastavený na ${selectedTime}! ✅`);
}

function removeAlarm(index){
  alarms.splice(index,1);
  renderAlarms();
}

function renderAlarms(){
  if(alarms.length === 0) {
    alarmList.innerHTML = "";
    return;
  }
  alarmList.innerHTML="<h3>⏱ Aktívne budíky:</h3>";
  alarms.forEach((alarm,index)=>{
    const div = document.createElement('div');
    div.className="alarm-item";
    div.innerHTML=`<span>🔔 <strong>${alarm.time}</strong> — ${alarm.label} ${alarm.repeat?'<small style="color:var(--neon-orange)">(Každý deň)</small>':''}</span> <button onclick="removeAlarm(${index})">Zrušiť</button>`;
    alarmList.appendChild(div);
  });
}

function toggleTheme(){
  if(document.body.classList.contains('dark')){
    document.body.classList.remove('dark');
    document.body.classList.add('light');
    document.getElementById('themeToggle').innerText = '🌙 Tmavý režim';
    localStorage.setItem('theme', 'light');
  } else {
    document.body.classList.remove('light');
    document.body.classList.add('dark');
    document.getElementById('themeToggle').innerText = '☀️ Svetlý režim';
    localStorage.setItem('theme', 'dark');
  }
}

window.onload=()=>{
  const savedTheme = localStorage.getItem('theme') || 'dark';
  document.body.classList.add(savedTheme);
  document.getElementById('themeToggle').innerText = savedTheme === 'dark' ? '☀️ Svetlý režim' : '🌙 Tmavý režim';

  fillTimes();
  updateClock();
  if(Notification.permission !== "granted") Notification.requestPermission();
};

setInterval(updateClock, 1000);
</script>
<script>
  // ==========================================
  // ERIKAI OS — UNIVERZÁLNY BEZPEČNOSTNÝ STRÁŽCA
  // ==========================================
  const povolenyHostitel = "erikai-demoa1.github.io";
  
  // Overenie, či prebehol proces v session pamäti alebo či prichádza zo správnej domény
  const jeOvereny = sessionStorage.getItem('erikai_auth_token') === 'VERIFIED_OK';
  let pristupOk = jeOvereny || document.referrer.includes(povolenyHostitel);

  // Ak sa niekto pokúsi otvoriť podstránku napriamo (na čierno)
  if (!pristupOk && window.location.hostname !== "127.0.0.1" && window.location.hostname !== "localhost") {
    
    // Vtipné upozornenie
    alert("🚨 Haha, chcel si sa sem dostať zadarmo bez overenia?! Tak takto teda nie! Šup-šup naspäť na začiatok, pekne od 1. kroku sa prihlásiť! 🏃‍♂️💨");
    
    // Presmerovanie na hlavnú vstupnú bránu ErikAI OS
    window.location.href = "https://erikai-demoa1.github.io/ErikAI/";
  }
</script>

</body>
</html>
