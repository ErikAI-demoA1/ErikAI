<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI Game Engine</title>
<style>
  body { 
    font-family: 'Segoe UI', sans-serif; 
    background: linear-gradient(135deg, #e3f2fd, #bbdefb); 
    text-align: center; 
    padding: 20px; 
  }
  h1 { 
    margin-bottom: 15px; 
    color: #0d47a1; 
  }
  input, select { 
    padding: 6px; 
    margin: 5px; 
    border-radius: 6px; 
    border: 1px solid #90caf9; 
    width: 150px; 
  }
  button { 
    padding: 10px 18px; 
    margin: 10px; 
    cursor: pointer; 
    border: none; 
    border-radius: 8px; 
    background: #1976d2; 
    color: white; 
    transition: 0.2s; 
  }
  button:hover { 
    background: #1565c0; 
    transform: scale(1.05); 
  }
  #grid { 
    margin: 25px auto; 
    display: grid; 
    gap: 3px; 
  }
  .cell { 
    width: 50px; 
    height: 50px; 
    border: 1px solid #333; 
    font-size: 24px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    cursor: pointer; 
    transition: 0.2s; 
    border-radius: 6px;
  }
  .cell:hover { 
    background: #e3f2fd; 
    transform: scale(1.1);
  }
  #exportedCode { 
    width: 90%; 
    height: 180px; 
    margin-top: 20px; 
    font-family: monospace; 
    display: none; /* Skryté - už nepotrebujeme zobrazovať */
  }
</style>
</head>
<body>

<h1>ErikAI Game Engine</h1>

<div>
  <label>Počet hráčov:</label>
  <input type="number" id="numPlayers" min="2" max="8" value="2"><br>

  <label>Počet políčok:</label>
  <input type="number" id="gridSize" min="3" max="10" value="5"><br>

  <label>Symboly hráčov (oddelené čiarkou):</label>
  <input type="text" id="symbols" value="X,O,△,□,☆,♢,⚡,♥"><br>

  <label>Farba políčka:</label>
  <input type="color" id="cellColor" value="#ffffff"><br>

  <button onclick="generateGrid()">Vytvoriť hraciu plochu</button>
  <button onclick="exportHTML()">Exportovať HTML</button>
</div>

<div id="grid"></div>

<textarea id="exportedCode" readonly></textarea>

<script>
let gridData = [];
let currentPlayerIndex = 0;

// 🔹 Pomocná funkcia na stiahnutie súboru
function saveFile(filename, content) {
  const blob = new Blob([content], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// --- Generovanie hracej plochy ---
function generateGrid() {
  const size = parseInt(document.getElementById('gridSize').value);
  const players = parseInt(document.getElementById('numPlayers').value);
  const symbols = document.getElementById('symbols').value.split(',').slice(0, players);
  const color = document.getElementById('cellColor').value;

  gridData = Array(size * size).fill('');
  currentPlayerIndex = 0;

  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = `repeat(${size}, 50px)`;
  grid.innerHTML = '';

  for (let i = 0; i < size * size; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.style.background = color;
    cell.addEventListener('click', () => {
      if (!gridData[i]) {
        gridData[i] = symbols[currentPlayerIndex];
        cell.innerText = symbols[currentPlayerIndex];
        currentPlayerIndex = (currentPlayerIndex + 1) % players;
      }
    });
    grid.appendChild(cell);
  }
}

// --- Export HTML ---
function exportHTML() {
  const size = parseInt(document.getElementById('gridSize').value);
  const players = parseInt(document.getElementById('numPlayers').value);
  const symbols = document.getElementById('symbols').value.split(',').slice(0, players);
  const color = document.getElementById('cellColor').value;

  const html = `<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Vlastná hra</title>
<style>
body { text-align:center; font-family:sans-serif; background:#f5f5f5; }
#grid { margin:20px auto; display:grid; gap:3px; grid-template-columns: repeat(${size}, 50px); }
.cell { width:50px; height:50px; border:1px solid #333; font-size:24px; display:flex; align-items:center; justify-content:center; cursor:pointer; border-radius:6px; background:${color}; transition:0.2s; }
.cell:hover { background:#e3f2fd; transform:scale(1.1); }
</style>
</head>
<body>
<h1>Vlastná hra</h1>
<div id="grid"></div>
<script>
let gridData = Array(${size * size}).fill('');
let currentPlayerIndex = 0;
const symbols = ${JSON.stringify(symbols)};
const grid = document.getElementById('grid');
for(let i=0;i<${size * size};i++){
  const cell=document.createElement('div');
  cell.className='cell';
  cell.addEventListener('click',()=>{if(!gridData[i]){gridData[i]=symbols[currentPlayerIndex];cell.innerText=symbols[currentPlayerIndex];currentPlayerIndex=(currentPlayerIndex+1)%symbols.length;}});
  grid.appendChild(cell);
}
<\/script>
</body>
</html>`;

  // ✅ Automatické stiahnutie namiesto zobrazovania
  saveFile("moja_hra.html", html);
}
</script>

</body>
  </html>
