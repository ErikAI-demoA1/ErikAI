<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI Game Engine</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f0f2f5;
    margin: 0;
    padding: 20px;
    text-align: center;
  }

  h1 {
    margin-bottom: 20px;
    color: #333;
  }

  .panel {
    background: white;
    padding: 15px 20px;
    border-radius: 12px;
    display: inline-block;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }

  .panel label {
    display: inline-block;
    margin: 5px 0;
    font-weight: bold;
    width: 150px;
    text-align: right;
  }

  .panel input {
    padding: 5px;
    margin: 5px 10px;
    width: 120px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }

  .panel button {
    padding: 10px 20px;
    margin: 10px 5px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    background: linear-gradient(45deg,#4caf50,#81c784);
    color: white;
    transition: 0.3s;
  }

  .panel button:hover {
    background: linear-gradient(45deg,#388e3c,#66bb6a);
  }

  #grid {
    display: grid;
    margin: 20px auto;
    gap: 4px;
  }

  .cell {
    width: 50px;
    height: 50px;
    border-radius: 6px;
    border: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    cursor: pointer;
    transition: 0.2s;
    background: #fff;
  }

  .cell:hover {
    transform: scale(1.1);
    background: #e0f7fa;
  }

  #exportedCode {
    width: 90%;
    height: 200px;
    margin-top: 20px;
    font-family: monospace;
    border-radius: 8px;
    border: 1px solid #ccc;
    padding: 10px;
  }
</style>
</head>
<body>

<h1>ErikAI Game Engine</h1>

<div class="panel">
  <div>
    <label>Počet hráčov:</label>
    <input type="number" id="numPlayers" min="2" max="8" value="2">
  </div>
  <div>
    <label>Veľkosť plochy:</label>
    <input type="number" id="gridSize" min="3" max="10" value="5">
  </div>
  <div>
    <label>Symboly hráčov:</label>
    <input type="text" id="symbols" value="X,O,△,□,☆,♢,⚡,♥">
  </div>
  <div>
    <label>Farba políčka:</label>
    <input type="color" id="cellColor" value="#ffffff">
  </div>
  <div>
    <button onclick="generateGrid()">Vytvoriť plochu</button>
    <button onclick="exportHTML()">Exportovať HTML</button>
  </div>
</div>

<div id="grid"></div>
<textarea id="exportedCode" readonly placeholder="Tu sa zobrazí vygenerovaný HTML kód"></textarea>

<script>
let gridData = [];
let currentPlayerIndex = 0;

function generateGrid() {
  const size = parseInt(document.getElementById('gridSize').value);
  const players = parseInt(document.getElementById('numPlayers').value);
  const symbols = document.getElementById('symbols').value.split(',').slice(0, players);
  const color = document.getElementById('cellColor').value;

  gridData = Array(size*size).fill('');
  currentPlayerIndex = 0;

  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = `repeat(${size}, 50px)`;
  grid.innerHTML = '';

  for(let i=0; i<size*size; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.style.background = color;
    cell.addEventListener('click', () => {
      if(!gridData[i]) {
        gridData[i] = symbols[currentPlayerIndex];
        cell.innerText = symbols[currentPlayerIndex];
        currentPlayerIndex = (currentPlayerIndex + 1) % players;
      }
    });
    grid.appendChild(cell);
  }
}

function exportHTML() {
  const size = parseInt(document.getElementById('gridSize').value);
  const players = parseInt(document.getElementById('numPlayers').value);
  const symbols = document.getElementById('symbols').value.split(',').slice(0, players);
  const color = document.getElementById('cellColor').value;

  const html = `<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vlastná hra</title>
<style>
body { text-align:center; font-family:sans-serif; background:#f5f5f5; }
#grid { display:grid; gap:4px; grid-template-columns: repeat(${size}, 50px); margin:20px auto; }
.cell { width:50px; height:50px; border:1px solid #333; display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer; border-radius:6px; background:${color}; transition:0.2s; }
.cell:hover { transform:scale(1.1); background:#e0f7fa; }
</style>
</head>
<body>
<h1>Vlastná hra</h1>
<div id="grid"></div>
<script>
let gridData = Array(${size*size}).fill('');
let currentPlayerIndex = 0;
const symbols = ${JSON.stringify(symbols)};
const grid = document.getElementById('grid');
for(let i=0;i<${size*size};i++){
  const cell = document.createElement('div');
  cell.className='cell';
  cell.addEventListener('click',()=>{if(!gridData[i]){gridData[i]=symbols[currentPlayerIndex];cell.innerText=symbols[currentPlayerIndex];currentPlayerIndex=(currentPlayerIndex+1)%symbols.length;}});
  grid.appendChild(cell);
}
</script>
</body>
</html>`;

  document.getElementById('exportedCode').value = html;
}
</script>

</body>
</html>
