<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>RocketSK v5.0 — 2 to 4 Players Dynamic Arenas (ErikAI)</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    background: #030810;
    color: #fff;
    overflow: hidden;
    touch-action: none;
}

#webgl-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
}

/* --- Menu výberu hráčov --- */
#menuContainer {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(circle at center, #0a1f3d 0%, #030810 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    gap: 20px;
}
#menuContainer h1 {
    font-size: 28px;
    color: #00ffcc;
    text-shadow: 0 0 20px rgba(0,255,204,0.6);
    margin-bottom: 10px;
    text-align: center;
}
.menu-btn {
    padding: 16px 32px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(145deg, #00ffcc, #00b386);
    color: #030810;
    font-weight: 900;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0,255,200,0.5);
    width: 260px;
    text-transform: uppercase;
}
.menu-btn:active { transform: scale(0.95); }

/* --- Dynamické Viewporty a UI kontajnery --- */
.viewport-ui {
    position: absolute;
    overflow: hidden;
    pointer-events: none;
    z-index: 10;
}

.hud-p {
    position: absolute;
    top: 8px; left: 10px;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(6px);
    z-index: 40;
    font-weight: 700;
}

.player-controls {
    position: absolute;
    bottom: 8px; left: 10px; right: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 40;
    pointer-events: none;
}

.joystick {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    border: 2px solid rgba(255,255,255,0.25);
    touch-action: none;
}

.stick {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    pointer-events: none;
}

.btn-boost {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(145deg, #ff8c00, #ff4500);
    color: white;
    font-weight: 800;
    font-size: 11px;
    cursor: pointer;
    pointer-events: auto;
    box-shadow: 0 0 10px rgba(255,100,0,0.5);
    touch-action: none;
}
.btn-boost:active { transform: scale(0.92); }

.goal-banner {
    position: fixed;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: linear-gradient(135deg, #ff7a3c, #ff1e1e);
    padding: 20px 35px;
    border-radius: 14px;
    font-size: 28px;
    font-weight: 900;
    color: #fff;
    z-index: 1100;
    display: none;
    text-align: center;
    box-shadow: 0 0 30px rgba(255,120,60,0.9);
    text-transform: uppercase;
}
</style>
</head>
<body>

<div id="menuContainer">
    <h1>🚀 ROCKETSK ARENA</h1>
    <button class="menu-btn" onclick="startGame(2)">2 HRÁČI (2 Bránky)</button>
    <button class="menu-btn" onclick="startGame(3)" style="background:linear-gradient(145deg, #3b82f6, #1d4ed8); color:#fff;">3 HRÁČI (Trojuholník)</button>
    <button class="menu-btn" onclick="startGame(4)" style="background:linear-gradient(145deg, #8b5cf6, #6d28d9); color:#fff;">4 HRÁČI (4 Bránky)</button>
</div>

<div id="webgl-container"></div>
<div class="goal-banner" id="goalBanner">GÓÓÓL!</div>

<div id="uiContainer"></div>

<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
<script>
let scene, renderer;
let cameras = [];
let cars = [];
let ball, ground;
let clock, playing = false;
let arenaSize = 200;
let numPlayers = 2;

let playersData = [];
let ballVel = new THREE.Vector3();
let goalCooldown = false;
const maxSpeed = 22, accel = 40, brake = 50;

function startGame(count) {
    numPlayers = count;
    document.getElementById('menuContainer').style.display = 'none';
    
    playersData = [];
    for(let i=0; i<numPlayers; i++) {
        playersData.push({ speed: 0, targetSpeed: 0, steer: 0, boost: 100, activeBoost: false, score: 0 });
    }

    buildUI();
    init3D();
    playing = true;
}

function buildUI() {
    const container = document.getElementById('uiContainer');
    container.innerHTML = '';

    const colors = ['#ff4b4b', '#00bfff', '#10b981', '#f59e0b'];
    const names = ['HRÁČ 1 (RED)', 'HRÁČ 2 (BLUE)', 'HRÁČ 3 (GREEN)', 'HRÁČ 4 (YELLOW)'];

    for(let i=0; i<numPlayers; i++) {
        const div = document.createElement('div');
        div.className = 'viewport-ui';
        div.id = `viewportUI${i}`;
        div.innerHTML = `
            <div class="hud-p" id="hudP${i}" style="color:${colors[i]}; border:1px solid ${colors[i]}66;">
                ${names[i]} • Skóre: <span id="score${i}">0</span> • Boost: <span id="boost${i}">100</span>%
            </div>
            <div class="player-controls">
                <div id="joy${i}" class="joystick"><div id="stick${i}" class="stick"></div></div>
                <button id="boostBtn${i}" class="btn-boost" style="background:linear-gradient(145deg, ${colors[i]}, #222);">⚡ BOOST</button>
            </div>
        `;
        container.appendChild(div);
    }
    updateLayoutRects();
    setupJoysticks();
}

function updateLayoutRects() {
    const w = window.innerWidth;
    const h = window.innerHeight;

    if(numPlayers === 2) {
        setRect('viewportUI0', 0, 0, w, h/2);
        setRect('viewportUI1', 0, h/2, w, h/2);
    } else if(numPlayers === 3) {
        setRect('viewportUI0', 0, 0, w, h/2);
        setRect('viewportUI1', 0, h/2, w/2, h/2);
        setRect('viewportUI2', w/2, h/2, w/2, h/2);
    } else if(numPlayers === 4) {
        setRect('viewportUI0', 0, 0, w/2, h/2);
        setRect('viewportUI1', w/2, 0, w/2, h/2);
        setRect('viewportUI2', 0, h/2, w/2, h/2);
        setRect('viewportUI3', w/2, h/2, w/2, h/2);
    }
}

function setRect(id, x, y, w, h) {
    const el = document.getElementById(id);
    if(el) {
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.width = w + 'px';
        el.style.height = h + 'px';
    }
}

function init3D() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040b16);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.autoClear = false;
    document.getElementById('webgl-container').appendChild(renderer.domElement);

    cameras = [];
    cars = [];

    scene.add(new THREE.HemisphereLight(0xffffff, 0x112244, 0.9));
    const dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(40, 80, 40);
    scene.add(dir);

    // Podlaha
    ground = new THREE.Mesh(
        new THREE.PlaneGeometry(arenaSize, arenaSize),
        new THREE.MeshStandardMaterial({ color: 0x08162b, roughness: 0.8 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const grid = new THREE.GridHelper(arenaSize, 20, 0x00ffcc, 0x1a365d);
    grid.position.y = 0.05;
    scene.add(grid);

    const colors = [0xff3b3b, 0x00bfff, 0x10b981, 0xf59e0b];

    // Vytvorenie áut a kamier podľa počtu hráčov
    for(let i=0; i<numPlayers; i++) {
        const cam = new THREE.PerspectiveCamera(75, 1, 0.1, 4000);
        cameras.push(cam);

        const car = createCar(colors[i]);
        cars.push(car);
        scene.add(car);
    }

    resetPositions();

    // Lopta
    ball = new THREE.Mesh(
        new THREE.SphereGeometry(1.2, 32, 32),
        new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, emissive: 0x222222 })
    );
    ball.position.set(0, 1.2, 0);
    scene.add(ball);

    buildArenaGeometry();

    clock = new THREE.Clock();
    window.addEventListener('resize', onWindowResize);
    animate();
}

function createCar(colorHex) {
    const group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.2, metalness: 0.8 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.55, 2.6), mat);
    body.position.y = 0.4;
    group.add(body);

    const spoiler = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.2, 0.4), new THREE.MeshStandardMaterial({ color: 0xffffff }));
    spoiler.position.set(0, 0.8, -1.0);
    group.add(spoiler);
    return group;
}

function buildArenaGeometry() {
    const half = arenaSize / 2;
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x0d2342, roughness: 0.5 });

    if(numPlayers === 2 || numPlayers === 4) {
        // Obdĺžniková / Štvorcová aréna so 2 alebo 4 bránkami
        const goalW = arenaSize * 0.4;
        createWallWithGoal(0, 2, -half, arenaSize, goalW, 0xef4444); // Sever
        createWallWithGoal(0, 2, half, arenaSize, goalW, 0x3b82f6);  // Juh
        
        if(numPlayers === 4) {
            createWallWithGoalZ(half, 2, 0, arenaSize, goalW, 0x10b981); // Východ
            createWallWithGoalZ(-half, 2, 0, arenaSize, goalW, 0xf59e0b); // Západ
        } else {
            scene.add(new THREE.Mesh(new THREE.BoxGeometry(1.5, 4, arenaSize), wallMat).position.set(-half, 2, 0));
            scene.add(new THREE.Mesh(new THREE.BoxGeometry(1.5, 4, arenaSize), wallMat).position.set(half, 2, 0));
        }
    } else if(numPlayers === 3) {
        // Trojuholníková aréna pre 3 hráčov
        const r = half * 0.85;
        for(let i=0; i<3; i++) {
            const angle = (i / 3) * Math.PI * 2;
            const wall = new THREE.Mesh(new THREE.BoxGeometry(120, 4, 1.5), wallMat);
            wall.position.set(Math.sin(angle)*r*0.7, 2, Math.cos(angle)*r*0.7);
            wall.rotation.y = -angle;
            scene.add(wall);
        }
    }
}

function createWallWithGoal(x, y, z, totalWidth, gWidth, colorHex) {
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x0d2342, roughness: 0.5 });
    const sideW = (totalWidth - gWidth) / 2;
    scene.add(new THREE.Mesh(new THREE.BoxGeometry(sideW, 4, 1.5), wallMat).position.set(x - gWidth/2 - sideW/2, y, z));
    scene.add(new THREE.Mesh(new THREE.BoxGeometry(sideW, 4, 1.5), wallMat).position.set(x + gWidth/2 + sideW/2, y, z));
    scene.add(new THREE.Mesh(new THREE.BoxGeometry(gWidth, 1.5, 1.5), wallMat).position.set(x, y + 2, z));

    const frame = new THREE.MeshBasicMaterial({ color: colorHex });
    const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 12, 1.6), frame); p1.position.set(x - gWidth/2, 6, z);
    const p2 = p1.clone(); p2.position.x = x + gWidth/2;
    scene.add(p1, p2);
}

function createWallWithGoalZ(x, y, z, totalDepth, gDepth, colorHex) {
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x0d2342, roughness: 0.5 });
    const sideD = (totalDepth - gDepth) / 2;
    scene.add(new THREE.Mesh(new THREE.BoxGeometry(1.5, 4, sideD), wallMat).position.set(x, y, z - gDepth/2 - sideD/2));
    scene.add(new THREE.Mesh(new THREE.BoxGeometry(1.5, 4, sideD), wallMat).position.set(x, y, z + gDepth/2 + sideD/2));
    scene.add(new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, gDepth), wallMat).position.set(x, y + 2, z));

    const frame = new THREE.MeshBasicMaterial({ color: colorHex });
    const p1 = new THREE.Mesh(new THREE.BoxGeometry(1.6, 12, 0.4), frame); p1.position.set(x, 6, z - gDepth/2);
    const p2 = p1.clone(); p2.position.z = z + gDepth/2;
    scene.add(p1, p2);
}

function resetPositions() {
    const dist = 45;
    for(let i=0; i<numPlayers; i++) {
        const angle = (i / numPlayers) * Math.PI * 2;
        cars[i].position.set(Math.sin(angle)*dist, 0.45, Math.cos(angle)*dist);
        cars[i].rotation.y = angle + Math.PI;
        playersData[i].speed = 0;
        playersData[i].boost = 100;
    }
    ball.position.set(0, 1.2, 0);
    ballVel.set(0, 0, 0);
}

function onWindowResize() {
    renderer.setSize(window.innerWidth, window.innerHeight);
    updateLayoutRects();
}

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, clock.getDelta());

    if (playing) {
        for(let i=0; i<numPlayers; i++) {
            let p = playersData[i];
            let car = cars[i];

            if (p.targetSpeed > p.speed) p.speed += accel * dt;
            else if (p.targetSpeed < p.speed) p.speed -= brake * dt;
            const effSpeed = p.speed * (p.activeBoost ? 2.3 : 1.0);
            const fwd = new THREE.Vector3(Math.sin(car.rotation.y), 0, Math.cos(car.rotation.y));
            car.position.addScaledVector(fwd, effSpeed * dt);
            car.rotation.y += p.steer * 2.5 * dt;
            p.speed *= 0.985;

            // Hranice
            const limit = arenaSize / 2 - 2;
            car.position.x = Math.max(-limit, Math.min(limit, car.position.x));
            car.position.z = Math.max(-limit, Math.min(limit, car.position.z));

            // Boost stav
            if (p.activeBoost) { p.boost -= 50 * dt; if (p.boost <= 0) { p.boost = 0; p.activeBoost = false; } }
            else { p.boost = Math.min(100, p.boost + 25 * dt); }

            document.getElementById(`score${i}`).innerText = p.score;
            document.getElementById(`boost${i}`).innerText = Math.round(p.boost);
        }

        // Fyzika lopty
        ballVel.y -= 15 * dt;
        ball.position.addScaledVector(ballVel, dt);
        if (ball.position.y < 1.2) {
            ball.position.y = 1.2;
            if (ballVel.y < 0) ballVel.y *= -0.55;
            ballVel.x *= 0.98; ballVel.z *= 0.98;
        }

        // Kolízie áut s loptou
        for(let i=0; i<numPlayers; i++) {
            if (cars[i].position.distanceTo(ball.position) < 2.2) {
                const n = new THREE.Vector3().subVectors(ball.position, cars[i].position).normalize();
                ball.position.addScaledVector(n, 0.1);
                ballVel.copy(n.multiplyScalar(Math.max(4, Math.abs(playersData[i].speed) * 2)));
                ballVel.y += 5;
            }
        }

        // Kontrola gólov
        const half = arenaSize / 2 - 1.5;
        if(!goalCooldown) {
            if(ball.position.z < -half) { triggerGoal("GÓÓÓL - HRÁČ 2 BODUJE!", 1); }
            else if(ball.position.z > half) { triggerGoal("GÓÓÓL - HRÁČ 1 BODUJE!", 0); }
            else if(numPlayers === 4 && ball.position.x > half) { triggerGoal("GÓÓÓL - HRÁČ 3 BODUJE!", 2); }
            else if(numPlayers === 4 && ball.position.x < -half) { triggerGoal("GÓÓÓL - HRÁČ 4 BODUJE!", 3); }
        }

        // Kamery
        for(let i=0; i<numPlayers; i++) {
            updateCamera(cameras[i], cars[i]);
        }
    }

    renderer.clear();
    const w = window.innerWidth;
    const h = window.innerHeight;

    for(let i=0; i<numPlayers; i++) {
        let rx = 0, ry = 0, rw = w, rh = h/2;
        if(numPlayers === 2) {
            ry = (i === 0) ? h/2 : 0;
            rh = h/2;
        } else if(numPlayers === 3) {
            if(i === 0) { ry = h/2; rh = h/2; }
            else if(i === 1) { rx = 0; ry = 0; rw = w/2; rh = h/2; }
            else if(i === 2) { rx = w/2; ry = 0; rw = w/2; rh = h/2; }
        } else if(numPlayers === 4) {
            rx = (i % 2 === 1) ? w/2 : 0;
            ry = (i < 2) ? h/2 : 0;
            rw = w/2; rh = h/2;
        }

        cameras[i].aspect = rw / rh;
        cameras[i].updateProjectionMatrix();

        renderer.setViewport(rx, ry, rw, rh);
        renderer.setScissor(rx, ry, rw, rh);
        renderer.setScissorTest(true);
        renderer.render(scene, cameras[i]);
    }
}

function updateCamera(cam, car) {
    const offset = new THREE.Vector3(0, 5, 11).applyAxisAngle(new THREE.Vector3(0, 1, 0), car.rotation.y);
    const target = new THREE.Vector3().copy(car.position).add(offset);
    cam.position.lerp(target, 0.2);
    cam.lookAt(new THREE.Vector3().copy(car.position).add(new THREE.Vector3(0, 1, 0)));
}

function triggerGoal(text, scorerIdx) {
    goalCooldown = true;
    playersData[scorerIdx].score++;
    const banner = document.getElementById('goalBanner');
    banner.innerText = text;
    banner.style.display = 'block';
    playing = false;
    setTimeout(() => {
        banner.style.display = 'none';
        resetPositions();
        playing = true;
        goalCooldown = false;
    }, 1800);
}

// --- Nezávislé multi-touch joysticky pre všetkých hráčov ---
function setupJoysticks() {
    for(let i=0; i<numPlayers; i++) {
        initJoy(`joy${i}`, `stick${i}`, p => {
            playersData[i].targetSpeed = -p.y * maxSpeed;
            playersData[i].steer = p.x;
        });

        const btn = document.getElementById(`boostBtn${i}`);
        let pId = null;
        btn.addEventListener('pointerdown', e => {
            if(pId !== null) return;
            pId = e.pointerId;
            btn.setPointerCapture(e.pointerId);
            if(playersData[i].boost > 10) playersData[i].activeBoost = true;
        });
        const endB = e => {
            if(e.pointerId !== pId) return;
            pId = null;
            playersData[i].activeBoost = false;
        };
        btn.addEventListener('pointerup', endB);
        btn.addEventListener('pointercancel', endB);
    }
}

function initJoy(joyId, stickId, callback) {
    const joy = document.getElementById(joyId);
    const stick = document.getElementById(stickId);
    let activePointerId = null;
    let startX = 0, startY = 0;
    const maxR = 34;

    joy.addEventListener('pointerdown', e => {
        if (activePointerId !== null) return;
        activePointerId = e.pointerId;
        joy.setPointerCapture(e.pointerId);

        const rect = joy.getBoundingClientRect();
        startX = rect.left + rect.width / 2;
        startY = rect.top + rect.height / 2;
        update(e.clientX, e.clientY);
    });

    joy.addEventListener('pointermove', e => {
        if (e.pointerId !== activePointerId) return;
        update(e.clientX, e.clientY);
    });

    const release = e => {
        if (e.pointerId !== activePointerId) return;
        activePointerId = null;
        stick.style.transform = 'translate(0px, 0px)';
        callback({ x: 0, y: 0 });
    };

    joy.addEventListener('pointerup', release);
    joy.addEventListener('pointercancel', release);

    function update(cx, cy) {
        const dx = cx - startX;
        const dy = cy - startY;
        const dist = Math.min(Math.sqrt(dx*dx + dy*dy), maxR);
        const angle = Math.atan2(dy, dx);
        const xPos = dist * Math.cos(angle);
        const yPos = dist * Math.sin(angle);
        stick.style.transform = `translate(${xPos}px, ${yPos}px)`;
        callback({ x: xPos / maxR, y: yPos / maxR });
    }
}
</script>

</body>
</html>
