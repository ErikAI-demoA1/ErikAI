<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>RocketSK v5.5 (ErikAI)</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    background: #030810;
    color: #fff;
    overflow: hidden;
    touch-action: none;
}

#webgl-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
}

/* --- Menu výberu hráčov --- */
#menuContainer {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(circle at center, #0a1f3d 0%, #030810 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    gap: 16px;
}
#menuContainer h1 {
    font-size: 28px;
    color: #00ffcc;
    text-shadow: 0 0 20px rgba(0,255,204,0.6);
    margin-bottom: 6px;
    text-align: center;
}
.menu-btn {
    padding: 14px 24px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(145deg, #00ffcc, #00b386);
    color: #030810;
    font-weight: 900;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0,255,200,0.5);
    width: 290px;
    text-transform: uppercase;
}
.menu-btn small {
    display: block;
    font-size: 10px;
    font-weight: 600;
    text-transform: none;
    opacity: 0.85;
    margin-top: 3px;
}
.menu-btn:active { transform: scale(0.95); }

/* --- Dynamické Viewporty a UI kontajnery --- */
.viewport-ui {
    position: absolute;
    overflow: hidden;
    pointer-events: none;
    z-index: 10;
    box-sizing: border-box;
    border: 1px solid rgba(255,255,255,0.15);
}

.hud-p {
    position: absolute;
    top: 6px; left: 8px;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 10px;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(6px);
    z-index: 40;
    font-weight: 700;
}

.player-controls {
    position: absolute;
    bottom: 6px; left: 8px; right: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 40;
    pointer-events: none;
}

.joystick {
    width: 75px; height: 75px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    border: 2px solid rgba(255,255,255,0.25);
    touch-action: none;
}

.stick {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    pointer-events: none;
}

.btn-boost {
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(145deg, #ff8c00, #ff4500);
    color: white;
    font-weight: 800;
    font-size: 10px;
    cursor: pointer;
    pointer-events: auto;
    box-shadow: 0 0 10px rgba(255,100,0,0.5);
    touch-action: none;
}
.btn-boost:active { transform: scale(0.92); }

#timer {
    position: fixed;
    top: 4px; left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    background: rgba(0,0,0,0.85);
    border: 1px solid rgba(255,255,255,0.3);
    padding: 3px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 900;
    display: none;
    pointer-events: none;
}

.goal-banner {
    position: fixed;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, #ff7a3c, #ff1e1e);
    padding: 20px 30px;
    border-radius: 14px;
    font-size: 24px;
    font-weight: 900;
    color: #fff;
    z-index: 1100;
    display: none;
    text-align: center;
    box-shadow: 0 0 30px rgba(255,120,60,0.9);
    text-transform: uppercase;
    max-width: 85%;
}
.goal-banner button {
    margin-top: 14px;
    padding: 10px 22px;
    border: none;
    border-radius: 10px;
    font-weight: 900;
    font-size: 14px;
    background: #fff;
    color: #c2200a;
    cursor: pointer;
}
</style>
</head>
<body>

<div id="menuContainer">
    <h1>🚀 ROCKETSK ARENA</h1>
    <button class="menu-btn" onclick="startGame(2)">2 hráči<small>Klasický futbal – vyhráva kto dá viac gólov</small></button>
    <button class="menu-btn" onclick="startGame(3)" style="background:linear-gradient(145deg, #3b82f6, #1d4ed8); color:#fff;">3 hráči<small>Trojuholník – chráň bránku, vyhráva kto dostane menej gólov</small></button>
    <button class="menu-btn" onclick="startGame(4)" style="background:linear-gradient(145deg, #8b5cf6, #6d28d9); color:#fff;">4 hráči<small>Štvorec – chráň bránku, vyhráva kto dostane menej gólov</small></button>
</div>

<div id="webgl-container"></div>
<div id="timer">3:00</div>
<div class="goal-banner" id="goalBanner">GÓÓÓL!</div>

<div id="uiContainer"></div>

<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
<script>
let scene, renderer;
let cameras = [];
let cars = [];
let ball, ground;
let clock, playing = false;
let numPlayers = 2;
let started = false;
let ended = false;

const MATCH_TIME = 180;      // dĺžka zápasu v sekundách
let matchTime = MATCH_TIME;

const BALL_R = 1.2;
const PLAYER_COLORS_HEX = [0xff3b3b, 0x00bfff, 0x10b981, 0xf59e0b];
const GOAL_COLORS_HEX   = [0xef4444, 0x3b82f6, 0x10b981, 0xf59e0b];

// Strany arény: normála (nx,nz) smeruje von, d = vzdialenosť od stredu
let sides = [];
let verts = [];

let playersData = [];
let ballVel = new THREE.Vector3();
let goalCooldown = false;
const maxSpeed = 22, accel = 40, brake = 50;

function startGame(count) {
    numPlayers = count;
    document.getElementById('menuContainer').style.display = 'none';

    playersData = [];
    for(let i=0; i<numPlayers; i++) {
        // goals: pri 2 hráčoch = dané góly, pri 3/4 hráčoch = prijaté góly
        playersData.push({ speed: 0, targetSpeed: 0, steer: 0, boost: 100, activeBoost: false, goals: 0 });
    }

    matchTime = MATCH_TIME;
    ended = false;
    defineArena();
    buildUI();
    init3D();
    const t = document.getElementById('timer');
    t.style.display = 'block';
    updateTimerText();
    playing = true;
}

/* ---------- Definícia arény ---------- */
function defineArena() {
    const PI = Math.PI;
    let defs = [];
    if(numPlayers === 2) {
        // obdĺžnik: bránky na krátkych stranách (z+ a z-), bočné steny x+ a x-
        defs = [
            { th: 0,        d: 100, owner: 0 },
            { th: PI/2,     d: 60,  owner: -1 },
            { th: PI,       d: 100, owner: 1 },
            { th: PI*1.5,   d: 60,  owner: -1 }
        ];
    } else if(numPlayers === 4) {
        for(let i=0; i<4; i++) defs.push({ th: i*PI/2, d: 100, owner: i });
    } else {
        // rovnostranný trojuholník, každá strana má bránku
        for(let i=0; i<3; i++) defs.push({ th: i*2*PI/3, d: 60, owner: i });
    }

    sides = defs.map(s => ({
        th: s.th, d: s.d, owner: s.owner,
        nx: Math.sin(s.th), nz: Math.cos(s.th),
        tx: Math.cos(s.th), tz: -Math.sin(s.th)
    }));

    const n = sides.length;
    verts = sides.map((s, k) => {
        const o = sides[(k + 1) % n];
        const det = s.nx * o.nz - s.nz * o.nx;
        return {
            x: (s.d * o.nz - o.d * s.nz) / det,
            z: (s.nx * o.d - o.nx * s.d) / det
        };
    });

    sides.forEach((s, k) => {
        const A = verts[(k - 1 + n) % n], B = verts[k];
        s.mid = { x: (A.x + B.x) / 2, z: (A.z + B.z) / 2 };
        s.len = Math.hypot(B.x - A.x, B.z - A.z);
        s.gw = s.owner >= 0 ? s.len * 0.45 : 0;   // šírka bránky
    });
}

/* ---------- UI ---------- */
function buildUI() {
    const container = document.getElementById('uiContainer');
    container.innerHTML = '';

    const colors = ['#ff4b4b', '#00bfff', '#10b981', '#f59e0b'];
    const names = ['P1 (RED)', 'P2 (BLUE)', 'P3 (GREEN)', 'P4 (YELLOW)'];
    const label = numPlayers === 2 ? 'Góly' : 'Dostal';

    for(let i=0; i<numPlayers; i++) {
        const div = document.createElement('div');
        div.className = 'viewport-ui';
        div.id = `viewportUI${i}`;
        div.innerHTML = `
            <div class="hud-p" id="hudP${i}" style="color:${colors[i]}; border:1px solid ${colors[i]}66;">
                ${names[i]} | ${label}: <span id="score${i}">0</span> | Boost: <span id="boost${i}">100</span>%
            </div>
            <div class="player-controls">
                <div id="joy${i}" class="joystick"><div id="stick${i}" class="stick"></div></div>
                <button id="boostBtn${i}" class="btn-boost" style="background:linear-gradient(145deg, ${colors[i]}, #222);">⚡ BOOST</button>
            </div>
        `;
        container.appendChild(div);
    }
    updateLayoutRects();
    setupJoysticks();
}

// Jediný zdroj pravdy pre rozloženie: súradnice zhora-zľava (CSS)
function getViewRect(i, w, h) {
    if(numPlayers === 2) return { x: 0, y: i * h/2, w: w, h: h/2 };
    if(numPlayers === 3) {
        if(i === 0) return { x: 0, y: 0, w: w, h: h/2 };
        return { x: (i === 2) ? w/2 : 0, y: h/2, w: w/2, h: h/2 };
    }
    return { x: (i % 2) * w/2, y: (i < 2) ? 0 : h/2, w: w/2, h: h/2 };
}

function updateLayoutRects() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    for(let i=0; i<numPlayers; i++) {
        const r = getViewRect(i, w, h);
        setRect(`viewportUI${i}`, r.x, r.y, r.w, r.h);
    }
}

function setRect(id, x, y, w, h) {
    const el = document.getElementById(id);
    if(el) {
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.width = w + 'px';
        el.style.height = h + 'px';
    }
}

function updateTimerText() {
    const t = Math.max(0, Math.ceil(matchTime));
    const m = Math.floor(t / 60), s = t % 60;
    document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
}

/* ---------- 3D ---------- */
function addMesh(geo, mat, x, y, z, ry) {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    if(ry) m.rotation.y = ry;
    scene.add(m);
    return m;
}

function makeGroundTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    g.fillStyle = '#08162b';
    g.fillRect(0, 0, 64, 64);
    g.strokeStyle = '#1a365d';
    g.lineWidth = 2;
    g.strokeRect(0, 0, 64, 64);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(0.1, 0.1);   // 1 dlaždica = 10 jednotiek
    return tex;
}

function init3D() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040b16);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.autoClear = false;
    document.getElementById('webgl-container').appendChild(renderer.domElement);

    cameras = [];
    cars = [];

    scene.add(new THREE.HemisphereLight(0xffffff, 0x112244, 0.9));
    const dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(40, 80, 40);
    scene.add(dir);

    // podlaha presne v tvare arény
    const shape = new THREE.Shape();
    verts.forEach((v, i) => { if(i === 0) shape.moveTo(v.x, -v.z); else shape.lineTo(v.x, -v.z); });
    shape.closePath();
    ground = new THREE.Mesh(
        new THREE.ShapeGeometry(shape),
        new THREE.MeshStandardMaterial({ map: makeGroundTexture(), roughness: 0.8, side: THREE.DoubleSide })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // stredový kruh (a čiara pri futbale)
    const ring = new THREE.Mesh(
        new THREE.RingGeometry(9, 9.5, 48),
        new THREE.MeshBasicMaterial({ color: 0x00ffcc, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.06;
    scene.add(ring);
    if(numPlayers === 2) {
        addMesh(new THREE.BoxGeometry(120, 0.05, 0.5), new THREE.MeshBasicMaterial({ color: 0x00ffcc }), 0, 0.06, 0);
    }

    for(let i=0; i<numPlayers; i++) {
        const cam = new THREE.PerspectiveCamera(75, 1, 0.1, 4000);
        cameras.push(cam);

        const car = createCar(PLAYER_COLORS_HEX[i]);
        cars.push(car);
        scene.add(car);
    }

    ball = new THREE.Mesh(
        new THREE.SphereGeometry(BALL_R, 32, 32),
        new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, emissive: 0x222222 })
    );
    ball.position.set(0, BALL_R, 0);
    scene.add(ball);

    resetPositions();
    for(let i=0; i<numPlayers; i++) updateCamera(cameras[i], cars[i], true);

    buildArenaGeometry();

    clock = new THREE.Clock();
    window.addEventListener('resize', onWindowResize);
    if(!started) { started = true; animate(); }
}

function createCar(colorHex) {
    const group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.2, metalness: 0.8 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.55, 2.6), mat);
    body.position.y = 0.4;
    group.add(body);

    const spoiler = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.2, 0.4), new THREE.MeshStandardMaterial({ color: 0xffffff }));
    spoiler.position.set(0, 0.8, -1.0);
    group.add(spoiler);
    return group;
}

// Postaví steny so všetkých strán; strany s majiteľom majú bránku v strede
function buildArenaGeometry() {
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x0d2342, roughness: 0.5 });
    const THICK = 1.5, H = 4;

    sides.forEach(s => {
        // stred steny posunutý von, aby vnútorná hrana ležala na čiare strany
        const cx = s.mid.x + s.nx * THICK / 2;
        const cz = s.mid.z + s.nz * THICK / 2;
        const put = (len, h, thick, mat, off, y) =>
            addMesh(new THREE.BoxGeometry(len, h, thick), mat, cx + s.tx * off, y, cz + s.tz * off, s.th);

        if(s.owner < 0) {
            put(s.len, H, THICK, wallMat, 0, H / 2);
        } else {
            const seg = (s.len - s.gw) / 2;
            const off = s.gw / 2 + seg / 2;
            put(seg, H, THICK, wallMat, -off, H / 2);
            put(seg, H, THICK, wallMat,  off, H / 2);

            const frame = new THREE.MeshBasicMaterial({ color: GOAL_COLORS_HEX[s.owner] });
            put(0.5, 6, 0.8, frame, -s.gw / 2, 3);
            put(0.5, 6, 0.8, frame,  s.gw / 2, 3);
            put(s.gw, 0.5, 0.8, frame, 0, 6);

            // farebný pás na podlahe pred bránkou
            addMesh(new THREE.BoxGeometry(s.gw, 0.05, 3), frame,
                s.mid.x - s.nx * 1.5, 0.07, s.mid.z - s.nz * 1.5, s.th);
        }
    });
}

function resetPositions() {
    const dist = 45;
    for(let i=0; i<numPlayers; i++) {
        const angle = (i / numPlayers) * Math.PI * 2;
        cars[i].position.set(Math.sin(angle)*dist, 0.45, Math.cos(angle)*dist);
        cars[i].rotation.y = angle + Math.PI;
        playersData[i].speed = 0;
        playersData[i].boost = 100;
    }
    if(ball) {
        ball.position.set(0, BALL_R, 0);
        ballVel.set(0, 0, 0);
    }
}

function onWindowResize() {
    renderer.setSize(window.innerWidth, window.innerHeight);
    updateLayoutRects();
}

/* ---------- Fyzika ---------- */
function constrainCar(car) {
    for(const s of sides) {
        const dist = car.position.x * s.nx + car.position.z * s.nz;
        const lim = s.d - 2;
        if(dist > lim) {
            car.position.x -= s.nx * (dist - lim);
            car.position.z -= s.nz * (dist - lim);
        }
    }
}

// vráti index majiteľa bránky, do ktorej lopta padla, inak -1
function constrainBall() {
    const p = ball.position;
    for(const s of sides) {
        const dist = p.x * s.nx + p.z * s.nz;
        let inMouth = false;
        if(s.owner >= 0) {
            const along = (p.x - s.mid.x) * s.tx + (p.z - s.mid.z) * s.tz;
            inMouth = Math.abs(along) < s.gw / 2;
            if(inMouth && dist > s.d - 0.5) return s.owner;
        }
        if(dist > s.d - BALL_R && !inMouth) {
            const over = dist - (s.d - BALL_R);
            p.x -= s.nx * over;
            p.z -= s.nz * over;
            const vn = ballVel.x * s.nx + ballVel.z * s.nz;
            if(vn > 0) {
                ballVel.x -= 1.6 * vn * s.nx;
                ballVel.z -= 1.6 * vn * s.nz;
            }
        }
    }
    return -1;
}

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, clock.getDelta());

    if (playing) {
        for(let i=0; i<numPlayers; i++) {
            let p = playersData[i];
            let car = cars[i];

            if (p.targetSpeed > p.speed) p.speed += accel * dt;
            else if (p.targetSpeed < p.speed) p.speed -= brake * dt;
            const effSpeed = p.speed * (p.activeBoost ? 2.3 : 1.0);
            const fwd = new THREE.Vector3(Math.sin(car.rotation.y), 0, Math.cos(car.rotation.y));
            car.position.addScaledVector(fwd, effSpeed * dt);
            car.rotation.y -= p.steer * 2.5 * dt;
            p.speed *= 0.985;

            constrainCar(car);

            if (p.activeBoost) { p.boost -= 50 * dt; if (p.boost <= 0) { p.boost = 0; p.activeBoost = false; } }
            else { p.boost = Math.min(100, p.boost + 25 * dt); }

            document.getElementById(`score${i}`).innerText = p.goals;
            document.getElementById(`boost${i}`).innerText = Math.round(p.boost);
        }

        ballVel.y -= 15 * dt;
        ball.position.addScaledVector(ballVel, dt);
        if (ball.position.y < BALL_R) {
            ball.position.y = BALL_R;
            if (ballVel.y < 0) ballVel.y *= -0.55;
            ballVel.x *= 0.98; ballVel.z *= 0.98;
        }

        for(let i=0; i<numPlayers; i++) {
            if (cars[i].position.distanceTo(ball.position) < 2.2) {
                const n = new THREE.Vector3().subVectors(ball.position, cars[i].position).normalize();
                ball.position.addScaledVector(n, 0.1);
                ballVel.copy(n.multiplyScalar(Math.max(4, Math.abs(playersData[i].speed) * 2)));
                ballVel.y += 5;
            }
        }

        const concededBy = constrainBall();
        if(concededBy >= 0 && !goalCooldown) {
            triggerGoal(concededBy);
        } else {
            matchTime -= dt;
            updateTimerText();
            if(matchTime <= 0) endMatch();
        }

        for(let i=0; i<numPlayers; i++) {
            updateCamera(cameras[i], cars[i]);
        }
    }

    // scissor test musí byť vypnutý, inak clear() zmaže len posledný výrez
    renderer.setScissorTest(false);
    renderer.clear();
    const w = window.innerWidth;
    const h = window.innerHeight;

    for(let i=0; i<numPlayers; i++) {
        const r = getViewRect(i, w, h);
        const webGLY = h - r.y - r.h;   // CSS (zhora) -> WebGL (zospodu)

        cameras[i].aspect = r.w / r.h;
        cameras[i].updateProjectionMatrix();

        renderer.setViewport(r.x, webGLY, r.w, r.h);
        renderer.setScissor(r.x, webGLY, r.w, r.h);
        renderer.setScissorTest(true);
        renderer.render(scene, cameras[i]);
    }
}

function updateCamera(cam, car, snap) {
    // auto jazdí smerom (sin, 0, cos), kamera je ZA ním
    const offset = new THREE.Vector3(0, 5, -11).applyAxisAngle(new THREE.Vector3(0, 1, 0), car.rotation.y);
    const target = new THREE.Vector3().copy(car.position).add(offset);
    if(snap) cam.position.copy(target); else cam.position.lerp(target, 0.2);
    cam.lookAt(new THREE.Vector3().copy(car.position).add(new THREE.Vector3(0, 1, 0)));
}

/* ---------- Góly a koniec zápasu ---------- */
function triggerGoal(ownerIdx) {
    goalCooldown = true;
    let text;
    if(numPlayers === 2) {
        const scorer = 1 - ownerIdx;
        playersData[scorer].goals++;
        text = `GÓÓÓL! HRÁČ ${scorer + 1} BODUJE!`;
    } else {
        playersData[ownerIdx].goals++;
        text = `GÓL! HRÁČ ${ownerIdx + 1} DOSTAL GÓL`;
    }
    for(let i=0; i<numPlayers; i++) document.getElementById(`score${i}`).innerText = playersData[i].goals;

    const banner = document.getElementById('goalBanner');
    banner.innerText = text;
    banner.style.display = 'block';
    playing = false;
    setTimeout(() => {
        if(ended) return;
        banner.style.display = 'none';
        resetPositions();
        for(let i=0; i<numPlayers; i++) updateCamera(cameras[i], cars[i], true);
        playing = true;
        goalCooldown = false;
    }, 1800);
}

function endMatch() {
    ended = true;
    playing = false;
    matchTime = 0;
    updateTimerText();

    const vals = playersData.map(p => p.goals);
    // 2 hráči: víťaz má viac gólov; 3/4 hráči: víťaz dostal menej gólov
    const best = numPlayers === 2 ? Math.max(...vals) : Math.min(...vals);
    const winners = [];
    vals.forEach((v, i) => { if(v === best) winners.push(i + 1); });

    let text;
    if(winners.length === numPlayers) text = 'REMÍZA!';
    else if(winners.length === 1) text = `VÍŤAZ: HRÁČ ${winners[0]}!`;
    else text = `VÍŤAZI: HRÁČI ${winners.join(' a ')}!`;

    const banner = document.getElementById('goalBanner');
    banner.innerHTML = `⏱ KONIEC ZÁPASU<br>${text}<br><button onclick="location.reload()">NOVÁ HRA</button>`;
    banner.style.display = 'block';
}

/* ---------- Ovládanie ---------- */
function setupJoysticks() {
    for(let i=0; i<numPlayers; i++) {
        initJoy(`joy${i}`, `stick${i}`, p => {
            playersData[i].targetSpeed = -p.y * maxSpeed;
            playersData[i].steer = p.x;
        });

        const btn = document.getElementById(`boostBtn${i}`);
        let pId = null;
        btn.addEventListener('pointerdown', e => {
            if(pId !== null) return;
            pId = e.pointerId;
            btn.setPointerCapture(e.pointerId);
            if(playersData[i].boost > 10) playersData[i].activeBoost = true;
        });
        const endB = e => {
            if(e.pointerId !== pId) return;
            pId = null;
            playersData[i].activeBoost = false;
        };
        btn.addEventListener('pointerup', endB);
        btn.addEventListener('pointercancel', endB);
    }
}

function initJoy(joyId, stickId, callback) {
    const joy = document.getElementById(joyId);
    const stick = document.getElementById(stickId);
    let activePointerId = null;
    let startX = 0, startY = 0;
    const maxR = 26;

    joy.addEventListener('pointerdown', e => {
        if (activePointerId !== null) return;
        activePointerId = e.pointerId;
        joy.setPointerCapture(e.pointerId);

        const rect = joy.getBoundingClientRect();
        startX = rect.left + rect.width / 2;
        startY = rect.top + rect.height / 2;
        update(e.clientX, e.clientY);
    });

    joy.addEventListener('pointermove', e => {
        if (e.pointerId !== activePointerId) return;
        update(e.clientX, e.clientY);
    });

    const release = e => {
        if (e.pointerId !== activePointerId) return;
        activePointerId = null;
        stick.style.transform = 'translate(0px, 0px)';
        callback({ x: 0, y: 0 });
    };

    joy.addEventListener('pointerup', release);
    joy.addEventListener('pointercancel', release);

    function update(cx, cy) {
        const dx = cx - startX;
        const dy = cy - startY;
        const dist = Math.min(Math.sqrt(dx*dx + dy*dy), maxR);
        const angle = Math.atan2(dy, dx);
        const xPos = dist * Math.cos(angle);
        const yPos = dist * Math.sin(angle);
        stick.style.transform = `translate(${xPos}px, ${yPos}px)`;
        callback({ x: xPos / maxR, y: yPos / maxR });
    }
}
</script>
