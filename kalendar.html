<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErikAI Kalendár</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #ffffff 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.6);
      --text-main: #0f172a;
      --text-muted: #475569;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --days-bg: #f1f5f9;
      --day-hover: #e0f2fe;
      --today-bg: linear-gradient(135deg, #f97316, #fb923c);
      --holiday-bg: #0ea5e9;
      --note-bg: #a855f7;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }

    body.dark-mode {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #090d16 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --days-bg: rgba(15, 23, 42, 0.6);
      --day-hover: #334155;
      --today-bg: linear-gradient(135deg, #ea580c, #f97316);
      --holiday-bg: #0284c7;
      --note-bg: #9333ea;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      padding: 30px 15px;
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    #cas {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .controls button, .theme-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .controls button:hover, .theme-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    #yearDisplay {
      font-size: 1.5rem;
      font-weight: 800;
      min-width: 90px;
      text-align: center;
    }

    #calendar {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 20px;
    }

    .month {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .month:hover {
      transform: translateY(-4px);
    }

    .month h3 {
      text-align: center;
      margin-bottom: 14px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      background: var(--days-bg);
      border-radius: 12px;
      padding: 8px;
    }

    .dow {
      text-align: center;
      font-weight: 700;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding: 4px 0;
      text-transform: uppercase;
    }

    .day {
      text-align: center;
      padding: 8px 0;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
      color: var(--text-main);
    }

    .day:hover {
      background-color: var(--day-hover);
      transform: scale(1.08);
      z-index: 2;
    }

    /* Špeciálne stavy pre dni */
    .day.today {
      background: var(--today-bg) !important;
      color: white !important;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(249, 115, 22, 0.4);
    }

    .day.holiday {
      background-color: var(--holiday-bg);
      color: white;
    }

    .day.note {
      background-color: var(--note-bg);
      color: white;
    }

    /* Zobrazenie indikátora ak má deň viac vlastností (napr. dnes + poznámka) */
    .day.note::after {
      content: '';
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      background-color: #fff;
      border-radius: 50%;
    }

    .legend {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .badge {
      width: 14px;
      height: 14px;
      border-radius: 4px;
    }

    .badge.today { background: var(--today-bg); }
    .badge.holiday { background: var(--holiday-bg); }
    .badge.note { background: var(--note-bg); }

    .bottom-bar {
      margin-top: 25px;
      text-align: center;
    }

    @media (max-width: 600px) {
      body { padding: 15px 10px; }
      h1 { font-size: 1.75rem; }
      #calendar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>ErikAI Kalendár 😎</h1>
    <p id="cas">🕓 Načítavam čas...</p>
  </header>

  <div class="controls">
    <button onclick="changeYear(-1)">◀ Rok späť</button>
    <span id="yearDisplay"></span>
    <button onclick="changeYear(1)">Rok vpred ▶</button>
  </div>

  <div id="calendar"></div>

  <div class="legend">
    <div class="legend-item"><div class="badge today"></div> Dnes</div>
    <div class="legend-item"><div class="badge holiday"></div> Sviatok</div>
    <div class="legend-item"><div class="badge note"></div> Udalosť / Poznámka</div>
  </div>

  <div class="bottom-bar">
    <button class="theme-btn" onclick="toggleTheme()">🌓 Zmeniť režim</button>
  </div>
</div>

<script>
  const holidays = {
    "1.1": "Nový rok / Deň vzniku SR",
    "6.1": "Zjavenie Pána (Traja králi)",
    "1.5": "Sviatok práce",
    "8.5": "Deň víťazstva nad fašizmom",
    "5.7": "Sviatok svätého Cyrila a Metoda",
    "29.8": "Výročie SNP",
    "1.9": "Deň Ústavy Slovenskej republiky",
    "15.9": "Sedembolestná Panna Mária",
    "1.11": "Sviatok Všetkých svätých",
    "17.11": "Deň boja za slobodu a demokraciu",
    "24.12": "Štedrý deň",
    "25.12": "Prvý sviatok vianočný",
    "26.12": "Druhý sviatok vianočný"
  };

  const daysShort = ["Po","Ut","St","Št","Pi","So","Ne"];
  const monthNames = ["Január","Február","Marec","Apríl","Máj","Jún","Júl","August","September","Október","November","December"];
  let currentYear = new Date().getFullYear();

  function renderCalendar(year) {
    const calendarEl = document.getElementById("calendar");
    calendarEl.innerHTML = "";
    document.getElementById("yearDisplay").textContent = year;
    const today = new Date();

    for (let m = 0; m < 12; m++) {
      const month = document.createElement("div");
      month.className = "month";

      const h3 = document.createElement("h3");
      h3.textContent = monthNames[m];
      month.appendChild(h3);

      const daysDiv = document.createElement("div");
      daysDiv.className = "days";

      // Hlavička dní v týždni
      for (let i = 0; i < 7; i++) {
        const dow = document.createElement("div");
        dow.className = "dow";
        dow.textContent = daysShort[i];
        daysDiv.appendChild(dow);
      }

      // Odpadové políčka pred prvým dňom mesiaca
      const firstDay = new Date(year, m, 1);
      let startDay = (firstDay.getDay() + 6) % 7; // Pondelok ako 0

      for (let i = 0; i < startDay; i++) {
        daysDiv.appendChild(document.createElement("div"));
      }

      const totalDays = new Date(year, m + 1, 0).getDate();

      for (let d = 1; d <= totalDays; d++) {
        const dateKey = `${d}.${m + 1}`;
        const dateId = `${year}-${m + 1}-${d}`;
        const div = document.createElement("div");
        div.className = "day";
        div.textContent = d;

        const note = localStorage.getItem(dateId);
        let titleParts = [];

        // Kontrola sviatku
        if (holidays[dateKey]) {
          div.classList.add("holiday");
          titleParts.push(holidays[dateKey]);
        }

        // Kontrola poznámky
        if (note) {
          div.classList.add("note");
          titleParts.push(`Poznámka: ${note}`);
        }

        // Kontrola dnešného dňa
        if (d === today.getDate() && m === today.getMonth() && year === today.getFullYear()) {
          div.classList.add("today");
          titleParts.unshift("Dnes");
        }

        if (titleParts.length > 0) {
          div.title = titleParts.join(" | ");
        }

        // Kliknutie pre zápis poznámky
        div.onclick = () => {
          const currentNote = localStorage.getItem(dateId) || "";
          const text = prompt(`Poznámka pre ${d}.${m + 1}.${year}:`, currentNote);
          
          if (text !== null) {
            if (text.trim() !== "") {
              localStorage.setItem(dateId, text.trim());
            } else {
              localStorage.removeItem(dateId);
            }
            renderCalendar(currentYear); // Prekreslenie kalendára po uložení
          }
        };

        daysDiv.appendChild(div);
      }

      month.appendChild(daysDiv);
      calendarEl.appendChild(month);
    }
  }

  function changeYear(offset) {
    currentYear += offset;
    renderCalendar(currentYear);
  }

  function toggleTheme() {
    document.body.classList.toggle('dark-mode');
  }

  function aktualizujCas() {
    const teraz = new Date();
    const moznosti = { 
      weekday: 'long', 
      year: 'numeric', 
      month: 'long', 
      day: 'numeric', 
      hour: '2-digit', 
      minute: '2-digit', 
      second: '2-digit' 
    };
    const casText = teraz.toLocaleDateString('sk-SK', moznosti);
    document.getElementById('cas').innerText = `🕓 Aktuálny čas: ${casText}`;
  }

  renderCalendar(currentYear);
  setInterval(aktualizujCas, 1000);
  aktualizujCas();
</script>

</body>
</html>
