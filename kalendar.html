<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>ErikAI Kalendár</title>
  <style>
    /* Celkový vzhľad stránky */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom, #e0f7fa, #ffffff);
      color: #222;
      padding: 20px 10px;
      max-width: 1320px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #0077b6;
      margin-bottom: 20px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    }

    .controls {
      text-align: center;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .controls button {
      background-color: #0077b6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .controls button:hover {
      background-color: #0096c7;
      transform: scale(1.05);
    }

    #calendar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-evenly;
      gap: 15px;
    }

    .month {
      background: #0077b6;
      color: white;
      border-radius: 12px;
      width: 220px;
      padding: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      transition: transform 0.3s ease;
    }

    .month:hover {
      transform: translateY(-5px);
    }

    .month h3 {
      margin: 0 0 10px;
      font-size: 1.2em;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      background: #e0f7fa;
      border-radius: 8px;
      padding: 5px;
    }

    .dow {
      font-weight: bold;
      color: #0077b6;
    }

    .day {
      text-align: center;
      padding: 8px 0;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .day:hover {
      background-color: #90e0ef;
      transform: scale(1.1);
    }

    .today {
      background: linear-gradient(145deg, #ff9f1c, #ffbf69);
      color: white;
      font-weight: bold;
      box-shadow: 0 0 8px rgba(255,159,28,0.7);
    }

    .holiday {
      background-color: #00b4d8;
      color: white;
      font-weight: bold;
    }

    .note {
      background-color: #b084cc;
      color: white;
      font-weight: bold;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.2);
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .legend span {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 6px;
      font-weight: bold;
      color: white;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }

    .legend .today {
      background: linear-gradient(145deg, #ff9f1c, #ffbf69);
      color: white;
    }

    .legend .holiday {
      background: #00b4d8;
    }

    .legend .note {
      background: #b084cc;
    }

    #cas {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      font-size: 18px;
      color: #0077b6;
    }

    /* Tmavý režim */
    body.dark-mode {
      background: #121212;
      color: #ffffff;
    }

    body.dark-mode .month {
      background: #1f1f1f;
      color: #f0f0f0;
      box-shadow: 0 4px 8px rgba(0,0,0,0.7);
    }

    body.dark-mode .days {
      background: #2c2c2c;
    }

    body.dark-mode .dow {
      color: #00b4d8;
    }

    body.dark-mode .day:hover {
      background-color: #0096c7;
    }

    body.dark-mode .today {
      background: linear-gradient(145deg, #ffbf69, #ff9f1c);
    }

    body.dark-mode .holiday {
      background-color: #00b4d8;
    }

    body.dark-mode .note {
      background-color: #b084cc;
    }
  </style>
</head>
<body>

<h1>ErikAI Kalendár</h1>

<div class="controls">
  <button onclick="changeYear(-1)">◀ Rok späť</button>
  <span id="yearDisplay"></span>
  <button onclick="changeYear(1)">Rok vpred ▶</button>
</div>

<div id="calendar" class="calendar"></div>

<div class="legend">
  <strong>Legenda:</strong>
  <span class="today">Dnes</span>
  <span class="holiday">Sviatok</span>
  <span class="note">Udalosť</span>
</div>

<p id="cas"></p>

<button onclick="toggleTheme()">🌓 Zmeniť režim</button>

<script>
  const holidays = {
    "1.1": "Nový rok",
    "6.1": "Zjavenie Pána",
    "1.5": "Sviatok práce",
    "8.5": "Deň víťazstva nad fašizmom",
    "5.7": "Cyril a Metod",
    "29.8": "Výročie SNP",
    "1.9": "Deň Ústavy",
    "15.9": "Sedembolestná Panna Mária",
    "1.11": "Sviatok všetkých svätých",
    "17.11": "Deň boja za slobodu",
    "24.12": "Štedrý deň",
    "25.12": "1. sviatok vianočný",
    "26.12": "2. sviatok vianočný"
  };

  const daysShort = ["Po","Ut","St","Št","Pi","So","Ne"];
  const monthNames = ["Január","Február","Marec","Apríl","Máj","Jún","Júl","August","September","Október","November","December"];
  let currentYear = new Date().getFullYear();

  function renderCalendar(year){
    document.getElementById("calendar").innerHTML="";
    document.getElementById("yearDisplay").textContent=year;
    const today = new Date();

    for(let m=0;m<12;m++){
      const month = document.createElement("div");
      month.className="month";

      const h3=document.createElement("h3");
      h3.textContent=monthNames[m];
      month.appendChild(h3);

      const daysDiv=document.createElement("div");
      daysDiv.className="days";

      for(let i=0;i<7;i++){
        const dow=document.createElement("div");
        dow.className="dow";
        dow.textContent=daysShort[i];
        daysDiv.appendChild(dow);
      }

      const firstDay=new Date(year,m,1);
      let startDay=(firstDay.getDay()+6)%7;

      for(let i=0;i<startDay;i++){
        daysDiv.appendChild(document.createElement("div"));
      }

      const totalDays=new Date(year,m+1,0).getDate();

      for(let d=1;d<=totalDays;d++){
        const dateKey=`${d}.${m+1}`;
        const div=document.createElement("div");
        div.className="day";
        div.textContent=d;

        const dateId=`${year}-${m+1}-${d}`;
        const note=localStorage.getItem(dateId);
        if(note) div.classList.add("note");

        if(holidays[dateKey]) {
          div.classList.add("holiday");
          div.title=holidays[dateKey];
        }

        if(d===today.getDate() && m===today.getMonth() && year===today.getFullYear()){
          div.classList.add("today");
        }

        div.onclick=()=>{
          const text=prompt(`Napíš hocičo aby sa ti uložilo označenie a čo si napíšeš tak potom zmizne${d}.${m+1}.${year}:`, note||"");
          if(text){
            localStorage.setItem(dateId,text);
            div.classList.add("note");
            div.classList.remove("today"); // poznámka má vlastnú farbu
          } else {
            localStorage.removeItem(dateId);
            div.classList.remove("note");
          }
        };

        daysDiv.appendChild(div);
      }

      month.appendChild(daysDiv);
      document.getElementById("calendar").appendChild(month);
    }
  }

  function changeYear(offset){
    currentYear+=offset;
    renderCalendar(currentYear);
  }

  function toggleTheme(){
    document.body.classList.toggle('dark-mode');
  }

  renderCalendar(currentYear);

  function aktualizujCas(){
    const teraz=new Date();
    const moznosti={weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'};
    const casText=teraz.toLocaleDateString('sk-SK',moznosti);
    document.getElementById('cas').innerText=`🕓 Aktuálny čas: ${casText}`;
  }
  setInterval(aktualizujCas,1000);
  aktualizujCas();
</script>

</body>
  </html>
