<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>ErikAI Kalendár</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f2f2f2;
      color: #222;
      padding: 20px 10px;
      max-width: 1320px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
    }

    .controls {
      text-align: center;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    #calendar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-evenly;
      gap: 15px;
    }

    .month {
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      width: 220px;
      padding: 10px;
      text-align: center;
    }

    .month h3 {
      margin: 0 0 10px;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .day {
      text-align: center;
      padding: 5px;
      border-radius: 5px;
      cursor: pointer;
    }

    /* Dnes bez poznámky */
    .day.today {
      background: #d10000;
      color: white;
      font-weight: bold;
    }

    /* Poznámky */
    .day.note {
      background: #ffeb3b;
      color: black;
      font-weight: bold;
    }

    /* Dnes + poznámka */
    .day.today.note {
      background: #ffeb3b;
      color: black;
      font-weight: bold;
      box-shadow: 0 0 8px rgba(209,0,0,0.7);
    }

    /* Sviatky */
    .day.holiday {
      background: #00cc66;
      color: white;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .legend span {
      display: inline-block;
      padding: 3px 6px;
      margin: 0 5px;
      border-radius: 4px;
      color: white;
      font-weight: bold;
    }

    .legend .today {
      background: #d10000;
    }

    .legend .holiday {
      background: #00cc66;
    }

    .legend .note {
      background: #ffeb3b;
      color: black;
    }
  </style>
</head>
<body>
  <h1>ErikAI Kalendár</h1>
  <div class="controls">
    <button onclick="changeYear(-1)">◀ Rok späť</button>
    <span id="yearDisplay"></span>
    <button onclick="changeYear(1)">Rok vpred ▶</button>
  </div>

  <div id="calendar" class="calendar"></div>

  <div class="legend">
    <strong>Legenda:</strong>
    <span class="today">Dnes</span>
    <span class="holiday">Sviatok</span>
    <span class="note">Udalosť</span>
  </div>

  <p id="cas" style="margin-top: 15px; font-weight: bold;"></p>

  <script>
    const holidays = {
      "1.1": "Nový rok",
      "6.1": "Zjavenie Pána",
      "1.5": "Sviatok práce",
      "8.5": "Deň víťazstva nad fašizmom",
      "5.7": "Cyril a Metod",
      "29.8": "Výročie SNP",
      "1.9": "Deň Ústavy",
      "15.9": "Sedembolestná Panna Mária",
      "1.11": "Sviatok všetkých svätých",
      "17.11": "Deň boja za slobodu",
      "24.12": "Štedrý deň",
      "25.12": "1. sviatok vianočný",
      "26.12": "2. sviatok vianočný"
    };

    const daysShort = ["Po", "Ut", "St", "Št", "Pi", "So", "Ne"];
    const monthNames = ["Január", "Február", "Marec", "Apríl", "Máj", "Jún", "Júl", "August", "September", "Október", "November", "December"];
    let currentYear = new Date().getFullYear();

    function renderCalendar(year) {
      document.getElementById("calendar").innerHTML = "";
      document.getElementById("yearDisplay").textContent = year;
      const today = new Date();

      for (let m = 0; m < 12; m++) {
        const month = document.createElement("div");
        month.className = "month";

        const h3 = document.createElement("h3");
        h3.textContent = monthNames[m];
        month.appendChild(h3);

        const daysDiv = document.createElement("div");
        daysDiv.className = "days";

        for (let i = 0; i < 7; i++) {
          const dow = document.createElement("div");
          dow.className = "dow";
          dow.textContent = daysShort[i];
          daysDiv.appendChild(dow);
        }

        const firstDay = new Date(year, m, 1);
        let startDay = (firstDay.getDay() + 6) % 7;

        for (let i = 0; i < startDay; i++) {
          daysDiv.appendChild(document.createElement("div"));
        }

        const totalDays = new Date(year, m + 1, 0).getDate();

        for (let d = 1; d <= totalDays; d++) {
          const dateKey = `${d}.${m+1}`;
          const div = document.createElement("div");
          div.className = "day";
          div.textContent = d;

          const dateId = `${year}-${m+1}-${d}`;
          const note = localStorage.getItem(dateId);
          if (note) div.classList.add("note");

          if (holidays[dateKey]) {
            div.classList.add("holiday");
            div.title = holidays[dateKey];
          }

          if (
            d === today.getDate() &&
            m === today.getMonth() &&
            year === today.getFullYear()
          ) {
            div.classList.add("today");
          }

          div.onclick = () => {
            const text = prompt(`Pridať poznámku na ${d}.${m+1}.${year}:`, note || "");
            if (text) {
              localStorage.setItem(dateId, text);
              div.classList.add("note");
            } else {
              localStorage.removeItem(dateId);
              div.classList.remove("note");
            }
          };

          daysDiv.appendChild(div);
        }

        month.appendChild(daysDiv);
        document.getElementById("calendar").appendChild(month);
      }
    }

    function changeYear(offset) {
      currentYear += offset;
      renderCalendar(currentYear);
    }

    renderCalendar(currentYear);
  </script>

  <button onclick="toggleTheme()">🌓 Zmeniť režim</button>
  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }
  </script>

  <style>
    body.dark-mode {
      background-color: #121212;
      color: white;
    }
  </style>

  <p id="cas" style="font-size: 18px;"></p>
  <script>
    function aktualizujCas() {
      const teraz = new Date();
      const moznosti = {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      };
      const casText = teraz.toLocaleDateString('sk-SK', moznosti);
      document.getElementById('cas').innerText = `🕓 Aktuálny čas: ${casText}`;
    }
    setInterval(aktualizujCas, 1000);
    aktualizujCas();
  </script>

</body>
</html>
