<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zmena Pozadia</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: hsl(180, 70%, 50%);
      transition: background-color 0.2s ease;
    }

    .container {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
      font-size: 24px;
    }

    .section {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #555;
    }

    /* Posuvník (Slider) */
    .slider {
      -webkit-appearance: none;
      width: 100%;
      height: 15px;
      border-radius: 10px;
      background: linear-gradient(
        to right,
        hsl(0, 70%, 50%),
        hsl(60, 70%, 50%),
        hsl(120, 70%, 50%),
        hsl(180, 70%, 50%),
        hsl(240, 70%, 50%),
        hsl(300, 70%, 50%),
        hsl(360, 70%, 50%)
      );
      outline: none;
      cursor: pointer;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #333;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    /* Tlačidlá farieb */
    .color-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .btn:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    /* Vlastný výber farby */
    .color-picker-input {
      width: 60px;
      height: 40px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: none;
    }

    .color-code {
      margin-top: 15px;
      font-size: 14px;
      color: #666;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Menič Pozadia</h1>

    <!-- Posuvník -->
    <div class="section">
      <label for="hueSlider">Posuvník odtieňov:</label>
      <input type="range" min="0" max="360" value="180" class="slider" id="hueSlider">
    </div>

    <!-- Tlačidlá s farbami -->
    <div class="section">
      <label>Rýchly výber:</label>
      <div class="color-buttons">
        <button class="btn" style="background-color: #ff4757;" onclick="changeColor('#ff4757')">Červená</button>
        <button class="btn" style="background-color: #2ed573;" onclick="changeColor('#2ed573')">Zelená</button>
        <button class="btn" style="background-color: #1e90ff;" onclick="changeColor('#1e90ff')">Modrá</button>
        <button class="btn" style="background-color: #ffa502;" onclick="changeColor('#ffa502')">Oranžová</button>
      </div>
    </div>

    <!-- Vlastný farebný pipetkový výber -->
    <div class="section">
      <label for="customColor">Presná farba:</label>
      <input type="color" id="customColor" class="color-picker-input" value="#00d2d3">
    </div>

    <div class="color-code" id="colorText">Aktuálna farba: hsl(180, 70%, 50%)</div>
  </div>

  <script>
    const slider = document.getElementById('hueSlider');
    const customPicker = document.getElementById('customColor');
    const colorText = document.getElementById('colorText');

    // Funkcia pre zmenu z posuvníka (HSL spektrum)
    slider.addEventListener('input', function() {
      const hue = this.value;
      const color = `hsl(${hue}, 70%, 50%)`;
      document.body.style.backgroundColor = color;
      colorText.textContent = `Aktuálna farba: ${color}`;
    });

    // Funkcia pre zmenu z rýchlych tlačidiel
    function changeColor(hexColor) {
      document.body.style.backgroundColor = hexColor;
      customPicker.value = hexColor;
      colorText.textContent = `Aktuálna farba: ${hexColor}`;
    }

    // Funkcia pre presný výber z vlastnej palety
    customPicker.addEventListener('input', function() {
      const hexColor = this.value;
      document.body.style.backgroundColor = hexColor;
      colorText.textContent = `Aktuálna farba: ${hexColor}`;
    });
  </script>

</body>
</html>
