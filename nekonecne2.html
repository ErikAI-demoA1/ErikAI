<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ErikAI OS 2026 - Nekonečné čísla a text</title>
<style>
  body{
    margin:0;
    font-family: monospace;
    background: #061426;
    color: #e6f6ff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    overflow:hidden;
  }
  #number{
    font-size: 64px;
    font-weight: bold;
    margin-bottom: 40px;
    transition: color 0.2s;
  }
  #canvas{
    width: 90vw;
    height: 200px;
    background: #041426;
    border:1px solid rgba(255,255,255,0.1);
  }
  button{
    padding:10px 20px;
    font-size:16px;
    border:none;
    border-radius:8px;
    background: #06b6d4;
    color:#021;
    cursor:pointer;
    margin-top:20px;
  }
</style>
</head>
<body>

<div id="number">0</div>
<canvas id="canvas"></canvas>
<button id="startBtn">Štart</button>

<script>
const numberEl = document.getElementById('number');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = canvas.clientWidth;
canvas.height = canvas.clientHeight;

let value = parseInt(localStorage.getItem('lastValue') || '0');
let interval = 1000;
let running = false;

const text = "ErikAI OS 2026";
let letters = []; // každé písmeno má svoje body
for(let i=0;i<text.length;i++){
  letters.push({dots: [], done:false});
}

function getRandomColor(){
  return 'hsl(' + Math.floor(Math.random()*360) + ',70%,60%)';
}

function drawTextEffect(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.font = '32px monospace';
  for(let i=0;i<letters.length;i++){
    const letter = letters[i];
    const x = 20 + i*40;
    const y = canvas.height/2;
    // vykresli všetky čiarky pre toto písmeno
    letter.dots.forEach(d=>{
      ctx.fillStyle = d.color;
      ctx.fillText(d.char, x, y - 50 + d.offset);
    });
  }
}

function addDotToLetter(idx){
  if(idx >= letters.length) return;
  const letter = letters[idx];
  if(letter.done) return;
  const offset = Math.random()*50; // náhodný posun čiarky
  letter.dots.push({char: text[idx], offset:offset, color:getRandomColor()});
  if(letter.dots.length > 20 && idx < letters.length-1){ // až 20 čiark pre jedno písmeno
    letter.done = true;
  }
}

function step(){
  if(!running) return;
  value++;
  numberEl.textContent = value;
  numberEl.style.color = getRandomColor();
  localStorage.setItem('lastValue', value);

  // pridaj čiarky postupne
  for(let i=0;i<letters.length-1;i++){ // posledné písmeno nikdy nebude dokončené
    if(Math.random()<0.3) addDotToLetter(i);
  }

  drawTextEffect();

  interval = Math.max(50, interval * 0.95); // zrýchlenie
  setTimeout(step, interval);
}

document.getElementById('startBtn').addEventListener('click', ()=>{
  if(!running){
    running = true;
    step();
  }
});
</script>

</body>
</html>
