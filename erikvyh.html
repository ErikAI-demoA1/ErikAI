<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI TV Režim - Vyhľadávanie</title>
<style>
  body { font-family: Arial; margin:0; padding:0; background:#000; color:#fff; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  h1 { margin:20px; color:#1a73e8; }
  input, select { width:80%; padding:10px; font-size:16px; border-radius:8px; border:none; margin-bottom:10px; }
  button { padding:10px 20px; font-size:16px; border:none; border-radius:8px; background:#1a73e8; color:#fff; cursor:pointer; margin-bottom:20px; }
  button:hover { background:#1558a5; }
  #results { width:90%; max-width:1200px; display:flex; flex-direction:column; gap:12px; }
  .item { padding:10px; border:1px solid #333; border-radius:8px; display:flex; align-items:center; gap:12px; }
  .item img { width:120px; height:70px; object-fit:cover; border-radius:6px; }
  .item div { flex:1; }
  .item button { background:#10b981; }
</style>
</head>
<body>

<h1>📺 ErikAI TV Režim - Vyhľadávanie</h1>

<input type="text" id="queryInput" placeholder="Napíš čo chceš hľadať">
<select id="sourceSelect">
  <option value="youtube">YouTube</option>
  <option value="vimeo">Vimeo</option>
  <option value="google">Google</option>
</select>
<button onclick="search()">🔍 Vyhľadať</button>

<div id="results"></div>

<script>
async function search() {
  const query = document.getElementById('queryInput').value.trim();
  const source = document.getElementById('sourceSelect').value;
  const results = document.getElementById('results');
  results.innerHTML = '';

  if(!query) { alert('Zadaj hľadaný výraz'); return; }

  if(source === 'google') {
    // Otvorí Google search v novom okne
    const url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
    window.open(url,'_blank');
    return;
  }

  if(source === 'youtube') {
    // Demo: bez API - použijeme vyhľadanie cez "YouTube search link" a iframe pre prvý výsledok
    const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
    // Použijeme iframe priamo s prvým výsledkom (demo, presný ID by vyžadovalo API)
    results.innerHTML = `<p>Pre prehratie presného videa by bolo potrebné YouTube Data API. Otvorenie YouTube search:</p>
      <a href="${searchUrl}" target="_blank">Otvoriť YouTube vyhľadávanie pre "${query}"</a>`;
    return;
  }

  if(source === 'vimeo') {
    // Demo: otvorenie Vimeo search
    const searchUrl = `https://vimeo.com/search?q=${encodeURIComponent(query)}`;
    results.innerHTML = `<p>Otvorenie Vimeo vyhľadávania:</p>
      <a href="${searchUrl}" target="_blank">Otvoriť Vimeo vyhľadávanie pre "${query}"</a>`;
    return;
  }
}
</script>

</body>
</html>
