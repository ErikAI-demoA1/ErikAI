<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI TV Režim - iframe demo</title>
<style>
body { font-family: Arial; margin:0; padding:0; background:#000; color:#fff; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
h1 { margin:20px; color:#1a73e8; }
input, select { width:80%; padding:10px; font-size:16px; border-radius:8px; border:none; margin-bottom:10px; }
button { padding:10px 20px; font-size:16px; border:none; border-radius:8px; background:#1a73e8; color:#fff; cursor:pointer; margin-bottom:20px; }
button:hover { background:#1558a5; }
#videoContainer { width:90%; max-width:1200px; height:600px; display:flex; justify-content:center; align-items:center; }
iframe { width:100%; height:100%; border:none; border-radius:12px; }
</style>
</head>
<body>

<h1>📺 ErikAI TV Režim - iframe demo</h1>

<input type="text" id="queryInput" placeholder="Napíš čo chceš hľadať">
<select id="sourceSelect">
  <option value="youtube">YouTube</option>
  <option value="vimeo">Vimeo</option>
</select>
<button onclick="search()">🔍 Vyhľadať</button>

<div id="videoContainer">
  <p>Tu sa zobrazí video...</p>
</div>

<script>
function search() {
  const query = document.getElementById('queryInput').value.trim();
  const source = document.getElementById('sourceSelect').value;
  const container = document.getElementById('videoContainer');
  container.innerHTML = '';

  if(!query){ container.innerHTML = '<p>Zadaj hľadaný výraz!</p>'; return; }

  if(source === 'youtube'){
    // Demo: vložíme prvý video ID (tu môžeme neskôr automatizovať cez API)
    const demoID = 'dQw4w9WgXcQ'; // príklad video ID
    container.innerHTML = `<iframe src="https://www.youtube.com/embed/${demoID}" allowfullscreen></iframe>`;
    return;
  }

  if(source === 'vimeo'){
    const demoID = '76979871'; // príklad Vimeo video ID
    container.innerHTML = `<iframe src="https://player.vimeo.com/video/${demoID}" allowfullscreen></iframe>`;
    return;
  }
}
</script>

</body>
</html>
