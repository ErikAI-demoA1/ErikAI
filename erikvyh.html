<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI Iframe Prehliadač</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0; padding: 0;
    background: #000;
    color: #fff;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
  }
  h1 { margin: 20px; color: #1a73e8; }
  input, button { padding: 10px; font-size: 16px; border-radius: 8px; border: none; margin: 5px; }
  button { background-color: #1a73e8; color: #fff; cursor: pointer; }
  button:hover { background-color: #1558a5; }
  #iframeContainer { width: 90%; flex: 1; margin-top: 10px; }
  iframe { width: 100%; height: 600px; border-radius: 12px; border: none; }
</style>
</head>
<body>

<h1>🌐 ErikAI Iframe Prehliadač</h1>

<input type="text" id="urlInput" placeholder="Vlož odkaz sem" style="width:60%;" value="https://html.duckduckgo.com/html/">
<button onclick="loadIframe()">▶️ Načítať</button>

<div id="iframeContainer">
  <iframe id="myIframe" src="https://html.duckduckgo.com/html/"></iframe>
</div>

<script>
function loadIframe() {
  const url = document.getElementById('urlInput').value.trim();
  const iframe = document.getElementById('myIframe');
  if(!url) return;
  iframe.src = url;
}
</script>

</body>
</html>
