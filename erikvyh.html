<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI Vyhľadávač</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0; padding: 0;
    background: #000;
    color: #fff;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
  }
  h1 { margin: 20px; color: #1a73e8; }
  select, input, button {
    padding: 10px; font-size: 16px; border-radius: 8px; border: none; margin: 5px;
  }
  button { background-color: #1a73e8; color: #fff; cursor: pointer; }
  button:hover { background-color: #1558a5; }
  #iframeContainer { width: 90%; flex: 1; margin-top: 10px; }
  iframe { width: 100%; height: 600px; border-radius: 12px; border: none; }
</style>
</head>
<body>

<h1>🔍 ErikAI Vyhľadávač</h1>

<select id="searchEngine">
  <option value="https://html.duckduckgo.com/html/">DuckDuckGo</option>
  <option value="https://lite.qwant.com/">Qwant</option>
</select>

<input type="text" id="searchInput" placeholder="Zadaj hľadaný výraz" style="width:60%;">
<button onclick="search()">▶️ Vyhľadať</button>

<div id="iframeContainer">
  <iframe id="searchFrame" src="https://html.duckduckgo.com/html/"></iframe>
</div>

<script>
function search() {
  const engine = document.getElementById('searchEngine').value;
  const query = encodeURIComponent(document.getElementById('searchInput').value.trim());
  const iframe = document.getElementById('searchFrame');

  if(!query) {
    iframe.src = engine; // iba otvorí hlavnú stránku
  } else {
    if(engine.includes("duckduckgo")) {
      iframe.src = `${engine}?q=${query}`;
    } else if(engine.includes("qwant")) {
      iframe.src = `${engine}/?q=${query}`;
    } else {
      iframe.src = engine;
    }
  }
}
</script>

</body>
</html>
