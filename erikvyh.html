<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI Vyhľadávač v iframe</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0; padding: 0;
    background: #111;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
  }
  h1 { margin: 20px; color: #1a73e8; }
  select, input, button {
    padding: 10px;
    margin: 5px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
  }
  button {
    background-color: #1a73e8;
    color: white;
    cursor: pointer;
  }
  button:hover { background-color: #1558a5; }
  iframe {
    flex: 1;
    width: 90%;
    border: none;
    border-radius: 12px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<h1>ErikAI Vyhľadávač v iframe</h1>

<select id="searchEngine">
  <option value="https://duckduckgo.com">DuckDuckGo</option>
  <option value="https://www.qwant.com">Qwant</option>
  <option value="https://startpage.com">Startpage</option>
</select>
<input type="text" id="searchQuery" placeholder="Napíš, čo chceš vyhľadať">
<button onclick="search()">🔍 Vyhľadať</button>

<iframe id="searchFrame" src=""></iframe>

<script>
function search() {
  const engine = document.getElementById('searchEngine').value;
  const query = encodeURIComponent(document.getElementById('searchQuery').value.trim());
  const iframe = document.getElementById('searchFrame');

  if(!query) {
    alert("Zadaj, čo chceš vyhľadať!");
    return;
  }

  // URL vyhľadávania podľa vybraného vyhľadávača
  let url = "";
  if(engine.includes("duckduckgo")) url = `${engine}/?q=${query}`;
  else if(engine.includes("qwant")) url = `${engine}/?q=${query}`;
  else if(engine.includes("startpage")) url = `${engine}/do/search?q=${query}`;
  
  iframe.src = url;
}
</script>

</body>
</html>
