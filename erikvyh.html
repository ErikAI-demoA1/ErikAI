<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI Vyhľadávač</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    margin: 0;
    padding: 20px;
  }
  h1 { color: #1a73e8; }
  input, select, button {
    font-size: 16px;
    padding: 10px;
    margin: 5px;
    border-radius: 6px;
    border: none;
  }
  button {
    background-color: #1a73e8;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background-color: #1558a5; }
  #searchFrame {
    margin-top: 20px;
    width: 90%;
    flex: 1;
    border: 2px solid #1a73e8;
    border-radius: 10px;
  }
</style>
</head>
<body>

<h1>🔍 ErikAI Vyhľadávač</h1>

<input type="text" id="searchInput" placeholder="Zadaj hľadaný výraz">
<select id="searchEngine">
  <option value="duckduckgo">DuckDuckGo</option>
  <option value="startpage">Startpage</option>
</select>
<button onclick="search()">Hľadať</button>

<iframe id="searchFrame"></iframe>

<script>
function search() {
  const query = encodeURIComponent(document.getElementById('searchInput').value.trim());
  const engine = document.getElementById('searchEngine').value;
  const frame = document.getElementById('searchFrame');

  if(!query){
    alert("Zadaj prosím hľadaný výraz!");
    return;
  }

  let url = "";
  if(engine === "duckduckgo"){
    url = `https://duckduckgo.com/?q=${query}&t=h_&ia=web`;
  } else if(engine === "startpage"){
    url = `https://www.startpage.com/sp/search?q=${query}`;
  }

  frame.src = url;
}
</script>

</body>
</html>
