<style>
  /* --- Reset a základ --- */
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: #0b0b0b; color: #fff; overflow: hidden; }

  /* --- Iframe plná obrazovka --- */
  #contentFrame { position: absolute; top:0; left:0; width:100%; height:100%; border:none; }

  /* --- Menu ikony --- */
  .menuIcon {
    position: fixed;
    top: 15px;
    width: 55px; height: 55px;
    background: linear-gradient(135deg,#ff7f50,#ff4500);
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 18px rgba(255,69,0,0.8);
    transition: transform 0.3s, box-shadow 0.3s;
    z-index: 1000;
  }
  .menuIcon:hover { transform: scale(1.1); box-shadow: 0 0 28px rgba(255,140,0,0.9); }
  #menuLeft { left: 20px; }
  #menuRight { right: 20px; }
  .menuIcon::before { content: "≡"; font-size: 28px; font-weight: bold; }

  /* --- Dropdown menu --- */
  .dropdown {
    position: fixed;
    top: 75px; 
    background: rgba(20,20,20,0.98);
    border: 1px solid #ff4500;
    border-radius: 12px;
    max-height: 80vh;
    overflow-y: auto;
    display: none;
    z-index: 1000;
    padding: 12px;
    min-width: 200px;
  }
  .dropdown a {
    display: block;
    color: #fff;
    padding: 8px 12px;
    text-decoration: none;
    border-radius: 6px;
    transition: background 0.2s;
    font-weight: 500;
  }
  .dropdown a:hover {
    background: rgba(255,69,0,0.5);
  }
  #dropdownLeft { left: 20px; }
  #dropdownRight { right: 20px; }
</style>
</head>

function populateDropdown(dropdown){
  dropdown.innerHTML = "";
  htmlFiles.forEach(item=>{
    const a = document.createElement('a');
    a.href = "#";
    a.textContent = item.name; // zobrazovaný názov
    a.addEventListener('click', e=>{
      e.preventDefault();
      document.getElementById('contentFrame').src = "https://rawcdn.githack.com/ErikAI-demoA1/ErikAI/main/"+item.file;
    });
    dropdown.appendChild(a);
  });
}

const menuLeft = document.getElementById('menuLeft');
const menuRight = document.getElementById('menuRight');
const dropdownLeft = document.getElementById('dropdownLeft');
const dropdownRight = document.getElementById('dropdownRight');

menuLeft.addEventListener('click', ()=>{ dropdownLeft.style.display = dropdownLeft.style.display==='block' ? 'none':'block'; });
menuRight.addEventListener('click', ()=>{ dropdownRight.style.display = dropdownRight.style.display==='block' ? 'none':'block'; });
