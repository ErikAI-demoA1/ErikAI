<style>
  :root {
    --bg-dark: #07090e;
    --accent-orange: #ff5500;
    --accent-glow: rgba(255, 85, 0, 0.4);
    --panel-bg: rgba(18, 24, 38, 0.85);
    --border-color: rgba(255, 255, 255, 0.12);
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
  }

  /* --- Reset a Základ --- */
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
  body { background: var(--bg-dark); color: var(--text-primary); overflow: hidden; height: 100vh; width: 100vw; }

  /* --- Ambientné Pozadie --- */
  .ambient-glow {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;
  }

  /* --- Úvodný Splash Screen (keď nie je načítaný iframe) --- */
  #welcomeScreen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1;
    text-align: center;
    padding: 20px;
  }
  #welcomeScreen h1 {
    font-size: 2.8rem;
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff 40%, var(--accent-orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
  }
  #welcomeScreen p {
    color: var(--text-secondary);
    font-size: 1.1rem;
    max-width: 500px;
    line-height: 1.6;
  }

  /* --- Iframe Plná Obrazovka --- */
  #contentFrame { 
    position: absolute; 
    top: 0; left: 0; 
    width: 100%; height: 100%; 
    border: none; 
    z-index: 2;
    background: transparent;
  }

  /* --- Horná Lišta Statusov & Indikátor --- */
  .top-bar {
    position: fixed;
    top: 15px; left: 50%;
    transform: translateX(-50%);
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    backdrop-filter: blur(16px);
    border-radius: 30px;
    padding: 6px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 999;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .active-app-tag {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--accent-orange);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .active-app-tag::before {
    content: '';
    width: 8px; height: 8px;
    background: var(--accent-orange);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent-orange);
  }

  /* --- Menu Ikony --- */
  .menuIcon {
    position: fixed;
    top: 15px;
    width: 50px; height: 50px;
    background: linear-gradient(135deg, #ff6b35, #ff3300);
    border-radius: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(255, 51, 0, 0.5);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1000;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .menuIcon:hover { 
    transform: translateY(-2px) scale(1.05); 
    box-shadow: 0 6px 28px rgba(255, 85, 0, 0.8); 
  }
  #menuLeft { left: 20px; }
  #menuRight { right: 20px; }
  .menuIcon::before { content: "⚡"; font-size: 22px; color: #fff; }

  /* --- Dropdown Menu --- */
  .dropdown {
    position: fixed;
    top: 75px; 
    background: rgba(11, 15, 25, 0.95);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    max-height: 75vh;
    width: 280px;
    overflow-y: auto;
    display: none;
    z-index: 1000;
    padding: 12px;
    backdrop-filter: blur(20px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.7);
  }
  
  .dropdown-search {
    width: 100%;
    padding: 10px 14px;
    margin-bottom: 10px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-size: 0.85rem;
    outline: none;
  }
  .dropdown-search:focus {
    border-color: var(--accent-orange);
  }

  .dropdown-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .dropdown a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--text-primary);
    padding: 10px 12px;
    text-decoration: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 500;
    transition: all 0.2s;
  }
  .dropdown a:hover {
    background: rgba(255, 85, 0, 0.2);
    color: #fff;
    padding-left: 16px;
  }
  #dropdownLeft { left: 20px; }
  #dropdownRight { right: 20px; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }

function populateDropdown(dropdown){
  const listContainer = dropdown.querySelector('.dropdown-list');
  listContainer.innerHTML = "";
  htmlFiles.forEach(item => {
    const a = document.createElement('a');
    a.href = "#";
    a.textContent = item.name;
    a.setAttribute('data-file', item.file);
    a.addEventListener('click', e => {
      e.preventDefault();
      document.getElementById('welcomeScreen').style.display = 'none';
      document.getElementById('contentFrame').src = "https://rawcdn.githack.com/ErikAI-demoA1/ErikAI/main/" + item.file;
      document.getElementById('appTag').textContent = item.name;
      dropdownLeft.style.display = 'none';
      dropdownRight.style.display = 'none';
    });
    listContainer.appendChild(a);
  });
}

function filterMenu(input) {
  const filter = input.value.toLowerCase();
  const list = input.nextElementSibling;
  const items = list.getElementsByTagName('a');
  for (let i = 0; i < items.length; i++) {
    const text = items[i].textContent || items[i].innerText;
    items[i].style.display = text.toLowerCase().indexOf(filter) > -1 ? "flex" : "none";
  }
}

const menuLeft = document.getElementById('menuLeft');
const menuRight = document.getElementById('menuRight');
const dropdownLeft = document.getElementById('dropdownLeft');
const dropdownRight = document.getElementById('dropdownRight');

menuLeft.addEventListener('click', () => { 
  dropdownRight.style.display = 'none';
  dropdownLeft.style.display = dropdownLeft.style.display === 'block' ? 'none' : 'block'; 
});

menuRight.addEventListener('click', () => { 
  dropdownLeft.style.display = 'none';
  dropdownRight.style.display = dropdownRight.style.display === 'block' ? 'none' : 'block'; 
});

populateDropdown(dropdownLeft);
populateDropdown(dropdownRight);
