    cursor:pointer; font-weight:bold; transition:0.2s;

  .menu button:hover { background:#ffdd00; color:#000; }

  /* --- iframe styles --- */
  #contentFrame {
    position:absolute; top:60px; bottom:0; left:0; right:0;
    width:100%; height:calc(100% - 60px); border:none; background:#111;

  @media(max-width:600px){
    .menu { flex-wrap:wrap; justify-content:center; top:auto; bottom:0; border-radius:10px 10px 0 0; }

/* === Vytvorenie menu dynamicky === */
function createMenu(menuId){
  const menu = document.getElementById(menuId);

    btn.addEventListener('click', ()=>{ document.getElementById('contentFrame').src = p.file; });
