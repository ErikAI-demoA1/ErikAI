<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ErikAI Scan</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b10;color:#fff;font:15px Arial,sans-serif}
header{padding:16px;text-align:center;border-bottom:1px solid #202631}
h1{margin:0;font-size:24px}small{color:#8993a3}
main{max-width:900px;margin:auto;padding:15px}
.box{background:#10151d;border:1px solid #252d39;border-radius:15px;padding:12px;margin-bottom:12px}
video,img,canvas{width:100%;max-height:65vh;object-fit:contain;background:#05070a;border-radius:10px}
video{display:block}
.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
button,label{background:#171e28;color:#fff;border:1px solid #303a48;border-radius:9px;padding:10px 13px;cursor:pointer}
button:hover,label:hover{background:#202936}
.active{background:#286cff;border-color:#286cff}
input{display:none}
#scan{background:#286cff;border-color:#286cff;font-weight:bold}
#out{display:none}
.info{color:#9ba6b5;font-size:13px}
</style>
</head>
<body>

<header>
<h1>ERIKAI SCAN</h1>
<small>Inteligentný skener dokumentov</small>
</header>

<main>

<div class="box">
<video id="cam" autoplay playsinline></video>
<canvas id="src" hidden></canvas>

<div class="row">
<button id="start">📷 Kamera</button>
<button id="flip">🔄 Otočiť kameru</button>
<label>🖼️ Fotka<input id="file" type="file" accept="image/*"></label>
<button id="scan">📄 Skenovať</button>
<button id="reset">↩️ Reset</button>
</div>
</div>

<div class="box">
<b>Formát</b>
<div class="row" id="formats">
<button data-v="AUTO" class="active">AUTO</button>
<button data-v="A4">A4</button>
<button data-v="A5">A5</button>
<button data-v="A3">A3</button>
</div>

<b>Režim</b>
<div class="row" id="modes">
<button data-v="auto" class="active">AUTO</button>
<button data-v="original">ORIGINÁL</button>
<button data-v="document">DOKUMENT</button>
<button data-v="bw">ČB</button>
</div>
</div>

<div class="box">
<canvas id="out"></canvas>
<div class="row">
<button onclick="savePNG()">PNG</button>
<button onclick="savePDF()">PDF</button>
<button onclick="saveWord()">Word</button>
<button onclick="saveHTML()">HTML</button>
</div>
<p id="info" class="info">Pripravené na skenovanie.</p>
</div>

</main>

<script>
const $=id=>document.getElementById(id),
cam=$('cam'),src=$('src'),out=$('out'),info=$('info');
let stream=null,facing='environment',img=null,format='AUTO',mode='auto';

async function camera(){
 if(stream)stream.getTracks().forEach(t=>t.stop());
 try{
  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:{ideal:facing}},audio:false
  });
  cam.srcObject=stream;
 }catch(e){info.textContent='Kamera nie je dostupná.'}
}
camera();

$('start').onclick=camera;
$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';camera()};
$('file').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 img=new Image();
 img.onload=()=>{draw(img);info.textContent='Obrázok načítaný.'};
 img.src=URL.createObjectURL(f);
};

function group(id,fn){
 $(id).onclick=e=>{
  if(e.target.tagName!=='BUTTON')return;
  [...$(id).children].forEach(x=>x.classList.remove('active'));
  e.target.classList.add('active');fn(e.target.dataset.v);
 };
}
group('formats',v=>format=v);
group('modes',v=>mode=v);

$('scan').onclick=()=>{
 if(cam.srcObject){
  src.width=cam.videoWidth;src.height=cam.videoHeight;
  src.getContext('2d').drawImage(cam,0,0);
  draw(scanPaper(src));
 }else if(img)draw(scanPaper(img));
 else info.textContent='Najprv odfoť alebo nahraj dokument.';
};

/* VYLEPŠENÁ DETEKCIA DOKUMENTU */
function scanPaper(x){
 const w=x.videoWidth||x.naturalWidth||x.width,
 h=x.videoHeight||x.naturalHeight||x.height,
 max=900,r=Math.min(max/w,max/h,1),
 W=Math.round(w*r),H=Math.round(h*r);

 const c=document.createElement('canvas'),g=c.getContext('2d');
 c.width=W;c.height=H;
 g.drawImage(x,0,0,W,H);

 const d=g.getImageData(0,0,W,H).data;
 const gray=new Uint8Array(W*H);

 for(let y=0;y<H;y+=2){
  for(let xx=0;xx<W;xx+=2){
   const i=(y*W+xx)*4;
   gray[y*W+xx]=d[i]*.299+d[i+1]*.587+d[i+2]*.114;
  }
 }

 /* hľadanie výrazných hrán */
 const edges=[];
 for(let y=2;y<H-2;y+=3){
  for(let xx=2;xx<W-2;xx+=3){
   const i=y*W+xx;
   const gx=Math.abs(gray[i+3]-gray[i-3]);
   const gy=Math.abs(gray[i+3*W]-gray[i-3*W]);

   if(gx+gy>45)edges.push({x:xx,y});
  }
 }

 if(edges.length<100)return x;

 /*
  * Hľadanie najvzdialenejších bodov v jednotlivých
  * rohoch obrazu.
  */
 const cx=W/2,cy=H/2;
 let tl=null,tr=null,br=null,bl=null;

 for(const p of edges){
  const dx=p.x-cx,dy=p.y-cy;

  if(dx<0&&dy<0){
   if(!tl||dx*dx+dy*dy>tl.s)tl={...p,s:dx*dx+dy*dy};
  }
  if(dx>0&&dy<0){
   if(!tr||dx*dx+dy*dy>tr.s)tr={...p,s:dx*dx+dy*dy};
  }
  if(dx>0&&dy>0){
   if(!br||dx*dx+dy*dy>br.s)br={...p,s:dx*dx+dy*dy};
  }
  if(dx<0&&dy>0){
   if(!bl||dx*dx+dy*dy>bl.s)bl={...p,s:dx*dx+dy*dy};
  }
 }

 if(!tl||!tr||!br||!bl)return x;

 /* kontrola veľkosti nájdeného dokumentu */
 const area=Math.abs(
  tl.x*(tr.y-br.y)+
  tr.x*(br.y-bl.y)+
  br.x*(bl.y-tl.y)+
  bl.x*(tl.y-tr.y)
 )/2;

 if(area<W*H*.18)return x;

 /* kontrola, či body dávajú približne štvoruholník */
 const top=Math.hypot(tr.x-tl.x,tr.y-tl.y);
 const bottom=Math.hypot(br.x-bl.x,br.y-bl.y);
 const left=Math.hypot(bl.x-tl.x,bl.y-tl.y);
 const right=Math.hypot(br.x-tr.x,br.y-tr.y);

 if(
  top<W*.25||
  bottom<W*.25||
  left<H*.25||
  right<H*.25||
  Math.max(top,bottom)/Math.min(top,bottom)>2.5||
  Math.max(left,right)/Math.min(left,right)>2.5
 )return x;

 return perspective(x,tl,tr,br,bl);
}

/* VYLEPŠENÉ PERSPEKTÍVNE NAROVNANIE */
function perspective(x,a,b,c,d){
 const w=x.videoWidth||x.naturalWidth||x.width,
 h=x.videoHeight||x.naturalHeight||x.height;

 const W=Math.round(Math.max(
  Math.hypot(b.x-a.x,b.y-a.y),
  Math.hypot(c.x-d.x,c.y-d.y)
 ));

 const H=Math.round(Math.max(
  Math.hypot(d.x-a.x,d.y-a.y),
  Math.hypot(c.x-b.x,c.y-b.y)
 ));

 if(W<100||H<100)return x;

 const src=document.createElement('canvas');
 src.width=w;src.height=h;
 const sg=src.getContext('2d');
 sg.drawImage(x,0,0,w,h);

 const sp=sg.getImageData(0,0,w,h).data;

 const z=document.createElement('canvas');
 z.width=W;z.height=H;
 const q=z.getContext('2d');
 const result=q.createImageData(W,H);
 const rp=result.data;

 for(let y=0;y<H;y++){
  const v=y/(H-1);

  for(let xx=0;xx<W;xx++){
   const u=xx/(W-1);

   /*
    * 4-corner bilineárne mapovanie.
    * Tým sa šikmý papier prevedie na
    * rovný obdĺžnik.
    */
   const px=
    (1-u)*(1-v)*a.x+
    u*(1-v)*b.x+
    u*v*c.x+
    (1-u)*v*d.x;

   const py=
    (1-u)*(1-v)*a.y+
    u*(1-v)*b.y+
    u*v*c.y+
    (1-u)*v*d.y;

   const X=Math.max(0,Math.min(w-1,Math.round(px)));
   const Y=Math.max(0,Math.min(h-1,Math.round(py)));

   const si=(Y*w+X)*4;
   const di=(y*W+xx)*4;

   rp[di]=sp[si];
   rp[di+1]=sp[si+1];
   rp[di+2]=sp[si+2];
   rp[di+3]=255;
  }
 }

 q.putImageData(result,0,0);
 return z;
}

function draw(x){
 const w=x.videoWidth||x.naturalWidth||x.width,h=x.videoHeight||x.naturalHeight||x.height;
 const r=Math.min(1800/w,1800/h,1),W=w*r,H=h*r;
 out.width=W;out.height=H;
 const c=out.getContext('2d');c.drawImage(x,0,0,W,H);
 let d=c.getImageData(0,0,W,H),p=d.data;
 if(mode==='bw'||mode==='document'){
  for(let i=0;i<p.length;i+=4){
   let v=(p[i]*.299+p[i+1]*.587+p[i+2]*.114);
   if(mode==='bw')v=v>145?255:0;
   else v=Math.min(255,Math.max(0,(v-100)*1.8));
   p[i]=p[i+1]=p[i+2]=v;
  }
  c.putImageData(d,0,0);
 }
 out.style.display='block';
 info.textContent=`Sken pripravený • ${format} • ${mode.toUpperCase()} • ${W}×${H}px`;
}

function download(blob,name){
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
}

function savePNG(){
 out.toBlob(b=>download(b,'ErikAI-Scan.png'),'image/png');
}

function saveHTML(){
 const html=`<!doctype html><html><body><h1>ErikAI Scan</h1><img src="${out.toDataURL('image/jpeg',.9)}" style="max-width:100%"></body></html>`;
 download(new Blob([html],{type:'text/html'}),'ErikAI-Scan.html');
}

function saveWord(){
 const html=`<html><body><h1>ErikAI Scan</h1><img src="${out.toDataURL('image/jpeg',.9)}" width="100%"></body></html>`;
 download(new Blob([html],{type:'application/msword'}),'ErikAI-Scan.doc');
}

function savePDF(){
 const data=out.toDataURL('image/jpeg',.9);
 const b64=data.split(',')[1],bin=atob(b64),len=bin.length;
 let a=[],o=0;
 const add=s=>{a.push(s);o+=s.length};
 add('%PDF-1.3\n');
 const pos=[];
 const obj=(n,s)=>{pos[n]=o;add(`${n} 0 obj\n${s}\nendobj\n`)};
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
 obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
 obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im 4 0 R >> >> /Contents 5 0 R >>');
 obj(4,`<< /Type /XObject /Subtype /Image /Width ${out.width} /Height ${out.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${len} >>\nstream\n${bin}\nendstream`);
 const cont=`q\n595 0 0 842 0 0 cm\n/Im Do\nQ`;
 obj(5,`<< /Length ${cont.length} >>\nstream\n${cont}\nendstream`);
 const xx=o;add(`xref\n0 6\n0000000000 65535 f \n`);
 for(let i=1;i<6;i++)add(String(pos[i]).padStart(10,'0')+' 00000 n \n');
 add(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xx}\n%%EOF`);
 download(new Blob([a.join('')],{type:'application/pdf'}),'ErikAI-Scan.pdf');
}

$('reset').onclick=()=>{
 out.style.display='none';img=null;
 info.textContent='Pripravené na skenovanie.';
 $('file').value='';
};
</script>

</body>
</html>
