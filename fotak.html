<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📷 ErikAI Kamera Pro+</title>
<meta name="description" content="ErikAI Kamera Pro+ – webová kamera so záznamom, filtrami a zoomom.">
<meta name="author" content="Erik Mohylák">
<style>
  /* ------------------------- STYLING ------------------------- */
  body {
    font-family: 'Inter', Arial, sans-serif;
    margin: 0; padding: 20px;
    background: #f4f4f4; color: #222;
    text-align: center;
    transition: background 0.3s, color 0.3s;
  }
  body.dark-mode { background: #121212; color: white; }

  h1 { color: #d40000; margin-bottom: 10px; }

  video, canvas, img { 
    width: 90%; max-width: 400px; border-radius: 12px;
    border: 2px solid #d40000; margin: 10px 0;
  }

  .buttons, .zoom-controls { 
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 10px 0; 
  }

  button {
    padding: 10px 15px; font-size: 16px;
    background: #d40000; color: white; border: none; border-radius: 8px; cursor: pointer;
    transition: background 0.3s;
  }
  button:hover { background: #a80000; }
  .filter-btn { background: #1a73e8; }
  .filter-btn:hover { background: #1558a5; }

  .history { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
  .history img, .history video { width: 120px; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; }

  .zoom-controls label { font-weight: bold; }
  input[type="range"] { width: 200px; }

  #banner {
    display: none;
    margin: 15px auto;
    max-width: 400px;
    padding: 12px;
    border-radius: 6px;
    font-weight: 600;
    color: white;
    background: #d40000;
  }

  footer { font-size: 14px; color: gray; margin-top: 30px; }
</style>
</head>
<body>

<h1>📷 ErikAI Kamera Pro+</h1>
<button onclick="toggleTheme()">🌓 Zmeniť režim</button>

<div id="banner"></div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none;"></canvas>
<img id="photo" src="" alt="Fotka">

<div class="buttons">
  <button onclick="takePhoto()">📸 Odfotiť</button>
  <button onclick="downloadPhoto()">💾 Stiahnuť</button>
  <button onclick="startRecording()">🎬 Nahrať</button>
  <button onclick="stopRecording()">🛑 Stop</button>
  <button onclick="downloadVideo()">📥 Stiahnuť video</button>
  <button onclick="switchCamera()">🔄 Prepnúť kameru</button>
</div>

<div class="buttons">
  <button class="filter-btn" onclick="applyFilter('none')">🔳 Žiadny</button>
  <button class="filter-btn" onclick="applyFilter('grayscale(100%)')">⚫ B&W</button>
  <button class="filter-btn" onclick="applyFilter('sepia(100%)')">🟤 Sepia</button>
  <button class="filter-btn" onclick="applyFilter('invert(100%)')">🔄 Invert</button>
</div>

<label for="timer">⏱ Časovač:</label>
<select id="timer">
  <option value="0">Bez</option>
  <option value="3">3s</option>
  <option value="5">5s</option>
  <option value="10">10s</option>
</select>

<h3>🔍 Zoom</h3>
<div class="zoom-controls">
  <button onclick="setZoom(0.5)">0.5×</button>
  <button onclick="setZoom(1)">1×</button>
  <button onclick="setZoom(2)">2×</button>
  <button onclick="setZoom(5)">5×</button>
  <button onclick="setZoom(10)">10×</button>
  <label>Vlastné:</label>
  <input type="range" id="zoomRange" min="1" max="5" step="0.1" value="1" oninput="setZoom(this.value)">
  <span id="zoomValue">1×</span>
</div>

<h3>📂 História</h3>
<div class="history" id="history"></div>

<footer>© 2025 Erik Mohylák – Všetky práva vyhradené. Predaj a úprava povolená len s licenciou.</footer>

<script>
let video = document.getElementById('video');
let canvas = document.getElementById('canvas');
let photo = document.getElementById('photo');
let banner = document.getElementById('banner');
let mediaRecorder;
let recordedChunks = [];
let currentStream;
let useFront = true;
let filter = 'none';
let zoom = 1;
let maxZoom = 5;
let historyDiv = document.getElementById('history');

// ---------------- CAMERA ----------------
async function startCamera() {
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  currentStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: useFront ? 'user' : 'environment' },
    audio: true
  });
  video.srcObject = currentStream;

  const track = currentStream.getVideoTracks()[0];
  const capabilities = track.getCapabilities();
  if (capabilities.zoom) {
    maxZoom = capabilities.zoom.max;
    document.getElementById('zoomRange').max = maxZoom;
  }
  applyZoom();
}

// ---------------- ZOOM ----------------
function applyZoom() {
  const track = currentStream.getVideoTracks()[0];
  const capabilities = track.getCapabilities();
  if (!capabilities.zoom) return;
  track.applyConstraints({ advanced: [{ zoom: zoom }] });
  document.getElementById('zoomValue').textContent = zoom.toFixed(1) + '×';
}
function setZoom(value) { zoom = parseFloat(value); applyZoom(); document.getElementById('zoomRange').value = zoom; }

// ---------------- THEME ----------------
function toggleTheme() { document.body.classList.toggle('dark-mode'); }
function applyFilter(f) { filter = f; video.style.filter = f; }

// ---------------- PHOTO ----------------
function takePhoto() {
  const timer = parseInt(document.getElementById('timer').value);
  timer > 0 ? setTimeout(capturePhoto, timer*1000) : capturePhoto();
}
function capturePhoto() {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.filter = filter;
  ctx.drawImage(video,0,0);
  photo.src = canvas.toDataURL('image/png');
  addToHistory('photo', photo.src);
  showBanner('📸 Fotka hotová!');
}
function downloadPhoto() {
  if (!photo.src) { showBanner('⚠ Najprv odfoť!'); return; }
  const a = document.createElement('a');
  a.href = photo.src;
  a.download = 'erikai-fotka.png';
  a.click();
}

// ---------------- VIDEO ----------------
function startRecording() {
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(currentStream);
  mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
  mediaRecorder.start();
}
function stopRecording() {
  if(mediaRecorder && mediaRecorder.state!=='inactive'){
    mediaRecorder.stop();
    mediaRecorder.onstop = ()=>{
      const blob = new Blob(recordedChunks,{type:'video/webm'});
      const url = URL.createObjectURL(blob);
      addToHistory('video', url);
      showBanner('🎬 Video hotové!');
    };
  }
}
function downloadVideo() {
  if(!recordedChunks.length){ showBanner('⚠ Najprv nahraj video!'); return; }
  const blob = new Blob(recordedChunks,{type:'video/webm'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'erikai-video.webm';
  a.click();
}

// ---------------- SWITCH CAMERA ----------------
function switchCamera() { useFront = !useFront; startCamera(); }

// ---------------- HISTORY ----------------
function addToHistory(type, src){
  const el = type==='photo'?document.createElement('img'):document.createElement('video');
  el.src = src; if(type==='video') el.controls = true;
  el.onclick = ()=>{ if(type==='photo') photo.src=src; };
  historyDiv.appendChild(el);
}

// ---------------- BANNER ----------------
function showBanner(msg){
  banner.textContent = msg;
  banner.style.display='block';
  setTimeout(()=>{banner.style.display='none';},3000);
}

window.onload=()=>{ startCamera(); };
</script>

</body>
</html>
