<!DOCTYPE html><html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📷 ErikAI Kamera Pro</title>
<style>
  body {
    font-family: 'Inter', Arial, sans-serif;
    margin: 0; padding: 20px;
    background: #f4f4f4;
    color: #222;
    transition: background 0.3s, color 0.3s;
    text-align: center;
  }
  body.dark-mode { background: #121212; color: white; }
  h1 { color: #d40000; margin-bottom: 10px; }
  video, canvas, img {
    width: 90%; max-width: 400px;
    border-radius: 12px;
    border: 2px solid #d40000;
    margin: 10px 0;
  }
  .buttons { margin: 10px 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  button {
    padding: 10px 15px;
    font-size: 16px;
    background: #d40000;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #a80000; }
  select { padding: 8px; font-size: 16px; }
  .filter-btn { background: #1a73e8; }
  .filter-btn:hover { background: #1558a5; }
  .history { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
  .history img, .history video { width: 120px; height: auto; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body><h1>📷 ErikAI Kamera Pro</h1>
<button onclick="toggleTheme()">🌓 Zmeniť režim</button><video id="video" autoplay playsinline muted></video> <canvas id="canvas" style="display:none;"></canvas> <img id="photo" src="" alt="Fotka">

<div class="buttons">
  <button onclick="takePhoto()">📸 Odfotiť</button>
  <button onclick="downloadPhoto()">💾 Stiahnuť fotku</button>
  <button onclick="startRecording()">🎬 Nahrať video</button>
  <button onclick="stopRecording()">🛑 Zastaviť video</button>
  <button onclick="downloadVideo()">📥 Stiahnuť video</button>
  <button onclick="switchCamera()">🔄 Prepnúť kameru</button>
</div><div class="buttons">
  <button class="filter-btn" onclick="applyFilter('none')">🔳 Žiadny filter</button>
  <button class="filter-btn" onclick="applyFilter('grayscale(100%)')">⚫ B&W</button>
  <button class="filter-btn" onclick="applyFilter('sepia(100%)')">🟤 Sepia</button>
  <button class="filter-btn" onclick="applyFilter('invert(100%)')">🔄 Invert</button>
</div><label for="timer">⏱ Časovač na fotku:</label> <select id="timer">

  <option value="0">Bez časovača</option>
  <option value="3">3s</option>
  <option value="5">5s</option>
  <option value="10">10s</option>
</select><h3>📂 História</h3>
<div class="history" id="history"></div><script>
let video = document.getElementById('video');
let canvas = document.getElementById('canvas');
let photo = document.getElementById('photo');
let mediaRecorder;
let recordedChunks = [];
let currentStream;
let useFront = true;
let filter = 'none';
let historyDiv = document.getElementById('history');

async function startCamera() {
  if (currentStream) currentStream.getTracks().forEach(track => track.stop());
  currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: useFront ? 'user' : 'environment' }, audio: true });
  video.srcObject = currentStream;
  video.style.filter = filter;
}

function toggleTheme() {
  document.body.classList.toggle('dark-mode');
}

function applyFilter(f) {
  filter = f;
  video.style.filter = filter;
  photo.style.filter = filter;
}

function takePhoto() {
  const timer = parseInt(document.getElementById('timer').value);
  if (timer > 0) {
    setTimeout(capturePhoto, timer * 1000);
  } else capturePhoto();
}

function capturePhoto() {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.filter = filter;
  ctx.drawImage(video, 0, 0);
  photo.src = canvas.toDataURL('image/png');
  addToHistory('photo', photo.src);
}

function downloadPhoto() {
  if (!photo.src) return alert('Najprv odfoť!');
  const link = document.createElement('a');
  link.href = photo.src;
  link.download = 'erikai-fotka.png';
  link.click();
}

function startRecording() {
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(currentStream);
  mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
  mediaRecorder.start();
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      addToHistory('video', url);
    };
  }
}

function downloadVideo() {
  if (!recordedChunks.length) return alert('Najprv nahraj video!');
  const blob = new Blob(recordedChunks, { type: 'video/webm' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'erikai-video.webm';
  a.click();
}

function switchCamera() {
  useFront = !useFront;
  startCamera();
}

function addToHistory(type, src) {
  const el = type === 'photo' ? document.createElement('img') : document.createElement('video');
  el.src = src;
  if(type==='video') el.controls = true;
  el.onclick = () => { if(type==='photo') photo.src = src; else { let vid = document.createElement('video'); vid.src = src; vid.controls=true; vid.play(); document.body.appendChild(vid);} };
  historyDiv.appendChild(el);
}

startCamera();
</script></body>
</html>
