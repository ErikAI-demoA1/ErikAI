<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>ErikAI OS - Master PDF & Document Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- html2canvas & jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            margin: 0;
        }
        #main-viewport {
            overflow: auto;
            position: relative;
            width: 100vw;
            height: calc(100vh - 115px);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 0;
            gap: 40px;
        }
        #main-viewport.pan-mode {
            cursor: grab !important;
        }
        #main-viewport.pan-mode:active {
            cursor: grabbing !important;
        }
        .page-container {
            position: relative;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
            background: white;
            transform-origin: top center;
        }
        .canvas-element, .whiteout-box, .image-element, .table-element {
            position: absolute;
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
        }
        .canvas-element {
            cursor: grab;
            border: 1px dashed rgba(239, 68, 68, 0.7);
            padding: 2px 4px;
        }
        .canvas-element:active {
            cursor: grabbing;
        }
        .canvas-element.selected {
            border-color: #ef4444;
            background-color: rgba(239, 68, 68, 0.12);
        }
        .whiteout-box {
            cursor: grab;
            background-color: white;
            border: 1px dashed #94a3b8;
        }
        .whiteout-box:active {
            cursor: grabbing;
        }
        .whiteout-box.selected {
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .image-element {
            cursor: grab;
            border: 1px dashed #eab308;
        }
        .image-element:active {
            cursor: grabbing;
        }
        .image-element img {
            width: 100%;
            height: 100%;
            pointer-events: none;
            object-fit: contain;
        }
        .image-element.selected {
            border-color: #eab308;
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.5);
        }
        .table-element {
            border: 1px dashed #10b981;
            background: white;
        }
        .table-drag-handle {
            height: 18px;
            background: #10b981;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
            font-weight: bold;
            letter-spacing: 1px;
            user-select: none;
        }
        .table-drag-handle:active {
            cursor: grabbing;
        }
        .table-element.selected {
            border-color: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
        .table-element table {
            width: 100%;
            height: calc(100% - 18px);
            border-collapse: collapse;
            color: #000;
        }
        .table-element td, .table-element th {
            border: 1px solid #64748b;
            padding: 6px;
            text-align: left;
            font-size: 13px;
            outline: none;
            cursor: text;
        }
        .table-element td:focus, .table-element th:focus {
            background-color: rgba(16, 185, 129, 0.2);
        }

        .exporting-pdf .canvas-element,
        .exporting-pdf .whiteout-box,
        .exporting-pdf .image-element,
        .exporting-pdf .table-element {
            border: none !important;
            background: transparent !important;
            box-shadow: none !important;
        }
        .exporting-pdf .whiteout-box {
            background-color: white !important;
        }
        .exporting-pdf .table-drag-handle {
            display: none !important;
        }

        .pan-mode .canvas-element,
        .pan-mode .whiteout-box,
        .pan-mode .image-element,
        .pan-mode .table-element {
            pointer-events: none !important;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-3 flex justify-between items-center gap-3 z-20 shadow-md">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-red-600 to-red-800 flex items-center justify-center font-bold text-white shadow-lg shadow-red-600/30">
                E
            </div>
            <div>
                <h1 class="text-base font-bold tracking-wide text-white flex items-center gap-2">
                    ErikAI OS <span class="text-xs px-2 py-0.5 rounded bg-red-950 text-red-400 border border-red-800">Master Studio Pro</span>
                </h1>
                <p class="text-xs text-slate-400">Bezserverový PDF editor s plynulým skrolovaním</p>
            </div>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
            <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1.5 text-xs font-medium">
                📄 Nahrať PDF
                <input type="file" id="pdf-input" accept="application/pdf" class="hidden">
            </label>
            <button id="add-whiteout-btn" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-700">⬜ Zakryť (Strana 1)</button>
            <button id="add-text-btn" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-700">✏️ Text</button>
            <button id="open-sign-modal-btn" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-700">✍️ Podpísať</button>
            <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-medium">
                🖼️ Obrázok
                <input type="file" id="image-input" accept="image/*" multiple class="hidden">
            </label>
            <button id="add-table-modal-btn" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-700">📊 Tabuľka</button>
            <button id="clear-storage-btn" class="bg-red-950 hover:bg-red-900 text-red-300 px-3 py-1.5 rounded-lg text-xs font-medium border border-red-800">🗑️ Vymazať pamäť</button>
            <button id="export-pdf-modal-btn" class="bg-red-600 hover:bg-red-500 text-white px-4 py-1.5 rounded-lg text-xs font-medium shadow-lg shadow-red-600/25">💾 Stiahnuť PDF (1:1)</button>
        </div>
    </header>

    <!-- Toolbar -->
    <div class="bg-slate-900/90 border-b border-slate-800 px-4 py-2 flex items-center justify-between gap-3 text-xs z-20">
        <div class="flex items-center gap-2 flex-wrap">
            <span class="text-slate-400 font-semibold">Režim:</span>
            <button id="mode-edit-btn" class="px-3 py-1 bg-red-600 text-white rounded font-medium">✏️ Úpravy</button>
            <button id="mode-move-objects-btn" class="px-3 py-1 bg-slate-800 text-slate-300 rounded font-medium">✋ Pohyb objektov</button>
            <button id="mode-pan-btn" class="px-3 py-1 bg-slate-800 text-slate-300 rounded font-medium">✋ Posun plátna</button>
            
            <div class="h-4 w-[1px] bg-slate-700 mx-2"></div>

            <span class="text-slate-400 font-semibold">Lupa:</span>
            <button id="zoom-out-btn" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded font-bold text-white">-</button>
            <span id="zoom-val" class="font-mono text-slate-200">100%</span>
            <button id="zoom-in-btn" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded font-bold text-white">+</button>
            <button id="zoom-reset-btn" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-300">Reset</button>
        </div>

        <div class="flex items-center gap-3">
            <span id="doc-info" class="font-medium text-slate-300">Žiadny dokument</span>
        </div>
    </div>

    <!-- Workspace -->
    <div class="flex-1 flex overflow-hidden relative">
        <!-- Sidebar -->
        <aside class="w-80 bg-slate-900/90 border-r border-slate-800 p-4 flex flex-col gap-4 overflow-y-auto z-10 shrink-0">
            <div class="space-y-3 bg-slate-950/60 p-3.5 rounded-xl border border-slate-800">
                <h2 class="text-xs uppercase tracking-wider text-slate-400 font-bold">Vlastnosti objektu</h2>
                <div id="no-selection" class="text-xs text-slate-500 italic py-2">Kliknite na objekt pre úpravu.</div>
                <div id="inspector-content" class="space-y-3 hidden">
                    <div id="text-prop-group">
                        <label class="text-xs text-slate-400 mb-1 block">Text:</label>
                        <input type="text" id="prop-text" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white">
                        
                        <label class="text-xs text-slate-400 mt-2 mb-1 block">Font textu:</label>
                        <select id="prop-font" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white">
                            <option value="Segoe UI, Tahoma, Geneva, Verdana, sans-serif">Segoe UI (Predvolený)</option>
                            <option value="Arial, Helvetica, sans-serif">Arial</option>
                            <option value="Times New Roman, Times, serif">Times New Roman</option>
                            <option value="Courier New, Courier, monospace">Courier New</option>
                            <option value="Georgia, serif">Georgia</option>
                            <option value="Verdana, Geneva, sans-serif">Verdana</option>
                            <option value="Comic Sans MS, Comic Sans, cursive">Comic Sans MS</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2" id="font-prop-group">
                        <div>
                            <label class="text-xs text-slate-400 mb-1 block">Veľkosť (px):</label>
                            <input type="number" id="prop-size" min="8" max="150" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white">
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 mb-1 block">Farba:</label>
                            <input type="color" id="prop-color" class="w-full h-9 bg-slate-800 border border-slate-700 rounded p-1 cursor-pointer">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs text-slate-400 mb-1 block">Šírka (px):</label>
                            <input type="number" id="prop-width" min="10" max="3000" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white">
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 mb-1 block">Výška (px):</label>
                            <input type="number" id="prop-height" min="10" max="3000" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white">
                        </div>
                    </div>
                    <button id="duplicate-btn" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 py-2 rounded-lg text-sm font-medium">📋 Duplikovať objekt</button>
                    <button id="delete-btn" class="w-full bg-red-950/60 hover:bg-red-900 border border-red-800/60 text-red-300 py-2 rounded-lg text-sm font-medium">🗑️ Vymazať objekt</button>
                </div>
            </div>

            <div class="space-y-2 bg-slate-950/60 p-3.5 rounded-xl border border-slate-800">
                <div class="flex justify-between items-center">
                    <h2 class="text-xs uppercase tracking-wider text-slate-400 font-bold">Vrstvy & Objekty</h2>
                    <span id="elements-count" class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full font-mono">0</span>
                </div>
                <div id="layers-list" class="space-y-1.5 max-h-56 overflow-y-auto text-xs"></div>
            </div>
        </aside>

        <!-- Main Viewport (Plynulé skrolovanie strán pod sebou) -->
        <main id="main-viewport" class="flex-1 bg-slate-950">
            <div id="pages-wrapper" class="flex flex-col items-center gap-10 w-full"></div>
        </main>
    </div>

    <!-- Modal pre uloženie PDF -->
    <div id="pdf-name-modal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 w-80 space-y-4 shadow-2xl">
            <h3 class="text-base font-bold text-white">Uložiť PDF</h3>
            <div>
                <label class="text-xs text-slate-400 mb-1 block">Názov súboru:</label>
                <input type="text" id="pdf-filename-input" value="Upraveny_Dokument" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white">
            </div>
            <div class="flex gap-2 pt-2">
                <button id="pdf-modal-cancel" class="flex-1 bg-slate-800 text-slate-300 py-2 rounded text-sm">Zrušiť</button>
                <button id="pdf-modal-confirm" class="flex-1 bg-red-600 text-white py-2 rounded text-sm font-medium">Stiahnuť</button>
            </div>
        </div>
    </div>

    <!-- Modal pre tabuľku -->
    <div id="table-modal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 w-80 space-y-4 shadow-2xl">
            <h3 class="text-base font-bold text-white">Nová Tabuľka</h3>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 mb-1 block">Riadky:</label>
                    <input type="number" id="modal-rows" value="3" min="1" max="40" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white">
                </div>
                <div>
                    <label class="text-xs text-slate-400 mb-1 block">Stĺpce:</label>
                    <input type="number" id="modal-cols" value="3" min="1" max="20" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white">
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button id="modal-cancel" class="flex-1 bg-slate-800 text-slate-300 py-2 rounded text-sm">Zrušiť</button>
                <button id="modal-create" class="flex-1 bg-red-600 text-white py-2 rounded text-sm font-medium">Vytvoriť</button>
            </div>
        </div>
    </div>

    <!-- Modal pre podpisovanie -->
    <div id="sign-modal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 w-96 space-y-4 shadow-2xl">
            <h3 class="text-base font-bold text-white">Vytvoriť Podpis</h3>
            <p class="text-xs text-slate-400">Podpíšte sa myšou alebo prstom priamo v poli:</p>
            <div class="bg-white rounded-lg overflow-hidden border border-slate-700 touch-none">
                <canvas id="sign-canvas" width="340" height="150" class="cursor-crosshair w-full block"></canvas>
            </div>
            <div class="flex justify-between items-center">
                <button id="sign-clear" class="text-xs text-red-400 hover:text-red-300 underline">Vymazať plátno</button>
            </div>
            <div class="flex gap-2 pt-2">
                <button id="sign-cancel" class="flex-1 bg-slate-800 text-slate-300 py-2 rounded text-sm">Zrušiť</button>
                <button id="sign-insert" class="flex-1 bg-red-600 text-white py-2 rounded text-sm font-medium">Vložiť podpis</button>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null;
        let currentZoom = 1.0;
        let currentMode = 'edit';
        
        const pagesWrapper = document.getElementById('pages-wrapper');
        const viewport = document.getElementById('main-viewport');

        let pageAnnotations = {}; // { pageNum: [ objekty ] }
        let activeElement = null;

        function setMode(mode) {
            currentMode = mode;
            viewport.classList.remove('pan-mode');
            
            document.getElementById('mode-edit-btn').className = "px-3 py-1 bg-slate-800 text-slate-300 rounded font-medium";
            document.getElementById('mode-move-objects-btn').className = "px-3 py-1 bg-slate-800 text-slate-300 rounded font-medium";
            document.getElementById('mode-pan-btn').className = "px-3 py-1 bg-slate-800 text-slate-300 rounded font-medium";

            if (mode === 'edit') {
                document.getElementById('mode-edit-btn').className = "px-3 py-1 bg-red-600 text-white rounded font-medium";
            } else if (mode === 'move-objects') {
                document.getElementById('mode-move-objects-btn').className = "px-3 py-1 bg-red-600 text-white rounded font-medium";
            } else if (mode === 'pan') {
                document.getElementById('mode-pan-btn').className = "px-3 py-1 bg-red-600 text-white rounded font-medium";
                viewport.classList.add('pan-mode');
                selectElement(null);
            }
        }

        document.getElementById('mode-edit-btn').addEventListener('click', () => setMode('edit'));
        document.getElementById('mode-move-objects-btn').addEventListener('click', () => setMode('move-objects'));
        document.getElementById('mode-pan-btn').addEventListener('click', () => setMode('pan'));

        let isPanning = false, startX, startY, scrollLeft, scrollTop;
        viewport.addEventListener('mousedown', (e) => {
            if (currentMode !== 'pan') return;
            isPanning = true;
            startX = e.clientX;
            startY = e.clientY;
            scrollLeft = viewport.scrollLeft;
            scrollTop = viewport.scrollTop;
        });
        window.addEventListener('mouseup', () => isPanning = false);
        window.addEventListener('mousemove', (e) => {
            if (!isPanning || currentMode !== 'pan') return;
            e.preventDefault();
            viewport.scrollLeft = scrollLeft - (e.clientX - startX);
            viewport.scrollTop = scrollTop - (e.clientY - startY);
        });

        // Automatické načítanie pri štarte z pamäte prehliadača
        window.addEventListener('DOMContentLoaded', () => {
            const savedPdf = localStorage.getItem('erikai_pdf_data');
            const savedAnno = localStorage.getItem('erikai_annotations');
            if (savedAnno) {
                try { pageAnnotations = JSON.parse(savedAnno); } catch(err) {}
            }
            if (savedPdf) {
                try {
                    const typedarray = new Uint8Array(JSON.parse(savedPdf));
                    pdfjsLib.getDocument(typedarray).promise.then((pdf) => {
                        pdfDoc = pdf;
                        renderAllPages();
                    });
                } catch(err) {}
            }
        });

        document.getElementById('pdf-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.type === 'application/pdf') {
                const reader = new FileReader();
                reader.onload = function() {
                    const typedarray = new Uint8Array(this.result);
                    try { 
                        localStorage.setItem('erikai_pdf_data', JSON.stringify(Array.from(typedarray))); 
                        localStorage.removeItem('erikai_annotations');
                    } catch(err) {}

                    pdfjsLib.getDocument(typedarray).promise.then((pdf) => {
                        pdfDoc = pdf;
                        pageAnnotations = {};
                        renderAllPages();
                    });
                };
                reader.readAsArrayBuffer(file);
            }
        });

        document.getElementById('clear-storage-btn').addEventListener('click', () => {
            if (confirm('Naozaj chcete vymazať uložený dokument a úpravy z pamäte?')) {
                localStorage.removeItem('erikai_pdf_data');
                localStorage.removeItem('erikai_annotations');
                location.reload();
            }
        });

        async function renderAllPages() {
            if (!pdfDoc) return;
            pagesWrapper.innerHTML = '';
            document.getElementById('doc-info').textContent = `Počet strán: ${pdfDoc.numPages}`;

            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const page = await pdfDoc.getPage(i);
                const baseVp = page.getViewport({ scale: 1.0 * currentZoom });

                const container = document.createElement('div');
                container.className = 'page-container';
                container.style.width = baseVp.width + 'px';
                container.style.height = baseVp.height + 'px';
                container.dataset.pageNum = i;

                const canvas = document.createElement('canvas');
                canvas.width = baseVp.width;
                canvas.height = baseVp.height;
                canvas.style.display = 'block';
                container.appendChild(canvas);

                pagesWrapper.appendChild(container);

                await page.render({ canvasContext: canvas.getContext('2d'), viewport: baseVp }).promise;
                restorePageAnnotations(i, container);
            }
            updateLayersList();
        }

        function saveAllAnnotations() {
            if (!pdfDoc) return;
            pageAnnotations = {};
            const containers = pagesWrapper.querySelectorAll('.page-container');

            containers.forEach(container => {
                const pageNum = container.dataset.pageNum;
                const elements = container.querySelectorAll('.canvas-element, .whiteout-box, .image-element, .table-element');
                const data = [];

                elements.forEach(el => {
                    let type = 'whiteout';
                    if (el.classList.contains('canvas-element')) type = 'text';
                    if (el.classList.contains('image-element')) type = 'image';
                    if (el.classList.contains('table-element')) type = 'table';

                    data.push({
                        type: type,
                        text: el.dataset.rawText || el.innerText,
                        html: el.innerHTML,
                        src: el.querySelector('img') ? el.querySelector('img').src : null,
                        baseLeft: parseFloat(el.dataset.baseLeft || (parseFloat(el.style.left) / currentZoom)),
                        baseTop: parseFloat(el.dataset.baseTop || (parseFloat(el.style.top) / currentZoom)),
                        baseWidth: parseFloat(el.dataset.baseWidth || (parseFloat(el.style.width) / currentZoom)),
                        baseHeight: parseFloat(el.dataset.baseHeight || (parseFloat(el.style.height) / currentZoom)),
                        fontSize: parseFloat(el.dataset.baseFontSize || parseFloat(el.style.fontSize) / currentZoom),
                        fontFamily: el.style.fontFamily || '',
                        color: el.style.color
                    });
                });
                pageAnnotations[pageNum] = data;
            });

            try {
                localStorage.setItem('erikai_annotations', JSON.stringify(pageAnnotations));
            } catch(err) {}

            updateLayersList();
        }

        function restorePageAnnotations(pageNum, container) {
            const saved = pageAnnotations[pageNum] || [];
            saved.forEach(item => {
                const scaledLeft = (item.baseLeft * currentZoom) + 'px';
                const scaledTop = (item.baseTop * currentZoom) + 'px';
                const scaledWidth = (item.baseWidth * currentZoom) + 'px';
                const scaledHeight = (item.baseHeight * currentZoom) + 'px';
                const scaledFontSize = (item.fontSize * currentZoom) + 'px';

                let el;
                if (item.type === 'whiteout') {
                    el = createBoxElement('whiteout-box', scaledLeft, scaledTop, scaledWidth, scaledHeight, false);
                } else if (item.type === 'text') {
                    el = createTextElement(item.text, scaledLeft, scaledTop, scaledFontSize, item.color, scaledWidth, scaledHeight, item.fontFamily, false);
                } else if (item.type === 'image') {
                    el = createImageElement(item.src, scaledLeft, scaledTop, scaledWidth, scaledHeight, false);
                } else if (item.type === 'table') {
                    el = createTableElement(item.html, scaledLeft, scaledTop, scaledWidth, scaledHeight, false);
                }

                if (el) {
                    el.dataset.baseLeft = item.baseLeft;
                    el.dataset.baseTop = item.baseTop;
                    el.dataset.baseWidth = item.baseWidth;
                    el.dataset.baseHeight = item.baseHeight;
                    el.dataset.baseFontSize = item.fontSize;
                    container.appendChild(el);
                }
            });
        }

        function getFirstPageContainer() {
            return pagesWrapper.querySelector('.page-container');
        }

        document.getElementById('add-whiteout-btn').addEventListener('click', () => {
            const firstPage = getFirstPageContainer();
            if (!firstPage) return alert('Najprv nahrajte PDF!');
            const el = createBoxElement('whiteout-box', '50px', '50px', '200px', '40px', true);
            firstPage.appendChild(el);
            selectElement(el);
        });

        function createBoxElement(className, left, top, width, height, shouldSave = true) {
            const el = document.createElement('div');
            el.className = className;
            el.style.left = left; el.style.top = top;
            el.style.width = width; el.style.height = height;
            el.dataset.baseLeft = parseFloat(left) / currentZoom;
            el.dataset.baseTop = parseFloat(top) / currentZoom;
            el.dataset.baseWidth = parseFloat(width) / currentZoom;
            el.dataset.baseHeight = parseFloat(height) / currentZoom;

            makeInteractive(el, el);
            if (shouldSave) saveAllAnnotations();
            return el;
        }

        document.getElementById('add-text-btn').addEventListener('click', () => {
            const firstPage = getFirstPageContainer();
            if (!firstPage) return alert('Najprv nahrajte PDF!');
            const el = createTextElement('Môj text', '50px', '110px', (16 * currentZoom) + 'px', '#000000', '200px', '40px', '', true);
            firstPage.appendChild(el);
            selectElement(el);
        });

        function createTextElement(text, left, top, fontSize, color, width, height, fontFamily, shouldSave = true) {
            const el = document.createElement('div');
            el.className = 'canvas-element';
            el.innerText = text; el.dataset.rawText = text;
            el.style.left = left; el.style.top = top;
            el.style.fontSize = fontSize; 
            el.style.color = color || '#000000';
            if (fontFamily) el.style.fontFamily = fontFamily;
            el.style.width = width; el.style.height = height;

            el.dataset.baseLeft = parseFloat(left) / currentZoom;
            el.dataset.baseTop = parseFloat(top) / currentZoom;
            el.dataset.baseWidth = parseFloat(width) / currentZoom;
            el.dataset.baseHeight = parseFloat(height) / currentZoom;
            el.dataset.baseFontSize = parseFloat(fontSize) / currentZoom;

            makeInteractive(el, el);
            if (shouldSave) saveAllAnnotations();
            return el;
        }

        document.getElementById('image-input').addEventListener('change', (e) => {
            const firstPage = getFirstPageContainer();
            if (!firstPage) return alert('Najprv nahrajte PDF!');
            const files = e.target.files;
            if (files.length > 0) {
                Array.from(files).forEach((file, idx) => {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const el = createImageElement(event.target.result, (50 + idx * 30) + 'px', (180 + idx * 30) + 'px', '150px', '150px', true);
                        firstPage.appendChild(el);
                        selectElement(el);
                    };
                    reader.readAsDataURL(file);
                });
            }
        });

        function createImageElement(src, left, top, width, height, shouldSave = true) {
            const el = document.createElement('div');
            el.className = 'image-element';
            el.style.left = left; el.style.top = top;
            el.style.width = width; el.style.height = height;

            el.dataset.baseLeft = parseFloat(left) / currentZoom;
            el.dataset.baseTop = parseFloat(top) / currentZoom;
            el.dataset.baseWidth = parseFloat(width) / currentZoom;
            el.dataset.baseHeight = parseFloat(height) / currentZoom;

            const img = document.createElement('img'); img.src = src;
            el.appendChild(img);

            makeInteractive(el, el);
            if (shouldSave) saveAllAnnotations();
            return el;
        }

        function duplicateActiveElement() {
            if (!activeElement) return;
            const parentPage = activeElement.parentElement;
            const currentLeft = parseFloat(activeElement.style.left) || 0;
            const currentTop = parseFloat(activeElement.style.top) || 0;
            const newLeft = (currentLeft + 20) + 'px';
            const newTop = (currentTop + 20) + 'px';
            const width = activeElement.style.width;
            const height = activeElement.style.height;

            let newEl = null;
            if (activeElement.classList.contains('canvas-element')) {
                const text = activeElement.dataset.rawText || activeElement.innerText;
                const fontSize = activeElement.style.fontSize;
                const color = activeElement.style.color;
                const fontFamily = activeElement.style.fontFamily;
                newEl = createTextElement(text, newLeft, newTop, fontSize, color, width, height, fontFamily, true);
            } else if (activeElement.classList.contains('whiteout-box')) {
                newEl = createBoxElement('whiteout-box', newLeft, newTop, width, height, true);
            } else if (activeElement.classList.contains('image-element')) {
                const src = activeElement.querySelector('img').src;
                newEl = createImageElement(src, newLeft, newTop, width, height, true);
            } else if (activeElement.classList.contains('table-element')) {
                const html = activeElement.innerHTML;
                newEl = createTableElement(html, newLeft, newTop, width, height, true);
            }
            if (newEl) {
                parentPage.appendChild(newEl);
                selectElement(newEl);
            }
        }

        document.getElementById('duplicate-btn').addEventListener('click', duplicateActiveElement);

        /* Podpisovanie */
        const signModal = document.getElementById('sign-modal');
        const signCanvas = document.getElementById('sign-canvas');
        const signCtx = signCanvas.getContext('2d');
        let isDrawing = false;

        document.getElementById('open-sign-modal-btn').addEventListener('click', () => {
            if (!pdfDoc) return alert('Najprv nahrajte PDF!');
            signModal.classList.remove('hidden');
            signCtx.clearRect(0, 0, signCanvas.width, signCanvas.height);
            signCtx.strokeStyle = '#000000';
            signCtx.lineWidth = 2.5;
            signCtx.lineCap = 'round';
        });

        document.getElementById('sign-cancel').addEventListener('click', () => signModal.classList.add('hidden'));
        document.getElementById('sign-clear').addEventListener('click', () => signCtx.clearRect(0, 0, signCanvas.width, signCanvas.height));

        function getSignPos(e, canvasEl) {
            const rect = canvasEl.getBoundingClientRect();
            const scaleX = canvasEl.width / rect.width;
            const scaleY = canvasEl.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        signCanvas.addEventListener('pointerdown', (e) => {
            isDrawing = true;
            signCanvas.setPointerCapture(e.pointerId);
            const pos = getSignPos(e, signCanvas);
            signCtx.beginPath();
            signCtx.moveTo(pos.x, pos.y);
            e.preventDefault();
        });

        signCanvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            const pos = getSignPos(e, signCanvas);
            signCtx.lineTo(pos.x, pos.y);
            signCtx.stroke();
            e.preventDefault();
        });

        const stopSign = (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            try { signCanvas.releasePointerCapture(e.pointerId); } catch(err) {}
        };
        signCanvas.addEventListener('pointerup', stopSign);
        signCanvas.addEventListener('pointercancel', stopSign);

        document.getElementById('sign-insert').addEventListener('click', () => {
            const firstPage = getFirstPageContainer();
            if (!firstPage) return;
            const dataURL = signCanvas.toDataURL('image/png');
            signModal.classList.add('hidden');
            const el = createImageElement(dataURL, '50px', '250px', '180px', '70px', true);
            firstPage.appendChild(el);
            selectElement(el);
        });

        /* Tabuľka */
        const modal = document.getElementById('table-modal');
        document.getElementById('add-table-modal-btn').addEventListener('click', () => {
            if (!pdfDoc) return alert('Najprv nahrajte PDF!');
            modal.classList.remove('hidden');
        });
        document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.add('hidden'));
        document.getElementById('modal-create').addEventListener('click', () => {
            const firstPage = getFirstPageContainer();
            if (!firstPage) return;
            const rows = parseInt(document.getElementById('modal-rows').value) || 3;
            const cols = parseInt(document.getElementById('modal-cols').value) || 3;
            modal.classList.add('hidden');

            let tableHTML = '<div class="table-drag-handle">☰ UCHOPIT A PRESUNÚŤ</div><table><tr>';
            for (let c = 0; c < cols; c++) tableHTML += `<th contenteditable="true">Hlavička ${c+1}</th>`;
            tableHTML += '</tr>';
            for (let r = 0; r < rows - 1; r++) {
                tableHTML += '<tr>';
                for (let c = 0; c < cols; c++) tableHTML += `<td contenteditable="true">Bunka ${r+1},${c+1}</td>`;
                tableHTML += '</tr>';
            }
            tableHTML += '</table>';

            const el = createTableElement(tableHTML, '50px', '350px', (cols * 100 * currentZoom) + 'px', ((rows * 35) + 18) + 'px', true);
            firstPage.appendChild(el);
            selectElement(el);
        });

        function createTableElement(html, left, top, width, height, shouldSave = true) {
            const el = document.createElement('div');
            el.className = 'table-element';
            el.innerHTML = html;
            el.style.left = left; el.style.top = top;
            el.style.width = width; el.style.height = height;

            el.dataset.baseLeft = parseFloat(left) / currentZoom;
            el.dataset.baseTop = parseFloat(top) / currentZoom;
            el.dataset.baseWidth = parseFloat(width) / currentZoom;
            el.dataset.baseHeight = parseFloat(height) / currentZoom;

            el.querySelectorAll('td, th').forEach(cell => {
                cell.addEventListener('mousedown', (e) => e.stopPropagation());
                cell.addEventListener('input', () => saveAllAnnotations());
            });

            const handle = el.querySelector('.table-drag-handle');
            if (handle) makeInteractive(el, handle);
            else makeInteractive(el, el);

            if (shouldSave) saveAllAnnotations();
            return el;
        }

        function makeInteractive(el, handleElement) {
            let isDragging = false;
            let startX, startY, initLeft, initTop;

            handleElement.addEventListener('pointerdown', (e) => {
                if (currentMode === 'pan' || e.target.tagName === 'TD' || e.target.tagName === 'TH' || e.target.isContentEditable) return;
                
                isDragging = true;
                handleElement.setPointerCapture(e.pointerId);
                selectElement(el);
                
                startX = e.clientX;
                startY = e.clientY;
                initLeft = parseFloat(el.style.left) || 0;
                initTop = parseFloat(el.style.top) || 0;
                
                e.stopPropagation();
            });

            handleElement.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                
                const newLeft = initLeft + dx;
                const newTop = initTop + dy;
                
                el.style.left = newLeft + 'px';
                el.style.top = newTop + 'px';
                
                el.dataset.baseLeft = newLeft / currentZoom;
                el.dataset.baseTop = newTop / currentZoom;
            });

            const stopDrag = (e) => {
                if (!isDragging) return;
                isDragging = false;
                try { handleElement.releasePointerCapture(e.pointerId); } catch(err) {}
                saveAllAnnotations();
            };

            handleElement.addEventListener('pointerup', stopDrag);
            handleElement.addEventListener('pointercancel', stopDrag);
        }

        function updateLayersList() {
            const listContainer = document.getElementById('layers-list');
            const elements = pagesWrapper.querySelectorAll('.canvas-element, .whiteout-box, .image-element, .table-element');
            document.getElementById('elements-count').textContent = elements.length;

            if (elements.length === 0) {
                listContainer.innerHTML = '<p class="text-slate-500 italic">Žiadne objekty.</p>';
                return;
            }

            listContainer.innerHTML = '';
            elements.forEach((el, index) => {
                let icon = '📦', name = `Objekt #${index + 1}`;
                if (el.classList.contains('canvas-element')) { icon = '✏️'; name = `Text: "${el.dataset.rawText || 'Nový'}"`; }
                else if (el.classList.contains('whiteout-box')) { icon = '⬜'; name = 'Zakrytie'; }
                else if (el.classList.contains('image-element')) { icon = '🖼️'; name = 'Obrázok / Podpis'; }
                else if (el.classList.contains('table-element')) { icon = '📊'; name = 'Tabuľka'; }

                const item = document.createElement('div');
                item.className = "flex items-center justify-between bg-slate-900 p-2 rounded border border-slate-800 hover:border-slate-700 cursor-pointer";
                if (el === activeElement) item.classList.add('border-red-500', 'bg-slate-800');
                
                item.innerHTML = `<span class="truncate pr-2">${icon} ${name}</span>`;
                item.onclick = (e) => { 
                    e.stopPropagation(); 
                    selectElement(el); 
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                };
                listContainer.appendChild(item);
            });
        }

        function selectElement(el) {
            pagesWrapper.querySelectorAll('.canvas-element, .whiteout-box, .image-element, .table-element').forEach(item => item.classList.remove('selected'));
            activeElement = el;
            updateLayersList();

            const inspector = document.getElementById('inspector-content');
            const noSelection = document.getElementById('no-selection');
            const textGroup = document.getElementById('text-prop-group');
            const fontGroup = document.getElementById('font-prop-group');

            if (el) {
                el.classList.add('selected');
                inspector.classList.remove('hidden');
                noSelection.classList.add('hidden');

                document.getElementById('prop-width').value = Math.round(parseFloat(el.dataset.baseWidth || parseFloat(el.style.width) / currentZoom));
                document.getElementById('prop-height').value = Math.round(parseFloat(el.dataset.baseHeight || parseFloat(el.style.height) / currentZoom));

                if (el.classList.contains('canvas-element')) {
                    textGroup.style.display = 'block';
                    fontGroup.style.display = 'grid';
                    document.getElementById('prop-text').value = el.dataset.rawText || el.innerText;
                    document.getElementById('prop-size').value = Math.round(parseFloat(el.dataset.baseFontSize || parseFloat(el.style.fontSize) / currentZoom));
                    document.getElementById('prop-color').value = rgbToHex(window.getComputedStyle(el).color);
                    
                    const currentFont = window.getComputedStyle(el).fontFamily;
                    const fontSelect = document.getElementById('prop-font');
                    for(let opt of fontSelect.options) {
                        if(currentFont.includes(opt.value.split(',')[0].trim())) {
                            fontSelect.value = opt.value;
                            break;
                        }
                    }
                } else {
                    textGroup.style.display = 'none';
                    fontGroup.style.display = 'none';
                }
            } else {
                inspector.classList.add('hidden');
                noSelection.classList.remove('hidden');
            }
        }

        document.getElementById('prop-text').addEventListener('input', (e) => {
            if (activeElement && activeElement.classList.contains('canvas-element')) {
                activeElement.innerText = e.target.value;
                activeElement.dataset.rawText = e.target.value;
                updateLayersList();
                saveAllAnnotations();
            }
        });
        document.getElementById('prop-font').addEventListener('change', (e) => {
            if (activeElement && activeElement.classList.contains('canvas-element')) {
                activeElement.style.fontFamily = e.target.value;
                saveAllAnnotations();
            }
        });
        document.getElementById('prop-size').addEventListener('input', (e) => {
            if (activeElement && activeElement.classList.contains('canvas-element')) {
                const val = parseFloat(e.target.value);
                activeElement.style.fontSize = (val * currentZoom) + 'px';
                activeElement.dataset.baseFontSize = val;
                saveAllAnnotations();
            }
        });
        document.getElementById('prop-color').addEventListener('input', (e) => {
            if (activeElement && activeElement.classList.contains('canvas-element')) {
                activeElement.style.color = e.target.value;
                saveAllAnnotations();
            }
        });
        document.getElementById('prop-width').addEventListener('input', (e) => {
            if (activeElement) {
                const val = parseFloat(e.target.value);
                activeElement.style.width = (val * currentZoom) + 'px';
                activeElement.dataset.baseWidth = val;
                saveAllAnnotations();
            }
        });
        document.getElementById('prop-height').addEventListener('input', (e) => {
            if (activeElement) {
                const val = parseFloat(e.target.value);
                activeElement.style.height = (val * currentZoom) + 'px';
                activeElement.dataset.baseHeight = val;
                saveAllAnnotations();
            }
        });
        document.getElementById('delete-btn').addEventListener('click', () => {
            if (activeElement) {
                activeElement.remove();
                selectElement(null);
                saveAllAnnotations();
            }
        });

        window.addEventListener('keydown', (e) => {
            const isInputActive = document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TD' || document.activeElement.tagName === 'TH' || document.activeElement.isContentEditable;
            
            if ((e.key === 'Delete' || e.key === 'Backspace') && activeElement && !isInputActive) {
                activeElement.remove();
                selectElement(null);
                saveAllAnnotations();
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd' && activeElement && !isInputActive) {
                e.preventDefault();
                duplicateActiveElement();
            }
        });

        document.getElementById('zoom-in-btn').addEventListener('click', () => {
            if (!pdfDoc) return;
            currentZoom += 0.2;
            document.getElementById('zoom-val').textContent = Math.round(currentZoom * 100) + '%';
            renderAllPages();
        });
        document.getElementById('zoom-out-btn').addEventListener('click', () => {
            if (!pdfDoc || currentZoom <= 0.3) return;
            currentZoom -= 0.2;
            document.getElementById('zoom-val').textContent = Math.round(currentZoom * 100) + '%';
            renderAllPages();
        });
        document.getElementById('zoom-reset-btn').addEventListener('click', () => {
            if (!pdfDoc) return;
            currentZoom = 1.0;
            document.getElementById('zoom-val').textContent = '100%';
            renderAllPages();
        });

        /* Export PDF */
        const pdfNameModal = document.getElementById('pdf-name-modal');
        document.getElementById('export-pdf-modal-btn').addEventListener('click', () => {
            if (!pdfDoc) return alert('Najprv nahrajte PDF!');
            pdfNameModal.classList.remove('hidden');
        });
        document.getElementById('pdf-modal-cancel').addEventListener('click', () => pdfNameModal.classList.add('hidden'));

        document.getElementById('pdf-modal-confirm').addEventListener('click', async () => {
            pdfNameModal.classList.add('hidden');
            let filename = document.getElementById('pdf-filename-input').value.trim() || 'Upraveny_Dokument';
            if (!filename.endsWith('.pdf')) filename += '.pdf';

            saveAllAnnotations();
            selectElement(null);

            const oldZoom = currentZoom;
            currentZoom = 1.0;
            await renderAllPages();

            pagesWrapper.classList.add('exporting-pdf');
            const { jsPDF } = window.jspdf;
            let finalPdf = null;

            const containers = pagesWrapper.querySelectorAll('.page-container');
            for (let i = 0; i < containers.length; i++) {
                const container = containers[i];
                const canvasCap = await html2canvas(container, {
                    scale: 2,
                    useCORS: true,
                    logging: false,
                    windowWidth: container.scrollWidth,
                    windowHeight: container.scrollHeight
                });

                const imgData = canvasCap.toDataURL('image/jpeg', 0.98);
                const w = container.offsetWidth;
                const h = container.offsetHeight;

                if (i === 0) {
                    finalPdf = new jsPDF({
                        orientation: w > h ? 'landscape' : 'portrait',
                        unit: 'px',
                        format: [w, h]
                    });
                } else {
                    finalPdf.addPage([w, h]);
                }
                finalPdf.addImage(imgData, 'JPEG', 0, 0, w, h);
            }

            pagesWrapper.classList.remove('exporting-pdf');
            finalPdf.save(filename);
            
            currentZoom = oldZoom;
            renderAllPages();
        });

        function rgbToHex(rgb) {
            if (/^#/.test(rgb)) return rgb;
            const m = rgb.match(/\d+/g);
            return m ? "#" + m.slice(0, 3).map(x => (+x).toString(16).padStart(2, '0')).join('') : '#000000';
        }
    </script>
</body>
</html>
