<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ErikAI OS - Master PDF & Document Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- html2canvas & jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
        }
        #main-viewport {
            cursor: default;
            position: relative;
            overflow: auto;
            user-select: none;
        }
        #main-viewport.pan-mode {
            cursor: grab;
        }
        #main-viewport.pan-mode:active {
            cursor: grabbing;
        }
        #main-viewport.pan-mode .canvas-element,
        #main-viewport.pan-mode .whiteout-box,
        #main-viewport.pan-mode .image-element,
        #main-viewport.pan-mode .table-element {
            pointer-events: none !important;
        }
        #canvas-wrapper {
            position: relative;
            box-shadow: 0 25px 35px -5px rgba(0, 0, 0, 0.9);
            display: inline-block;
            background: white;
            transform-origin: top left;
        }
        .canvas-element {
            position: absolute;
            cursor: move;
            border: 1px dashed rgba(239, 68, 68, 0.6);
            user-select: none;
            touch-action: none;
            box-sizing: border-box;
        }
        .canvas-element:hover, .canvas-element.selected {
            border-color: #ef4444;
            background-color: rgba(239, 68, 68, 0.08);
        }
        .whiteout-box {
            position: absolute;
            cursor: move;
            background-color: white;
            border: 1px dashed #cbd5e1;
            touch-action: none;
            box-sizing: border-box;
        }
        .whiteout-box:hover, .whiteout-box.selected {
            border-color: #3b82f6;
            background-color: rgba(255, 255, 255, 0.95);
        }
        .image-element {
            position: absolute;
            cursor: move;
            border: 1px dashed #eab308;
            touch-action: none;
            box-sizing: border-box;
        }
        .image-element img {
            width: 100%;
            height: 100%;
            pointer-events: none;
            object-fit: contain;
        }
        .image-element.selected {
            border-color: #eab308;
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.5);
        }
        .table-element {
            position: absolute;
            cursor: move;
            border: 1px dashed #10b981;
            background: white;
            touch-action: none;
            box-sizing: border-box;
        }
        .table-element.selected {
            border-color: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }
        .table-element table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            color: #000;
        }
        .table-element td, .table-element th {
            border: 1px solid #64748b;
            padding: 5px;
            text-align: left;
            font-size: 13px;
            outline: none;
        }
        .table-element td:focus, .table-element th:focus {
            background-color: rgba(16, 185, 129, 0.15);
            border-color: #10b981;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-3 sm:p-4 flex justify-between items-center flex-wrap gap-3">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-red-600 to-red-800 flex items-center justify-center font-bold text-white shadow-lg shadow-red-600/30">
                E
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-bold tracking-wide text-white">
                    ErikAI OS <span class="text-xs px-2 py-0.5 rounded bg-red-950 text-red-400 border border-red-800">Master Studio</span>
                </h1>
                <p class="text-xs text-slate-400 hidden sm:block">Profesionálny serverless PDF editor</p>
            </div>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
            <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 sm:py-2 rounded-lg border border-slate-700 transition flex items-center gap-1.5 text-xs sm:text-sm font-medium">
                📄 Nahrať PDF
                <input type="file" id="pdf-input" accept="application/pdf" class="hidden">
            </label>
            <button id="add-whiteout-btn" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition border border-slate-700 flex items-center gap-1">
                ⬜ Zakryť
            </button>
            <button id="add-text-btn" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition border border-slate-700 flex items-center gap-1">
                ✏️ Text
            </button>
            <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition border border-slate-700 flex items-center gap-1">
                🖼️ Obrázok
                <input type="file" id="image-input" accept="image/*" multiple class="hidden">
            </label>
            <button id="add-table-modal-btn" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition border border-slate-700 flex items-center gap-1">
                📊 Tabuľka
            </button>
            <button id="export-pdf-btn" class="bg-red-600 hover:bg-red-500 text-white px-3 sm:px-4 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition shadow-lg shadow-red-600/25 flex items-center gap-1.5">
                💾 Uložiť PDF
            </button>
            <button id="print-pdf-btn" class="bg-sky-600 hover:bg-sky-500 text-white px-3 sm:px-4 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition shadow-lg shadow-sky-600/25 flex items-center gap-1.5">
                🖨️ Tlač
            </button>
        </div>
    </header>

    <!-- Toolbar: Zoom, Mode & Controls -->
    <div class="bg-slate-900/90 border-b border-slate-800 px-4 py-2 flex items-center justify-between flex-wrap gap-3 text-xs">
        <div class="flex items-center gap-2 flex-wrap">
            <span class="text-slate-400 font-semibold">Nástroj:</span>
            <button id="mode-edit-btn" class="px-3 py-1 bg-red-600 text-white rounded font-medium transition shadow">✏️ Úpravy</button>
            <button id="mode-pan-btn" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded font-medium transition">✋ Posúvať (Pan)</button>
            
            <div class="h-4 w-[1px] bg-slate-700 mx-1"></div>

            <span class="text-slate-400 font-semibold">Lupa:</span>
            <button id="zoom-out-btn" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded font-bold text-white flex items-center justify-center">-</button>
            <span id="zoom-val" class="font-mono text-slate-200">100%</span>
            <button id="zoom-in-btn" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded font-bold text-white flex items-center justify-center">+</button>
            <button id="zoom-reset-btn" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-300">Reset</button>
        </div>

        <div class="flex items-center gap-3">
            <span id="page-num-display" class="font-medium text-slate-300">Strana: 0 / 0</span>
            <div class="flex items-center gap-1">
                <button id="prev-page" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded disabled:opacity-40">◄</button>
                <button id="next-page" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded disabled:opacity-40">►</button>
            </div>
        </div>
    </div>

    <!-- Workspace -->
    <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">

        <!-- Sidebar Controls & Layer Overview -->
        <aside class="w-full lg:w-80 bg-slate-900/80 border-r border-slate-800 p-4 flex flex-col gap-4 overflow-y-auto max-h-[40vh] lg:max-h-none">
            
            <!-- Inspector / Properties -->
            <div class="space-y-3 bg-slate-950/50 p-3.5 rounded-xl border border-slate-800" id="inspector-panel">
                <h2 class="text-xs uppercase tracking-wider text-slate-400 font-bold">Vlastnosti vybraného prvku</h2>
                
                <div id="no-selection" class="text-xs text-slate-500 italic py-2">
                    Kliknite na objekt na plátne pre jeho úpravu.
                </div>

                <div id="inspector-content" class="space-y-3 hidden">
                    <div id="text-prop-group">
                        <label class="text-xs text-slate-400 mb-1 block">Text:</label>
                        <input type="text" id="prop-text" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-red-500">
                    </div>

                    <div class="grid grid-cols-2 gap-2" id="font-prop-group">
                        <div>
                            <label class="text-xs text-slate-400 mb-1 block">Veľkosť:</label>
                            <input type="number" id="prop-size" min="8" max="72" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white">
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 mb-1 block">Farba textu:</label>
                            <input type="color" id="prop-color" class="w-full h-9 bg-slate-800 border border-slate-700 rounded p-1 cursor-pointer">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs text-slate-400 mb-1 block">Šírka (px):</label>
                            <input type="number" id="prop-width" min="10" max="1500" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white">
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 mb-1 block">Výška (px):</label>
                            <input type="number" id="prop-height" min="10" max="1500" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white">
                        </div>
                    </div>

                    <button id="delete-btn" class="w-full bg-red-950/60 hover:bg-red-900 border border-red-800/60 text-red-300 py-2 rounded-lg text-sm transition font-medium">
                        🗑️ Odstrániť prvok (Delete)
                    </button>
                </div>
            </div>

            <!-- Layer Manager / Overview -->
            <div class="space-y-2 bg-slate-950/50 p-3.5 rounded-xl border border-slate-800">
                <div class="flex justify-between items-center">
                    <h2 class="text-xs uppercase tracking-wider text-slate-400 font-bold">Všetky vytvorené prvky</h2>
                    <span id="elements-count" class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full font-mono">0</span>
                </div>
                <div id="layers-list" class="space-y-1.5 max-h-40 overflow-y-auto text-xs text-slate-300">
                    <p class="text-slate-500 italic">Žiadne pridané prvky na tejto strane.</p>
                </div>
            </div>
        </aside>

        <!-- Main Viewport -->
        <main id="main-viewport" class="flex-1 p-4 sm:p-6 flex justify-center items-start bg-slate-950">
            <div id="canvas-wrapper" class="relative rounded-lg overflow-hidden">
                <canvas id="pdf-render"></canvas>
            </div>
        </main>
    </div>

    <!-- Modal pre vlastnú tabuľku -->
    <div id="table-modal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 w-80 space-y-4 shadow-2xl">
            <h3 class="text-base font-bold text-white">Vytvoriť novú tabuľku</h3>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 mb-1 block">Počet riadkov:</label>
                    <input type="number" id="modal-rows" value="3" min="1" max="20" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white">
                </div>
                <div>
                    <label class="text-xs text-slate-400 mb-1 block">Počet stĺpcov:</label>
                    <input type="number" id="modal-cols" value="3" min="1" max="10" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white">
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button id="modal-cancel" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded text-sm">Zrušiť</button>
                <button id="modal-create" class="flex-1 bg-red-600 hover:bg-red-500 text-white py-2 rounded text-sm font-medium">Vytvoriť</button>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null;
        let pageNum = 1;
        let userZoom = 1.0;
        let baseScale = 1.3;
        let currentMode = 'edit';
        
        const canvas = document.getElementById('pdf-render');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');
        const viewport = document.getElementById('main-viewport');

        let pageAnnotations = {};
        let activeElement = null;

        // Mode Switching (Edit vs Pan)
        document.getElementById('mode-edit-btn').addEventListener('click', () => {
            currentMode = 'edit';
            document.getElementById('mode-edit-btn').className = "px-3 py-1 bg-red-600 text-white rounded font-medium transition shadow";
            document.getElementById('mode-pan-btn').className = "px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded font-medium transition";
            viewport.classList.remove('pan-mode');
        });

        document.getElementById('mode-pan-btn').addEventListener('click', () => {
            currentMode = 'pan';
            document.getElementById('mode-pan-btn').className = "px-3 py-1 bg-red-600 text-white rounded font-medium transition shadow";
            document.getElementById('mode-edit-btn').className = "px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded font-medium transition";
            viewport.classList.add('pan-mode');
            selectElement(null);
        });

        // Fixed Panning Logic
        let isPanning = false, startX, startY, scrollLeft, scrollTop;
        viewport.addEventListener('mousedown', (e) => {
            if (currentMode !== 'pan') return;
            isPanning = true;
            startX = e.clientX;
            startY = e.clientY;
            scrollLeft = viewport.scrollLeft;
            scrollTop = viewport.scrollTop;
        });
        window.addEventListener('mouseup', () => isPanning = false);
        window.addEventListener('mousemove', (e) => {
            if (!isPanning || currentMode !== 'pan') return;
            e.preventDefault();
            const walkX = (e.clientX - startX);
            const walkY = (e.clientY - startY);
            viewport.scrollLeft = scrollLeft - walkX;
            viewport.scrollTop = scrollTop - walkY;
        });

        // Load PDF
        document.getElementById('pdf-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.type === 'application/pdf') {
                const reader = new FileReader();
                reader.onload = function() {
                    pdfjsLib.getDocument(new Uint8Array(this.result)).promise.then((pdf) => {
                        pdfDoc = pdf;
                        pageNum = 1;
                        pageAnnotations = {};
                        renderPage(pageNum);
                    });
                };
                reader.readAsArrayBuffer(file);
            }
        });

        function renderPage(num) {
            saveAnnotations();
            pdfDoc.getPage(num).then((page) => {
                const currentScale = baseScale * userZoom;
                const pageViewport = page.getViewport({ scale: currentScale });
                
                canvas.height = pageViewport.height;
                canvas.width = pageViewport.width;
                wrapper.style.width = pageViewport.width + 'px';
                wrapper.style.height = pageViewport.height + 'px';

                page.render({ canvasContext: ctx, viewport: pageViewport }).promise.then(() => {
                    document.getElementById('page-num-display').textContent = `Strana: ${num} / ${pdfDoc.numPages}`;
                    restoreAnnotations(num);
                });
            });
        }

        // Relative Coordinate Storage (% based)
        function saveAnnotations() {
            if (!pdfDoc) return;
            const elements = wrapper.querySelectorAll('.canvas-element, .whiteout-box, .image-element, .table-element');
            const data = [];
            const wrapperWidth = wrapper.offsetWidth || 1;
            const wrapperHeight = wrapper.offsetHeight || 1;

            elements.forEach(el => {
                let type = 'whiteout';
                if (el.classList.contains('canvas-element')) type = 'text';
                if (el.classList.contains('image-element')) type = 'image';
                if (el.classList.contains('table-element')) type = 'table';

                data.push({
                    type: type,
                    text: el.dataset.rawText || el.innerText,
                    html: el.innerHTML,
                    src: el.querySelector('img') ? el.querySelector('img').src : null,
                    leftPct: (parseFloat(el.style.left) / wrapperWidth) * 100,
                    topPct: (parseFloat(el.style.top) / wrapperHeight) * 100,
                    widthPct: (parseFloat(el.style.width) / wrapperWidth) * 100,
                    heightPct: (parseFloat(el.style.height) / wrapperHeight) * 100,
                    fontSize: el.style.fontSize,
                    color: el.style.color
                });
            });
            pageAnnotations[pageNum] = data;
            updateLayersList();
        }

        function restoreAnnotations(num) {
            wrapper.querySelectorAll('.canvas-element, .whiteout-box, .image-element, .table-element').forEach(el => el.remove());
            selectElement(null);

            const saved = pageAnnotations[num] || [];
            const wrapperWidth = wrapper.offsetWidth;
            const wrapperHeight = wrapper.offsetHeight;

            saved.forEach(item => {
                const left = (item.leftPct * wrapperWidth / 100) + 'px';
                const top = (item.topPct * wrapperHeight / 100) + 'px';
                const width = (item.widthPct * wrapperWidth / 100) + 'px';
                const height = (item.heightPct * wrapperHeight / 100) + 'px';

                if (item.type === 'whiteout') {
                    createBox('whiteout-box', left, top, width, height, false);
                } else if (item.type === 'text') {
                    createText(item.text, left, top, item.fontSize, item.color, width, height, false);
                } else if (item.type === 'image') {
                    createImage(item.src, left, top, width, height, false);
                } else if (item.type === 'table') {
                    createTable(item.html, left, top, width, height, false);
                }
            });
            updateLayersList();
        }

        function updateLayersList() {
            const listContainer = document.getElementById('layers-list');
            const elements = wrapper.querySelectorAll('.canvas-element, .whiteout-box, .image-element, .table-element');
            document.getElementById('elements-count').textContent = elements.length;

            if (elements.length === 0) {
                listContainer.innerHTML = '<p class="text-slate-500 italic">Žiadne pridané prvky na tejto strane.</p>';
                return;
            }

            listContainer.innerHTML = '';
            elements.forEach((el, index) => {
                let name = `Prvok #${index + 1}`;
                let icon = '📦';
                if (el.classList.contains('canvas-element')) { icon = '✏️'; name = `Text: "${el.dataset.rawText || 'Nový text'}"`; }
                else if (el.classList.contains('whiteout-box')) { icon = '⬜'; name = 'Zakrytie (Whiteout)'; }
                else if (el.classList.contains('image-element')) { icon = '🖼️'; name = 'Obrázok / Logo'; }
                else if (el.classList.contains('table-element')) { icon = '📊'; name = 'Tabuľka'; }

                const item = document.createElement('div');
                item.className = "flex items-center justify-between bg-slate-900 p-2 rounded border border-slate-800 hover:border-slate-700 cursor-pointer";
                item.innerHTML = `<span class="truncate pr-2">${icon} ${name}</span><span class="text-[10px] text-slate-500">Upraviť</span>`;
                item.onclick = (e) => {
                    e.stopPropagation();
                    selectElement(el);
                };
                listContainer.appendChild(item);
            });
        }

        document.getElementById('add-whiteout-btn').addEventListener('click', () => {
            if (!pdfDoc) return alert('Najprv nahrajte PDF!');
            createBox('whiteout-box', '60px', '60px', '160px', '35px', true);
        });

        function createBox(className, left, top, width, height, shouldSave = true) {
            const el = document.createElement('div');
            el.className = className;
            el.style.left = left;
            el.style.top = top;
            el.style.width = width;
            el.style.height = height;
            makeInteractive(el);
            wrapper.appendChild(el);
            selectElement(el);
            if (shouldSave) saveAnnotations();
        }

        document.getElementById('add-text-btn').addEventListener('click', () => {
            if (!pdfDoc) return alert('Najprv nahrajte PDF!');
            createText('Nový text', '60px', '120px', '16px', '#000000', '180px', '35px', true);
        });

        function createText(text, left, top, fontSize, color, width, height, shouldSave = true) {
            const el = document.createElement('div');
            el.className = 'canvas-element';
            el.innerText = text;
            el.dataset.rawText = text;
            el.style.left = left;
            el.style.top = top;
            el.style.fontSize = fontSize || '16px';
            el.style.color = color || '#000000';
            if (width) el.style.width = width;
            if (height) el.style.height = height;

            makeInteractive(el);
            wrapper.appendChild(el);
            selectElement(el);
            if (shouldSave) saveAnnotations();
        }

        document.getElementById('image-input').addEventListener('change', (e) => {
            if (!pdfDoc) return alert('Najprv nahrajte PDF!');
            const files = e.target.files;
            if (files.length > 0) {
                Array.from(files).forEach((file, idx) => {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        createImage(event.target.result, (60 + idx * 20) + 'px', (180 + idx * 20) + 'px', '120px', '120px', true);
                    };
                    reader.readAsDataURL(file);
                });
            }
        });

        function createImage(src, left, top, width, height, shouldSave = true) {
            const el = document.createElement('div');
            el.className = 'image-element';
            el.style.left = left;
            el.style.top = top;
            el.style.width = width;
            el.style.height = height;

            const img = document.createElement('img');
            img.src = src;
            el.appendChild(img);

            makeInteractive(el);
            wrapper.appendChild(el);
            selectElement(el);
            if (shouldSave) saveAnnotations();
        }

        const modal = document.getElementById('table-modal');
        document.getElementById('add-table-modal-btn').addEventListener('click', () => {
            if (!pdfDoc) return alert('Najprv nahrajte PDF!');
            modal.classList.remove('hidden');
        });
        document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.add('hidden'));
        document.getElementById('modal-create').addEventListener('click', () => {
            const rows = parseInt(document.getElementById('modal-rows').value) || 3;
            const cols = parseInt(document.getElementById('modal-cols').value) || 3;
            modal.classList.add('hidden');

            let tableHTML = '<table><tr>';
            for (let c = 0; c < cols; c++) tableHTML += `<th contenteditable="true">Hlavička ${c+1}</th>`;
            tableHTML += '</tr>';
            for (let r = 0; r < rows - 1; r++) {
                tableHTML += '<tr>';
                for (let c = 0; c < cols; c++) tableHTML += `<td contenteditable="true">Údaj ${r+1},${c+1}</td>`;
                tableHTML += '</tr>';
            }
            tableHTML += '</table>';

            createTable(tableHTML, '60px', '220px', (cols * 95) + 'px', (rows * 35) + 'px', true);
        });

        function createTable(html, left, top, width, height, shouldSave = true) {
            const el = document.createElement('div');
            el.className = 'table-element';
            el.innerHTML = html;
            el.style.left = left;
            el.style.top = top;
            el.style.width = width;
            el.style.height = height;

            el.querySelectorAll('td, th').forEach(cell => {
                cell.addEventListener('mousedown', (e) => e.stopPropagation());
                cell.addEventListener('touchstart', (e) => e.stopPropagation());
                cell.addEventListener('input', () => saveAnnotations());
            });

            makeInteractive(el);
            wrapper.appendChild(el);
            selectElement(el);
            if (shouldSave) saveAnnotations();
        }

        function makeInteractive(el) {
            let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

            el.onmousedown = (e) => {
                if (currentMode === 'pan' || e.target.tagName === 'TD' || e.target.tagName === 'TH') return;
                e.preventDefault();
                e.stopPropagation();
                selectElement(el);
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = parseFloat(el.style.left);
                initialTop = parseFloat(el.style.top);

                document.onmousemove = (e) => {
                    el.style.left = (initialLeft + (e.clientX - startX)) + 'px';
                    el.style.top = (initialTop + (e.clientY - startY)) + 'px';
                };
                document.onmouseup = () => {
                    document.onmousemove = null;
                    document.onmouseup = null;
                    saveAnnotations();
                };
            };

            el.ontouchstart = (e) => {
                if (currentMode === 'pan' || e.target.tagName === 'TD' || e.target.tagName === 'TH') return;
                e.stopPropagation();
                selectElement(el);
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                initialLeft = parseFloat(el.style.left);
                initialTop = parseFloat(el.style.top);

                document.ontouchmove = (e) => {
                    const touchMove = e.touches[0];
                    el.style.left = (initialLeft + (touchMove.clientX - startX)) + 'px';
                    el.style.top = (initialTop + (touchMove.clientY - startY)) + 'px';
                };
                document.ontouchend = () => {
                    document.ontouchmove = null;
                    document.ontouchend = null;
                    saveAnnotations();
                };
            };
        }

        wrapper.addEventListener('click', () => {
            if (currentMode === 'edit') selectElement(null);
        });

        function selectElement(el) {
            wrapper.querySelectorAll('.canvas-element, .whiteout-box, .image-element, .table-element').forEach(item => item.classList.remove('selected'));
            activeElement = el;

            const inspector = document.getElementById('inspector-content');
            const noSelection = document.getElementById('no-selection');
            const textGroup = document.getElementById('text-prop-group');
            const fontGroup = document.getElementById('font-prop-group');

            if (el) {
                el.classList.add('selected');
                inspector.classList.remove('hidden');
                noSelection.classList.add('hidden');

                document.getElementById('prop-width').value = Math.round(parseFloat(el.style.width));
                document.getElementById('prop-height').value = Math.round(parseFloat(el.style.height));

                if (el.classList.contains('canvas-element')) {
                    textGroup.style.display = 'block';
                    fontGroup.style.display = 'grid';
                    document.getElementById('prop-text').value = el.dataset.rawText || el.innerText;
                    document.getElementById('prop-size').value = parseInt(el.style.fontSize) || 16;
                    document.getElementById('prop-color').value = rgbToHex(window.getComputedStyle(el).color);
                } else {
                    textGroup.style.display = 'none';
                    fontGroup.style.display = 'none';
                }
            } else {
                inspector.classList.add('hidden');
                noSelection.classList.remove('hidden');
            }
        }

        document.getElementById('prop-text').addEventListener('input', (e) => {
            if (activeElement && activeElement.classList.contains('canvas-element')) {
                activeElement.innerText = e.target.value;
                activeElement.dataset.rawText = e.target.value;
                updateLayersList();
                saveAnnotations();
            }
        });
        document.getElementById('prop-size').addEventListener('input', (e) => {
            if (activeElement && activeElement.classList.contains('canvas-element')) {
                activeElement.style.fontSize = e.target.value + 'px';
                saveAnnotations();
            }
        });
        document.getElementById('prop-color').addEventListener('input', (e) => {
            if (activeElement && activeElement.classList.contains('canvas-element')) {
                activeElement.style.color = e.target.value;
                saveAnnotations();
            }
        });
        document.getElementById('prop-width').addEventListener('input', (e) => {
            if (activeElement) {
                activeElement.style.width = e.target.value + 'px';
                saveAnnotations();
            }
        });
        document.getElementById('prop-height').addEventListener('input', (e) => {
            if (activeElement) {
                activeElement.style.height = e.target.value + 'px';
                saveAnnotations();
            }
        });
        document.getElementById('delete-btn').addEventListener('click', () => {
            if (activeElement) {
                activeElement.remove();
                selectElement(null);
                saveAnnotations();
            }
        });

        window.addEventListener('keydown', (e) => {
            if ((e.key === 'Delete' || e.key === 'Backspace') && activeElement && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TD' && document.activeElement.tagName !== 'TH') {
                activeElement.remove();
                selectElement(null);
                saveAnnotations();
            }
        });

        document.getElementById('zoom-in-btn').addEventListener('click', () => {
            if (!pdfDoc) return;
            userZoom += 0.15;
            document.getElementById('zoom-val').textContent = Math.round(userZoom * 100) + '%';
            renderPage(pageNum);
        });
        document.getElementById('zoom-out-btn').addEventListener('click', () => {
            if (!pdfDoc || userZoom <= 0.4) return;
            userZoom -= 0.15;
            document.getElementById('zoom-val').textContent = Math.round(userZoom * 100) + '%';
            renderPage(pageNum);
        });
        document.getElementById('zoom-reset-btn').addEventListener('click', () => {
            if (!pdfDoc) return;
            userZoom = 1.0;
            document.getElementById('zoom-val').textContent = '100%';
            renderPage(pageNum);
        });

        document.getElementById('prev-page').addEventListener('click', () => { if (pageNum > 1) renderPage(--pageNum); });
        document.getElementById('next-page').addEventListener('click', () => { if (pdfDoc && pageNum < pdfDoc.numPages) renderPage(++pageNum); });

        // Presný Export bez Orezania a pri Zoom 100%
        document.getElementById('export-pdf-btn').addEventListener('click', async () => {
            if (!pdfDoc) return alert('Najprv nahrajte PDF!');
            saveAnnotations();
            selectElement(null);

            const oldZoom = userZoom;
            userZoom = 1.0;
            
            const { jsPDF } = window.jspdf;

            for (let i = 1; i <= pdfDoc.numPages; i++) {
                await new Promise((resolve) => {
                    pageNum = i;
                    renderPage(i);
                    setTimeout(async () => {
                        const canvasCap = await html2canvas(wrapper, { scale: 2, useCORS: true, logging: false });
                        const imgData = canvasCap.toDataURL('image/jpeg', 0.98);
                        
                        if (i === 1) {
                            window.generatedPdf = new jsPDF({
                                orientation: wrapper.offsetWidth > wrapper.offsetHeight ? 'landscape' : 'portrait',
                                unit: 'px',
                                format: [wrapper.offsetWidth, wrapper.offsetHeight]
                            });
                        } else {
                            window.generatedPdf.addPage([wrapper.offsetWidth, wrapper.offsetHeight]);
                        }
                        window.generatedPdf.addImage(imgData, 'JPEG', 0, 0, wrapper.offsetWidth, wrapper.offsetHeight);
                        resolve();
                    }, 400);
                });
            }

            window.generatedPdf.save('ErikAI_OS_Master_Dokument.pdf');
            userZoom = oldZoom;
            renderPage(pageNum);
        });

        document.getElementById('print-pdf-btn').addEventListener('click', async () => {
            if (!pdfDoc) return alert('Najprv nahrajte PDF!');
            saveAnnotations();
            selectElement(null);

            const oldZoom = userZoom;
            userZoom = 1.0;
            renderPage(pageNum);

            setTimeout(async () => {
                const canvasCap = await html2canvas(wrapper, { scale: 2, useCORS: true });
                const imgData = canvasCap.toDataURL('image/png');
                const w = window.open('', '_blank');
                w.document.write(`<html><head><title>Tlač - ErikAI OS</title></head><body style="margin:0;display:flex;justify-content:center;"><img style="max-width:100%;" src="${imgData}" onload="window.print();window.close();"/></body></html>`);
                w.document.close();
                
                userZoom = oldZoom;
                renderPage(pageNum);
            }, 400);
        });

        function rgbToHex(rgb) {
            if (/^#/.test(rgb)) return rgb;
            const m = rgb.match(/\d+/g);
            return m ? "#" + m.slice(0, 3).map(x => (+x).toString(16).padStart(2, '0')).join('') : '#000000';
        }
    </script>
</body>
</html>
