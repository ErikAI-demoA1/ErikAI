<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErikAI COC</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #6ab04c;
      overflow: hidden;
    }

    #gameTitle {
      text-align: center;
      background-color: #2f3640;
      color: white;
      padding: 10px;
      margin: 0;
      font-size: 28px;
    }

    #gameArea {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(to top, #4cd137, #44bd32);
      overflow: hidden;
      cursor: pointer;
    }

    .building {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 10px;
      border: 2px solid #000;
      transform: perspective(600px) rotateX(25deg);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .building:hover {
      transform: perspective(600px) rotateX(25deg) scale(1.1);
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    /* 🎨 Farby jednotlivých budov */
    .townhall { background: #d35400; }
    .cannon { background: #718093; }
    .goldstorage { background: #fbc531; }
    .goldmine { background: #e1b12c; }
    .elixirstorage { background: #8c7ae6; }
    .elixirmine { background: #9c88ff; }
    .armycamp { background: #44bd32; }

    #infoBox {
      position: absolute;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      pointer-events: none;
      font-size: 14px;
      z-index: 10;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1 id="gameTitle">ErikAI COC</h1>
  <div id="gameArea"></div>

  <div id="infoBox" class="hidden"></div>

  <script>
    const gameArea = document.getElementById('gameArea');
    const infoBox = document.getElementById('infoBox');

    // 🏠 Zoznam budov s pozíciou a kódom
    const buildings = [
      { id: "townhall", name: "Town Hall", x: 400, y: 250, class: "townhall" },
      { id: "cannon", name: "Cannon", x: 550, y: 300, class: "cannon" },
      { id: "goldmine", name: "Gold Mine", x: 300, y: 350, class: "goldmine" },
      { id: "goldstorage", name: "Gold Storage", x: 480, y: 150, class: "goldstorage" },
      { id: "elixirmine", name: "Elixir Mine", x: 620, y: 220, class: "elixirmine" },
      { id: "elixirstorage", name: "Elixir Storage", x: 350, y: 180, class: "elixirstorage" },
      { id: "armycamp", name: "Army Camp", x: 200, y: 400, class: "armycamp" }
    ];

    // 🏗️ Generovanie budov
    buildings.forEach(b => {
      const el = document.createElement('div');
      el.className = 'building ' + b.class;
      el.style.left = b.x + 'px';
      el.style.top = b.y + 'px';
      el.dataset.name = b.name;
      el.dataset.id = b.id;
      gameArea.appendChild(el);
    });

    // 🖱️ Klik na budovu → zobrazí názov
    gameArea.addEventListener('click', (e) => {
      if (e.target.classList.contains('building')) {
        infoBox.textContent = e.target.dataset.name + " (" + e.target.dataset.id + ")";
        infoBox.style.left = e.pageX + 'px';
        infoBox.style.top = e.pageY - 30 + 'px';
        infoBox.classList.remove('hidden');
      } else {
        infoBox.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
