<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI Mobile Clash</title>
<style>
  body { margin:0; overflow:hidden; background:#000; touch-action:none; user-select:none; }
  canvas { display:block; background:#f7d94c; }
  #joystick {
    position: fixed; bottom: 60px; left: 60px; width: 120px; height: 120px;
    border-radius: 50%; background: rgba(255,255,255,0.1); border:2px solid white; touch-action:none;
  }
  #joyKnob {
    width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,0.3);
    position:absolute; left:35px; top:35px;
  }
  #attackBtn {
    position: fixed; bottom: 80px; right: 80px;
    width: 100px; height: 100px; border-radius: 50%;
    font-size: 20px; background:red; color:white;
  }
  #restartBtn {
    display:none;
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    padding: 20px 40px;
    font-size: 24px; border:none; border-radius:20px;
    background:green; color:white;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="joystick"><div id="joyKnob"></div></div>
<button id="attackBtn">ÚTOK</button>
<button id="restartBtn">🔁 Reštartovať</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const mapSize = 6000;
const wallCount = 200;
const itemCount = 8;

let player, enemies, walls, items, trophies, decorations;

function initGame() {
  player = { x: mapSize/2, y: mapSize/2, size:30, speed:5, hp:100, maxHp:100, alive:true };
  enemies = [];
  walls = [];
  items = [];
  decorations = [];
  trophies = parseInt(localStorage.getItem("trophies")) || 0;

  for(let i=0;i<wallCount;i++){
    walls.push({
      x:Math.random()*mapSize,
      y:Math.random()*mapSize,
      w:60+Math.random()*40,
      h:20+Math.random()*20
    });
  }

  const itemTypes=["sword","shield"];
  for(let i=0;i<itemCount;i++){
    items.push({
      x:Math.random()*mapSize,
      y:Math.random()*mapSize,
      type:itemTypes[Math.floor(Math.random()*itemTypes.length)]
    });
  }

  spawnDecoration();
  document.getElementById("restartBtn").style.display = "none";
}

initGame();

let keys={}, moveX=0, moveY=0;
window.addEventListener("keydown", e=>keys[e.key]=true);
window.addEventListener("keyup", e=>keys[e.key]=false);

let joystick = document.getElementById("joystick");
let joyKnob = document.getElementById("joyKnob");
let activePointer = null;
let rect = null;

joystick.addEventListener("pointerdown", e=>{
  activePointer = e.pointerId;
  rect = joystick.getBoundingClientRect();
  joystick.setPointerCapture(e.pointerId);
});
joystick.addEventListener("pointermove", e=>{
  if(activePointer!==e.pointerId) return;
  const dx = e.clientX - (rect.left + rect.width/2);
  const dy = e.clientY - (rect.top + rect.height/2);
  const mag = Math.min(40, Math.hypot(dx,dy));
  const nx = dx/mag||0;
  const ny = dy/mag||0;
  joyKnob.style.transform = `translate(${nx*mag}px,${ny*mag}px)`;
  moveX = nx; moveY = ny;
});
joystick.addEventListener("pointerup", e=>{
  if(activePointer!==e.pointerId) return;
  joystick.releasePointerCapture(e.pointerId);
  activePointer=null;
  joyKnob.style.transform = 'translate(0,0)';
  moveX=0; moveY=0;
});

document.getElementById("attackBtn").addEventListener("touchstart", attack);
window.addEventListener("keydown", e=>{if(e.key===" ") attack();});

function movePlayer(){
  if(!player.alive) return;
  let newX = player.x + (keys["a"]?-player.speed:0) + (keys["d"]?player.speed:0) + moveX*player.speed;
  let newY = player.y + (keys["w"]?-player.speed:0) + (keys["s"]?player.speed:0) + moveY*player.speed;

  newX = Math.max(0, Math.min(mapSize-player.size, newX));
  newY = Math.max(0, Math.min(mapSize-player.size, newY));

  let collision = walls.some(w=> newX< w.x + w.w && newX+player.size> w.x && newY< w.y+w.h && newY+player.size> w.y);
  if(!collision){
    player.x = newX;
    player.y = newY;
  }

  decorations.forEach((d)=>{
    if(!d.used && Math.abs(player.x - d.x)<35 && Math.abs(player.y - d.y)<35){
      d.used = true;
      player.hp = Math.min(player.maxHp, player.hp + 30);
    }
  });
}

function spawnEnemy(){
  enemies.push({
    x: Math.random()*mapSize,
    y: Math.random()*mapSize,
    size:30,
    speed:1.8 + Math.random()*1.5,
    hp:30,
    alive:true,
    attackCooldown:0
  });
}
setInterval(spawnEnemy, 2000 + Math.random()*1000);

function spawnDecoration(){
  const colors = ["#00ff99", "#33ccff", "#ff6699", "#ffee33"];
  const shapes = ["circle","square","star"];
  decorations.push({
    x: Math.random()*mapSize,
    y: Math.random()*mapSize,
    color: colors[Math.floor(Math.random()*colors.length)],
    shape: shapes[Math.floor(Math.random()*shapes.length)],
    used:false,
    angle:0
  });
}
setInterval(spawnDecoration, 12000);

function moveEnemies(){
  enemies.forEach(e=>{
    if(!e.alive) return;
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);
    if(dist>5){
      e.x += dx/dist*e.speed;
      e.y += dy/dist*e.speed;
    }
    if(dist < 40 && e.attackCooldown<=0 && player.alive){
      player.hp -= 10;
      e.attackCooldown = 50;
      if(player.hp<=0){
        player.hp = 0;
        player.alive = false;
        let lose = 30 + Math.floor(Math.random()*21);
        trophies = Math.max(0, trophies - lose);
        localStorage.setItem("trophies", trophies);
        document.getElementById("restartBtn").style.display = "block";
      }
    }
    e.attackCooldown--;
  });
}

function drawStar(x, y, r, color){
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.moveTo(0, -r);
  for(let i=0; i<5; i++){
    ctx.lineTo(Math.cos((i*72+36)*Math.PI/180)*r*0.5, Math.sin((i*72+36)*Math.PI/180)*r*0.5);
    ctx.lineTo(Math.cos((i*72+72)*Math.PI/180)*r, Math.sin((i*72+72)*Math.PI/180)*r);
  }
  ctx.closePath();
  ctx.fillStyle=color;
  ctx.shadowColor=color;
  ctx.shadowBlur=20;
  ctx.fill();
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const camX = player.x - canvas.width/2;
  const camY = player.y - canvas.height/2;

  ctx.fillStyle="#f7d94c";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // zelené hranice
  ctx.strokeStyle="green";
  ctx.lineWidth=15;
  ctx.strokeRect(-camX, -camY, mapSize, mapSize);

  // steny
  ctx.fillStyle="#8b5a2b";
  walls.forEach(w=>{
    const x = w.x - camX, y = w.y - camY;
    if(x+w.w>0 && x<canvas.width && y+w.h>0 && y<canvas.height)
      ctx.fillRect(x,y,w.w,w.h);
  });

  // dekorácie
  decorations.forEach(d=>{
    if(!d.used){
      const x = d.x - camX;
      const y = d.y - camY;
      ctx.shadowColor=d.color;
      ctx.shadowBlur=20;
      ctx.fillStyle=d.color;
      if(d.shape==="circle"){
        ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI*2); ctx.fill();
      } else if(d.shape==="square"){
        ctx.fillRect(x-20, y-20, 40, 40);
      } else {
        drawStar(x, y, 25, d.color);
      }
    }
  });

  // itemy
  items.forEach(i=>{
    const x=i.x-camX, y=i.y-camY;
    ctx.fillStyle = i.type==="sword"?"silver":"lightblue";
    ctx.beginPath(); ctx.arc(x,y,15,0,Math.PI*2); ctx.fill();
  });

  // hráč
  if(player.alive){
    ctx.fillStyle="red";
    ctx.fillRect(player.x-camX, player.y-camY, player.size, player.size);
    ctx.fillStyle="green";
    ctx.fillRect(player.x-camX, player.y-camY-10, player.size*(player.hp/player.maxHp),5);
  } else {
    ctx.fillStyle="black";
    ctx.font="60px Arial";
    ctx.fillText("☠️ KONIEC HRY ☠️", canvas.width/2-200, canvas.height/2);
  }

  // nepriatelia
  enemies.forEach(e=>{
    if(e.alive){
      const x = e.x-camX, y = e.y-camY;
      ctx.fillStyle="purple";
      ctx.fillRect(x,y,e.size,e.size);
      ctx.fillStyle="green";
      ctx.fillRect(x, y-8, e.size*(e.hp/30), 4);
    }
  });

  ctx.fillStyle="black";
  ctx.font="20px Arial";
  ctx.fillText(`🏆 Trofeje: ${trophies}`, 20, 30);
  ctx.fillText(`❤️ HP: ${player.hp}`, 20, 60);
}

function attack(){
  if(!player.alive) return;
  enemies.forEach(e=>{
    if(!e.alive) return;
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    if(Math.hypot(dx,dy)<50){
      e.hp -= 20;
      if(e.hp<=0){
        e.alive=false;
        trophies += Math.floor(Math.random()*15)+1;
        localStorage.setItem("trophies", trophies);
      }
    }
  });
}

document.getElementById("restartBtn").addEventListener("click", ()=>{
  initGame();
});

function loop(){
  movePlayer();
  moveEnemies();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
