<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ErikAI Mobile Battle (2.5D)</title>
<style>
  :root{--yellow:#f6e58d}
  body{
    margin:0;
    font-family:Inter,Arial,sans-serif;
    background:#222;
    color:#fff;
    overflow:hidden;
    -webkit-user-select:none;
    user-select:none;
  }
  header{
    position:fixed;
    top:0;left:0;right:0;
    background:#111;
    box-shadow:0 2px 6px rgba(0,0,0,0.6);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    padding:10px;
    z-index:100;
    font-size:15px;
  }
  input,select,button{
    padding:8px 10px;
    border-radius:8px;
    border:none;
    font-size:15px;
  }
  input{
    width:160px;
    text-align:center;
    background:#000;
    color:#fff;
  }
  select,button{
    background:#333;
    color:#fff;
  }
  button{cursor:pointer}
  #arena{
    position:fixed;
    top:130px;bottom:0;left:0;right:0;
    background:var(--yellow);
    border-radius:10px;
    margin:6px;
    overflow:hidden;
    box-shadow:inset 0 0 10px rgba(0,0,0,0.3);
  }
  .entity{
    position:absolute;
    width:48px;height:48px;
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-weight:bold;color:#fff;
    transform-origin:center bottom;
    transform:perspective(800px) rotateX(25deg);
  }
  .player{background:#e74c3c;border:3px solid #b83b2f;z-index:30}
  .enemy{background:#2980b9;border:3px solid #1f5f8a;z-index:20}
  .hpBar{
    position:absolute;
    bottom:calc(100% + 4px);
    left:50%;
    transform:translateX(-50%);
    width:50px;height:6px;
    background:rgba(0,0,0,0.4);
    border-radius:6px;overflow:hidden;
  }
  .hpFill{height:100%;background:linear-gradient(90deg,#2ecc71,#27ae60);width:100%}
  #joystick{
    position:fixed;
    left:10px;bottom:10px;
    width:120px;height:120px;
    border-radius:50%;
    background:rgba(0,0,0,0.2);
    display:flex;align-items:center;justify-content:center;
    z-index:90;
  }
  #joyKnob{
    width:50px;height:50px;
    border-radius:50%;
    background:rgba(0,0,0,0.5);
  }
  #uiPanel{
    position:fixed;
    right:10px;bottom:10px;
    display:flex;flex-direction:column;gap:8px;z-index:90;
  }
  .controlBtn{
    padding:12px 16px;
    background:#333;
    border:none;border-radius:8px;
    font-weight:bold;
  }
  #bottomMsg{
    position:fixed;
    bottom:5px;left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.6);
    padding:6px 12px;
    border-radius:8px;
    font-size:13px;
    z-index:200;
  }
</style>
</head>
<body>

<header>
  <div>
    <input id="nameInput" type="text" placeholder="Tvoje meno">
    <button id="saveName">Uložiť</button>
  </div>
  <div>
    🏆 <span id="trophies">0</span> | Mód:
    <select id="modeSelect">
      <option value="1">1 hráč</option>
      <option value="2">2 hráči</option>
      <option value="3">3 hráči</option>
      <option value="4">4 hráči</option>
      <option value="5" selected>5 hráčov</option>
    </select>
  </div>
  <div style="display:flex;gap:8px;">
    <button id="startBtn">Štart</button>
    <button id="clearBtn" style="background:#a33">Reset</button>
  </div>
</header>

<div id="arena"></div>
<div id="joystick"><div id="joyKnob"></div></div>
<div id="uiPanel">
  <button id="attackBtn" class="controlBtn">ÚTOK</button>
</div>
<div id="bottomMsg" style="display:none"></div>

<script>
const arena=document.getElementById('arena');
const trophiesEl=document.getElementById('trophies');
const nameInput=document.getElementById('nameInput');
const saveName=document.getElementById('saveName');
const startBtn=document.getElementById('startBtn');
const clearBtn=document.getElementById('clearBtn');
const modeSelect=document.getElementById('modeSelect');
const attackBtn=document.getElementById('attackBtn');
const JOY=document.getElementById('joystick'),KNOB=document.getElementById('joyKnob');
const bottomMsg=document.getElementById('bottomMsg');
const SAVE_KEY='erikai_mobile_save';
let state={name:'',trophies:0,player:{x:200,y:200,hp:100,maxHp:100},enemies:[],mode:1};

//=== SAVE / LOAD ===
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(state));}
function load(){let r=localStorage.getItem(SAVE_KEY);if(r){state=JSON.parse(r);}}
function clearAll(){localStorage.removeItem(SAVE_KEY);location.reload();}

//=== UI ===
function msg(t){bottomMsg.textContent=t;bottomMsg.style.display='block';setTimeout(()=>bottomMsg.style.display='none',1500);}
function updateUI(){trophiesEl.textContent=state.trophies;nameInput.value=state.name||'';modeSelect.value=state.mode;}
saveName.onclick=()=>{if(nameInput.value.trim()){state.name=nameInput.value.trim();save();msg('Meno uložené');}}

//=== Player ===
let playerEl;
function ensurePlayer(){
  if(!playerEl){
    playerEl=document.createElement('div');
    playerEl.className='entity player';
    playerEl.innerHTML='<div class="hpBar"><div class="hpFill"></div></div>';
    arena.appendChild(playerEl);
  }
}

//=== Enemies ===
function spawnEnemies(count){
  state.enemies=[];
  for(let i=0;i<count;i++){
    state.enemies.push({id:'e'+i,x:Math.random()*arena.clientWidth*0.8+40,y:Math.random()*arena.clientHeight*0.7+60,hp:60,maxHp:60});
  }
}

//=== Attack ===
function attack(){
  let hit=false;
  for(const e of state.enemies){
    const d=Math.hypot(state.player.x-e.x,state.player.y-e.y);
    if(d<60){e.hp-=30;hit=true;if(e.hp<=0)e.dead=true;}
  }
  state.enemies=state.enemies.filter(e=>!e.dead);
  if(hit)msg('Zásah!');
  if(state.enemies.length===0){
    const add=Math.floor(Math.random()*15)+1;
    state.trophies+=add;
    msg('Výhra! +'+add+'🏆');
    save();
  }
}

//=== Movement ===
let input={x:0,y:0};
let activePointer=null,rect;
JOY.addEventListener('pointerdown',e=>{
  activePointer=e.pointerId;rect=JOY.getBoundingClientRect();JOY.setPointerCapture(e.pointerId);
});
JOY.addEventListener('pointermove',e=>{
  if(activePointer!==e.pointerId)return;
  const dx=e.clientX-(rect.left+rect.width/2),dy=e.clientY-(rect.top+rect.height/2);
  const mag=Math.min(40,Math.hypot(dx,dy));
  const nx=dx/mag||0,ny=dy/mag||0;
  KNOB.style.transform=`translate(${nx*mag}px,${ny*mag}px)`;
  input.x=nx;input.y=ny;
});
JOY.addEventListener('pointerup',e=>{
  if(activePointer!==e.pointerId)return;
  JOY.releasePointerCapture(e.pointerId);activePointer=null;KNOB.style.transform='translate(0,0)';
  input.x=input.y=0;
});

//=== Battle ===
startBtn.onclick=()=>{
  state.mode=parseInt(modeSelect.value);
  spawnEnemies(state.mode);
  msg('Súperi: '+state.mode);
  save();
};
clearBtn.onclick=()=>{if(confirm('Vymazať dáta?'))clearAll();}
attackBtn.onclick=attack;

//=== Loop ===
function loop(){
  ensurePlayer();
  state.player.x+=input.x*3;
  state.player.y+=input.y*3;
  state.player.x=Math.max(20,Math.min(arena.clientWidth-20,state.player.x));
  state.player.y=Math.max(20,Math.min(arena.clientHeight-20,state.player.y));

  // enemies follow player
  for(const e of state.enemies){
    const dx=state.player.x-e.x,dy=state.player.y-e.y,d=Math.hypot(dx,dy);
    if(d>25){e.x+=dx/d*1.2;e.y+=dy/d*1.2;}
  }

  // draw player
  playerEl.style.left=(state.player.x-24)+'px';
  playerEl.style.top=(state.player.y-40)+'px';
  playerEl.querySelector('.hpFill').style.width=(state.player.hp/state.player.maxHp*100)+'%';

  // enemies render
  const existing=new Map();
  arena.querySelectorAll('.enemy').forEach(el=>existing.set(el.dataset.id,el));
  for(const e of state.enemies){
    let el=existing.get(e.id);
    if(!el){
      el=document.createElement('div');
      el.className='entity enemy';
      el.dataset.id=e.id;
      el.innerHTML='<div class="hpBar"><div class="hpFill"></div></div>';
      arena.appendChild(el);
    }
    el.style.left=(e.x-24)+'px';
    el.style.top=(e.y-40)+'px';
    el.querySelector('.hpFill').style.width=(e.hp/e.maxHp*100)+'%';
    existing.delete(e.id);
  }
  existing.forEach(el=>el.remove());

  requestAnimationFrame(loop);
}

//=== Init ===
load();
ensurePlayer();
updateUI();
save();
loop();
</script>
</body>
        </html>
