<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>2.5D Demo - Izometrická mapa</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { margin:0; overflow:hidden; background:#1a1a1a; }
    canvas { display:block; margin:0 auto; background:#2c3e50; }
  </style>
</head>
<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// === Nastavenia mapy ===
const tileWidth = 64;
const tileHeight = 32;
const mapWidth = 10;
const mapHeight = 10;

// === Zoznam budov ===
const buildings = [];

// === Prekreslenie mapy ===
function drawMap() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Izometrická mriežka
  for (let y = 0; y < mapHeight; y++) {
    for (let x = 0; x < mapWidth; x++) {
      const screenX = (x - y) * (tileWidth / 2) + canvas.width / 2;
      const screenY = (x + y) * (tileHeight / 2) + 100;
      drawTile(screenX, screenY, "#4e7d52");
    }
  }

  // Budovy (vykresli podľa Y aby sa správne prekrývali)
  buildings.sort((a,b) => a.y - b.y);
  for (const b of buildings) {
    const sx = (b.x - b.y) * (tileWidth / 2) + canvas.width / 2;
    const sy = (b.x + b.y) * (tileHeight / 2) + 100;
    drawBuilding(sx, sy);
  }
}

// === Funkcia: nakresli dlaždicu ===
function drawTile(x, y, color) {
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + tileWidth/2, y + tileHeight/2);
  ctx.lineTo(x, y + tileHeight);
  ctx.lineTo(x - tileWidth/2, y + tileHeight/2);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = "#2c2c2c";
  ctx.stroke();
}

// === Funkcia: nakresli budovu ===
function drawBuilding(x, y) {
  // spodok
  ctx.fillStyle = "#8e44ad";
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + tileWidth/2, y + tileHeight/2);
  ctx.lineTo(x, y + tileHeight);
  ctx.lineTo(x - tileWidth/2, y + tileHeight/2);
  ctx.closePath();
  ctx.fill();

  // "steny" budovy
  ctx.fillStyle = "#9b59b6";
  ctx.fillRect(x - tileWidth/4, y - 40, tileWidth/2, 40);

  // strecha
  ctx.beginPath();
  ctx.moveTo(x - tileWidth/4, y - 40);
  ctx.lineTo(x + tileWidth/4, y - 40);
  ctx.lineTo(x, y - 60);
  ctx.closePath();
  ctx.fillStyle = "#c39bd3";
  ctx.fill();
}

// === Funkcia: zisti kliknuté dlaždice ===
canvas.addEventListener("click", (e) => {
  const mx = e.clientX - canvas.width/2;
  const my = e.clientY - 100;

  const isoY = ((my / (tileHeight / 2)) - (mx / (tileWidth / 2))) / 2;
  const isoX = ((my / (tileHeight / 2)) + (mx / (tileWidth / 2))) / 2;

  const tx = Math.floor(isoX);
  const ty = Math.floor(isoY);

  if (tx >= 0 && ty >= 0 && tx < mapWidth && ty < mapHeight) {
    buildings.push({x: tx, y: ty});
    drawMap();
  }
});

// === Počiatočné vykreslenie ===
drawMap();

</script>
</body>
</html>
