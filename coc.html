<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErikAI COC</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #2f3640;
      overflow: hidden;
      touch-action: none;
    }

    #gameTitle {
      text-align: center;
      background-color: #353b48;
      color: white;
      padding: 10px;
      margin: 0;
      font-size: 26px;
      position: fixed;
      width: 100%;
      z-index: 100;
    }

    #viewport {
      position: absolute;
      top: 50px;
      left: 0;
      width: 100%;
      height: calc(100vh - 50px);
      overflow: hidden;
    }

    #gameArea {
      position: absolute;
      width: 2000px;
      height: 2000px;
      background: linear-gradient(to top, #44bd32, #6ab04c);
      transform-origin: center center;
      cursor: grab;
    }

    .building {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 10px;
      border: 2px solid #000;
      transform: perspective(600px) rotateX(25deg);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .building:hover {
      transform: perspective(600px) rotateX(25deg) scale(1.1);
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    /* 🎨 Farby budov */
    .townhall { background: #d35400; }
    .cannon { background: #718093; }
    .goldstorage { background: #fbc531; }
    .goldmine { background: #e1b12c; }
    .elixirstorage { background: #8c7ae6; }
    .elixirmine { background: #9c88ff; }
    .armycamp { background: #44bd32; }

    #infoBox {
      position: fixed;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      pointer-events: none;
      font-size: 14px;
      z-index: 200;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1 id="gameTitle">ErikAI COC</h1>
  <div id="viewport">
    <div id="gameArea"></div>
  </div>
  <div id="infoBox" class="hidden"></div>

  <script>
    const gameArea = document.getElementById('gameArea');
    const infoBox = document.getElementById('infoBox');

    // 📍 Zoznam budov (viac rozmiestnených)
    const buildings = [
      { id: "townhall", name: "Town Hall", x: 900, y: 900, class: "townhall" },
      { id: "cannon", name: "Cannon", x: 1000, y: 950, class: "cannon" },
      { id: "goldmine", name: "Gold Mine", x: 800, y: 1000, class: "goldmine" },
      { id: "goldstorage", name: "Gold Storage", x: 1100, y: 850, class: "goldstorage" },
      { id: "elixirmine", name: "Elixir Mine", x: 700, y: 800, class: "elixirmine" },
      { id: "elixirstorage", name: "Elixir Storage", x: 950, y: 750, class: "elixirstorage" },
      { id: "armycamp", name: "Army Camp", x: 1200, y: 1000, class: "armycamp" }
    ];

    // 🏗️ Generovanie budov
    buildings.forEach(b => {
      const el = document.createElement('div');
      el.className = 'building ' + b.class;
      el.style.left = b.x + 'px';
      el.style.top = b.y + 'px';
      el.dataset.name = b.name;
      el.dataset.id = b.id;
      gameArea.appendChild(el);
    });

    // 📦 Premenné pre zoom a pohyb
    let scale = 1;
    let posX = -500, posY = -500;
    let dragging = false;
    let startX, startY;

    function updateTransform() {
      gameArea.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    }
    updateTransform();

    // 🖱️ Zoom kolieskom
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomSpeed = 0.1;
      if (e.deltaY < 0) scale += zoomSpeed;
      else scale -= zoomSpeed;
      scale = Math.min(Math.max(0.4, scale), 2.5);
      updateTransform();
    });

    // 👆 Ťahanie mapy myšou
    gameArea.addEventListener('mousedown', (e) => {
      dragging = true;
      startX = e.clientX - posX;
      startY = e.clientY - posY;
      gameArea.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
      dragging = false;
      gameArea.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      posX = e.clientX - startX;
      posY = e.clientY - startY;
      updateTransform();
    });

    // 📱 Dotykové ovládanie (telefón)
    let touchStartDist = 0;
    let lastScale = 1;
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        touchStartDist = Math.hypot(dx, dy);
        lastScale = scale;
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        scale = lastScale * (dist / touchStartDist);
        scale = Math.min(Math.max(0.4, scale), 2.5);
        updateTransform();
      }
    }, { passive: false });

    // 🖱️ Klik na budovu → názov
    gameArea.addEventListener('click', (e) => {
      if (e.target.classList.contains('building')) {
        infoBox.textContent = e.target.dataset.name + " (" + e.target.dataset.id + ")";
        infoBox.style.left = e.pageX + 'px';
        infoBox.style.top = e.pageY - 40 + 'px';
        infoBox.classList.remove('hidden');
      } else {
        infoBox.classList.add('hidden');
      }
    });
  </script>
</body>
  </html>
