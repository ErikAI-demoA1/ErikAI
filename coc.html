<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErikAI COC</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #2f3640;
      overflow: hidden;
      touch-action: none;
    }

    #gameTitle {
      text-align: center;
      background-color: #353b48;
      color: white;
      padding: 10px;
      margin: 0;
      font-size: 26px;
      position: fixed;
      width: 100%;
      z-index: 100;
    }

    #resetBtn {
      position: fixed;
      top: 10px;
      right: 20px;
      background: #718093;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
      z-index: 101;
    }

    #resetBtn:hover {
      background: #9c88ff;
    }

    #viewport {
      position: absolute;
      top: 50px;
      left: 0;
      width: 100%;
      height: calc(100vh - 50px);
      overflow: hidden;
    }

    #gameArea {
      position: absolute;
      width: 2000px;
      height: 2000px;
      background: linear-gradient(to top, #44bd32, #6ab04c);
      transform-origin: center center;
      cursor: grab;
    }

    .building {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 10px;
      border: 2px solid #000;
      transform: perspective(600px) rotateX(25deg);
      transition: transform 0.1s, box-shadow 0.1s;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000;
    }

    .building:hover {
      transform: perspective(600px) rotateX(25deg) scale(1.1);
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    /* 🎨 Farby budov */
    .townhall { background: #d35400; }
    .cannon { background: #718093; }
    .goldstorage { background: #fbc531; }
    .goldmine { background: #e1b12c; }
    .elixirstorage { background: #8c7ae6; }
    .elixirmine { background: #9c88ff; }
    .armycamp { background: #44bd32; }

    #infoBox {
      position: fixed;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 16px;
      border-radius: 10px;
      pointer-events: auto;
      font-size: 14px;
      z-index: 200;
      min-width: 160px;
    }

    #infoBox button {
      margin-top: 6px;
      width: 100%;
      padding: 6px;
      border: none;
      background: #27ae60;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    #infoBox button:hover {
      background: #2ecc71;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <h1 id="gameTitle">ErikAI COC</h1>
  <button id="resetBtn">Reset View</button>

  <div id="viewport">
    <div id="gameArea"></div>
  </div>

  <div id="infoBox" class="hidden"></div>

  <script>
    const gameArea = document.getElementById('gameArea');
    const infoBox = document.getElementById('infoBox');
    const resetBtn = document.getElementById('resetBtn');

    // 📍 Zoznam budov s HP, DMG a levelom
    const buildings = [
      { id: "townhall", name: "Town Hall", x: 950, y: 950, class: "townhall", hp: 1500, dmg: 0, level: 1 },
      { id: "cannon", name: "Cannon", x: 1100, y: 950, class: "cannon", hp: 800, dmg: 50, level: 1 },
      { id: "goldmine", name: "Gold Mine", x: 800, y: 1000, class: "goldmine", hp: 600, dmg: 0, level: 1 },
      { id: "goldstorage", name: "Gold Storage", x: 1200, y: 900, class: "goldstorage", hp: 900, dmg: 0, level: 1 },
      { id: "elixirmine", name: "Elixir Mine", x: 700, y: 850, class: "elixirmine", hp: 600, dmg: 0, level: 1 },
      { id: "elixirstorage", name: "Elixir Storage", x: 950, y: 750, class: "elixirstorage", hp: 900, dmg: 0, level: 1 },
      { id: "armycamp", name: "Army Camp", x: 1250, y: 1050, class: "armycamp", hp: 700, dmg: 0, level: 1 }
    ];

    // 🏗️ Generovanie budov
    buildings.forEach(b => {
      const el = document.createElement('div');
      el.className = 'building ' + b.class;
      el.style.left = b.x + 'px';
      el.style.top = b.y + 'px';
      el.dataset.id = b.id;
      el.textContent = b.level;
      gameArea.appendChild(el);
    });

    // 📦 Kamera
    let scale = 0.8;
    let posX = window.innerWidth / 2 - 1000;
    let posY = window.innerHeight / 2 - 1000;
    let dragging = false;
    let startX, startY;

    function updateTransform() {
      gameArea.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    }
    updateTransform();

    // 🖱️ Zoom kolieskom
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomSpeed = 0.1;
      if (e.deltaY < 0) scale += zoomSpeed;
      else scale -= zoomSpeed;
      scale = Math.min(Math.max(0.4, scale), 2.5);
      updateTransform();
    });

    // 👆 Ťahanie mapy
    gameArea.addEventListener('mousedown', (e) => {
      dragging = true;
      startX = e.clientX - posX;
      startY = e.clientY - posY;
      gameArea.style.cursor = 'grabbing';
    });
    window.addEventListener('mouseup', () => dragging = false);
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      posX = e.clientX - startX;
      posY = e.clientY - startY;
      updateTransform();
    });

    // 📱 Dotyky
    let touchStartDist = 0;
    let lastScale = 1;
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        touchStartDist = Math.hypot(dx, dy);
        lastScale = scale;
      }
    });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        scale = lastScale * (dist / touchStartDist);
        scale = Math.min(Math.max(0.4, scale), 2.5);
        updateTransform();
      }
    }, { passive: false });

    // 🧱 Klik na budovu
    gameArea.addEventListener('click', (e) => {
      if (e.target.classList.contains('building')) {
        const id = e.target.dataset.id;
        const b = buildings.find(x => x.id === id);
        showInfoBox(e.pageX, e.pageY, b);
      } else {
        infoBox.classList.add('hidden');
      }
    });

    // 🧩 Funkcia na zobrazenie info o budove
    function showInfoBox(x, y, b) {
      infoBox.innerHTML = `
        <strong>${b.name}</strong><br>
        Level: ${b.level}<br>
        HP: ${b.hp}<br>
        DMG: ${b.dmg}<br>
        <button onclick="upgradeBuilding('${b.id}')">Upgrade</button>
      `;
      infoBox.style.left = x + 'px';
      infoBox.style.top = y - 50 + 'px';
      infoBox.classList.remove('hidden');
    }

    // ⚒️ Upgrade budovy
    window.upgradeBuilding = function(id) {
      const b = buildings.find(x => x.id === id);
      b.level += 1;
      b.hp = Math.round(b.hp * 1.1);
      b.dmg = Math.round(b.dmg * 1.1);
      const el = [...document.getElementsByClassName('building')]
        .find(e => e.dataset.id === id);
      el.textContent = b.level;
      showInfoBox(parseInt(infoBox.style.left), parseInt(infoBox.style.top) + 50, b);
    };

    // 🔄 Reset pohľadu
    resetBtn.addEventListener('click', () => {
      scale = 0.8;
      posX = window.innerWidth / 2 - 1000;
      posY = window.innerHeight / 2 - 1000;
      updateTransform();
      infoBox.classList.add('hidden');
    });
  </script>
</body>
</html>
