<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI Mobile Clash — Super verzia</title>
<style>
body { margin:0; overflow:hidden; background:#000; touch-action:none; user-select:none; font-family:Arial,sans-serif; }
canvas { display:block; background:#f7d94c; }
#joystick { position:fixed; bottom:60px; left:60px; width:120px; height:120px; border-radius:50%; background: rgba(255,255,255,0.1); border:2px solid white; touch-action:none; }
#joyKnob { width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,0.3); position:absolute; left:35px; top:35px; }
#attackBtn { position: fixed; bottom:80px; right:80px; width:100px; height:100px; border-radius:50%; font-size:20px; background:red; color:white; }
#radar { position:fixed; top:10px; right:10px; width:150px; height:150px; background: rgba(0,0,0,0.5); border: 2px solid white; border-radius:8px; z-index:100; }
#missionBox { position:fixed; left:10px; bottom:10px; color:white; background:rgba(0,0,0,0.6); padding:6px 10px; border-radius:6px; max-width:60%; font-weight:bold; }
</style>
</head>
<body>

<canvas id="game"></canvas>
<canvas id="radar"></canvas>

<div id="joystick"><div id="joyKnob"></div></div>
<button id="attackBtn">ÚTOK</button>
<div id="missionBox">Misie: žiadna aktivita</div>

<script>
// --- Základné ---
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth; canvas.height = window.innerHeight;

const radar = document.getElementById("radar");
const rCtx = radar.getContext("2d");
radar.width = 150; radar.height = 150;

const mapSize = 6000;
const wallCount = 180;
const itemCount = 8;
const radarScale = radar.width / mapSize;

// --- Hráč ---
let player = { x: mapSize/2, y: mapSize/2, size:30, speed:5, hp:100, maxHp:100, alive:true };
let trophies = parseInt(localStorage.getItem("trophies")) || 0;

// --- Level / XP ---
let playerLevel = parseInt(localStorage.getItem("playerLevel")) || 1;
let playerXP = parseInt(localStorage.getItem("playerXP")) || 0;
let XP_to_next_level = parseInt(localStorage.getItem("XP_to_next_level")) || 20;

// --- Misie ---
const missionBox = document.getElementById("missionBox");
let currentMission = { text: 'Žiadna aktivita', type: null, target:0, progress:0 };

// --- Steny a itemy ---
const shapes = ["rect","circle","triangle","hexagon","pentagon","star","octagon"];
let walls = [], items = [], healPacks = [], enemies = [];

// --- Generovanie stien ---
for(let i=0;i<wallCount;i++){
  walls.push({ x:Math.random()*mapSize, y:Math.random()*mapSize, w:40+Math.random()*80, h:40+Math.random()*80, shape:shapes[Math.floor(Math.random()*3)], color:'#'+Math.floor(Math.random()*16777215).toString(16) });
}

// --- Generovanie itemov ---
const itemTypes=["sword","shield"];
for(let i=0;i<itemCount;i++){
  items.push({ x:Math.random()*mapSize, y:Math.random()*mapSize, type:itemTypes[Math.floor(Math.random()*itemTypes.length)] });
}

// --- Ovládanie ---
let keys={};
window.addEventListener("keydown", e=>keys[e.key]=true);
window.addEventListener("keyup", e=>keys[e.key]=false);

// --- Joystick ---
let joystick = document.getElementById("joystick");
let joyKnob = document.getElementById("joyKnob");
let moveX=0, moveY=0;
let activePointer=null, rect=null;

joystick.addEventListener("pointerdown", e=>{
  activePointer=e.pointerId;
  rect=joystick.getBoundingClientRect();
  joystick.setPointerCapture(e.pointerId);
});
joystick.addEventListener("pointermove", e=>{
  if(activePointer!==e.pointerId) return;
  const dx = e.clientX - (rect.left + rect.width/2);
  const dy = e.clientY - (rect.top + rect.height/2);
  const mag = Math.min(40, Math.hypot(dx,dy));
  const nx = dx/mag||0; const ny = dy/mag||0;
  joyKnob.style.transform = `translate(${nx*mag}px,${ny*mag}px)`;
  moveX=nx; moveY=ny;
});
joystick.addEventListener("pointerup", e=>{
  if(activePointer!==e.pointerId) return;
  joystick.releasePointerCapture(e.pointerId);
  activePointer=null;
  joyKnob.style.transform='translate(0,0)';
  moveX=0; moveY=0;
});

// --- Útok ---
document.getElementById("attackBtn").addEventListener("touchstart", attack);
window.addEventListener("keydown", e=>{ if(e.key===" ") attack(); });

// --- Generovanie nepriateľov ---
function spawnEnemy(){
  let typeRand=Math.random();
  let e={ x:Math.random()*mapSize, y:Math.random()*mapSize, size:30, alive:true, attackCooldown:0, hp:10 };

  function randomColor(){ return '#'+Math.floor(Math.random()*16777215).toString(16); }

  if(typeRand<0.15){ e.speed=player.speed*2; e.shape="circle"; e.color=randomColor(); e.hp=5; } // scout
  else if(typeRand<0.30){ e.speed=player.speed*0.5; e.shape="rect"; e.color=randomColor(); e.hp=50; } // tank
  else if(typeRand<0.45){ e.speed=player.speed*1; e.shape="triangle"; e.color=randomColor(); e.hp=15; e.jumpCooldown=0; } // skokan
  else if(typeRand<0.60){ e.speed=player.speed*0.9; e.shape="hexagon"; e.color=randomColor(); e.hp=12; e.shootCooldown=Math.floor(Math.random()*100); } // strieľajúci
  else if(typeRand<0.75){ e.speed=player.speed*1.1; e.shape="pentagon"; e.color=randomColor(); e.hp=10; e.invisibleCooldown=0; e.visible=true; } // kamufláž
  else if(typeRand<0.90){ e.speed=player.speed*0.6; e.shape="star"; e.color=randomColor(); e.hp=8; e.explodeDistance=50; } // explozívny
  else{ e.speed=player.speed*0.4; e.shape="octagon"; e.color=randomColor(); e.hp=80; } // boss mini

  enemies.push(e);
}
// --- Spawne 7 súperov naraz na začiatku ---
for(let i=0;i<7;i++) spawnEnemy();
setInterval(()=>spawnEnemy(), 2000+Math.random()*1000);

// --- Liečivé predmety ---
function spawnHealPack(){ healPacks.push({ x:Math.random()*mapSize, y:Math.random()*mapSize, size:25 }); }
setInterval(spawnHealPack,5000);

// --- Pohyb hráča a liečenie ---
function movePlayer(){
  if(!player.alive) return;
  let newX=player.x+(keys["a"]?-player.speed:0)+(keys["d"]?player.speed:0)+moveX*player.speed;
  let newY=player.y+(keys["w"]?-player.speed:0)+(keys["s"]?player.speed:0)+moveY*player.speed;
  player.x=Math.max(0,Math.min(mapSize-player.size,newX));
  player.y=Math.max(0,Math.min(mapSize-player.size,newY));

  healPacks=healPacks.filter(h=>{
    const d=Math.hypot(player.x-h.x,player.y-h.y);
    if(d<40){ player.hp=Math.min(player.maxHp,player.hp+25); updateMission('heal'); return false; }
    return true;
  });
}

// --- Pohyb nepriateľov ---
function moveEnemies(){
  enemies.forEach(e=>{
    if(!e.alive) return;
    const dx=player.x-e.x, dy=player.y-e.y, dist=Math.hypot(dx,dy);

    if(e.shape==="triangle" && e.jumpCooldown<=0 && dist>50){ e.x+=dx*0.5; e.y+=dy*0.5; e.jumpCooldown=150; }
    if(e.shape==="star" && dist<e.explodeDistance){ player.hp-=20; e.alive=false; return; }
    if(e.shape==="pentagon" && !e.visible){ e.invisibleCooldown--; if(e.invisibleCooldown<=0){ e.visible=true; e.invisibleCooldown=100; } }

    if(dist>5){ const newX=e.x+dx/dist*e.speed; const newY=e.y+dy/dist*e.speed; e.x=newX; e.y=newY; }

    if(dist<40 && e.attackCooldown<=0){ player.hp-=Math.floor(5+Math.random()*10); e.attackCooldown=50;
      if(player.hp<=0){ player.hp=0; player.alive=false; let lose=Math.floor(55+Math.random()*16); trophies=Math.max(0,trophies-lose); localStorage.setItem("trophies", trophies); alert(`💀 Prehral si! -${lose} trofejí`); location.reload(); }
    }

    if(e.attackCooldown>0) e.attackCooldown--;
    if(e.jumpCooldown>0) e.jumpCooldown--;
    if(e.shootCooldown>0) e.shootCooldown--;
    if(e.invisibleCooldown>0) e.invisibleCooldown--;
  });
}

// --- Útok hráča ---
function attack(){
  enemies.forEach(e=>{
    if(!e.alive) return;
    const dx=player.x-e.x, dy=player.y-e.y;
    if(Math.hypot(dx,dy)<45){ e.alive=false; trophies+=Math.floor(Math.random()*15)+1; localStorage.setItem("trophies", trophies); gainXP(5); updateMission('kill'); }
  });
}

// --- Level / XP ---
function gainXP(amount){
  playerXP+=amount;
  while(playerXP>=XP_to_next_level){ playerXP-=XP_to_next_level; playerLevel++; XP_to_next_level=Math.floor(XP_to_next_level*1.5); alert(`🎉 Nový level: ${playerLevel}!`); }
  localStorage.setItem("playerLevel", playerLevel); localStorage.setItem("playerXP", playerXP); localStorage.setItem("XP_to_next_level", XP_to_next_level);
}

// --- Misie ---
function generateMission(){
  const types=['kill','heal','collect']; const type=types[Math.floor(Math.random()*types.length)];
  let target=0,text='';
  if(type==='kill'){ target=5+Math.floor(Math.random()*5); text=`Zabi ${target} nepriateľov`; }
  else if(type==='heal'){ target=3+Math.floor(Math.random()*3); text=`Použi ${target} liečivých predmetov`; }
  else if(type==='collect'){ target=2+Math.floor(Math.random()*3); text=`Zbieraj ${target} itemov`; }
  currentMission={ text:text, type:type, target:target, progress:0 };
  missionBox.innerText='Misie: '+currentMission.text;
}
function updateMission(action){
  if(currentMission.type===null) generateMission();
  if(currentMission.type==='kill' && action==='kill') currentMission.progress++;
  if(currentMission.type==='heal' && action==='heal') currentMission.progress++;
  if(currentMission.type==='collect' && action==='collect') currentMission.progress++;
  if(currentMission.progress>=currentMission.target){ alert(`🎯 Misia dokončená: ${currentMission.text}`); generateMission(); }
}

// --- Vykreslenie ---
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const camX=player.x-canvas.width/2, camY=player.y-canvas.height/2;
  ctx.fillStyle="#f7d94c"; ctx.fillRect(0,0,canvas.width,canvas.height);

  // steny
  walls.forEach(w=>{
    const x=w.x-camX, y=w.y-camY;
    ctx.fillStyle=w.color;
    if(w.shape==="rect") ctx.fillRect(x,y,w.w,w.h);
    else if(w.shape==="circle"){ ctx.beginPath(); ctx.arc(x+w.w/2,y+w.h/2,w.w/2,0,Math.PI*2); ctx.fill(); }
    else if(w.shape==="triangle"){ ctx.beginPath(); ctx.moveTo(x+w.w/2,y); ctx.lineTo(x,y+w.h); ctx.lineTo(x+w.w,y+w.h); ctx.closePath(); ctx.fill(); }
  });

  // liečivé predmety
  healPacks.forEach(h=>{ const x=h.x-camX,y=h.y-camY; ctx.fillStyle="red"; ctx.fillRect(x-5,y-15,10,30); ctx.fillRect(x-15,y-5,30,10); });

  // hráč
  ctx.fillStyle="red"; ctx.fillRect(player.x-camX,player.y-camY,player.size,player.size);

  // nepriatelia
  enemies.forEach(e=>{
    if(!e.alive) return;
    if(e.shape==='pentagon' && !e.visible) return;
    const x=e.x-camX,y=e.y-camY;
    ctx.fillStyle=e.color;
    if(e.shape==="rect") ctx.fillRect(x,y,e.size,e.size);
    else if(e.shape==="circle"){ ctx.beginPath(); ctx.arc(x+e.size/2,y+e.size/2,e.size/2,0,Math.PI*2); ctx.fill(); }
    else if(e.shape==="triangle"){ ctx.beginPath(); ctx.moveTo(x+e.size/2,y); ctx.lineTo(x,y+e.size); ctx.lineTo(x+e.size,y+e.size); ctx.closePath(); ctx.fill(); }
  });

  // HUD
  ctx.fillStyle="black"; ctx.font="20px Arial"; ctx.fillText(`🏆 Trofeje: ${trophies}`,20,30);
  ctx.fillStyle="black"; ctx.fillRect(20,50,200,20);
  ctx.fillStyle="lime"; ctx.fillRect(20,50,(player.hp/player.maxHp)*200,20);
  ctx.strokeStyle="white"; ctx.strokeRect(20,50,200,20);
  ctx.fillStyle="black"; ctx.font="16px Arial"; ctx.fillText(`${player.hp} / ${player.maxHp}`,230,65);
  ctx.fillStyle="black"; ctx.font="20px Arial"; ctx.fillText(`Level: ${playerLevel} XP: ${playerXP}/${XP_to_next_level}`,20,90);

  drawRadar();
}

// --- Radar ---
function drawRadar(){
  rCtx.clearRect(0,0,radar.width,radar.height);
  walls.forEach(w=>{
    rCtx.fillStyle=w.color;
    rCtx.fillRect(w.x*radarScale,w.y*radarScale, w.w*radarScale, w.h*radarScale);
  });
  enemies.forEach(e=>{
    if(!e.alive) return;
    if(e.shape==='pentagon' && !e.visible) return;
    rCtx.fillStyle=e.color;
    rCtx.fillRect(e.x*radarScale,e.y*radarScale,5,5);
  });
  rCtx.fillStyle="red"; rCtx.fillRect(player.x*radarScale,player.y*radarScale,5,5);
}

// --- Hlavný loop ---
function gameLoop(){ movePlayer(); moveEnemies(); draw(); requestAnimationFrame(gameLoop); }
generateMission();
gameLoop();
</script>
</body>
</html>
