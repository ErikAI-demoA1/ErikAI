<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survive Arena</title>
<style>
body {
  margin: 0;
  background: #000;
  overflow: hidden;
  font-family: sans-serif;
  color: white;
  user-select: none;
}
canvas {
  background: #111;
  display: block;
  margin: auto;
  touch-action: none;
}
#ui {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 10;
}
button {
  background: #333;
  color: white;
  border: 1px solid #777;
  padding: 5px 10px;
  margin: 2px;
  border-radius: 5px;
}
#joystick {
  position: fixed;
  bottom: 20px;
  left: 20px;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: 2px solid #888;
}
#attackBtn {
  position: fixed;
  bottom: 40px;
  right: 30px;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: red;
  color: white;
  border: none;
  font-weight: bold;
}
#radar {
  position: fixed;
  right: 10px;
  top: 10px;
  border: 1px solid #444;
  background: rgba(0,0,0,0.5);
}
#mission {
  position: fixed;
  bottom: 130px;
  left: 10px;
  background: rgba(0,0,0,0.6);
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 14px;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="radar" width="120" height="120"></canvas>
<div id="ui">
  <button id="saveBtn">💾 Uložiť</button>
  <button id="resetBtn">♻️ Reset</button>
</div>
<div id="joystick"></div>
<button id="attackBtn">ÚTOK</button>
<div id="mission"></div>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const radar = document.getElementById("radar");
const rctx = radar.getContext("2d");
let w, h;
function resize(){ w=innerWidth; h=innerHeight; canvas.width=w; canvas.height=h; }
resize();
addEventListener("resize", resize);

let player = {x:0,y:0, hp:100, exp:0, level:1};
let enemies = [];
let walls = [];
let healPacks = [];
let missions = [];
let currentMission = "Poraz 5 nepriateľov!";
let missionKills = 0;

function initMapIfEmpty(){
  if(walls.length===0){
    for(let i=0;i<20;i++){
      walls.push({x:Math.random()*2000-1000, y:Math.random()*2000-1000, w:50,h:50});
    }
  }
  if(enemies.length===0){
    for(let i=0;i<10;i++){
      enemies.push({x:Math.random()*1000-500, y:Math.random()*1000-500, hp:30, speed:1});
    }
  }
}

function saveState(){
  const data={player,enemies,walls,healPacks,missions,missionKills,currentMission};
  localStorage.setItem("surviveData", JSON.stringify(data));
  console.log("Uložené.");
}

function loadState(){
  const data = JSON.parse(localStorage.getItem("surviveData")||"{}");
  if(data.player) player = data.player;
  if(data.enemies) enemies = data.enemies;
  if(data.walls) walls = data.walls;
  if(data.healPacks) healPacks = data.healPacks;
  if(data.missions) missions = data.missions;
  missionKills = data.missionKills||0;
  currentMission = data.currentMission||"Poraz 5 nepriateľov!";
  if(!Array.isArray(walls)) walls=[];
  if(!Array.isArray(enemies)) enemies=[];
  if(!Array.isArray(healPacks)) healPacks=[];
  initMapIfEmpty();
}
loadState();

let joy = {active:false,x:0,y:0,dx:0,dy:0};
const joyDiv = document.getElementById("joystick");
joyDiv.addEventListener("touchstart", e=>{
  e.preventDefault();
  joy.active=true;
  const t=e.touches[0];
  joy.x=t.clientX; joy.y=t.clientY;
});
joyDiv.addEventListener("touchmove", e=>{
  e.preventDefault();
  if(!joy.active)return;
  const t=e.touches[0];
  joy.dx=(t.clientX-joy.x)/50;
  joy.dy=(t.clientY-joy.y)/50;
});
joyDiv.addEventListener("touchend", e=>{
  e.preventDefault();
  joy.active=false; joy.dx=0; joy.dy=0;
});

function attack(){
  for(let e of enemies){
    const dist=Math.hypot(e.x-player.x,e.y-player.y);
    if(dist<100){ e.hp-=10; if(e.hp<=0){player.exp+=10; missionKills++; e.x=Math.random()*1000-500; e.y=Math.random()*1000-500; e.hp=30;} }
  }
  if(player.exp>=player.level*50){player.level++; player.exp=0;}
  if(missionKills>=5){ currentMission="Nová misia čoskoro!"; missionKills=0; }
}

const attackButton = document.getElementById("attackBtn");
attackButton.addEventListener("touchstart", e=>{e.preventDefault();attack();});
attackButton.addEventListener("click", attack);
attackButton.addEventListener("pointerdown", attack);

function moveEnemies(){
  for(let e of enemies){
    const dx=player.x-e.x, dy=player.y-e.y;
    const dist=Math.hypot(dx,dy);
    if(dist>5 && dist!==0){
      e.x+=dx/dist*e.speed;
      e.y+=dy/dist*e.speed;
    }
  }
}

function draw(){
  ctx.clearRect(0,0,w,h);
  ctx.save();
  ctx.translate(w/2, h/2);
  ctx.fillStyle="green";
  ctx.beginPath();
  ctx.arc(0,0,15,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="gray";
  for(let wall of walls){
    ctx.fillRect(wall.x-player.x, wall.y-player.y, wall.w, wall.h);
  }
  ctx.fillStyle="red";
  for(let e of enemies){
    ctx.beginPath();
    ctx.arc(e.x-player.x,e.y-player.y,10,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
  // Radar
  rctx.clearRect(0,0,radar.width,radar.height);
  const cx=radar.width/2, cy=radar.height/2;
  rctx.fillStyle="lime";
  rctx.beginPath();
  rctx.arc(cx,cy,3,0,Math.PI*2);
  rctx.fill();
  rctx.fillStyle="red";
  for(let e of enemies){
    const rx = cx + e.x/50;
    const ry = cy + e.y/50;
    rctx.fillRect(rx,ry,2,2);
  }
}

function update(){
  player.x += joy.dx*5;
  player.y += joy.dy*5;
  moveEnemies();
  document.getElementById("mission").textContent=`🎯 ${currentMission} (Zabití: ${missionKills}) | 🧠 Level ${player.level} | ❤️ HP ${player.hp}`;
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

document.getElementById("saveBtn").addEventListener("click", saveState);
document.getElementById("resetBtn").addEventListener("click", ()=>{
  localStorage.removeItem("surviveData");
  location.reload();
});

setInterval(saveState,5000);
loop();
</script>
</body>
</html>
