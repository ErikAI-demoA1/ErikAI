<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini COC Základ</title>
<style>
  body { margin:0; font-family:sans-serif; background:#2f3640; overflow:hidden; user-select:none; }
  #topUI { position:fixed; top:0; width:100%; display:flex; justify-content:space-between; padding:5px 20px; z-index:100; }
  #playerStats, #resources { color:white; font-weight:bold; font-size:16px; padding:8px 14px; background:rgba(0,0,0,0.4); border-radius:10px; white-space:nowrap; }
  #viewport { position:absolute; top:50px; left:0; width:100%; height:calc(100vh - 50px); overflow:hidden; }
  #gameArea { position:absolute; width:2000px; height:2000px; background:linear-gradient(to top, #44bd32,#6ab04c); transform-origin:center center; cursor:grab; }
  .building { position:absolute; width:80px; height:80px; border-radius:10px; border:2px solid #000; transform:perspective(600px) rotateX(25deg); transition: transform 0.1s, box-shadow 0.1s; color:white; display:flex; align-items:center; justify-content:center; font-weight:bold; text-shadow:1px 1px 2px #000; cursor:pointer; }
  .building:hover { transform:perspective(600px) rotateX(25deg) scale(1.1); box-shadow:0 0 10px rgba(0,0,0,0.4); }
  .townhall{background:#d35400;} .cannon{background:#718093;} .goldmine{background:#e1b12c;} .goldstorage{background:#fbc531;} .elixirmine{background:#9c88ff;} .elixirstorage{background:#8c7ae6;} .armycamp{background:#44bd32;}
  #infoBox { position:fixed; background:rgba(0,0,0,0.85); color:white; padding:12px 16px; border-radius:10px; pointer-events:auto; font-size:14px; z-index:200; min-width:180px; }
  #infoBox button{ margin-top:6px; width:100%; padding:6px; border:none; background:#27ae60; color:white; border-radius:6px; cursor:pointer; font-weight:bold; }
  #infoBox button:hover{ background:#2ecc71; }
  .hidden{ display:none; }
</style>
</head>
<body>

<div id="topUI">
  <div id="playerStats">👤 <span id="playerName">ErikAI</span> | Level: <span id="playerLevel">1</span> | 🏆 <span id="trophies">0</span></div>
  <div id="resources">💰 Gold: <span id="gold">1000</span> | 🧪 Elixir: <span id="elixir">800</span> | 💎 Gemy: <span id="gems">100</span></div>
</div>

<div id="viewport">
  <div id="gameArea"></div>
</div>

<div id="infoBox" class="hidden"></div>

<script>
const gameArea = document.getElementById('gameArea');
const infoBox = document.getElementById('infoBox');

const player = { name:"ErikAI", level:1, trophies:0, gold:1000, elixir:800, gems:100 };

const buildings = [
  {id:"townhall", name:"Town Hall", x:950,y:950,class:"townhall",hp:1500,dmg:0,level:1},
  {id:"cannon", name:"Cannon", x:1100,y:950,class:"cannon",hp:800,dmg:50,level:1},
  {id:"goldmine", name:"Gold Mine", x:800,y:1000,class:"goldmine",hp:600,dmg:0,level:1},
  {id:"elixirmine", name:"Elixir Mine", x:700,y:850,class:"elixirmine",hp:600,dmg:0,level:1}
];

// Vytvorenie budov
buildings.forEach(b=>{
  const el=document.createElement('div');
  el.className='building '+b.class;
  el.style.left=b.x+'px';
  el.style.top=b.y+'px';
  el.dataset.id=b.id;
  el.textContent=b.level;
  gameArea.appendChild(el);
});

// Kamera a pohyb
let scale=0.8, posX=window.innerWidth/2-1000, posY=window.innerHeight/2-1000, dragging=false, startX, startY, movingBuilding=null;
function updateTransform(){ gameArea.style.transform=`translate(${posX}px,${posY}px) scale(${scale})`; }
updateTransform();

// Zoom
window.addEventListener('wheel',e=>{ e.preventDefault(); scale += e.deltaY<0?0.1:-0.1; scale=Math.min(Math.max(0.5,scale),2.5); updateTransform(); });

// Drag mapy
gameArea.addEventListener('mousedown',e=>{
  if(!e.target.classList.contains('building')){ dragging=true; startX=e.clientX-posX; startY=e.clientY-posY; gameArea.style.cursor='grabbing'; }
});
window.addEventListener('mouseup',()=>{ dragging=false; movingBuilding=null; gameArea.style.cursor='grab'; });
window.addEventListener('mousemove',e=>{
  if(dragging){ posX=e.clientX-startX; posY=e.clientY-startY; updateTransform(); }
  if(movingBuilding){ const rect=gameArea.getBoundingClientRect(); const x=(e.clientX-rect.left-40)/scale; const y=(e.clientY-rect.top-40)/scale; movingBuilding.style.left=x+'px'; movingBuilding.style.top=y+'px'; }
});

// Presúvanie budov
gameArea.addEventListener('mousedown',e=>{ if(e.target.classList.contains('building')) movingBuilding=e.target; });

// Klik na budovu
gameArea.addEventListener('click',e=>{
  if(e.target.classList.contains('building')){
    const b=buildings.find(x=>x.id===e.target.dataset.id);
    showInfoBox(e.pageX,e.pageY,b);
  } else infoBox.classList.add('hidden');
});

function showInfoBox(x,y,b){
  infoBox.innerHTML=`<strong>${b.name}</strong><br>Level: ${b.level}<br>HP: ${b.hp}<br>DMG: ${b.dmg}<br>
  <button onclick="upgradeBuilding('${b.id}')">Upgrade</button>`;
  infoBox.style.left=x+'px'; infoBox.style.top=y-50+'px'; infoBox.classList.remove('hidden');
}

// Upgrade budovy
window.upgradeBuilding=function(id){
  const b=buildings.find(x=>x.id===id);
  b.level+=1; b.hp=Math.round(b.hp*1.1); b.dmg=Math.round(b.dmg*1.1);
  document.querySelector(`[data-id="${id}"]`).textContent=b.level;
}

// Generovanie surovín
setInterval(()=>{
  buildings.forEach(b=>{ if(b.class==='goldmine') player.gold+=10; if(b.class==='elixirmine') player.elixir+=5; });
  document.getElementById('gold').textContent=player.gold;
  document.getElementById('elixir').textContent=player.elixir;
},5000);
</script>
</body>
</html>
