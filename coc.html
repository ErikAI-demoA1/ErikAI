<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI Mini Clash</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
    background: #f7d94c; /* žltá mapa */
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Nastavenie mapy
const mapSize = 4000; // veľká mapa
const wallCount = 100;
const itemCount = 6;

let keys = {};
let player = { x: mapSize / 2, y: mapSize / 2, size: 30, speed: 5 };
let enemies = [];
let walls = [];
let items = [];

let trophies = 0;

// Generovanie náhodných stien
for (let i = 0; i < wallCount; i++) {
  walls.push({
    x: Math.random() * mapSize,
    y: Math.random() * mapSize,
    w: 80,
    h: 30
  });
}

// Generovanie mečov a štítov
const itemTypes = ["sword", "shield"];
for (let i = 0; i < itemCount; i++) {
  items.push({
    x: Math.random() * mapSize,
    y: Math.random() * mapSize,
    type: itemTypes[Math.floor(Math.random() * itemTypes.length)]
  });
}

// Generovanie súperov
for (let i = 0; i < 3; i++) {
  enemies.push({
    x: Math.random() * mapSize,
    y: Math.random() * mapSize,
    size: 30,
    speed: 2,
    alive: true
  });
}

window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

function movePlayer() {
  let newX = player.x;
  let newY = player.y;

  if (keys["w"]) newY -= player.speed;
  if (keys["s"]) newY += player.speed;
  if (keys["a"]) newX -= player.speed;
  if (keys["d"]) newX += player.speed;

  // kolízia so stenami
  let collision = walls.some(w =>
    newX < w.x + w.w &&
    newX + player.size > w.x &&
    newY < w.y + w.h &&
    newY + player.size > w.y
  );

  if (!collision) {
    player.x = newX;
    player.y = newY;
  }
}

function moveEnemies() {
  enemies.forEach(e => {
    if (!e.alive) return;
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 5) {
      e.x += (dx / dist) * e.speed;
      e.y += (dy / dist) * e.speed;
    }
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Kamera - hráč v strede
  const camX = player.x - canvas.width / 2;
  const camY = player.y - canvas.height / 2;

  // Mapa (steny)
  ctx.fillStyle = "#f7d94c";
  ctx.fillRect(0 - camX, 0 - camY, mapSize, mapSize);

  ctx.fillStyle = "#8b5a2b";
  walls.forEach(w => ctx.fillRect(w.x - camX, w.y - camY, w.w, w.h));

  // Meče a štíty
  items.forEach(i => {
    ctx.fillStyle = i.type === "sword" ? "silver" : "lightblue";
    ctx.beginPath();
    ctx.arc(i.x - camX, i.y - camY, 15, 0, Math.PI * 2);
    ctx.fill();
  });

  // Hráč
  ctx.fillStyle = "red";
  ctx.fillRect(player.x - camX, player.y - camY, player.size, player.size);

  // Súperi
  ctx.fillStyle = "purple";
  enemies.forEach(e => {
    if (e.alive) ctx.fillRect(e.x - camX, e.y - camY, e.size, e.size);
  });

  // Text – trofeje
  ctx.fillStyle = "black";
  ctx.font = "20px Arial";
  ctx.fillText(`🏆 Trofeje: ${trophies}`, 20, 30);
}

function checkCombat() {
  enemies.forEach(e => {
    if (!e.alive) return;
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 40) {
      e.alive = false;
      trophies += Math.floor(Math.random() * 15) + 1;
      saveGame();
    }
  });
}

function saveGame() {
  localStorage.setItem("trophies", trophies);
}

function loadGame() {
  trophies = parseInt(localStorage.getItem("trophies")) || 0;
}

function loop() {
  movePlayer();
  moveEnemies();
  checkCombat();
  draw();
  requestAnimationFrame(loop);
}

loadGame();
loop();
</script>
</body>
</html>
