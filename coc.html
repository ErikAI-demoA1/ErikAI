<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI Mobile Clash</title>
<style>
  body { margin:0; overflow:hidden; background:#000; touch-action:none; user-select:none; }
  canvas { display:block; background:#f7d94c; }
  #joystick {
    position: fixed; bottom: 60px; left: 60px; width: 120px; height: 120px;
    border-radius: 50%; background: rgba(255,255,255,0.1); border:2px solid white; touch-action:none;
  }
  #joyKnob {
    width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,0.3);
    position:absolute; left:35px; top:35px;
  }
  #attackBtn {
    position: fixed; bottom: 80px; right: 80px;
    width: 100px; height: 100px; border-radius: 50%;
    font-size: 20px; background:red; color:white;
  }
  #radar {
    position: fixed;
    top: 10px;
    right: 10px;
    width: 150px;
    height: 150px;
    background: rgba(0,0,0,0.5);
    border: 2px solid white;
    border-radius: 8px;
    z-index: 100;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="radar"></canvas>
<div id="joystick"><div id="joyKnob"></div></div>
<button id="attackBtn">ÚTOK</button>

<script>
// --- Základné premenné ---
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const radar = document.getElementById("radar");
const rCtx = radar.getContext("2d");
radar.width = 150;
radar.height = 150;

const mapSize = 6000;
const wallCount = 180;
const itemCount = 8;
const radarScale = radar.width / mapSize;

let player = { x: mapSize/2, y: mapSize/2, size:30, speed:5, hp:100, maxHp:100, alive:true };
let enemies = [];
let walls = [];
let items = [];
let healPacks = [];
let trophies = parseInt(localStorage.getItem("trophies")) || 0;

// generovanie stien
const shapes = ["rect","circle","triangle"];
for(let i=0;i<wallCount;i++){
  walls.push({
    x:Math.random()*mapSize,
    y:Math.random()*mapSize,
    w:40+Math.random()*80,
    h:40+Math.random()*80,
    shape:shapes[Math.floor(Math.random()*shapes.length)],
    color: '#'+Math.floor(Math.random()*16777215).toString(16)
  });
}

// generovanie itemov
const itemTypes=["sword","shield"];
for(let i=0;i<itemCount;i++){
  items.push({
    x:Math.random()*mapSize,
    y:Math.random()*mapSize,
    type:itemTypes[Math.floor(Math.random()*itemTypes.length)]
  });
}

// nepriatelia
function spawnEnemy(){
  enemies.push({
    x:Math.random()*mapSize,
    y:Math.random()*mapSize,
    size:30,
    speed:2,
    alive:true,
    attackCooldown:0
  });
}
for(let i=0;i<5;i++) spawnEnemy();
setInterval(spawnEnemy, 2000 + Math.random()*1000);

// liečivý predmet
function spawnHealPack(){
  healPacks.push({
    x: Math.random()*mapSize,
    y: Math.random()*mapSize,
    size: 25
  });
}
setInterval(spawnHealPack, 5000);

// ovládanie
let keys={};
window.addEventListener("keydown", e=>keys[e.key]=true);
window.addEventListener("keyup", e=>keys[e.key]=false);

// joystick
let joystick = document.getElementById("joystick");
let joyKnob = document.getElementById("joyKnob");
let moveX=0, moveY=0;
let activePointer = null;
let rect = null;

joystick.addEventListener("pointerdown", e=>{
  activePointer = e.pointerId;
  rect = joystick.getBoundingClientRect();
  joystick.setPointerCapture(e.pointerId);
});
joystick.addEventListener("pointermove", e=>{
  if(activePointer!==e.pointerId) return;
  const dx = e.clientX - (rect.left + rect.width/2);
  const dy = e.clientY - (rect.top + rect.height/2);
  const mag = Math.min(40, Math.hypot(dx,dy));
  const nx = dx/mag||0;
  const ny = dy/mag||0;
  joyKnob.style.transform = `translate(${nx*mag}px,${ny*mag}px)`;
  moveX = nx; moveY = ny;
});
joystick.addEventListener("pointerup", e=>{
  if(activePointer!==e.pointerId) return;
  joystick.releasePointerCapture(e.pointerId);
  activePointer=null;
  joyKnob.style.transform = 'translate(0,0)';
  moveX=0; moveY=0;
});

// útok
document.getElementById("attackBtn").addEventListener("touchstart", attack);
window.addEventListener("keydown", e=>{if(e.key===" ") attack();});

// pohyb hráča
function movePlayer(){
  if(!player.alive) return;
  let newX = player.x + (keys["a"]?-player.speed:0) + (keys["d"]?player.speed:0) + moveX*player.speed;
  let newY = player.y + (keys["w"]?-player.speed:0) + (keys["s"]?player.speed:0) + moveY*player.speed;
  let collision = walls.some(w=> collides(newX,newY,player.size,w));
  if(!collision){
    player.x = Math.max(0, Math.min(mapSize-player.size, newX));
    player.y = Math.max(0, Math.min(mapSize-player.size, newY));
  }
}

// kolízie
function collides(px,py,size,w){
  if(w.shape==="rect"){
    return px < w.x + w.w && px + size > w.x && py < w.y + w.h && py + size > w.y;
  } else if(w.shape==="circle"){
    const dx = (px+size/2) - (w.x+w.w/2);
    const dy = (py+size/2) - (w.y+w.h/2);
    return Math.hypot(dx,dy) < (size/2 + w.w/2);
  } else if(w.shape==="triangle"){
    return px < w.x + w.w && px + size > w.x && py < w.y + w.h && py + size > w.y;
  }
  return false;
}

// nepriatelia + útok
function moveEnemies(){
  enemies.forEach(e=>{
    if(!e.alive) return;
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);
    if(dist>5){
      const newX = e.x + dx/dist*e.speed;
      const newY = e.y + dy/dist*e.speed;
      if(!walls.some(w=>collides(newX,newY,e.size,w))){
        e.x = newX;
        e.y = newY;
      }
    }
    if(dist < 40 && e.attackCooldown <= 0){
      player.hp -= 10;
      e.attackCooldown = 50;
      if(player.hp <= 0){
        player.hp = 0;
        player.alive = false;
        let lose = Math.floor(55 + Math.random()*16);
        trophies = Math.max(0, trophies - lose);
        localStorage.setItem("trophies", trophies);
        alert(`💀 Prehral si! -${lose} trofejí`);
        location.reload();
      }
    }
    if(e.attackCooldown>0) e.attackCooldown--;
  });
}

// útok hráča
function attack(){
  enemies.forEach(e=>{
    if(!e.alive) return;
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    if(Math.hypot(dx,dy)<45){
      e.alive=false;
      trophies += Math.floor(Math.random()*15)+1;
      localStorage.setItem("trophies", trophies);
    }
  });
}

// liečenie
function checkHealing(){
  healPacks = healPacks.filter(h=>{
    const dist = Math.hypot(player.x - h.x, player.y - h.y);
    if(dist < 40){
      player.hp = Math.min(player.maxHp, player.hp + 25);
      return false;
    }
    return true;
  });
}

// vykreslenie mapy
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const camX = player.x - canvas.width/2;
  const camY = player.y - canvas.height/2;

  ctx.fillStyle="#f7d94c";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle="green";
  ctx.lineWidth=6;
  ctx.strokeRect(-camX, -camY, mapSize, mapSize);

  walls.forEach(w=>{
    const x = w.x - camX, y = w.y - camY;
    ctx.fillStyle = w.color;
    if(w.shape==="rect") ctx.fillRect(x,y,w.w,w.h);
    else if(w.shape==="circle"){
      ctx.beginPath();
      ctx.arc(x+w.w/2,y+w.h/2,w.w/2,0,Math.PI*2);
      ctx.fill();
    } else if(w.shape==="triangle"){
      ctx.beginPath();
      ctx.moveTo(x+w.w/2,y);
      ctx.lineTo(x,y+w.h);
      ctx.lineTo(x+w.w,y+w.h);
      ctx.closePath();
      ctx.fill();
    }
  });

  healPacks.forEach(h=>{
    const x = h.x - camX, y = h.y - camY;
    ctx.fillStyle="red";
    ctx.fillRect(x-5,y-15,10,30);
    ctx.fillRect(x-15,y-5,30,10);
  });

  ctx.fillStyle="red";
  ctx.fillRect(player.x-camX,player.y-camY,player.size,player.size);

  ctx.fillStyle="purple";
  enemies.forEach(e=>{
    if(e.alive){
      const x = e.x-camX, y = e.y-camY;
      ctx.fillRect(x,y,e.size,e.size);
    }
  });

  ctx.fillStyle="black";
  ctx.font="20px Arial";
  ctx.fillText(`🏆 Trofeje: ${trophies}`, 20, 30);

  // HP bar hráča
ctx.fillStyle="black";
ctx.fillRect(20, 50, 200, 20);
ctx.fillStyle="lime";
ctx.fillRect(20, 50, (player.hp/player.maxHp)*200, 20);
ctx.strokeStyle="white";
ctx.strokeRect(20, 50, 200, 20);

// Zobrazenie presného počtu životov
ctx.fillStyle = "black";
ctx.font = "16px Arial";
ctx.fillText(`${player.hp} / ${player.maxHp}`, 230, 65);

  // vykreslenie radaru
  drawRadar();
}

// --- radar ---
function drawRadar(){
  rCtx.clearRect(0,0,radar.width,radar.height);
  // steny
  walls.forEach(w=>{
    rCtx.fillStyle=w.color;
    let x=w.x*radarScale, y=w.y*radarScale, wW=w.w*radarScale, wH=w.h*radarScale;
    if(w.shape==="rect") rCtx.fillRect(x,y,wW,wH);
    else if(w.shape==="circle"){
      rCtx.beginPath();
      rCtx.arc(x+wW/2,y+wH/2,wW/2,0,Math.PI*2);
      rCtx.fill();
    } else if(w.shape==="triangle"){
      rCtx.beginPath();
      rCtx.moveTo(x+wW/2,y);
      rCtx.lineTo(x,y+wH);
      rCtx.lineTo(x+wW,y+wH);
      rCtx.closePath();
      rCtx.fill();
    }
  });

  // nepriatelia
  enemies.forEach(e=>{
    if(e.alive){
      rCtx.fillStyle="purple";
      rCtx.fillRect(e.x*radarScale-2,e.y*radarScale-2,4,4);
    }
  });

  // hráč
  rCtx.fillStyle="red";
  rCtx.fillRect(player.x*radarScale-3,player.y*radarScale-3,6,6);
}

// hlavná slučka
function loop(){
  movePlayer();
  moveEnemies();
  checkHealing();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
