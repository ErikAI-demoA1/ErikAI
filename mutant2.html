<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI OS – Supermutant panel</title>
<style>
  body {
    font-family: Inter, Arial, sans-serif;
    margin: 0;
    background: linear-gradient(180deg, #071021, #02061a);
    color: #f3fcff;
  }
  .panel { display: flex; flex-wrap: wrap; padding: 12px; gap:12px; }
  .module {
    background: #072034;
    border-radius: 12px;
    padding: 12px;
    flex: 1 1 300px;
    min-width: 300px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  }
  h3 { margin-top:0; color: #06b6d4; }
  button { padding: 6px 12px; margin: 4px 0; border-radius: 6px; border:none; cursor:pointer; background:#06b6d4; color:#021; font-weight:700; }
  input, textarea, select { width:100%; padding:6px; margin:4px 0; border-radius:6px; border:1px solid rgba(255,255,255,0.1); background:transparent; color:#f3fcff; }
  .like-btn.liked { background:#8b5cf6; color:#fff; }
  .card { background:#051225; border-radius:12px; padding:8px; margin-top:8px; }
</style>
</head>
<body>

<h1 style="text-align:center;">ErikAI OS – Supermutant Panel</h1>
<div class="panel">

  <!-- Chat -->
  <div class="module">
    <h3>Chat / Emoji</h3>
    <div id="chatBox" class="card" style="height:150px; overflow:auto;"></div>
    <input type="text" id="chatInput" placeholder="Napíš správu...">
    <button onclick="sendMessage()">Odoslať</button>
    <div>
      <button onclick="addEmoji('😊')">😊</button>
      <button onclick="addEmoji('😂')">😂</button>
      <button onclick="addEmoji('👍')">👍</button>
    </div>
  </div>

  <!-- Sociálne siete -->
  <div class="module">
    <h3>Sociálne – Lokálne</h3>
    <div class="card" id="post1">Toto je demo príspevok</div>
    <button class="like-btn" onclick="toggleLike(this)">Lajk</button>
    <button onclick="savePost()">Uložiť</button>
    <textarea id="commentInput" placeholder="Napíš komentár"></textarea>
    <button onclick="addComment()">Pridať komentár</button>
    <div id="commentsBox" class="card" style="height:80px; overflow:auto;"></div>
  </div>

  <!-- Video -->
  <div class="module">
    <h3>Video prehrávač</h3>
    <video id="videoPlayer" width="100%" controls>
      <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
      Váš prehliadač nepodporuje video.
    </video>
    <button onclick="addToPlaylist('Demo video')">Pridať do playlistu</button>
    <div id="videoPlaylist" class="card" style="height:80px; overflow:auto;"></div>
  </div>

  <!-- Hudba -->
  <div class="module">
    <h3>Hudba</h3>
    <audio id="audioPlayer" controls>
      <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mp3">
      Váš prehliadač nepodporuje audio.
    </audio>
    <button onclick="likeSong()">Like</button>
    <button onclick="addSongToPlaylist('Demo song')">Pridať do playlistu</button>
    <div id="musicPlaylist" class="card" style="height:80px; overflow:auto;"></div>
  </div>

  <!-- Nakupovanie -->
  <div class="module">
    <h3>Košík / Wishlist</h3>
    <div class="card">Produkt: ErikAI T-shirt</div>
    <button onclick="addToCart('ErikAI T-shirt')">Pridať do košíka</button>
    <button onclick="addToWishlist('ErikAI T-shirt')">Pridať do wishlistu</button>
    <div id="cart" class="card" style="height:80px; overflow:auto;"></div>
    <div id="wishlist" class="card" style="height:80px; overflow:auto;"></div>
  </div>

  <!-- Zdravie / fitness -->
  <div class="module">
    <h3>Krokomer / Progres</h3>
    <div>Kroky: <span id="steps">0</span></div>
    <button onclick="addStep()">+1 krok</button>
    <div>Progres cvičenia:</div>
    <progress id="workoutProgress" value="0" max="100" style="width:100%;"></progress>
    <button onclick="addWorkout()">+10%</button>
  </div>

</div>

<script>
  // --- Chat ---
  function sendMessage(){
    const txt = document.getElementById('chatInput').value;
    if(!txt) return;
    const div = document.createElement('div'); div.textContent = txt; document.getElementById('chatBox').appendChild(div);
    document.getElementById('chatInput').value = '';
  }
  function addEmoji(e){ document.getElementById('chatBox').appendChild(document.createTextNode(e)); }

  // --- Sociálne ---
  function toggleLike(btn){ btn.classList.toggle('liked'); }
  function savePost(){ alert('Príspevok uložený lokálne!'); }
  function addComment(){
    const txt = document.getElementById('commentInput').value;
    if(!txt) return;
    const div = document.createElement('div'); div.textContent = txt; document.getElementById('commentsBox').appendChild(div);
    document.getElementById('commentInput').value = '';
  }

  // --- Video ---
  function addToPlaylist(name){
    const div = document.createElement('div'); div.textContent = name; document.getElementById('videoPlaylist').appendChild(div);
  }

  // --- Hudba ---
  function likeSong(){ alert('Pieseň lajknutá lokálne!'); }
  function addSongToPlaylist(name){
    const div = document.createElement('div'); div.textContent = name; document.getElementById('musicPlaylist').appendChild(div);
  }

  // --- Nakupovanie ---
  function addToCart(item){
    const div = document.createElement('div'); div.textContent = item; document.getElementById('cart').appendChild(div);
  }
  function addToWishlist(item){
    const div = document.createElement('div'); div.textContent = item; document.getElementById('wishlist').appendChild(div);
  }

  // --- Zdravie / fitness ---
  function addStep(){ 
    const el = document.getElementById('steps'); 
    el.textContent = parseInt(el.textContent)+1; 
  }
  function addWorkout(){
    const el = document.getElementById('workoutProgress'); 
    el.value = Math.min(el.value+10,100);
  }
</script>

</body>
</html>
