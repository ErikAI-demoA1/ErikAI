<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RocketBall — Goals, AI & Jump (ErikAI)</title>

<style>
html, body { margin:0; height:100%; font-family:'Inter', Arial, sans-serif; background:#061426; color:#fff; overflow:hidden; }
#hud { position:fixed; left:12px; top:12px; padding:10px 14px; border-radius:10px; font-size:14px; background:rgba(0,0,0,0.35); backdrop-filter:blur(6px); z-index:40; box-shadow:0 0 12px rgba(0,0,0,0.3);}
#mini { position:fixed; right:12px; top:12px; padding:8px 12px; border-radius:8px; font-size:13px; background:rgba(0,0,0,0.18); backdrop-filter:blur(4px); z-index:40;}
.note { position:fixed; left:12px; top:60px; color:#9fb2d1; font-size:13px; z-index:40;}
.goal-banner { position:fixed; left:50%; top:40%; transform:translate(-50%, -50%); background:rgba(255,120,60,0.92); padding:22px 28px; border-radius:12px; font-size:36px; font-weight:700; color:#fff; z-index:60; display:none; text-align:center; box-shadow:0 0 20px rgba(255,120,60,0.6);}
#ui { position:fixed; left:12px; bottom:12px; display:flex; gap:10px; align-items:center; pointer-events:none; z-index:40;}
.joystick { width:130px; height:130px; border-radius:50%; background:rgba(255,255,255,0.03); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; touch-action:none; pointer-events:auto; box-shadow:0 0 8px rgba(0,0,0,0.3);}
.stick { width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,0.12); display:flex; align-items:center; justify-content:center; transform:translate(0,0);}
#controlsRight { position:fixed; right:12px; bottom:12px; display:flex; flex-direction:column; gap:12px; pointer-events:none; z-index:40;}
.btn { padding:10px 16px; border-radius:10px; border:none; background:#1db954; color:white; font-weight:600; cursor:pointer; pointer-events:auto; transition:all 0.2s ease; box-shadow:0 0 10px rgba(0,0,0,0.3);}
.btn:hover { background:#1ed760; }
.btn.ghost { background:rgba(255,255,255,0.06);}
#startBtn { position:fixed; top:12px; right:12px; padding:10px 18px; border-radius:10px; border:none; background:#ff4b4b; color:#fff; z-index:50; cursor:pointer; font-weight:700; box-shadow:0 0 12px rgba(255,75,75,0.6); transition:all 0.2s ease;}
#startBtn:hover { background:#ff6b6b;}
canvas { display:block;}
@media (min-width:900px){ .joystick{width:110px;height:110px;} .stick{width:48px;height:48px;} }
</style>
</head>
<body>

<button id="startBtn">Spusti / Reset</button>
<div id="hud">goly — A: <span id="scoreA">0</span> • B: <span id="scoreB">0</span> • speed: <span id="speed">0</span></div>
<div id="mini">Aréna: <span id="arenaSize">200</span>m</div>
<div class="note">RocketBall — teraz s bránami, boost, drift, skok a AI</div>
<div class="goal-banner" id="goalBanner">GOAL!</div>

<div id="ui">
  <div id="joy" class="joystick" aria-label="Joystick">
    <div id="stick" class="stick"></div>
  </div>
</div>
<div id="controlsRight">
  <button id="boostBtn" class="btn">BOOST</button>
  <button id="cameraBtn" class="btn ghost">Kamera: Follow</button>
</div>

<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>

<script>
// --- Base variables ---
let scene, camera, renderer;
let car, ball, ground, aiCar;
let clock, playing=false;
let carSpeed=0, targetSpeed=0, steer=0;
let ballVel = new THREE.Vector3();
let arena = 200;
const hudSpeed = document.getElementById('speed');
const scoreAEl = document.getElementById('scoreA');
const scoreBEl = document.getElementById('scoreB');
const goalBanner = document.getElementById('goalBanner');
document.getElementById('arenaSize').innerText = arena;
let score = {A:0, B:0};
let goalCooldown = false;

// --- Physics / boost ---
let maxSpeed=9, accel=28, brake=36, driftFactor=0.88;
let boostMultiplier=2.6, boostDuration=1200, boostDrainRate=80, boostRechargeRate=25;
let boost = { val: 100, max: 100, active:false };

// --- Jump variables ---
let playerVelY = 0;      
let playerGrounded = true; 
const jumpForce = 6;    

// --- Arena / Goals ---
const goalWidthRatio = 0.36, goalDepth = 2.5;
let half;

// --- Init ---
function init(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x061426);
  camera = new THREE.PerspectiveCamera(66, window.innerWidth/window.innerHeight, 0.1, 4000);
  camera.position.set(0, 9, 18);
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  document.body.appendChild(renderer.domElement);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x222a3a, 0.8); scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff,0.6); dir.position.set(8,20,10); scene.add(dir);

  const gmat = new THREE.MeshStandardMaterial({color:0x123442, roughness:0.95});
  ground = new THREE.Mesh(new THREE.PlaneGeometry(arena,arena,6,6), gmat);
  ground.rotation.x=-Math.PI/2; scene.add(ground);

  // Player car
  const carMat = new THREE.MeshStandardMaterial({color:0xff6b6b, roughness:0.35, metalness:0.1});
  car = new THREE.Mesh(new THREE.BoxGeometry(1.9,0.6,2.6), carMat);
  car.position.set(0,0.5,0); scene.add(car);

  // Ball
  const ballMat = new THREE.MeshStandardMaterial({color:0xffff7f, roughness:0.5});
  ball = new THREE.Mesh(new THREE.SphereGeometry(0.95,32,32), ballMat);
  ball.position.set(6,1.5,-6); scene.add(ball);

  // AI Car
  const aiMat = new THREE.MeshStandardMaterial({color:0x6b6bff, roughness:0.4, metalness:0.1});
  aiCar = new THREE.Mesh(new THREE.BoxGeometry(1.9,0.6,2.6), aiMat);
  aiCar.position.set(0,0.5,8); scene.add(aiCar);

  // Walls
  const wallMat = new THREE.MeshStandardMaterial({color:0x052233});
  const w = arena/2;
  const wallGeoH = new THREE.BoxGeometry(arena+2,2.2,1);
  const wallGeoV = new THREE.BoxGeometry(1,2.2,arena+2);
  scene.add(new THREE.Mesh(wallGeoH, wallMat).position.set(0,1,-w));
  scene.add(new THREE.Mesh(wallGeoH, wallMat).position.set(0,1,w));
  scene.add(new THREE.Mesh(wallGeoV, wallMat).position.set(-w,1,0));
  scene.add(new THREE.Mesh(wallGeoV, wallMat).position.set(w,1,0));

  // Goals
  half = arena/2;
  const goalWidth = arena*goalWidthRatio;
  const goalMat = new THREE.MeshStandardMaterial({color:0xffb86b, emissive:0x220800});
  const gLeft = new THREE.Mesh(new THREE.BoxGeometry(goalWidth,1.6,goalDepth), goalMat);
  gLeft.position.set(0,0.8,-half+goalDepth/2+0.2); scene.add(gLeft);
  const gRight = new THREE.Mesh(new THREE.BoxGeometry(goalWidth,1.6,goalDepth), goalMat);
  gRight.position.set(0,0.8,half-goalDepth/2-0.2); scene.add(gRight);

  clock = new THREE.Clock();
  window.addEventListener('resize', onResize);
  animate();
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function resetPositions(afterGoal=false){
  car.position.set(0,0.5, afterGoal? (Math.random()>0.5?6:-6):0);
  car.rotation.set(0,0,0); carSpeed=0; targetSpeed=0; steer=0;
  playerVelY=0; playerGrounded=true;
  ball.position.set((Math.random()-0.5)*6,1.5,(Math.random()-0.5)*6 - (afterGoal? (Math.random()>0.5?-8:8):0));
  ballVel.set(0,0,0);
  aiCar.position.set(0,0.5,8);
  boost.val = boost.max; boost.active=false;
  updateHUD();
}

function updateHUD(){
  hudSpeed.innerText = Math.round(Math.abs(carSpeed*10))/10;
  scoreAEl.innerText = score.A; scoreBEl.innerText = score.B;
}

function showGoalBanner(){ goalBanner.style.display=''; setTimeout(()=>goalBanner.style.display='none',1400); }

let cameraFollow = true;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());

  if(playing){
    // --- Player car physics ---
    if(targetSpeed>carSpeed){ carSpeed+=accel*dt; if(carSpeed>targetSpeed) carSpeed=targetSpeed; }
    else if(targetSpeed<carSpeed){ carSpeed-=brake*dt; if(carSpeed<targetSpeed) carSpeed=targetSpeed; }

    const effectiveSpeed = carSpeed * (boost.active ? boostMultiplier : 1.0);
    const forward = new THREE.Vector3(Math.sin(car.rotation.y),0,Math.cos(car.rotation.y));
    car.position.addScaledVector(forward, effectiveSpeed*dt);
    car.rotation.y += steer*(0.8 + (Math.abs(carSpeed)/maxSpeed)*1.8)*dt;
    carSpeed *= 0.999 - (0.0004*dt*100);

    // --- Player jump ---
    playerVelY -= 9.8*dt;
    car.position.y += playerVelY*dt;
    if(car.position.y <= 0.5){ car.position.y=0.5; playerVelY=0; playerGrounded=true; }

    // --- Ball physics ---
    ballVel.y -= 9.8*dt; ball.position.addScaledVector(ballVel,dt);
    if(ball.position.y<0.95){ ball.position.y=0.95; if(ballVel.y<0) ballVel.y*=-0.42; ballVel.x*=0.993; ballVel.z*=0.993; }

    // --- Collision car-ball ---
    const carToBall = new THREE.Vector3().subVectors(ball.position,car.position);
    const dist = carToBall.length(); const rBall=0.95,rCar=1.42,minDist=rBall+rCar;
    if(dist<minDist){
      const n = carToBall.clone().normalize();
      ball.position.addScaledVector(n,(minDist-dist)+0.01);
      const impulse = n.clone().multiplyScalar(Math.max(1,carSpeed)*(boost.active? boostMultiplier:1.0)+1.2);
      impulse.y = Math.min(4.2,0.9+Math.abs(carSpeed)*0.25); ballVel.add(impulse);
      car.position.addScaledVector(n,-0.02*Math.min(carSpeed,3.2));
    }

    // --- Ball-wall bounce ---
    const halfArena = arena/2-0.7;
    if(ball.position.x<-halfArena){ ball.position.x=-halfArena; ballVel.x*=-0.72; }
    if(ball.position.x>halfArena){ ball.position.x=halfArena; ballVel.x*=-0.72; }
    if(ball.position.z<-halfArena){ ball.position.z=-halfArena; ballVel.z*=-0.72; }
    if(ball.position.z>halfArena){ ball.position.z=halfArena; ballVel.z*=-0.72; }

    // --- Car clamp ---
    car.position.x = Math.max(-halfArena, Math.min(halfArena, car.position.x));
    car.position.z = Math.max(-halfArena, Math.min(halfArena, car.position.z));

    // --- Camera follow ---
    if(cameraFollow){
      const camOffset = new THREE.Vector3(0,6.2,13.2).applyAxisAngle(new THREE.Vector3(0,1,0),car.rotation.y);
      const camTarget = new THREE.Vector3().copy(car.position).add(camOffset);
      camera.position.lerp(camTarget,0.14);
      camera.lookAt(new THREE.Vector3().copy(car.position).add(new THREE.Vector3(0,1.2,0)));
    }

    // --- Boost ---
    if(boost.active){ boost.val-=boostDrainRate*dt; if(boost.val<=0){ boost.val=0; boost.active=false; } }
    else{ boost.val = Math.min(boost.max, boost.val+boostRechargeRate*dt); }

    updateHUD();
    checkGoal();

    // --- AI car ---
    let dirToBall = new THREE.Vector3().subVectors(ball.position, aiCar.position); dirToBall.y=0;
    if(dirToBall.length()>0.5){ dirToBall.normalize(); aiCar.position.addScaledVector(dirToBall,5*dt); aiCar.lookAt(ball.position.x, aiCar.position.y, ball.position.z);}
  }

  renderer.render(scene,camera);
}

// --- Goal ---
function checkGoal(){
  if(goalCooldown) return;
  const halfArena = arena/2-0.7;
  const goalWidth = arena*goalWidthRatio;
  const gx = Math.abs(ball.position.x);
  if(ball.position.z<-halfArena+0.2 && gx<goalWidth/2 && Math.abs(ballVel.z)>0.2){ score.B++; scoreBEl.innerText=score.B; goalHappened('B'); }
  else if(ball.position.z>halfArena-0.2 && gx<goalWidth/2 && Math.abs(ballVel.z)>0.2){ score.A++; scoreAEl.innerText=score.A; goalHappened('A'); }
}
function goalHappened(team){ goalCooldown=true; showGoalBanner(); playing=false; setTimeout(()=>{ resetPositions(true); playing=true; goalCooldown=false;},1400); }

// --- Joystick ---
const joy = document.getElementById('joy'); const stick = document.getElementById('stick');
let active=false, start={x:0,y:0}, maxR=48;
function joyDown(ev){ ev.preventDefault(); active=true; const p=ev.touches?ev.touches[0]:ev; const rect=joy.getBoundingClientRect(); start.x=rect.left+rect.width/2; start.y=rect.top+rect.height/2; moveStick(p.clientX,p.clientY); }
function joyMove(ev){ if(!active) return; ev.preventDefault(); const p=ev.touches?ev.touches[0]:ev; moveStick(p.clientX,p.clientY);}
function joyUp(ev){ active=false; stick.style.transform='translate(0,0)'; targetSpeed=0; steer=0; }
function moveStick(cx,cy){ const dx=cx-start.x, dy=cy-start.y; const nx=Math.max(-1,Math.min(1,dx/maxR)), ny=Math.max(-1,Math.min(1,dy/maxR)); stick.style.transform=`translate(${nx*maxR}px,${ny*maxR}px)`; targetSpeed=Math.max(-maxSpeed*0.5, Math.min(maxSpeed,-ny*maxSpeed)); steer=nx*0.98; }
joy.addEventListener('pointerdown',joyDown,{passive:false}); joy.addEventListener('pointermove',joyMove,{passive:false}); window.addEventListener('pointerup',joyUp);
joy.addEventListener('touchstart',joyDown,{passive:false}); joy.addEventListener('touchmove',joyMove,{passive:false}); window.addEventListener('touchend',joyUp);

// --- Boost ---
const boostBtn = document.getElementById('boostBtn');
boostBtn.addEventListener('click',()=>{ if(!playing) return; if(boost.val>18&&!boost.active) enableBoost(); });
boostBtn.addEventListener('touchstart',(e)=>{ e.preventDefault(); if(!playing) return; if(boost.val>18&&!boost.active) enableBoost(); });
function enableBoost(){ if(boost.val)
    function enableBoost(){ 
    if(boost.val<=0) return; 
    boost.active=true; 
    setTimeout(()=>{boost.active=false;}, boostDuration); 
}

// --- Jump Button (Space alebo dotyk) ---
window.addEventListener('keydown', (e)=>{
    if(!playing) return;
    if(e.code==='Space' && playerGrounded){
        playerVelY = jumpForce;
        playerGrounded = false;
    }
});

// --- Camera Toggle ---
document.getElementById('cameraBtn').addEventListener('click', ()=>{
    cameraFollow = !cameraFollow; 
    document.getElementById('cameraBtn').innerText = cameraFollow?'Kamera: Follow':'Kamera: Free'; 
});

// --- Start / Reset ---
document.getElementById('startBtn').addEventListener('click', () => {
    playing = true;
    resetPositions(false);
    document.getElementById('startBtn').innerText = 'Reset';
});

// --- Optional: Device Tilt Steering ---
if (window.DeviceOrientationEvent) {
    window.addEventListener('deviceorientation', (e) => {
        if (!playing) return;
        const gamma = e.gamma || 0; // left-right tilt
        const beta = e.beta || 0;   // forward-back tilt
        steer = Math.max(-1, Math.min(1, gamma / 30)) * 0.9;
        targetSpeed = Math.max(-maxSpeed * 0.5, Math.min(maxSpeed, ((beta - 45) / 25) * maxSpeed));
    });
}

// --- Initialize ---
init();
resetPositions(false);
animate();
</script>
</body>
</html>
