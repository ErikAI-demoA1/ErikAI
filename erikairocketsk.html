<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RocketSK v3.3 — Ultimate Aerial & Flight Physics (ErikAI)</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    background: radial-gradient(circle at center, #0a1f3d 0%, #030810 100%);
    color: #fff;
    overflow: hidden;
}

/* --- HUD / skóre --- */
#hud {
    position: fixed;
    left: 12px;
    top: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(12px);
    z-index: 40;
    box-shadow: 0 0 20px rgba(0, 255, 200, 0.4);
    color: #00ffe0;
    font-weight: 700;
    border: 1px solid rgba(0,255,220,0.2);
}

/* --- Boost Bar Container --- */
#boostContainer {
    position: fixed;
    right: 12px;
    top: 60px;
    width: 150px;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(10px);
    border-radius: 10px;
    padding: 8px 12px;
    z-index: 40;
    border: 1px solid rgba(255,140,0,0.3);
}
#boostLabel {
    font-size: 11px;
    color: #ff9d00;
    font-weight: 800;
    margin-bottom: 4px;
}
#boostBarBg {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    overflow: hidden;
}
#boostBarFill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #ff9d00, #ff4500);
}

.note {
    position: fixed;
    left: 12px;
    top: 58px;
    color: #8faac9;
    font-size: 11px;
    z-index: 40;
    text-shadow: 0 0 4px rgba(0,0,0,0.5);
}

/* --- Goal Banner --- */
.goal-banner {
    position: fixed;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%) scale(0.8);
    background: linear-gradient(135deg, #ff7a3c, #ff1e1e);
    padding: 24px 40px;
    border-radius: 16px;
    font-size: 36px;
    font-weight: 900;
    color: #fff;
    z-index: 60;
    display: none;
    text-align: center;
    box-shadow: 0 0 40px rgba(255,120,60,0.9);
    text-transform: uppercase;
}

/* --- Joystick --- */
#ui {
    position: fixed;
    left: 16px;
    bottom: 16px;
    display: flex;
    z-index: 40;
    pointer-events: none;
}

.joystick {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    pointer-events: auto;
    border: 2px solid rgba(0,255,220,0.35);
}

.stick {
    width: 50px; height: 50px;
    border-radius: 50%;
    background: rgba(0,255,220,0.25);
    border: 1px solid rgba(0,255,220,0.7);
}

/* --- Right-side buttons --- */
#controlsRight {
    position: fixed;
    right: 16px;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 40;
    pointer-events: none;
}

.btn {
    padding: 14px 20px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(145deg, #ff8c00, #ff4500);
    color: white;
    font-weight: 700;
    cursor: pointer;
    pointer-events: auto;
    font-size: 14px;
    box-shadow: 0 0 16px rgba(255,100,0,0.4);
}

.btn:active { transform: scale(0.94); }

.btn.jump-btn {
    background: linear-gradient(145deg, #00bfff, #1e90ff);
    box-shadow: 0 0 16px rgba(0,191,255,0.4);
}

#startBtn {
    position: fixed;
    top: 12px;
    right: 12px;
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(145deg, #00ffcc, #00b386);
    color: #030810;
    z-index: 50;
    cursor: pointer;
    font-weight: 800;
}

canvas { display: block; }
</style>
</head>
<body>

<button id="startBtn">ŠTART / RESET</button>
<div id="hud">RED: <span id="scoreA">0</span> • BLUE: <span id="scoreB">0</span> • <span id="speed">0</span> km/h</div>
<div class="note">🎮 Joystick: Pohyb, let a 360° rotácia vo vzduchu</div>
<div id="boostContainer">
    <div id="boostLabel">BOOST</div>
    <div id="boostBarBg"><div id="boostBarFill"></div></div>
</div>
<div class="goal-banner" id="goalBanner">GÓÓÓL!</div>

<div id="ui">
  <div id="joy" class="joystick"><div id="stick" class="stick"></div></div>
</div>

<div id="controlsRight">
  <button id="boostBtn" class="btn">⚡ BOOST</button>
  <button id="jumpBtn" class="btn jump-btn">🚀 JUMP / FLIP</button>
</div>

<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
<script>
let scene, camera, renderer;
let car, ball, ground, aiCar;
let clock, playing = false;
let carSpeed = 0, targetSpeed = 0, steer = 0, joystickX = 0, joystickY = 0;
let ballVel = new THREE.Vector3();
let arena = 200;
const hudSpeed = document.getElementById('speed');
const scoreAEl = document.getElementById('scoreA');
const scoreBEl = document.getElementById('scoreB');
const goalBanner = document.getElementById('goalBanner');
const boostBarFill = document.getElementById('boostBarFill');
let score = {A: 0, B: 0};
let goalCooldown = false;

let maxSpeed = 24, accel = 45, brake = 55;
let boost = {val: 100, max: 100, active: false};
const goalWidthRatio = 0.4, goalDepth = 4, goalHeight = 12;
let half = arena / 2;

// --- Skoky a Rocket League Aerial / Flip Fyzika ---
let isJumping = false, jumpVel = 0, canDoubleJump = false;

function jumpPlayer(){
    if(!playing) return;
    if(!isJumping){
        // 1. Skok zo zeme
        isJumping = true;
        jumpVel = 14;
        canDoubleJump = true;
    } else if(canDoubleJump) {
        // 2. Skok (Double-Jump / Flip): rotuje presne tam, kam hráč ťahá joystick
        canDoubleJump = false;
        jumpVel = 10;
        car.rotation.y -= joystickX * 1.8;
        car.rotation.x -= joystickY * 1.5;
        car.rotation.z -= joystickX * 1.2;
    }
}

function updateJump(dt){
    if(isJumping){
        car.position.y += jumpVel * dt;
        jumpVel -= 28 * dt; // gravitácia vo vzduchu

        // Ak je auto vo vzduchu, joystickom plne ovládaš náklon, smer a rotáciu (Aerial Flight)
        if(car.position.y > 0.46) {
            car.rotation.y -= joystickX * 3.0 * dt;
            car.rotation.x -= joystickY * 2.5 * dt;
        }

        // Dopad na zem
        if(car.position.y <= 0.45){
            car.position.y = 0.45;
            isJumping = false;
            jumpVel = 0;
            canDoubleJump = false;
            // Vyrovnanie auta pri dopade na zem
            car.rotation.x = THREE.MathUtils.lerp(car.rotation.x, 0, 0.4);
            car.rotation.z = THREE.MathUtils.lerp(car.rotation.z, 0, 0.4);
        }
    }
}

// --- AI pre Súpera ---
function initAI(){
    aiCar = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({color: 0x1e90ff, roughness: 0.2, metalness: 0.8});
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.6, 2.6), bodyMat);
    body.position.y = 0.5;
    aiCar.add(body);
    aiCar.position.set(0, 0.45, 25);
    scene.add(aiCar);
}

function updateAI(dt){
    if(!playing) return;
    const dirToBall = new THREE.Vector3().subVectors(ball.position, aiCar.position);
    const targetAngle = Math.atan2(dirToBall.x, dirToBall.z);
    
    let angleDiff = targetAngle - aiCar.rotation.y;
    angleDiff = ((angleDiff + Math.PI) % (2 * Math.PI)) - Math.PI;
    aiCar.rotation.y += angleDiff * 3.5 * dt;

    const forward = new THREE.Vector3(Math.sin(aiCar.rotation.y), 0, Math.cos(aiCar.rotation.y));
    aiCar.position.addScaledVector(forward, 16 * dt);

    const carToBall = new THREE.Vector3().subVectors(ball.position, aiCar.position);
    if(carToBall.length() < 2.2){
        const n = carToBall.clone().normalize();
        ballVel.add(n.clone().multiplyScalar(18));
        ballVel.y += 5;
    }

    const halfArena = arena / 2 - 2;
    aiCar.position.x = Math.max(-halfArena, Math.min(halfArena, aiCar.position.x));
    aiCar.position.z = Math.max(-halfArena, Math.min(halfArena, aiCar.position.z));
}

// --- Inicializácia Scény ---
function init(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040b16);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 4000);
    renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x112244, 0.8); 
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 0.9); 
    dir.position.set(30, 60, 30);
    scene.add(dir);

    // Podlaha
    ground = new THREE.Mesh(
        new THREE.PlaneGeometry(arena, arena), 
        new THREE.MeshStandardMaterial({color: 0x08162b, roughness: 0.8})
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Hráčovo Auto
    car = new THREE.Group();
    const carMat = new THREE.MeshStandardMaterial({color: 0xff3b3b, roughness: 0.2, metalness: 0.8});
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.55, 2.6), carMat);
    body.position.y = 0.4;
    car.add(body);
    car.position.set(0, 0.45, 0);
    scene.add(car);

    // Lopta
    ball = new THREE.Mesh(
        new THREE.SphereGeometry(1.1, 32, 32), 
        new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.2})
    );
    ball.position.set(0, 1.1, -10);
    scene.add(ball);

    // Steny a obojstranné bránky
    const w = arena / 2;
    const goalWidth = arena * goalWidthRatio;
    createWallWithGoal(0, 2, -w, arena, goalWidth, 0xef4444);
    createWallWithGoal(0, 2, w, arena, goalWidth, 0x3b82f6);
    
    const wallMat = new THREE.MeshStandardMaterial({color: 0x0d2342, roughness: 0.5});
    scene.add(new THREE.Mesh(new THREE.BoxGeometry(1.5, 4, arena), wallMat).translateOnAxis(new THREE.Vector3(-w,2,0), 1));
    scene.add(new THREE.Mesh(new THREE.BoxGeometry(1.5, 4, arena), wallMat).translateOnAxis(new THREE.Vector3(w,2,0), 1));

    initAI();
    clock = new THREE.Clock();
    window.addEventListener('resize', onResize);
    animate();
}

function createWallWithGoal(x, y, z, totalWidth, gWidth, colorHex) {
    const wallMat = new THREE.MeshStandardMaterial({color: 0x0d2342, roughness: 0.5});
    const sideWidth = (totalWidth - gWidth) / 2;
    
    const leftWall = new THREE.Mesh(new THREE.BoxGeometry(sideWidth, 4, 1.5), wallMat);
    leftWall.position.set(x - gWidth/2 - sideWidth/2, y, z);
    scene.add(leftWall);

    const rightWall = new THREE.Mesh(new THREE.BoxGeometry(sideWidth, 4, 1.5), wallMat);
    rightWall.position.set(x + gWidth/2 + sideWidth/2, y, z);
    scene.add(rightWall);

    const crossbar = new THREE.Mesh(new THREE.BoxGeometry(gWidth, 1.5, 1.5), wallMat);
    crossbar.position.set(x, y + 2, z);
    scene.add(crossbar);

    const frameMat = new THREE.MeshBasicMaterial({color: colorHex});
    const postL = new THREE.Mesh(new THREE.BoxGeometry(0.4, goalHeight, 1.6), frameMat);
    postL.position.set(x - gWidth/2, goalHeight/2, z);
    const postR = postL.clone();
    postR.position.x = x + gWidth/2;
    scene.add(postL, postR);
}

function onResize(){ 
    camera.aspect = window.innerWidth / window.innerHeight; 
    camera.updateProjectionMatrix(); 
    renderer.setSize(window.innerWidth, window.innerHeight); 
}

function resetPositions(afterGoal = false){
    car.position.set(0, 0.45, afterGoal ? 15 : 0);
    car.rotation.set(0, 0, 0); 
    carSpeed = 0; targetSpeed = 0; steer = 0;
    ball.position.set(0, 1.1, 0);
    ballVel.set(0, 0, 0);
    boost.val = boost.max; 
    boost.active = false;
    aiCar.position.set(0, 0.45, -20);
}

function updateHUD(){
    hudSpeed.innerText = Math.round(Math.abs(carSpeed * 7.5));
    scoreAEl.innerText = score.A; 
    scoreBEl.innerText = score.B;
    boostBarFill.style.width = `${(boost.val / boost.max) * 100}%`;
}

function checkGoal(){
    if(goalCooldown) return;
    const halfArena = arena / 2 - 1.5;
    const goalWidth = arena * goalWidthRatio;
    const gx = Math.abs(ball.position.x);

    if(ball.position.z < -halfArena && gx < goalWidth / 2){
        score.B++; 
        triggerGoal("GÓÓÓL - MODRÝ TÍM!");
    } else if(ball.position.z > halfArena && gx < goalWidth / 2){
        score.A++; 
        triggerGoal("GÓÓÓL - ČERVENÝ TÍM!");
    }
}

function triggerGoal(text){
    goalCooldown = true;
    goalBanner.innerText = text;
    goalBanner.style.display = 'block';
    playing = false;

    setTimeout(() => {
        goalBanner.style.display = 'none';
        resetPositions(true);
        playing = true;
        goalCooldown = false;
    }, 1800);
}

// --- Hlavná Animačná Slučka ---
function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, clock.getDelta());

    if(playing){
        // Pohyb auta po zemi
        if(targetSpeed > carSpeed) carSpeed += accel * dt;
        else if(targetSpeed < carSpeed) carSpeed -= brake * dt;

        const effectiveSpeed = carSpeed * (boost.active ? 2.4 : 1.0);
        const forward = new THREE.Vector3(Math.sin(car.rotation.y), 0, Math.cos(car.rotation.y));
        
        // --- LET A VZNÁŠANIE S BOOSTOM VO VZDUCHU ---
        if(isJumping && boost.active) {
            jumpVel += 15 * dt; // Tlak boostu tlačí auto nahor
            const flightDir = new THREE.Vector3(Math.sin(car.rotation.y), Math.max(0.2, -joystickY), Math.cos(car.rotation.y)).normalize();
            car.position.addScaledVector(flightDir, 25 * dt);
        }

        car.position.addScaledVector(forward, effectiveSpeed * dt);
        if(!isJumping) car.rotation.y += steer * 2.5 * dt;
        carSpeed *= 0.985;

        // Fyzika lopty
        ballVel.y -= 15 * dt;
        ball.position.addScaledVector(ballVel, dt);

        if(ball.position.y < 1.1){ 
            ball.position.y = 1.1; 
            if(ballVel.y < 0) ballVel.y *= -0.55; 
            ballVel.x *= 0.98; 
            ballVel.z *= 0.98; 
        }

        // Kolízia auto <-> lopta
        const carToBall = new THREE.Vector3().subVectors(ball.position, car.position);
        if(carToBall.length() < 2.2){
            const n = carToBall.clone().normalize();
            ball.position.addScaledVector(n, 0.1);
            const hitPower = Math.max(4, Math.abs(carSpeed) * (boost.active ? 2.8 : 1.5));
            ballVel.copy(n.multiplyScalar(hitPower));
            ballVel.y += Math.abs(carSpeed) * 0.4 + (isJumping ? 7 : 2);
        }

        // Náraz lopty do stien / bránok
        const halfArena = arena / 2 - 1.5;
        const goalWidth = arena * goalWidthRatio;
        
        if(Math.abs(ball.position.x) > halfArena){ 
            ball.position.x = Math.sign(ball.position.x) * halfArena; 
            ballVel.x *= -0.7; 
        }
        if(Math.abs(ball.position.z) > halfArena){ 
            if(Math.abs(ball.position.x) > goalWidth / 2 || ball.position.y > goalHeight) {
                ball.position.z = Math.sign(ball.position.z) * halfArena; 
                ballVel.z *= -0.7; 
            }
        }

        car.position.x = Math.max(-halfArena, Math.min(halfArena, car.position.x));
        car.position.z = Math.max(-halfArena, Math.min(halfArena, car.position.z));

        // Kamera za autom (Chase Cam)
        const camOffset = new THREE.Vector3(0, 5, 11).applyAxisAngle(new THREE.Vector3(0, 1, 0), car.rotation.y);
        const camTarget = new THREE.Vector3().copy(car.position).add(camOffset);
        camera.position.lerp(camTarget, 0.2);
        camera.lookAt(new THREE.Vector3().copy(car.position).add(new THREE.Vector3(0, 1, 0)));

        // Boost stav
        if(boost.active){ 
            boost.val -= 55 * dt; 
            if(boost.val <= 0) { boost.val = 0; boost.active = false; } 
        } else { 
            boost.val = Math.min(boost.max, boost.val + 25 * dt); 
        }

        updateJump(dt);
        updateAI(dt);
        updateHUD();
        checkGoal();
    }

    renderer.render(scene, camera);
}

// --- Joystick Ovládanie ---
const joy = document.getElementById('joy');
const stick = document.getElementById('stick');
let active = false;
let start = {x: 0, y: 0};
const maxR = 45;

function joyDown(e) { e.preventDefault(); active = true; updateTouch(e); }
function joyMove(e) { if(!active) return; e.preventDefault(); updateTouch(e); }
function joyUp() { active = false; stick.style.transform = 'translate(0,0)'; targetSpeed = 0; steer = 0; joystickX = 0; joystickY = 0; }

function updateTouch(e) {
    const p = e.touches ? e.touches[0] : e;
    const rect = joy.getBoundingClientRect();
    const dx = p.clientX - (rect.left + rect.width / 2);
    const dy = p.clientY - (rect.top + rect.height / 2);
    const dist = Math.min(Math.sqrt(dx*dx + dy*dy), maxR);
    const angle = Math.atan2(dy, dx);
    
    stick.style.transform = `translate(${dist * Math.cos(angle)}px, ${dist * Math.sin(angle)}px)`;
    joystickX = dx / maxR;
    joystickY = dy / maxR;
    targetSpeed = - joystickY * maxSpeed;
    steer = joystickX;
}

joy.addEventListener('pointerdown', joyDown);
window.addEventListener('pointermove', joyMove);
window.addEventListener('pointerup', joyUp);
joy.addEventListener('touchstart', joyDown);
window.addEventListener('touchmove', joyMove);
window.addEventListener('touchend', joyUp);

// --- Tlačidlá Boost & Jump ---
const boostBtn = document.getElementById('boostBtn');
boostBtn.addEventListener('pointerdown', () => { if(boost.val > 10) boost.active = true; });
boostBtn.addEventListener('pointerup', () => { boost.active = false; });
boostBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if(boost.val > 10) boost.active = true; });
boostBtn.addEventListener('touchend', () => { boost.active = false; });

const jumpBtn = document.getElementById('jumpBtn');
jumpBtn.addEventListener('click', () => jumpPlayer());
jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); jumpPlayer(); });

window.addEventListener('keydown', (e) => {
    if(e.code === 'Space') jumpPlayer();
    if(e.code === 'KeyF') { if(boost.val > 10) boost.active = true; }
});
window.addEventListener('keyup', (e) => {
    if(e.code === 'KeyF') boost.active = false;
});

document.getElementById('startBtn').addEventListener('click', () => {
    playing = true;
    resetPositions(false);
    document.getElementById('startBtn').innerText = 'RESET';
});

init();
resetPositions(false);
</script>

</body>
</html>
