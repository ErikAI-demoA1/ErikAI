<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>RocketBall 3D — Skoky & Kamery (ErikAI)</title>
<style>
html,body{height:100%;margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:#061426;color:#fff;overflow:hidden}
#ui{position:fixed;left:12px;bottom:12px;z-index:40;display:flex;gap:10px;align-items:center;pointer-events:none}
.joystick{width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,0.03);backdrop-filter: blur(2px);display:flex;align-items:center;justify-content:center;touch-action:none;pointer-events:auto}
.stick{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;transform:translate(0,0)}
#controlsRight{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:10px;pointer-events:none;z-index:40}
.btn{padding:10px 14px;border-radius:10px;border:none;background:#1db954;color:white;font-weight:600;cursor:pointer;pointer-events:auto}
.btn.ghost{background:rgba(255,255,255,0.06)}
#startBtn{position:fixed;left:50%;top:12px;transform:translateX(-50%);padding:8px 14px;border-radius:10px;border:none;background:#ff7b59;color:#fff;z-index:40}
#jumpBtn{position:fixed;right:12px;bottom:140px;padding:10px 14px;border-radius:10px;border:none;background:#ffcc59;color:#000;font-weight:600;cursor:pointer;pointer-events:auto;z-index:45}
#hud{position:fixed;left:12px;top:12px;background:rgba(0,0,0,0.28);padding:8px 12px;border-radius:8px;font-size:14px;z-index:40}
#mini{position:fixed;right:12px;top:12px;background:rgba(0,0,0,0.16);padding:8px 12px;border-radius:8px;font-size:13px;z-index:40}
canvas{display:block}
.note{position:fixed;left:12px;top:56px;color:#9fb2d1;font-size:13px;z-index:40}
.goal-banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(255,120,60,0.92);padding:22px 28px;border-radius:12px;font-size:36px;font-weight:700;color:#fff;z-index:60;display:none}
@media (min-width:900px){
.joystick{width:110px;height:110px}.stick{width:48px;height:48px}
}
</style>
</head>
<body>
<button id="startBtn">Spusti / Reset</button>
<button id="jumpBtn">SKOK</button>
<div id="hud">Skóre — A: <span id="scoreA">0</span> • B: <span id="scoreB">0</span> • Rýchlosť: <span id="speed">0</span></div>
<div id="mini">Aréna: <span id="arenaSize">200</span>m</div>
<div class="note">RocketBall — teraz s dvojitým skokom, kamerami a stabilnejším ovládaním</div>
<div class="goal-banner" id="goalBanner">GOAL!</div>

<div id="ui">
  <div id="joy" class="joystick" aria-label="Joystick">
    <div id="stick" class="stick"></div>
  </div>
</div>
<div id="controlsRight">
  <button id="boostBtn" class="btn">BOOST</button>
  <button id="cameraBtn" class="btn ghost">Kamera: Auto</button>
</div>

<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
<script>
// --- Základné premenné ---
let scene,camera,renderer;
let car,ball,ground;
let clock,playing=false;
let carSpeed=0,targetSpeed=0,steer=0;
let ballVel=new THREE.Vector3(0,0,0);
let arena=200;
const hudSpeed=document.getElementById('speed');
const scoreAEl=document.getElementById('scoreA');
const scoreBEl=document.getElementById('scoreB');
const goalBanner=document.getElementById('goalBanner');
document.getElementById('arenaSize').innerText=arena;
let score={A:0,B:0};
let goalCooldown=false;

// --- Skok auta ---
let jumpsRemaining=2;
let isGrounded=true;
const jumpPower=7;

// --- Parametre auta ---
let maxSpeed=9.0,accel=28.0,brake=36.0,driftFactor=0.88;
let boost={val:100,max:100,active:false};
const boostMultiplier=2.6,boostDuration=1200,boostDrainRate=80,boostRechargeRate=25;
let cameraFollow=true;

// --- Init ---
function init(){
scene=new THREE.Scene();
scene.background=new THREE.Color(0x061426);

camera=new THREE.PerspectiveCamera(66,window.innerWidth/window.innerHeight,0.1,4000);
camera.position.set(0,9,18);

renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

// svetlá
const hemi=new THREE.HemisphereLight(0xffffff,0x222a3a,0.8); scene.add(hemi);
const dir=new THREE.DirectionalLight(0xffffff,0.6); dir.position.set(8,20,10); scene.add(dir);

// ground
const gmat=new THREE.MeshStandardMaterial({color:0x123442, roughness:0.95});
ground=new THREE.Mesh(new THREE.PlaneGeometry(arena,arena,6,6),gmat); ground.rotation.x=-Math.PI/2; scene.add(ground);

// car
const carMat=new THREE.MeshStandardMaterial({color:0xff6b6b, roughness:0.35, metalness:0.1});
car=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.6,2.6),carMat); car.position.set(0,0.5,0); scene.add(car);

// ball
const ballMat=new THREE.MeshStandardMaterial({color:0xffff7f, roughness:0.5});
ball=new THREE.Mesh(new THREE.SphereGeometry(0.95,32,32),ballMat); ball.position.set(6,0.95,-6); scene.add(ball);

// walls
const wallMat=new THREE.MeshStandardMaterial({color:0x052233});
const w=arena/2;
const wallGeoH=new THREE.BoxGeometry(arena+2,2.2,1);
const wallGeoV=new THREE.BoxGeometry(1,2.2,arena+2);
scene.add(new THREE.Mesh(wallGeoH,wallMat)).position.set(0,1,-w);
scene.add(new THREE.Mesh(wallGeoH,wallMat)).position.set(0,1,w);
scene.add(new THREE.Mesh(wallGeoV,wallMat)).position.set(-w,1,0);
scene.add(new THREE.Mesh(wallGeoV,wallMat)).position.set(w,1,0);

// goals
const goalWidth=arena*0.36;
const goalMat=new THREE.MeshStandardMaterial({color:0xffb86b,emissive:0x220800});
const gLeft=new THREE.Mesh(new THREE.BoxGeometry(goalWidth,1.6,2.5),goalMat); gLeft.position.set(0,0.8,-arena/2+1.5); scene.add(gLeft);
const gRight=new THREE.Mesh(new THREE.BoxGeometry(goalWidth,1.6,2.5),goalMat); gRight.position.set(0,0.8,arena/2-1.5); scene.add(gRight);

clock=new THREE.Clock();
window.addEventListener('resize',onResize);
animate();
}

function onResize(){
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
}

// --- Reset pozícií ---
function resetPositions(afterGoal=false){
car.position.set(0,0.5, afterGoal? (Math.random()>0.5? 6 : -6) : 0);
car.rotation.set(0,0,0);
carSpeed=0; targetSpeed=0; steer=0;
ball.position.set((Math.random()-0.5)*6,0.95,(Math.random()-0.5)*6 - (afterGoal? (Math.random()>0.5?-8:8):0));
ballVel.set(0,0,0);
boost.val=boost.max; boost.active=false;
jumpsRemaining=2; isGrounded=true;
updateHUD();
}

// --- Goal ---
function showGoalBanner(){ goalBanner.style.display=''; setTimeout(()=> goalBanner.style.display='none',1400); }
function checkGoal(){
const halfArena=arena/2-0.7; const gx=Math.abs(ball.position.x);
if(goalCooldown) return;
if(ball.position.z<-halfArena+0.2 && gx<arena*0.36/2 && Math.abs(ballVel.z)>0.2){ score.B++; scoreBEl.innerText=score.B; goalHappened('B'); }
else if(ball.position.z>halfArena-0.2 && gx<arena*0.36/2 && Math.abs(ballVel.z)>0.2){ score.A++; scoreAEl.innerText=score.A; goalHappened('A'); }
}
function goalHappened(team){ goalCooldown=true; showGoalBanner(); playing=false;
setTimeout(()=>{ resetPositions(true); playing=true; goalCooldown=false; },1400); }

// --- Animácia ---
function animate(){
requestAnimationFrame(animate);
const dt=Math.min(0.05,clock.getDelta());

if(playing){
  // pohyb auta
  if(targetSpeed>carSpeed){ carSpeed+=accel*dt; if(carSpeed>targetSpeed) carSpeed=targetSpeed; }
  else if(targetSpeed<carSpeed){ carSpeed-=brake*dt; if(carSpeed<targetSpeed) carSpeed=targetSpeed; }
  const effectiveSpeed=carSpeed*(boost.active? boostMultiplier:1);
  const forward=new THREE.Vector3(Math.sin(car.rotation.y),0,Math.cos(car.rotation.y));
  car.position.addScaledVector(forward,effectiveSpeed*dt);
  const spin=steer*(0.8+(Math.abs(carSpeed)/maxSpeed)*1.8);
  car.rotation.y+=spin*dt;
  carSpeed*=0.999-(0.0004*dt*100);

  // skok auta
  if(car.position.y>0.5){ isGrounded=false; car.position.y-=9.8*dt*0.5; }
  else{ car.position.y=0.5; isGrounded=true; jumpsRemaining=2; }

  // lopta
  ballVel.y-=9.8*dt; ball.position.addScaledVector(ballVel,dt);
  if(ball.position.y<0.95){ ball.position.y=0.95; if(ballVel.y<0) ballVel.y*=-0.42; ballVel.x*=0.993; ballVel.z*=0.993; }

  // kolízia auto-lopta
  const carToBall=new THREE.Vector3().subVectors(ball.position,car.position);
  const dist=carToBall.length(); const rBall=0.95,rCar=1.42,minDist=rBall+rCar;
  if(dist<minDist){
    const n=carToBall.clone().normalize();
    ball.position.addScaledVector(n,(minDist-dist)+0.01);
    const forwardVel=new THREE.Vector3(Math.sin(car.rotation.y),0,Math.cos(car.rotation.y)).multiplyScalar(Math.max(1,carSpeed));
    const impulse=n.clone().multiplyScalar(forwardVel.length()*(boost.active? boostMultiplier:1)+1.2);
    impulse.y=Math.min(2.6,0.9+Math.abs(carSpeed)*0.18); ballVel.add(impulse);
    car.position.addScaledVector(n,-0.02*Math.min(carSpeed,3.2));
  }

  // steny
  const halfArena=arena/2-0.7;
  if(ball.position.x<-halfArena){ ball.position.x=-halfArena; ballVel.x*=-0.72; }
  if(ball.position.x>halfArena){ ball.position.x=halfArena; ballVel.x*=-0.72; }
  if(ball.position.z<-halfArena){ ball.position.z=-halfArena; ballVel.z*=-0.72; }
  if(ball.position.z>halfArena){ ball.position.z=halfArena; ballVel.z*=-0.72; }

  // clamp auta
  if(car.position.x<-halfArena) car.position.x=-halfArena;
  if(car.position.x>halfArena) car.position.x=halfArena;
  if(car.position.z<-halfArena) car.position.z=-halfArena;
  if(car.position.z>halfArena) car.position.z=halfArena;

  // kamera
  if(cameraFollow){
    const camOffset=new THREE.Vector3(0,6.2,13.2).applyAxisAngle(new THREE.Vector3(0,1,0),car.rotation.y);
    const camTarget=new THREE.Vector3().copy(car.position).add(camOffset);
    camera.position.lerp(camTarget,0.14);
    camera.lookAt(new THREE.Vector3().copy(car.position).add(new THREE.Vector3(0,1.2,0)));
  }

  // boost
  if(boost.active){ boost.val-=boostDrainRate*dt; if(boost.val<=0){ boost.val=0; boost.active=false; } }
  else{ boost.val=Math.min(boost.max,boost.val+boostRechargeRate*dt); }

  // HUD
  hudSpeed.innerText=Math.round(Math.abs(carSpeed*10))/10;

  checkGoal();
}

renderer.render(scene,camera);
}

// --- Ovládanie Joystick ---
const joy=document.getElementById('joy'); const stick=document.getElementById('stick');
let active=false,start={x:0,y:0},maxR=48;
stick.style.transform='translate(0px,0px)';
function joyDown(ev){ ev.preventDefault(); active=true; const p=ev.touches? ev.touches[0]:ev; const rect=joy.getBoundingClientRect(); start.x=rect.left+rect.width/2; start.y=rect.top+rect.height/2; moveStick(p.clientX,p.clientY); }
function joyMove(ev){ if(!active) return; ev.preventDefault(); const p=ev.touches? ev.touches[0]:ev; moveStick(p.clientX,p.clientY); }
function joyUp(ev){ active=false; stick.style.transform='translate(0px,0px)'; targetSpeed=0; steer=0; }
function moveStick(cx,cy){ const dx=cx-start.x, dy=cy-start.y; const nx=Math.max(-1,Math.min(1,dx/maxR)); const ny=Math.max(-1,Math.min(1,dy/maxR)); stick.style.transform=`translate(${nx*maxR}px,${ny*maxR}px)`; targetSpeed=Math.max(-maxSpeed*0.5,Math.min(maxSpeed,-ny*maxSpeed)); steer=nx*0.98; }

joy.addEventListener('pointerdown',joyDown,{passive:false});
joy.addEventListener('pointermove',joyMove,{passive:false});
window.addEventListener('pointerup',joyUp);
joy.addEventListener('touchstart',joyDown,{passive:false});
joy.addEventListener('touchmove',joyMove,{passive:false});
window.addEventListener('touchend',joyUp);

// --- Boost ---
document.getElementById('boostBtn').addEventListener('click',()=>{ if(!playing) return; if(boost.val>18&&!boost.active) enableBoost(); });
document.getElementById('boostBtn').addEventListener('touchstart',(e)=>{ e.preventDefault(); if(!playing) return; if(boost.val>18&&!boost.active) enableBoost(); });
function enableBoost(){ if(boost.val<=0) return; boost.active=true; setTimeout(()=>{ boost.active=false; }, boostDuration); }

// --- Kamera toggle ---
document.getElementById('cameraBtn').addEventListener('click',()=>{ cameraFollow=!cameraFollow; document.getElementById('cameraBtn').innerText=cameraFollow?'Kamera: Auto':'Kamera: Loptu'; if(!cameraFollow){ camera.position.set(ball.position.x,12,ball.position.z+18); camera.lookAt(ball.position); } });

// --- Skok auta ---
const jumpBtn=document.getElementById('jumpBtn');
jumpBtn.addEventListener('click',jumpCar);
jumpBtn.addEventListener('touchstart',(e)=>{ e.preventDefault(); jumpCar(); });
function jumpCar(){ if(jumpsRemaining>0){ car.position.y+=jumpPower*0.04; ballVel.y+=0.3; jumpsRemaining--; isGrounded=false; } }

// --- Start / reset ---
document.getElementById('startBtn').addEventListener('click',()=>{ playing=true; resetPositions(false); document.getElementById('startBtn').innerText='Reset'; });

// --- HUD ---
function updateHUD(){ hudSpeed.innerText=Math.round(Math.abs(carSpeed*10))/10; scoreAEl.innerText=score.A; scoreBEl.innerText=score.B; }

init();
resetPositions(false);
animate();
</script>
</body>
</html>
