<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RocketBall — Goals, AI & Jump (ErikAI)</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    background: linear-gradient(160deg, #061426 0%, #0a1a36 100%);
    color: #fff;
    overflow: hidden;
}

/* --- HUD / skóre --- */
#hud {
    position: fixed;
    left: 12px;
    top: 12px;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(10px);
    z-index: 40;
    box-shadow: 0 0 18px rgba(0, 255, 200, 0.45);
    color: #00ffe0;
    font-weight: 600;
    letter-spacing: 0.5px;
}

/* --- Mini info --- */
#mini {
    position: fixed;
    right: 12px;
    top: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    background: rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(6px);
    z-index: 40;
    color: #a0d4ff;
    font-weight: 500;
    box-shadow: 0 0 12px rgba(0, 128, 255, 0.35);
}

/* --- Note / tip --- */
.note {
    position: fixed;
    left: 12px;
    top: 60px;
    color: #9fb2d1;
    font-size: 13px;
    z-index: 40;
    text-shadow: 0 0 4px rgba(0,0,0,0.5);
}

/* --- Goal Banner --- */
.goal-banner {
    position: fixed;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%);
    background: linear-gradient(90deg, #ff7a3c, #ff3f3f);
    padding: 24px 32px;
    border-radius: 14px;
    font-size: 38px;
    font-weight: 800;
    color: #fff;
    z-index: 60;
    display: none;
    text-align: center;
    box-shadow: 0 0 30px rgba(255,120,60,0.8), 0 0 50px rgba(255,255,255,0.3);
    text-transform: uppercase;
}

/* --- Joystick --- */
#ui {
    position: fixed;
    left: 12px;
    bottom: 12px;
    display: flex;
    gap: 12px;
    align-items: center;
    pointer-events: none;
    z-index: 40;
}

.joystick {
    width: 130px; height: 130px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    pointer-events: auto;
    box-shadow: 0 0 12px rgba(0,255,220,0.35), inset 0 0 6px rgba(0,255,220,0.2);
    border: 2px solid rgba(0,255,220,0.3);
}

.stick {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(0,255,220,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translate(0,0);
    box-shadow: 0 0 10px rgba(0,255,220,0.45);
    border: 1px solid rgba(0,255,220,0.5);
}

/* --- Right-side buttons --- */
#controlsRight {
    position: fixed;
    right: 12px;
    bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    pointer-events: none;
    z-index: 40;
}

.btn {
    padding: 12px 18px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(145deg, #1db954, #1ed760);
    color: white;
    font-weight: 600;
    cursor: pointer;
    pointer-events: auto;
    transition: all 0.2s ease;
    box-shadow: 0 0 14px rgba(0,255,180,0.4);
    text-shadow: 0 0 2px rgba(0,0,0,0.4);
}

.btn:hover { 
    background: linear-gradient(145deg, #1ed760, #1db954);
    box-shadow: 0 0 18px rgba(0,255,180,0.6);
}

.btn.ghost { 
    background: rgba(255,255,255,0.08);
    color: #00ffe0;
    box-shadow: 0 0 10px rgba(0,255,220,0.3);
}

/* --- Reset / Start Button --- */
#startBtn {
    position: fixed;
    top: 12px;
    right: 12px;
    padding: 12px 20px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(145deg, #ff4b4b, #ff6b6b);
    color: #fff;
    z-index: 50;
    cursor: pointer;
    font-weight: 700;
    box-shadow: 0 0 16px rgba(255,75,75,0.6), 0 0 12px rgba(255,180,180,0.35);
    transition: all 0.2s ease;
}

#startBtn:hover { 
    background: linear-gradient(145deg, #ff6b6b, #ff4b4b);
    box-shadow: 0 0 22px rgba(255,100,100,0.7), 0 0 16px rgba(255,200,200,0.4);
}

/* --- Canvas --- */
canvas { display: block; }

/* --- Responsive Joystick --- */
@media (min-width: 900px) {
    .joystick { width: 110px; height: 110px; }
    .stick { width: 48px; height: 48px; }
}
    </style>

</head>
<body>

<!-- HUD -->
<button id="startBtn">Spusti / Reset</button>
<div id="hud">goly — Red: <span id="scoreA">0</span> • Blue: <span id="scoreB">0</span> • speed: <span id="speed">0</span></div>
<div id="mini">Aréna: <span id="arenaSize">200</span>m</div>
<div class="note">RocketBall — teraz s bránami, skóre, boost, drift, AI & jump</div>
<div class="goal-banner" id="goalBanner">GOAL!</div>

<!-- UI -->
<div id="ui">
  <div id="joy" class="joystick" aria-label="Joystick">
    <div id="stick" class="stick"></div>
  </div>
</div>

<div id="controlsRight">
  <button id="boostBtn" class="btn">BOOST</button>
  <button id="jumpBtn" class="btn">JUMP</button>
  <button id="cameraBtn" class="btn ghost">Kamera: Follow</button>
</div>

<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
<script>
// --- Scene / Objects ---
let scene, camera, renderer;
let car, ball, ground, aiCar;
let clock, playing=false;
let carSpeed=0, targetSpeed=0, steer=0;
let ballVel = new THREE.Vector3();
let arena = 200;
const hudSpeed = document.getElementById('speed');
const scoreAEl = document.getElementById('scoreA');
const scoreBEl = document.getElementById('scoreB');
const goalBanner = document.getElementById('goalBanner');
document.getElementById('arenaSize').innerText = arena;
let score = {A:0,B:0};
let goalCooldown=false;

// Tuned physics
let maxSpeed=16, accel=37, brake=46, driftFactor=0.83;
let boostMultiplier=2.6, boostDuration=1200, boostDrainRate=80, boostRechargeRate=25;
let boost = {val:100,max:100,active:false};

// Arena / Goals
const goalWidthRatio = 0.36, goalDepth=2.5;
let half;

// --- Jump ---
let isJumping=false, jumpVel=0;
function jumpPlayer(){ if(!playing || isJumping) return; isJumping=true; jumpVel=9; }
function updateJump(dt){
  if(isJumping){
    car.position.y += jumpVel*dt;
    jumpVel -= 15*dt;
    if(car.position.y<=0.5){ car.position.y=0.5; isJumping=false; jumpVel=0; }
  }
}

// --- AI ---
function initAI(){
  aiCar = new THREE.Group(); // skupina pre celé auto

  // --- Karoséria auta ---
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x1e90ff,       // luxusná modrá
    roughness: 0.2,        // hladký lesklý povrch
    metalness: 0.7,        // kovový efekt
    emissive: 0x001a33,
    emissiveIntensity: 0.2
  });
  const bodyGeo = new THREE.BoxGeometry(1.9, 0.6, 2.6);
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.5;
  aiCar.add(body);

  // --- Kolesá ---
  const wheelMat = new THREE.MeshStandardMaterial({color:0x222222, roughness:0.5, metalness:0.3});
  const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.2, 24);
  const wheelPositions = [
    [-0.9, 0.15, 1.1], [0.9, 0.15, 1.1],   // predné
    [-0.9, 0.15, -1.1], [0.9, 0.15, -1.1]  // zadné
  ];
  wheelPositions.forEach(pos=>{
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.rotation.z = Math.PI / 2; // otočenie do správnej osi
    wheel.position.set(...pos);
    aiCar.add(wheel);
  });

  // --- Svetlá ---
  const lightMat = new THREE.MeshStandardMaterial({color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1});
  const headLeft = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.1,0.05), lightMat);
  const headRight = headLeft.clone();
  headLeft.position.set(-0.6, 0.35, 1.3);
  headRight.position.set(0.6, 0.35, 1.3);
  aiCar.add(headLeft, headRight);

  // --- Poloha auta ---
  aiCar.position.set(0, 0, 10);

  // --- Pridanie do scény ---
  scene.add(aiCar);
    }
    
function updateAI(dt){
  if(!playing) return;

  // --- Predikcia lopty ---
  const futureBall = ball.position.clone().add(ballVel.clone().multiplyScalar(0.5)); // predpovedá pohyb lopty

  // --- Vektor od auta k lopte ---
  const dirToBall = new THREE.Vector3().subVectors(futureBall, aiCar.position);
  const dist = dirToBall.length();

  // --- Dynamická rýchlosť ---
  let desiredSpeed = maxSpeed * 0.6 + Math.min(maxSpeed*0.4, dist*2); // základ + prispôsobenie podľa vzdialenosti

  // --- Obranné správanie ---
  const halfArena = arena/2-0.7;
  if(futureBall.z < 0){ // lopta je blízko AI brány
    const defenseOffset = new THREE.Vector3(0,0,halfArena-6);
    dirToBall.add(defenseOffset.sub(aiCar.position).multiplyScalar(0.6));
    desiredSpeed = maxSpeed*0.9; // rýchlejší návrat na obranu
  }

  // --- Otáčanie auta smerom k lopte ---
  const targetAngle = Math.atan2(dirToBall.x, dirToBall.z);
  let angleDiff = targetAngle - aiCar.rotation.y;
  angleDiff = ((angleDiff + Math.PI) % (2*Math.PI)) - Math.PI;
  const turnSpeed = Math.min(3, Math.max(1.5, dist*0.5)); // adaptívna rýchlosť otáčania
  aiCar.rotation.y += angleDiff * turnSpeed * dt;

  // --- Pohyb dopredu ---
  const forward = new THREE.Vector3(Math.sin(aiCar.rotation.y),0,Math.cos(aiCar.rotation.y));
  aiCar.position.addScaledVector(forward, desiredSpeed*dt);

  // --- Kolízia s loptou ---
  const rCar=1.42, rBall=0.95, minDist=rCar+rBall;
  const carToBall = new THREE.Vector3().subVectors(ball.position, aiCar.position);
  if(carToBall.length() < minDist){
    const n = carToBall.clone().normalize();
    ball.position.addScaledVector(n, (minDist-carToBall.length())+0.01);
    const impulse = n.clone().multiplyScalar(Math.max(1, desiredSpeed)+1.5);
    impulse.y = Math.min(3, 0.9 + Math.abs(desiredSpeed)*0.25); // vyšší odraz lopty
    ballVel.add(impulse);
    aiCar.position.addScaledVector(n, -0.03*Math.min(desiredSpeed,4));
  }

  // --- Ochrana pred opustením arény ---
  aiCar.position.x = Math.max(-halfArena, Math.min(halfArena, aiCar.position.x));
  aiCar.position.z = Math.max(-halfArena, Math.min(halfArena, aiCar.position.z));
    }

// --- Init Scene ---
function init(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x061426);
  camera = new THREE.PerspectiveCamera(66, window.innerWidth/window.innerHeight,0.1,4000);
  camera.position.set(0,9,18);
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  document.body.appendChild(renderer.domElement);

  const hemi = new THREE.HemisphereLight(0xffffff,0x222a3a,0.8); scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff,0.6); dir.position.set(8,20,10); scene.add(dir);

  const gmat = new THREE.MeshStandardMaterial({color:0x123442, roughness:0.95});
  ground = new THREE.Mesh(new THREE.PlaneGeometry(arena,arena,6,6), gmat);
  ground.rotation.x=-Math.PI/2; scene.add(ground);

  const carMat = new THREE.MeshStandardMaterial({color:0xff6b6b, roughness:0.35, metalness:0.1});
  car = new THREE.Mesh(new THREE.BoxGeometry(1.9,0.6,2.6), carMat);
  car.position.set(0,0.5,0); scene.add(car);

  const ballMat = new THREE.MeshStandardMaterial({color:0xffff7f, roughness:0.5});
  ball = new THREE.Mesh(new THREE.SphereGeometry(0.95,32,32), ballMat);
  ball.position.set(6,0.95,-6); scene.add(ball);
  // Arena walls
  const wallMat = new THREE.MeshStandardMaterial({color:0xADFF2F});
  const w = arena/2;
  const wallGeoH = new THREE.BoxGeometry(arena+2,2.2,1);
  const wallGeoV = new THREE.BoxGeometry(1,2.2,arena+2);
  scene.add(new THREE.Mesh(wallGeoH, wallMat).position.set(0,1,-w));
  scene.add(new THREE.Mesh(wallGeoH, wallMat).position.set(0,1,w));
  scene.add(new THREE.Mesh(wallGeoV, wallMat).position.set(-w,1,0));
  scene.add(new THREE.Mesh(wallGeoV, wallMat).position.set(w,1,0));

  // Goals with colors
  half = arena/2;
  const goalWidth = arena*goalWidthRatio;
  // Left red goal
  const goalLeftMat = new THREE.MeshStandardMaterial({color:0xff4b4b, emissive:0x220000});
  const gLeft = new THREE.Mesh(new THREE.BoxGeometry(goalWidth,30,goalDepth), goalLeftMat);
  gLeft.position.set(0,15,-half+goalDepth/2+0.2); scene.add(gLeft);
  // Right blue goal
  const goalRightMat = new THREE.MeshStandardMaterial({color:0x4b9eff, emissive:0x002255});
  const gRight = new THREE.Mesh(new THREE.BoxGeometry(goalWidth,30,goalDepth), goalRightMat);
  gRight.position.set(0,15,half-goalDepth/2-0.2); scene.add(gRight);

  initAI();

  clock = new THREE.Clock();
  window.addEventListener('resize', onResize);
  animate();
}

// Resize
function onResize(){ camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); }

// Reset positions
function resetPositions(afterGoal=false){
  car.position.set(0,0.5, afterGoal? (Math.random()>0.5?6:-6):0);
  car.rotation.set(0,0,0); carSpeed=0; targetSpeed=0; steer=0;
  ball.position.set((Math.random()-0.5)*6,0.95,(Math.random()-0.5)*6 - (afterGoal? (Math.random()>0.5?-8:8):0));
  ballVel.set(0,0,0);
  boost.val=boost.max; boost.active=false;
  aiCar.position.set(0,0.5, afterGoal? -6 : 10);
  updateHUD();
}

// HUD
function updateHUD(){
  hudSpeed.innerText = Math.round(Math.abs(carSpeed*10))/10;
  scoreAEl.innerText = score.A; scoreBEl.innerText = score.B;
}

// Goal banner
function showGoalBanner(){ goalBanner.style.display=''; setTimeout(()=>goalBanner.style.display='none',1400); }

// Goal detection
function checkGoal(){
  if(goalCooldown) return;
  const halfArena = arena/2-0.7;
  const goalWidth = arena*goalWidthRatio;
  const gx = Math.abs(ball.position.x);
  if(ball.position.z<-halfArena+0.2 && gx<goalWidth/2){ score.B++; scoreBEl.innerText=score.B; goalHappened('B'); }
  else if(ball.position.z>halfArena-0.2 && gx<goalWidth/2){ score.A++; scoreAEl.innerText=score.A; goalHappened('A'); }
}
function goalHappened(team){
  goalCooldown=true;
  showGoalBanner();
  playing=false;
  setTimeout(()=>{
    resetPositions(true);
    playing=true;
    goalCooldown=false;
  },1400);
}

// --- Animate ---
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());

  if(playing){
    if(targetSpeed>carSpeed){ carSpeed+=accel*dt; if(carSpeed>targetSpeed) carSpeed=targetSpeed; }
    else if(targetSpeed<carSpeed){ carSpeed-=brake*dt; if(carSpeed<targetSpeed) carSpeed=targetSpeed; }

    const effectiveSpeed = carSpeed * (boost.active? boostMultiplier:1.0);
    const forward = new THREE.Vector3(Math.sin(car.rotation.y),0,Math.cos(car.rotation.y));
    car.position.addScaledVector(forward, effectiveSpeed*dt);
    car.rotation.y += steer*(0.8 + (Math.abs(carSpeed)/maxSpeed)*1.8)*dt;
    carSpeed *= 0.999 - (0.0004*dt*100);

    // Ball physics
    ballVel.y -= 9.8*dt; ball.position.addScaledVector(ballVel,dt);
    if(ball.position.y<0.95){ ball.position.y=0.95; if(ballVel.y<0) ballVel.y*=-0.42; ballVel.x*=0.993; ballVel.z*=0.993; }

    // Car-ball collision
    const carToBall = new THREE.Vector3().subVectors(ball.position,car.position);
    const dist = carToBall.length(); const rBall=0.95,rCar=1.42,minDist=rBall+rCar;
    if(dist<minDist){
      const n = carToBall.clone().normalize();
      ball.position.addScaledVector(n,(minDist-dist)+0.01);
      const impulse = n.clone().multiplyScalar(Math.max(1,carSpeed)*(boost.active? boostMultiplier:1.0)+1.2);
      impulse.y = Math.min(2.6,0.9+Math.abs(carSpeed)*0.18); ballVel.add(impulse);
      car.position.addScaledVector(n,-0.02*Math.min(carSpeed,3.2));
    }

    const halfArena = arena/2-0.7;
    if(ball.position.x<-halfArena){ ball.position.x=-halfArena; ballVel.x*=-0.72; }
    if(ball.position.x>halfArena){ ball.position.x=halfArena; ballVel.x*=-0.72; }
    if(ball.position.z<-halfArena){ ball.position.z=-halfArena; ballVel.z*=-0.72; }
    if(ball.position.z>halfArena){ ball.position.z=halfArena; ballVel.z*=-0.72; }

    car.position.x = Math.max(-halfArena, Math.min(halfArena, car.position.x));
    car.position.z = Math.max(-halfArena, Math.min(halfArena, car.position.z));

    if(cameraFollow){
      const camOffset = new THREE.Vector3(0,6.2,13.2).applyAxisAngle(new THREE.Vector3(0,1,0),car.rotation.y);
      const camTarget = new THREE.Vector3().copy(car.position).add(camOffset);
      camera.position.lerp(camTarget,0.14);
      camera.lookAt(new THREE.Vector3().copy(car.position).add(new THREE.Vector3(0,1.2,0)));
    }

    // Boost management
    if(boost.active){ boost.val-=boostDrainRate*dt; if(boost.val<=0){ boost.val=0; boost.active=false; } }
    else{ boost.val = Math.min(boost.max, boost.val+boostRechargeRate*dt); }

    updateJump(dt);   // jump update
    updateAI(dt);     // AI update
    updateHUD();
    checkGoal();
  }

  renderer.render(scene,camera);
}

// --- Joystick Input ---
const joy = document.getElementById('joy');
const stick = document.getElementById('stick');
let active = false;
let start = {x: 0, y: 0};
const maxR = 48; // polomer joysticku

function joyDown(ev) {
    ev.preventDefault();
    active = true;
    const p = ev.touches ? ev.touches[0] : ev;
    const rect = joy.getBoundingClientRect();
    start.x = rect.left + rect.width / 2;
    start.y = rect.top + rect.height / 2;
    moveStick(p.clientX, p.clientY);
}

function joyMove(ev) {
    if (!active) return;
    ev.preventDefault();
    const p = ev.touches ? ev.touches[0] : ev;
    moveStick(p.clientX, p.clientY);
}

function joyUp(ev) {
    active = false;
    stick.style.transform = 'translate(0,0)';
    targetSpeed = 0;
    steer = 0;
}

function moveStick(cx, cy) {
    const dx = cx - start.x;
    const dy = cy - start.y;

    // obmedz stick v kruhu
    const distance = Math.min(Math.sqrt(dx*dx + dy*dy), maxR);
    const angle = Math.atan2(dy, dx);
    const xPos = distance * Math.cos(angle);
    const yPos = distance * Math.sin(angle);

    stick.style.transform = `translate(${xPos}px, ${yPos}px)`;

    // mapovanie na auto: Y = dopredu/dozadu, X = doľava/doprava
    targetSpeed = - (yPos / maxR) * maxSpeed;  // dopredu = +Y na auto
    steer = xPos / maxR;                        // doľava = -1, doprava = +1
}

// eventy
joy.addEventListener('pointerdown', joyDown, {passive:false});
joy.addEventListener('pointermove', joyMove, {passive:false});
window.addEventListener('pointerup', joyUp);

joy.addEventListener('touchstart', joyDown, {passive:false});
joy.addEventListener('touchmove', joyMove, {passive:false});
window.addEventListener('touchend', joyUp);
// --- Boost Button ---
const boostBtn = document.getElementById('boostBtn');
boostBtn.addEventListener('click',()=>{ if(!playing) return; if(boost.val>18&&!boost.active) enableBoost(); });
boostBtn.addEventListener('touchstart',(e)=>{ e.preventDefault(); if(!playing) return; if(boost.val>18&&!boost.active) enableBoost(); });
function enableBoost(){ if(boost.val<=0) return; boost.active=true; setTimeout(()=>{boost.active=false;}, boostDuration); }

// --- Jump Button ---
const jumpBtn = document.getElementById('jumpBtn');
jumpBtn.addEventListener('click',()=>{ jumpPlayer(); });
jumpBtn.addEventListener('touchstart',(e)=>{ e.preventDefault(); jumpPlayer(); });

// --- Camera Toggle ---
let cameraFollow=true;
document.getElementById('cameraBtn').addEventListener('click',()=>{ 
    cameraFollow=!cameraFollow; 
    document.getElementById('cameraBtn').innerText=cameraFollow?'Kamera: Follow':'Kamera: Free'; 
});

// --- Jump Key ---
window.addEventListener('keydown', (e)=>{ if(e.code==='Space'){ jumpPlayer(); } });

// --- Start / Reset ---
document.getElementById('startBtn').addEventListener('click', () => {
    playing = true;
    resetPositions(false);
    document.getElementById('startBtn').innerText = 'Reset';
});



// --- Initialize ---
init();
resetPositions(false);
animate();
</script>
</body>
  </html>
