<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErikAI - APK / Project Builder</title>
    <!-- Knižnica JSZip na zabalenie projektových súborov priamo v prehliadači -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: monospace;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #161b22;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        h2 { color: #58a6ff; }
        textarea {
            width: 100%;
            height: 150px;
            background: #0d1117;
            color: #7ee787;
            border: 1px solid #30363d;
            padding: 10px;
            font-family: monospace;
            border-radius: 4px;
            resize: vertical;
        }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        button:hover { background: #2ea043; }
        .log {
            margin-top: 15px;
            background: #040d21;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #1f6feb;
            font-size: 13px;
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ErikAI Builder</h2>
    <p>Tento nástroj vezme tvoje HTML/JS a zabalí ho do kompletnej štruktúry pre Android projekt (WebView Wrapper + Gradle základy) priamo v prehliadači!</p>
    
    <label>Názov aplikácie:</label><br>
    <input type="text" id="appName" value="ErikAI App" style="width:100%; padding:8px; margin: 5px 0 15px 0; background:#0d1117; color:#fff; border:1px solid #30363d; border-radius:4px;"><br>

    <label>Tvoj HTML kód (Hra / CAD / Aplikácia):</label><br>
    <textarea id="htmlInput">&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;&lt;title&gt;Moja Hra&lt;/title&gt;&lt;/head&gt;
&lt;body style="background:black; color:white; text-align:center; padding-top:50px;"&gt;
    &lt;h1&gt;Ahoj z ErikAI APK!&lt;/h1&gt;
    &lt;p&gt;Toto beží v natívnom WebView.&lt;/p&gt;
&lt;/body&gt;
&lt;/html&gt;</textarea>

    <button onclick="buildAndroidProject()">Zostaviť a stiahnuť projekt (ZIP)</button>

    <div class="log" id="logBox">Pripravené na zostavenie...</div>
</div>

<script>
    function log(text) {
        const box = document.getElementById('logBox');
        box.innerHTML += "<br>" + text;
        box.scrollTop = box.scrollHeight;
    }

    async function buildAndroidProject() {
        const appName = document.getElementById('appName').value || "ErikAIApp";
        const userHtml = document.getElementById('htmlInput').value;
        
        log("Spúšťam prípravu Android štruktúry...");
        
        const zip = new JSZip();
        
        // 1. Vytvorenie základnej štruktúry priečinkov pre Android projekt
        const root = zip.folder(appName);
        const app = root.folder("app");
        const srcMain = app.folder("src").folder("main");
        const assets = srcMain.folder("assets");
        const javaDir = srcMain.folder("java").folder("com").folder("erikai").folder("app");
        const resValues = srcMain.folder("res").folder("values");

        // 2. Vloženie používateľského HTML do assets (presne tam, kde ho WebView hľadá)
        assets.file("index.html", userHtml);
        log("✔ Vložený index.html do /app/src/main/assets/");

        // 3. Vytvorenie AndroidManifest.xml
        const manifestContent = `<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="com.erikai.app">
    <uses-permission android:name="android.permission.INTERNET" />
    <application
        android:allowBackup="true"
        android:label="${appName}"
        android:theme="@style/Theme.AppCompat.NoActionBar">
        <activity
            android:name=".MainActivity"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>`;
        srcMain.file("AndroidManifest.xml", manifestContent);
        log("✔ Vytvorený AndroidManifest.xml");

        // 4. Vytvorenie Java kódu (MainActivity.java)
        const javaContent = `package com.erikai.app;
import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        WebView webView = new WebView(this);
        setContentView(webView);
        WebSettings settings = webView.getSettings();
        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        webView.setWebViewClient(new WebViewClient());
        webView.loadUrl("file:///android_asset/index.html");
    }
}`;
        javaDir.file("MainActivity.java", javaContent);
        log("✔ Vygenerovaný MainActivity.java kód");

        // 5. Vytvorenie Gradle build skriptov (build.gradle)
        const buildGradle = `plugins { id 'com.android.application' }
android {
    compileSdk 33
    defaultConfig {
        applicationId "com.erikai.app"
        minSdk 21
        targetSdk 33
    }
}
dependencies {
    implementation 'androidx.appcompat:appCompat:1.6.1'
}`;
        app.file("build.gradle", buildGradle);

        const rootGradle = `buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
}
allprojects {
    repositories { google(); mavenCentral() }
}`;
        root.file("build.gradle", rootGradle);
        log("✔ Pridané Gradle build predpisy");

        // 6. Vygenerovanie a stiahnutie ZIP súboru
        log("Balím kompletný projekt do archívu...");
        const content = await zip.generateAsync({ type: "blob" });
        
        const link = document.createElement("a");
        link.href = URL.createObjectURL(content);
        link.download = appName + "_AndroidProject.zip";
        link.click();
        
        log("Hotovo! Projekt je pripravený. Stačí ho otvoriť v Android Studio / Mobile IDE a spustiť Gradle build.");
    }
</script>

</body>
</html>
