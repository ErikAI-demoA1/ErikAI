<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ErikAI Vision 2.0</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#101114;
  color:#fff;
  font-family:Arial,sans-serif
}
.app{
  max-width:720px;
  margin:auto;
  padding:15px
}
h1{margin:4px 0}
.sub{color:#999;margin-bottom:14px}
.preview{
  position:relative;
  width:100%;
  aspect-ratio:4/3;
  border-radius:18px;
  overflow:hidden;
  background:#1b1d22;
  display:flex;
  align-items:center;
  justify-content:center
}
#image,#video{
  width:100%;
  height:100%;
  object-fit:contain;
  display:none
}
#canvas{
  display:none
}
#placeholder{color:#777}
.controls{
  display:flex;
  gap:7px;
  margin:10px 0
}
button,.upload{
  flex:1;
  border:0;
  border-radius:11px;
  padding:13px 7px;
  background:#252830;
  color:white;
  font-size:14px;
  text-align:center
}
.primary{background:#356df3}
button:disabled{opacity:.45}
.status{
  color:#aaa;
  min-height:22px;
  margin:11px 0
}
.result{
  display:none;
  background:#1b1d22;
  border-radius:16px;
  padding:14px
}
.result h2{margin:0 0 10px}
.box{
  padding:11px 0;
  border-bottom:1px solid #303238
}
.box:last-child{border:0}
.score{
  float:right;
  color:#72a0ff
}
.search{
  display:flex;
  gap:7px;
  margin-top:9px
}
.search a{
  flex:1;
  padding:9px;
  background:#292c34;
  color:#fff;
  border-radius:9px;
  text-align:center;
  text-decoration:none
}
.small{
  color:#666;
  font-size:12px;
  margin-top:12px
}
</style>
</head>

<body>

<div class="app">

<h1>👁️ ErikAI Vision 2.0</h1>
<div class="sub">OWL-ViT + CLIP • AI Vision</div>

<div class="preview">

  <img id="image">

  <video id="video"
         autoplay
         playsinline></video>

  <canvas id="canvas"></canvas>

  <span id="placeholder">
    📷 Vyber alebo odfoť obrázok
  </span>

</div>

<div class="controls">

<label class="upload">
🖼️ Fotka
<input id="file"
       type="file"
       accept="image/*"
       hidden>
</label>

<button id="camera">
📷 Kamera
</button>

<button id="snap"
        class="primary"
        hidden>
📸 Odfotiť
</button>

</div>

<button id="analyze"
        class="primary"
        disabled>
🤖 Analyzovať
</button>

<div id="status"
     class="status">
⏳ Pripravujem AI...
</div>

<div id="result"
     class="result">
</div>

<div class="small">
ErikAI Vision • AI výsledky sú odhady
</div>

</div>


<script type="module">

import {
  pipeline,
  env
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1/+esm";


/* =========================
   NASTAVENIE
========================= */

env.useBrowserCache = true;
env.allowLocalModels = false;


/* =========================
   ELEMENTY
========================= */

const img =
  document.getElementById("image");

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const file =
  document.getElementById("file");

const camera =
  document.getElementById("camera");

const snap =
  document.getElementById("snap");

const analyze =
  document.getElementById("analyze");

const status =
  document.getElementById("status");

const result =
  document.getElementById("result");

const placeholder =
  document.getElementById("placeholder");


/* =========================
   AI
========================= */

let detector = null;
let classifier = null;
let stream = null;
let currentImage = null;


/* =========================
   KATEGÓRIE
========================= */

const objects = [

  "person",
  "face",

  "car",
  "motorcycle",
  "bicycle",
  "truck",
  "bus",

  "phone",
  "smartphone",
  "laptop",
  "computer",
  "television",
  "camera",

  "watch",
  "shoe",
  "backpack",
  "bag",

  "chair",
  "table",
  "sofa",
  "bed",

  "dog",
  "cat",
  "bird",
  "horse",

  "bottle",
  "cup",
  "book",

  "food",
  "fruit",
  "flower",

  "house",
  "building",

  "tool",
  "toy",
  "clothing"

];


/* =========================
   NAČÍTANIE DETEKTORA
========================= */

async function loadDetector(){

  status.textContent =
    "🔍 Načítavam objektový AI model...";

  try{

    detector =
      await pipeline(
        "zero-shot-object-detection",
        "Xenova/owlvit-base-patch32",
        {
          device:
            navigator.gpu
              ? "webgpu"
              : "wasm"
        }
      );

    status.textContent =
      "✅ Detektor pripravený";

  }catch(e){

    console.error(e);

    status.textContent =
      "❌ Detektor sa nepodarilo načítať.";

  }

}


/* =========================
   OBRÁZOK
========================= */

function showImage(src){

  img.src = src;

  img.onload = ()=>{

    img.style.display = "block";
    video.style.display = "none";
    placeholder.style.display = "none";

    currentImage = img;

    analyze.disabled = false;

    result.style.display = "none";

  };

}


/* =========================
   UPLOAD
========================= */

file.onchange = e=>{

  const f =
    e.target.files[0];

  if(!f)return;

  showImage(
    URL.createObjectURL(f)
  );

  if(stream){

    stream
      .getTracks()
      .forEach(t=>t.stop());

    stream = null;

  }

  camera.textContent =
    "📷 Kamera";

  snap.hidden = true;

};


/* =========================
   KAMERA
========================= */

camera.onclick = async()=>{

  if(stream){

    stream
      .getTracks()
      .forEach(t=>t.stop());

    stream = null;

    video.style.display = "none";
    img.style.display = "block";

    snap.hidden = true;

    camera.textContent =
      "📷 Kamera";

    return;

  }

  try{

    stream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          }
        },

        audio:false

      });

    video.srcObject =
      stream;

    img.style.display = "none";
    video.style.display = "block";

    placeholder.style.display =
      "none";

    snap.hidden = false;

    camera.textContent =
      "✖ Zavrieť";

  }catch(e){

    status.textContent =
      "❌ Kamera nie je dostupná.";

  }

};


/* =========================
   SNAP
========================= */

snap.onclick = ()=>{

  if(!stream)return;

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  showImage(
    canvas.toDataURL(
      "image/jpeg",
      .9
    )
  );

  stream
    .getTracks()
    .forEach(t=>t.stop());

  stream = null;

  snap.hidden = true;

  camera.textContent =
    "📷 Kamera";

};


/* =========================
   CANVAS
========================= */

async function prepareImage(){

  const c =
    document.createElement("canvas");

  const max = 1024;

  let w =
    currentImage.naturalWidth;

  let h =
    currentImage.naturalHeight;

  if(!w || !h)
    throw new Error(
      "Obrázok nemá platné rozmery."
    );

  const scale =
    Math.min(
      1,
      max / Math.max(w,h)
    );

  w = Math.round(w*scale);
  h = Math.round(h*scale);

  c.width = w;
  c.height = h;

  c.getContext("2d")
   .drawImage(
     currentImage,
     0,
     0,
     w,
     h
   );

  return c;

}


/* =========================
   NAČÍTANIE CLIP
========================= */

async function loadClassifier(){

  if(classifier)
    return;

  status.textContent =
    "🧠 Načítavam druhú AI...";

  classifier =
    await pipeline(
      "zero-shot-image-classification",
      "Xenova/clip-vit-base-patch32",
      {
        device:
          navigator.gpu
            ? "webgpu"
            : "wasm"
      }
    );

}


/* =========================
   HLAVNÁ ANALÝZA
========================= */

analyze.onclick = async()=>{

  if(!currentImage){

    status.textContent =
      "📷 Najprv vyber obrázok.";

    return;

  }

  if(!detector){

    status.textContent =
      "⏳ Detektor ešte nie je pripravený.";

    return;

  }

  analyze.disabled = true;

  result.style.display = "none";

  try{

    /* ---------------------
       1. Obrázok
    --------------------- */

    status.textContent =
      "🖼️ Pripravujem obrázok...";

    const source =
      await prepareImage();


    /* ---------------------
       2. DETEKCIA
    --------------------- */

    status.textContent =
      "🔍 Hľadám objekty...";

    const detections =
      await detector(
        source,
        objects
      );


    console.log(
      "OWL-ViT:",
      detections
    );


    /* ---------------------
       3. FILTROVANIE
    --------------------- */

    const found =
      detections
      .filter(x =>
        x.score >= 0.08
      )
      .sort(
        (a,b)=>
          b.score-a.score
      )
      .slice(0,5);


    if(!found.length){

      result.innerHTML =
        "<h2>🤷 Nič isté som nenašiel.</h2>";

      result.style.display =
        "block";

      status.textContent =
        "⚠️ Skús inú fotku.";

      analyze.disabled = false;

      return;

    }


    /* ---------------------
       4. CLIP
    --------------------- */

    await loadClassifier();


    status.textContent =
      "🧠 Spresňujem výsledok...";


    /*
      Použijeme iba najlepšie
      nájdené kategórie.
    */

    const labels =
      found.map(x=>x.label);


    const refined =
      await classifier(
        source,
        labels
      );


    console.log(
      "CLIP:",
      refined
    );


    /* ---------------------
       5. VÝSLEDOK
    --------------------- */

    showResults(
      found,
      refined
    );


    status.textContent =
      "✅ Hotovo!";


  }catch(e){

    console.error(
      "VISION ERROR:",
      e
    );

    status.textContent =
      "❌ Chyba: " +
      (e.message || e);

  }

  analyze.disabled = false;

};


/* =========================
   VÝSLEDKY
========================= */

function showResults(
  detections,
  refined
){

  result.innerHTML =
    "<h2>🔎 ErikAI našla</h2>";


  refined
    .slice(0,5)
    .forEach((x,i)=>{

      const original =
        detections.find(
          d=>d.label===x.label
        );

      const score =
        Math.max(
          x.score,
          original?.score || 0
        );

      const percent =
        (score*100)
        .toFixed(1);


      const name =
        x.label
          .replace(/^a /,"")
          .replace(/^an /,"");


      const div =
        document.createElement("div");

      div.className =
        "box";


      div.innerHTML = `

        <b>
          ${i+1}. ${name}
        </b>

        <span class="score">
          ${percent}%
        </span>

        <div class="search">

          <a
            target="_blank"
            href="https://www.google.com/search?q=${encodeURIComponent(name)}"
          >
            🔎 Hľadať
          </a>

          <a
            target="_blank"
            href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(name)}"
          >
            🖼️ Obrázky
          </a>

        </div>

      `;

      result.appendChild(div);

    });


  result.style.display =
    "block";

}


/* =========================
   ŠTART
========================= */

loadDetector();

</script>

</body>
</html>
