<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErikAI - Živý Generátor Odpovedí</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: monospace;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }
        h2 { color: #58a6ff; }
        input, textarea {
            width: 100%;
            background: #161b22;
            color: #7ee787;
            border: 1px solid #30363d;
            padding: 10px;
            font-family: monospace;
            border-radius: 4px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        textarea { height: 100px; resize: vertical; }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        button:hover { background: #2ea043; }
        .btn-blue { background: #1f6feb; }
        .btn-blue:hover { background: #388bfd; }
        .btn-red { background: #da3633; }
        .btn-red:hover { background: #f85149; }
        
        .preview-box {
            background: #040d21;
            padding: 15px;
            border: 1px solid #1f6feb;
            border-radius: 4px;
            margin-top: 15px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
            color: #7ee787;
            font-size: 14px;
        }
        .flex-row {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <h2>ErikAI Živý Zapisovač Odpovedí</h2>
    <p>Pridávaj kľúče a texty. V dolnom okne hneď vidíš živý náhľad čistého kódu bez slova <code>const</code>, pripravený na kopírovanie!</p>
    
    <label>Kľúč (napr. pes, auto, dom):</label><br>
    <input type="text" id="inputKey" placeholder="Zadaj kľúčové slovo...">

    <label>Definícia / Text z webu:</label><br>
    <inputTextarea id="inputText" placeholder="Sem skopíruj text..."></inputTextarea>
    
    <button onclick="addEntry()">➕ Pridať do zoznamu</button>
    <button class="btn-blue" onclick="copyCode()">📋 Skopírovať čistý kód</button>
    <button class="btn-blue" onclick="downloadCode()">💾 Stiahnuť ako TXT</button>
    <button class="btn-red" onclick="clearAll()">🗑️ Vymazať všetko</button>

    <h3>Živý náhľad výstupného kódu:</h3>
    <div class="preview-box" id="livePreview">// Tu sa bude postupne vytvárať tvoj kód...</div>

    <script>
        // Pole pre ukladanie položiek
        let entries = [];

        function addEntry() {
            let key = document.getElementById('inputKey').value.toLowerCase().trim();
            let text = document.getElementById('inputText').value;

            if (!key || !text) {
                alert("Musíš vyplniť kľúč aj text!");
                return;
            }

            // Očistenie textu od nebezpečných úvodzoviek a zalomení riadkov
            let cleanText = text
                .replace(/[\t\r\n]+/g, " ")
                .replace(/\s+/g, " ")
                .replace(/"/g, '\\"')
                .trim();

            // Uložíme objekt
            entries.push({ key: key, text: cleanText });

            // Aktualizácia živého náhľadu
            updatePreview();

            // Vyčistenie vstupných polí pre rýchle pokračovanie
            document.getElementById('inputKey').value = "";
            document.getElementById('inputText').value = "";
            document.getElementById('inputKey').focus();
        }

        function getFormattedCode() {
            if (entries.length === 0) return "// Zatiaľ žiadne záznamy...";
            
            // Vygeneruje presne tie riadky, ktoré chceš (bez slova const odpovede = { ... })
            return entries.map(item => `    "${item.key}": "${item.text}",`).join("\n");
        }

        function updatePreview() {
            document.getElementById('livePreview').textContent = getFormattedCode();
        }

        function copyCode() {
            let code = getFormattedCode();
            if (entries.length === 0) {
                alert("Nie je tu žiaden kód na kopírovanie!");
                return;
            }
            navigator.clipboard.writeText(code).then(() => {
                alert("Čistý kód úspešne skopírovaný do schránky!");
            });
        }

        function downloadCode() {
            let code = getFormattedCode();
            if (entries.length === 0) {
                alert("Nie je tu žiaden kód na stiahnutie!");
                return;
            }
            const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "erikai_odpovede_cast.txt";
            link.click();
        }

        function clearAll() {
            if (confirm("Naozaj chceš vymazať všetky doteraz pridané záznamy?")) {
                entries = [];
                updatePreview();
            }
        }
    </script>

</body>
</html>
