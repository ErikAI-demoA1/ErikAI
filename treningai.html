<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErikAI - Rýchly Zapisovač</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: monospace;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }
        h2 { color: #58a6ff; }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        input, textarea {
            width: 100%;
            background: #161b22;
            color: #7ee787;
            border: 1px solid #30363d;
            padding: 10px;
            font-family: monospace;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input { height: 40px; flex: 1; }
        textarea { height: 100px; resize: vertical; margin-bottom: 10px; }
        
        .actions {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: #2ea043; }
        .btn-blue { background: #1f6feb; }
        .btn-blue:hover { background: #388bfd; }
        .btn-red { background: #da3633; }
        .btn-red:hover { background: #f85149; }
        
        .preview-box {
            background: #040d21;
            padding: 15px;
            border: 1px solid #1f6feb;
            border-radius: 4px;
            margin-top: 10px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 350px;
            overflow-y: auto;
            color: #7ee787;
            font-size: 14px;
        }
        label { font-size: 13px; color: #8b949e; }
    </style>
</head>
<body>

    <h2>ErikAI Rýchly Zapisovač</h2>
    <p>Zadaj kľúč a hodnotu. Kód sa formátuje a ukladá automaticky!</p>
    
    <label>Kľúč (napr. pes):</label>
    <input type="text" id="inputKey" placeholder="Sem napíš kľúčové slovo..." oninput="autoSave()">

    <label style="margin-top: 10px; display: block;">Hodnota / Text z webu:</label>
    <textarea id="inputText" placeholder="Sem vlož definíciu alebo text..." oninput="autoSave()"></textarea>
    
    <div class="actions">
        <button onclick="addEntry()">➕ Pridať do zoznamu</button>
        <button class="btn-blue" onclick="copyCode()">📋 Skopírovať čistý kód</button>
        <button class="btn-blue" onclick="downloadCode()">💾 Stiahnuť TXT</button>
        <button class="btn-red" onclick="clearAll()">🗑️ Vymazať všetko</button>
    </div>

    <label>Živý náhľad čistého kódu (pripravený na vloženie):</label>
    <div class="preview-box" id="livePreview">// Tu sa objaví vygenerovaný kód...</div>

    <script>
        let entries = [];

        function addEntry() {
            let keyInput = document.getElementById('inputKey');
            let textInput = document.getElementById('inputText');
            
            let key = keyInput.value.toLowerCase().trim();
            let text = textInput.value;

            if (!key || !text) {
                alert("Musíš vyplniť kľúč aj hodnotu!");
                return;
            }

            // Čistenie textu, aby nerozbil úvodzovky v JS
            let cleanText = text
                .replace(/[\t\r\n]+/g, " ")
                .replace(/\s+/g, " ")
                .replace(/"/g, '\\"')
                .trim();

            entries.push({ key: key, text: cleanText });

            // Aktualizácia náhľadu
            updatePreview();

            // Vyčistenie polí pre okamžité písanie ďalšej položky
            keyInput.value = "";
            textInput.value = "";
            keyInput.focus();
        }

        function getFormattedCode() {
            if (entries.length === 0) return "// Zatiaľ žiadne záznamy...";
            return entries.map(item => `    "${item.key}": "${item.text}",`).join("\n");
        }

        function updatePreview() {
            document.getElementById('livePreview').textContent = getFormattedCode();
        }

        function copyCode() {
            let code = getFormattedCode();
            if (entries.length === 0) {
                alert("Nie je tu žiaden kód na kopírovanie!");
                return;
            }
            navigator.clipboard.writeText(code).then(() => {
                alert("Čistý kód úspešne skopírovaný do schránky!");
            });
        }

        function downloadCode() {
            let code = getFormattedCode();
            if (entries.length === 0) {
                alert("Nie je tu žiaden kód na stiahnutie!");
                return;
            }
            const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "erikai_odpovede_cast.txt";
            link.click();
        }

        function clearAll() {
            if (confirm("Naozaj chceš vymazať všetko?")) {
                entries = [];
                updatePreview();
            }
        }
    </script>

</body>
</html>
