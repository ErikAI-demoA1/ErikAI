<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI Dokumenty s fotkami</title>
<style>
  body { font-family: Arial; padding: 20px; text-align: center; background: #f8f9fa; }
  textarea { width: 100%; max-width: 800px; height: 300px; margin: 10px 0; padding: 10px; }
  .preview img { max-width: 200px; margin: 5px; }
  button, input { margin: 5px; padding: 8px; }
</style>
</head>
<body>
<h1>📄 ErikAI Dokumenty</h1>

<input type="file" id="imageInput" accept="image/*" multiple>
<div class="preview" id="imagePreview"></div>

<input type="text" id="docName" placeholder="Zadaj názov dokumentu">
<textarea id="textArea" placeholder="Tu bude text dokumentu..."></textarea>

<div>
  <button onclick="ulozDokument()">💾 Uložiť</button>
  <button onclick="nacitajDokument()">📂 Načítať</button>
  <button onclick="stiahniTXT()">⬇ TXT</button>
  <button onclick="stiahniDOCX()">⬇ DOCX</button>
  <button onclick="stiahniHTML()">⬇ HTML</button>
  <button onclick="vymazDokument()">🗑️ Vymazať</button>
</div>

<div id="docList"></div>

<script>
const textArea = document.getElementById("textArea");
const docNameInput = document.getElementById("docName");
const imagePreview = document.getElementById("imagePreview");

// pridanie obrázkov do preview
document.getElementById("imageInput").addEventListener("change", function() {
  imagePreview.innerHTML = '';
  const files = Array.from(this.files);
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = document.createElement("img");
      img.src = e.target.result;
      imagePreview.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
});

// uloženie dokumentu (text + Base64 obrázky do localStorage ako objekt)
function ulozDokument() {
  const name = docNameInput.value.trim();
  if(!name) return alert("Zadaj názov dokumentu.");
  const images = Array.from(imagePreview.querySelectorAll("img")).map(img => img.src);
  const obj = { text: textArea.value, images };
  localStorage.setItem("erikai_doc_" + name, JSON.stringify(obj));
  refreshZoznam();
}

// načítanie dokumentu
function nacitajDokument() {
  const name = docNameInput.value.trim();
  const data = localStorage.getItem("erikai_doc_" + name);
  if(!data) return alert("Dokument neexistuje.");
  const obj = JSON.parse(data);
  textArea.value = obj.text;
  imagePreview.innerHTML = '';
  obj.images.forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    imagePreview.appendChild(img);
  });
}

// vymazanie dokumentu
function vymazDokument() {
  const name = docNameInput.value.trim();
  if(!name) return;
  localStorage.removeItem("erikai_doc_" + name);
  textArea.value = '';
  imagePreview.innerHTML = '';
  refreshZoznam();
}

// stiahnutie TXT
function stiahniTXT() {
  const blob = new Blob([textArea.value], { type: 'text/plain;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = (docNameInput.value || "erikai_dokument") + ".txt";
  link.click();
}

// stiahnutie DOCX (iba text)
function stiahniDOCX() {
  const content = textArea.value;
  const blob = new Blob([content], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = (docNameInput.value || "erikai_dokument") + ".docx";
  link.click();
}

// stiahnutie HTML (text + obrázky)
function stiahniHTML() {
  const images = Array.from(imagePreview.querySelectorAll("img")).map(img => `<img src="${img.src}">`).join("<br>");
  const htmlContent = `<html><head><meta charset="UTF-8"><title>${docNameInput.value || 'Dokument'}</title></head><body><p>${textArea.value.replace(/\n/g,"<br>")}</p>${images}</body></html>`;
  const blob = new Blob([htmlContent], { type: 'text/html' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = (docNameInput.value || "erikai_dokument") + ".html";
  link.click();
}

// zoznam uložených dokumentov
function refreshZoznam() {
  const keys = Object.keys(localStorage).filter(k => k.startsWith("erikai_doc_"));
  const div = document.getElementById("docList");
  div.innerHTML = "<h3>📚 Uložené dokumenty:</h3>";
  keys.forEach(k => {
    const name = k.replace("erikai_doc_", "");
    const el = document.createElement("div");
    el.innerText = name;
    el.style.cursor = "pointer";
    el.style.margin = "2px";
    el.onclick = () => {
      docNameInput.value = name;
      nacitajDokument();
    };
    div.appendChild(el);
  });
}

refreshZoznam();
</script>
</body>
  </html>
