<!DOCTYPE html><html lang="sk">
<head>
<meta charset="UTF-8">
<title>ErikAI Prezentácie 2.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PptxGenJS/3.12.0/pptxgen.bundle.js"></script>
<style>
  body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
  textarea { width: 100%; height: 150px; font-size: 18px; }
  .slide-img { max-width: 200px; margin: 5px; cursor: move; border: 1px solid #ccc; border-radius: 4px; }
  .controls { margin-top: 10px; }
</style>
</head>
<body><h2>📄 ErikAI Prezentácie 2.0</h2>
<label>📁 Názov prezentácie: <input id="presentationName" value="Moja prezentácia"></label><br><br>
<textarea id="slideText" placeholder="Napíš text pre tento slide..."></textarea><br>
<input type="file" id="slideImage" multiple accept="image/*"><br>
<div id="imageContainer"></div><div class="controls">
  <button onclick="prevSlide()">◄ Predchádzajúce</button>
  <button onclick="nextSlide()">► Ďalší</button>
  <button onclick="newSlide()">➕ Nový slide</button>
  <button onclick="savePresentation()">✅ Uložiť</button>
  <button onclick="downloadPPTX()">⬇ Stiahnuť PPTX</button>
</div>
<p id="slideCount">Slide: 1 / 1</p><script>
let slides = [{text:'', images:[]}], current = 0;
const imageContainer = document.getElementById('imageContainer');

function updateSlide() {
  document.getElementById('slideText').value = slides[current].text;
  imageContainer.innerHTML = '';
  slides[current].images.forEach((imgSrc, i) => {
    const img = document.createElement('img');
    img.src = imgSrc;
    img.className = 'slide-img';
    img.draggable = true;
    img.ondragstart = e => e.dataTransfer.setData('text/plain', i);
    imageContainer.appendChild(img);
  });
  document.getElementById('slideCount').innerText = `Slide: ${current+1} / ${slides.length}`;
}

function saveCurrent() {
  slides[current].text = document.getElementById('slideText').value;
}

function nextSlide() { saveCurrent(); if(current < slides.length-1) current++; updateSlide(); }
function prevSlide() { saveCurrent(); if(current > 0) current--; updateSlide(); }
function newSlide() { saveCurrent(); slides.push({text:'', images:[]}); current = slides.length-1; updateSlide(); }

// Pridanie obrázkov
document.getElementById('slideImage').addEventListener('change', e => {
  Array.from(e.target.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = evt => {
      slides[current].images.push(evt.target.result);
      updateSlide();
    };
    reader.readAsDataURL(file);
  });
});

function savePresentation() {
  saveCurrent();
  localStorage.setItem('presentation_'+document.getElementById('presentationName').value, JSON.stringify(slides));
  alert('Prezentácia uložená!');
}

function downloadPPTX() {
  saveCurrent();
  const pptx = new PptxGenJS();
  slides.forEach(slide => {
    const s = pptx.addSlide();
    s.addText(slide.text, { x:1, y:1, w:8, h:3, fontSize:18, color:'363636' });
    slide.images.forEach((img, i) => {
      s.addImage({ data: img, x:1+i*2, y:4, w:2, h:2 });
    });
  });
  pptx.writeFile({ fileName: document.getElementById('presentationName').value + '.pptx' });
}

updateSlide();
</script></body>
</html>
