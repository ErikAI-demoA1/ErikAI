<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>ErikAI Prezentácie – Profesionálne</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f0f2f5; }
    h2 { color: #a30000; }
    button { margin: 4px; padding: 8px 16px; font-size: 16px; cursor: pointer; }
    #slideContainer {
      margin-top: 20px;
      width: 80%;
      max-width: 900px;
      height: 400px;
      margin-left: auto;
      margin-right: auto;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      padding: 20px;
      background: linear-gradient(135deg, #ffffff, #e0e0e0);
      overflow-y: auto;
      font-size: 24px;
      color: #222;
      line-height: 1.5;
      position: relative;
      transition: background 0.5s, color 0.5s;
    }
    #slideTextInput {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 24px;
      line-height: 1.5;
      color: inherit;
      resize: none;
    }
    .controls, .storage { margin-top: 10px; text-align: center; }
    .saved-name { margin: 4px 0; }
    body.dark-mode { background-color: #121212; color: white; }
    body.dark-mode #slideContainer { background: linear-gradient(135deg, #222, #444); color: #eee; }
  </style>
</head>
<body>

<button onclick="toggleTheme()">🌓 Zmeniť režim</button>

<p id="cas" style="font-size: 18px;"></p>

<div id="google_translate_element"></div>

<h2>📄 ErikAI Prezentácie – Profesionálne</h2>

<!-- Mikrofón pre názov prezentácie -->
<button onclick="startVoiceInput('presentationName')">🎙️ Názov</button>

<!-- Mikrofón pre snímku -->
<button onclick="startRecognition('slideTextInput')">🎙️ Snímka</button>

<label>📁 Názov prezentácie: <input id="presentationName" value="Moja prezentácia"></label>

<p id="slideCount">Snímka: 1 / 1</p>

<div id="slideContainer">
  <textarea id="slideTextInput" placeholder="Sem napíš alebo nadiktuj text..."></textarea>
</div>

<div class="controls">
  <button onclick="prevSlide()">◄ Predchádzajúce</button>
  <button onclick="nextSlide()">► Ďalší</button>
  <button onclick="newSlide()">➕ Nový slide</button>
  <button onclick="savePresentation()">✅ Uložiť</button>
  <button onclick="deleteCurrentSlide()">🗑 Vymazať</button>
</div>

<div class="storage">
  <p>📁 Uložené prezentácie:</p>
  <div id="savedList"></div>
</div>

<script>
let slides = [""], current = 0;

// Aktualizácia času
function aktualizujCas() {
  const teraz = new Date();
  const moznosti = { weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' };
  document.getElementById('cas').innerText = `🕓 Aktuálny čas: ${teraz.toLocaleDateString('sk-SK', moznosti)}`;
}
setInterval(aktualizujCas, 1000);
aktualizujCas();

function toggleTheme() { document.body.classList.toggle('dark-mode'); }

// Hlasové zadávanie
function startRecognition(targetId) {
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = 'sk-SK';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  recognition.onresult = function(event) {
    const transcript = event.results[0][0].transcript;
    document.getElementById(targetId).value += transcript;
    slides[current] = document.getElementById(targetId).value;
  };
  recognition.onerror = function(event){ alert("Chyba pri rozpoznávaní hlasu: "+event.error); }
  recognition.start();
}
function startVoiceInput(inputId) { startRecognition(inputId); }

// Správa snímok
function updateSlide() {
  document.getElementById('slideTextInput').value = slides[current];
  document.getElementById('slideCount').innerText = `Snímka: ${current + 1} / ${slides.length}`;
}
function saveCurrent() { slides[current] = document.getElementById('slideTextInput').value; }
function nextSlide() { saveCurrent(); if(current<slides.length-1) current++; updateSlide(); }
function prevSlide() { saveCurrent(); if(current>0) current--; updateSlide(); }
function newSlide() { saveCurrent(); slides.push(""); current=slides.length-1; updateSlide(); }
function deleteCurrentSlide() { if(slides.length<=1) return; slides.splice(current,1); if(current>=slides.length) current=slides.length-1; updateSlide(); }

// Ukladanie a načítanie
function savePresentation() {
  saveCurrent();
  const name = document.getElementById("presentationName").value;
  localStorage.setItem("presentation_" + name, JSON.stringify(slides));
  renderSaved();
  alert("Prezentácia bola uložená.");
}
function renderSaved() {
  const container = document.getElementById("savedList");
  container.innerHTML = "";
  Object.keys(localStorage).filter(k=>k.startsWith("presentation_")).forEach(key=>{
    const name = key.replace("presentation_","");
    const div = document.createElement("div");
    div.className="saved-name";
    div.innerHTML = `${name} <button onclick="loadPresentation('${name}')">Načítať</button> <button onclick="deletePresentation('${name}')">X</button>`;
    container.appendChild(div);
  });
}
function loadPresentation(name){
  const raw = localStorage.getItem("presentation_" + name);
  if(!raw) return;
  slides = JSON.parse(raw); current=0;
  document.getElementById("presentationName").value=name;
  updateSlide();
}
function deletePresentation(name){
  localStorage.removeItem("presentation_" + name);
  renderSaved();
}

// Download – textová náhrada pre PowerPoint
function downloadPPTX(){
  saveCurrent();
  let content = slides.map((txt,i)=>`Slide ${i+1}\n====\n${txt}\n`).join("\n\n");
  const blob = new Blob([content],{type:'text/plain;charset=utf-8'});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = document.getElementById("presentationName").value+".ppt.txt";
  link.click();
}

updateSlide();
renderSaved();
</script>

</body>
</html>
