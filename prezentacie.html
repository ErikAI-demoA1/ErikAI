<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>ErikAI Prezentácie PRO</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.10.0/pptxgen.bundle.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #fefefe; }
    textarea { width: 100%; height: 150px; font-size: 18px; margin-top: 10px; }
    button { margin: 4px 2px; padding: 8px 16px; font-size: 16px; }
    .controls, .storage { margin-top: 10px; }
    .saved-name { margin: 4px 0; }
    input[type=file] { margin-top: 5px; }
  </style>
</head>
<body>

<h2>📄 ErikAI Prezentácie PRO</h2>

<button onclick="toggleTheme()">🌓 Zmeniť režim</button>
<script>
  function toggleTheme() {
    document.body.classList.toggle('dark-mode');
  }
</script>
<style>
  body.dark-mode { background-color: #121212; color: white; }
</style>

<p id="cas"></p>
<script>
function aktualizujCas() {
  const teraz = new Date();
  document.getElementById('cas').innerText = `🕓 Aktuálny čas: ${teraz.toLocaleString('sk-SK')}`;
}
setInterval(aktualizujCas, 1000); aktualizujCas();
</script>

<label>📁 Názov prezentácie: <input id="presentationName" value="Moja prezentácia"></label>
<div id="slideCount">Snímka: 1 / 1</div>
<textarea id="slideText"></textarea>

<div class="controls">
  <button onclick="prevSlide()">◄ Predchádzajúce</button>
  <button onclick="nextSlide()">► Ďalší</button>
  <button onclick="newSlide()">➕ Nový slide</button>
  <button onclick="savePresentation()">✅ Uložiť</button>
  <button onclick="deleteCurrentSlide()">🗑 Vymazať</button>
  <button onclick="downloadPPTX()">⬇ Stiahnuť PPTX</button>
  <br><br>
  <label>🖼️ Pridať obrázok: <input type="file" id="imgUpload" onchange="addImage(event)"></label>
</div>

<div class="storage">
  <p>📁 Uložené prezentácie:</p>
  <div id="savedList"></div>
</div>

<script>
let slides = [{ text: "", images: [] }], current = 0;

function updateSlide() {
  document.getElementById('slideText').value = slides[current].text;
  document.getElementById('slideCount').innerText = `Snímka: ${current + 1} / ${slides.length}`;
}

function saveCurrent() {
  slides[current].text = document.getElementById('slideText').value;
}

function nextSlide() { saveCurrent(); if(current < slides.length-1) current++; updateSlide(); }
function prevSlide() { saveCurrent(); if(current >0) current--; updateSlide(); }
function newSlide() { saveCurrent(); slides.push({text:"", images:[]}); current = slides.length-1; updateSlide(); }
function deleteCurrentSlide() { if(slides.length<=1) return; slides.splice(current,1); if(current>=slides.length) current = slides.length-1; updateSlide(); }

function savePresentation() {
  saveCurrent();
  const name = document.getElementById("presentationName").value;
  const timestamp = new Date().toISOString().replace(/[-:.]/g,"");
  const key = `presentation_${name}_${timestamp}`;
  localStorage.setItem(key, JSON.stringify(slides));
  renderSaved();
  alert("Prezentácia bola uložená!");
}

function renderSaved() {
  const container = document.getElementById("savedList");
  container.innerHTML = "";
  Object.keys(localStorage).filter(k=>k.startsWith("presentation_")).forEach(key=>{
    const name = key.replace("presentation_","");
    const div = document.createElement("div");
    div.className="saved-name";
    div.innerHTML=`${name} <button onclick="loadPresentation('${key}')">Načítať</button> <button onclick="deletePresentation('${key}')">X</button>`;
    container.appendChild(div);
  });
}

function loadPresentation(key) {
  const raw = localStorage.getItem(key); if(!raw) return;
  slides = JSON.parse(raw); current = 0;
  const name = key.replace("presentation_","");
  document.getElementById("presentationName").value = name;
  updateSlide();
}

function deletePresentation(key){ localStorage.removeItem(key); renderSaved(); }

function addImage(event) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    slides[current].images.push(e.target.result);
    alert("Obrázok pridaný do snímky!");
  }
  reader.readAsDataURL(file);
}

function downloadPPTX() {
  saveCurrent();
  const pptx = new PptxGenJS();
  slides.forEach(s=>{
    const slide = pptx.addSlide();
    slide.addText(s.text, { x:0.5, y:0.5, w:8, h:3, fontSize:18 });
    s.images.forEach((img, i)=>{
      slide.addImage({ data: img, x:1, y:1.5+i*2, w:4, h:2.5 });
    });
  });
  const name = document.getElementById("presentationName").value;
  pptx.writeFile({ fileName: name+".pptx" });
}

updateSlide();
renderSaved();
</script>

</body>
</html>
