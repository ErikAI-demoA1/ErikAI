<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>ErikAI Prezentácie</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #fefefe; }
  textarea { width: 100%; height: 150px; font-size: 18px; margin-bottom: 10px; }
  button { margin: 4px; padding: 8px 16px; font-size: 16px; cursor: pointer; }
  .controls, .storage, .images { margin-top: 10px; }
  .slide-img { max-width: 150px; margin: 5px; border: 1px solid #ccc; border-radius: 4px; }
  #slideCount { font-weight: bold; margin-bottom: 5px; }
  body.dark-mode { background-color: #121212; color: white; }
</style>
</head>
<body>

<button onclick="toggleTheme()">🌓 Zmeniť režim</button>

<script>
function toggleTheme() { document.body.classList.toggle('dark-mode'); }
</script>

<p id="cas" style="font-size: 18px;"></p>
<script>
function aktualizujCas() {
  const teraz = new Date();
  const moznosti = { weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' };
  document.getElementById('cas').innerText = `🕓 Aktuálny čas: ${teraz.toLocaleDateString('sk-SK', moznosti)}`;
}
setInterval(aktualizujCas, 1000);
aktualizujCas();
</script>

<h2>📄 ErikAI Prezentácie</h2>
<label>📁 Názov prezentácie: <input id="presentationName" value="Moja prezentácia"></label><br><br>

<p id="slideCount">Snímka: 1 / 1</p>
<textarea id="slideText"></textarea>

<div class="images">
  <label>📷 Pridať obrázok: <input type="file" id="imgInput" multiple></label>
  <div id="slideImages"></div>
</div>

<div class="controls">
  <button onclick="prevSlide()">◄ Predchádzajúce</button>
  <button onclick="nextSlide()">► Ďalší</button>
  <button onclick="newSlide()">➕ Nový slide</button>
  <button onclick="savePresentation()">✅ Uložiť</button>
  <button onclick="downloadPPTX()">⬇ Stiahnuť PPTX</button>
  <button onclick="deleteCurrentSlide()">🗑 Vymazať</button>
</div>

<div class="storage">
  <p>📁 Uložené prezentácie:</p>
  <div id="savedList"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PptxGenJS/3.12.0/pptxgen.min.js"></script>
<script>
let slides = [{ text: "", images: [] }], current = 0;

// Aktualizácia zobrazenia snímky
function updateSlide() {
  document.getElementById('slideText').value = slides[current].text;
  const container = document.getElementById('slideImages');
  container.innerHTML = "";
  slides[current].images.forEach((img, idx) => {
    const imgel = document.createElement('img');
    imgel.src = img;
    imgel.className = "slide-img";
    imgel.title = "Klikni pre odstránenie";
    imgel.onclick = () => { slides[current].images.splice(idx,1); updateSlide(); };
    container.appendChild(imgel);
  });
  document.getElementById('slideCount').innerText = `Snímka: ${current+1} / ${slides.length}`;
}

// Uloženie textu a obrázkov do aktuálnej snímky
function saveCurrent() {
  slides[current].text = document.getElementById('slideText').value;
}

// Navigácia snímok
function nextSlide() { saveCurrent(); if(current<slides.length-1) current++; updateSlide(); }
function prevSlide() { saveCurrent(); if(current>0) current--; updateSlide(); }
function newSlide() { saveCurrent(); slides.push({text:"",images:[]}); current=slides.length-1; updateSlide(); }
function deleteCurrentSlide() { if(slides.length<=1) return; slides.splice(current,1); if(current>=slides.length) current=slides.length-1; updateSlide(); }

// Správa obrázkov
document.getElementById('imgInput').addEventListener('change', function(e){
  Array.from(e.target.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = function(ev){ slides[current].images.push(ev.target.result); updateSlide(); }
    reader.readAsDataURL(file);
  });
  e.target.value = "";
});

// Uloženie do localStorage
function savePresentation() {
  saveCurrent();
  const name = document.getElementById("presentationName").value;
  localStorage.setItem("presentation_" + name, JSON.stringify(slides));
  renderSaved();
  alert("Prezentácia bola uložená.");
}
function renderSaved() {
  const container = document.getElementById("savedList");
  container.innerHTML = "";
  Object.keys(localStorage).filter(k => k.startsWith("presentation_")).forEach(key => {
    const name = key.replace("presentation_","");
    const div = document.createElement("div");
    div.innerHTML = `${name} <button onclick="loadPresentation('${name}')">Načítať</button> <button onclick="deletePresentation('${name}')">X</button>`;
    container.appendChild(div);
  });
}
function loadPresentation(name) {
  const raw = localStorage.getItem("presentation_" + name);
  if(!raw) return;
  slides = JSON.parse(raw); current=0;
  document.getElementById("presentationName").value=name;
  updateSlide();
}
function deletePresentation(name) { localStorage.removeItem("presentation_" + name); renderSaved(); }

renderSaved();
updateSlide();

// Stiahnutie ako PPTX pomocou PptxGenJS
function downloadPPTX(){
  saveCurrent();
  let pptx = new PptxGenJS();
  slides.forEach(slide => {
    let s = pptx.addSlide();
    s.addText(slide.text, { x:0.5, y:0.5, w:8, h:3, fontSize:18 });
    slide.images.forEach((img, idx) => {
      s.addImage({ data: img, x:0.5+(idx%3)*2.5, y:2+Math.floor(idx/3)*2.5, w:2.2, h:2.2 });
    });
  });
  pptx.writeFile({ fileName: document.getElementById("presentationName").value+".pptx" });
}
</script>

</body>
</html>
