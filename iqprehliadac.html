<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI OS — Inteligentný Lokálny Vyhľadávač</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #030712;
    --card-glass: rgba(17, 24, 39, 0.75);
    --card-border: rgba(255, 255, 255, 0.08);
    --card-hover-border: rgba(239, 68, 68, 0.5);
    --neon-red: #ef4444;
    --neon-orange: #f97316;
    --accent-glow: rgba(239, 68, 68, 0.25);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background-color: var(--bg-deep);
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(239, 68, 68, 0.08) 0%, transparent 40%),
      linear-gradient(135deg, #030712 0%, #0b0f19 100%);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
  }

  .main-container {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    gap: 25px;
  }

  header {
    background: var(--card-glass);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  h1 {
    font-size: 2.4rem;
    font-weight: 900;
    background: linear-gradient(135deg, #fff 40%, var(--neon-red), var(--neon-orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }

  p { color: var(--text-muted); font-size: 0.95rem; }

  .panel {
    background: var(--card-glass);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 25px;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .search-row {
    display: flex;
    gap: 10px;
  }

  input[type="text"] {
    flex: 1;
    padding: 16px 20px;
    background: rgba(3, 7, 18, 0.9);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    color: #fff;
    font-size: 1.05rem;
    outline: none;
    transition: all 0.2s;
  }

  input[type="text"]:focus { 
    border-color: var(--neon-red); 
    box-shadow: 0 0 20px var(--accent-glow); 
  }

  button {
    background: linear-gradient(135deg, var(--neon-red), var(--neon-orange));
    color: #fff;
    border: none;
    padding: 0 28px;
    border-radius: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 15px var(--accent-glow);
    transition: transform 0.2s, opacity 0.2s;
  }

  button:hover { transform: translateY(-2px); opacity: 0.95; }

  .results-list {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .result-card {
    background: rgba(3, 7, 18, 0.6);
    border: 1px solid var(--card-border);
    padding: 18px;
    border-radius: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.2s;
  }

  .result-card:hover { 
    border-color: var(--card-hover-border);
    transform: translateY(-2px);
  }

  .result-info h3 {
    color: #fff;
    font-size: 1.1rem;
    margin-bottom: 4px;
  }

  .result-info p {
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .visit-btn {
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.85rem;
    border: 1px solid var(--card-border);
    transition: background 0.2s, border-color 0.2s;
    white-space: nowrap;
  }

  .visit-btn:hover {
    background: var(--neon-red);
    border-color: var(--neon-red);
  }
</style>
</head>
<body>

  <div class="main-container">
    <header>
      <h1>🔎 ErikAI Okamžitý Vyhľadávač</h1>
      <p>Zadaj ľubovoľné slovo (napr. pes, auto, správy, hry) a bot ťa hneď nasmeruje na najlepšie stránky!</p>
    </header>

    <div class="panel">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Čo chceš hľadať? (napr. pes)..." onkeyup="checkEnter(event)">
        <button onclick="searchWeb()">Hľadaj ⚡</button>
      </div>

      <div class="results-list" id="searchResults">
        <!-- Sem sa vyhodia výsledky -->
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 🧠 LOKÁLNA BOT DATABÁZA (Zadarmo & Bez Serveru)
    // ==========================================
    // Sem si môžeš pridávať ľubovoľné kľúčové slová a stránky, ktoré má bot poznať
    const botDatabase = [
      {
        keywords: ["pes", "psov", "psi", "zvieratá", "cider", "mačka"],
        title: "Všetko o psoch a domácich zvieratách",
        description: "Najlepšie weby o starostlivosti, krmive a výchove psov.",
        url: "https://www.dogtime.com"
      },
      {
        keywords: ["pes", "wikipedia", "encyklopédia"],
        title: "Pes domáci — Wikipédia",
        description: "Všetky odborné informácie o evolúcii, druhoch a správaní psov.",
        url: "https://sk.wikipedia.org/wiki/Pes_domáci"
      },
      {
        keywords: ["hry", "steam", "zábava", "pc", "gaming"],
        title: "Steam — Najväčšia herná platforma",
        description: "Hraj, diskutuj a objavuj tisíce hier priamo na PC.",
        url: "https://store.steampowered.com"
      },
      {
        keywords: ["filmy", "kino", "recenzie", "imdb"],
        title: "IMDb — Filmová databáza",
        description: "Hodnotenia, herci, trailery a informácie o všetkých filmoch.",
        url: "https://www.imdb.com"
      },
      {
        keywords: ["erikai", "os", "aplikácie", "hry", "portál"],
        title: "ErikAI OS Universe (Domov)",
        description: "Hlavný portál ekosystému Erika Mohyláka.",
        url: "https://erikaios2025.github.io/ErikAI/"
      },
      {
        keywords: ["správy", "aktuality", "novinky", "svet"],
        title: "Aktuality.sk — Domáce a svetové správy",
        description: "Rýchle spravodajstvo, komentáre a témy, ktoré hýbu Slovenskom.",
        url: "https://www.aktuality.sk"
      }
    ];

    function checkEnter(event) {
      if (event.key === "Enter") {
        searchWeb();
      }
    }

    // ==========================================
    // ⚡ VYHĽADÁVACÍ BOT ALGORITMUS
    // ==========================================
    function searchWeb() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      const container = document.getElementById("searchResults");
      container.innerHTML = "";

      if (!query) {
        container.innerHTML = `<p style="color:var(--text-muted)">Zadaj aspoň jedno slovo na vyhľadávanie.</p>`;
        return;
      }

      const words = query.split(" ");

      // Prejdeme našu databázu a ohodnotíme zhody
      const scoredResults = botDatabase.map(item => {
        let score = 0;
        words.forEach(word => {
          // Ak kľúčové slovo obsahuje zadaný výraz
          item.keywords.forEach(kw => {
            if (kw.includes(word)) score += 10;
          });
          // Ak sa slovo nachádza v názve alebo popise
          if (item.title.toLowerCase().includes(word)) score += 5;
          if (item.description.toLowerCase().includes(word)) score += 2;
        });
        return { ...item, score };
      });

      // Vyberieme tie, ktoré majú aspoň nejakú zhodu
      const matches = scoredResults.filter(r => r.score > 0).sort((a, b) => b.score - a.score);

      if (matches.length === 0) {
        container.innerHTML = `
          <div class="result-card" style="flex-direction: column; align-items: flex-start; gap: 10px;">
            <p style="color: #fff;">🤖 Bot nenašiel priamu zhodu pre <b>"${query}"</b> v lokálnej databáze.</p>
            <a href="https://www.google.com/search?q=${encodeURIComponent(query)}" target="_blank" class="visit-btn" style="background: var(--neon-red);">Hľadať cez Google ↗</a>
          </div>
        `;
        return;
      }

      // Vypíšeme výsledky
      matches.forEach(res => {
        container.innerHTML += `
          <div class="result-card">
            <div class="result-info">
              <h3>${res.title}</h3>
              <p>${res.description}</p>
            </div>
            <a href="${res.url}" target="_blank" class="visit-btn">Otvoriť stránku ↗</a>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
