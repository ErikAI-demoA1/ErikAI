<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI IQ Prehliadač — Autonómny Vedomostný Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #030712;
    --card-glass: rgba(17, 24, 39, 0.75);
    --card-border: rgba(255, 255, 255, 0.08);
    --card-hover-border: rgba(239, 68, 68, 0.5);
    --neon-red: #ef4444;
    --neon-orange: #f97316;
    --accent-glow: rgba(239, 68, 68, 0.25);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background-color: var(--bg-deep);
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(239, 68, 68, 0.08) 0%, transparent 40%),
      linear-gradient(135deg, #030712 0%, #0b0f19 100%);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
  }

  .main-container {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    gap: 25px;
  }

  header {
    background: var(--card-glass);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  h1 {
    font-size: 2.4rem;
    font-weight: 900;
    background: linear-gradient(135deg, #fff 40%, var(--neon-red), var(--neon-orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }

  p { color: var(--text-muted); font-size: 0.95rem; }

  .panel {
    background: var(--card-glass);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 25px;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .search-row {
    display: flex;
    gap: 10px;
  }

  input[type="text"] {
    flex: 1;
    padding: 16px 20px;
    background: rgba(3, 7, 18, 0.9);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    color: #fff;
    font-size: 1.05rem;
    outline: none;
    transition: all 0.2s;
  }

  input[type="text"]:focus { 
    border-color: var(--neon-red); 
    box-shadow: 0 0 20px var(--accent-glow); 
  }

  button {
    background: linear-gradient(135deg, var(--neon-red), var(--neon-orange));
    color: #fff;
    border: none;
    padding: 0 28px;
    border-radius: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 15px var(--accent-glow);
    transition: transform 0.2s, opacity 0.2s;
  }

  button:hover { transform: translateY(-2px); opacity: 0.95; }

  .results-list {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .result-card {
    background: rgba(3, 7, 18, 0.6);
    border: 1px solid var(--card-border);
    padding: 18px;
    border-radius: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.2s;
  }

  .result-card:hover { 
    border-color: var(--card-hover-border);
    transform: translateY(-2px);
  }

  .result-info h3 {
    color: #fff;
    font-size: 1.1rem;
    margin-bottom: 4px;
  }

  .result-info p {
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .visit-btn {
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.85rem;
    border: 1px solid var(--card-border);
    transition: background 0.2s, border-color 0.2s;
    white-space: nowrap;
  }

  .visit-btn:hover {
    background: var(--neon-red);
    border-color: var(--neon-red);
  }

  .system-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    color: var(--neon-orange);
    margin-top: 10px;
  }
</style>
</head>
<body>

  <div class="main-container">
    <header>
      <h1>🧠 ErikAI IQ Prehliadač</h1>
      <p>Nezávislý systém pre inteligentné vyhľadávanie v otvorených vedomostných databázach — bezpečne, bez reklám a zadarmo.</p>
    </header>

    <div class="panel">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Čo chceš vyhľadať? (napr. vesmír, fyzika, pes)..." onkeyup="checkEnter(event)">
        <button onclick="runIQSearch()">Vyhľadať ⚡</button>
      </div>
      <div id="systemStatus" class="system-status"></div>

      <div class="results-list" id="searchResults">
        <!-- Sem sa vypíšu inteligentné výsledky -->
      </div>
    </div>
  </div>

  <script>
    function checkEnter(event) {
      if (event.key === "Enter") {
        runIQSearch();
      }
    }

    // ==========================================
    // 🧠 ERIKAI IQ MULTI-SOURCE VYHĽADÁVAČ
    // ==========================================
    async function runIQSearch() {
      const query = document.getElementById("searchInput").value.trim();
      const container = document.getElementById("searchResults");
      const status = document.getElementById("systemStatus");
      
      container.innerHTML = "";

      if (!query) {
        status.innerText = "⚠️ Zadaj výraz do vyhľadávania!";
        return;
      }

      status.innerText = "🧠 ErikAI IQ prechádza viaceré nezávislé vedomostné zdroje...";

      try {
        // Zdroje 1: Slovenská Wikipédia API
        const wikiSkUrl = `https://sk.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
        
        // Zdroje 2: Anglická Wikipédia API (pre širší svetový záber, ak je to potrebné)
        const wikiEnUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;

        // Paralelne potiahneme dáta z viacerých slobodných zdrojov
        const [resSk, resEn] = await Promise.all([
          fetch(wikiSkUrl).then(r => r.json()).catch(() => null),
          fetch(wikiEnUrl).then(r => r.json()).catch(() => null)
        ]);

        let allItems = [];

        // Spracujeme slovenské výsledky
        if (resSk && resSk.query && resSk.query.search) {
          resSk.query.search.forEach(item => {
            allItems.push({
              title: item.title + " (SK)",
              snippet: item.snippet.replace(/(<([^>]+)>)/gi, ""),
              url: `https://sk.wikipedia.org/wiki/${encodeURIComponent(item.title)}`
            });
          });
        }

        // Spracujeme svetové výsledky
        if (resEn && resEn.query && resEn.query.search) {
          resEn.query.search.slice(0, 3).forEach(item => { // zoberieme top 3 z EN
            allItems.push({
              title: item.title + " (World / EN)",
              snippet: item.snippet.replace(/(<([^>]+)>)/gi, ""),
              url: `https://en.wikipedia.org/wiki/${encodeURIComponent(item.title)}`
            });
          });
        }

        if (allItems.length === 0) {
          status.innerText = `❌ ErikAI IQ nenašiel žiadne záznamy pre výraz "${query}".`;
          return;
        }

        status.innerText = `✅ Úspešne nájdených ${allItems.length} relevantných výsledkov:`;

        // Vykreslíme výsledky
        allItems.forEach(res => {
          container.innerHTML += `
            <div class="result-card">
              <div class="result-info">
                <h3>${res.title}</h3>
                <p>${res.snippet}...</p>
              </div>
              <a href="${res.url}" target="_blank" class="visit-btn">Otvoriť stránku ↗</a>
            </div>
          `;
        });

      } catch (err) {
        console.error(err);
        status.innerText = "❌ Chyba pri komunikácii so vedomostnými uzlami.";
      }
    }
  </script>
</body>
</html>
