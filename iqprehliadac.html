<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI OS — Nezávislý Autonómny Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #030712;
    --card-glass: rgba(17, 24, 39, 0.75);
    --card-border: rgba(255, 255, 255, 0.08);
    --card-hover-border: rgba(239, 68, 68, 0.5);
    --neon-red: #ef4444;
    --neon-orange: #f97316;
    --accent-glow: rgba(239, 68, 68, 0.25);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background-color: var(--bg-deep);
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(239, 68, 68, 0.08) 0%, transparent 40%),
      linear-gradient(135deg, #030712 0%, #0b0f19 100%);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
  }

  .main-container {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    gap: 25px;
  }

  header {
    background: var(--card-glass);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  h1 {
    font-size: 2.4rem;
    font-weight: 900;
    background: linear-gradient(135deg, #fff 40%, var(--neon-red), var(--neon-orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }

  p { color: var(--text-muted); font-size: 0.95rem; }

  .panel {
    background: var(--card-glass);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 25px;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .search-row {
    display: flex;
    gap: 10px;
  }

  input[type="text"] {
    flex: 1;
    padding: 16px 20px;
    background: rgba(3, 7, 18, 0.9);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    color: #fff;
    font-size: 1.05rem;
    outline: none;
    transition: all 0.2s;
  }

  input[type="text"]:focus { 
    border-color: var(--neon-red); 
    box-shadow: 0 0 20px var(--accent-glow); 
  }

  button {
    background: linear-gradient(135deg, var(--neon-red), var(--neon-orange));
    color: #fff;
    border: none;
    padding: 0 28px;
    border-radius: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 15px var(--accent-glow);
    transition: transform 0.2s, opacity 0.2s;
  }

  button:hover { transform: translateY(-2px); opacity: 0.95; }

  .results-list {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .result-card {
    background: rgba(3, 7, 18, 0.6);
    border: 1px solid var(--card-border);
    padding: 18px;
    border-radius: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.2s;
  }

  .result-card:hover { 
    border-color: var(--card-hover-border);
    transform: translateY(-2px);
  }

  .result-info h3 {
    color: #fff;
    font-size: 1.1rem;
    margin-bottom: 4px;
  }

  .result-info p {
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .visit-btn {
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.85rem;
    border: 1px solid var(--card-border);
    transition: background 0.2s, border-color 0.2s;
    white-space: nowrap;
  }

  .visit-btn:hover {
    background: var(--neon-red);
    border-color: var(--neon-red);
  }

  .bot-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    color: var(--neon-orange);
    margin-top: 10px;
  }
</style>
</head>
<body>

  <div class="main-container">
    <header>
      <h1>🤖 ErikAI Autonómny Bot</h1>
      <p>Zadaj akékoľvek slovo – náš bot ho automaticky vyhľadá v otvorených zdrojoch a hneď ťa prepojí na priamy web!</p>
    </header>

    <div class="panel">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Napíš čo hľadáš (napr. pes, vesmír, Paríž)..." onkeyup="checkEnter(event)">
        <button onclick="runAutonomousBot()">Bot Hľadaj ⚡</button>
      </div>
      <div id="botStatus" class="bot-status"></div>

      <div class="results-list" id="searchResults">
        <!-- Sem bot vyhodí výsledky -->
      </div>
    </div>
  </div>

  <script>
    function checkEnter(event) {
      if (event.key === "Enter") {
        runAutonomousBot();
      }
    }

    // ==========================================
    // ⚡ AUTONÓMNY BOT PRE HĽADANIE BEZ GOOGLU
    // ==========================================
    async function runAutonomousBot() {
      const query = document.getElementById("searchInput").value.trim();
      const container = document.getElementById("searchResults");
      const status = document.getElementById("botStatus");
      
      container.innerHTML = "";

      if (!query) {
        status.innerText = "⚠️ Najprv niečo napíš!";
        return;
      }

      status.innerText = "🤖 Bot prehľadáva dostupné bezplatné zdroje a databázy...";

      try {
        // Využijeme bezplatné a otvorené Wikipedia API pre slovenský a svetový jazyk
        const wikiUrl = `https://sk.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
        
        const response = await fetch(wikiUrl);
        const data = await response.json();
        
        const searchResults = data.query ? data.query.search : [];

        if (searchResults.length === 0) {
          status.innerText = `🤖 Bot nenašiel priame záznamy pre "${query}". Skús iné slovo.`;
          return;
        }

        status.innerText = `✅ Bot našiel ${searchResults.length} priamych výsledkov:`;

        // Pre každú nájdenú položku vygenerujeme priamy odkaz na Wikipédiu / web
        searchResults.forEach(item => {
          // Vytvoríme priamy odkaz na daný článok
          const pageTitleEncoded = encodeURIComponent(item.title);
          const directUrl = `https://sk.wikipedia.org/wiki/${pageTitleEncoded}`;
          
          // Očistíme HTML značky z úryvku textu
          const cleanSnippet = item.snippet.replace(/(<([^>]+)>)/gi, "");

          container.innerHTML += `
            <div class="result-card">
              <div class="result-info">
                <h3>${item.title}</h3>
                <p>${cleanSnippet}...</p>
              </div>
              <a href="${directUrl}" target="_blank" class="visit-btn">Otvoriť stránku ↗</a>
            </div>
          `;
        });

      } catch (err) {
        console.error(err);
        status.innerText = "❌ Bot narazil na sieťovú chybu pri komunikácii so zdrojom.";
      }
    }
  </script>
</body>
</html>
