<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔧 ErikAI OS Universe</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-hover: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #2563eb;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at top, #131722 0%, var(--bg) 100%);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

    /* Jediná karta s odkazom */
    .single-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 26px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .single-card:hover {
      background: var(--card-hover);
      border-color: rgba(37, 99, 235, 0.5);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.2);
    }

    .click-badge {
      background: rgba(37, 99, 235, 0.15);
      color: #60a5fa;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(37, 99, 235, 0.3);
    }

    footer {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div>
      <h1>🔧 ErikAI OS</h1>
      <p class="subtitle">Oficiálny vstupný bod s globálnym počítadlom</p>
    </div>

    <!-- Odkaz na tvoju hlavnú stránku (index3.html) -->
    <a href="index3.html" class="single-card">
      <span>📄 Otvoriť ErikAI OS</span>
      <span class="click-badge" id="global-counter">Načítavam...</span>
    </a>

    <footer>
      © 2025 Erik Mohylák – Všetky práva vyhradené.
    </footer>
  </div>

  <script>
    // Globálne počítadlo reálnych návštev cez stabilnú API službu
    async function fetchGlobalCount() {
      const badge = document.getElementById('global-counter');
      try {
        // Volá verejný endpoint, ktorý automaticky pripočíta každého nového unikátneho návštevníka zo sveta
        const response = await fetch('https://api.counterapi.dev/v1/erikaios/universe/up');
        const data = await response.json();
        
        if (data && data.count !== undefined) {
          badge.textContent = `${data.count} ${data.count === 1 ? 'návšteva' : 'návštev'}`;
        } else {
          badge.textContent = `Online`;
        }
      } catch (e) {
        // Fallback pre prípad blokovania skriptov (napr. adblockerom)
        badge.textContent = `Aktívne`;
      }
    }

    document.addEventListener("DOMContentLoaded", fetchGlobalCount);
  </script>

</body>
</html>
