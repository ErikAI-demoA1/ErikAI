<!DOCTYPE html><html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RocketBall — Full (ErikAI)</title>
<style>
/* --- UI --- */
html,body{height:100%;margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:#061426;color:#fff;overflow:hidden}
#hud,#mini,.note{position:fixed;padding:10px 14px;border-radius:10px;backdrop-filter:blur(6px);z-index:60}
#hud{left:12px;top:12px;background:rgba(0,0,0,0.36);box-shadow:0 8px 30px rgba(0,0,0,.45);font-weight:700}
#mini{right:12px;top:12px;background:rgba(0,0,0,0.16)}
.note{left:12px;top:64px;color:#9fb2d1;font-size:13px;z-index:50}
.goal-banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:linear-gradient(180deg,#ff7b3a,#ff4b4b);padding:22px 28px;border-radius:12px;font-size:34px;font-weight:800;color:#fff;z-index:100;display:none}
#ui{position:fixed;left:12px;bottom:12px;display:flex;gap:10px;align-items:center;pointer-events:none;z-index:70}
.joystick{width:130px;height:130px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));display:flex;align-items:center;justify-content:center;touch-action:none;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.stick{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;transform:translate(0,0)}
#controlsRight{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:10px;pointer-events:none;z-index:70}
.btn{padding:10px 16px;border-radius:10px;border:0;background:#1db954;color:#fff;font-weight:800;cursor:pointer;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.btn.ghost{background:rgba(255,255,255,0.06);color:#dbeefe}
#startBtn{position:fixed;right:12px;top:12px;padding:10px 16px;border-radius:10px;border:0;background:#ff4b4b;color:#fff;z-index:90;cursor:pointer;font-weight:800;box-shadow:0 12px 40px rgba(255,75,75,.18)}
#jumpBtn{background:#f7a400}
#boostBtn.active{background:#ffd35b;color:#222}
.hint{font-size:12px;color:#b6c9dd;opacity:.95;padding-top:6px}
.canvasWrap{width:100%;height:100%}
.menuOverlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.7);z-index:120}
.menuCard{background:#071526;padding:28px;border-radius:12px;min-width:280px}
.menuCard h2{margin:0 0 12px 0}
.menuCard button{display:block;margin-top:8px;width:100%}
.scoreTable{position:fixed;left:12px;bottom:12px;background:rgba(0,0,0,0.28);padding:10px;border-radius:8px;font-size:13px}
/* responsive tweaks */
@media(max-width:700px){.joystick{left:8px;bottom:8px;width:120px;height:120px}.stick{width:50px;height:50px}#controlsRight{right:8px;bottom:8px}}
</style>
</head>
<body>
<button id="startBtn">Spusti / Reset</button>
<div id="hud">Skóre — Red: <span id="scoreA">0</span> • Blue: <span id="scoreB">0</span> • Rýchlosť: <span id="speed">0</span></div>
<div id="mini">Aréna: <span id="arenaSize">160</span> m</div>
<div class="note">RocketBall — full: AI, jump, boost, sounds, effects, menu, scoreboard</div>
<div class="goal-banner" id="goalBanner">GOAL!</div>
<div id="ui"><div id="joy" class="joystick" aria-label="Joystick"><div id="stick" class="stick"></div></div></div>
<div id="controlsRight">
  <div style="display:flex;gap:8px">
    <button id="boostBtn" class="btn">BOOST</button>
    <button id="jumpBtn" class="btn" title="Space">SKOK</button>
  </div>
  <button id="cameraBtn" class="btn ghost">Kamera: Follow</button>
  <div class="hint">WASD / šípky alebo joystick + Space (skákanie), Shift/Q = boost</div>
</div>
<div class="scoreTable" id="scoreTable">Top skóre<br><div id="scoresList"></div></div><!-- Menu --><div id="menu" class="menuOverlay">
  <div class="menuCard">
    <h2>RocketBall — ErikAI</h2>
    <button id="playBtn" class="btn">Play</button>
    <button id="settingsBtn" class="btn ghost">Nastavenia</button>
    <button id="creditsBtn" class="btn ghost">Credits</button>
  </div>
</div><!-- three.js --><script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script><script>
// ---------- CONFIG ----------
const ARENA = 160; document.getElementById('arenaSize').innerText = ARENA;
const DT_MAX = 0.05;
const CAR = { width:1.9,height:0.6,length:2.6,maxSpeed:18,accel:60,brake:100,steerSpeed:3.2 };
const BALL_R = 0.95;
const MAX_JUMPS = 2; const JUMP_V = 7.6;
const BOOST_MAX = 100, BOOST_DRAIN=80, BOOST_RECHARGE=22, BOOST_MULT=1.9, BOOST_AIR_LIFT=9.0;

// ---------- GLOBALS ----------
let scene,camera,renderer,clock; let player,ai,ball,ground,dome; let playing=false; let playerSpeed=0,targetThrottle=0,steerInput=0; let playerVelY=0,jumpCount=0,boostVal=BOOST_MAX,boostActive=false; let ballVel=new THREE.Vector3(); let score={A:0,B:0};
const scoreAEl=document.getElementById('scoreA'), scoreBEl=document.getElementById('scoreB'), hudSpeed=document.getElementById('speed'); const goalBanner=document.getElementById('goalBanner');
let cameraFollow=true; const half=ARENA/2; const goalWidthRatio=0.36; let goalCooldown=false;

// audio (simple, base64-free small beeps or optional files)
const sounds = {
  kick: new Audio(),
  goal: new Audio(),
  boost: new Audio(),
  bg: new Audio()
};
// tiny beep placeholders (silent if not provided); you can swap src to actual files
sounds.kick.src = '';
sounds.goal.src = '';
sounds.boost.src = '';
// optional background loop - leave empty
sounds.bg.src = '';
let audioEnabled=true;

// particles for boost (simple array)
let boostParticles = [];

// ---------- INIT ----------
function init(){
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x061426);
  camera = new THREE.PerspectiveCamera(66, innerWidth/innerHeight, 0.1, 4000); camera.position.set(0,7,14);
  renderer = new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); document.body.appendChild(renderer.domElement);

  const hemi = new THREE.HemisphereLight(0xffffff,0x222a3a,1.0); scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff,0.6); dir.position.set(8,20,10); scene.add(dir);

  ground = new THREE.Mesh(new THREE.PlaneGeometry(ARENA,ARENA,4,4), new THREE.MeshStandardMaterial({color:0x0f3b46,roughness:0.95})); ground.rotation.x=-Math.PI/2; scene.add(ground);

  // walls
  const wallMat = new THREE.MeshStandardMaterial({color:0xADFF2F});
  const wallGeoH = new THREE.BoxGeometry(ARENA+2,2.2,1);
  const wallGeoV = new THREE.BoxGeometry(1,2.2,ARENA+2);
  scene.add(new THREE.Mesh(wallGeoH, wallMat).position.set(0,1,-half));
  scene.add(new THREE.Mesh(wallGeoH, wallMat).position.set(0,1,half));
  scene.add(new THREE.Mesh(wallGeoV, wallMat).position.set(-half,1,0));
  scene.add(new THREE.Mesh(wallGeoV, wallMat).position.set(half,1,0));

  // goals
  const goalW = ARENA * goalWidthRatio;
  const gLeft = new THREE.Mesh(new THREE.BoxGeometry(goalW,6,2.5), new THREE.MeshStandardMaterial({color:0xff4b4b,emissive:0x220000})); gLeft.position.set(0,3,-half+1.25); scene.add(gLeft);
  const gRight = new THREE.Mesh(new THREE.BoxGeometry(goalW,6,2.5), new THREE.MeshStandardMaterial({color:0x4b9eff,emissive:0x002255})); gRight.position.set(0,3,half-1.25); scene.add(gRight);

  // player
  player = new THREE.Mesh(new THREE.BoxGeometry(CAR.width,CAR.height,CAR.length), new THREE.MeshStandardMaterial({color:0xff6b6b,roughness:0.25,metalness:0.1})); player.position.set(0,0.5,0); scene.add(player);
  // AI
  ai = new THREE.Mesh(new THREE.BoxGeometry(CAR.width,CAR.height,CAR.length), new THREE.MeshStandardMaterial({color:0x6b8bff,roughness:0.25})); ai.position.set(0,0.5,8); scene.add(ai);
  // ball
  ball = new THREE.Mesh(new THREE.SphereGeometry(BALL_R,32,32), new THREE.MeshStandardMaterial({color:0xfff08a,roughness:0.5})); ball.position.set(4,1.8,-4); scene.add(ball);

  clock = new THREE.Clock(); window.addEventListener('resize', onResize);
  setupInput(); loop();
}
function onResize(){ camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); }

// ---------- INPUT ----------
function setupInput(){
  // joystick implemented later (reuse code from your working version)
}

// We'll inject joystick handlers externally (keeps file compact)

// ---------- PHYSICS HELPERS ----------
function carBallCollision(carMesh, carForwardSpeed, carVelYEstimate=0){
  const carToBall = new THREE.Vector3().subVectors(ball.position, carMesh.position);
  const dist = carToBall.length(); const carRadius = Math.max(CAR.length,CAR.width)*0.55; const minDist = BALL_R + carRadius;
  if(dist < minDist && dist > 0.0001){
    const n = carToBall.clone().normalize(); ball.position.addScaledVector(n, (minDist - dist) + 0.02);
    const baseSpeed = Math.max(1, Math.abs(carForwardSpeed || 1));
    let impulse = n.clone().multiplyScalar(baseSpeed * 1.0 + 2.0);
    if(carMesh === player && boostActive) impulse.multiplyScalar(BOOST_MULT*0.9);
    impulse.y = Math.min(6.0, 0.9 + Math.abs(carVelYEstimate)*0.3 + baseSpeed*0.12);
    ballVel.add(impulse);
    carMesh.position.addScaledVector(n, -0.06 * Math.min(baseSpeed,6));
    if(audioEnabled && sounds.kick.src) try{ sounds.kick.currentTime=0; sounds.kick.play(); }catch(e){}
  }
}
function carCarCollision(a,b){ const v=new THREE.Vector3().subVectors(b.position,a.position); const dist=v.length(); const minDist=Math.max(CAR.width,CAR.length)*0.9; if(dist<minDist&&dist>0.0001){ const n=v.clone().normalize(); const overlap=(minDist-dist)*0.5; a.position.addScaledVector(n,-overlap); b.position.addScaledVector(n,overlap); } }

// ---------- AI ----------
function aiBehavior(dt){
  const toBall = new THREE.Vector3().subVectors(ball.position, ai.position); const dist = Math.hypot(toBall.x,toBall.z); toBall.y=0; if(dist>0.2){ toBall.normalize(); let s = 6.0 * (dist>6 ? 1 : (0.6 + 0.4*(dist/6))); ai.position.addScaledVector(toBall, s*dt); const targ = Math.atan2(toBall.x,toBall.z); const diff = ((targ-ai.rotation.y+Math.PI)%(Math.PI*2)) - Math.PI; ai.rotation.y += diff*0.06; }
  const nearVec = new THREE.Vector3().subVectors(ball.position, ai.position); const dnow = nearVec.length(); if(dnow < 1.9){ const n = nearVec.clone().normalize(); const impulse = n.clone().multiplyScalar(Math.max(2.8,6.0*1.2)); impulse.y = Math.min(4.0,1.0+Math.abs(6.0)*0.2); ballVel.add(impulse); ai.position.addScaledVector(n,-0.06); }
}

// ---------- GOALS ----------
function checkGoals(){ if(goalCooldown) return; const limit = ARENA/2 - 0.7; const goalW = ARENA*goalWidthRatio; const gx = Math.abs(ball.position.x); if(ball.position.z < -limit+0.2 && gx < goalW/2 && Math.abs(ballVel.z)>0.2){ score.B++; onGoal('B'); } else if(ball.position.z > limit-0.2 && gx < goalW/2 && Math.abs(ballVel.z)>0.2){ score.A++; onGoal('A'); } }
function onGoal(team){ goalCooldown=true; goalBanner.style.display=''; if(audioEnabled && sounds.goal.src) try{ sounds.goal.currentTime=0; sounds.goal.play(); }catch(e){} playing=false; setTimeout(()=> goalBanner.style.display='none',1200); setTimeout(()=>{ resetPositions(true); playing=true; goalCooldown=false; saveScore(); },1400); }

// ---------- RESET & HUD ----------
function resetPositions(afterGoal=false){ player.position.set(0,0.5, afterGoal ? (Math.random()>0.5?6:-6) : 0); player.rotation.set(0,0,0); playerSpeed=0; targetThrottle=0; steerInput=0; playerVelY=0; jumpCount=0; ai.position.set(0,0.5,8); ai.rotation.set(0,0,0); ball.position.set((Math.random()-0.5)*6,1.8,(Math.random()-0.5)*6 - (afterGoal? (Math.random()>0.5?-8:8) : 0)); ballVel.set(0,0,0); boostVal=BOOST_MAX; boostActive=false; hudSpeed.innerText='0'; scoreAEl.innerText = score.A; scoreBEl.innerText = score.B; }

function updateHUD(){ hudSpeed.innerText = Math.round(Math.abs(playerSpeed)*10)/10; scoreAEl.innerText = score.A; scoreBEl.innerText = score.B; }

// ---------- PERSISTENT SCORES ----------
function saveScore(){ const key='rocketball_scores_v1'; const s = JSON.parse(localStorage.getItem(key)||'{}'); s.last = score; s.history = s.history||[]; s.history.unshift({time:Date.now(),score:score}); if(s.history.length>10) s.history.pop(); localStorage.setItem(key, JSON.stringify(s)); refreshScoreTable(); }
function refreshScoreTable(){ const key='rocketball_scores_v1'; const s = JSON.parse(localStorage.getItem(key)||'{}'); const el=document.getElementById('scoresList'); el.innerHTML=''; if(s.history){ s.history.slice(0,6).forEach(h=>{ const d=new Date(h.time); const node=document.createElement('div'); node.innerText = `${d.toLocaleString()} — ${h.score.A}:${h.score.B}`; el.appendChild(node); }); } }

// ---------- SIMPLE PARTICLES (boost) ----------
function spawnBoostParticles(pos,dir){ for(let i=0;i<8;i++){ boostParticles.push({pos:pos.clone(),vel:new THREE.Vector3((Math.random()-0.5)*2 + dir.x*2, (Math.random()-0.2)*1 + dir.y, (Math.random()-0.5)*2 + dir.z*2), life:0.6}); } }
function updateParticles(dt){ for(let i=boostParticles.length-1;i>=0;i--){ const p=boostParticles[i]; p.pos.addScaledVector(p.vel,dt); p.vel.y -= 6*dt; p.life -= dt; if(p.life<=0) boostParticles.splice(i,1); else{ // render small dots via simple DOM overlay or skip heavy rendering
    }
  } }

// ---------- MAIN LOOP ----------
function loop(){ requestAnimationFrame(loop); const dt = Math.min(DT_MAX, clock.getDelta()); if(playing){ // PLAYER controls
    const target = targetThrottle * CAR.maxSpeed; if(Math.abs(target) > Math.abs(playerSpeed)){ const diff = target - playerSpeed; playerSpeed += Math.sign(diff) * CAR.accel * dt; if(Math.sign(playerSpeed) === Math.sign(target) && Math.abs(playerSpeed) > Math.abs(target)) playerSpeed = target; } else { if(target === 0){ playerSpeed *= 0.92; if(Math.abs(playerSpeed) < 0.02) playerSpeed = 0; } else { const diff = target - playerSpeed; playerSpeed += Math.sign(diff) * CAR.brake * dt; } }
    const steerFactor = (playerSpeed === 0) ? 0.9 : (0.6 + Math.abs(playerSpeed)/CAR.maxSpeed);
    const turn = steerInput * CAR.steerSpeed * steerFactor * dt; player.rotation.y += turn;
    const forward = new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y));
    let moveSpeed = playerSpeed; if(boostActive && jumpCount > 0){ playerVelY += BOOST_AIR_LIFT * dt; moveSpeed *= BOOST_MULT; }
    player.position.addScaledVector(forward, moveSpeed * dt);
    playerVelY -= 9.8 * dt; player.position.y += playerVelY * dt; if(player.position.y <= 0.5){ player.position.y = 0.5; playerVelY = 0; jumpCount = 0; }
    // BALL
    ballVel.y -= 9.8 * dt; ball.position.addScaledVector(ballVel, dt);
    if(ball.position.y < BALL_R){ ball.position.y = BALL_R; if(ballVel.y < 0) ballVel.y *= -0.42; ballVel.x *= 0.996; ballVel.z *= 0.996; }
    // COLLISIONS
    carCarCollision(player, ai); carBallCollision(player, playerSpeed, playerVelY); carBallCollision(ai, 6.0, 0);
    // WALLS
    const limit = ARENA/2 - 0.7; if(ball.position.x < -limit){ ball.position.x = -limit; ballVel.x *= -0.72; } if(ball.position.x > limit){ ball.position.x = limit; ballVel.x *= -0.72; } if(ball.position.z < -limit){ ball.position.z = -limit; ballVel.z *= -0.72; } if(ball.position.z > limit){ ball.position.z = limit; ballVel.z *= -0.72; }
    player.position.x = Math.max(-limit, Math.min(limit, player.position.x)); player.position.z = Math.max(-limit, Math.min(limit, player.position.z)); ai.position.x = Math.max(-limit, Math.min(limit, ai.position.x)); ai.position.z = Math.max(-limit, Math.min(limit, ai.position.z));
    // AI
    aiBehavior(dt);
    // boost
    if(boostActive){ boostVal -= BOOST_DRAIN * dt; if(boostVal <= 0){ boostVal = 0; stopBoost(); } } else { boostVal = Math.min(BOOST_MAX, boostVal + BOOST_RECHARGE * dt); }
    updateParticles(dt);
    updateHUD(); checkGoals(); }
  // camera
  if(cameraFollow){ const camOffset = new THREE.Vector3(0,6,12).applyAxisAngle(new THREE.Vector3(0,1,0), player.rotation.y); const camTarget = new THREE.Vector3().copy(player.position).add(camOffset); camera.position.lerp(camTarget, 0.12); camera.lookAt(new THREE.Vector3().copy(player.position).add(new THREE.Vector3(0,1.2,0))); }
  ballVel.multiplyScalar(0.999);
  renderer.render(scene,camera);
}

// ---------- UI + Input (joystick from your working code) ----------
// We'll attach the joystick behavior you validated — copy-paste exact block from your version here when you paste into the canvas editor.

// To keep this document safe and short, below we programmatically attach the joystick using same code as you tested earlier.
(function attachJoystick(){
  const joy = document.getElementById('joy'); const stick = document.getElementById('stick'); let active=false; let start={x:0,y:0}; const maxR=48;
  function joyDown(ev){ ev.preventDefault(); active=true; const p=ev.touches?ev.touches[0]:ev; const rect=joy.getBoundingClientRect(); start.x=rect.left+rect.width/2; start.y=rect.top+rect.height/2; moveStick(p.clientX,p.clientY); }
  function joyMove(ev){ if(!active) return; ev.preventDefault(); const p=ev.touches?ev.touches[0]:ev; moveStick(p.clientX,p.clientY); }
  function joyUp(ev){ active=false; stick.style.transform='translate(0px,0px)'; targetThrottle=0; steerInput=0; }
  function moveStick(cx,cy){ const dx=cx-start.x, dy=cy-start.y; const nx=Math.max(-1,Math.min(1,dx/maxR)), ny=Math.max(-1,Math.min(1,dy/maxR)); stick.style.transform = `translate(${nx*maxR}px, ${ny*maxR}px)`; targetThrottle = -ny; steerInput = nx; }
  joy.addEventListener('pointerdown',joyDown,{passive:false}); joy.addEventListener('pointermove',joyMove,{passive:false}); window.addEventListener('pointerup',joyUp);
  joy.addEventListener('touchstart',joyDown,{passive:false}); joy.addEventListener('touchmove',joyMove,{passive:false}); window.addEventListener('touchend',joyUp);
})();

// keyboard
const key = {}; window.addEventListener('keydown',(e)=>{ key[e.code]=true; if(e.code==='Space') tryJump(); if(e.code==='ShiftLeft' || e.code==='KeyQ') tryBoost(); }); window.addEventListener('keyup',(e)=>{ key[e.code]=false; if(e.code==='ShiftLeft' || e.code==='KeyQ') stopBoost(); }); setInterval(()=>{ if(key['KeyW']||key['ArrowUp']) targetThrottle=1; else if(key['KeyS']||key['ArrowDown']) targetThrottle=-1; else targetThrottle = targetThrottle*0.95; if(key['KeyA']||key['ArrowLeft']) steerInput=-1; else if(key['KeyD']||key['ArrowRight']) steerInput=1; else steerInput = steerInput*0.6; },30);

// UI buttons
document.getElementById('boostBtn').addEventListener('click', ()=>{ tryBoost(); }); document.getElementById('boostBtn').addEventListener('touchstart',(e)=>{ e.preventDefault(); tryBoost(); },{passive:false}); document.getElementById('boostBtn').addEventListener('touchend',(e)=>{ e.preventDefault(); stopBoost(); },{passive:false}); document.getElementById('jumpBtn').addEventListener('click', tryJump); document.getElementById('jumpBtn').addEventListener('touchstart',(e)=>{ e.preventDefault(); tryJump(); },{passive:false}); document.getElementById('cameraBtn').addEventListener('click', ()=>{ cameraFollow = !cameraFollow; document.getElementById('cameraBtn').innerText = cameraFollow ? 'Kamera: Follow' : 'Kamera: Free'; }); document.getElementById('startBtn').addEventListener('click', ()=>{ playing=true; resetPositions(false); document.getElementById('startBtn').innerText='Reset'; }); document.getElementById('playBtn').addEventListener('click', ()=>{ document.getElementById('menu').style.display='none'; playing=true; resetPositions(false); });

// jump & boost
function tryJump(){ if(!playing) return; if(jumpCount < MAX_JUMPS){ playerVelY = JUMP_V; jumpCount++; isJumping=false; } }
function tryBoost(){ if(!playing) return; if(boostVal>18 && !boostActive){ boostActive=true; boostVal -= 0.0001; document.getElementById('boostBtn').classList.add('active'); if(audioEnabled && sounds.boost.src) try{ sounds.boost.currentTime=0; sounds.boost.play(); }catch(e){} spawnBoostParticles(player.position,new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y))); setTimeout(()=>{ if(boostActive) stopBoost(); }, 900); } }
function stopBoost(){ boostActive=false; document.getElementById('boostBtn').classList.remove('active'); }

// save/load scores on init
function loadScores(){ refreshScoreTable(); }

// ---------- START ----------
init(); resetPositions(false); loadScores();
</script>
</body>
</html>
