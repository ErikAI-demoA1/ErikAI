<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>RocketBall — ErikAI Edition</title>
<style>
  html,body{height:100%;margin:0;background:#061426;font-family:Inter,Arial;color:#fff;overflow:hidden}
  canvas{display:block}
  #hud,#mini,.note{position:fixed;z-index:40;padding:8px 12px;border-radius:10px;backdrop-filter:blur(6px)}
  #hud{top:12px;left:12px;background:rgba(0,0,0,.4);font-weight:600}
  #mini{top:12px;right:12px;background:rgba(0,0,0,.2)}
  .note{top:60px;left:12px;font-size:13px;color:#9fb2d1}
  .goal-banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);
    background:rgba(255,120,60,.94);padding:20px 30px;border-radius:12px;font-size:36px;
    font-weight:800;display:none;z-index:60;box-shadow:0 12px 40px rgba(255,120,60,.2)}
  #ui{position:fixed;left:12px;bottom:12px;display:flex;gap:10px;z-index:50}
  .joystick{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.03);
    display:flex;align-items:center;justify-content:center;touch-action:none;pointer-events:auto}
  .stick{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.12)}
  #controlsRight{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:10px;z-index:50}
  .btn{padding:10px 16px;border:0;border-radius:10px;font-weight:700;color:#fff;cursor:pointer;pointer-events:auto}
  .btn.main{background:#1db954}
  .btn.ghost{background:rgba(255,255,255,.06)}
  .btn.jump{background:#ffae00}
  #startBtn{position:fixed;right:12px;top:12px;padding:10px 16px;border:0;border-radius:10px;
    background:#ff4b4b;color:#fff;font-weight:800;z-index:50}
</style>
</head>
<body>

<button id="startBtn">Spusti / Reset</button>
<div id="hud">Skóre — A: <span id="scoreA">0</span> • B: <span id="scoreB">0</span> • Rýchlosť: <span id="speed">0</span></div>
<div id="mini">Aréna: <span id="arenaSize">200</span> m</div>
<div class="note">RocketBall — s AI, skokom a opravami ovládania</div>
<div class="goal-banner" id="goalBanner">GOAL!</div>

<div id="ui">
  <div id="joy" class="joystick"><div id="stick" class="stick"></div></div>
</div>

<div id="controlsRight">
  <button id="jumpBtn" class="btn jump">SKOK</button>
  <button id="boostBtn" class="btn main">BOOST</button>
  <button id="cameraBtn" class="btn ghost">Kamera: Follow</button>
</div>

<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
<script>
let scene,camera,renderer,car,aiCar,ball,ground,clock;
let playing=false;
let arena=200;document.getElementById("arenaSize").innerText=arena;
let carSpeed=0,targetSpeed=0;
let moveDir=new THREE.Vector3(0,0,1);
let maxSpeed=10,accel=35,brake=40;
let boost={val:100,max:100,active:false};
let ballVel=new THREE.Vector3(0,0,0);
let score={A:0,B:0};
const gravity=9.8;
let playerVelY=0,jumpCount=0,maxJumps=2;
const jumpForce=6;
const aiSpeed=4.5;
let cameraFollow=true;
const scoreAEl=document.getElementById("scoreA"),scoreBEl=document.getElementById("scoreB"),hudSpeed=document.getElementById("speed");
const goalBanner=document.getElementById("goalBanner");
const goalWidthRatio=0.36,goalDepth=2.5;
let halfArena;

function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x061426);
  camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,0.1,2000);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  document.body.appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xffffff,0x223,0.9));
  const dir=new THREE.DirectionalLight(0xffffff,0.6);dir.position.set(8,20,10);scene.add(dir);

  const mat=new THREE.MeshStandardMaterial({color:0x0f3b46});
  ground=new THREE.Mesh(new THREE.PlaneGeometry(arena,arena),mat);
  ground.rotation.x=-Math.PI/2;scene.add(ground);

  const carMat=new THREE.MeshStandardMaterial({color:0xff6b6b});
  car=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.6,2.6),carMat);
  car.position.y=0.5;scene.add(car);

  const aiMat=new THREE.MeshStandardMaterial({color:0x6b8bff});
  aiCar=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.6,2.6),aiMat);
  aiCar.position.set(0,0.5,8);scene.add(aiCar);

  const ballMat=new THREE.MeshStandardMaterial({color:0xfff08a});
  ball=new THREE.Mesh(new THREE.SphereGeometry(0.95,32,32),ballMat);
  ball.position.set(3,1.5,-4);scene.add(ball);

  halfArena=arena/2;
  camera.position.set(0,6,12);
  camera.lookAt(car.position);
  clock=new THREE.Clock();
  window.addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
  animate();
}

function handleCarBallCollision(carMesh,speed){
  const carToBall=new THREE.Vector3().subVectors(ball.position,carMesh.position);
  const dist=carToBall.length();
  const minDist=2.1;
  if(dist<minDist&&dist>0.0001){
    const n=carToBall.clone().normalize();
    ball.position.addScaledVector(n,(minDist-dist)+0.01);
    const impulse=n.clone().multiplyScalar(speed*0.8+1.0);
    impulse.y+=0.8;
    ballVel.add(impulse);
  }
}

function handleCarCarCollision(a,b){
  const v=new THREE.Vector3().subVectors(b.position,a.position);
  const dist=v.length(),minDist=1.7;
  if(dist<minDist&&dist>0.0001){
    const n=v.normalize(),overlap=(minDist-dist)*0.5;
    a.position.addScaledVector(n,-overlap);
    b.position.addScaledVector(n,overlap);
  }
}

function resetPositions(){
  car.position.set(0,0.5,0);carSpeed=0;targetSpeed=0;jumpCount=0;
  aiCar.position.set(0,0.5,8);
  ball.position.set(0,1.5,0);ballVel.set(0,0,0);
}

function updateHUD(){
  hudSpeed.innerText=Math.round(Math.abs(carSpeed)*10)/10;
  scoreAEl.innerText=score.A;scoreBEl.innerText=score.B;
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(0.05,clock.getDelta());
  if(playing){
    if(targetSpeed>carSpeed){carSpeed+=accel*dt;if(carSpeed>targetSpeed)carSpeed=targetSpeed;}
    else{carSpeed-=brake*dt;if(carSpeed<targetSpeed)carSpeed=targetSpeed;}
    if(moveDir.lengthSq()>0.0001){
      const desiredRot=Math.atan2(moveDir.x,moveDir.z);
      const diff=((desiredRot-car.rotation.y+Math.PI)%(Math.PI*2))-Math.PI;
      car.rotation.y+=diff*Math.min(1,dt*8);
      const effective=carSpeed*(boost.active?2.4:1);
      car.position.addScaledVector(moveDir,effective*dt);
    }else carSpeed*=1-2*dt;

    // jump
    playerVelY-=gravity*dt;
    car.position.y+=playerVelY*dt;
    if(car.position.y<=0.5){car.position.y=0.5;playerVelY=0;jumpCount=0;}

    // ball
    ballVel.y-=gravity*dt;
    ball.position.addScaledVector(ballVel,dt);
    if(ball.position.y<0.95){ball.position.y=0.95;ballVel.y*=-0.45;ballVel.multiplyScalar(0.992);}

    handleCarCarCollision(car,aiCar);
    handleCarBallCollision(car,Math.abs(carSpeed));
    handleCarBallCollision(aiCar,aiSpeed);

    // AI
    const toBall=new THREE.Vector3().subVectors(ball.position,aiCar.position);toBall.y=0;
    const dist=toBall.length();
    if(dist>0.3){toBall.normalize();aiCar.position.addScaledVector(toBall,aiSpeed*dt);}
    if(aiCar.position.y>0.5)aiCar.position.y=Math.max(0.5,aiCar.position.y-3*dt);

    updateHUD();
  }

  if(cameraFollow){
    const off=new THREE.Vector3(0,5,10).applyAxisAngle(new THREE.Vector3(0,1,0),car.rotation.y);
    const target=new THREE.Vector3().copy(car.position).add(off);
    camera.position.lerp(target,0.15);
    camera.lookAt(car.position.clone().add(new THREE.Vector3(0,1,0)));
  }
  renderer.render(scene,camera);
}

/* --- joystick --- */
const joy=document.getElementById("joy"),stick=document.getElementById("stick");
let active=false,start={x:0,y:0},maxR=45;
function joyCenter(){const r=joy.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
function moveStick(cx,cy){
  const dx=cx-start.x,dy=cy-start.y;
  const nx=Math.max(-1,Math.min(1,dx/maxR)),ny=Math.max(-1,Math.min(1,dy/maxR));
  stick.style.transform=`translate(${nx*maxR}px,${ny*maxR}px)`;
  const v=new THREE.Vector3(nx,0,-ny);
  if(v.lengthSq()<0.001){targetSpeed=0;return;}
  v.normalize();moveDir.copy(v);
  targetSpeed=Math.min(maxSpeed,Math.sqrt(nx*nx+ny*ny)*maxSpeed);
}
joy.addEventListener("pointerdown",e=>{e.preventDefault();active=true;const p=e.touches?e.touches[0]:e;start=joyCenter();moveStick(p.clientX,p.clientY)});
joy.addEventListener("pointermove",e=>{if(!active)return;const p=e.touches?e.touches[0]:e;moveStick(p.clientX,p.clientY)});
window.addEventListener("pointerup",()=>{active=false;stick.style.transform="translate(0,0)";targetSpeed=0});
joy.addEventListener("touchstart",e=>e.preventDefault());

/* --- boost --- */
document.getElementById("boostBtn").onclick=()=>{if(playing&&!boost.active){boost.active=true;setTimeout(()=>boost.active=false,1000);}};

/* --- jump --- */
function doJump(){if(jumpCount<maxJumps){playerVelY=jumpForce;jumpCount++;}}
document.getElementById("jumpBtn").onclick=doJump;
window.addEventListener("keydown",e=>{if(e.code==="Space")doJump();});

/* --- camera toggle --- */
document.getElementById("cameraBtn").onclick=()=>{cameraFollow=!cameraFollow;document.getElementById("cameraBtn").innerText=cameraFollow?"Kamera: Follow":"Kamera: Free";};

/* --- start/reset --- */
document.getElementById("startBtn").onclick=()=>{playing=true;resetPositions();};

init();
resetPositions();
animate();
</script>
</body>
  </html>
