<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RocketBall — Full Game ErikAI</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#061426;color:#fff;overflow:hidden;}
canvas{display:block;}
#hud,#mini,.note,#goalBanner,#ui,#controlsRight,#startBtn{position:fixed;z-index:50;}
#hud{left:12px;top:12px;padding:10px 14px;background:rgba(0,0,0,0.35);border-radius:10px;}
#mini{right:12px;top:12px;padding:8px 12px;background:rgba(0,0,0,0.18);border-radius:8px;}
.note{left:12px;top:60px;color:#9fb2d1;font-size:13px;}
.goal-banner{left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(255,120,60,0.92);padding:22px 28px;border-radius:12px;font-size:36px;font-weight:700;color:#fff;text-align:center;display:none;}
#ui{left:12px;bottom:12px;display:flex;gap:10px;pointer-events:none;}
.joystick{width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,0.03);display:flex;align-items:center;justify-content:center;pointer-events:auto;}
.stick{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.12);}
#controlsRight{right:12px;bottom:12px;display:flex;flex-direction:column;gap:12px;pointer-events:none;}
.btn{padding:10px 16px;border-radius:10px;border:none;background:#1db954;color:#fff;font-weight:600;cursor:pointer;pointer-events:auto;}
.btn:hover{background:#1ed760;}
.btn.ghost{background:rgba(255,255,255,0.06);}
#startBtn{top:12px;right:12px;padding:10px 18px;background:#ff4b4b;color:#fff;border-radius:10px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>

<button id="startBtn">Spusti / Reset</button>
<div id="hud">Skóre — A: <span id="scoreA">0</span> • B: <span id="scoreB">0</span> • Rýchlosť: <span id="speed">0</span></div>
<div id="mini">Aréna: <span id="arenaSize">160</span> m</div>
<div class="note">RocketBall — double jump, boost, AI, joystick/WASD</div>
<div class="goal-banner" id="goalBanner">GOAL!</div>

<div id="ui">
  <div id="joy" class="joystick" aria-label="Joystick">
    <div id="stick" class="stick"></div>
  </div>
</div>
<div id="controlsRight">
  <button id="boostBtn" class="btn">BOOST</button>
  <button id="cameraBtn" class="btn ghost">Kamera: Follow</button>
</div>

<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
<script>
/* --- Variables --- */
let scene,camera,renderer,clock;
let player,ai,ball,ground;
let playing=false;
let playerSpeed=0,targetThrottle=0,steerInput=0,playerVelY=0,jumpCount=0;
let boostVal=100,boostActive=false;
let score={A:0,B:0};
const HUD_speed=document.getElementById('speed');
const scoreA=document.getElementById('scoreA'),scoreB=document.getElementById('scoreB');
const goalBanner=document.getElementById('goalBanner');
const ARENA=160;

/* --- Init Scene --- */
function init(){
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x061426);
  camera=new THREE.PerspectiveCamera(66,window.innerWidth/window.innerHeight,0.1,4000);
  camera.position.set(0,7,14);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  document.body.appendChild(renderer.domElement);

  const hemi=new THREE.HemisphereLight(0xffffff,0x222a3a,1.0); scene.add(hemi);
  const dir=new THREE.DirectionalLight(0xffffff,0.6); dir.position.set(8,20,10); scene.add(dir);

  const groundMat=new THREE.MeshStandardMaterial({color:0x0f3b46,roughness:0.95});
  ground=new THREE.Mesh(new THREE.PlaneGeometry(ARENA,ARENA),groundMat); ground.rotation.x=-Math.PI/2; scene.add(ground);

  const carMat=new THREE.MeshStandardMaterial({color:0xff6b6b,roughness:0.25});
  player=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.6,2.6),carMat); player.position.set(0,0.5,0); scene.add(player);

  const aiMat=new THREE.MeshStandardMaterial({color:0x6b8bff,roughness:0.25});
  ai=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.6,2.6),aiMat); ai.position.set(0,0.5,8); scene.add(ai);

  const ballMat=new THREE.MeshStandardMaterial({color:0xfff08a,roughness:0.5});
  ball=new THREE.Mesh(new THREE.SphereGeometry(0.95,32,32),ballMat); ball.position.set(4,1.8,-4); scene.add(ball);

  clock=new THREE.Clock();
  window.addEventListener('resize',onResize);
}

/* --- Resize --- */
function onResize(){ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); }

/* --- Reset --- */
function resetPositions(afterGoal=false){
  player.position.set(0,0.5,afterGoal?(Math.random()>0.5?6:-6):0);
  player.rotation.set(0,0,0); playerSpeed=0; targetThrottle=0; steerInput=0;
  playerVelY=0; jumpCount=0; boostVal=100; boostActive=false;
  ai.position.set(0,0.5,8); ai.rotation.set(0,0,0);
  ball.position.set((Math.random()-0.5)*6,1.8,(Math.random()-0.5)*6-(afterGoal?(Math.random()>0.5?-8:8):0));
  ball.userData.vel=new THREE.Vector3(0,0,0);
}

/* --- Input --- */
let joy=document.getElementById('joy'),stick=document.getElementById('stick'),active=false,center={x:0,y:0},maxR=48;
function joyDown(e){ e.preventDefault(); active=true; const p=e.touches?e.touches[0]:e; const r=joy.getBoundingClientRect(); center.x=r.left+r.width/2; center.y=r.top+r.height/2; moveStick(p.clientX,p.clientY);}
function joyMove(e){ if(!active) return; e.preventDefault(); const p=e.touches?e.touches[0]:e; moveStick(p.clientX,p.clientY);}
function joyUp(e){ active=false; stick.style.transform='translate(0,0)'; targetThrottle=0; steerInput=0;}
function moveStick(cx,cy){ const dx=cx-center.x,dy=cy-center.y; const nx=Math.max(-1,Math.min(1,dx/maxR)),ny=Math.max(-1,Math.min(1,dy/maxR)); stick.style.transform=`translate(${nx*maxR}px,${ny*maxR}px)`; targetThrottle=-ny; steerInput=nx;}
joy.addEventListener('pointerdown',joyDown,{passive:false}); joy.addEventListener('pointermove',joyMove,{passive:false}); window.addEventListener('pointerup',joyUp);

/* --- Keyboard --- */
const keys={};
window.addEventListener('keydown',e=>{ keys[e.code]=true; if(e.code==='Space')tryJump(); if(e.code==='ShiftLeft'||e.code==='KeyQ')tryBoost();});
window.addEventListener('keyup',e=>{ keys[e.code]=false; if(e.code==='ShiftLeft'||e.code==='KeyQ')stopBoost();});
setInterval(()=>{
  if(keys['KeyW']||keys['ArrowUp']) targetThrottle=1; else if(keys['KeyS']||keys['ArrowDown']) targetThrottle=-1; else if(!active) targetThrottle=0;
  if(keys['KeyA']||keys['ArrowLeft']) steerInput=-1; else if(keys['KeyD']||keys['ArrowRight']) steerInput=1; else if(!active) steerInput=0;
},30);

/* --- Jump / Boost --- */
const MAX_JUMPS=2,JUMP_V=7.6;
function tryJump(){ if(jumpCount<MAX_JUMPS){ playerVelY=JUMP_V; jumpCount++; }}
function tryBoost(){ if(boostVal>18&&!boostActive){ boostActive=true; boostVal-=0.01; document.getElementById('boostBtn').classList.add('active'); setTimeout(()=>stopBoost(),900);}}
function stopBoost(){ boostActive=false; document.getElementById('boostBtn').classList.remove('active');}

/* --- Start/Reset button --- */
document.getElementById('startBtn').addEventListener('click',()=>{ playing=true; resetPositions(false); document.getElementById('startBtn').innerText='Reset';});

/* --- Camera --- */
let cameraFollow=true;
document.getElementById('cameraBtn').addEventListener('click',()=>{ cameraFollow=!cameraFollow; document.getElementById('cameraBtn').innerText=cameraFollow?'Kamera: Follow':'Kamera: Free';});

/* --- Loop --- */
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,clock.getDelta());
  if(playing){
    // --- Car movement ---
    const maxSpeed=16;
    if(Math.abs(targetThrottle*maxSpeed-playerSpeed)<0.01) playerSpeed=targetThrottle*maxSpeed;
    else playerSpeed+=(targetThrottle*maxSpeed-playerSpeed)*dt*4;
    const turn=steerInput*2*dt; player.rotation.y+=turn;
    const forward=new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y));
    let speedEffective=playerSpeed; if(boostActive) speedEffective*=1.8;
    player.position.addScaledVector(forward,speedEffective*dt);
    // --- vertical ---
    playerVelY-=9.8*dt; player.position.y+=playerVelY*dt; if(player.position.y<0.5){ player.position.y=0.5; playerVelY=0; jumpCount=0;}
    // --- ball physics ---
    ball.userData.vel.y-=9.8*dt; ball.position.addScaledVector(ball.userData.vel,dt);
    if(ball.position.y<0.95){ ball.position.y=0.95; if(ball.userData.vel.y<0) ball.userData.vel.y*=-0.42; ball.userData.vel.x*=0.996; ball.userData.vel.z*=0.996;}
    // --- car-ball collision ---
    const carToBall=new THREE.Vector3().subVectors(ball.position,player.position);
    const dist=carToBall.length(); const minDist=1.42+0.95;
    if(dist<minDist){ const n=carToBall.clone().normalize(); ball.position.addScaledVector(n,(minDist-dist)+0.02); const impulse=n.clone().multiplyScalar(Math.max(1,playerSpeed)*(boostActive?1.8:1.0)+2); impulse.y=Math.min(6,0.9+Math.abs(playerVelY)*0.3); ball.userData.vel.add(impulse);}
    // --- bounds ---
    const half=ARENA/2-0.7; ball.position.x=Math.max(-half,Math.min(half,ball.position.x)); ball.position.z=Math.max(-half,Math.min(half,ball.position.z));
    player.position.x=Math.max(-half,Math.min(half,player.position.x)); player.position.z=Math.max(-half,Math.min(half,player.position.z));
    // --- camera ---
    if(cameraFollow){ const camOffset=new THREE.Vector3(0,6,12).applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y); const camTarget=new THREE.Vector3().copy(player.position).add(camOffset); camera.position.lerp(camTarget,0.12); camera.lookAt(new THREE.Vector3().copy(player.position).add(new THREE.Vector3(0,1.2,0)));}
    HUD_speed.innerText=Math.round(Math.abs(playerSpeed)*10)/10;
    checkGoal();
  }
  renderer.render(scene,camera);
}

/* --- Goal check --- */
let goalCooldown=false;
function checkGoal(){
  if(goalCooldown) return;
  const half=ARENA/2-0.7,goalW=ARENA*0.36; const gx=Math.abs(ball.position.x);
  if(ball.position.z<-half+0.2 && gx<goalW/2 && Math.abs(ball.userData.vel.z)>0.2){ score.B++; scoreB.innerText=score.B; showGoal(); }
  else if(ball.position.z>half-0.2 && gx<goalW/2 && Math.abs(ball.userData.vel.z)>0.2){ score.A++; scoreA.innerText=score.A; showGoal(); }
}
function showGoal(){ goalCooldown=true; goalBanner.style.display=''; setTimeout(()=>goalBanner.style.display='none',1200); playing=false; setTimeout(()=>{ resetPositions(true); playing=true; goalCooldown=false; },1400);}

/* --- Init --- */
init(); resetPositions(false); loop();
</script>
</body>
</html>
