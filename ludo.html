<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ErikAI Ultra Arena — Battle režim (10k hráčov)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#061426; --card:#071228; --accent1:#06b6d4; --accent2:#8b5cf6; --text:#e6eef8;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:Inter,system-ui,Arial;
    background:linear-gradient(160deg,var(--bg),#041426 120%);
    color:var(--text); padding:18px; text-align:center; min-height:100vh;
  }
  h1{color:var(--accent1); margin-bottom:5px;}
  .panel{
    background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.01));
    border:1px solid rgba(255,255,255,0.05); padding:14px; border-radius:12px;
    max-width:800px; margin:0 auto 14px auto; box-shadow:0 8px 26px rgba(0,0,0,0.5);
  }
  input, select, button{
    padding:8px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.1);
    background:rgba(0,0,0,0.3); color:var(--text); font-size:14px; margin:4px;
  }
  button{
    background:linear-gradient(90deg,var(--accent2),var(--accent1)); color:#041021; font-weight:700; cursor:pointer; border:none;
  }
  button:hover{opacity:0.9}
  
  /* HERNÁ PLOCHA */
  .board-container{
    width:100%; max-width:900px; height:500px; margin:0 auto; overflow:auto;
    border:2px solid rgba(255,255,255,0.1); border-radius:10px; background:#040e1a; position:relative;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(100, 32px);
    grid-template-rows: repeat(100, 32px);
    width: fit-content;
    margin: 0 auto;
  }
  .cell {
    width: 32px; height: 32px; border: 1px solid rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .triangle {
    width: 0; height: 0;
    border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 16px solid red;
    position: relative;
  }
  .triangle::after {
    content: attr(data-number);
    position: absolute; top: -16px; left: -6px;
    font-size: 9px; font-weight: bold; color: #fff;
    text-shadow: 0 0 2px #000;
  }
  
  /* AKTÍVNY HRÁČ - SVETELNÝ EFEKT */
  .active-player-box {
    display: inline-block; padding: 8px 16px; border-radius: 8px; margin: 8px 0;
    font-weight: bold; font-size: 16px; background: rgba(255,255,255,0.05);
    border: 2px dashed var(--accent1); transition: all 0.3s ease;
  }
  .player-info { margin-top: 8px; font-size: 14px; color: #9fb2d1; }
  footer { font-size: 11px; color: #667c99; margin-top: 20px; }
  body.dark-mode { background: #0b0f19; color: #fff; }
</style>
</head>
<body>

  <h1>ErikAI Ultra Arena — Battle režim</h1>
  <p id="cas" style="font-size: 14px; color:#9fb2d1;"></p>

  <div class="panel">
    <div>
      <label>Počet hráčov (1 – 10 000):</label>
      <input type="number" id="playerCountInput" min="1" max="10000" value="100" style="width:100px;">
      <button onclick="initGame()">🔄 Spustiť / Nastaviť hru</button>
      <button onclick="rollDice()">Hod kockou 🎲</button>
    </div>
    
    <div id="activeIndicator" class="active-player-box">Pripravený na hru</div>
    <div class="player-info" id="info">Zadaj počet hráčov a klikni na Spustiť hru.</div>
  </div>

  <div class="board-container">
    <div class="board" id="board"></div>
  </div>

  <footer>
    This work is licensed under the Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International License. © 2025 Erik Mohylák – All rights reserved.
  </footer>

  <script>
    // Hodiny v reálnom čase
    function aktualizujCas() {
      const teraz = new Date();
      document.getElementById('cas').innerText = `🕓 Aktuálny čas: ${teraz.toLocaleDateString('sk-SK', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
    }
    setInterval(aktualizujCas, 1000);
    aktualizujCas();

    const board = document.getElementById("board");
    const info = document.getElementById("info");
    const activeIndicator = document.getElementById("activeIndicator");
    
    let currentPlayer = 0;
    let diceRoll = 0;
    let players = [];
    const GRID_SIZE = 100; // 100x100 = 10 000 políčok pre max výkon a prehľadnosť
    const TOTAL_CELLS = GRID_SIZE * GRID_SIZE;

    // Generovanie mriežky 100x100 (10 000 políčok)
    function createBoard() {
      board.innerHTML = "";
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.dataset.x = x;
          cell.dataset.y = y;
          cell.addEventListener("click", () => cellClicked(cell));
          board.appendChild(cell);
        }
      }
    }

    // Generovanie náhodných pestrých farieb pre 10k hráčov
    function getRandomColor(index) {
      const hue = (index * 137.5) % 360; // Zlatý rez pre optimálne rozlíšenie farieb
      return `hsl(${hue}, 80%, 60%)`;
    }

    function initGame() {
      const countInput = parseInt(document.getElementById("playerCountInput").value) || 10;
      const count = Math.max(1, Math.min(10000, countInput));
      
      createBoard();
      players = [];
      currentPlayer = 0;
      diceRoll = 0;

      const usedPositions = new Set();
      for (let i = 0; i < count; i++) {
        const color = getRandomColor(i);
        let pos;
        do {
          pos = Math.floor(Math.random() * TOTAL_CELLS);
        } while (usedPositions.has(pos));
        usedPositions.add(pos);

        players.push({ id: i + 1, color: color, pos: pos });
      }

      renderPlayers();
      updateActiveVisual();
      info.innerText = `Hra pripravená pre ${count} hráčov. Na rade je Hráč 1. Klikni „Hod kockou 🎲“.`;
    }

    function renderPlayers() {
      // Vyčistenie buniek
      board.querySelectorAll(".cell").forEach(c => c.innerHTML = "");
      // Vykreslenie hráčov na pozíciách
      players.forEach((p, idx) => {
        if (p.pos !== -1 && p.pos < board.children.length) {
          const cell = board.children[p.pos];
          const fig = document.createElement("div");
          fig.className = "triangle";
          fig.style.borderBottomColor = p.color;
          fig.dataset.player = idx;
          fig.dataset.number = p.id;
          cell.appendChild(fig);
        }
      });
    }

    function updateActiveVisual() {
      if (players.length === 0) return;
      const activeP = players[currentPlayer];
      activeIndicator.innerText = `🎮 Na rade: Hráč ${activeP.id}`;
      activeIndicator.style.borderColor = activeP.color;
      activeIndicator.style.boxShadow = `0 0 15px ${activeP.color}`;
    }

    function rollDice() {
      if (players.length === 0) {
        initGame();
        return;
      }
      if (players[currentPlayer].pos === -1) {
        nextTurn();
        return;
      }

      diceRoll = Math.floor(Math.random() * 6) + 1;
      const activeP = players[currentPlayer];
      info.innerText = `Hráč ${activeP.id} hodil číslo: ${diceRoll}. Vyber cieľové políčko v dosahu ${diceRoll} krokov (manhattan).`;
    }

    function cellClicked(cell) {
      if (!diceRoll) {
        info.innerText = "Najprv musíš hodiť kockou!";
        return;
      }

      const activeP = players[currentPlayer];
      if (activeP.pos === -1) return;

      const currentCell = board.children[activeP.pos];
      const targetIndex = Array.from(board.children).indexOf(cell);
      
      const cx = parseInt(currentCell.dataset.x);
      const cy = parseInt(currentCell.dataset.y);
      const tx = parseInt(cell.dataset.x);
      const ty = parseInt(cell.dataset.y);
      
      const distance = Math.abs(tx - cx) + Math.abs(ty - cy);

      if (distance !== diceRoll) {
        info.innerText = `Neplatný pohyb! Musíš prejsť presne o ${diceRoll} políčok (aktuálna vzdialenosť je ${distance}).`;
        return;
      }

      // Kontrola, či na cieľovom políčku niekto nestojí (eliminácia)
      const targetPlayerIdx = players.findIndex(p => p.pos === targetIndex);
      if (targetPlayerIdx !== -1) {
        if (targetPlayerIdx === currentPlayer) {
          info.innerText = "Nemôžeš vstúpiť na vlastnú figúrku!";
          return;
        } else {
          // Vyradenie súpera
          players[targetPlayerIdx].pos = -1;
          info.innerText = `⚠️ Hráč ${activeP.id} vyradil hráča ${players[targetPlayerIdx].id}!`;
        }
      }

      activeP.pos = targetIndex;
      diceRoll = 0;
      renderPlayers();
      nextTurn();
    }

    function nextTurn() {
      if (players.length === 0) return;
      currentPlayer = (currentPlayer + 1) % players.length;
      updateActiveVisual();
      const activeP = players[currentPlayer];
      info.innerText = `Na rade je Hráč ${activeP.id}. Klikni „Hod kockou 🎲“.`;
    }

    // Inicializácia pri štarte na 100 hráčov ako predvolená vzorka
    initGame();
  </script>

<script>

  // ERIKAI OS — UNIVERZÁLNY BEZPEČNOSTNÝ STRÁŽCA

  const povolenyHostitel = "erikai-demoa1.github.io";
  const jeOvereny = sessionStorage.getItem('erikai_auth_token') === 'VERIFIED_OK';

    window.location.href = "https://erikai-demoa1.github.io/ErikAI/";
  }
</script>

</body>
</html>
