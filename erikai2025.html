<!DOCTYPE html><html lang="sk">
<head>
<meta charset="UTF-8" />
<title>ErikAI OS — Premium Countdown</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at center, #020617, #000);
        color: white;
        font-family: 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }/* ANIMOVANÉ POZADIE */
.bg-glow {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    filter: blur(120px);
    background: #0ea5e9;
    animation: pulse 6s infinite alternate;
    opacity: 0.35;
}

@keyframes pulse {
    0% { transform: scale(1); opacity: 0.2; }
    100% { transform: scale(1.4); opacity: 0.45; }
}

/* HLAVNÝ OBSAH */
#year {
    font-size: 70px;
    font-weight: 900;
    letter-spacing: 3px;
    margin-bottom: 20px;
    text-shadow: 0 0 25px #0ea5e9;
    animation: fadeIn 1.2s ease;
}

#countdown {
    font-size: 32px;
    margin-bottom: 25px;
    animation: fadeIn 1.8s ease;
}

#clock {
    font-size: 24px;
    margin-bottom: 25px;
    opacity: 0.85;
    animation: fadeIn 2s ease;
}

/* NAVIGAČNÉ TLAČIDLÁ */
.nav {
    font-size: 38px;
    cursor: pointer;
    user-select: none;
    margin: 10px;
    padding: 12px 25px;
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.25);
    transition: 0.25s;
    backdrop-filter: blur(6px);
}
.nav:hover {
    background: #0ea5e9;
    color: black;
    box-shadow: 0 0 25px #0ea5e9;
    transform: translateY(-3px);
}

#msg {
    margin-top: 20px;
    font-size: 20px;
    opacity: 0.7;
    animation: fadeIn 2.2s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

</style>
</head>
<body><div class="bg-glow"></div><div id="year"></div>
<div id="countdown"></div>
<div id="clock"></div><div style="display:flex; gap: 35px; z-index: 5;">
    <div class="nav" onclick="changeYear(-1)">⟵ MINULOSŤ</div>
    <div class="nav" onclick="changeYear(1)">BUDÚCNOSŤ ⟶</div>
</div><div id="msg"></div><script>
let currentYear = new Date().getFullYear();

// EXKLUZÍVNY ZVUK (jemný futuristický pulz)
const audio = new Audio("data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAA...");
audio.loop = true;
audio.volume = 0.25;
audio.play().catch(()=>{});

function updateDisplay() {
    const now = new Date();
    const target = new Date(currentYear, 0, 1, 0, 0, 0);

    document.getElementById("year").textContent = "Rok: " + currentYear;

    // realtime hodiny
    document.getElementById("clock").textContent =
        now.toLocaleTimeString("sk-SK", { hour: "2-digit", minute:"2-digit", second:"2-digit" });

    const diff = target - now;

    if (diff > 0) {
        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const m = Math.floor((diff / (1000 * 60)) % 60);
        const s = Math.floor((diff / 1000) % 60);

        document.getElementById("countdown").textContent =
            `${d} dní • ${h} hod • ${m} min • ${s} sek`;

        document.getElementById("msg").textContent =
            "Brzo sa dočkáš — ErikAI OS Premium • by Erik Mohylák";
    }
    else {
        document.getElementById("countdown").textContent =
            "Už nastal koniec roka";

        document.getElementById("msg").textContent =
            "ErikAI OS pokračuje ďalej v prémiovom režime";
    }
}

function changeYear(direction) {
    currentYear += direction;
    updateDisplay();
}

setInterval(updateDisplay, 1000);
updateDisplay();
</script></body>
    </html>
