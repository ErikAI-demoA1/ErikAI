<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8" />
<title>ErikAI Countdown</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: black;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        overflow: hidden;
    }
    #year {
        font-size: 60px;
        font-weight: bold;
        margin-bottom: 15px;
    }
    #countdown {
        font-size: 30px;
        margin-bottom: 25px;
    }
    .nav {
        font-size: 40px;
        cursor: pointer;
        user-select: none;
        margin: 10px;
        padding: 10px;
        border: 2px solid white;
        border-radius: 10px;
        transition: 0.2s;
    }
    .nav:hover {
        background: white;
        color: black;
    }
    #msg {
        margin-top: 20px;
        font-size: 18px;
        opacity: 0.6;
    }
</style>
</head>
<body>

<div id="year"></div>
<div id="countdown"></div>

<div style="display:flex; gap: 30px;">
    <div class="nav" onclick="changeYear(-1)">⟵ MINULOSŤ</div>
    <div class="nav" onclick="changeYear(1)">BUDÚCNOSŤ ⟶</div>
</div>

<div id="msg"></div>

<script>
let currentYear = new Date().getFullYear();

function updateDisplay() {
    const now = new Date();
    const target = new Date(currentYear, 0, 1, 0, 0, 0);

    document.getElementById("year").textContent = "Rok: " + currentYear;

    const diff = target - now;

    if (diff > 0) {
        // Budúci rok – odpočítavame
        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const m = Math.floor((diff / (1000 * 60)) % 60);
        const s = Math.floor((diff / 1000) % 60);

        document.getElementById("countdown").textContent =
            `${d} dní • ${h} hodín • ${m} minút • ${s} sekúnd`;

        document.getElementById("msg").textContent =
            "Brzo sa dočkáš aj s ErikAI OS — by Erik Mohylák";
    }
    else {
        // Tento rok už prebehol
        document.getElementById("countdown").textContent =
            "Už nastal koniec roka";

        document.getElementById("msg").textContent =
            "ErikAI OS pokračuje ďalej — by Erik Mohylák";
    }
}

function changeYear(direction) {
    currentYear += direction;
    updateDisplay();
}

setInterval(updateDisplay, 1000);
updateDisplay();
</script>

</body>
</html>
