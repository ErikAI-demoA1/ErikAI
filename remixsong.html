<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎧 ErikAI DJ Mixér</title>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background-color: #121212;
    color: #fff;
  }
  h1 {
    text-align: center;
    margin: 20px 0;
    color: #00ffcc;
    text-shadow: 0 0 10px #00ffcc;
  }
  #controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 20px;
  }
  .track {
    background: #1f1f1f;
    border-radius: 10px;
    padding: 15px;
    width: 250px;
    box-shadow: 0 0 15px #00ffcc33;
  }
  .track h2 {
    font-size: 18px;
    margin: 0 0 10px 0;
    color: #00ffcc;
  }
  .slider, .volume, .crossfader {
    width: 100%;
  }
  .track button {
    background: #00ffcc;
    color: #121212;
    border: none;
    padding: 8px 12px;
    margin: 5px 0;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
  }
  .track button:hover {
    background: #00cca6;
  }
  #master-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin: 20px;
  }
  .fader-container {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 8px;
    border-radius: 5px;
    background: #333;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    background: #00ffcc;
    cursor: pointer;
    border-radius: 50%;
    box-shadow: 0 0 5px #00ffcc;
  }
</style>
</head>
<body>

<h1>🎧 ErikAI DJ Mixér</h1>

<div id="controls"></div>

<div id="master-controls">
  <div class="fader-container">
    <label for="masterVolume">Master hlasitosť</label>
    <input type="range" id="masterVolume" min="0" max="1" step="0.01" value="0.8">
  </div>
  <button onclick="playAll()">▶ Spusti všetko</button>
  <button onclick="pauseAll()">⏸ Zastav všetko</button>
</div>

<script>
  const tracksData = [
    {name: "Track 1"},
    {name: "Track 2"},
    {name: "Track 3"},
    {name: "Track 4"}
  ];

  const controlsDiv = document.getElementById('controls');
  const trackElements = [];

  const masterVolume = document.getElementById('masterVolume');

  tracksData.forEach((trackData, i) => {
    const div = document.createElement('div');
    div.className = 'track';
    const title = document.createElement('h2');
    title.innerText = trackData.name;
    const audio = document.createElement('audio');
    audio.src = ""; // sem môžeš dať cestu k MP3
    audio.controls = true;
    audio.volume = 0.8;

    const volSlider = document.createElement('input');
    volSlider.type = 'range';
    volSlider.min = 0;
    volSlider.max = 1;
    volSlider.step = 0.01;
    volSlider.value = audio.volume;
    volSlider.className = 'volume';
    volSlider.oninput = () => audio.volume = volSlider.value * masterVolume.value;

    const playBtn = document.createElement('button');
    playBtn.innerText = "▶ Play/Pause";
    playBtn.onclick = () => audio.paused ? audio.play() : audio.pause();

    div.appendChild(title);
    div.appendChild(audio);
    div.appendChild(volSlider);
    div.appendChild(playBtn);

    controlsDiv.appendChild(div);

    trackElements.push(audio);
  });

  masterVolume.oninput = () => {
    trackElements.forEach(audio => {
      audio.volume = audio.volume * masterVolume.value;
    });
  };

  function playAll() {
    trackElements.forEach(audio => audio.play());
  }

  function pauseAll() {
    trackElements.forEach(audio => audio.pause());
  }
</script>

</body>
</html>
