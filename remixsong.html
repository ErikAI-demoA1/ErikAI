<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI DJ Mixér</title>
<style>
  body {
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(to right, #1e1e1e, #121212);
    color: #fff;
    margin: 0;
    padding: 0;
  }
  header {
    text-align: center;
    padding: 20px;
    background-color: #ff0033;
    font-size: 1.5em;
    font-weight: bold;
    letter-spacing: 1px;
  }
  #player-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 20px;
  }
  .track {
    background-color: #222;
    padding: 15px;
    border-radius: 10px;
    width: 250px;
    box-shadow: 0 0 10px rgba(255,0,51,0.5);
  }
  .track input[type="file"] {
    margin-bottom: 10px;
  }
  .controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .controls label {
    font-size: 0.9em;
  }
  input[type="range"] {
    width: 100%;
  }
  button {
    background-color: #ff0033;
    border: none;
    padding: 8px;
    color: white;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
  }
  button:hover {
    background-color: #cc0029;
  }
  #mix-controls {
    text-align: center;
    margin: 20px;
  }
</style>
</head>
<body>

<header>🎛️ ErikAI DJ Mixér</header>

<div id="player-container"></div>

<div id="mix-controls">
  <button onclick="playAll()">▶️ Spusti všetko</button>
  <button onclick="pauseAll()">⏸️ Pauza všetko</button>
</div>

<script>
  const playerContainer = document.getElementById('player-container');
  const tracks = [];

  function addTrack() {
    const trackDiv = document.createElement('div');
    trackDiv.classList.add('track');

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'audio/*';
    trackDiv.appendChild(fileInput);

    const audio = document.createElement('audio');
    audio.controls = true;
    audio.preload = "auto";
    trackDiv.appendChild(audio);

    const controlsDiv = document.createElement('div');
    controlsDiv.classList.add('controls');

    // Hlasitosť
    const volLabel = document.createElement('label');
    volLabel.innerText = 'Hlasitosť:';
    const volSlider = document.createElement('input');
    volSlider.type = 'range';
    volSlider.min = 0;
    volSlider.max = 1;
    volSlider.step = 0.01;
    volSlider.value = 0.8;
    volSlider.oninput = () => audio.volume = volSlider.value;
    controlsDiv.appendChild(volLabel);
    controlsDiv.appendChild(volSlider);

    // Pan (Stereo)
    const panLabel = document.createElement('label');
    panLabel.innerText = 'Stereo:';
    const panSlider = document.createElement('input');
    panSlider.type = 'range';
    panSlider.min = -1;
    panSlider.max = 1;
    panSlider.step = 0.01;
    panSlider.value = 0;
    controlsDiv.appendChild(panLabel);
    controlsDiv.appendChild(panSlider);

    trackDiv.appendChild(controlsDiv);
    playerContainer.appendChild(trackDiv);

    let audioContext, source, panNode;

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if(file){
        const reader = new FileReader();
        reader.onload = (e) => {
          audio.src = e.target.result;

          // Web Audio API pre pan
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          source = audioContext.createMediaElementSource(audio);
          panNode = audioContext.createStereoPanner();
          source.connect(panNode).connect(audioContext.destination);

          panSlider.oninput = () => {
            panNode.pan.value = panSlider.value;
          }
        };
        reader.readAsDataURL(file);
      }
    });

    tracks.push(audio);
  }

  function playAll() {
    tracks.forEach(track => track.play());
  }
  function pauseAll() {
    tracks.forEach(track => track.pause());
  }

  // Inicialne pridáme 4 sloty
  for(let i=0;i<4;i++) addTrack();
</script>

</body>
</html>
