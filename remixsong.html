<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎧 ErikAI DJ Mixér</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #1f1f1f, #3c3c3c);
  color: white;
  margin: 0;
  padding: 20px;
}
h1 { text-align: center; color: #ff0044; }
input[type=file] { display: block; margin: 20px auto; }
.track {
  background: #2b2b2b;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
}
.track h2 { margin: 0 0 10px; color: #ff77aa; font-size: 16px; }
.track button {
  margin-right: 10px;
  background: #ff0044;
  border: none;
  padding: 5px 10px;
  color: white;
  cursor: pointer;
  border-radius: 5px;
}
.track button:hover { background: #ff3366; }
input[type=range] { width: 100%; }
#masterControls {
  text-align: center;
  margin: 20px 0;
}
.crossfader {
  width: 100%;
  margin-top: 10px;
}
</style>
</head>
<body>
<h1>🎧 ErikAI DJ Mixér</h1>
<input type="file" id="fileInput" accept="audio/*" multiple>
<div id="controls"></div>

<div id="masterControls">
  <button onclick="playAll()">▶ Všetko Play</button>
  <button onclick="pauseAll()">⏸ Všetko Pause</button>
  <label>Master hlasitosť:</label>
  <input type="range" id="masterVol" min="0" max="1" step="0.01" value="0.8">
  <label>Crossfader:</label>
  <input type="range" id="crossfader" min="0" max="1" step="0.01" class="crossfader">
</div>

<script>
const fileInput = document.getElementById('fileInput');
const controlsDiv = document.getElementById('controls');
const masterVol = document.getElementById('masterVol');
const crossfader = document.getElementById('crossfader');

let trackElements = [];

fileInput.addEventListener('change', (e) => {
  const files = Array.from(fileInput.files);
  files.forEach(file => {
    const div = document.createElement('div');
    div.className = 'track';
    
    const title = document.createElement('h2');
    title.innerText = file.name;

    const audio = document.createElement('audio');
    audio.src = URL.createObjectURL(file);
    audio.controls = true;
    audio.volume = masterVol.value;

    const volSlider = document.createElement('input');
    volSlider.type = 'range';
    volSlider.min = 0;
    volSlider.max = 1;
    volSlider.step = 0.01;
    volSlider.value = audio.volume;
    volSlider.oninput = () => audio.volume = volSlider.value;

    const playBtn = document.createElement('button');
    playBtn.innerText = "▶ Play/Pause";
    playBtn.onclick = () => audio.paused ? audio.play() : audio.pause();

    div.appendChild(title);
    div.appendChild(audio);
    div.appendChild(volSlider);
    div.appendChild(playBtn);
    controlsDiv.appendChild(div);

    trackElements.push({audio, volSlider});
  });
});

masterVol.addEventListener('input', () => {
  trackElements.forEach(t => t.audio.volume = t.volSlider.value * masterVol.value);
});

crossfader.addEventListener('input', () => {
  const left = 1 - crossfader.value;
  const right = crossfader.value;
  trackElements.forEach((t, i) => {
    // jednoduché rozdelenie na prvú polovicu = ľavý, druhá = pravý
    if (i < trackElements.length/2) t.audio.volume = t.volSlider.value * left * masterVol.value;
    else t.audio.volume = t.volSlider.value * right * masterVol.value;
  });
});

function playAll() { trackElements.forEach(t => t.audio.play()); }
function pauseAll() { trackElements.forEach(t => t.audio.pause()); }
</script>
</body>
</html>
