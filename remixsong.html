<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI Mixér</title>
<style>
body { font-family: Arial; text-align:center; padding:20px; background:#121212; color:white; }
input, button, label { margin:5px; }
.track { border:1px solid #444; padding:10px; margin:10px; border-radius:10px; }
</style>
</head>
<body>
<h2>🎵 ErikAI Mixér Pesničiek</h2>
<input type="file" id="fileInput" accept="audio/*" multiple><br><br>

<div id="tracks"></div>

<button onclick="playMix()">▶ Prehrať mix</button>
<button onclick="stopMix()">■ Stop</button>

<script>
let ctx = new (window.AudioContext || window.webkitAudioContext)();
let tracks = [];

const fileInput = document.getElementById('fileInput');
const tracksDiv = document.getElementById('tracks');

fileInput.addEventListener('change', () => {
    tracksDiv.innerHTML = '';
    tracks = [];

    Array.from(fileInput.files).forEach((file, index) => {
        const trackDiv = document.createElement('div');
        trackDiv.className = 'track';
        trackDiv.innerHTML = `
            <b>${file.name}</b><br>
            Hlasitosť: <input type="range" min="0" max="1" step="0.01" value="0.7" id="vol${index}"><br>
            Oneskorenie (ms): <input type="number" value="0" id="delay${index}">
        `;
        tracksDiv.appendChild(trackDiv);

        tracks.push({file, vol: 0.7, delay: 0});
    });
});

function playMix() {
    stopMix(); // zruší predchádzajúce stopy
    tracks.forEach((track, i) => {
        const reader = new FileReader();
        reader.onload = function(e) {
            ctx.decodeAudioData(e.target.result, buffer => {
                const source = ctx.createBufferSource();
                source.buffer = buffer;

                const gainNode = ctx.createGain();
                gainNode.gain.value = parseFloat(document.getElementById(`vol${i}`).value);

                source.connect(gainNode).connect(ctx.destination);
                const delay = parseInt(document.getElementById(`delay${i}`).value);
                source.start(ctx.currentTime + delay/1000);

                track.source = source;
            });
        }
        reader.readAsArrayBuffer(track.file);
    });
}

function stopMix() {
    tracks.forEach(track => {
        if(track.source) track.source.stop();
    });
}
</script>
</body>
</html>
