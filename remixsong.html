<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI Mixér Pesničiek</title>
<style>
body { font-family: Arial; text-align:center; padding:20px; background:#121212; color:white; }
input, button, label { margin:5px; }
</style>
</head>
<body>
<h2>🎵 ErikAI Mixér Pesničiek</h2>

<input type="file" id="song1" accept="audio/*">
<input type="file" id="song2" accept="audio/*"><br>

<label>Hlasitosť 1:</label><input type="range" id="vol1" min="0" max="1" step="0.01" value="0.7"><br>
<label>Hlasitosť 2:</label><input type="range" id="vol2" min="0" max="1" step="0.01" value="0.7"><br>

<label>Oneskorenie 1 (ms):</label><input type="number" id="delay1" value="0"><br>
<label>Oneskorenie 2 (ms):</label><input type="number" id="delay2" value="0"><br>

<button onclick="playMix()">▶ Prehrať mix</button>
<button onclick="stopMix()">■ Stop</button>

<script>
let ctx = new (window.AudioContext || window.webkitAudioContext)();
let sources = [];

function playMix() {
    stopMix(); // vymaže predchádzajúce zdroje
    const songFiles = [document.getElementById('song1').files[0], document.getElementById('song2').files[0]];
    const volumes = [parseFloat(document.getElementById('vol1').value), parseFloat(document.getElementById('vol2').value)];
    const delays = [parseInt(document.getElementById('delay1').value), parseInt(document.getElementById('delay2').value)];

    songFiles.forEach((file, i) => {
        if(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                ctx.decodeAudioData(e.target.result, buffer => {
                    const source = ctx.createBufferSource();
                    source.buffer = buffer;

                    const gainNode = ctx.createGain();
                    gainNode.gain.value = volumes[i];

                    source.connect(gainNode).connect(ctx.destination);
                    source.start(ctx.currentTime + delays[i]/1000);

                    sources.push(source);
                });
            }
            reader.readAsArrayBuffer(file);
        }
    });
}

function stopMix() {
    sources.forEach(s => s.stop());
    sources = [];
}
</script>
</body>
</html>
