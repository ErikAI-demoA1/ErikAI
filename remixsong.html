<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎧 ErikAI DJ Mix</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #121212;
    color: white;
    text-align: center;
    margin: 0;
    padding: 0;
  }
  h1 { margin: 20px 0; color: #ff4444; }
  #fileInput { margin: 20px 0; }
  .track {
    margin: 15px auto;
    padding: 15px;
    border: 1px solid #333;
    border-radius: 10px;
    width: 90%;
    max-width: 600px;
    background: #1e1e1e;
  }
  .track input[type="range"] {
    width: 100%;
  }
  .controls {
    display: flex;
    justify-content: space-around;
    margin-top: 10px;
  }
  button {
    padding: 8px 15px;
    background-color: #ff4444;
    border: none;
    color: white;
    border-radius: 5px;
    cursor: pointer;
  }
  button:hover { background-color: #cc0000; }
  #visualizer {
    width: 90%;
    height: 100px;
    background: #222;
    margin: 20px auto;
    border-radius: 10px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    display: inline-block;
    background: #ff4444;
    width: 5px;
    margin-right: 1px;
  }
</style>
</head>
<body>

<h1>🎧 ErikAI DJ Mix</h1>

<input type="file" id="fileInput" accept="audio/*" multiple>
<div id="tracks"></div>

<div id="visualizer"></div>

<script>
const fileInput = document.getElementById('fileInput');
const tracksDiv = document.getElementById('tracks');
const visualizer = document.getElementById('visualizer');

let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let analyser = audioCtx.createAnalyser();
analyser.fftSize = 256;
let dataArray = new Uint8Array(analyser.frequencyBinCount);
analyser.connect(audioCtx.destination);

function createVisualizer() {
  visualizer.innerHTML = '';
  for(let i = 0; i < analyser.frequencyBinCount; i++){
    let bar = document.createElement('div');
    bar.classList.add('bar');
    visualizer.appendChild(bar);
  }
}
createVisualizer();

function updateVisualizer() {
  analyser.getByteFrequencyData(dataArray);
  let bars = visualizer.getElementsByClassName('bar');
  for(let i = 0; i < bars.length; i++){
    bars[i].style.height = dataArray[i] + 'px';
  }
  requestAnimationFrame(updateVisualizer);
}
updateVisualizer();

fileInput.addEventListener('change', () => {
  const files = Array.from(fileInput.files);
  files.forEach(file => {
    const url = URL.createObjectURL(file);
    const audio = new Audio(url);
    audio.loop = true;

    const trackDiv = document.createElement('div');
    trackDiv.classList.add('track');

    const name = document.createElement('p');
    name.textContent = file.name;

    const volumeSlider = document.createElement('input');
    volumeSlider.type = 'range';
    volumeSlider.min = 0;
    volumeSlider.max = 1;
    volumeSlider.step = 0.01;
    volumeSlider.value = 0.7;

    const playBtn = document.createElement('button');
    playBtn.textContent = '▶️ Play';
    playBtn.onclick = () => {
      audioCtx.resume();
      audio.play();
    };

    const stopBtn = document.createElement('button');
    stopBtn.textContent = '⏹ Stop';
    stopBtn.onclick = () => { audio.pause(); audio.currentTime = 0; };

    // Create gain node for volume control
    const gainNode = audioCtx.createGain();
    gainNode.gain.value = volumeSlider.value;
    const source = audioCtx.createMediaElementSource(audio);
    source.connect(gainNode).connect(analyser);

    volumeSlider.addEventListener('input', () => {
      gainNode.gain.value = volumeSlider.value;
    });

    const controlsDiv = document.createElement('div');
    controlsDiv.classList.add('controls');
    controlsDiv.appendChild(playBtn);
    controlsDiv.appendChild(stopBtn);

    trackDiv.appendChild(name);
    trackDiv.appendChild(volumeSlider);
    trackDiv.appendChild(controlsDiv);
    tracksDiv.appendChild(trackDiv);
  });
});
</script>

</body>
</html>
