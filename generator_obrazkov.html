<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 ErikAI Generátor Obrazomix – Profi</title>
<style>
body { font-family: sans-serif; padding: 20px; background: #f0f0f5; text-align: center; }
h1 { color: #a30000; }
input, button, select { margin: 10px; padding: 10px; font-size: 16px; }
#vysledok img { max-width: 90%; margin-top: 20px; border: 3px solid #aaa; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.3);}
button { background: #b30000; color: white; border: none; border-radius: 8px; cursor: pointer; }
button:hover { background: #d10000; }
select { border-radius: 6px; }
#download { display: block; margin-top: 15px; padding: 10px 15px; background: #0077cc; color: white; text-decoration: none; border-radius: 6px; }
#download:hover { background: #005fa3; }
</style>
</head>
<body>

<h1>🧠 ErikAI Generátor Obrazomix – Profi</h1>
<p>Vyber obrázky a nechaj ErikAI kombinovať a aplikovať efekty:</p>

<input type="file" id="obrazok1" multiple><br>
<select id="efekt">
  <option value="glitch">Glitch efekt</option>
  <option value="neon">Neónový svit</option>
  <option value="blurcontrast">Rozmazanie + kontrast</option>
  <option value="kaleidoskop">Duplikácia / Kaleidoskop</option>
  <option value="chaos">Chaos efekt</option>
  <option value="palette">Farby podľa nálady</option>
  <option value="pixel">Pixel Art</option>
  <option value="invert">Invert farieb</option>
</select>
<br>
<button onclick="kombinujProfi()">🧠 Kombinuj a aplikuj efekt</button>

<div id="vysledok"></div>
<a id="download" href="#" download="erikai_mix.png" style="display:none;">⬇️ Stiahnuť obrázok</a>

<script>
function kombinujProfi() {
  const files = Array.from(document.getElementById("obrazok1").files);
  const efekt = document.getElementById("efekt").value;
  const downloadLink = document.getElementById("download");

  if(files.length < 2){
    document.getElementById("vysledok").innerHTML = "⚠️ Nahraj aspoň 2 obrázky!";
    downloadLink.style.display = "none";
    return;
  }

  const selectedFiles = files.sort(() => 0.5 - Math.random()).slice(0, 2);
  const reader1 = new FileReader();
  const reader2 = new FileReader();

  reader1.onload = e1 => {
    reader2.onload = e2 => {
      const img1 = new Image(); img1.src = e1.target.result;
      const img2 = new Image(); img2.src = e2.target.result;

      img1.onload = () => img2.onload = () => {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = Math.max(img1.width, img2.width);
        canvas.height = Math.max(img1.height, img2.height);

        // Všetky efekty – tvoj štýl
        switch(efekt){
          case "glitch":
            ctx.drawImage(img1, 0, 0);
            for(let i=0;i<25;i++){
              const x = Math.random()*canvas.width;
              const y = Math.random()*canvas.height;
              const w = Math.random()*50;
              const h = 5;
              ctx.drawImage(canvas, x, y, w, h, x+Math.random()*15-7, y+Math.random()*15-7, w, h);
            }
            ctx.globalAlpha = 1;
            break;

          case "neon":
            ctx.drawImage(img1, 0, 0);
            ctx.globalCompositeOperation = "lighter";
            ctx.shadowColor = "#0ff";
            ctx.shadowBlur = 40;
            ctx.drawImage(img2, 0, 0);
            ctx.globalCompositeOperation = "source-over";
            break;

          case "blurcontrast":
            ctx.filter = "blur(4px)";
            ctx.drawImage(img1, 0, 0);
            ctx.filter = "contrast(1.6)";
            ctx.drawImage(img2, 0, 0);
            ctx.filter = "none";
            break;

          case "kaleidoskop":
            ctx.drawImage(img1, 0, 0);
            for(let i=0;i<6;i++){
              ctx.save();
              ctx.translate(canvas.width/2, canvas.height/2);
              ctx.rotate(Math.PI/3*i);
              ctx.globalAlpha = 0.5;
              ctx.drawImage(img2, -canvas.width/2, -canvas.height/2);
              ctx.restore();
            }
            ctx.globalAlpha = 1;
            break;

          case "chaos":
            ctx.drawImage(img2, 0, 0);
            ctx.globalAlpha = 0.7;
            ctx.translate(40,30);
            ctx.rotate(0.25);
            ctx.drawImage(img1, 0, 0);
            ctx.setTransform(1,0,0,1,0,0);
            ctx.globalAlpha = 1;
            break;

          case "palette":
            const palettes = [["#FF6B6B","#FFE66D"], ["#4ECDC4","#556270"], ["#C7F464","#FF6B6B"], ["#FF00FF","#00FFFF"]];
            const pal = palettes[Math.floor(Math.random()*palettes.length)];
            ctx.drawImage(img1, 0, 0);
            ctx.globalCompositeOperation = "color";
            ctx.fillStyle = pal[0]; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.globalAlpha = 0.5;
            ctx.drawImage(img2,0,0);
            ctx.globalCompositeOperation = "source-over";
            break;

          case "pixel":
            const size = 10;
            ctx.drawImage(img1, 0, 0, canvas.width/size, canvas.height/size);
            ctx.drawImage(canvas, 0, 0, canvas.width/size, canvas.height/size, 0,0,canvas.width, canvas.height);
            ctx.globalAlpha = 0.8;
            ctx.drawImage(img2, 0, 0);
            ctx.globalAlpha = 1;
            break;

          case "invert":
            ctx.drawImage(img1, 0, 0);
            ctx.globalAlpha = 0.7;
            ctx.filter = "invert(100%)";
            ctx.drawImage(img2,0,0);
            ctx.filter = "none";
            ctx.globalAlpha = 1;
            break;
        }

        const dataURL = canvas.toDataURL("image/png");
        document.getElementById("vysledok").innerHTML = `<img src="${dataURL}" alt="Mix obrázkov">`;
        downloadLink.href = dataURL;
        downloadLink.style.display = "inline";
      };
    };
    reader2.readAsDataURL(selectedFiles[1]);
  };
  reader1.readAsDataURL(selectedFiles[0]);
}
</script>
