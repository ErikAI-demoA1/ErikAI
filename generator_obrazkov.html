<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 ErikAI Generátor Obrazomix – Profi</title>
<style>
  :root {
    --bg-color: #0b0b0b;
    --card-bg: #141414;
    --border-red: #e74c3c;
    --border-green: #2ecc71;
    --accent-yellow: #f1c40f;
    --text-main: #ffffff;
    --text-muted: #aaaaaa;
  }

  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    padding: 2rem 1rem; 
    background: var(--bg-color); 
    color: var(--text-main); 
    margin: 0;
    text-align: center;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    background: var(--card-bg);
    border: 2px solid var(--border-green);
    border-radius: 16px;
    padding: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  h1 { 
    color: var(--accent-yellow); 
    font-size: 1.8rem;
    margin-top: 0;
    margin-bottom: 5px;
  }

  p {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-bottom: 1.5rem;
  }

  .control-group {
    background: #1a1a1a;
    border: 1px solid #333;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    text-align: left;
  }

  .control-group label {
    display: block;
    font-size: 0.85rem;
    color: var(--accent-yellow);
    margin-bottom: 8px;
    font-weight: bold;
  }

  input[type="file"], select { 
    width: 100%;
    padding: 10px; 
    font-size: 15px; 
    background: #111;
    color: #fff;
    border: 1px solid #333;
    border-radius: 8px;
    box-sizing: border-box;
    outline: none;
  }

  select:focus, input[type="file"]:focus {
    border-color: var(--accent-yellow);
  }

  .thumbnails {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .thumbnails img {
    width: 65px;
    height: 65px;
    object-fit: cover;
    border-radius: 6px;
    border: 2px solid var(--border-green);
  }

  button.main-btn { 
    background: var(--border-red); 
    color: white; 
    border: none; 
    border-radius: 10px; 
    padding: 12px 24px; 
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer; 
    width: 100%;
    transition: background 0.2s, transform 0.1s;
    margin-top: 5px;
  }

  button.main-btn:hover { 
    background: #c0392b; 
    transform: translateY(-2px);
  }

  button.secondary-btn {
    background: #444;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    margin-top: 8px;
  }
  button.secondary-btn:hover {
    background: #555;
  }

  #vysledok { 
    margin-top: 20px; 
  }

  #vysledok img { 
    max-width: 100%; 
    border-radius: 12px; 
    border: 2px solid var(--border-green); 
    box-shadow: 0 8px 25px rgba(0,0,0,0.6);
  }

  #download { 
    display: inline-block; 
    margin-top: 20px; 
    padding: 12px 22px; 
    background: var(--border-green); 
    color: #000; 
    text-decoration: none; 
    border-radius: 8px; 
    font-weight: bold;
    transition: background 0.2s;
  }

  #download:hover { 
    background: #27ae60; 
    color: white;
  }

  .footer {
    font-size: 13px; 
    color: gray; 
    margin-top: 30px; 
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="container">
  <h1>🧠 ErikAI Generátor Obrazomix – Profi</h1>
  <p>Vyber obrázky a nechaj ErikAI kombinovať a aplikovať efekty:</p>

  <div class="control-group">
    <label>📁 Vyber obrázky (nahraj aspoň 2):</label>
    <input type="file" id="obrazok1" multiple onchange="previewFiles(event)">
    <button class="secondary-btn" onclick="clearImages()">🗑️ Vymazať nahrané obrázky</button>
    <div class="thumbnails" id="thumbContainer"></div>
    <div id="imageCountInfo" style="font-size:0.85rem; color:var(--text-muted); margin-top:8px;">Nahraté obrázky: 0</div>
  </div>

  <div class="control-group">
    <label>🎨 Vyber efekt:</label>
    <select id="efekt">
      <option value="glitch">⚡ Glitch efekt</option>
      <option value="neon">💡 Neónový svit</option>
      <option value="blurcontrast">🔍 Rozmazanie + kontrast</option>
      <option value="kaleidoskop">🌀 Duplikácia / Kaleidoskop</option>
      <option value="chaos">💥 Chaos efekt</option>
      <option value="palette">🌈 Farby podľa nálady</option>
      <option value="pixel">👾 Pixel Art</option>
      <option value="invert">🔄 Invert farieb</option>
    </select>
  </div>

  <button class="main-btn" onclick="kombinujProfi()">🧠 Kombinuj a aplikuj efekt</button>

  <div id="vysledok"></div>
  <a id="download" href="#" download="erikai_mix.png" style="display:none;">⬇️ Stiahnuť obrázok</a>
</div>

<script>
let allFilesArray = [];
let objectUrls = [];

function previewFiles(e) {
  const files = e.target.files;
  if (!files || files.length === 0) return;

  for (let i = 0; i < files.length; i++) {
    allFilesArray.push(files[i]);
  }

  updateThumbnails();
  e.target.value = ''; // Reset inputu pre opakovaný výber
}

function updateThumbnails() {
  const container = document.getElementById("thumbContainer");
  container.innerHTML = "";
  objectUrls.forEach(url => URL.revokeObjectURL(url));
  objectUrls = [];

  allFilesArray.forEach(file => {
    const url = URL.createObjectURL(file);
    objectUrls.push(url);
    const img = document.createElement("img");
    img.src = url;
    container.appendChild(img);
  });

  document.getElementById("imageCountInfoinnerText", `Nahraté obrázky: ${allFilesArray.length}`);
  document.getElementById("imageCountInfo").innerText = `Nahraté obrázky: ${allFilesArray.length}`;
}

function clearImages() {
  allFilesArray = [];
  updateThumbnails();
  document.getElementById("obrazok1").value = "";
  document.getElementById("vysledok").innerHTML = "";
  document.getElementById("download").style.display = "none";
}

function kombinujProfi() {
  const efekt = document.getElementById("efekt").value;
  const downloadLink = document.getElementById("download");
  const resultDiv = document.getElementById("vysledok");

  if(allFilesArray.length < 2){
    resultDiv.innerHTML = "<p style='color:var(--border-red); font-weight:bold; margin:10px 0;'>⚠️ Nahraj aspoň 2 obrázky!</p>";
    downloadLink.style.display = "none";
    return;
  }

  resultDiv.innerHTML = "<p style='color:var(--accent-yellow); font-weight:bold;'>🧠 Pracujem na tom...</p>";

  const selectedFiles = [...allFilesArray].sort(() => 0.5 - Math.random()).slice(0, 2);
  const reader1 = new FileReader();
  const reader2 = new FileReader();

  reader1.onload = e1 => {
    reader2.onload = e2 => {
      const img1 = new Image(); img1.src = e1.target.result;
      const img2 = new Image(); img2.src = e2.target.result;

      img1.onload = () => img2.onload = () => {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = Math.max(img1.width, img2.width);
        canvas.height = Math.max(img1.height, img2.height);

        // Všetky tvoje pôvodné efekty – zachované presne
        switch(efekt){
          case "glitch":
            ctx.drawImage(img1, 0, 0);
            for(let i=0;i<25;i++){
              const x = Math.random()*canvas.width;
              const y = Math.random()*canvas.height;
              const w = Math.random()*50;
              const h = 5;
              ctx.drawImage(canvas, x, y, w, h, x+Math.random()*15-7, y+Math.random()*15-7, w, h);
            }
            ctx.globalAlpha = 1;
            break;

          case "neon":
            ctx.drawImage(img1, 0, 0);
            ctx.globalCompositeOperation = "lighter";
            ctx.shadowColor = "#0ff";
            ctx.shadowBlur = 40;
            ctx.drawImage(img2, 0, 0);
            ctx.globalCompositeOperation = "source-over";
            break;

          case "blurcontrast":
            ctx.filter = "blur(4px)";
            ctx.drawImage(img1, 0, 0);
            ctx.filter = "contrast(1.6)";
            ctx.drawImage(img2, 0, 0);
            ctx.filter = "none";
            break;

          case "kaleidoskop":
            ctx.drawImage(img1, 0, 0);
            for(let i=0;i<6;i++){
              ctx.save();
              ctx.translate(canvas.width/2, canvas.height/2);
              ctx.rotate(Math.PI/3*i);
              ctx.globalAlpha = 0.5;
              ctx.drawImage(img2, -canvas.width/2, -canvas.height/2);
              ctx.restore();
            }
            ctx.globalAlpha = 1;
            break;

          case "chaos":
            ctx.drawImage(img2, 0, 0);
            ctx.globalAlpha = 0.7;
            ctx.translate(40,30);
            ctx.rotate(0.25);
            ctx.drawImage(img1, 0, 0);
            ctx.setTransform(1,0,0,1,0,0);
            ctx.globalAlpha = 1;
            break;

          case "palette":
            const palettes = [["#FF6B6B","#FFE66D"], ["#4ECDC4","#556270"], ["#C7F464","#FF6B6B"], ["#FF00FF","#00FFFF"]];
            const pal = palettes[Math.floor(Math.random()*palettes.length)];
            ctx.drawImage(img1, 0, 0);
            ctx.globalCompositeOperation = "color";
            ctx.fillStyle = pal[0]; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.globalAlpha = 0.5;
            ctx.drawImage(img2,0,0);
            ctx.globalCompositeOperation = "source-over";
            break;

          case "pixel":
            const size = 10;
            ctx.drawImage(img1, 0, 0, canvas.width/size, canvas.height/size);
            ctx.drawImage(canvas, 0, 0, canvas.width/size, canvas.height/size, 0,0,canvas.width, canvas.height);
            ctx.globalAlpha = 0.8;
            ctx.drawImage(img2, 0, 0);
            ctx.globalAlpha = 1;
            break;

          case "invert":
            ctx.drawImage(img1, 0, 0);
            ctx.globalAlpha = 0.7;
            ctx.filter = "invert(100%)";
            ctx.drawImage(img2,0,0);
            ctx.filter = "none";
            ctx.globalAlpha = 1;
            break;
        }

        const dataURL = canvas.toDataURL("image/png");
        resultDiv.innerHTML = `<img src="${dataURL}" alt="Mix obrázkov">`;
        downloadLink.href = dataURL;
        downloadLink.style.display = "inline-block";
      };
    };
    reader2.readAsDataURL(selectedFiles[1]);
  };
  reader1.readAsDataURL(selectedFiles[0]);
}
</script>

</body>
</html>
