<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI PDF Zlúčenie</title>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9; text-align:center; }
  h1 { color: #1a73e8; }
  input, button { margin: 10px; padding: 10px; font-size: 16px; }
  button { cursor:pointer; border:none; border-radius:5px; background:#1a73e8; color:white; }
  button:hover { background:#1558a5; }
</style>
</head>
<body>

<h1>📘 ErikAI PDF Zlúčenie</h1>

<p>Vyber 2 alebo viac PDF súborov na zlúčenie:</p>
<input type="file" id="pdfFiles" accept="application/pdf" multiple>
<br>
<button onclick="mergePDFs()">💾 Zlúčiť PDF</button>

<script>
async function mergePDFs() {
    const files = document.getElementById("pdfFiles").files;
    if (files.length < 2) return alert("Vyber aspoň 2 PDF súbory!");

    const mergedPdf = await PDFLib.PDFDocument.create();

    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await PDFLib.PDFDocument.load(arrayBuffer);
        const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
        copiedPages.forEach(page => mergedPdf.addPage(page));
    }

    const mergedPdfBytes = await mergedPdf.save();
    const blob = new Blob([mergedPdfBytes], { type: "application/pdf" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "ErikAI_merged.pdf";
    link.click();
    alert("✅ PDF úspešne zlúčené!");
}
</script>

</body>
</html>
