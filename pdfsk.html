<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI – Export do PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<h2>📄 ErikAI – Export do PDF</h2>

<!-- Výber súboru -->
<input type="file" id="fileInput" accept=".txt,.doc,.docx,.csv,.xlsx">
<button onclick="exportPDF()">📥 Exportovať do PDF</button>

<script>
const { jsPDF } = window.jspdf;

function exportPDF() {
    const fileInput = document.getElementById('fileInput');
    const file = fileInput.files[0];
    if(!file) { alert("Vyber súbor!"); return; }

    const reader = new FileReader();
    reader.onload = function(e) {
        const content = e.target.result;

        const doc = new jsPDF();

        // Základné rozdelenie textu a riadkov pre Word/Text
        const lines = content.split(/\r?\n/);
        let y = 20;
        lines.forEach(line => {
            doc.text(line, 10, y);
            y += 10;
        });

        // TODO: Pre Excel/CSV – vytvoriť tabuľku (môžeme pridať neskôr)
        doc.save(file.name.replace(/\.(txt|doc|docx|csv|xlsx)$/i, '.pdf'));
    };

    // Rozlíšiť typ súboru
    if(file.name.endsWith('.txt') || file.name.endsWith('.doc') || file.name.endsWith('.docx')) {
        reader.readAsText(file);
    } else if(file.name.endsWith('.csv') || file.name.endsWith('.xlsx')) {
        reader.readAsText(file); // neskôr môže byť komplexnejšie pre XLSX
    } else {
        alert("Nepodporovaný formát");
    }
}
</script>
</body>
</html>
