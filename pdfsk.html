<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI PDFsk – Word/Excel → PDF</title>
<style>
  body { font-family: Arial; padding: 20px; background: #f5f5f5; color: #111; text-align: center; }
  h1 { color: #1a73e8; }
  input, button { margin: 5px; padding: 10px; }
  #output { margin-top: 20px; text-align: left; max-width: 700px; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ccc; }
</style>
</head>
<body>

<h1>📘 ErikAI PDFsk</h1>

<p>Vyber Word (.docx) alebo Excel (.xlsx) súbor:</p>
<input type="file" id="fileInput" accept=".docx,.xlsx">

<div>
  <button onclick="exportPDF()">📄 Export do PDF</button>
</div>

<div id="output"></div>

<!-- knižnice -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
let fileContent = null;
let fileType = null;

document.getElementById('fileInput').addEventListener('change', function() {
    const file = this.files[0];
    if (!file) return;
    fileType = file.name.split('.').pop().toLowerCase();

    const reader = new FileReader();

    if (fileType === "docx") {
        reader.onload = function(e) {
            const arrayBuffer = e.target.result;
            mammoth.extractRawText({arrayBuffer: arrayBuffer})
                .then(result => {
                    fileContent = result.value;
                    document.getElementById('output').innerText = fileContent;
                });
        };
        reader.readAsArrayBuffer(file);
    } else if (fileType === "xlsx") {
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            let html = '';
            workbook.SheetNames.forEach(sheetName => {
                const sheet = workbook.Sheets[sheetName];
                html += `<h3>${sheetName}</h3>`;
                html += XLSX.utils.sheet_to_html(sheet);
            });
            fileContent = html;
            document.getElementById('output').innerHTML = fileContent;
        };
        reader.readAsArrayBuffer(file);
    } else {
        alert("Nepodporovaný formát!");
    }
});

function exportPDF() {
    if (!fileContent) {
        alert("Najprv vyber súbor!");
        return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    if (fileType === "docx") {
        const lines = fileContent.split('\n');
        let y = 10;
        lines.forEach(line => {
            doc.text(line, 10, y);
            y += 10;
        });
    } else if (fileType === "xlsx") {
        doc.html(fileContent, {
            callback: function (doc) {
                doc.save("export.pdf");
            },
            x: 10,
            y: 10
        });
        return; // ukončíme, lebo jspdf html sa uloží v callbacku
    }

    doc.save("export.pdf");
}
</script>

</body>
</html>
