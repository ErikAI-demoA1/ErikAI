<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔐 Anonymný Prístup – ErikAI OS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-hover: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #2563eb;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }

    body {
      background: radial-gradient(circle at top, #131722 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    p.subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; line-height: 1.4; }

    .key-box {
      background: rgba(0,0,0,0.5);
      border: 1px dashed var(--accent);
      padding: 15px;
      border-radius: 12px;
      font-family: monospace;
      font-size: 1.2rem;
      color: #60a5fa;
      letter-spacing: 2px;
      margin-bottom: 20px;
      display: none;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.4);
      color: white;
      text-align: center;
      font-family: monospace;
      font-size: 1rem;
      margin-bottom: 15px;
      outline: none;
      letter-spacing: 1px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 10px;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover { background: #1d4ed8; transform: translateY(-2px); }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .btn-secondary:hover { background: var(--card-hover); color: white; }

    .stats-box {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .stats-box strong { color: #60a5fa; }
    footer { font-size: 0.8rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>🔐 ErikAI OS Prístup</h1>
      <p class="subtitle">Zabezpečený vstup do systému bez ukladania osobných údajov.</p>

      <!-- Hlavný stav: Registrácia alebo štart -->
      <div id="main-view">
        <div id="key-display" class="key-box">---</div>

        <button id="btn-register" class="btn" onclick="registerNewUser()">⚡ Vytvoriť nový kľúč</button>
        <button id="btn-enter" class="btn" onclick="enterSystem()" style="display: none; background: #16a34a;">🚀 Vstúpiť do ErikAI OS</button>
        
        <button class="btn btn-secondary" onclick="showLoginInput()">🔑 Už mám svoj kľúč (Zadať)</button>
      </div>

      <!-- Skrytá časť pre zadanie existujúceho kľúča -->
      <div id="login-view" style="display: none;">
        <input type="text" id="input-token" placeholder="ERIK-XXXX-XXXX" />
        <button class="btn" onclick="verifyAndLogin()">Overiť kľúč a vstúpiť</button>
        <button class="btn btn-secondary" onclick="showMainView()">Späť</button>
      </div>

      <!-- Počítadlo registrovaných účtov -->
      <div class="stats-box">
        Celkovo vytvorených kľúčov: <strong id="total-accounts">Načítavam...</strong>
      </div>
    </div>

    <footer>
      © 2025 Erik Mohylák – Všetky práva vyhradené.
    </footer>
  </div>

  <script>
    const NAMESPACE = 'erikaios_secure_accounts_2027';
    const KEY_NAME = 'erikai_user_token';

    // Generovanie unikátneho anonymného kľúča
    function generateToken() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let p1 = '', p2 = '';
      for (let i = 0; i < 4; i++) p1 += chars.charAt(Math.floor(Math.random() * chars.length));
      for (let i = 0; i < 4; i++) p2 += chars.charAt(Math.floor(Math.random() * chars.length));
      return `ERIK-${p1}-${p2}`;
    }

    // Načítanie celkového počtu registrácií zo servera
    async function loadStats() {
      try {
        const response = await fetch(`https://api.counterapi.dev/v1/${NAMESPACE}/total_keys`);
        if (response.ok) {
          const data = await response.json();
          document.getElementById('total-accounts').textContent = data.count || 0;
        } else {
          document.getElementById('total-accounts').textContent = 'Aktívne';
        }
      } catch (e) {
        document.getElementById('total-accounts').textContent = 'Online';
      }
    }

    // Vytvorenie nového kľúča (Započíta +1 na serveri)
    async function registerNewUser() {
      const newToken = generateToken();
      localStorage.setItem(KEY_NAME, newToken);

      try {
        await fetch(`https://api.counterapi.dev/v1/${NAMESPACE}/total_keys/up`);
      } catch (e) {
        console.warn('Počítadlo sa nepodarilo aktualizovať');
      }

      showKeyUI(newToken);
      loadStats();
    }

    // Zobrazenie vygenerovaného kľúča používateľovi
    function showKeyUI(token) {
      const box = document.getElementById('key-display');
      box.style.display = 'block';
      box.textContent = token;

      document.getElementById('btn-register').style.display = 'none';
      document.getElementById('btn-enter').style.display = 'inline-block';
    }

    // Vstup do systému (prechod na index3.html) ak má kľúč
    function enterSystem() {
      const token = localStorage.getItem(KEY_NAME);
      if (!token) {
        alert('Najprv si musíš vytvoriť alebo zadať svoj kľúč!');
        return;
      }
      window.location.href = 'index3.html';
    }

    // Prepínanie na obrazovku pre zadanie kľúča
    function showLoginInput() {
      document.getElementById('main-view').style.display = 'none';
      document.getElementById('login-view').style.display = 'block';
    }

    function showMainView() {
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('main-view').style.display = 'block';
    }

    // Overenie, či zadaný kľúč vyzerá správne a pustí ho ďalej
    function verifyAndLogin() {
      const entered = document.getElementById('input-token').value.trim().toUpperCase();
      
      if (!entered.startsWith('ERIK-') || entered.length < 10) {
        alert('Neplatný tvar kľúča! Kľúč musí začínať na ERIK-');
        return;
      }

      // Uložíme kľúč do prehliadača a pustíme ho dnu (bez navýšenia počítadla)
      localStorage.setItem(KEY_NAME, entered);
      window.location.href = 'index3.html';
    }

    // Pri štarte stránky skontrolujeme, či už používateľ má kľúč uložený
    document.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem(KEY_NAME);
      if (saved) {
        showKeyUI(saved);
      }
      loadStats();
    });
  </script>

</body>
</html>
