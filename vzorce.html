<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI Vzorcovník</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background-color: #121212;
    color: #e0e0e0;
    margin: 0;
    padding: 0;
  }
  header {
    background: linear-gradient(90deg, #ff003c, #ff8a00);
    padding: 20px;
    text-align: center;
    font-size: 1.8em;
    font-weight: bold;
    color: white;
  }
  nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    background-color: #1e1e1e;
    padding: 10px 0;
  }
  nav button {
    background-color: #ff003c;
    border: none;
    margin: 5px;
    padding: 10px 15px;
    cursor: pointer;
    color: white;
    border-radius: 8px;
    transition: 0.2s;
  }
  nav button:hover {
    background-color: #ff6a00;
  }
  section {
    padding: 20px;
    display: none;
  }
  section.active {
    display: block;
  }
  .formula {
    background-color: #1e1e1e;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 10px;
    box-shadow: 0 0 10px #ff003c;
  }
  .formula h3 {
    margin-top: 0;
    color: #ff8a00;
  }
  .formula input {
    width: 80px;
    margin: 5px;
    padding: 5px;
    border-radius: 5px;
    border: 1px solid #ff003c;
    background-color: #121212;
    color: white;
  }
  .formula button {
    background-color: #ff8a00;
    border: none;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
    color: white;
    margin-left: 5px;
  }
  .formula button:hover {
    background-color: #ff003c;
  }
  .result {
    margin-top: 10px;
    font-weight: bold;
    color: #00ff90;
  }
</style>
</head>
<body>

<header>ErikAI Vzorcovník – Fyzika, Elektro, VŠ</header>

<nav>
  <button onclick="showSection('mechanika')">Mechanika</button>
  <button onclick="showSection('elektro')">Elektro</button>
  <button onclick="showSection('termo')">Termodynamika</button>
  <button onclick="showSection('optika')">Optika</button>
  <button onclick="showSection('matematika')">Matematika</button>
  <button onclick="showSection('chemia')">Chémia</button>
</nav>

<section id="mechanika">
  <div class="formula">
    <h3>Sila: F = m * a</h3>
    <label>m (kg): <input type="number" id="m1" value="1"></label>
    <label>a (m/s²): <input type="number" id="a1" value="1"></label>
    <button onclick="document.getElementById('res1').innerText = 'F = ' + (parseFloat(document.getElementById('m1').value)*parseFloat(document.getElementById('a1').value)) + ' N'">Vypočítať</button>
    <div class="result" id="res1"></div>
  </div>

  <div class="formula">
    <h3>Potenciálna energia: E_p = m * g * h</h3>
    <label>m (kg): <input type="number" id="m2" value="1"></label>
    <label>h (m): <input type="number" id="h2" value="1"></label>
    <label>g (m/s²): <input type="number" id="g2" value="9.81"></label>
    <button onclick="document.getElementById('res2').innerText = 'E_p = ' + (parseFloat(document.getElementById('m2').value)*parseFloat(document.getElementById('g2').value)*parseFloat(document.getElementById('h2').value)) + ' J'">Vypočítať</button>
    <div class="result" id="res2"></div>
  </div>

  <div class="formula">
    <h3>Kinetická energia: E_k = 0.5 * m * v²</h3>
    <label>m (kg): <input type="number" id="m3" value="1"></label>
    <label>v (m/s): <input type="number" id="v3" value="1"></label>
    <button onclick="document.getElementById('res3').innerText = 'E_k = ' + (0.5*parseFloat(document.getElementById('m3').value)*Math.pow(parseFloat(document.getElementById('v3').value),2)) + ' J'">Vypočítať</button>
    <div class="result" id="res3"></div>
  </div>
</section>

<section id="elektro">
  <div class="formula">
    <h3>Ohmov zákon: U = R * I</h3>
    <label>R (Ω): <input type="number" id="R1" value="1"></label>
    <label>I (A): <input type="number" id="I1" value="1"></label>
    <button onclick="document.getElementById('res4').innerText = 'U = ' + (parseFloat(document.getElementById('R1').value)*parseFloat(document.getElementById('I1').value)) + ' V'">Vypočítať</button>
    <div class="result" id="res4"></div>
  </div>

  <div class="formula">
    <h3>Výkon: P = U * I</h3>
    <label>U (V): <input type="number" id="U1" value="1"></label>
    <label>I (A): <input type="number" id="I2" value="1"></label>
    <button onclick="document.getElementById('res5').innerText = 'P = ' + (parseFloat(document.getElementById('U1').value)*parseFloat(document.getElementById('I2').value)) + ' W'">Vypočítať</button>
    <div class="result" id="res5"></div>
  </div>
</section>

<section id="termo">
  <div class="formula">
    <h3>Teplo: Q = m * c * ΔT</h3>
    <label>m (kg): <input type="number" id="m4" value="1"></label>
    <label>c (J/kg°C): <input type="number" id="c4" value="4186"></label>
    <label>ΔT (°C): <input type="number" id="dT4" value="1"></label>
    <button onclick="document.getElementById('res6').innerText = 'Q = ' + (parseFloat(document.getElementById('m4').value)*parseFloat(document.getElementById('c4').value)*parseFloat(document.getElementById('dT4').value)) + ' J'">Vypočítať</button>
    <div class="result" id="res6"></div>
  </div>
</section>

<section id="optika">
  <div class="formula">
    <h3>Lom svetla: n1 * sin(θ1) = n2 * sin(θ2)</h3>
    <label>n1: <input type="number" id="n1" value="1"></label>
    <label>θ1 (°): <input type="number" id="t1" value="30"></label>
    <label>n2: <input type="number" id="n2" value="1.5"></label>
    <button onclick="calculateSnell()">Vypočítať θ2</button>
    <div class="result" id="res7"></div>
  </div>
</section>

<section id="matematika">
  <div class="formula">
    <h3>Plocha obdĺžnika: S = a * b</h3>
    <label>a: <input type="number" id="a5" value="1"></label>
    <label>b: <input type="number" id="b5" value="1"></label>
    <button onclick="document.getElementById('res8').innerText = 'S = ' + (parseFloat(document.getElementById('a5').value)*parseFloat(document.getElementById('b5').value)) + ' m²'">Vypočítať</button>
    <div class="result" id="res8"></div>
  </div>
</section>

<section id="chemia">
  <div class="formula">
    <h3>Moly: n = m / M</h3>
    <label>m (g): <input type="number" id="m6" value="10"></label>
    <label>M (g/mol): <input type="number" id="M6" value="18"></label>
    <button onclick="document.getElementById('res9').innerText = 'n = ' + (parseFloat(document.getElementById('m6').value)/parseFloat(document.getElementById('M6').value)) + ' mol'">Vypočítať</button>
    <div class="result" id="res9"></div>
  </div>
</section>

<script>
function showSection(id){
  document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function calculateSnell(){
  const n1 = parseFloat(document.getElementById('n1').value);
  const n2 = parseFloat(document.getElementById('n2').value);
  const t1 = parseFloat(document.getElementById('t1').value) * Math.PI/180;
  const t2 = Math.asin(n1 * Math.sin(t1)/n2) * 180/Math.PI;
  document.getElementById('res7').innerText = 'θ2 = ' + t2.toFixed(2) + '°';
}

// Zobraziť prvú sekciu na začiatku
showSection('mechanika');
</script>

</body>
</html>
