<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry Dash Elite</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
}

body {
  margin: 0;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial, sans-serif;
}

#game {
  position: relative;
  width: 90vw;
  max-width: 820px;
  height: 270px;
  border-radius: 18px;
  overflow: hidden;
  border: 3px solid #5fdfff;
  transition: background 4s linear;
  box-shadow: 0 0 40px rgba(95,223,255,0.4);
}

/* SAFE COLOR THEMES */
.theme1 { background: linear-gradient(#0f2027, #203a43); }
.theme2 { background: linear-gradient(#141e30, #243b55); }
.theme3 { background: linear-gradient(#134e5e, #1c7c7c); }
.theme4 { background: linear-gradient(#232526, #414345); }

#player {
  position: absolute;
  width: 34px;
  height: 34px;
  left: 110px;
  bottom: 0;
  background: linear-gradient(45deg, #5fdfff, #9ffcff);
  border-radius: 6px;
  box-shadow: 0 0 12px rgba(95,223,255,0.8);
}

/* UI */
#ui {
  position: absolute;
  top: 12px;
  left: 16px;
  color: #dff9fb;
  font-size: 15px;
}

#center {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: rgba(0,0,0,0.55);
  font-size: 22px;
  color: white;
}

/* OBSTACLES */
.obstacle {
  position: absolute;
  bottom: 0;
  right: -80px;
}

/* SHAPES */
.spike {
  width: 24px;
  height: 36px;
  background: #ff6b6b;
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
}

.double-spike {
  width: 40px;
  height: 36px;
  background: #ff6b6b;
  clip-path: polygon(
    0% 100%, 25% 0%, 50% 100%, 75% 0%, 100% 100%
  );
}

.block {
  width: 26px;
  height: 26px;
  background: #ff9f43;
  border-radius: 5px;
}

.tall-block {
  width: 26px;
  height: 50px;
  background: #ffa502;
  border-radius: 5px;
}

.mine {
  width: 26px;
  height: 26px;
  background: radial-gradient(circle, #ff7675, #c0392b);
  border-radius: 50%;
}
</style>
</head>

<body>

<div id="game" class="theme1">
  <div id="player"></div>
  <div id="ui">Score: <span id="score">0</span></div>
  <div id="center">TAP / SPACE<br><small>štart</small></div>
</div>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreEl = document.getElementById("score");
const center = document.getElementById("center");

let y = 0;
let vel = 0;
let gravity = 1800;
let jumpPower = 620;
let speed = 320;
let score = 0;
let started = false;
let over = false;
let lastTime = null;

const themes = ["theme1","theme2","theme3","theme4"];
let themeIndex = 0;

function start() {
  if (started) return;
  started = true;
  center.style.display = "none";
  requestAnimationFrame(loop);
  setTimeout(spawnObstacle, 2000);
  setInterval(changeTheme, 7000);
}

function jump() {
  if (!started) start();
  if (y === 0) vel = jumpPower;
}

document.addEventListener("keydown", e => {
  if (e.code === "Space") jump();
});
game.addEventListener("click", jump);
game.addEventListener("touchstart", jump);

function loop(time) {
  if (over) return;
  if (!lastTime) lastTime = time;
  const delta = (time - lastTime) / 1000;
  lastTime = time;

  vel -= gravity * delta;
  y += vel * delta;

  if (y < 0) { y = 0; vel = 0; }

  player.style.bottom = y + "px";
  player.style.transform = `rotate(${y * 1.2}deg)`;

  score += Math.floor(delta * 100);
  scoreEl.textContent = score;

  requestAnimationFrame(loop);
}

function spawnObstacle() {
  if (over) return;

  const obs = document.createElement("div");
  obs.classList.add("obstacle");

  const types = ["spike","double-spike","block","tall-block","mine"];
  obs.classList.add(types[Math.floor(Math.random()*types.length)]);

  game.appendChild(obs);

  let x = -80;

  const move = setInterval(() => {
    if (over) {
      clearInterval(move);
      obs.remove();
      return;
    }

    x += speed / 60;
    obs.style.right = x + "px";

    const o = obs.getBoundingClientRect();
    const p = player.getBoundingClientRect();

    if (p.right > o.left && p.left < o.right && p.bottom > o.top) {
      gameOver();
    }

    if (x > game.offsetWidth + 120) {
      clearInterval(move);
      obs.remove();
    }
  }, 16);

  setTimeout(spawnObstacle, 1400);
}

function changeTheme() {
  game.classList.remove(themes[themeIndex]);
  themeIndex = (themeIndex + 1) % themes.length;
  game.classList.add(themes[themeIndex]);
}

function gameOver() {
  over = true;
  center.innerHTML = `💀 GAME OVER 💀<br>Score: ${score}<br><small>Tap pre reštart</small>`;
  center.style.display = "flex";
  game.addEventListener("click", () => location.reload(), { once: true });
}
</script>

</body>
</html>
