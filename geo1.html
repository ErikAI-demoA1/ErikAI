<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry Dash PRO</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
}

body {
  margin: 0;
  background: radial-gradient(circle at top, #222, #000);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
}

#game {
  position: relative;
  width: 90vw;
  max-width: 700px;
  height: 250px;
  background: linear-gradient(#1a1a1a, #000);
  border: 3px solid cyan;
  overflow: hidden;
  border-radius: 12px;
  box-shadow: 0 0 25px cyan;
}

#player {
  position: absolute;
  width: 32px;
  height: 32px;
  background: linear-gradient(45deg, cyan, #00ffff);
  bottom: 0;
  left: 60px;
  transform: rotate(0deg);
  border-radius: 6px;
}

.obstacle {
  position: absolute;
  width: 32px;
  height: 60px;
  background: linear-gradient(45deg, red, darkred);
  bottom: 0;
  right: -40px;
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
}

#ui {
  position: absolute;
  top: 8px;
  left: 10px;
  font-size: 14px;
}

#centerText {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  background: rgba(0,0,0,0.6);
  display: none;
  text-align: center;
}
</style>
</head>

<body>

<div id="game">
  <div id="player"></div>

  <div id="ui">
    Score: <span id="score">0</span>
  </div>

  <div id="centerText">
    TAP / SPACE<br>
    <small>na štart</small>
  </div>
</div>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreEl = document.getElementById("score");
const centerText = document.getElementById("centerText");

let position = 0;
let velocity = 0;
let gravity = 0.9;
let jumpPower = 15;
let isStarted = false;
let isGameOver = false;
let score = 0;
let speed = 5;

function startGame() {
  if (isStarted) return;
  isStarted = true;
  centerText.style.display = "none";
  gameLoop();
  obstacleLoop();
}

function jump() {
  if (!isStarted) startGame();
  if (position === 0) {
    velocity = jumpPower;
  }
}

// PC
document.addEventListener("keydown", e => {
  if (e.code === "Space") jump();
});

// mobil + myš
game.addEventListener("click", jump);
game.addEventListener("touchstart", jump);

function gameLoop() {
  if (isGameOver) return;

  velocity -= gravity;
  position += velocity;

  if (position < 0) {
    position = 0;
    velocity = 0;
  }

  player.style.bottom = position + "px";
  player.style.transform = `rotate(${position * 2}deg)`;

  score++;
  scoreEl.textContent = score;

  // zrýchľovanie
  if (score % 300 === 0) speed += 0.5;

  requestAnimationFrame(gameLoop);
}

function obstacleLoop() {
  if (isGameOver) return;

  const obs = document.createElement("div");
  obs.className = "obstacle";
  game.appendChild(obs);

  let x = game.offsetWidth + 40;

  const move = setInterval(() => {
    if (isGameOver) {
      clearInterval(move);
      obs.remove();
      return;
    }

    x -= speed;
    obs.style.right = x + "px";

    const obsRect = obs.getBoundingClientRect();
    const plRect = player.getBoundingClientRect();

    // kolízia
    if (
      plRect.right > obsRect.left &&
      plRect.left < obsRect.right &&
      plRect.bottom > obsRect.top
    ) {
      gameOver();
    }

    if (x < -60) {
      clearInterval(move);
      obs.remove();
    }
  }, 16);

  setTimeout(obstacleLoop, 1400);
}

function gameOver() {
  isGameOver = true;
  centerText.innerHTML = `💀 GAME OVER 💀<br>Score: ${score}<br><small>Tap pre restart</small>`;
  centerText.style.display = "flex";

  game.addEventListener("click", () => location.reload(), { once: true });
}
</script>

</body>
</html>
