<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry Dash PRO+</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
}

body {
  margin: 0;
  background: radial-gradient(circle at top, #222, #000);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
}

#game {
  position: relative;
  width: 90vw;
  max-width: 800px;
  height: 260px;
  background: linear-gradient(#1a1a1a, #000);
  border: 3px solid cyan;
  overflow: hidden;
  border-radius: 14px;
  box-shadow: 0 0 30px cyan;
}

#player {
  position: absolute;
  width: 34px;
  height: 34px;
  background: linear-gradient(45deg, cyan, #00ffff);
  bottom: 0;
  left: 100px; /* VIAC DOĽAVA = LEPŠÍ VÝHĽAD */
  border-radius: 6px;
}

.obstacle {
  position: absolute;
  width: 34px;
  height: 65px;
  background: linear-gradient(45deg, red, darkred);
  bottom: 0;
  right: -80px;
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
}

#ui {
  position: absolute;
  top: 10px;
  left: 12px;
  font-size: 15px;
}

#centerText {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: rgba(0,0,0,0.65);
  font-size: 24px;
}
</style>
</head>

<body>

<div id="game">
  <div id="player"></div>

  <div id="ui">
    Score: <span id="score">0</span>
  </div>

  <div id="centerText">
    TAP / SPACE<br>
    <small>štart hry</small>
  </div>
</div>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreEl = document.getElementById("score");
const centerText = document.getElementById("centerText");

let posY = 0;
let velocity = 0;
let gravity = 0.9;
let jumpPower = 16;
let started = false;
let gameOver = false;
let score = 0;
let speed = 5;

function startGame() {
  if (started) return;
  started = true;
  centerText.style.display = "none";
  gameLoop();
  setTimeout(obstacleLoop, 2000); // ⏱️ ONESKORENIE PRVEJ PREKÁŽKY
}

function jump() {
  if (!started) startGame();
  if (posY === 0) {
    velocity = jumpPower;
  }
}

// PC
document.addEventListener("keydown", e => {
  if (e.code === "Space") jump();
});

// mobil + myš
game.addEventListener("click", jump);
game.addEventListener("touchstart", jump);

function gameLoop() {
  if (gameOver) return;

  velocity -= gravity;
  posY += velocity;

  if (posY < 0) {
    posY = 0;
    velocity = 0;
  }

  player.style.bottom = posY + "px";
  player.style.transform = `rotate(${posY * 2}deg)`;

  score++;
  scoreEl.textContent = score;

  if (score % 400 === 0) speed += 0.5;

  requestAnimationFrame(gameLoop);
}

function obstacleLoop() {
  if (gameOver) return;

  const obs = document.createElement("div");
  obs.className = "obstacle";
  game.appendChild(obs);

  let x = -80; // ide ZPRAVA DOĽAVA
  obs.style.right = x + "px";

  const move = setInterval(() => {
    if (gameOver) {
      clearInterval(move);
      obs.remove();
      return;
    }

    x += speed;
    obs.style.right = x + "px";

    const o = obs.getBoundingClientRect();
    const p = player.getBoundingClientRect();

    if (
      p.right > o.left &&
      p.left < o.right &&
      p.bottom > o.top
    ) {
      endGame();
    }

    if (x > game.offsetWidth + 100) {
      clearInterval(move);
      obs.remove();
    }
  }, 16);

  setTimeout(obstacleLoop, 1500);
}

function endGame() {
  gameOver = true;
  centerText.innerHTML = `💀 GAME OVER 💀<br>Score: ${score}<br><small>Tap pre restart</small>`;
  centerText.style.display = "flex";
  game.addEventListener("click", () => location.reload(), { once: true });
}
</script>

</body>
</html>
