<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON FLOW</title>

<style>
*{box-sizing:border-box;user-select:none}
body{
  margin:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial,sans-serif;
}

#game{
  position:relative;
  width:92vw;
  max-width:900px;
  height:320px;
  border-radius:20px;
  overflow:hidden;
  border:3px solid #5fdfff;
  box-shadow:0 0 40px rgba(95,223,255,.4);
}

.theme1{background:linear-gradient(#0f2027,#203a43)}
.theme2{background:linear-gradient(#141e30,#243b55)}
.theme3{background:linear-gradient(#134e5e,#1c7c7c)}
.theme4{background:linear-gradient(#232526,#414345)}

#player{
  position:absolute;
  width:36px;height:36px;
  left:130px;
  bottom:0;
  border-radius:6px;
  box-shadow:0 0 12px rgba(255,255,255,.7);
}

#ui{
  position:absolute;
  top:12px;left:16px;
  color:#dff9fb;
  font-size:14px;
}

.screen{
  position:absolute;inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.65);
  color:white;text-align:center;
}

button{
  margin:6px;padding:10px 22px;
  border:none;border-radius:8px;
  background:#5fdfff;color:#000;
  font-weight:bold;cursor:pointer;
}

.obstacle{
  position:absolute;
  right:-160px;
  transition:background 1.5s linear;
}

/* BASIC SHAPES */
.spike{
  width:26px;height:40px;
  clip-path:polygon(50% 0%,0% 100%,100% 100%);
}
.block{
  width:30px;height:30px;border-radius:6px;
}
.tall{
  width:30px;height:80px;border-radius:6px;
}

/* LANE WALL – nechá iba jednu dráhu */
.laneWall{
  width:60px;
  height:100%;
  background:#ff4757;
  opacity:.9;
}

/* LANE ZONES (neviditeľné, len pre logiku) */
.lane-low{bottom:0}
.lane-mid{bottom:70px}
.lane-high{bottom:140px}
</style>
</head>

<body>

<div id="game" class="theme1">
  <div id="player"></div>

  <div id="ui">
    Level: <span id="lvl">1</span><br>
    Score: <span id="score">0</span>
  </div>

  <div id="menu" class="screen">
    <h1>NEON FLOW</h1>
    <button onclick="startGame()">START</button>
  </div>

  <div id="over" class="screen" style="display:none"></div>
</div>

<script>
/* ===== ELEMENTY ===== */
const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreEl = document.getElementById("score");
const lvlEl = document.getElementById("lvl");
const menu = document.getElementById("menu");
const over = document.getElementById("over");

/* ===== PLAYER ===== */
let y=0, vel=0;
const gravity=1800, jump=640;

/* ===== GAME ===== */
let speed=300, score=0, level=1;
let last=null, dead=false;
let lane = 0; // 0 low, 1 mid, 2 high

/* ===== COLORS ===== */
const obstacleColors = [
  "#ff6b6b","#feca57","#48dbfb","#1dd1a1","#5f27cd"
];

/* ===== START ===== */
function startGame(){
  menu.style.display="none";
  requestAnimationFrame(loop);
  setTimeout(spawnObstacle,1500);
  setInterval(changeTheme,8000);
}

/* ===== INPUT ===== */
document.addEventListener("keydown",e=>{
  if(e.code==="Space") jumpPlayer();
});
game.addEventListener("click",jumpPlayer);
game.addEventListener("touchstart",jumpPlayer);

function jumpPlayer(){
  if(y===0&&!dead){
    vel=jump;
    lane = Math.min(2, lane+1);
  }
}

/* ===== LOOP ===== */
function loop(t){
  if(dead)return;
  if(!last)last=t;
  const dt=(t-last)/1000; last=t;

  vel-=gravity*dt;
  y+=vel*dt;

  if(y<=0){y=0;vel=0;lane=0}

  player.style.bottom=y+"px";
  player.style.transform=`rotate(${y*1.2}deg)`;

  score+=Math.floor(dt*120);
  scoreEl.textContent=score;

  if(score%1200===0){
    level++;
    speed+=30;
  }
  lvlEl.textContent=level;

  requestAnimationFrame(loop);
}

/* ===== SPAWN PREKÁŽOK ===== */
function spawnObstacle(){
  if(dead)return;

  const obs=document.createElement("div");
  obs.classList.add("obstacle");

  const typeRand=Math.random();

  if(typeRand<0.6){
    obs.classList.add(["spike","block","tall"][Math.random()*3|0]);
    obs.classList.add(["lane-low","lane-mid","lane-high"][Math.random()*3|0]);
  }else{
    obs.classList.add("laneWall");
    const safeLane=Math.random()*3|0;
    obs.safeLane=safeLane;
  }

  obs.style.background=obstacleColors[Math.random()*obstacleColors.length|0];
  game.appendChild(obs);

  let x=-160;
  const move=setInterval(()=>{
    if(dead){clearInterval(move);obs.remove();return}
    x+=speed/60;
    obs.style.right=x+"px";

    // jemná zmena farby
    obs.style.background=
      obstacleColors[(Math.random()*obstacleColors.length)|0];

    const o=obs.getBoundingClientRect();
    const p=player.getBoundingClientRect();

    if(obs.classList.contains("laneWall")){
      if(p.right>o.left && p.left<o.right){
        if(lane!==obs.safeLane) gameOver();
      }
    }else{
      if(p.right>o.left&&p.left<o.right&&p.bottom>o.top+6){
        gameOver();
      }
    }

    if(x>game.offsetWidth+200){
      clearInterval(move);
      obs.remove();
    }
  },16);

  setTimeout(spawnObstacle,1200);
}

/* ===== THEME ===== */
let theme=0;
function changeTheme(){
  game.className="theme"+((++theme)%4+1);
}

/* ===== END ===== */
function gameOver(){
  dead=true;
  over.style.display="flex";
  over.innerHTML=`
    💀 GAME OVER 💀<br>
    Score: ${score}<br>
    <button onclick="location.reload()">Menu</button>
  `;
}
</script>

</body>
</html>
