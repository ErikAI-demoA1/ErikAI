<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON FLOW</title>

<style>
*{box-sizing:border-box;user-select:none}
body{
  margin:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial,sans-serif;
}

#game{
  position:relative;
  width:92vw;
  max-width:880px;
  height:320px;
  border-radius:20px;
  overflow:hidden;
  border:3px solid #5fdfff;
  box-shadow:0 0 40px rgba(95,223,255,.4);
  transition:background 4s linear;
}

/* THEMES */
.theme1{background:linear-gradient(#0f2027,#203a43)}
.theme2{background:linear-gradient(#141e30,#243b55)}
.theme3{background:linear-gradient(#134e5e,#1c7c7c)}
.theme4{background:linear-gradient(#232526,#414345)}

/* PLAYER – EXCLUSIVE WOW */
#player{
  position:absolute;
  width:36px;
  height:36px;
  left:130px;
  bottom:20px;
  border-radius:10px;

  background:linear-gradient(135deg,#5fdfff,#9b59b6,#00f2fe);
  background-size:300% 300%;
  animation: playerGlow 4s linear infinite;

  box-shadow:
    0 0 14px rgba(95,223,255,.9),
    0 0 32px rgba(155,89,182,.7);
}

@keyframes playerGlow{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* FLOOR */
.floor{
  position:absolute;
  bottom:0;
  height:20px;
  width:200%;
  background:linear-gradient(90deg,#1c7c7c,#5fdfff,#1c7c7c);
}

/* TRAIL */
.trail{
  position:absolute;
  width:16px;
  height:4px;
  background:rgba(255,255,255,.7);
  border-radius:4px;
  pointer-events:none;
}

/* UI */
#ui{
  position:absolute;
  top:12px;left:16px;
  color:#dff9fb;
  font-size:14px;
}

#progressBox{
  width:120px;height:6px;
  background:#222;border-radius:4px;margin-top:4px
}
#progress{
  height:100%;width:0%;
  background:#5fdfff;border-radius:4px
}

/* SCREENS */
.screen{
  position:absolute;inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.65);
  color:white;text-align:center;
}

button{
  margin:6px;padding:10px 22px;
  border:none;border-radius:8px;
  background:#5fdfff;color:#000;
  font-weight:bold;cursor:pointer;
}

input{
  margin:6px;padding:8px;
  border-radius:6px;border:none;
}

/* LEVEL SCROLL */
#levels{
  overflow-y:auto;
  max-height:85%;
  padding-bottom:20px;
}

/* OBSTACLES – NEON PRO */
.obstacle{
  position:absolute;
  bottom:20px;
  right:-140px;

  background:linear-gradient(135deg,#ff6b6b,#feca57,#48dbfb);
  background-size:300% 300%;
  animation: obstacleShift 3s linear infinite;

  box-shadow:
    0 0 14px rgba(255,255,255,.6),
    0 0 28px rgba(255,255,255,.8);
}

@keyframes obstacleShift{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.spike{width:26px;height:40px;clip-path:polygon(50% 0%,0% 100%,100% 100%)}
.block{width:28px;height:28px;border-radius:8px}
.tall{width:28px;height:52px;border-radius:8px}
.double{width:44px;height:40px;clip-path:polygon(0% 100%,25% 0%,50% 100%,75% 0%,100% 100%)}
</style>
</head>

<body>

<div id="game" class="theme1">
  <div class="floor" id="floor"></div>
  <div id="player"></div>

  <div id="ui">
    Player: <span id="playerName">---</span><br>
    Level: <span id="lvl">1</span><br>
    Score: <span id="score">0</span>
    <div id="progressBox"><div id="progress"></div></div>
  </div>

  <button id="soundBtn" style="position:absolute;top:12px;right:16px">🔇 Sound OFF</button>

  <audio id="tickSound" preload="auto" loop>
    <source src="zvuk6normal.mp3" type="audio/mpeg">
  </audio>

  <div id="menu" class="screen">
    <h1>NEON FLOW</h1>
    <input id="nameInput" placeholder="Your name" maxlength="12">
    <button onclick="startEndless()">Endless Run</button>
    <button onclick="showLevels()">Select Level</button>
    <button onclick="showCustomize()">Customize</button>
    <p id="welcome"></p>
  </div>

  <div id="levels" class="screen" style="display:none">
    <h2>Select Level</h2>
    <div id="levelButtons"></div>
    <button onclick="back()">Back</button>
  </div>

  <div id="custom" class="screen" style="display:none">
    <h2>Player Color</h2>
    <input type="color" id="colorPick">
    <button onclick="saveColor()">Save</button>
    <button onclick="back()">Back</button>
  </div>

  <div id="over" class="screen" style="display:none"></div>
</div>

<script>
/* PROFILE */
let profile=JSON.parse(localStorage.getItem("neonProfile"))||{name:"",color:"#5fdfff",bestScore:0};
localStorage.setItem("neonProfile",JSON.stringify(profile));

/* ELEMENTS */
const game=document.getElementById("game");
const player=document.getElementById("player");
const floor=document.getElementById("floor");
const scoreEl=document.getElementById("score");
const lvlEl=document.getElementById("lvl");
const menu=document.getElementById("menu");
const levels=document.getElementById("levels");
const custom=document.getElementById("custom");
const over=document.getElementById("over");
const picker=document.getElementById("colorPick");
const progress=document.getElementById("progress");
const nameInput=document.getElementById("nameInput");
const welcome=document.getElementById("welcome");
const nameUI=document.getElementById("playerName");
const levelButtons=document.getElementById("levelButtons");

/* SOUND */
const tickSound=document.getElementById("tickSound");
const soundBtn=document.getElementById("soundBtn");
let soundOn=false;
soundBtn.onclick=()=>{
  soundOn=!soundOn;
  soundOn?(tickSound.play(),soundBtn.textContent="🔊 Sound ON")
         :(tickSound.pause(),soundBtn.textContent="🔇 Sound OFF");
};
function stopSound(){tickSound.pause();tickSound.currentTime=0;soundOn=false}

/* GAME VARS */
let y=0,vel=0,gravity=1800,jump=640;
let speed=300,score=0,level=1,last=null,dead=false,mode="endless",goal=0;
let rot=0,rotSpeed=0,floorX=0;
const themes=["theme1","theme2","theme3","theme4"];

/* INPUT */
document.addEventListener("keydown",e=>e.code==="Space"&&jumpPlayer());
game.addEventListener("click",jumpPlayer);

function jumpPlayer(){
  if(y===0&&!dead){
    vel=jump;
    rotSpeed=900;
  }
}

/* LOOP */
function loop(t){
  if(dead)return;
  if(!last)last=t;
  let dt=(t-last)/1000;last=t;

  vel-=gravity*dt;y+=vel*dt;
  if(y<0){y=0;vel=0}

  rot+=rotSpeed*dt;
  rotSpeed*=0.98;
  player.style.transform=`rotate(${rot}deg)`;
  player.style.bottom=(y+20)+"px";

  floorX-=speed*dt;
  floor.style.transform=`translateX(${floorX}px)`;
  if(floorX<-game.offsetWidth)floorX=0;

  score+=Math.floor(dt*120);
  scoreEl.textContent=score;
  lvlEl.textContent=level;

  requestAnimationFrame(loop);
}

/* OBSTACLES + TOP COLLISION */
function spawn(){
  if(dead)return;
  const obs=document.createElement("div");
  const types=["spike","block","tall","double"];
  obs.className="obstacle "+types[Math.random()*types.length|0];
  obs.style.filter=`hue-rotate(${level*35}deg)`;
  game.appendChild(obs);

  let x=-140;
  const move=setInterval(()=>{
    if(dead){clearInterval(move);obs.remove();return}
    x+=speed/60;obs.style.right=x+"px";

    const o=obs.getBoundingClientRect();
    const p=player.getBoundingClientRect();

    const overlapX=p.right>o.left&&p.left<o.right;
    const hitFromTop=p.bottom<=o.top+14&&vel<=0;

    if(overlapX){
      if(hitFromTop){
        y=o.height-2;
        vel=0;
      }else{
        gameOver();
      }
    }

    if(x>game.offsetWidth+160){clearInterval(move);obs.remove()}
  },16);

  setTimeout(spawn,1200);
}

function gameOver(){
  stopSound();
  dead=true;
  over.style.display="flex";
  over.innerHTML=`💀 GAME OVER<br>Score: ${score}<br><button onclick="location.reload()">Menu</button>`;
}

/* START */
function startEndless(){
  menu.style.display="none";
  dead=false;score=0;y=0;vel=0;
  spawn();requestAnimationFrame(loop);
}
</script>

</body>
                                                 </html>
