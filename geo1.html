<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Geometry Dash Mini</title>
  <style>
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial;
      color: white;
    }

    #game {
      position: relative;
      width: 600px;
      height: 200px;
      background: linear-gradient(#222, #000);
      overflow: hidden;
      border: 2px solid #0ff;
    }

    #player {
      position: absolute;
      width: 30px;
      height: 30px;
      background: cyan;
      bottom: 0;
      left: 50px;
    }

    .obstacle {
      position: absolute;
      width: 30px;
      height: 50px;
      background: red;
      bottom: 0;
      right: -30px;
    }

    #info {
      position: absolute;
      top: 5px;
      left: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div id="game">
  <div id="player"></div>
  <div id="info">SPACE = skok</div>
</div>

<script>
  const player = document.getElementById("player");
  const game = document.getElementById("game");

  let isJumping = false;
  let gravity = 0.9;
  let position = 0;
  let gameOver = false;

  function jump() {
    if (isJumping) return;
    let upInterval = setInterval(() => {
      if (position >= 100) {
        clearInterval(upInterval);
        let downInterval = setInterval(() => {
          if (position <= 0) {
            clearInterval(downInterval);
            isJumping = false;
          }
          position -= 5;
          position = position * gravity;
          player.style.bottom = position + "px";
        }, 20);
      }
      isJumping = true;
      position += 20;
      player.style.bottom = position + "px";
    }, 20);
  }

  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") jump();
  });

  function createObstacle() {
    if (gameOver) return;

    const obstacle = document.createElement("div");
    obstacle.classList.add("obstacle");
    game.appendChild(obstacle);

    let obstaclePosition = 600;
    obstacle.style.right = obstaclePosition + "px";

    let moveInterval = setInterval(() => {
      if (obstaclePosition > 600) {
        game.removeChild(obstacle);
        clearInterval(moveInterval);
      }

      // kolízia
      if (
        obstaclePosition > 500 &&
        obstaclePosition < 530 &&
        position < 50
      ) {
        clearInterval(moveInterval);
        gameOver = true;
        alert("💀 GAME OVER 💀");
        location.reload();
      }

      obstaclePosition += 5;
      obstacle.style.right = obstaclePosition + "px";
    }, 20);
  }

  setInterval(createObstacle, 2000);
</script>

</body>
</html>
