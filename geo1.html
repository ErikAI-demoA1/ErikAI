<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON FLOW</title>

<style>
*{box-sizing:border-box;user-select:none}
body{
  margin:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial,sans-serif;
}
#game{
  position:relative;
  width:90vw;
  max-width:860px;
  height:300px;
  border-radius:18px;
  overflow:hidden;
  border:3px solid #5fdfff;
  box-shadow:0 0 40px rgba(95,223,255,.4);
  transition:background 4s linear;
}
.theme1{background:linear-gradient(#0f2027,#203a43)}
.theme2{background:linear-gradient(#141e30,#243b55)}
.theme3{background:linear-gradient(#134e5e,#1c7c7c)}
.theme4{background:linear-gradient(#232526,#414345)}

#player{
  position:absolute;
  width:34px;height:34px;
  left:120px;bottom:0;
  border-radius:6px;
  box-shadow:0 0 12px rgba(255,255,255,.6);
}

#ui{
  position:absolute;
  top:12px;left:16px;
  font-size:14px;color:#dff9fb;
}

.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  background:rgba(0,0,0,.6);
  color:white;text-align:center;
}
button{
  margin:6px;padding:10px 20px;
  border:none;border-radius:6px;
  background:#5fdfff;color:#000;
  font-weight:bold;cursor:pointer;
}
input[type=color]{margin-top:10px}

.obstacle{position:absolute;bottom:0;right:-120px}
.spike{width:24px;height:36px;background:#ff6b6b;clip-path:polygon(50% 0%,0% 100%,100% 100%)}
.block{width:26px;height:26px;background:#ff9f43;border-radius:5px}
.tall{width:26px;height:50px;background:#ffa502;border-radius:5px}
.double{width:40px;height:36px;background:#ff6b6b;clip-path:polygon(0% 100%,25% 0%,50% 100%,75% 0%,100% 100%)}
</style>
</head>

<body>

<div id="game" class="theme1">
  <div id="player"></div>
  <div id="ui">
    Level: <span id="lvl">1</span><br>
    Score: <span id="score">0</span>
  </div>

  <!-- MENU -->
  <div id="menu" class="screen">
    <h1>NEON FLOW</h1>
    <button onclick="startGame(1)">Free Run</button>
    <button onclick="showLevels()">Select Level</button>
    <button onclick="showCustomize()">Customize</button>
  </div>

  <!-- LEVEL SELECT -->
  <div id="levels" class="screen" style="display:none">
    <h2>Select Start Level</h2>
    <button onclick="startGame(1)">Level 1</button>
    <button onclick="startGame(3)">Level 3</button>
    <button onclick="startGame(5)">Level 5</button>
    <button onclick="back()">Back</button>
  </div>

  <!-- CUSTOMIZE -->
  <div id="custom" class="screen" style="display:none">
    <h2>Player Color</h2>
    <input type="color" id="colorPick">
    <button onclick="saveColor()">Save</button>
    <button onclick="back()">Back</button>
  </div>

  <!-- GAME OVER -->
  <div id="over" class="screen" style="display:none"></div>
</div>

<script>
const game=document.getElementById("game");
const player=document.getElementById("player");
const scoreEl=document.getElementById("score");
const lvlEl=document.getElementById("lvl");
const menu=document.getElementById("menu");
const levels=document.getElementById("levels");
const custom=document.getElementById("custom");
const over=document.getElementById("over");
const picker=document.getElementById("colorPick");

const themes=["theme1","theme2","theme3","theme4"];
let theme=0;

let y=0,vel=0,gravity=1800,jump=620;
let speed=300,score=0,level=1;
let started=false,dead=false,last=null;

player.style.background=localStorage.getItem("color")||"#5fdfff";
picker.value=player.style.background;

function showLevels(){menu.style.display="none";levels.style.display="flex"}
function showCustomize(){menu.style.display="none";custom.style.display="flex"}
function back(){menu.style.display="flex";levels.style.display="none";custom.style.display="none"}

function saveColor(){
  localStorage.setItem("color",picker.value);
  player.style.background=picker.value;
}

function startGame(lvl){
  menu.style.display=levels.style.display=custom.style.display="none";
  level=lvl;speed+=lvl*60;
  started=true;
  setTimeout(spawn,2000);
  requestAnimationFrame(loop);
  setInterval(()=>{game.className=themes[++theme%themes.length]},8000);
}

document.addEventListener("keydown",e=>{if(e.code==="Space") jumpPlayer()});
game.addEventListener("click",jumpPlayer);

function jumpPlayer(){
  if(!started)return;
  if(y===0){vel=jump;if(navigator.vibrate)navigator.vibrate(15)}
}

function loop(t){
  if(dead)return;
  if(!last)last=t;
  let dt=(t-last)/1000;last=t;

  vel-=gravity*dt;
  y+=vel*dt;
  if(y<0){y=0;vel=0}

  player.style.bottom=y+"px";
  player.style.transform=`rotate(${y*1.1}deg)`;

  score+=Math.floor(dt*100);
  scoreEl.textContent=score;

  if(score%800===0){level++;speed+=40}
  lvlEl.textContent=level;

  requestAnimationFrame(loop);
}

function spawn(){
  if(dead)return;
  const obs=document.createElement("div");
  obs.classList.add("obstacle");
  const types=level<3?["spike","block"]:level<6?["spike","block","tall"]:["spike","block","tall","double"];
  obs.classList.add(types[Math.random()*types.length|0]);
  game.appendChild(obs);

  let x=-120;
  const move=setInterval(()=>{
    if(dead){clearInterval(move);obs.remove();return}
    x+=speed/60;obs.style.right=x+"px";

    const o=obs.getBoundingClientRect(),p=player.getBoundingClientRect();
    if(p.right-4>o.left&&p.left+4<o.right&&p.bottom>o.top+6) gameOver();
    if(x>game.offsetWidth+150){clearInterval(move);obs.remove()}
  },16);

  setTimeout(spawn,1300);
}

function gameOver(){
  dead=true;
  over.style.display="flex";
  over.innerHTML=`GAME OVER<br>Score: ${score}<br><button onclick="location.reload()">Restart</button>`;
}
</script>

</body>
    </html>
