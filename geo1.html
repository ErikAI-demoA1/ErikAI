<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON FLOW</title>

<style>
*{box-sizing:border-box;user-select:none}
body{
  margin:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial,sans-serif;
}

#game{
  position:relative;
  width:92vw;
  max-width:880px;
  height:320px;
  border-radius:20px;
  overflow:hidden;
  border:3px solid #5fdfff;
  box-shadow:0 0 40px rgba(95,223,255,.4);
  transition:background 4s linear;
}

.theme1{background:linear-gradient(#0f2027,#203a43)}
.theme2{background:linear-gradient(#141e30,#243b55)}
.theme3{background:linear-gradient(#134e5e,#1c7c7c)}
.theme4{background:linear-gradient(#232526,#414345)}

#player{
  position:absolute;
  width:36px;height:36px;
  left:130px;
  bottom:0;
  border-radius:6px;
  box-shadow:0 0 12px rgba(255,255,255,.7);
}

.platform{
  position:absolute;
  height:20px;
  background:#1c7c7c;
  border-radius:6px;
}

#ui{
  position:absolute;
  top:12px;left:16px;
  color:#dff9fb;
  font-size:14px;
}

#progressBox{
  width:120px;height:6px;
  background:#222;border-radius:4px;margin-top:4px
}
#progress{
  height:100%;width:0%;
  background:#5fdfff;border-radius:4px
}

.screen{
  position:absolute;inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.65);
  color:white;text-align:center;
}

button{
  margin:6px;padding:10px 22px;
  border:none;border-radius:8px;
  background:#5fdfff;color:#000;
  font-weight:bold;cursor:pointer;
}

input{
  margin:6px;padding:8px;
  border-radius:6px;border:none;
}

.obstacle{position:absolute;bottom:0;right:-140px}
.spike{width:26px;height:40px;background:#ff6b6b;clip-path:polygon(50% 0%,0% 100%,100% 100%)}
.block{width:28px;height:28px;background:#ff9f43;border-radius:6px}
.tall{width:28px;height:52px;background:#ffa502;border-radius:6px}
.double{width:44px;height:40px;background:#ff6b6b;clip-path:polygon(0% 100%,25% 0%,50% 100%,75% 0%,100% 100%)}
</style>
</head>

<body>

<div id="game" class="theme1">
  <div id="player"></div>

  <div id="ui">
    Player: <span id="playerName">---</span><br>
    Level: <span id="lvl">1</span><br>
    Score: <span id="score">0</span>
    <div id="progressBox"><div id="progress"></div></div>
  </div>

  <button id="soundBtn" style="position:absolute;top:12px;right:16px;">🔇 Sound OFF</button>

  <audio id="tickSound" preload="auto" loop>
    <source src="zvuk6normal.mp3" type="audio/mpeg">
  </audio>

  <div id="menu" class="screen">
    <h1>NEON FLOW</h1>
    <input id="nameInput" placeholder="Your name" maxlength="12">
    <button onclick="startEndless()">Endless Run</button>
    <button onclick="showLevels()">Select Level</button>
    <button onclick="showCustomize()">Customize</button>
    <p id="welcome"></p>
  </div>

  <div id="levels" class="screen" style="display:none"></div>

  <div id="custom" class="screen" style="display:none">
    <h2>Player Color</h2>
    <input type="color" id="colorPick">
    <button onclick="saveColor()">Save</button>
    <button onclick="back()">Back</button>
  </div>

  <div id="over" class="screen" style="display:none"></div>
</div>

<script>
let profile=JSON.parse(localStorage.getItem("neonProfile"))||{name:"",color:"#5fdfff",bestScore:0};
localStorage.setItem("neonProfile",JSON.stringify(profile));

const game=document.getElementById("game");
const player=document.getElementById("player");
const scoreEl=document.getElementById("score");
const lvlEl=document.getElementById("lvl");
const menu=document.getElementById("menu");
const levels=document.getElementById("levels");
const custom=document.getElementById("custom");
const over=document.getElementById("over");
const picker=document.getElementById("colorPick");
const progress=document.getElementById("progress");
const nameInput=document.getElementById("nameInput");
const welcome=document.getElementById("welcome");
const nameUI=document.getElementById("playerName");

player.style.background=profile.color;
picker.value=profile.color;
nameInput.value=profile.name;
nameUI.textContent=profile.name||"---";
if(profile.name)welcome.textContent="Welcome back, "+profile.name;

levels.innerHTML="<h2>Select Level</h2>";
for(let i=1;i<=10;i++){
  let b=document.createElement("button");
  b.textContent="Level "+i;
  b.onclick=()=>startLevel(i);
  levels.appendChild(b);
}
levels.innerHTML+='<button onclick="back()">Back</button>';

function showLevels(){menu.style.display="none";levels.style.display="flex"}
function showCustomize(){menu.style.display="none";custom.style.display="flex"}
function back(){menu.style.display="flex";levels.style.display="none";custom.style.display="none"}

let y=0,vel=0,onGround=false;
let gravity=1800,jump=640;
let speed=300,score=0,level=1;
let last=null,dead=false,mode="endless",goal=0;
let diffTimer=0;

function spawnPlatform(w=220,yPos=0){
  const p=document.createElement("div");
  p.className="platform";
  p.style.width=w+"px";
  p.style.bottom=yPos+"px";
  p.style.right="-"+w+"px";
  game.appendChild(p);
  let x=-w;
  const m=setInterval(()=>{
    if(dead){clearInterval(m);p.remove();return;}
    x+=speed/60;
    p.style.right=x+"px";
    if(x>game.offsetWidth+w){clearInterval(m);p.remove();}
  },16);
}

function startEndless(){startGame("endless",1)}
function startLevel(l){startGame("level",l)}

function startGame(m,l){
  menu.style.display=levels.style.display=custom.style.display="none";
  mode=m;level=l;
  speed=300+l*50;
  goal=l*3000+4000;
  score=0;y=0;vel=0;dead=false;last=null;

  document.querySelectorAll(".platform,.obstacle").forEach(e=>e.remove());

  for(let i=0;i<6;i++) setTimeout(()=>spawnPlatform(),i*600);
  setTimeout(spawn,3000);
  requestAnimationFrame(loop);
}

document.addEventListener("keydown",e=>{if(e.code==="Space")jumpPlayer()});
game.addEventListener("click",jumpPlayer);

function jumpPlayer(){
  if(onGround&&!dead){
    vel=jump;
    onGround=false;
  }
}

function loop(t){
  if(dead)return;
  if(!last)last=t;
  let dt=(t-last)/1000;last=t;

  vel-=gravity*dt;
  y+=vel*dt;
  onGround=false;

  document.querySelectorAll(".platform").forEach(p=>{
    const pr=p.getBoundingClientRect();
    const pl=player.getBoundingClientRect();
    if(pl.bottom<=pr.top+12&&pl.bottom>=pr.top-12&&pl.right>pr.left+6&&pl.left<pr.right-6&&vel<=0){
      y=game.clientHeight-pr.top-36;
      vel=0;onGround=true;
    }
  });

  if(y<0){y=0;vel=0;onGround=true}
  player.style.bottom=y+"px";

  score+=Math.floor(dt*120);
  scoreEl.textContent=score;
  if(mode==="level"){
    progress.style.width=Math.min(100,score/goal*100)+"%";
    if(score>=goal)return levelComplete();
  }

  lvlEl.textContent=level;
  requestAnimationFrame(loop);
}

function spawn(){
  if(dead)return;
  const o=document.createElement("div");
  o.className="obstacle spike";
  game.appendChild(o);
  let x=-140;
  const m=setInterval(()=>{
    if(dead){clearInterval(m);o.remove();return;}
    x+=speed/60;o.style.right=x+"px";
    const a=o.getBoundingClientRect(),b=player.getBoundingClientRect();
    if(b.right>a.left&&b.left<a.right&&b.bottom>a.top+6)gameOver();
    if(x>game.offsetWidth+160){clearInterval(m);o.remove();}
  },16);
  setTimeout(spawn,1200);
}

function gameOver(){
  dead=true;
  over.style.display="flex";
  over.innerHTML=`💀 GAME OVER<br>Score:${score}<br><button onclick="location.reload()">Menu</button>`;
}

function levelComplete(){
  dead=true;
  over.style.display="flex";
  over.innerHTML=`✅ LEVEL COMPLETE<br><button onclick="location.reload()">Menu</button>`;
}
</script>

</body>
  </html>
