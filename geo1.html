<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry Dash PRO Safe</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
}

body {
  margin: 0;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial, sans-serif;
}

#game {
  position: relative;
  width: 90vw;
  max-width: 800px;
  height: 260px;
  overflow: hidden;
  border-radius: 16px;
  border: 3px solid #5fdfff;
  transition: background 3s linear;
}

/* jemné farebné témy */
.theme1 { background: linear-gradient(#0f2027, #203a43); }
.theme2 { background: linear-gradient(#1a2a6c, #2c5364); }
.theme3 { background: linear-gradient(#134e5e, #1c7c7c); }
.theme4 { background: linear-gradient(#232526, #414345); }

#player {
  position: absolute;
  width: 34px;
  height: 34px;
  left: 100px;
  bottom: 0;
  background: linear-gradient(45deg, #5fdfff, #9ffcff);
  border-radius: 6px;
}

/* SPOLOČNÉ */
.obstacle {
  position: absolute;
  bottom: 0;
  right: -60px;
}

/* TYPY PREKÁŽOK */
.triangle {
  width: 26px;
  height: 40px;
  background: #ff6b6b;
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
}

.block {
  width: 26px;
  height: 26px;
  background: #ff9f43;
  border-radius: 4px;
}

.spike {
  width: 40px;
  height: 18px;
  background: repeating-linear-gradient(
    90deg,
    #ff7675,
    #ff7675 6px,
    #c0392b 6px,
    #c0392b 12px
  );
  border-radius: 4px;
}

#ui {
  position: absolute;
  top: 10px;
  left: 14px;
  color: #dff9fb;
  font-size: 15px;
}

#center {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: rgba(0,0,0,0.5);
  color: white;
  font-size: 22px;
}
</style>
</head>

<body>

<div id="game" class="theme1">
  <div id="player"></div>
  <div id="ui">Score: <span id="score">0</span></div>
  <div id="center">TAP / SPACE<br><small>štart</small></div>
</div>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreEl = document.getElementById("score");
const center = document.getElementById("center");

let y = 0, vel = 0;
let gravity = 0.9;
let jumpPower = 15;
let speed = 4.5;
let score = 0;
let started = false;
let over = false;

const themes = ["theme1","theme2","theme3","theme4"];
let themeIndex = 0;

function start() {
  if (started) return;
  started = true;
  center.style.display = "none";
  loop();
  setTimeout(spawnObstacle, 2000);
  setInterval(changeTheme, 6000);
}

function jump() {
  if (!started) start();
  if (y === 0) {
    vel = jumpPower;
    // jemná zmena farby pri skoku
    changeTheme();
  }
}

document.addEventListener("keydown", e => {
  if (e.code === "Space") jump();
});
game.addEventListener("click", jump);
game.addEventListener("touchstart", jump);

function loop() {
  if (over) return;

  vel -= gravity;
  y += vel;
  if (y < 0) { y = 0; vel = 0; }

  player.style.bottom = y + "px";
  player.style.transform = `rotate(${y * 1.5}deg)`;

  score++;
  scoreEl.textContent = score;

  requestAnimationFrame(loop);
}

function spawnObstacle() {
  if (over) return;

  const obs = document.createElement("div");
  obs.classList.add("obstacle");

  const types = ["triangle","block","spike"];
  obs.classList.add(types[Math.floor(Math.random()*types.length)]);

  game.appendChild(obs);

  let x = -60;
  const move = setInterval(() => {
    if (over) {
      clearInterval(move);
      obs.remove();
      return;
    }

    x += speed;
    obs.style.right = x + "px";

    const o = obs.getBoundingClientRect();
    const p = player.getBoundingClientRect();

    if (p.right > o.left && p.left < o.right && p.bottom > o.top) {
      gameOver();
    }

    if (x > game.offsetWidth + 100) {
      clearInterval(move);
      obs.remove();
    }
  }, 16);

  setTimeout(spawnObstacle, 1400);
}

function changeTheme() {
  game.classList.remove(themes[themeIndex]);
  themeIndex = (themeIndex + 1) % themes.length;
  game.classList.add(themes[themeIndex]);
}

function gameOver() {
  over = true;
  center.innerHTML = `💀 GAME OVER 💀<br>Score: ${score}<br><small>Tap pre reštart</small>`;
  center.style.display = "flex";
  game.addEventListener("click", () => location.reload(), { once: true });
}
</script>

</body>
</html>
