<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ErikAI Vision</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#101114;
  color:#fff;
  font-family:Arial,sans-serif
}
.app{
  max-width:720px;
  margin:auto;
  padding:15px
}
h1{margin:4px 0}
.sub{color:#999;margin-bottom:14px}
.preview{
  width:100%;
  aspect-ratio:4/3;
  background:#1b1d22;
  border-radius:18px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center
}
#image,#video{
  width:100%;
  height:100%;
  object-fit:contain;
  display:none
}
#placeholder{color:#777;text-align:center}
.controls{
  display:flex;
  gap:7px;
  margin:10px 0
}
button,.upload{
  flex:1;
  border:0;
  border-radius:11px;
  padding:13px 7px;
  background:#252830;
  color:#fff;
  font-size:14px;
  text-align:center
}
.primary{background:#356df3}
button:disabled{opacity:.45}
.status{
  color:#aaa;
  min-height:22px;
  margin:11px 0
}
.result{
  display:none;
  background:#1b1d22;
  border-radius:16px;
  padding:15px
}
.result h2{margin:0 0 12px}
.answer{
  font-size:22px;
  font-weight:bold;
  margin-bottom:5px
}
.confidence{
  color:#72a0ff;
  margin-bottom:14px
}
.item{
  padding:10px 0;
  border-bottom:1px solid #303238
}
.item:last-child{border:0}
.score{
  float:right;
  color:#72a0ff
}
.search{
  display:flex;
  gap:7px;
  margin-top:9px
}
.search a{
  flex:1;
  padding:9px;
  background:#292c34;
  color:#fff;
  border-radius:9px;
  text-align:center;
  text-decoration:none
}
#deep{
  display:none;
  margin-top:10px
}
.small{
  color:#666;
  font-size:12px;
  margin-top:12px
}
</style>
</head>

<body>

<div class="app">

<h1>👁️ ErikAI Vision</h1>
<div class="sub">Hierarchické AI rozpoznávanie</div>

<div class="preview">
  <img id="image">
  <video id="video" autoplay playsinline></video>
  <span id="placeholder">📷 Vyber alebo odfoť obrázok</span>
</div>

<div class="controls">

<label class="upload">
🖼️ Fotka
<input id="file" type="file" accept="image/*" hidden>
</label>

<button id="camera">📷 Kamera</button>

<button id="snap" class="primary" hidden>
📸 Odfotiť
</button>

</div>

<button id="analyze" class="primary" disabled>
🤖 Analyzovať
</button>

<button id="deep">
🧠 Analyzovať podrobnejšie
</button>

<div id="status" class="status">
⏳ Načítavam AI...
</div>

<div id="result" class="result"></div>

<div class="small">
ErikAI Vision • AI výsledky sú odhady
</div>

</div>


<script type="module">

import {
  pipeline,
  env
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1/+esm";

env.useBrowserCache = true;
env.allowLocalModels = false;


/* =========================
   ELEMENTY
========================= */

const img = document.getElementById("image");
const video = document.getElementById("video");
const file = document.getElementById("file");
const camera = document.getElementById("camera");
const snap = document.getElementById("snap");
const analyze = document.getElementById("analyze");
const deep = document.getElementById("deep");
const status = document.getElementById("status");
const result = document.getElementById("result");
const placeholder = document.getElementById("placeholder");

let ai = null;
let stream = null;
let currentImage = null;
let lastCategory = null;


/* =========================
   HIERARCHIA
========================= */

const categories = {

  "človek": [
    "a person",
    "a portrait",
    "a group of people",
    "a person doing sports"
  ],

  "zviera": [
    "a dog",
    "a cat",
    "a bird",
    "a horse",
    "a wild animal",
    "another animal"
  ],

  "auto": [
    "a car",
    "a sports car",
    "a racing car",
    "an SUV",
    "a van",
    "a truck"
  ],

  "bicykel": [
    "a bicycle",
    "a mountain bike",
    "a road bike",
    "an electric bicycle"
  ],

  "motorka": [
    "a motorcycle",
    "a scooter",
    "a racing motorcycle"
  ],

  "topánka": [
    "a sneaker",
    "a running shoe",
    "a football boot",
    "a hiking shoe",
    "a boot",
    "a sandal",
    "a slipper",
    "another type of shoe"
  ],

  "oblečenie": [
    "a t-shirt",
    "a shirt",
    "a jacket",
    "a hoodie",
    "trousers",
    "shorts",
    "a dress",
    "a hat"
  ],

  "telefón": [
    "a smartphone",
    "an iPhone",
    "an Android phone",
    "a foldable phone",
    "another mobile phone"
  ],

  "počítač": [
    "a laptop",
    "a desktop computer",
    "a computer monitor",
    "a keyboard",
    "a computer mouse"
  ],

  "televízor": [
    "a television",
    "a smart TV",
    "a computer monitor"
  ],

  "fotoaparát": [
    "a digital camera",
    "a DSLR camera",
    "a mirrorless camera",
    "an action camera"
  ],

  "hodinky": [
    "a smartwatch",
    "a wristwatch",
    "a sports watch"
  ],

  "nábytok": [
    "a chair",
    "a table",
    "a sofa",
    "a bed",
    "a desk"
  ],

  "jedlo": [
    "food",
    "pizza",
    "a hamburger",
    "fruit",
    "vegetables",
    "a dessert"
  ],

  "fľaša": [
    "a water bottle",
    "a glass bottle",
    "a plastic bottle",
    "a drink"
  ],

  "budova": [
    "a house",
    "an apartment building",
    "an office building",
    "a shop",
    "another building"
  ],

  "elektronika": [
    "electronic equipment",
    "a speaker",
    "headphones",
    "a computer",
    "another electronic device"
  ],

  "predmet": [
    "a tool",
    "a toy",
    "a book",
    "a box",
    "a bag",
    "another object"
  ]

};


/* =========================
   HLAVNÉ KATEGÓRIE
========================= */

const mainLabels = Object.keys(categories);


/* =========================
   NAČÍTANIE AI
========================= */

async function loadAI(){

  status.textContent =
    "🤖 Načítavam AI...";

  try{

    ai = await pipeline(
      "zero-shot-image-classification",
      "Xenova/clip-vit-base-patch32",
      {
        device:navigator.gpu
          ? "webgpu"
          : "wasm"
      }
    );

    status.textContent =
      "✅ AI pripravená";

  }catch(e){

    console.error(e);

    status.textContent =
      "❌ AI sa nepodarilo načítať: " +
      (e.message || e);

  }

}

loadAI();


/* =========================
   OBRÁZOK
========================= */

function showImage(src){

  img.src = src;

  img.onload = ()=>{

    img.style.display = "block";
    video.style.display = "none";
    placeholder.style.display = "none";

    currentImage = img;

    analyze.disabled = false;

    result.style.display = "none";
    deep.style.display = "none";

  };

}


/* =========================
   UPLOAD
========================= */

file.onchange = e=>{

  const f = e.target.files[0];

  if(!f)return;

  showImage(URL.createObjectURL(f));

  if(stream){

    stream.getTracks().forEach(
      t=>t.stop()
    );

    stream = null;

  }

  camera.textContent = "📷 Kamera";
  snap.hidden = true;

};


/* =========================
   KAMERA
========================= */

camera.onclick = async()=>{

  if(stream){

    stream.getTracks().forEach(
      t=>t.stop()
    );

    stream = null;

    video.style.display = "none";
    img.style.display = "block";

    snap.hidden = true;

    camera.textContent =
      "📷 Kamera";

    return;

  }

  try{

    stream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          }
        },

        audio:false

      });

    video.srcObject = stream;

    img.style.display = "none";
    video.style.display = "block";

    placeholder.style.display = "none";

    snap.hidden = false;

    camera.textContent =
      "✖ Zavrieť";

  }catch(e){

    status.textContent =
      "❌ Kamera nie je dostupná.";

  }

};


/* =========================
   FOTO
========================= */

snap.onclick = ()=>{

  if(!stream)return;

  const c =
    document.createElement("canvas");

  c.width =
    video.videoWidth;

  c.height =
    video.videoHeight;

  c.getContext("2d")
   .drawImage(
     video,
     0,
     0,
     c.width,
     c.height
   );

  showImage(
    c.toDataURL(
      "image/jpeg",
      .9
    )
  );

  stream.getTracks().forEach(
    t=>t.stop()
  );

  stream = null;

  snap.hidden = true;
  camera.textContent =
    "📷 Kamera";

};


/* =========================
   PRÍPRAVA OBRÁZKU
========================= */

async function prepare(){

  await new Promise(
    r=>{
      if(currentImage.complete)
        r();
      else
        currentImage.onload=r;
    }
  );

  const c =
    document.createElement("canvas");

  const max = 1024;

  let w =
    currentImage.naturalWidth;

  let h =
    currentImage.naturalHeight;

  const scale =
    Math.min(
      1,
      max/Math.max(w,h)
    );

  w = Math.round(w*scale);
  h = Math.round(h*scale);

  c.width = w;
  c.height = h;

  c.getContext("2d")
   .drawImage(
     currentImage,
     0,
     0,
     w,
     h
   );

  return c;

}


/* =========================
   AI HODNOTENIE
========================= */

async function classify(
  image,
  labels
){

  const output =
    await ai(
      image,
      labels
    );

  return output
    .sort(
      (a,b)=>
        b.score-a.score
    );

}


/* =========================
   HLAVNÁ ANALÝZA
========================= */

analyze.onclick = async()=>{

  if(!ai){

    status.textContent =
      "⏳ AI ešte nie je pripravená.";

    return;

  }

  if(!currentImage)return;

  analyze.disabled = true;

  deep.style.display = "none";
  result.style.display = "none";

  try{

    const image =
      await prepare();


    /* 1. HLAVNÁ KATEGÓRIA */

    status.textContent =
      "🔍 Zisťujem, čo je na obrázku...";


    const mainCandidates =
      mainLabels.map(
        x=>"a "+x
      );


    const main =
      await classify(
        image,
        mainCandidates
      );


    const best =
      main[0];


    lastCategory =
      best.label
        .replace(/^a /,"");


    const confidence =
      best.score;


    console.log(
      "MAIN:",
      main
    );


    /* 2. AK JE ISTOTA NÍZKA */

    if(confidence < .20){

      showUncertain(main);

      deep.style.display =
        "block";

      analyze.disabled = false;

      return;

    }


    /* 3. DRUHÁ ÚROVEŇ */

    status.textContent =
      "🧠 Spresňujem: "+
      lastCategory+"...";


    const candidates =
      categories[lastCategory] ||
      categories["predmet"];


    const details =
      await classify(
        image,
        candidates
      );


    showDetailed(
      lastCategory,
      details
    );


    status.textContent =
      "✅ Analýza dokončená.";

  }catch(e){

    console.error(e);

    status.textContent =
      "❌ Chyba: "+
      (e.message||e);

  }

  analyze.disabled = false;

};


/* =========================
   NEISTÝ VÝSLEDOK
========================= */

function showUncertain(data){

  result.innerHTML =
    "<h2>🤔 Nie som si úplne istá</h2>"+
    "<p>Najpravdepodobnejšie možnosti:</p>";

  data.slice(0,5).forEach(
    (x,i)=>{

      const div =
        document.createElement("div");

      div.className =
        "item";

      div.innerHTML =
        `<b>${i+1}. ${x.label}</b>
         <span class="score">
         ${(x.score*100).toFixed(1)}%
         </span>`;

      result.appendChild(div);

    }
  );

  result.style.display =
    "block";

}


/* =========================
   DETAILNÝ VÝSLEDOK
========================= */

function showDetailed(
  category,
  data
){

  const best =
    data[0];

  const name =
    best.label
      .replace(/^a /,"")
      .replace(/^an /,"");


  result.innerHTML = `

    <h2>🎯 Rozpoznanie</h2>

    <div class="answer">
      ${name}
    </div>

    <div class="confidence">
      AI skóre:
      ${(best.score*100).toFixed(1)}%
    </div>

    <div>
      Kategória:
      <b>${category}</b>
    </div>

    <div class="search">

      <a
        target="_blank"
        href="https://www.google.com/search?q=${encodeURIComponent(name)}"
      >
        🔎 Google
      </a>

      <a
        target="_blank"
        href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(name)}"
      >
        🖼️ Obrázky
      </a>

    </div>

    <h3>Ďalšie možnosti</h3>

  `;


  data.slice(1,5).forEach(
    (x,i)=>{

      const div =
        document.createElement("div");

      div.className =
        "item";

      const n =
        x.label
          .replace(/^a /,"")
          .replace(/^an /,"");

      div.innerHTML =
        `<b>${i+2}. ${n}</b>
         <span class="score">
         ${(x.score*100).toFixed(1)}%
         </span>`;

      result.appendChild(div);

    }
  );


  result.style.display =
    "block";

}


/* =========================
   HLBŠIA ANALÝZA
========================= */

deep.onclick = async()=>{

  if(!ai || !currentImage)return;

  deep.disabled = true;

  try{

    status.textContent =
      "🧠 Robím hlbšiu analýzu...";


    const image =
      await prepare();


    /*
      Ak si AI nie je istá,
      porovnáme viac všeobecných
      kategórií naraz.
    */

    const extra = [

      "a person",
      "an animal",
      "a vehicle",
      "a shoe",
      "clothing",
      "a smartphone",
      "a computer",
      "a television",
      "a camera",
      "furniture",
      "food",
      "a building",
      "electronics",
      "a household object",
      "another object"

    ];


    const output =
      await classify(
        image,
        extra
      );


    showUncertain(output);

    status.textContent =
      "✅ Hlbšia analýza hotová.";

  }catch(e){

    console.error(e);

    status.textContent =
      "❌ Hlbšia analýza zlyhala.";

  }

  deep.disabled = false;

};

</script>

</body>
</html>
