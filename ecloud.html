<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI — Ultra Obfuscated Shield v5</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #030712;
    --card-glass: rgba(17, 24, 39, 0.92);
    --card-border: rgba(255, 255, 255, 0.1);
    --neon-orange: #f97316;
    --neon-green: #22c55e;
    --neon-red: #ef4444;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-deep);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .shield-card {
    width: 100%;
    max-width: 500px;
    background: var(--card-glass);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 10px; }
  p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; line-height: 1.5; }

  .shield-box {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .shield-status { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; font-weight: 600; }

  .shield-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--neon-orange);
    box-shadow: 0 0 10px var(--neon-orange);
    transition: all 0.3s;
  }

  .shield-dot.passed { background: var(--neon-green); box-shadow: 0 0 12px var(--neon-green); }
  .shield-dot.failed { background: var(--neon-red); box-shadow: 0 0 12px var(--neon-red); }

  .btn-verify {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid var(--card-border);
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
  }

  .btn-continue {
    width: 100%;
    padding: 14px;
    background: linear-gradient(90deg, #22c55e, #16a34a);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-weight: 800;
    font-size: 1rem;
    opacity: 0.4;
    cursor: not-allowed;
    transition: all 0.3s;
  }

  .btn-active {
    opacity: 1 !important;
    cursor: pointer !important;
    box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3);
  }

  .challenge-overlay {
    display: none;
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(3, 7, 18, 0.97);
    backdrop-filter: blur(15px);
    padding: 20px;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  .challenge-title { font-size: 1.1rem; color: var(--neon-red); font-weight: 800; margin-bottom: 5px; }
  .challenge-desc { font-size: 0.85rem; color: var(--text-main); margin-bottom: 10px; text-align: center; }
  .penalty-counter { font-size: 0.75rem; color: var(--neon-orange); margin-bottom: 12px; font-weight: 700; }

  .challenge-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    width: 100%;
    max-height: 260px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .challenge-btn {
    padding: 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: #fff;
    font-weight: 700;
    font-size: 0.75rem;
    cursor: pointer;
  }

  .challenge-btn:hover { background: rgba(255, 255, 255, 0.15); }
</style>
</head>
<body ontouchmove="_0xTRK(event)" onmousemove="_0xTRK(event)">

  <div class="shield-card">
    <h2>🛡️ ErikAI Security Štít v5</h2>
    <p>Šifrovaný biometrický štít s neobmedzeným generovaním výziev.</p>

    <div class="shield-box">
      <div class="shield-status">
        <div class="shield-dot" id="shieldDot"></div>
        <span id="shieldText">Monitorujem správanie...</span>
      </div>
      <button type="button" class="btn-verify" onclick="_0xRUN()">Overiť</button>
    </div>

    <button type="button" id="continueBtn" class="btn-continue" onclick="_0xGO()" disabled>
      🔒 Čaká sa na overenie...
    </button>

    <div class="challenge-overlay" id="challengeOverlay">
      <div class="challenge-title">⚠️ Vyžaduje sa potvrdenie identity</div>
      <div class="challenge-desc" id="challengePromptText">Generujem zadanie...</div>
      <div class="penalty-counter" id="penaltyCounterText">Obtiažnosť: 10 možností</div>
      
      <div class="challenge-grid" id="challengeGridContainer"></div>
    </div>
  </div>

<script>
  // Zašifrovaná databáza základných objektov (Base64) - bot z HTML nevie ľahko prečítať texty
  const _0xENC_DATA = [
    "🟩 Zelený Štvorec", "🔴 Červený Kruh", "🔵 Modrý Trojuholník", 
    "⭐ Žltá Hviezda", "🟣 Fialový Kosočtverec", "🟠 Oranžový Mesiac", 
    "💖 Ružové Srdce", "⚡ Čierny Blesk", "🌲 Hnedý Strom", 
    "⚓ Sivá Kotva", "⚔️ Zlatý Meč", "👑 Strieborná Koruna"
  ].map(str => btoa(unescape(encodeURIComponent(str))));

  const _0xT0 = Date.now();
  let _0xPOS = [];
  let _0xOK = false;
  let _0xBOT = false;
  let _0xHASH = "";
  let _0xCNT = 10;

  function _0xTRK(e) {
    if (_0xOK) return;
    const x = e.clientX || (e.touches && e.touches[0].clientX);
    const y = e.clientY || (e.touches && e.touches[0].clientY);
    if (x && y) _0xPOS.push({ x, y, t: Date.now() });
    if (_0xPOS.length > 10) _0xEVAL();
  }

  function _0xEVAL() {
    let lin = 0;
    for (let i = 1; i < _0xPOS.length; i++) {
      if (_0xPOS[i].x === _0xPOS[i-1].x || _0xPOS[i].y === _0xPOS[i-1].y) lin++;
    }
    if (lin > 7) _0xBOT = true;
  }

  function _0xRUN() {
    const elapsed = Date.now() - _0xT0;
    // Pravidlo 1: Klik pod 2 sekundy = podozrenie
    if (elapsed < 2000 || _0xBOT || _0xPOS.length < 3) {
      _0xGEN();
      return;
    }
    _0xPASS();
  }

  // Generátor nekonečných kombinácií (Farby, Symboly, PIN kódy, Frázy)
  function _0xGEN() {
    document.getElementById('shieldDot').className = "shield-dot failed";
    document.getElementById('shieldText').innerText = "Kontrola podozrenia...";
    document.getElementById('penaltyCounterText').innerText = `Úroveň obtiažnosti: ${_0xCNT} možností`;

    // Dekódovanie základných položiek z Base64
    let dynamicPool = _0xENC_DATA.map(item => decodeURIComponent(escape(atob(item))));

    // Pridanie nekonečných dynamických PIN kódov a fráz do balíka
    for (let i = 0; i < 15; i++) {
      let pin = Math.floor(1000 + Math.random() * 9000);
      dynamicPool.push(`🔑 Kód [${pin}]`);
    }

    // Náhodný výber cieľovej položky
    const target = dynamicPool[Math.floor(Math.random() * dynamicPool.length)];
    // Hash odpovede v pamäti (zabraňuje jednoduchému čítaniu premennej)
    _0xHASH = btoa(unescape(encodeURIComponent(target)));

    document.getElementById('challengePromptText').innerHTML = `Vyberte presnú položku:<br><strong style="font-size:1rem; color:#f97316;">${target}</strong>`;

    // Zostavenie náhodnej mriežky s požadovaným počtom možností (_0xCNT)
    let gridItems = [target];
    while (gridItems.length < _0xCNT) {
      let rnd = dynamicPool[Math.floor(Math.random() * dynamicPool.length)];
      if (!gridItems.includes(rnd)) gridItems.push(rnd);
    }

    // Náhodné zamiešanie tlačidiel (Shuffle)
    gridItems.sort(() => Math.random() - 0.5);

    const container = document.getElementById('challengeGridContainer');
    container.innerHTML = "";

    gridItems.forEach(txt => {
      const btn = document.createElement('button');
      btn.className = "challenge-btn";
      btn.innerText = txt;
      btn.onclick = () => _0xCHK(btoa(unescape(encodeURIComponent(txt))));
      container.appendChild(btn);
    });

    document.getElementById('challengeOverlay').style.display = "flex";
  }

  function _0xCHK(val) {
    if (val === _0xHASH) {
      document.getElementById('challengeOverlay').style.display = "none";
      _0xPASS();
    } else {
      // Pri nesprávnej odpovedi sa zvýši počet možností a vygeneruje sa nová náhodná mriežka
      _0xCNT++;
      alert(`❌ Zlá odpoveď! Obtiažnosť stúpa na ${_0xCNT} možností.`);
      _0xGEN();
    }
  }

  function _0xPASS() {
    if (_0xOK) return;
    _0xOK = true;

    document.getElementById('shieldDot').className = "shield-dot passed";
    document.getElementById('shieldText').innerText = "✅ Overenie úspešné";

    const btn = document.getElementById('continueBtn');
    btn.disabled = false;
    btn.innerText = "🚀 Vstúpiť do systému";
    btn.classList.add('btn-active');
  }

  function _0xGO() {
    if (!_0xOK) return;
    alert("Prístup schválený! Vraciam vás do ErikAI OS.");
  }
</script>

</body>
</html>
