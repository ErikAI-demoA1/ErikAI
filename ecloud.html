<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI — Čistý Cloudflare Štít</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #030712;
    --card-glass: rgba(17, 24, 39, 0.85);
    --card-border: rgba(255, 255, 255, 0.1);
    --neon-orange: #f97316;
    --neon-green: #22c55e;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-deep);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .shield-card {
    width: 100%;
    max-width: 450px;
    background: var(--card-glass);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    text-align: center;
  }

  h2 {
    font-size: 1.5rem;
    font-weight: 800;
    margin-bottom: 10px;
  }

  p {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 25px;
    line-height: 1.5;
  }

  .shield-box {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .shield-status {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.85rem;
    font-weight: 600;
  }

  .shield-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--neon-orange);
    box-shadow: 0 0 10px var(--neon-orange);
    transition: all 0.3s;
  }

  .shield-dot.passed {
    background: var(--neon-green);
    box-shadow: 0 0 12px var(--neon-green);
  }

  .btn-verify {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid var(--card-border);
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
  }

  .btn-verify:hover { background: rgba(255, 255, 255, 0.2); }

  .btn-continue {
    width: 100%;
    padding: 14px;
    background: linear-gradient(90deg, #22c55e, #16a34a);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    opacity: 0.4;
    cursor: not-allowed;
    transition: all 0.3s;
  }

  .btn-active {
    opacity: 1 !important;
    cursor: pointer !important;
    box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3);
  }
</style>
</head>
<body ontouchmove="skontrolujInterakciu()" onmousemove="skontrolujInterakciu()">

  <div class="shield-card">
    <h2>🛡️ ErikAI Security Štít</h2>
    <p>Pre pokračovanie do systému prebehnite rýchlym bezpečnostným overením správania.</p>

    <div class="shield-box">
      <div class="shield-status">
        <div class="shield-dot" id="shieldDot"></div>
        <span id="shieldText">Overujem pohyb...</span>
      </div>
      <button type="button" class="btn-verify" onclick="manualneOverenie()">Overiť hneď</button>
    </div>

    <button type="button" id="continueBtn" class="btn-continue" onclick="vstupDoSystemu()" disabled>
      🔒 Čaká sa na overenie...
    </button>
  </div>

<script>
  let skoreInterakcie = 0;
  let stitPrekonany = false;

  // Sleduje pohyb myši alebo dotyk na mobile
  function skontrolujInterakciu() {
    if (stitPrekonany) return;
    skoreInterakcie++;
    if (skoreInterakcie > 3) {
      aktivujStit();
    }
  }

  function manualneOverenie() {
    aktivujStit();
  }

  function aktivujStit() {
    if (stitPrekonany) return;
    stitPrekonany = true;
    
    document.getElementById('shieldDot').classList.add('passed');
    document.getElementById('shieldText').innerText = "Overenie úspešné";
    
    const btn = document.getElementById('continueBtn');
    btn.disabled = false;
    btn.innerText = "🚀 Vstúpiť do systému";
    btn.classList.add('btn-active');
  }

  function vstupDoSystemu() {
    if (!stitPrekonany) return;
    alert("Úspešne prenesené cez Cloudflare štít! Tu môže nasledovať presmerovanie.");
    // window.location.href = "tvoja-dalsia-stranka.html";
  }
</script>

</body>
</html>
