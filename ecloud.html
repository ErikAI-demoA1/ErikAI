<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI — Pokročilý Multi-Level Štít</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #030712;
    --card-glass: rgba(17, 24, 39, 0.9);
    --card-border: rgba(255, 255, 255, 0.1);
    --neon-orange: #f97316;
    --neon-green: #22c55e;
    --neon-red: #ef4444;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-deep);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .shield-card {
    width: 100%;
    max-width: 480px;
    background: var(--card-glass);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 10px; }
  p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; }

  .shield-box {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .shield-status { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; font-weight: 600; }

  .shield-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--neon-orange);
    box-shadow: 0 0 10px var(--neon-orange);
    transition: all 0.3s;
  }

  .shield-dot.passed { background: var(--neon-green); box-shadow: 0 0 12px var(--neon-green); }
  .shield-dot.failed { background: var(--neon-red); box-shadow: 0 0 12px var(--neon-red); }

  .btn-verify {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid var(--card-border);
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
  }

  .btn-continue {
    width: 100%;
    padding: 14px;
    background: linear-gradient(90deg, #22c55e, #16a34a);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-weight: 800;
    font-size: 1rem;
    opacity: 0.4;
    cursor: not-allowed;
    transition: all 0.3s;
  }

  .btn-active {
    opacity: 1 !important;
    cursor: pointer !important;
    box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3);
  }

  /* MODÁLNE OKNO PRE EXTRÉMNU CAPTCHU */
  .challenge-overlay {
    display: none;
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(3, 7, 18, 0.96);
    backdrop-filter: blur(10px);
    padding: 20px;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  .challenge-title { font-size: 1.1rem; color: var(--neon-red); font-weight: 800; margin-bottom: 5px; }
  .challenge-desc { font-size: 0.8rem; color: var(--text-main); margin-bottom: 12px; text-align: center; }
  .penalty-counter { font-size: 0.75rem; color: var(--neon-orange); margin-bottom: 15px; font-weight: 700; }

  /* Mriežka pre 10+ tlačidiel, ktorá sa flexibilne prispôsobuje */
  .challenge-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    width: 100%;
    max-height: 280px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .challenge-btn {
    padding: 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: #fff;
    font-weight: 700;
    font-size: 0.75rem;
    cursor: pointer;
    transition: background 0.2s;
  }

  .challenge-btn:hover { background: rgba(255, 255, 255, 0.15); }
</style>
</head>
<body ontouchmove="zaznamenajPohyb(event)" onmousemove="zaznamenajPohyb(event)">

  <div class="shield-card">
    <h2>🛡️ ErikAI Security Štít v4</h2>
    <p>Pokročilý biometrický štít s rastúcou obtiažnosťou pri zlyhaní.</p>

    <div class="shield-box">
      <div class="shield-status">
        <div class="shield-dot" id="shieldDot"></div>
        <span id="shieldText">Sledujem správanie...</span>
      </div>
      <button type="button" class="btn-verify" onclick="manualneOverenie()">Overiť</button>
    </div>

    <button type="button" id="continueBtn" class="btn-continue" onclick="vstupDoSystemu()" disabled>
      🔒 Čaká sa na overenie...
    </button>

    <!-- EXTRÉMNA DYNAMICKÁ VÝZVA -->
    <div class="challenge-overlay" id="challengeOverlay">
      <div class="challenge-title">⚠️ Zistené podozrivé správanie</div>
      <div class="challenge-desc" id="challengePromptText">Vyberte správny prvok:</div>
      <div class="penalty-counter" id="penaltyCounterText">Počet možností: 10</div>
      
      <div class="challenge-grid" id="challengeGridContainer">
        <!-- Sem sa vygeneruje veľa možností -->
      </div>
    </div>
  </div>

<script>
  const casNacitania = Date.now();
  let zoznamPohybov = [];
  let stitPrekonany = false;
  let podozrenieBot = false;
  let spravnaOdpovedId = "";
  let aktualnyPocetMoznosti = 10; // Začíname na 10 možnostiach

  // Veľká databáza farieb, tvarov a mien pre 10+ výzvy
  const velkaBazaMoznosti = [
    { id: "zeleny_stvorec", nazov: "🟩 Zelený Štvorec" },
    { id: "cerveny_kruh", nazov: "🔴 Červený Kruh" },
    { id: "modry_trojuholnik", nazov: "🔵 Modrý Trojuholník" },
    { id: "zlta_hviezda", nazov: "⭐ Žltá Hviezda" },
    { id: "fialovy_kosoctverec", nazov: "🟣 Fialový Kosočtverec" },
    { id: "oranzovy_mesiac", nazov: "🟠 Oranžový Mesiac" },
    { id: "ruzove_srdce", nazov: "💖 Ružové Srdce" },
    { id: "biela_jednotka", nazov: "1️⃣ Biela Jednotka" },
    { id: "cierny_blesk", nazov: "⚡ Čierny Blesk" },
    { id: "hnedy_strom", nazov: "🌲 Hnedý Strom" },
    { id: "siva_kotva", nazov: "⚓ Sivá Kotva" },
    { id: "zlaty_mec", nazov: "⚔️ Zlatý Meč" },
    { id: "strieborna_koruna", nazov: "👑 Strieborná Koruna" },
    { id: "neviditelny_ohen", nazov: "🔥 Horiaci Oheň" },
    { id: "ledovy_kristal", nazov: "❄️ Ľadový Kryštál" }
  ];

  function zaznamenajPohyb(e) {
    if (stitPrekonany) return;

    const x = e.clientX || (e.touches && e.touches[0].clientX);
    const y = e.clientY || (e.touches && e.touches[0].clientY);

    if (x && y) {
      zoznamPohybov.push({ x, y, t: Date.now() });
    }

    if (zoznamPohybov.length > 10) {
      vyhodnotPohyby();
    }
  }

  function vyhodnotPohyby() {
    let rovneKroky = 0;
    for (let i = 1; i < zoznamPohybov.length; i++) {
      if (zoznamPohybov[i].x === zoznamPohybov[i-1].x || zoznamPohybov[i].y === zoznamPohybov[i-1].y) {
        rovneKroky++;
      }
    }
    if (rovneKroky > 7) {
      podozrenieBot = true;
    }
  }

  function manualneOverenie() {
    const ubehnutyCas = Date.now() - casNacitania;

    // PRAVIDLO 1: Ak klikne pred 2 sekundami, je automaticky podozrivý a ide do výzvy
    if (ubehnutyCas < 2000) {
      spustExtremnuVyzvu("Príliš rýchle kliknutie (pod 2s)");
      return;
    }

    // PRAVIDLO 2: Ak má podozrivé pohyby alebo sa vôbec nehýbal
    if (podozrenieBot || zoznamPohybov.length < 3) {
      spustExtremnuVyzvu("Neregulárne správanie myši/prsta");
      return;
    }

    // Ak prešiel čas aj pohybmi, schválime ho
    schvalOverenie();
  }

  function spustExtremnuVyzvu(dovod) {
    console.warn("Spúšťam výzvu. Dôvod:", dovod);
    document.getElementById('shieldDot').className = "shield-dot failed";
    document.getElementById('shieldText').innerText = "Vyžaduje sa potvrdenie...";

    // Aktualizácia počítadla možností v UI
    document.getElementById('penaltyCounterText').innerText = `Aktuálna obtiažnosť: ${aktualnyPocetMoznosti} možností`;

    // 1. Náhodne vyberieme správnu odpoveď
    const nahodnyCielIndex = Math.floor(Math.random() * velkaBazaMoznosti.length);
    const cielObjekt = velkaBazaMoznosti[nahodnyCielIndex];
    spravnaOdpovedId = cielObjekt.id;

    // 2. Nastavíme zadanie
    document.getElementById('challengePromptText').innerHTML = `Kliknite na požadovaný prvok: <br><strong style="font-size: 0.95rem; color: #f97316;">${cielObjekt.nazov}</strong>`;

    // 3. Zostavíme pole s presným počtom možností (aktualnyPocetMoznosti)
    let vybraneMoznosti = [cielObjekt];
    while (vybraneMoznosti.length < aktualnyPocetMoznosti) {
      let nahodnaItem = velkaBazaMoznosti[Math.floor(Math.random() * velkaBazaMoznosti.length)];
      if (!vybraneMoznosti.includes(nahodnaItem)) {
        vybraneMoznosti.push(nahodnaItem);
      }
    }

    // Premiešame poradie tlačidiel (Shuffle)
    vybraneMoznosti.sort(() => Math.random() - 0.5);

    // 4. Vykreslíme tlačidlá do mriežky
    const gridContainer = document.getElementById('challengeGridContainer');
    gridContainer.innerHTML = "";
    
    vybraneMoznosti.forEach(item => {
      const btn = document.createElement('button');
      btn.className = "challenge-btn";
      btn.innerText = item.nazov;
      btn.onclick = () => skontrolujOdpoved(item.id);
      gridContainer.appendChild(btn);
    });

    document.getElementById('challengeOverlay').style.display = "flex";
  }

  function skontrolujOdpoved(kliknuteId) {
    if (kliknuteId === spravnaOdpovedId) {
      // Úspech vo výzve
      document.getElementById('challengeOverlay').style.display = "none";
      schvalOverenie();
    } else {
      // CHYBA! Zvýšenie obtiažnosti o 1 a reštart výzvy
      aktualnyPocetMoznosti++;
      alert(`❌ Nesprávna voľba! Obtiažnosť sa zvyšuje na ${aktualnyPocetMoznosti} možností.`);
      spustExtremnuVyzvu("Chybná odpoveď");
    }
  }

  function schvalOverenie() {
    if (stitPrekonany) return;
    stitPrekonany = true;

    document.getElementById('shieldDot').className = "shield-dot passed";
    document.getElementById('shieldText').innerText = "✅ Overenie úspešné";

    const btn = document.getElementById('continueBtn');
    btn.disabled = false;
    btn.innerText = "🚀 Vstúpiť do systému";
    btn.classList.add('btn-active');
  }

  function vstupDoSystemu() {
    if (!stitPrekonany) return;
    alert("Prístup schválený! Vitajte v ErikAI OS.");
    // window.location.href = "tvoja-hlavna-stranka.html";
  }
</script>

</body>
</html>
