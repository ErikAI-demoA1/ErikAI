<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ErikAI OS — Oficiálne stiahnutie</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #0a0a0a, #000);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 40px 20px;
    }

    header {
      margin-bottom: 50px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #00b7ff, #00ffa3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: #aaa;
      font-size: 1.1rem;
    }

    .download-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px 20px;
      margin: 20px 0;
      width: 100%;
      max-width: 400px;
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .download-card:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(0, 255, 200, 0.2);
    }

    .app-title {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: #00ffc3;
    }

    .download-btn {
      display: inline-block;
      background: linear-gradient(90deg, #00ffc3, #00b7ff);
      color: #000;
      padding: 12px 30px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 15px;
      transition: opacity 0.25s ease, transform 0.2s ease;
    }

    .download-btn:hover {
      opacity: 0.8;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 60px;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>

  <header>
    <h1>ErikAI OS — Oficiálne Stiahnutie</h1>
    <p class="subtitle">Inovácia spájajúca mobil, web a systém v jednom</p>
  </header>

  <div class="download-card">
    <div class="app-title">ErikAI 25 — Most Aplikácia (3v1)</div>
    <a class="download-btn" href="APP_Download/Erikai25.apk" download>📱 Stiahnuť ErikAI 25</a>
  </div>

  <div class="download-card">
    <div class="app-title">ErikAI OS — Web & Core Systém</div>
    <a class="download-btn" href="APP_Download/ErikAI_OS.apk" download>💻 Stiahnuť ErikAI OS</a>
  </div>

  <footer>
    © 2025 ErikAI Technologies — Všetky práva vyhradené
  </footer>

</body>
</html>
