<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5️⃣ CSS Štýly</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      margin: 20px;
    }

    h1 {
      color: #0077cc;
    }

    p {
      line-height: 1.6;
    }

    .box {
      width: 150px;
      height: 150px;
      background-color: #ff6347;
      border: 3px solid #0077cc;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>5️⃣ CSS Štýly</h1>
  <p>Tu vidíš, ako CSS ovplyvňuje vzhľad HTML prvkov. Vlastnosti ako <strong>color</strong>, <strong>background-color</strong>, <strong>border</strong> a <strong>border-radius</strong> zmenia štýl textu a boxov.</p>

  <div class="box">Box</div>
  <p>Tento box je štýlovaný cez CSS. Môžeš meniť farby, veľkosti alebo zaoblenie rohov.</p>

  <p><a href="index.html">⬅️ Späť na menu</a></p>
</body>
</html>
