<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 ErikAI Video Editor Pro</title>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.0/dist/ffmpeg.min.js"></script>
<style>
  body { background: #111; color: #fff; font-family: sans-serif; text-align:center; padding:20px; }
  body.dark-mode { background: #121212; }
  input, button { padding: 8px; margin:5px; font-size:16px; }
  video { max-width: 100%; margin: 10px 0; border-radius:8px; }
  #downloadLink { display:block; margin-top:10px; color:#0f0; font-weight:bold; }
</style>
</head>
<body>

<h1>🎬 ErikAI Video Editor Pro</h1>
<button onclick="toggleTheme()">🌓 Zmeniť režim</button>
<p>Vyber video a nastav čas „Od“ a „Do“ (v sekundách) pre strih.</p>

<input type="file" id="videoInput" accept="video/*"><br>
<label>Od (s): </label><input type="number" id="startTime" value="0">
<label>Do (s): </label><input type="number" id="endTime" value="10"><br>
<button onclick="trimVideo()">✂️ Strihnúť video</button>

<h3>🎦 Náhľad videa</h3>
<video id="preview" controls></video>
<h3>🔽 Strihnuté video</h3>
<video id="outputVideo" controls></video>
<a id="downloadLink" href="#" download="erikai-strih.mp4">Stiahnuť video</a>

<p id="status"></p>

<script>
const { createFFmpeg, fetchFile } = FFmpeg;
const ffmpeg = createFFmpeg({ log:true });

let inputVideoFile;

document.getElementById('videoInput').addEventListener('change', async (e) => {
  inputVideoFile = e.target.files[0];
  const url = URL.createObjectURL(inputVideoFile);
  document.getElementById('preview').src = url;
});

function toggleTheme() { document.body.classList.toggle('dark-mode'); }

async function trimVideo() {
  if (!inputVideoFile) return alert("Prosím vyber video.");

  const start = parseFloat(document.getElementById('startTime').value);
  const end = parseFloat(document.getElementById('endTime').value);

  if (start >= end) return alert("Čas 'Od' musí byť menší než 'Do'.");

  document.getElementById('status').innerText = "⏳ Načítavam FFmpeg...";
  if (!ffmpeg.isLoaded()) await ffmpeg.load();

  document.getElementById('status').innerText = "⏳ Spracúvam video...";

  // Načítaj video do FFmpeg FS
  ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(inputVideoFile));

  // Strih videa presne od-do
  await ffmpeg.run(
    '-i', 'input.mp4',
    '-ss', start.toString(),
    '-to', end.toString(),
    '-c', 'copy',
    'output.mp4'
  );

  // Získaj výsledok
  const data = ffmpeg.FS('readFile', 'output.mp4');
  const videoURL = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));

  // Zobraz a umožni stiahnuť
  const outVid = document.getElementById('outputVideo');
  outVid.src = videoURL;
  const dl = document.getElementById('downloadLink');
  dl.href = videoURL;
  dl.style.display = 'block';

  document.getElementById('status').innerText = "✅ Video spracované!";
}
</script>

</body>
</html>
