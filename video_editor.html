<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎞️ ErikAI Trim & Export Fix</title>
<style>
body { font-family: Inter, Arial, sans-serif; background:#111; color:white; text-align:center; padding:20px; }
input, select, button { margin:5px; padding:8px; border-radius:6px; }
video { max-width: 100%; border:1px solid #333; border-radius:6px; background:black; }
canvas { display:none; }
.download { display:inline-block; margin-top:12px; padding:10px 14px; border-radius:10px; background:#10b981; color:white; text-decoration:none; font-weight:700; }
</style>
</head>
<body>

<h1>🎞️ ErikAI Video Trim & Export – Fix</h1>

<input type="file" id="videoFile" accept="video/*"><br>
<label>Od (s)</label>
<input type="number" id="startTime" value="0" step="0.01" min="0">
<label>Do (s)</label>
<input type="number" id="endTime" value="5" step="0.01" min="0"><br>
<label>FPS</label>
<select id="fpsSelect">
  <option value="30">30</option>
  <option value="24">24</option>
  <option value="15">15</option>
</select><br>

<button id="startBtn">✂️ Spustiť trim</button>
<div id="status">Stav: čakám na súbor</div>
<video id="preview" controls></video>
<a id="downloadLink" class="download" style="display:none;">⬇ Stiahnuť výsledok</a>

<canvas id="workCanvas"></canvas>

<script>
const videoFileInput = document.getElementById('videoFile');
const startBtn = document.getElementById('startBtn');
const preview = document.getElementById('preview');
const downloadLink = document.getElementById('downloadLink');
const status = document.getElementById('status');
const startTimeInput = document.getElementById('startTime');
const endTimeInput = document.getElementById('endTime');
const fpsSelect = document.getElementById('fpsSelect');
const canvas = document.getElementById('workCanvas');
const ctx = canvas.getContext('2d');

let fileURL, videoElement, mediaRecorder, recordedChunks = [];

videoFileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  if(fileURL) URL.revokeObjectURL(fileURL);
  fileURL = URL.createObjectURL(file);
  preview.src = fileURL;
  preview.load();
  status.textContent = `Načítané: ${file.name}`;
});

startBtn.addEventListener('click', async () => {
  if(!videoFileInput.files[0]) return alert('Vyber video súbor');
  const start = parseFloat(startTimeInput.value);
  const end = parseFloat(endTimeInput.value);
  const fps = parseInt(fpsSelect.value);

  if(start >= end) return alert('Štart musí byť menší než koniec');

  // priprav video element pre trim
  videoElement = document.createElement('video');
  videoElement.src = fileURL;
  videoElement.muted = true;
  videoElement.crossOrigin = "anonymous";

  await new Promise(res => videoElement.onloadedmetadata = res);

  canvas.width = videoElement.videoWidth;
  canvas.height = videoElement.videoHeight;

  const stream = canvas.captureStream(fps);
  const audioStream = videoElement.captureStream ? videoElement.captureStream().getAudioTracks() : [];
  const combinedStream = new MediaStream([...stream.getVideoTracks(), ...audioStream]);

  recordedChunks = [];
  mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm; codecs=vp8,opus' });
  mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = onRecordingComplete;

  status.textContent = 'Spúšťam trimovanie...';
  mediaRecorder.start();

  // presun na start
  videoElement.currentTime = start;
  await new Promise(res => {
    videoElement.addEventListener('seeked', res, {once:true});
  });

  videoElement.play();

  function renderFrame(){
    if(videoElement.currentTime >= end || videoElement.ended){
      videoElement.pause();
      mediaRecorder.stop();
      return;
    }
    ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
    requestAnimationFrame(renderFrame);
  }
  renderFrame();
});

function onRecordingComplete(){
  const blob = new Blob(recordedChunks, { type: 'video/webm' });
  const url = URL.createObjectURL(blob);
  downloadLink.href = url;
  downloadLink.style.display = 'inline-block';
  downloadLink.download = `trim-${Date.now()}.webm`;
  status.textContent = 'Trim dokončený — klikni na stiahnutie';
  preview.src = url;
}
</script>

</body>
</html>
