<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErikAI - Nuclear P2P Cipher (5x SHA + AES-256)</title>
  <style>
    :root {
      --bg: #090a0f;
      --card: #131722;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #10b981;
      --green-hover: #059669;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 100%);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 6px;
      color: #60a5fa;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 22px;
    }

    .input-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 3px;
      font-weight: 600;
    }

    textarea, input, select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b0d14;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }

    textarea { resize: vertical; min-height: 90px; }
    textarea:focus, input:focus, select:focus { border-color: var(--accent); }

    .passwords-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--border);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .advanced-box {
      background: rgba(59, 130, 246, 0.05);
      border: 1px solid rgba(59, 130, 246, 0.2);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .checkbox-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .timer-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      color: white;
    }

    .btn-enc { background: var(--accent); }
    .btn-enc:hover { background: var(--accent-hover); }

    .btn-dec { background: var(--green); }
    .btn-dec:hover { background: var(--green-hover); }

    .output-section {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .output-box {
      background: #0b0d14;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.82rem;
      color: #38bdf8;
      word-break: break-all;
      margin-top: 6px;
      min-height: 80px;
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    .btn-copy {
      background: var(--muted);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-copy:hover { background: #64748b; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🛡️ ErikAI Nuclear 5x SHA Cipher</h1>
    <p class="subtitle">5-stupňová kaskáda hesiel (5x SHA-256) + AES-256 + Časovač samozničenia</p>

    <div class="passwords-box">
      <div class="input-group">
        <label for="pass1">1. Tajné heslo:</label>
        <input type="password" id="pass1" placeholder="Zadaj 1. heslo...">
      </div>
      <div class="input-group">
        <label for="pass2">2. Tajné heslo:</label>
        <input type="password" id="pass2" placeholder="Zadaj 2. heslo...">
      </div>
      <div class="input-group">
        <label for="pass3">3. Tajné heslo:</label>
        <input type="password" id="pass3" placeholder="Zadaj 3. heslo...">
      </div>
      <div class="input-group">
        <label for="pass4">4. Tajné heslo:</label>
        <input type="password" id="pass4" placeholder="Zadaj 4. heslo...">
      </div>
      <div class="input-group">
        <label for="pass5">5. Tajné heslo:</label>
        <input type="password" id="pass5" placeholder="Zadaj 5. heslo...">
      </div>
    </div>

    <div class="advanced-box">
      <label class="checkbox-row">
        <input type="checkbox" id="enableExpiry" onclick="toggleExpiry()">
        <span>Aktivovať časovú expiráciu (samozničenie správy)</span>
      </label>
      <div id="expirySettings" style="display: none;" class="timer-row">
        <input type="number" id="expiryValue" value="15" min="1" style="flex: 2;">
        <select id="expiryUnit" style="flex: 3;">
          <option value="seconds">Sekúnd</option>
          <option value="minutes" selected>Minút</option>
          <option value="hours">Hodín</option>
          <option value="days">Dní</option>
        </select>
      </div>
    </div>

    <div class="input-group">
      <label for="inputText">Správa (alebo zašifrovaný kód):</label>
      <textarea id="inputText" placeholder="Sem napíš správu na zašifrovanie, alebo vlož kód na dešifrovanie..."></textarea>
    </div>

    <div class="btn-row">
      <button class="btn btn-enc" onclick="encryptMessage()">🔒 Zašifrovať</button>
      <button class="btn btn-dec" onclick="decryptMessage()">🔓 Odomknúť</button>
    </div>

    <div class="output-section">
      <div class="output-header">
        <label>Výsledok:</label>
        <button class="btn-copy" onclick="copyResult()">Kopírovať</button>
      </div>
      <div class="output-box" id="resultOutput">Zatiaľ tu nie je žiadny výsledok...</div>
    </div>
  </div>

  <script>
    function toggleExpiry() {
      const box = document.getElementById('expirySettings');
      const isChecked = document.getElementById('enableExpiry').checked;
      box.style.display = isChecked ? 'flex' : 'none';
    }

    // 5-stupňové kaskádové spojenie hesiel cez 5x SHA-256 do 1 finálneho AES kľúča
    async function get5ShaKey(p1, p2, p3, p4, p5) {
      const enc = new TextEncoder();

      const h1 = await crypto.subtle.digest('SHA-256', enc.encode(p1));
      const h2 = await crypto.subtle.digest('SHA-256', enc.encode(p2));
      const h3 = await crypto.subtle.digest('SHA-256', enc.encode(p3));
      const h4 = await crypto.subtle.digest('SHA-256', enc.encode(p4));
      const h5 = await crypto.subtle.digest('SHA-256', enc.encode(p5));

      // Spojíme 5 x 32 bajtov = 160 bajtov hrubej sily
      const megaCombined = new Uint8Array(160);
      megaCombined.set(new Uint8Array(h1), 0);
      megaCombined.set(new Uint8Array(h2), 32);
      megaCombined.set(new Uint8Array(h3), 64);
      megaCombined.set(new Uint8Array(h4), 96);
      megaCombined.set(new Uint8Array(h5), 128);

      // Finálne premiešanie cez SHA-256 pre presný 256-bitový AES kľúč
      const finalHash = await crypto.subtle.digest('SHA-256', megaCombined);

      return await crypto.subtle.importKey(
        "raw",
        finalHash,
        { name: "AES-GCM" },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptMessage() {
      try {
        const passwords = [
          document.getElementById('pass1').value,
          document.getElementById('pass2').value,
          document.getElementById('pass3').value,
          document.getElementById('pass4').value,
          document.getElementById('pass5').value
        ];
        const text = document.getElementById('inputText').value;
        const enableExpiry = document.getElementById('enableExpiry').checked;

        if (passwords.some(p => !p) || !text) {
          alert("Musíš vyplniť všetkých 5 hesiel a text správy!");
          return;
        }

        let expireTimestamp = 0;
        if (enableExpiry) {
          const val = parseFloat(document.getElementById('expiryValue').value);
          const unit = document.getElementById('expiryUnit').value;
          let multiplier = 1000;
          if (unit === 'minutes') multiplier = 60 * 1000;
          if (unit === 'hours') multiplier = 60 * 60 * 1000;
          if (unit === 'days') multiplier = 24 * 60 * 60 * 1000;
          expireTimestamp = Date.now() + (val * multiplier);
        }

        const payload = {
          m: text,
          exp: expireTimestamp
        };

        const key = await get5ShaKey(...passwords);
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encoded = new TextEncoder().encode(JSON.stringify(payload));

        const encrypted = await crypto.subtle.encrypt(
          { name: "AES-GCM", iv: iv },
          key,
          encoded
        );

        const combinedData = new Uint8Array(iv.length + new Uint8Array(encrypted).length);
        combinedData.set(iv);
        combinedData.set(new Uint8Array(encrypted), iv.length);

        const base64String = btoa(String.fromCharCode(...combinedData));
        document.getElementById('resultOutput').textContent = base64String;
      } catch (e) {
        alert("Chyba pri šifrovaní: " + e.message);
      }
    }

    async function decryptMessage() {
      try {
        const passwords = [
          document.getElementById('pass1').value,
          document.getElementById('pass2').value,
          document.getElementById('pass3').value,
          document.getElementById('pass4').value,
          document.getElementById('pass5').value
        ];
        const base64Text = document.getElementById('inputText').value.trim();

        if (passwords.some(p => !p) || !base64Text) {
          alert("Musíš zadať všetkých 5 hesiel a zašifrovaný kód!");
          return;
        }

        const key = await get5ShaKey(...passwords);
        const combinedData = Uint8Array.from(atob(base64Text), c => c.charCodeAt(0));
        const iv = combinedData.slice(0, 12);
        const encrypted = combinedData.slice(12);

        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv },
          key,
          encrypted
        );

        const decodedString = new TextDecoder().decode(decrypted);
        const payload = JSON.parse(decodedString);

        if (payload.exp && payload.exp > 0) {
          if (Date.now() > payload.exp) {
            document.getElementById('resultOutput').textContent = "💥 EXPIROVANÉ: Platnosť tejto správy už vypršala!";
            return;
          }
        }

        document.getElementById('resultOutput').textContent = payload.m;
      } catch (e) {
        document.getElementById('resultOutput').textContent = "❌ Chyba: Niektoré z 5 hesiel je nesprávne, alebo je kód poškodený!";
      }
    }

    function copyResult() {
      const text = document.getElementById('resultOutput').textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert("Skopírované do schránky!");
      });
    }
  </script>
</body>
</html>
