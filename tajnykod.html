<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErikAI - Nuclear Dynamic Cipher (Anti-Brute-Force)</title>
  <style>
    :root {
      --bg: #090a0f;
      --card: #131722;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #10b981;
      --green-hover: #059669;
      --red: #ef4444;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 100%);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 6px;
      color: #60a5fa;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 22px;
    }

    .input-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 3px;
      font-weight: 600;
    }

    textarea, input, select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b0d14;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }

    textarea { resize: vertical; min-height: 90px; }
    textarea:focus, input:focus, select:focus { border-color: var(--accent); }

    .passwords-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--border);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .advanced-box {
      background: rgba(59, 130, 246, 0.05);
      border: 1px solid rgba(59, 130, 246, 0.2);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .checkbox-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .timer-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      color: white;
    }

    .btn-enc { background: var(--accent); }
    .btn-enc:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-dec { background: var(--green); }
    .btn-dec:hover:not(:disabled) { background: var(--green-hover); }

    .btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    .lockout-banner {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--red);
      color: #fca5a5;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 16px;
      display: none;
    }

    .output-section {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .output-box {
      background: #0b0d14;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.82rem;
      color: #38bdf8;
      word-break: break-all;
      margin-top: 6px;
      min-height: 80px;
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    .btn-copy {
      background: var(--muted);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-copy:hover { background: #64748b; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🛡️ ErikAI Anti-Brute-Force Cipher</h1>
    <p class="subtitle">Dynamická kaskáda (1–10) + Ochrana proti refreshu (Max 4 pokusy)</p>

    <!-- Výstražný panel pri prekročení pokusov -->
    <div id="lockoutBanner" class="lockout-banner">
      🚨 Príliš veľa nesprávnych pokusov! Zámok aktívny. Zostáva: <span id="countdownTimer">60</span>s
    </div>

    <div class="advanced-box" style="margin-bottom: 16px;">
      <div class="input-group" style="margin-bottom: 0;">
        <label for="shaRounds">Počet hesiel / SHA-256 cyklov (1 až 10):</label>
        <select id="shaRounds" onchange="updatePasswordInputs()">
          <option value="1">1 heslo (1 cyklus)</option>
          <option value="2">2 heslá (2 cykly)</option>
          <option value="3" selected>3 heslá (3 cykly - Štandard)</option>
          <option value="4">4 heslá (4 cykly)</option>
          <option value="5">5 hesiel (5 cyklov)</option>
          <option value="6">6 hesiel (6 cyklov)</option>
          <option value="7">7 hesiel (7 cyklov)</option>
          <option value="8">8 hesiel (8 cyklov)</option>
          <option value="9">9 hesiel (9 cyklov)</option>
          <option value="10">10 hesiel (10 cyklov - Maximum)</option>
        </select>
      </div>
    </div>

    <!-- Dynamické políčka na heslá -->
    <div class="passwords-box" id="passwordsContainer"></div>

    <div class="advanced-box">
      <label class="checkbox-row">
        <input type="checkbox" id="enableExpiry" onclick="toggleExpiry()">
        <span>Aktivovať časovú expiráciu</span>
      </label>
      <div id="expirySettings" style="display: none;" class="timer-row">
        <input type="number" id="expiryValue" value="15" min="1" style="flex: 2;">
        <select id="expiryUnit" style="flex: 3;">
          <option value="seconds">Sekúnd</option>
          <option value="minutes" selected>Minút</option>
          <option value="hours">Hodín</option>
          <option value="days">Dní</option>
        </select>
      </div>
    </div>

    <div class="input-group">
      <label for="inputText">Správa (alebo zašifrovaný kód):</label>
      <textarea id="inputText" placeholder="Sem napíš správu na zašifrovanie, alebo vlož kód na dešifrovanie..."></textarea>
    </div>

    <div class="btn-row">
      <button class="btn btn-enc" id="btnEnc" onclick="encryptMessage()">🔒 Zašifrovať</button>
      <button class="btn btn-dec" id="btnDec" onclick="decryptMessage()">🔓 Odomknúť</button>
    </div>

    <div class="output-section">
      <div class="output-header">
        <label>Výsledok:</label>
        <button class="btn-copy" onclick="copyResult()">Kopírovať</button>
      </div>
      <div class="output-box" id="resultOutput">Zatiaľ tu nie je žiadny výsledok...</div>
    </div>
  </div>

  <script>
    const LOCKOUT_TIME_MS = 60 * 1000; // 60 sekúnd trest
    const MAX_ATTEMPTS = 4; // Maximálne 4 pokusy

    function updatePasswordInputs() {
      const selectElement = document.getElementById('shaRounds');
      const count = parseInt(selectElement ? selectElement.value : 3, 10) || 3;
      const container = document.getElementById('passwordsContainer');
      if (!container) return;
      
      container.innerHTML = '';

      for (let i = 1; i <= count; i++) {
        const group = document.createElement('div');
        group.className = 'input-group';
        if (i === count) group.style.marginBottom = '0';

        const label = document.createElement('label');
        label.setAttribute('for', 'pass' + i);
        label.textContent = `${i}. Tajné heslo:`;

        const input = document.createElement('input');
        input.type = 'password';
        input.id = 'pass' + i;
        input.placeholder = `Zadaj ${i}. heslo...`;

        group.appendChild(label);
        group.appendChild(input);
        container.appendChild(group);
      }
    }

    // Inicializácia pri štarte stránky a kontrola zámku proti refreshu
    updatePasswordInputs();
    checkLockoutStatus();

    function toggleExpiry() {
      const box = document.getElementById('expirySettings');
      const isChecked = document.getElementById('enableExpiry').checked;
      box.style.display = isChecked ? 'flex' : 'none';
    }

    // Kontrola, či užívateľ nie je v treste (funguje aj po refreshi/F5)
    function checkLockoutStatus() {
      const lockoutUntil = localStorage.getItem('erikai_lockout_until');
      if (lockoutUntil) {
        const remaining = parseInt(lockoutUntil, 10) - Date.now();
        if (remaining > 0) {
          setLockedState(true, remaining);
          return true;
        } else {
          localStorage.removeItem('erikai_lockout_until');
          localStorage.setItem('erikai_failed_attempts', '0');
        }
      }
      return false;
    }

    function setLockedState(isLocked, remainingMs = LOCKOUT_TIME_MS) {
      const btnEnc = document.getElementById('btnEnc');
      const btnDec = document.getElementById('btnDec');
      const banner = document.getElementById('lockoutBanner');
      const timerSpan = document.getElementById('countdownTimer');

      if (btnEnc) btnEnc.disabled = isLocked;
      if (btnDec) btnDec.disabled = isLocked;

      if (isLocked) {
        banner.style.display = 'block';
        let secondsLeft = Math.ceil(remainingMs / 1000);
        timerSpan.textContent = secondsLeft;

        const interval = setInterval(() => {
          secondsLeft--;
          timerSpan.textContent = secondsLeft;
          if (secondsLeft <= 0) {
            clearInterval(interval);
            banner.style.display = 'none';
            if (btnEnc) btnEnc.disabled = false;
            if (btnDec) btnDec.disabled = false;
            localStorage.removeItem('erikai_lockout_until');
            localStorage.setItem('erikai_failed_attempts', '0');
          }
        }, 1000);
      } else {
        banner.style.display = 'none';
      }
    }

    function registerFailedAttempt() {
      let attempts = parseInt(localStorage.getItem('erikai_failed_attempts') || '0', 10);
      attempts++;
      localStorage.setItem('erikai_failed_attempts', attempts);

      if (attempts >= MAX_ATTEMPTS) {
        const lockoutTime = Date.now() + LOCKOUT_TIME_MS;
        localStorage.setItem('erikai_lockout_until', lockoutTime);
        setLockedState(true, LOCKOUT_TIME_MS);
        return true;
      }
      return false;
    }

    async function getDynamicKey(passwords, rounds) {
      const enc = new TextEncoder();
      const hashes = [];

      for (let p of passwords) {
        let currentBuffer = enc.encode(p);
        for (let i = 0; i < rounds; i++) {
          currentBuffer = await crypto.subtle.digest('SHA-256', currentBuffer);
        }
        hashes.push(new Uint8Array(currentBuffer));
      }

      const totalBytes = passwords.length * 32;
      const megaCombined = new Uint8Array(totalBytes);
      for (let i = 0; i < passwords.length; i++) {
        megaCombined.set(hashes[i], i * 32);
      }

      const finalHash = await crypto.subtle.digest('SHA-256', megaCombined);

      return await crypto.subtle.importKey(
        "raw",
        finalHash,
        { name: "AES-GCM" },
        false,
        ["encrypt", "decrypt"]
      );
    }

    function getEnteredPasswords() {
      const selectElement = document.getElementById('shaRounds');
      const count = parseInt(selectElement ? selectElement.value : 3, 10) || 3;
      const passwords = [];
      for (let i = 1; i <= count; i++) {
        const val = document.getElementById('pass' + i)?.value || '';
        passwords.push(val);
      }
      return passwords;
    }

    async function encryptMessage() {
      if (checkLockoutStatus()) return;
      try {
        const passwords = getEnteredPasswords();
        const text = document.getElementById('inputText').value;
        const rounds = parseInt(document.getElementById('shaRounds').value, 10);
        const enableExpiry = document.getElementById('enableExpiry').checked;

        if (passwords.some(p => !p) || !text) {
          alert("Musíš vyplniť všetky zadané heslá a text správy!");
          return;
        }

        let expireTimestamp = 0;
        if (enableExpiry) {
          const val = parseFloat(document.getElementById('expiryValue').value);
          const unit = document.getElementById('expiryUnit').value;
          let multiplier = 1000;
          if (unit === 'minutes') multiplier = 60 * 1000;
          if (unit === 'hours') multiplier = 60 * 60 * 1000;
          if (unit === 'days') multiplier = 24 * 60 * 60 * 1000;
          expireTimestamp = Date.now() + (val * multiplier);
        }

        const payload = {
          m: text,
          exp: expireTimestamp,
          r: rounds,
          c: passwords.length
        };

        const key = await getDynamicKey(passwords, rounds);
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encoded = new TextEncoder().encode(JSON.stringify(payload));

        const encrypted = await crypto.subtle.encrypt(
          { name: "AES-GCM", iv: iv },
          key,
          encoded
        );

        const combinedData = new Uint8Array(iv.length + new Uint8Array(encrypted).length);
        combinedData.set(iv);
        combinedData.set(new Uint8Array(encrypted), iv.length);

        const base64String = btoa(String.fromCharCode(...combinedData));
        document.getElementById('resultOutput').textContent = base64String;
        
        // Úspech resetuje počítadlo chýb
        localStorage.setItem('erikai_failed_attempts', '0');
      } catch (e) {
        alert("Chyba pri šifrovaní: " + e.message);
      }
    }

    async function decryptMessage() {
      if (checkLockoutStatus()) return;

      try {
        const passwords = getEnteredPasswords();
        const base64Text = document.getElementById('inputText').value.trim();

        if (passwords.some(p => !p) || !base64Text) {
          alert("Musíš zadať všetky heslá v políčkach a zašifrovaný kód!");
          return;
        }

        const combinedData = Uint8Array.from(atob(base64Text), c => c.charCodeAt(0));
        const iv = combinedData.slice(0, 12);
        const encrypted = combinedData.slice(12);

        let decrypted = null;

        for (let r = 1; r <= 10; r++) {
          try {
            const testKey = await getDynamicKey(passwords, r);
            const testDecrypted = await crypto.subtle.decrypt(
              { name: "AES-GCM", iv: iv },
              testKey,
              encrypted
            );
            decrypted = testDecrypted;
            break;
          } catch(err) {
            // Skúša ďalší cyklus
          }
        }

        if (!decrypted) {
          const isLockedNow = registerFailedAttempt();
          const attemptsLeft = MAX_ATTEMPTS - parseInt(localStorage.getItem('erikai_failed_attempts') || '0', 10);
          
          if (isLockedNow) {
            document.getElementById('resultOutput').textContent = "🚨 Príliš veľa zlých pokusov! Systém zablokovaný na 60 sekúnd.";
          } else {
            document.getElementById('resultOutput').textContent = `❌ Chyba: Nesprávne heslá alebo kód! Zostávajúce pokusy pred blokovaním: ${attemptsLeft}`;
          }
          return;
        }

        // Úspešné odomknutie resetuje chybové pokusy
        localStorage.setItem('erikai_failed_attempts', '0');

        const decodedString = new TextDecoder().decode(decrypted);
        const payload = JSON.parse(decodedString);

        if (payload.exp && payload.exp > 0) {
          if (Date.now() > payload.exp) {
            document.getElementById('resultOutput').textContent = "💥 EXPIROVANÉ: Platnosť tejto správy už vypršala!";
            return;
          }
        }

        document.getElementById('resultOutput').textContent = payload.m;
      } catch (e) {
        const isLockedNow = registerFailedAttempt();
        if (isLockedNow) {
          document.getElementById('resultOutput').textContent = "🚨 Príliš veľa zlých pokusov! Systém zablokovaný na 60 sekúnd.";
        } else {
          document.getElementById('resultOutput').textContent = "❌ Chyba: Neplatný formát kódu alebo nesprávne heslá!";
        }
      }
    }

    function copyResult() {
      const text = document.getElementById('resultOutput').textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert("Skopírované do schránky!");
      });
    }
  </script>
</body>
</html>
