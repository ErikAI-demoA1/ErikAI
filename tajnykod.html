<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErikAI - Nuclear Dynamic Cipher (1-10x SHA + AES)</title>
  <style>
    :root {
      --bg: #090a0f;
      --card: #131722;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #10b981;
      --green-hover: #059669;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 100%);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 6px;
      color: #60a5fa;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 22px;
    }

    .input-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 3px;
      font-weight: 600;
    }

    textarea, input, select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b0d14;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }

    textarea { resize: vertical; min-height: 90px; }
    textarea:focus, input:focus, select:focus { border-color: var(--accent); }

    .passwords-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--border);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .advanced-box {
      background: rgba(59, 130, 246, 0.05);
      border: 1px solid rgba(59, 130, 246, 0.2);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .checkbox-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .timer-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      color: white;
    }

    .btn-enc { background: var(--accent); }
    .btn-enc:hover { background: var(--accent-hover); }

    .btn-dec { background: var(--green); }
    .btn-dec:hover { background: var(--green-hover); }

    .output-section {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .output-box {
      background: #0b0d14;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.82rem;
      color: #38bdf8;
      word-break: break-all;
      margin-top: 6px;
      min-height: 80px;
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    .btn-copy {
      background: var(--muted);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-copy:hover { background: #64748b; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🛡️ ErikAI Dynamic P2P Cipher</h1>
    <p class="subtitle">Dynamická kaskáda hesiel (1–10) + AES-256</p>

    <!-- Nastavenie počtu hesiel/cyklov hore, aby sa políčka vygenerovali -->
    <div class="advanced-box" style="margin-bottom: 16px;">
      <div class="input-group" style="margin-bottom: 0;">
        <label for="shaRounds">Počet hesiel / SHA-256 cyklov (1 až 10):</label>
        <select id="shaRounds" onchange="updatePasswordInputs()">
          <option value="1">1 heslo (1 cyklus)</option>
          <option value="2">2 heslá (2 cykly)</option>
          <option value="3" selected>3 heslá (3 cykly - Štandard)</option>
          <option value="4">4 heslá (4 cykly)</option>
          <option value="5">5 hesiel (5 cyklov)</option>
          <option value="6">6 hesiel (6 cyklov)</option>
          <option value="7">7 hesiel (7 cyklov)</option>
          <option value="8">8 hesiel (8 cyklov)</option>
          <option value="9">9 hesiel (9 cyklov)</option>
          <option value="10">10 hesiel (10 cyklov - Maximum)</option>
        </select>
      </div>
    </div>

    <!-- Dynamické políčka na heslá -->
    <div class="passwords-box" id="passwordsContainer">
      <!-- Sem JavaScript automaticky nahodí presný počet políčok -->
    </div>

    <div class="advanced-box">
      <label class="checkbox-row">
        <input type="checkbox" id="enableExpiry" onclick="toggleExpiry()">
        <span>Aktivovať časovú expiráciu</span>
      </label>
      <div id="expirySettings" style="display: none;" class="timer-row">
        <input type="number" id="expiryValue" value="15" min="1" style="flex: 2;">
        <select id="expiryUnit" style="flex: 3;">
          <option value="seconds">Sekúnd</option>
          <option value="minutes" selected>Minút</option>
          <option value="hours">Hodín</option>
          <option value="days">Dní</option>
        </select>
      </div>
    </div>

    <div class="input-group">
      <label for="inputText">Správa (alebo zašifrovaný kód):</label>
      <textarea id="inputText" placeholder="Sem napíš správu na zašifrovanie, alebo vlož kód na dešifrovanie..."></textarea>
    </div>

    <div class="btn-row">
      <button class="btn btn-enc" onclick="encryptMessage()">🔒 Zašifrovať</button>
      <button class="btn btn-dec" onclick="decryptMessage()">🔓 Odomknúť</button>
    </div>

    <div class="output-section">
      <div class="output-header">
        <label>Výsledok:</label>
        <button class="btn-copy" onclick="copyResult()">Kopírovať</button>
      </div>
      <div class="output-box" id="resultOutput">Zatiaľ tu nie je žiadny výsledok...</div>
    </div>
  </div>

  <script>
    // Funkcia, ktorá automaticky vygeneruje presný počet políčok pre heslá podľa výberu v selectboxe
    function updatePasswordInputs() {
      const count = parseInt(document.getElementById('shaRounds').value, 10);
      const container = document.getElementById('passwordsContainer');
      container.innerHTML = '';

      for (let i = 1; i <= count; i++) {
        const group = document.createElement('div');
        group.className = 'input-group';
        if (i === count) group.style.marginBottom = '0'; // odstráni spodný okraj pri poslednom políčku

        const label = document.createElement('label');
        label.setAttribute('for', 'pass' + i);
        label.textContent = `${i}. Tajné heslo:`;

        const input = document.createElement('input');
        input.type = 'password';
        input.id = 'pass' + i;
        input.placeholder = `Zadaj ${i}. heslo...`;

        group.appendChild(label);
        group.appendChild(input);
        container.appendChild(group);
      }
    }

    // Spustíme pri načítaní stránky, aby predvolene vygenerovalo 3 políčka
    window.onload = function() {
      updatePasswordInputs();
    };

    function toggleExpiry() {
      const box = document.getElementById('expirySettings');
      const isChecked = document.getElementById('enableExpiry').checked;
      box.style.display = isChecked ? 'flex' : 'none';
    }

    // Dynamická kaskáda: vezme aktívny počet hesiel a preženie ich zvoleným počtom cyklov
    async function getDynamicKey(passwords, rounds) {
      const enc = new TextEncoder();
      const hashes = [];

      for (let p of passwords) {
        let currentBuffer = enc.encode(p);
        for (let i = 0; i < rounds; i++) {
          currentBuffer = await crypto.subtle.digest('SHA-256', currentBuffer);
        }
        hashes.push(new Uint8Array(currentBuffer));
      }

      // Spojíme všetky hashe dohromady (počet hesiel x 32 bajtov)
      const totalBytes = passwords.length * 32;
      const megaCombined = new Uint8Array(totalBytes);
      for (let i = 0; i < passwords.length; i++) {
        megaCombined.set(hashes[i], i * 32);
      }

      // Finálne premiešanie pre AES kľúč
      const finalHash = await crypto.subtle.digest('SHA-256', megaCombined);

      return await crypto.subtle.importKey(
        "raw",
        finalHash,
        { name: "AES-GCM" },
        false,
        ["encrypt", "decrypt"]
      );
    }

    // Pomocná funkcia na zozbieranie vyplnených hesiel z dynamických políčok
    function getEnteredPasswords() {
      const count = parseInt(document.getElementById('shaRounds').value, 10);
      const passwords = [];
      for (let i = 1; i <= count; i++) {
        const val = document.getElementById('pass' + i)?.value || '';
        passwords.push(val);
      }
      return passwords;
    }

    async function encryptMessage() {
      try {
        const passwords = getEnteredPasswords();
        const text = document.getElementById('inputText').value;
        const rounds = parseInt(document.getElementById('shaRounds').value, 10);
        const enableExpiry = document.getElementById('enableExpiry').checked;

        if (passwords.some(p => !p) || !text) {
          alert("Musíš vyplniť všetky zadané heslá a text správy!");
          return;
        }

        let expireTimestamp = 0;
        if (enableExpiry) {
          const val = parseFloat(document.getElementById('expiryValue').value);
          const unit = document.getElementById('expiryUnit').value;
          let multiplier = 1000;
          if (unit === 'minutes') multiplier = 60 * 1000;
          if (unit === 'hours') multiplier = 60 * 60 * 1000;
          if (unit === 'days') multiplier = 24 * 60 * 60 * 1000;
          expireTimestamp = Date.now() + (val * multiplier);
        }

        const payload = {
          m: text,
          exp: expireTimestamp,
          r: rounds,
          c: passwords.length // uložení počtu hesiel, aby dešifrovanie vedelo presne, koľko ich bolo
        };

        const key = await getDynamicKey(passwords, rounds);
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encoded = new TextEncoder().encode(JSON.stringify(payload));

        const encrypted = await crypto.subtle.encrypt(
          { name: "AES-GCM", iv: iv },
          key,
          encoded
        );

        const combinedData = new Uint8Array(iv.length + new Uint8Array(encrypted).length);
        combinedData.set(iv);
        combinedData.set(new Uint8Array(encrypted), iv.length);

        const base64String = btoa(String.fromCharCode(...combinedData));
        document.getElementById('resultOutput').textContent = base64String;
      } catch (e) {
        alert("Chyba pri šifrovaní: " + e.message);
      }
    }

    async function decryptMessage() {
      try {
        const passwords = getEnteredPasswords();
        const base64Text = document.getElementById('inputText').value.trim();

        if (passwords.some(p => !p) || !base64Text) {
          alert("Musíš zadať všetky heslá v políčkach a zašifrovaný kód!");
          return;
        }

        const combinedData = Uint8Array.from(atob(base64Text), c => c.charCodeAt(0));
        const iv = combinedData.slice(0, 12);
        const encrypted = combinedData.slice(12);

        let decrypted = null;

        // Automatické vyskúšanie cyklov od 1 do 10, kým kľúč a správa nesadnú
        for (let r = 1; r <= 10; r++) {
          try {
            const testKey = await getDynamicKey(passwords, r);
            const testDecrypted = await crypto.subtle.decrypt(
              { name: "AES-GCM", iv: iv },
              testKey,
              encrypted
            );
            decrypted = testDecrypted;
            break;
          } catch(err) {
            // Skúša ďalší cyklus
          }
        }

        if (!decrypted) {
          throw new Error("Nepodarilo sa odomknúť.");
        }

        const decodedString = new TextDecoder().decode(decrypted);
        const payload = JSON.parse(decodedString);

        if (payload.exp && payload.exp > 0) {
          if (Date.now() > payload.exp) {
            document.getElementById('resultOutput').textContent = "💥 EXPIROVANÉ: Platnosť tejto správy už vypršala!";
            return;
          }
        }

        document.getElementById('resultOutput').textContent = payload.m;
      } catch (e) {
        document.getElementById('resultOutput').textContent = "❌ Chyba: Nesprávne heslá alebo poškodený kód!";
      }
    }

    function copyResult() {
      const text = document.getElementById('resultOutput'].textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert("Skopírované do schránky!");
      });
    }
  </script>
</body>
</html>
