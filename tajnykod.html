<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErikAI - Trojité SHA-256 + Jedno AES-256</title>
  <style>
    :root {
      --bg: #090a0f;
      --card: #131722;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #10b981;
      --green-hover: #059669;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 100%);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 6px;
      color: #60a5fa;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 22px;
    }

    .input-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    textarea, input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b0d14;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }

    textarea { resize: vertical; min-height: 90px; }
    textarea:focus, input:focus { border-color: var(--accent); }

    .passwords-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--border);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      color: white;
    }

    .btn-enc { background: var(--accent); }
    .btn-enc:hover { background: var(--accent-hover); }

    .btn-dec { background: var(--green); }
    .btn-dec:hover { background: var(--green-hover); }

    .output-section {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .output-box {
      background: #0b0d14;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      word-break: break-all;
      margin-top: 6px;
      min-height: 80px;
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    .btn-copy {
      background: var(--muted);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-copy:hover { background: #64748b; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🔐 ErikAI Tri-SHA + AES-256</h1>
    <p class="subtitle">3 nezávislé heslá (3x SHA-256) spojené do jedného AES-256 kľúča</p>

    <div class="passwords-box">
      <div class="input-group">
        <label for="pass1">1. Heslo (Prvá SHA-256 vrstva):</label>
        <input type="password" id="pass1" placeholder="Zadaj prvé heslo...">
      </div>

      <div class="input-group">
        <label for="pass2">2. Heslo (Druhá SHA-256 vrstva):</label>
        <input type="password" id="pass2" placeholder="Zadaj druhé heslo...">
      </div>

      <div class="input-group">
        <label for="pass3">3. Heslo (Tretia SHA-256 vrstva):</label>
        <input type="password" id="pass3" placeholder="Zadaj tretie heslo...">
      </div>
    </div>

    <div class="input-group">
      <label for="inputText">Správa (alebo zašifrovaný kód):</label>
      <textarea id="inputText" placeholder="Sem napíš správu na zašifrovanie, alebo vlož kód na dešifrovanie..."></textarea>
    </div>

    <div class="btn-row">
      <button class="btn btn-enc" onclick="encryptMessage()">🔒 Zašifrovať</button>
      <button class="btn btn-dec" onclick="decryptMessage()">🔓 Odomknúť</button>
    </div>

    <div class="output-section">
      <div class="output-header">
        <label>Výsledok:</label>
        <button class="btn-copy" onclick="copyResult()">Kopírovať</button>
      </div>
      <div class="output-box" id="resultOutput">Zatiaľ tu nie je žiadny výsledok...</div>
    </div>
  </div>

  <script>
    // Funkcia, ktorá vezme 3 heslá, každé preženie cez SHA-256 a spojí ich do jedného finálneho AES kľúča
    async function getCombinedKey(p1, p2, p3) {
      const enc = new TextEncoder();

      // Vyrobíme samostatný SHA-256 hash pre každé heslo
      const hash1 = await crypto.subtle.digest('SHA-256', enc.encode(p1));
      const hash2 = await crypto.subtle.digest('SHA-256', enc.encode(p2));
      const hash3 = await crypto.subtle.digest('SHA-256', enc.encode(p3));

      // Spojíme všetky 3 hashe (3 x 32 bajtov = 96 bajtov) do jedného poľa
      const combined = new Uint8Array(96);
      combined.set(new Uint8Array(hash1), 0);
      combined.set(new Uint8Array(hash2), 32);
      combined.set(new Uint8Array(hash3), 64);

      // Výsledok ešte raz preženieme cez SHA-256, aby sme dostali presne 256-bitový (32-bajtový) kľúč pre AES
      const finalHash = await crypto.subtle.digest('SHA-256', combined);

      return await crypto.subtle.importKey(
        "raw",
        finalHash,
        { name: "AES-GCM" },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptMessage() {
      try {
        const p1 = document.getElementById('pass1').value;
        const p2 = document.getElementById('pass2').value;
        const p3 = document.getElementById('pass3').value;
        const text = document.getElementById('inputText').value;

        if (!p1 || !p2 || !p3 || !text) {
          alert("Musíš zadať všetky 3 heslá a aj text správy!");
          return;
        }

        const key = await getCombinedKey(p1, p2, p3);
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encoded = new TextEncoder().encode(text);

        const encrypted = await crypto.subtle.encrypt(
          { name: "AES-GCM", iv: iv },
          key,
          encoded
        );

        const combinedData = new Uint8Array(iv.length + new Uint8Array(encrypted).length);
        combinedData.set(iv);
        combinedData.set(new Uint8Array(encrypted), iv.length);

        const base64String = btoa(String.fromCharCode(...combinedData));
        document.getElementById('resultOutput').textContent = base64String;
      } catch (e) {
        alert("Chyba pri šifrovaní: " e.message);
      }
    }

    async function decryptMessage() {
      try {
        const p1 = document.getElementById('pass1').value;
        const p2 = document.getElementById('pass2').value;
        const p3 = document.getElementById('pass3').value;
        const base64Text = document.getElementById('inputText').value.trim();

        if (!p1 || !p2 || !p3 || !base64Text) {
          alert("Musíš zadať všetky 3 heslá a zašifrovaný kód!");
          return;
        }

        const key = await getCombinedKey(p1, p2, p3);
        const combinedData = Uint8Array.from(atob(base64Text), c => c.charCodeAt(0));

        const iv = combinedData.slice(0, 12);
        const encrypted = combinedData.slice(12);

        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv },
          key,
          encrypted
        );

        const decodedText = new TextDecoder().decode(decrypted);
        document.getElementById('resultOutput').textContent = decodedText;
      } catch (e) {
        document.getElementById('resultOutput').textContent = "❌ Chyba: Niektoré z 3 hesiel je nesprávne, alebo je kód poškodený!";
      }
    }

    function copyResult() {
      const text = document.getElementById('resultOutput'].textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert("Skopírované do schránky!");
      });
    }
  </script>
</body>
</html>
