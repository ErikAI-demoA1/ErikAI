<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ErikAI Premium Hub</title>
<style>
  /* --- Reset a základ --- */
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: #0e0e0e; color: #fff; overflow: hidden; }

  /* --- Iframe plná obrazovka --- */
  #contentFrame { position: absolute; top:0; left:0; width:100%; height:100%; border:none; }

  /* --- Menu ikony --- */
  .menuIcon {
    position: fixed;
    top: 15px;
    width: 50px; height: 50px;
    background: linear-gradient(135deg,#ff7f50,#ff4500);
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 15px rgba(255,69,0,0.7);
    transition: transform 0.3s, box-shadow 0.3s;
    z-index: 1000;
  }
  .menuIcon:hover { transform: scale(1.1); box-shadow: 0 0 25px rgba(255,140,0,0.9); }

  #menuLeft { left: 20px; }
  #menuRight { right: 20px; }

  .menuIcon::before {
    content: "≡"; font-size: 24px; font-weight: bold;
  }

  /* --- Dropdown menu --- */
  .dropdown {
    position: fixed;
    top: 70px; /* pod ikonou */
    background: rgba(20,20,20,0.95);
    border: 1px solid #ff4500;
    border-radius: 10px;
    max-height: 80vh;
    overflow-y: auto;
    display: none;
    z-index: 1000;
    padding: 10px;
  }
  .dropdown a {
    display: block;
    color: #fff;
    padding: 8px 12px;
    text-decoration: none;
    border-radius: 5px;
    transition: background 0.2s;
  }
  .dropdown a:hover {
    background: rgba(255,69,0,0.5);
  }

  /* Ľavé a pravé menu */
  #dropdownLeft { left: 20px; }
  #dropdownRight { right: 20px; }

</style>
</head>
<body>

<!-- Iframe -->
<iframe id="contentFrame" src=""></iframe>

<!-- Menu ikony -->
<div id="menuLeft" class="menuIcon"></div>
<div id="menuRight" class="menuIcon"></div>

<!-- Dropdowny -->
<div id="dropdownLeft" class="dropdown"></div>
<div id="dropdownRight" class="dropdown"></div>

<script>
const htmlFiles = [
  "01zaklad.html","02nadpisy.html","03odkazy.html","04zoznamy.html","05cssstyll.html",
  "06javascript.html","07formular.html","08obrazkyavidea.html","09tlacidlastyl.html",
  "10dizajn.html","11efekty.html","12profil.html","13kalkulacka.html","14github.html",
  "android_apk.html","budik.html","coc.html","create_pwa.html","dama.html","dokumenty.html",
  "emoji.html","erikai-chat.html","erikai_kniha-html.html","erikai_own_tube.html","erikai_tube.html",
  "erikaiapkstudio.html","erikaicorelang.html","eriktv.html","erikvyh.html","format.html","fotak.html",
  "galeria.html","generator_hesla_mena.html","generator_obrazkov.html","grafy.html","hodiny.html",
  "hra.html","hudba.html","kalendar.html","kalkulacku.html","kompas.html","kontakt_hovor.html",
  "kreslenie.html","kvantovy.html","ludo.html","mail.html","mapy.html","memorymatch.html","minicoc.html",
  "mixnastroje.html","nastroje.html","nudzove.html","onlineprehliadac.html","pdfob.html","pdfsk.html",
  "perrchat.html","pocasie.html","poznamky.html","prevodjednotiek.html","prezentacie.html","qr.html",
  "radio.html","reakciahra.html","realnastavenie.html","remixsong.html","sachy.html","skener.html",
  "sms.html","speedmeter.html","spravca_subor.html","spravy.html","support.html","tabulky.html",
  "taprace.html","translate.html","univerzal.html","video_editor.html","vzorce.html","weberikai.html",
  "writesped.html","zaznam_nahravok.html"
];

function populateDropdown(dropdown){
  dropdown.innerHTML = "";
  htmlFiles.forEach(file=>{
    const a = document.createElement('a');
    a.href = "#";
    a.textContent = file;
    a.addEventListener('click', (e)=>{
      e.preventDefault();
      document.getElementById('contentFrame').src = "https://rawcdn.githack.com/ErikAI-demoA1/ErikAI/main/"+file;
    });
    dropdown.appendChild(a);
  });
}

const menuLeft = document.getElementById('menuLeft');
const menuRight = document.getElementById('menuRight');
const dropdownLeft = document.getElementById('dropdownLeft');
const dropdownRight = document.getElementById('dropdownRight');

menuLeft.addEventListener('click', ()=>{ dropdownLeft.style.display = dropdownLeft.style.display==='block' ? 'none':'block'; });
menuRight.addEventListener('click', ()=>{ dropdownRight.style.display = dropdownRight.style.display==='block' ? 'none':'block'; });

populateDropdown(dropdownLeft);
populateDropdown(dropdownRight);
</script>

</body>
</html>
