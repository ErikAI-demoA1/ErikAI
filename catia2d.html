<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>ErikAI Pro 2D CAD — Professional Blueprints Edition</title>
<style>
:root{
  --bg-color: #121216;
  --panel-bg: #1e222d;
  --border-color: #2e364f;
  --accent-green: #10b981;
  --accent-blue: #3b82f6;
  --text-main: #ffffff;
  --text-muted: #94a3b8;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg-color);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  touch-action: none;
}
header{
  padding: 8px 10px;
  background: var(--panel-bg);
  border-bottom: 1px solid var(--border-color);
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
  justify-content: space-between;
  z-index: 10;
}
.panel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

#canvasContainer {
  flex: 1;
  overflow: auto;
  position: relative;
  background: #0b0d13;
  touch-action: auto;
}
canvas{background:#0b0d13;display:block;cursor:crosshair;}

button, label.file-btn, select.format-select{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background: var(--accent-green);
  color:#000;
  font-weight: bold;
  cursor:pointer;
  font-size: 0.9rem;
  transition: all 0.2s;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}
button:hover, label.file-btn:hover, select.format-select:hover{filter: brightness(1.1); transform: translateY(-1px);}
button.ghost{background: var(--panel-bg);border:1px solid var(--border-color);color:var(--text-main);}
button.active{background: var(--accent-blue); color:white;}

select.format-select {
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  font-family: inherit;
  outline: none;
}

label.file-btn {
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  color: var(--text-main);
}
input[type="file"] {
  display: none;
}

#commandLineContainer{
  background: #090b10;
  border-top: 1px solid var(--border-color);
  padding: 6px 12px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 0.85rem;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#commandHistory{
  height: 30px;
  overflow-y: auto;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#commandInputRow{display: flex; align-items: center; gap: 6px;}
#commandPrompt{color: var(--accent-green); font-weight: bold;}
#commandInput{
  flex: 1;
  background: transparent;
  border: none;
  color: white;
  font-family: inherit;
  font-size: 0.9rem;
  outline: none;
}

.info{padding:4px 12px;background: var(--panel-bg);font-size:0.8rem;color:var(--text-muted);border-top:1px solid var(--border-color);}

#dimensionsPanel{
  position:fixed;
  top:55px;
  right:10px;
  background:var(--panel-bg);
  border:1px solid var(--border-color);
  padding:12px;
  border-radius:12px;
  max-height:75vh;
  overflow:auto;
  display:none;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  width: 330px;
  z-index: 1000;
}
#dimensionsPanel h3{margin:0 0 8px 0;color:var(--accent-green);font-size:0.95rem;}
.shape-card{
  background: #121216;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 8px;
  margin-bottom: 8px;
  cursor: pointer;
}
.shape-card.active{
  border-color: var(--accent-blue);
  background: #1a233a;
}
.input-row{
  display: flex;
  gap: 6px;
  align-items: center;
  margin-top: 4px;
  flex-wrap: wrap;
}
.input-row label{
  font-size: 0.75rem;
  color: var(--text-muted);
}
.input-row input{
  width: 60px;
  padding: 4px;
  border-radius: 4px;
  border: 1px solid var(--border-color);
  background: #090b10;
  color: white;
  font-size: 0.85rem;
}
.input-row input[type="text"]{
  width: 110px;
}
.input-row input[type="color"]{
  width: 32px;
  height: 26px;
  padding: 0;
  border: none;
  cursor: pointer;
  background: transparent;
}
</style>
</head>
<body>

<header>
  <div class="panel">
    <button id="lineBtn" class="active" onclick="setTool('line')">📏 Čiara</button>
    <button id="circleBtn" class="ghost" onclick="setTool('circle')">⭕ Kruh</button>
    <button id="rectBtn" class="ghost" onclick="setTool('rect')">⬜ Obdĺžnik</button>
    <button id="textBtn" class="ghost" onclick="setTool('text')">🔤 Text</button>
    <button id="moveBtn" class="ghost" onclick="setTool('move')">🚚 Presun</button>
    
    <!-- Výber formátu výkresu -->
    <select id="paperFormat" class="format-select" onchange="changePaperFormat()">
      <option value="infinite">📄 Nekonečné plátno</option>
      <option value="A4_portrait">📄 A4 Na výšku (210×297)</option>
      <option value="A4_landscape" selected>📄 A4 Na šírku (297×210)</option>
      <option value="A3_portrait">📄 A3 Na výšku (297×420)</option>
      <option value="A3_landscape">📄 A3 Na šírku (420×297)</option>
    </select>

    <button id="undoBtn" class="ghost" onclick="undo()">↩️</button>
    <button id="redoBtn" class="ghost" onclick="redo()">↪️</button>
    <button id="editDimsBtn" class="ghost">📋 Koty & Výkres</button>
  </div>
  <div class="panel">
    <button id="exportImg" class="ghost" onclick="exportImage()" style="background:#3b82f6; color:white;">📷 PNG</button>
    <button id="printBtn" class="ghost" onclick="printBlueprint()" style="background:#10b981; color:black;">🖨️ Tlačiť</button>
    <button id="exportJSON" class="ghost" onclick="exportJSON()">💾 Uložiť</button>
    <label for="fileInput" class="file-btn">📂 Otvoriť</label>
    <input type="file" id="fileInput" accept=".json" onchange="importJSON(event)">
    <button class="ghost" onclick="importFromText()" style="background:#3b82f6; color:white;" title="Vložiť projekt cez text">📋 Vložiť text</button>
    <button class="ghost" onclick="clearAll()" style="background:#dc2626; color:white;">🗑️ Zmazať</button>
  </div>
</header>

<div id="canvasContainer">
  <canvas id="cadCanvas" width="4000" height="4000"></canvas>
</div>

<div class="info" id="info">X: 0, Y: 0 | Nástroj: Čiara</div>

<div id="commandLineContainer">
  <div id="commandHistory"><div>ErikAI CAD pripravený na profesionálne 2D kreslenie...</div></div>
  <div id="commandInputRow">
    <span id="commandPrompt">&gt;</span>
    <input type="text" id="commandInput" placeholder="Príkaz (line, text, move, undo)..." autocomplete="off">
  </div>
</div>

<div id="dimensionsPanel">
  <h3>Zoznam prvkov, Koty a Štýly</h3>
  <div id="dimsContent">Žiadne tvary</div>
</div>

<script>
const canvas=document.getElementById('cadCanvas');
const ctx=canvas.getContext('2d');
const container=document.getElementById('canvasContainer');

let shapes=[],undoStack=[],redoStack=[];
let tool='line';
let startPt=null;
let currentMouse={x:0, y:0};
let selectedShapeIndex=null;
let editMode=false;

let isMoving=false;
let moveShapeIndex=null;
let moveOffset={x:0, y:0};

// Definícia formátov papiera v pixeloch (mierka: 1 mm = 3.5 px pre pohodlné kreslenie)
const paperFormats = {
  'infinite': {w: 4000, h: 4000, name: 'Nekonečné plátno'},
  'A4_portrait': {w: 735, h: 1040, name: 'A4 Na výšku'},
  'A4_landscape': {w: 1040, h: 735, name: 'A4 Na šírku'},
  'A3_portrait': {w: 1040, h: 1470, name: 'A3 Na výšku'},
  'A3_landscape': {w: 1470, h: 1040, name: 'A3 Na šírku'}
};
let currentFormatKey = 'A4_landscape';

const info=document.getElementById('info');
const dimsPanel=document.getElementById('dimensionsPanel');
const dimsContent=document.getElementById('dimsContent');
const editDimsBtn=document.getElementById('editDimsBtn');
const commandHistory=document.getElementById('commandHistory');
const commandInput=document.getElementById('commandInput');
const paperFormatSelect=document.getElementById('paperFormat');

function logCommand(text){
  const div=document.createElement('div');
  div.textContent=`> ${text}`;
  commandHistory.appendChild(div);
  commandHistory.scrollTop=commandHistory.scrollHeight;
}

function saveToLocalStorage(){
  localStorage.setItem('erikai_cad_autosave', JSON.stringify({shapes, format: currentFormatKey}));
}

function loadFromLocalStorage(){
  const saved = localStorage.getItem('erikai_cad_autosave');
  if(saved){
    try{
      const data = JSON.parse(saved);
      if(Array.isArray(data)){
        shapes = data; // starší formát
      } else {
        shapes = data.shapes || [];
        if(data.format && paperFormats[data.format]){
          currentFormatKey = data.format;
          paperFormatSelect.value = currentFormatKey;
        }
      }
      applyPaperSize();
      logCommand("Projekt úspešne obnovený z pamäte.");
    }catch(e){
      console.error("Chyba pri načítaní autosave", e);
    }
  } else {
    applyPaperSize();
  }
}

function applyPaperSize(){
  const fmt = paperFormats[currentFormatKey];
  canvas.width = fmt.w;
  canvas.height = fmt.h;
  drawAll();
}

function changePaperFormat(){
  currentFormatKey = paperFormatSelect.value;
  applyPaperSize();
  saveToLocalStorage();
  logCommand(`Zmenený formát výkresu: ${paperFormats[currentFormatKey].name}`);
}

function setTool(t){
  tool=t;
  document.querySelectorAll('header button').forEach(b=>{
    if(!b.getAttribute('onclick')?.includes('export') && !b.getAttribute('onclick')?.includes('clear') && !b.getAttribute('onclick')?.includes('importFromText') && !b.getAttribute('onclick')?.includes('printBlueprint')) {
      b.classList.replace('active','ghost');
    }
  });
  if(t==='line') document.getElementById('lineBtn').classList.replace('ghost','active');
  if(t==='circle') document.getElementById('circleBtn').classList.replace('ghost','active');
  if(t==='rect') document.getElementById('rectBtn').classList.replace('ghost','active');
  if(t==='text') document.getElementById('textBtn').classList.replace('ghost','active');
  if(t==='move') document.getElementById('moveBtn').classList.replace('ghost','active');
  startPt=null;
  logCommand(`Nástroj: ${t.toUpperCase()}`);
  drawAll();
}

commandInput.onkeydown=(e)=>{
  if(e.key==='Enter'){
    const val=commandInput.value.trim().toLowerCase();
    logCommand(val);
    commandInput.value='';
    if(val==='line' || val==='l') setTool('line');
    else if(val==='circle' || val==='c') setTool('circle');
    else if(val==='rect' || val==='r') setTool('rect');
    else if(val==='text' || val==='t') setTool('text');
    else if(val==='move' || val==='m') setTool('move');
    else if(val==='undo') undo();
    else if(val==='redo') redo();
    else if(val==='clear') clearAll();
    else logCommand(`Neznámy príkaz`);
  }
};

function pushState(){
  undoStack.push(JSON.parse(JSON.stringify(shapes)));
  redoStack=[];
  saveToLocalStorage();
}
function undo(){
  if(undoStack.length){
    redoStack.push(JSON.parse(JSON.stringify(shapes)));
    shapes=undoStack.pop();
    saveToLocalStorage();
    drawAll();
  }
}
function redo(){
  if(redoStack.length){
    undoStack.push(JSON.parse(JSON.stringify(shapes)));
    shapes=redoStack.pop();
    saveToLocalStorage();
    drawAll();
  }
}
function clearAll(){
  pushState();
  shapes=[];
  selectedShapeIndex=null;
  saveToLocalStorage();
  drawAll();
}

// Generovanie plátna pre export/tlač podľa zvoleného formátu alebo obsahu
function generateBlueprintCanvas(){
  const fmt = paperFormats[currentFormatKey];
  let width = fmt.w;
  let height = fmt.h;

  if(currentFormatKey === 'infinite' && shapes.length > 0){
    // Pre nekonečné plátno spravíme orez podľa obsahu
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    shapes.forEach(s=>{
      if(s.type==='line'){
        minX = Math.min(minX, s.x1, s.x2); minY = Math.min(minY, s.y1, s.y2);
        maxX = Math.max(maxX, s.x1, s.x2); maxY = Math.max(maxY, s.y1, s.y2);
      }else if(s.type==='circle'){
        minX = Math.min(minX, s.cx - s.r); minY = Math.min(minY, s.cy - s.r);
        maxX = Math.max(maxX, s.cx + s.r); maxY = Math.max(maxY, s.cy + s.r);
      }else if(s.type==='rect'){
        minX = Math.min(minX, s.x, s.x + s.w); minY = Math.min(minY, s.y, s.y + s.h);
        maxX = Math.max(maxX, s.x, s.x + s.w); maxY = Math.max(maxY, s.y, s.y + s.h);
      }else if(s.type==='text'){
        minX = Math.min(minX, s.x); minY = Math.min(minY, s.y - 20);
        maxX = Math.max(maxX, s.x + 100); maxY = Math.max(maxY, s.y + 10);
      }
    });
    const padding = 60;
    minX -= padding; minY -= padding;
    maxX += padding; maxY += padding;
    width = Math.max(400, maxX - minX);
    height = Math.max(400, maxY - minY);
  }

  const bCanvas = document.createElement('canvas');
  bCanvas.width = width;
  bCanvas.height = height;
  const bCtx = bCanvas.getContext('2d');

  // Biele pozadie výkresu
  bCtx.fillStyle = '#ffffff';
  bCtx.fillRect(0, 0, width, height);

  // Ak je to pevný formát (A4/A3), nakreslíme pekný technický rámček
  if(currentFormatKey !== 'infinite'){
    bCtx.strokeStyle = '#cbd5e1';
    bCtx.lineWidth = 1;
    bCtx.strokeRect(20, 20, width - 40, height - 40);
  }

  bCtx.save();
  if(currentFormatKey === 'infinite'){
    // Posun ak treba
  }

  shapes.forEach((s)=>{
    bCtx.strokeStyle = s.color || '#10b981';
    bCtx.lineWidth = 2;
    bCtx.beginPath();

    if(s.type==='line'){
      bCtx.moveTo(s.x1, s.y1); bCtx.lineTo(s.x2, s.y2);
    }else if(s.type==='circle'){
      bCtx.arc(s.cx, s.cy, s.r, 0, Math.PI*2);
    }else if(s.type==='rect'){
      bCtx.rect(s.x, s.y, s.w, s.h);
    }else if(s.type==='text'){
      bCtx.fillStyle = s.color || '#000000';
      bCtx.font = `${s.size || 16}px monospace`;
      bCtx.fillText(s.text, s.x, s.y);
    }
    if(s.type !== 'text') bCtx.stroke();

    bCtx.fillStyle='#475569'; bCtx.font='12px monospace';
    if(s.type==='line'){
      const midX=(s.x1+s.x2)/2, midY=(s.y1+s.y2)/2;
      const len=Math.hypot(s.x2-s.x1,s.y2-s.y1).toFixed(1);
      const angleRad = Math.atan2(s.y2-s.y1, s.x2-s.x1);
      let angleDeg = Math.round(angleRad * (180 / Math.PI));
      if(angleDeg < 0) angleDeg += 360;
      bCtx.fillText(`${len} mm (${angleDeg}°)`, midX+6, midY-6);
    }else if(s.type==='rect'){
      bCtx.fillText(`W:${Math.abs(s.w).toFixed(1)} H:${Math.abs(s.h).toFixed(1)}`, s.x+s.w/2-20, s.y+s.h/2);
    }else if(s.type==='circle'){
      bCtx.fillText(`R:${s.r.toFixed(1)}`, s.cx, s.cy - s.r - 6);
    }
  });

  bCtx.restore();
  return bCanvas;
}

function exportImage(){
  const bCanvas = generateBlueprintCanvas();
  const link=document.createElement('a');
  link.download=`erikai_cad_${currentFormatKey}.png`;
  link.href = bCanvas.toDataURL('image/png');
  link.click();
  logCommand("Výkres úspešne exportovaný ako PNG!");
}

function printBlueprint(){
  const bCanvas = generateBlueprintCanvas();
  const dataUrl = bCanvas.toDataURL('image/png');

  const printWindow = window.open('', '_blank');
  printWindow.document.write(`
    <html>
      <head>
        <title>ErikAI Pro 2D CAD — Tlač výkresu</title>
        <style>
          body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: white; }
          img { max-width: 100%; max-height: 100%; object-fit: contain; }
        </style>
      </head>
      <body>
        <img src="${dataUrl}" onload="window.print();window.close()"/>
      </body>
    </html>
  `);
  printWindow.document.close();
  logCommand("Otvorené okno tlače výkresu.");
}

function exportJSON(){
  const jsonText = JSON.stringify({shapes, format: currentFormatKey}, null, 2);
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(jsonText);
  const link = document.createElement('a');
  link.download = 'erikai_cad_projekt.json';
  link.href = dataStr;
  link.click();
  
  if(navigator.clipboard){
    navigator.clipboard.writeText(jsonText).catch(() => {});
  }
  logCommand("Projekt stiahnutý a skopírovaný do schránky!");
}

function importJSON(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(data.shapes && Array.isArray(data.shapes)){
        pushState();
        shapes = data.shapes;
        if(data.format && paperFormats[data.format]){
          currentFormatKey = data.format;
          paperFormatSelect.value = currentFormatKey;
        }
        applyPaperSize();
        selectedShapeIndex = null;
        saveToLocalStorage();
        drawAll();
        logCommand("Projekt úspešne načítaný zo súboru!");
      }else{
        alert("Neplatný formát CAD súboru.");
      }
    }catch(err){
      alert("Chyba pri čítaní súboru.");
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function importFromText(){
  const input = prompt("Sem vložte skopírovaný JSON text projektu:");
  if(!input) return;
  try{
    const data = JSON.parse(input);
    if(data.shapes && Array.isArray(data.shapes)){
      pushState();
      shapes = data.shapes;
      if(data.format && paperFormats[data.format]){
        currentFormatKey = data.format;
        paperFormatSelect.value = currentFormatKey;
      }
      applyPaperSize();
      selectedShapeIndex = null;
      saveToLocalStorage();
      drawAll();
      logCommand("Projekt úspešne načítaný z textu!");
    }else{
      alert("Neplatný formát textu.");
    }
  }catch(e){
    alert("Chyba: Vložený text nie je platný JSON.");
  }
}

editDimsBtn.onclick=()=>{
  editMode=!editMode;
  dimsPanel.style.display=editMode?'block':'none';
  drawAll();
};

function drawGrid(){
  const step=40;
  ctx.strokeStyle='rgba(255,255,255,0.04)';
  ctx.lineWidth=1;
  for(let x=0; x<canvas.width; x+=step){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
  }
  for(let y=0; y<canvas.height; y+=step){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
  }

  // Ak je zvolený formát papiera, nakreslíme jemný obrys formátu priamo na pracovnú plochu
  if(currentFormatKey !== 'infinite'){
    ctx.strokeStyle='rgba(59, 130, 246, 0.4)';
    ctx.lineWidth=2;
    ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

    ctx.fillStyle='rgba(59, 130, 246, 0.6)';
    ctx.font='12px monospace';
    ctx.fillText(`Formát: ${paperFormats[currentFormatKey].name}`, 20, 30);
  }
}

function drawAll(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawGrid();

  shapes.forEach((s, i)=>{
    ctx.strokeStyle = (i === selectedShapeIndex) ? '#3b82f6' : (s.color || '#10b981');
    ctx.lineWidth = (i === selectedShapeIndex) ? 3 : 2;
    ctx.beginPath();

    if(s.type==='line'){
      ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2);
    }else if(s.type==='circle'){
      ctx.arc(s.cx, s.cy, s.r, 0, Math.PI*2);
    }else if(s.type==='rect'){
      ctx.rect(s.x, s.y, s.w, s.h);
    }else if(s.type==='text'){
      ctx.fillStyle = (i === selectedShapeIndex) ? '#3b82f6' : (s.color || '#ffffff');
      ctx.font = `${s.size || 16}px monospace`;
      ctx.fillText(s.text, s.x, s.y);
    }
    if(s.type !== 'text') ctx.stroke();

    drawDimension(s);
  });

  if(startPt && tool !== 'move' && tool !== 'text'){
    ctx.strokeStyle='rgba(16, 185, 129, 0.6)';
    ctx.lineWidth=2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    if(tool==='line'){
      ctx.moveTo(startPt.x, startPt.y); ctx.lineTo(currentMouse.x, currentMouse.y);
    }else if(tool==='circle'){
      const r = Math.hypot(currentMouse.x - startPt.x, currentMouse.y - startPt.y);
      ctx.arc(startPt.x, startPt.y, r, 0, Math.PI*2);
    }else if(tool==='rect'){
      ctx.rect(startPt.x, startPt.y, currentMouse.x - startPt.x, currentMouse.y - startPt.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if(editMode) updateDimensionsPanel();
}

function drawDimension(s){
  ctx.fillStyle='#94a3b8'; ctx.font='12px monospace';
  if(s.type==='line'){
    const midX=(s.x1+s.x2)/2, midY=(s.y1+s.y2)/2;
    const len=Math.hypot(s.x2-s.x1,s.y2-s.y1).toFixed(1);
    const angleRad = Math.atan2(s.y2-s.y1, s.x2-s.x1);
    let angleDeg = Math.round(angleRad * (180 / Math.PI));
    if(angleDeg < 0) angleDeg += 360;
    ctx.fillText(`${len} mm (${angleDeg}°)`, midX+6, midY-6);
  }else if(s.type==='rect'){
    ctx.fillText(`W:${Math.abs(s.w).toFixed(1)} H:${Math.abs(s.h).toFixed(1)}`, s.x+s.w/2-20, s.y+s.h/2);
  }else if(s.type==='circle'){
    ctx.fillText(`R:${s.r.toFixed(1)}`, s.cx, s.cy - s.r - 6);
  }
}

function snap(x, y){
  const gridStep = 20;
  return {
    x: Math.round(x / gridStep) * gridStep,
    y: Math.round(y / gridStep) * gridStep
  };
}

function findShapeAt(x, y){
  for(let i = shapes.length - 1; i >= 0; i--){
    let s = shapes[i];
    if(s.type==='line'){
      const d = distToSegment({x, y}, {x:s.x1, y:s.y1}, {x:s.x2, y:s.y2});
      if(d < 15) return i;
    }else if(s.type==='circle'){
      const dist = Math.hypot(x - s.cx, y - s.cy);
      if(Math.abs(dist - s.r) < 15 || dist < s.r) return i;
    }else if(s.type==='rect'){
      let minX = Math.min(s.x, s.x+s.w);
      let maxX = Math.max(s.x, s.x+s.w);
      let minY = Math.min(s.y, s.y+s.h);
      let maxY = Math.max(s.y, s.y+s.h);
      if(x >= minX - 5 && x <= maxX + 5 && y >= minY - 5 && y <= maxY + 5) return i;
    }else if(s.type==='text'){
      if(Math.abs(x - s.x) < 50 && Math.abs(y - s.y) < 25) return i;
    }
  }
  return null;
}

function distToSegment(p, a, b) {
  const l2 = (b.x - a.x)*(b.x - a.x) + (b.y - a.y)*(b.y - a.y);
  if (l2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
  let t = ((p.x - a.x)*(b.x - a.x) + (p.y - a.y)*(b.y - a.y)) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t*(b.x - a.x)), p.y - (a.y + t*(b.y - a.y)));
}

function handleStart(clientX, clientY){
  const rect=canvas.getBoundingClientRect();
  const x = clientX - rect.left + container.scrollLeft;
  const y = clientY - rect.top + container.scrollTop;
  const p = snap(x, y);

  if(tool === 'move'){
    const hitIdx = findShapeAt(x, y);
    if(hitIdx !== null){
      pushState();
      isMoving = true;
      moveShapeIndex = hitIdx;
      selectedShapeIndex = hitIdx;
      
      let s = shapes[hitIdx];
      if(s.type==='line') moveOffset={x: x - s.x1, y: y - s.y1};
      else if(s.type==='circle') moveOffset={x: x - s.cx, y: y - s.cy};
      else if(s.type==='rect') moveOffset={x: x - s.x, y: y - s.y};
      else if(s.type==='text') moveOffset={x: x - s.x, y: y - s.y};
      drawAll();
    } else {
      selectedShapeIndex = null;
      drawAll();
    }
    return;
  }

  if(tool === 'text'){
    pushState();
    const txt = prompt("Zadajte text / poznámku:", "Poznámka 1");
    if(txt){
      shapes.push({type:'text', text:txt, x:p.x, y:p.y, color:'#000000', size:16});
      saveToLocalStorage();
      logCommand(`Pridaný text: "${txt}"`);
      drawAll();
    }
    return;
  }

  if(!startPt){
    startPt=p;
    return;
  }

  pushState();
  let shape=null;
  if(tool==='line'){
    shape={type:'line', x1:startPt.x, y1:startPt.y, x2:p.x, y2:p.y, color:'#10b981'};
  }else if(tool==='circle'){
    shape={type:'circle', cx:startPt.x, cy:startPt.y, r:Math.hypot(p.x-startPt.x, p.y-startPt.y), color:'#10b981'};
  }else if(tool==='rect'){
    shape={type:'rect', x:startPt.x, y:startPt.y, w:p.x-startPt.x, h:p.y-startPt.y, color:'#10b981'};
  }

  if(shape) shapes.push(shape);
  startPt=null;
  saveToLocalStorage();
  drawAll();
}

function handleMove(clientX, clientY){
  const rect=canvas.getBoundingClientRect();
  const x = clientX - rect.left + container.scrollLeft;
  const y = clientY - rect.top + container.scrollTop;
  currentMouse = snap(x, y);

  info.textContent=`X: ${currentMouse.x}, Y: ${currentMouse.y} | Nástroj: ${tool.toUpperCase()}`;

  if(isMoving && moveShapeIndex !== null){
    let s = shapes[moveShapeIndex];
    if(s.type==='line'){
      const dx = s.x2 - s.x1;
      const dy = s.y2 - s.y1;
      s.x1 = x - moveOffset.x;
      s.y1 = y - moveOffset.y;
      s.x2 = s.x1 + dx;
      s.y2 = s.y1 + dy;
    }else if(s.type==='circle'){
      s.cx = x - moveOffset.x;
      s.cy = y - moveOffset.y;
    }else if(s.type==='rect'){
      s.x = x - moveOffset.x;
      s.y = y - moveOffset.y;
    }else if(s.type==='text'){
      s.x = x - moveOffset.x;
      s.y = y - moveOffset.y;
    }
    drawAll();
    return;
  }

  if(startPt) drawAll();
}

function handleEnd(){
  if(isMoving){
    isMoving=false;
    saveToLocalStorage();
  }
}

canvas.onmousedown=(e)=>{ if(e.button===0) handleStart(e.clientX, e.clientY); };
canvas.onmousemove=(e)=> handleMove(e.clientX, e.clientY);
canvas.onmouseup=()=> handleEnd();

canvas.ontouchstart=(e)=>{
  if(e.touches.length === 1){
    handleStart(e.touches[0].clientX, e.touches[0].clientY);
    e.preventDefault();
  }
};
canvas.ontouchmove=(e)=>{
  if(e.touches.length === 1){
    handleMove(e.touches[0].clientX, e.touches[0].clientY);
    e.preventDefault();
  }
};
canvas.ontouchend=()=> handleEnd();

function moveShapeToPos(s, newX, newY){
  if(s.type==='line'){
    const dx = s.x2 - s.x1;
    const dy = s.y2 - s.y1;
    s.x1 = newX;
    s.y1 = newY;
    s.x2 = newX + dx;
    s.y2 = newY + dy;
  }else if(s.type==='circle'){
    s.cx = newX;
    s.cy = newY;
  }else if(s.type==='rect'){
    s.x = newX;
    s.y = newY;
  }else if(s.type==='text'){
    s.x = newX;
    s.y = newY;
  }
  saveToLocalStorage();
}

function getShapePos(s){
  if(s.type==='line') return {x: s.x1, y: s.y1};
  if(s.type==='circle') return {x: s.cx, y: s.cy};
  if(s.type==='rect') return {x: s.x, y: s.y};
  if(s.type==='text') return {x: s.x, y: s.y};
}

function updateDimensionsPanel(){
  if(document.activeElement && document.activeElement.tagName === 'INPUT' && dimsPanel.contains(document.activeElement)){
    return;
  }

  dimsContent.innerHTML='';
  if(shapes.length===0){
    dimsContent.innerHTML='Žiadne tvary';
    return;
  }

  shapes.forEach((s,i)=>{
    const card=document.createElement('div');
    card.className = `shape-card ${i===selectedShapeIndex ? 'active' : ''}`;
    
    card.onclick=(e)=>{
      if(e.target.tagName !== 'INPUT'){
        selectedShapeIndex=i;
        drawAll();
        logCommand(`Označený prvok #${i+1} (${s.type})`);
      }
    };

    const title=document.createElement('div');
    title.style.display = 'flex';
    title.style.justifyContent = 'space-between';
    title.style.alignItems = 'center';
    title.innerHTML=`<strong>#${i+1} (${s.type})</strong>`;
    
    const colorInp = document.createElement('input');
    colorInp.type = 'color';
    colorInp.value = s.color || (s.type==='text'?'#000000':'#10b981');
    colorInp.onchange = (e) => {
      pushState();
      s.color = e.target.value;
      saveToLocalStorage();
      drawAll();
    };
    title.appendChild(colorInp);
    card.appendChild(title);

    const pos = getShapePos(s);
    const posRow = document.createElement('div');
    posRow.className = 'input-row';
    posRow.innerHTML = `<label>Poz. X:</label><input type="number" value="${Math.round(pos.x)}" data-type="pos-x">` +
                      `<label>Y:</label><input type="number" value="${Math.round(pos.y)}" data-type="pos-y">`;
    card.appendChild(posRow);

    const inputs = posRow.querySelectorAll('input');
    inputs[0].onchange = (e) => {
      pushState();
      const val = parseFloat(e.target.value);
      if(!isNaN(val)){ moveShapeToPos(s, val, getShapePos(s).y); drawAll(); }
    };
    inputs[1].onchange = (e) => {
      pushState();
      const val = parseFloat(e.target.value);
      if(!isNaN(val)){ moveShapeToPos(s, getShapePos(s).x, val); drawAll(); }
    };

    const dimRow = document.createElement('div');
    dimRow.className = 'input-row';

    if(s.type==='line'){
      const len = Math.hypot(s.x2-s.x1, s.y2-s.y1).toFixed(1);
      const angleRad = Math.atan2(s.y2-s.y1, s.x2-s.x1);
      let angleDeg = Math.round(angleRad * (180 / Math.PI));
      if(angleDeg < 0) angleDeg += 360;

      dimRow.innerHTML = `<label>Dĺžka:</label><input type="number" value="${len}" data-type="len">` +
                         `<label>Uhol (°):</label><input type="number" value="${angleDeg}" data-type="angle">`;
      const inps = dimRow.querySelectorAll('input');
      
      inps[0].onchange = (e) => {
        pushState();
        const val = parseFloat(e.target.value);
        if(!isNaN(val) && val > 0){
          const currentAngle = Math.atan2(s.y2-s.y1, s.x2-s.x1);
          s.x2 = s.x1 + val * Math.cos(currentAngle);
          s.y2 = s.y1 + val * Math.sin(currentAngle);
          saveToLocalStorage();
          drawAll();
        }
      };

      inps[1].onchange = (e) => {
        pushState();
        const deg = parseFloat(e.target.value);
        if(!isNaN(deg)){
          const rad = deg * (Math.PI / 180);
          const currentLen = Math.hypot(s.x2-s.x1, s.y2-s.y1);
          s.x2 = s.x1 + currentLen * Math.cos(rad);
          s.y2 = s.y1 + currentLen * Math.sin(rad);
          saveToLocalStorage();
          drawAll();
        }
      };
    }else if(s.type==='rect'){
      dimRow.innerHTML = `<label>Šírka:</label><input type="number" value="${Math.abs(s.w).toFixed(1)}" data-type="w">` +
                         `<label>Výška:</label><input type="number" value="${Math.abs(s.h).toFixed(1)}" data-type="h">`;
      const inps = dimRow.querySelectorAll('input');
      inps[0].onchange = (e) => {
        pushState();
        const val = parseFloat(e.target.value);
        if(!isNaN(val)){ s.w = val * (s.w < 0 ? -1 : 1); saveToLocalStorage(); drawAll(); }
      };
      inps[1].onchange = (e) => {
        pushState();
        const val = parseFloat(e.target.value);
        if(!isNaN(val)){ s.h = val * (s.h < 0 ? -1 : 1); saveToLocalStorage(); drawAll(); }
      };
    }else if(s.type==='circle'){
      dimRow.innerHTML = `<label>Polomer:</label><input type="number" value="${s.r.toFixed(1)}" data-type="r">`;
      const inp = dimRow.querySelector('input');
      inp.onchange = (e) => {
        pushState();
        const val = parseFloat(e.target.value);
        if(!isNaN(val) && val > 0){ s.r = val; saveToLocalStorage(); drawAll(); }
      };
    }else if(s.type==='text'){
      dimRow.innerHTML = `<label>Text:</label><input type="text" value="${s.text}" data-type="text">` +
                         `<label>Px:</label><input type="number" value="${s.size || 16}" data-type="size">`;
      const inps = dimRow.querySelectorAll('input');
      inps[0].onchange = (e) => {
        pushState();
        s.text = e.target.value;
        saveToLocalStorage();
        drawAll();
      };
      inps[1].onchange = (e) => {
        pushState();
        const val = parseInt(e.target.value);
        if(!isNaN(val) && val > 0){ s.size = val; saveToLocalStorage(); drawAll(); }
      };
    }

    card.appendChild(dimRow);
    dimsContent.appendChild(card);
  });
}

loadFromLocalStorage();
</script>
</body>
</html>
