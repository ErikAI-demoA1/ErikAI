<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ErikAI HTML+CSS Engine — v3</title>
<style>
:root {
  --ui-bg:#f6f7fb;--panel:#ffffff;--accent:#ff3b3b;--muted:#666;
}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#eef2fb,#f7f9ff);color:#111}
header{padding:18px 20px;display:flex;align-items:center;gap:16px}
header h1{margin:0;font-size:18px;color:#111}
.wrap{display:flex;gap:18px;padding:12px}
.left {width:360px; min-width:260px}
.panel {background:var(--panel);border-radius:12px;padding:14px;box-shadow:0 6px 20px rgba(20,30,60,.06)}
label{display:block;font-size:13px;color:var(--muted);margin-top:8px}
input[type="text"], input[type="number"], select, textarea {width:100%;box-sizing:border-box;padding:8px;border-radius:8px;border:1px solid #e3e6ee;margin-top:6px;font-size:14px}
button{margin-top:10px;padding:8px 12px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button.secondary{background:#2b7cff}
.scene-wrap{flex:1;display:flex;flex-direction:column;gap:12px}
.scene {background:linear-gradient(180deg,#fff,#fafcff);border-radius:12px;min-height:520px;position:relative;overflow:hidden;border:1px solid #e6e9f2}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.objects-list{max-height:200px;overflow:auto;margin-top:8px}
.obj-item{display:flex;justify-content:space-between;padding:6px 8px;border-radius:8px;margin-bottom:6px;background:#fbfbff;border:1px solid #eef0f8;font-size:14px}
.obj-item button{padding:6px 8px;border-radius:8px;background:#ddd;color:#111;border:0;cursor:pointer}
.scene-inner{position:relative;width:100%;height:520px;background:repeating-linear-gradient(45deg,#fafbff 0 1px, transparent 1px 24px)}
.scene-element{position:absolute;cursor:grab;user-select:none;touch-action:none;box-sizing:border-box}
.selected{outline:2px dashed rgba(0,120,255,.35);transform:scale(1.01)}
.controls-row{display:flex;gap:8px;align-items:center}
#codePreview{width:100%;height:160px;margin-top:8px;padding:8px;border-radius:8px;border:1px solid #e6e9f2;background:#0f1724;color:#dbeafe;font-family:monospace;overflow:auto;white-space:pre;}
footer{padding:12px;text-align:center;color:var(--muted);font-size:13px}
@media (max-width:900px){.wrap{flex-direction:column}.left{width:100%}}
</style>
</head>
<body>

<header>
<h1>ErikAI HTML+CSS Engine — v3</h1>
<div style="color:var(--muted);font-size:13px">Drag & drop + live HTML/CSS preview</div>
</header>

<div class="wrap">

<div class="left">
<div class="panel">
<strong>Pridať objekt</strong>
<label>Názov (interný)</label>
<input id="objName" type="text" placeholder="napr. nadpis1">
<label>Typ objektu</label>
<select id="objType">
  <option value="text">Text</option>
  <option value="button">Tlačidlo</option>
  <option value="image">Obrázok (URL)</option>
</select>

<div id="textInputs">
<label>Text</label>
<input id="objText" type="text" placeholder="Zadaj text...">
<label>Farba textu</label>
<input id="objColor" type="color" value="#111111">
<div class="controls-row">
<div style="flex:1">
<label>Veľkosť (px)</label>
<input id="objSize" type="number" value="24" min="8" max="200">
</div>
<div style="width:110px">
<label>Štýl</label>
<select id="objStyle">
  <option value="normal">normálny</option>
  <option value="italic">kurzíva</option>
  <option value="bold">tučný</option>
</select>
</div>
</div>
</div>

<div id="imageInputs" style="display:none">
<label>URL obrázka</label>
<input id="objImageUrl" type="text" placeholder="https://...">
<label>Šírka (px)</label>
<input id="objImgW" type="number" value="120">
<label>Výška (px)</label>
<input id="objImgH" type="number" value="80">
</div>

<div id="buttonInputs" style="display:none">
<label>Štítok tlačidla</label>
<input id="objBtnText" type="text" placeholder="Klikni sem">
</div>

<label>Počiatočná pozícia X (px)</label>
<input id="posX" type="number" value="40">
<label>Počiatočná pozícia Y (px)</label>
<input id="posY" type="number" value="40">

<button id="addObjBtn">➕ Pridať objekt</button>

<hr style="margin:12px 0;border:none;border-top:1px solid #eef2fb">

<strong>Objekty v scéne</strong>
<div class="objects-list" id="objectsList"></div>

<button id="clearBtn" class="secondary">Vymazať všetko</button>

<hr style="margin:12px 0;border:none;border-top:1px solid #eef2fb">
<strong>Export / HTML preview</strong>
<button id="downloadBtn">⬇ Stiahnuť HTML</button>
<button id="showCodeBtn" class="secondary">Zobraziť kód</button>
<pre id="codePreview" style="display:none;"></pre>
</div>
</div>

<div class="scene-wrap">
<div class="panel toolbar">
<div style="flex:1;font-weight:600">Scéna / Náhľad</div>
<div style="color:var(--muted)">Klikni + ťahaj element pre presun</div>
</div>
<div class="scene panel">
<div class="scene-inner" id="sceneInner"></div>
</div>
</div>

<footer>© 2025 Erik Mohylák — ErikAI Engine HTML+CSS</footer>

<script>
let elems = [];
let selectedId = null;
const sceneInner = document.getElementById('sceneInner');
const objectsList = document.getElementById('objectsList');
const codePreview = document.getElementById('codePreview');

function uid(p='el'){return p+Math.random().toString(36).slice(2,9);}
function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

const objType = document.getElementById('objType');
objType.addEventListener('change', ()=>{
  document.getElementById('textInputs').style.display = objType.value==='text' ? '' : 'none';
  document.getElementById('imageInputs').style.display = objType.value==='image' ? '' : 'none';
  document.getElementById('buttonInputs').style.display = objType.value==='button' ? '' : 'none';
});

document.getElementById('addObjBtn').addEventListener('click', ()=>{
  const name = (document.getElementById('objName').value || '').trim() || 'obj_'+(elems.length+1);
  const type = document.getElementById('objType').value;
  const x = parseInt(document.getElementById('posX').value)||20;
  const y = parseInt(document.getElementById('posY').value)||20;
  const id = uid();
  const base = {id,name,type,x,y,w:null,h:null,props:{}};
  if(type==='text'){
    base.props.text = document.getElementById('objText').value||'Text';
    base.props.color = document.getElementById('objColor').value||'#111';
    base.props.size = parseInt(document.getElementById('objSize').value)||24;
    base.props.style = document.getElementById('objStyle').value||'normal';
  } else if(type==='image'){
    base.props.url = document.getElementById('objImageUrl').value||'';
    base.w = parseInt(document.getElementById('objImgW').value)||120;
    base.h = parseInt(document.getElementById('objImgH').value)||80;
  } else if(type==='button'){
    base.props.label = document.getElementById('objBtnText').value||'Klik';
    base.props.bg = '#2b7cff';
    base.props.color = '#fff';
    base.props.size = 16;
  }
  elems.push(base);
  renderScene(); renderList(); updateCodePreview();
});

function renderScene(){
  sceneInner.innerHTML = '';
  elems.forEach(el=>{
    const div = document.createElement(el.type==='image'?'img':'div');
    div.className='scene-element';
    div.dataset.id = el.id;
    div.style.position='absolute';
    div.style.left = el.x+'px';
    div.style.top = el.y+'px';
    if(el.type==='text'){
      div.style.fontSize = el.props.size+'px';
      div.style.color = el.props.color;
      div.style.fontStyle = el.props.style==='italic'?'italic':'normal';
      div.style.fontWeight = el.props.style==='bold'?'700':'400';
      div.textContent = el.props.text;
    } else if(el.type==='image'){
      div.src = el.props.url;
      div.style.width = (el.w||120)+'px';
      div.style.height = (el.h||80)+'px';
    } else if(el.type==='button'){
      div.textContent = el.props.label;
      div.style.padding='6px 10px';
      div.style.background=el.props.bg;
      div.style.color=el.props.color;
      div.style.fontSize = el.props.size+'px';
      div.style.border='none';
      div.style.borderRadius='8px';
    }
    makeDraggable(div);
    sceneInner.appendChild(div);
  });
}

function renderList(){
  objectsList.innerHTML='';
  elems.forEach(el=>{
    const div = document.createElement('div');
    div.className='obj-item';
    div.innerHTML = `<div>${el.name} (${el.type})</div>
      <div style="display:flex;gap:6px">
        <button onclick="removeElem('${el.id}')">✖</button>
      </div>`;
    objectsList.appendChild(div);
  });
}

function makeDraggable(node){
  let startX,startY,origX,origY,dragging=false;
  node.onpointerdown = ev=>{
    ev.preventDefault(); node.setPointerCapture(ev.pointerId);
    startX = ev.clientX; startY = ev.clientY;
    const el = elems.find(e=>e.id===node.dataset.id);
    origX = el.x; origY = el.y; dragging=true;
  };
  node.onpointermove = ev=>{
    if(!dragging) return;
    const el = elems.find(e=>e.id===node.dataset.id);
    el.x = Math.max(0, Math.round(origX + (ev.clientX-startX)));
    el.y = Math.max(0, Math.round(origY + (ev.clientY-startY)));
    node.style.left = el.x+'px';
    node.style.top = el.y+'px';
    updateCodePreview();
  };
  node.onpointerup = ev=>{dragging=false; try{node.releasePointerCapture(ev.pointerId);}catch(e){}};
}

function removeElem(id){
  elems = elems.filter(e=>e.id!==id); renderScene(); renderList(); updateCodePreview();
}

function updateCodePreview(){
  const html = elems.map(el=>{
    if(el.type==='text') return `<div style="position:absolute;left:${el.x}px;top:${el.y}px;font-size:${el.props.size}px;color:${el.props.color};font-weight:${el.props.style==='bold'?'700':'400'};font-style:${el.props.style==='italic'?'italic':'normal'}">${escapeHtml(el.props.text)}</div>`;
    if(el.type==='button') return `<button style="position:absolute;left:${el.x}px;top:${el.y}px;font-size:${el.props.size}px;padding:6px 10px;border:none;border-radius:8px;background:${el.props.bg};color:${el.props.color}">${escapeHtml(el.props.label)}</button>`;
    if(el.type==='image') return `<img src="${escapeHtml(el.props.url)}" style="position:absolute;left:${el.x}px;top:${el.y}px;width:${el.w}px;height:${el.h}px">`;
    return '';
  }).join('\n');
  codePreview.textContent = html;
}

document.getElementById('downloadBtn').addEventListener('click', ()=>{
  const html = `<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export</title></head><body>${codePreview.textContent}</body></html>`;
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='erikai_scene.html'; a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('showCodeBtn').addEventListener('click', ()=>{
  codePreview.style.display = codePreview.style.display==='none'?'':'none';
});

renderScene(); renderList(); updateCodePreview();
</script>
</body>
</html>
