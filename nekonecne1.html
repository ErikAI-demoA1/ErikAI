<!DOCTYPE html><html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nekonečné Počítadlo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #111;
      color: white;
    }
    #number {
      font-size: 5rem;
      font-weight: bold;
      transition: color 0.3s ease;
    }
    button {
      padding: 12px 24px;
      margin-top: 20px;
      font-size: 1.2rem;
      cursor: pointer;
      border-radius: 10px;
      border: none;
    }
  </style>
</head>
<body>
  <div id="number">0</div>
  <button id="startBtn">START</button><script>
let count = 0;
let delay = 1000; // 1 sekunda
let running = false;
let timer;

// Obnova posledného čísla z uloženia
if(localStorage.getItem("counterValue")){
  count = parseInt(localStorage.getItem("counterValue"));
  document.getElementById("number").textContent = count;
}

function randomColor(){
  return `hsl(${Math.random()*360}, 80%, 60%)`;
}

function loop(){
  timer = setTimeout(()=>{
    count++;
    delay = Math.max(50, delay - 100); // zrýchľovanie o 0,1s (100ms)

    document.getElementById("number").textContent = count;
    document.getElementById("number").style.color = randomColor();

    localStorage.setItem("counterValue", count);

    loop();
  }, delay);
}

document.getElementById("startBtn").onclick = ()=>{
  if(!running){
    running = true;
    loop();
  }
};
</script></body>
</html>
