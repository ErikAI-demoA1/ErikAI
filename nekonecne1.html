<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ErikAI - Nekonečné čísla a písmená</title>
<style>
  body{
    margin:0;
    font-family: monospace;
    background: #061426;
    color: #e6f6ff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    overflow:hidden;
  }
  #number{
    font-size: 48px;
    font-weight: bold;
    margin-bottom: 40px;
    transition: color 0.2s;
  }
  #canvas{
    width: 90vw;
    height: 200px;
    background: #041426;
    border:1px solid rgba(255,255,255,0.1);
  }
  button{
    padding:10px 20px;
    font-size:16px;
    border:none;
    border-radius:8px;
    background: #06b6d4;
    color:#021;
    cursor:pointer;
    margin-top:20px;
  }
</style>
</head>
<body>

<div id="number">0</div>
<canvas id="canvas"></canvas>
<button id="startBtn">Štart</button>

<script>
const numberEl = document.getElementById('number');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = canvas.clientWidth;
canvas.height = canvas.clientHeight;

let value = parseInt(localStorage.getItem('lastValue') || '0');
let interval = 1000;
let running = false;

// ErikAI písmená a počet bodiek pre dokončenie
const letters = [
  {char:'E', needed:1000, dots:[]},
  {char:'r', needed:10000, dots:[]},
  {char:'i', needed:100000, dots:[]},
  {char:'k', needed:1000000, dots:[]},
  {char:'A', needed:1000000, dots:[]},
  {char:'I', needed:Infinity, dots:[]}
];

function getRandomColor(){
  return 'hsl(' + Math.floor(Math.random()*360) + ',70%,60%)';
}

// vykreslenie všetkých bodiek a písmen
function drawLetters(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const baseY = canvas.height/2;
  let xOffset = 20;
  letters.forEach(letter=>{
    letter.dots.forEach(d=>{
      ctx.fillStyle = d.color;
      ctx.fillText('.', xOffset + d.x, baseY + d.y);
    });
    // ak dosiahli počet bodiek -> vykresli písmeno
    if(letter.dots.length >= letter.needed && letter.needed !== Infinity){
      ctx.fillStyle = '#06b6d4';
      ctx.fillText(letter.char, xOffset, baseY);
    }
    xOffset += 40;
  });
}

// pridanie novej bodky pre písmená
function addDot(){
  letters.forEach(letter=>{
    // ak písmeno ešte nie je dokončené alebo nekonečné
    if(letter.dots.length < letter.needed){
      const x = Math.random()*20;
      const y = Math.random()*20 - 10;
      letter.dots.push({x:x, y:y, color:getRandomColor()});
    }
  });
}

function step(){
  if(!running) return;
  value++;
  numberEl.textContent = value;
  numberEl.style.color = getRandomColor();
  localStorage.setItem('lastValue', value);

  addDot();
  drawLetters();

  interval = Math.max(10, interval * 0.995); // zrýchľovanie
  setTimeout(step, interval);
}

document.getElementById('startBtn').addEventListener('click', ()=>{
  if(!running){
    running = true;
    step();
  }
});
</script>

</body>
</html>
