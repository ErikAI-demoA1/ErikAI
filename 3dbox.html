<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI OS — 3D Studio Generátor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<!-- Knižnica pre 3D rendering priamo v prehliadači -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
  :root {
    --bg-deep: #030712;
    --card-glass: rgba(17, 24, 39, 0.95);
    --card-border: rgba(255, 255, 255, 0.1);
    --neon-blue: #3b82f6;
    --neon-orange: #f97316;
    --neon-green: #22c55e;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-deep);
    color: var(--text-main);
    min-height: 100vh;
    padding: 20px;
  }

  .app-container {
    display: grid;
    grid-template-columns: 420px 1fr;
    gap: 20px;
    max-width: 1600px;
    margin: 0 auto;
  }

  @media (max-width: 1024px) {
    .app-container { grid-template-columns: 1fr; }
  }

  .editor-card {
    background: var(--card-glass);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 25px;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 900;
    background: linear-gradient(135deg, #fff 40%, var(--neon-blue), var(--neon-orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 5px;
  }

  p.sub { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }

  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 4px; text-transform: uppercase; color: var(--neon-blue); }

  input[type="file"] {
    width: 100%;
    padding: 8px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: #fff;
    font-size: 0.85rem;
  }

  .btn-gen {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    background: linear-gradient(90deg, var(--neon-blue), var(--neon-orange));
    border: none;
    border-radius: 10px;
    color: #fff;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
  }
  .btn-gen:hover { transform: translateY(-2px); }

  .preview-card {
    background: #000;
    border: 1px solid var(--card-border);
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    height: calc(100vh - 40px);
    display: flex;
    flex-direction: column;
  }

  .preview-header {
    background: #1e293b;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--card-border);
    font-size: 0.85rem;
    font-weight: 700;
    z-index: 10;
  }

  #canvasContainer {
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #1e293b 0%, #030712 100%);
  }

  .hint {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.8rem;
    color: var(--text-muted);
    pointer-events: none;
    border: 1px solid var(--card-border);
  }
</style>
</head>
<body>

  <div class="app-container">
    
    <!-- EDITOR -->
    <div class="editor-card">
      <h1>🧊 ErikAI 3D Studio v1</h1>
      <p class="sub">Priraď fotky alebo videá pre jednotlivé steny 3D objektu.</p>

      <form id="mediaForm">
        
        <div class="form-group">
          <label>1. Predná strana (Front)</label>
          <input type="file" accept="image/*,video/*" onchange="nacitajMedia(0, event)">
        </div>

        <div class="form-group">
          <label>2. Zadná strana (Back)</label>
          <input type="file" accept="image/*,video/*" onchange="nacitajMedia(1, event)">
        </div>

        <div class="form-group">
          <label>3. Pravá strana (Right)</label>
          <input type="file" accept="image/*,video/*" onchange="nacitajMedia(2, event)">
        </div>

        <div class="form-group">
          <label>4. Ľavá strana (Left)</label>
          <input type="file" accept="image/*,video/*" onchange="nacitajMedia(3, event)">
        </div>

        <div class="form-group">
          <label>5. Horná strana (Top - voliteľné)</label>
          <input type="file" accept="image/*,video/*" onchange="nacitajMedia(4, event)">
        </div>

        <div class="form-group">
          <label>6. Spodná strana (Bottom - voliteľné)</label>
          <input type="file" accept="image/*,video/*" onchange="nacitajMedia(5, event)">
        </div>

        <button type="button" class="btn-gen" onclick="stiahni3DHTML()">💾 Stiahnuť 3D Web (.html)</button>
      </form>
    </div>

    <!-- 3D NÁHĽAD -->
    <div class="preview-card">
      <div class="preview-header">
        <div>🎮 INTERAKTÍVNY 3D NÁHĽAD</div>
        <div style="color: var(--neon-green)">ONLINE</div>
      </div>
      <div id="canvasContainer"></div>
      <div class="hint">🖱️ Otáčaj prstom/myšou | Kolieskom približuj</div>
    </div>

  </div>

<script>
  let scene, camera, renderer, controls, cube;
  let materials = [];
  let mediaData = [null, null, null, null, null, null]; // Base64 dáta pre 6 stien

  // Inicializácia Three.js scény
  function init3D() {
    const container = document.getElementById('canvasContainer');
    
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(3, 2, 4);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Svetlá
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // Vytvorenie základných 6 stien
    for (let i = 0; i < 6; i++) {
      materials.push(new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.4 }));
    }

    const geometry = new THREE.BoxGeometry(2, 2, 2);
    cube = new THREE.Mesh(geometry, materials);
    scene.add(cube);

    animate();
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  // Načítanie súboru (Fotka / Video) a aplikácia na stenu
  function nacitajMedia(index, event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    const isVideo = file.type.startsWith('video/');

    reader.onload = function(e) {
      const src = e.target.result;
      mediaData[index] = { src: src, isVideo: isVideo };

      if (isVideo) {
        const video = document.createElement('video');
        video.src = src;
        video.autoplay = true;
        video.loop = true;
        video.muted = true;
        video.play();

        const texture = new THREE.VideoTexture(video);
        materials[index] = new THREE.MeshBasicMaterial({ map: texture });
      } else {
        const loader = new THREE.TextureLoader();
        loader.load(src, function(texture) {
          materials[index] = new THREE.MeshBasicMaterial({ map: texture });
          cube.material = materials;
        });
      }
      cube.material = materials;
    };

    reader.readAsDataURL(file);
  }

  // Stiahnutie samostatného HTML súboru
  function stiahni3DHTML() {
    const htmlContent = `<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vlastný 3D Objekt — ErikAI OS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"><\/script>
<style>
  body { margin: 0; background: #030712; overflow: hidden; font-family: sans-serif; }
  #canvas { width: 100vw; height: 100vh; }
  .info { position: absolute; top: 20px; left: 20px; color: #fff; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
</style>
</head>
<body>
  <div class="info">🧊 Otáčaj 3D objektom prstom alebo myšou</div>
  <div id="canvas"></div>

<script>
  const mediaData = ${JSON.stringify(mediaData)};
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(3, 2, 4);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById('canvas').appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
  scene.add(ambientLight);

  const materials = [];
  for (let i = 0; i < 6; i++) {
    const item = mediaData[i];
    if (item && item.src) {
      if (item.isVideo) {
        const video = document.createElement('video');
        video.src = item.src;
        video.autoplay = true; video.loop = true; video.muted = true; video.play();
        materials.push(new THREE.MeshBasicMaterial({ map: new THREE.VideoTexture(video) }));
      } else {
        const texture = new THREE.TextureLoader().load(item.src);
        materials.push(new THREE.MeshBasicMaterial({ map: texture }));
      }
    } else {
      materials.push(new THREE.MeshStandardMaterial({ color: 0x1e293b }));
    }
  }

  const cube = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), materials);
  scene.add(cube);

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
<\/script>
</body>
</html>`;

    const blob = new Blob([htmlContent], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'moj_3d_objekt.html';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  window.onload = init3D;
</script>
</body>
</html>
