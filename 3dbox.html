<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI OS — 3D Studio v5 (OP Ultimate Audio & Light)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<!-- Three.js Engine & Controls -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
  :root {
    --bg-deep: #030712;
    --card-glass: rgba(17, 24, 39, 0.95);
    --card-border: rgba(255, 255, 255, 0.12);
    --neon-blue: #3b82f6;
    --neon-orange: #f97316;
    --neon-red: #ef4444;
    --neon-green: #22c55e;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-deep);
    color: var(--text-main);
    min-height: 100vh;
    padding: 15px;
  }

  .app-container {
    display: grid;
    grid-template-columns: 420px 1fr;
    gap: 20px;
    max-width: 1600px;
    margin: 0 auto;
  }

  @media (max-width: 1024px) {
    .app-container { grid-template-columns: 1fr; }
  }

  /* EDITOR PANEL */
  .editor-card {
    background: var(--card-glass);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 22px;
    max-height: calc(100vh - 30px);
    overflow-y: auto;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 900;
    background: linear-gradient(135deg, #fff 40%, var(--neon-blue), var(--neon-red));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }

  p.sub { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 18px; }

  .section-title {
    font-size: 0.75rem;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--neon-blue);
    letter-spacing: 1px;
    margin: 15px 0 10px 0;
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 4px;
  }

  .form-group { margin-bottom: 10px; }
  label { 
    display: flex; 
    justify-content: space-between; 
    font-size: 0.72rem; 
    font-weight: 800; 
    margin-bottom: 4px; 
    text-transform: uppercase; 
    color: var(--text-main); 
  }
  label span.status { color: var(--text-muted); font-weight: 400; text-transform: none; }

  select, input[type="file"] {
    width: 100%;
    padding: 9px 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: #fff;
    font-size: 0.85rem;
    outline: none;
  }

  .btn-gen {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    background: linear-gradient(90deg, var(--neon-blue), var(--neon-red));
    border: none;
    border-radius: 10px;
    color: #fff;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
    transition: transform 0.2s ease;
  }
  .btn-gen:hover { transform: translateY(-2px); }

  /* PREVIEW PANEL */
  .preview-card {
    background: #030712;
    border: 1px solid var(--card-border);
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    height: calc(100vh - 30px);
    display: flex;
    flex-direction: column;
    min-height: 450px;
  }

  .preview-header {
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(10px);
    padding: 10px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--card-border);
    font-size: 0.8rem;
    font-weight: 800;
    z-index: 10;
  }

  #canvasContainer {
    width: 100%;
    height: 100%;
    flex: 1;
    position: relative;
  }

  /* INTENSE RED-BLACK PULSING ATMOSPHERE */
  .pulse-bg {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 500px;
    height: 500px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(239, 68, 68, 0.35) 0%, rgba(3, 7, 18, 0.9) 65%);
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
    animation: breathe 5s infinite ease-in-out;
  }

  @keyframes breathe {
    0% { opacity: 0.15; transform: translate(-50%, -50%) scale(0.75); }
    50% { opacity: 0.65; transform: translate(-50%, -50%) scale(1.25); }
    100% { opacity: 0.15; transform: translate(-50%, -50%) scale(0.75); }
  }

  .hint {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.75rem;
    color: var(--text-muted);
    pointer-events: none;
    border: 1px solid var(--card-border);
    white-space: nowrap;
    z-index: 10;
  }
</style>
</head>
<body>

  <div class="app-container">
    
    <!-- EDITOR -->
    <div class="editor-card">
      <h1>🧊 ErikAI 3D Studio v5</h1>
      <p class="sub">Pokročilé pulzujúce prostredie, audio ikona a dynamické tvary.</p>

      <form id="mediaForm">
        
        <div class="section-title">📐 1. Výber Tvaru Objektu</div>
        <div class="form-group">
          <label>Tvar 3D Objektu</label>
          <select id="shapeType" onchange="zmenTvar()">
            <option value="box">Kváder / Kocka (6 strán)</option>
            <option value="cylinder">Valec (Plášť + Vrch/Spodok)</option>
            <option value="sphere">Guľa (360° Textúra)</option>
          </select>
        </div>

        <div class="section-title">🎵 3. Zvuk / Hudba na pozadí</div>
        <div class="form-group">
          <label>Zvukový súbor (MP3/WAV) <span class="status" id="st-audio">Žiadny</span></label>
          <input type="file" accept="audio/*" onchange="nacitajAudio(event)">
        </div>

        <div class="section-title" id="inputsTitle">🖼️ 2. Média pre Kocku</div>
        <div id="dynamicInputsContainer"></div>

        <button type="button" class="btn-gen" onclick="stiahni3DHTML()">🚀 Stiahnuť OP 3D Web (.html)</button>
      </form>
    </div>

    <!-- 3D NÁHĽAD -->
    <div class="preview-card">
      <div class="preview-header">
        <div>⚡ 3D NÁHĽAD (OP ATMOSPHERE)</div>
        <div style="color: var(--neon-green)">ONLINE</div>
      </div>
      <div id="canvasContainer">
        <div class="pulse-bg"></div>
      </div>
      <div class="hint">🖱️ Otáčaj prstom / myšou | Kolieskom približuj</div>
    </div>

  </div>

<script>
  let scene, camera, renderer, controls, mesh;
  let currentShape = "box";
  let mediaSlotsData = {};
  let backgroundAudioSrc = null;

  const shapeConfig = {
    box: [
      { id: 0, label: "1. Predná strana" },
      { id: 1, label: "2. Zadná strana" },
      { id: 2, label: "3. Pravá strana" },
      { id: 3, label: "4. Ľavá strana" },
      { id: 4, label: "5. Vrchná strana" },
      { id: 5, label: "6. Spodná strana" }
    ],
    cylinder: [
      { id: 0, label: "1. Hlavný plášť valca" },
      { id: 1, label: "2. Vrchný kruh" },
      { id: 2, label: "3. Spodný kruh" }
    ],
    sphere: [
      { id: 0, label: "1. Celá 360° Textúra gule" }
    ]
  };

  function init3D() {
    const container = document.getElementById('canvasContainer');
    
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(3.5, 2.2, 4.5);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    zmenTvar();

    const resizeObserver = new ResizeObserver(() => {
      if (!container.clientWidth || !container.clientHeight) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
    resizeObserver.observe(container);

    animate();
  }

  function zmenTvar() {
    currentShape = document.getElementById('shapeType').value;
    mediaSlotsData = {};

    const container = document.getElementById('dynamicInputsContainer');
    const titleEl = document.getElementById('inputsTitle');
    container.innerHTML = "";

    if (currentShape === 'box') titleEl.textContent = "🖼️ 2. Média pre Kocku (6 strán)";
    else if (currentShape === 'cylinder') titleEl.textContent = "🖼️ 2. Média pre Valec";
    else titleEl.textContent = "🖼️ 2. Média pre Guľu";

    shapeConfig[currentShape].forEach(slot => {
      container.innerHTML += `
        <div class="form-group">
          <label>${slot.label} <span class="status" id="st-${slot.id}">Prázdne</span></label>
          <input type="file" accept="*" onchange="nacitajMedia(${slot.id}, event)">
        </div>
      `;
    });

    vytvorObjekt();
  }

  function vytvorObjekt() {
    if (mesh) scene.remove(mesh);

    let geometry;
    let materials = [];

    if (currentShape === "cylinder") {
      geometry = new THREE.CylinderGeometry(1.2, 1.2, 2.2, 64);
      for (let i = 0; i < 3; i++) {
        materials.push(new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3 }));
      }
    } else if (currentShape === "sphere") {
      geometry = new THREE.SphereGeometry(1.4, 64, 64);
      materials = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3 });
    } else {
      geometry = new THREE.BoxGeometry(2, 2, 2, 16, 16, 16);
      for (let i = 0; i < 6; i++) {
        materials.push(new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3 }));
      }
    }

    mesh = new THREE.Mesh(geometry, materials);
    scene.add(mesh);
    obnovMaterialy();
  }

  function nacitajMedia(slotId, event) {
    const file = event.target.files[0];
    if (!file) return;

    const statusEl = document.getElementById('st-' + slotId);
    statusEl.textContent = "Načítavam...";

    const reader = new FileReader();
    const isVideo = file.type.startsWith('video/') || file.name.match(/\.(mp4|webm|ogg|mov)$/i);

    reader.onload = function(e) {
      const src = e.target.result;
      mediaSlotsData[slotId] = { src: src, isVideo: isVideo };

      statusEl.textContent = isVideo ? "🎬 Video" : "🖼️ Fotka";
      statusEl.style.color = isVideo ? "#22c55e" : "#3b82f6";

      obnovMaterialy();
    };
    reader.readAsDataURL(file);
  }

  function nacitajAudio(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      backgroundAudioSrc = e.target.result;
      document.getElementById('st-audio').textContent = "🎵 " + file.name.substring(0, 15) + "...";
      document.getElementById('st-audio').style.color = "#22c55e";
    };
    reader.readAsDataURL(file);
  }

  function obnovMaterialy() {
    if (!mesh) return;

    if (currentShape === "sphere") {
      const slot = mediaSlotsData[0];
      if (slot && slot.src) {
        if (slot.isVideo) {
          const video = document.createElement('video');
          video.src = slot.src; video.autoplay = true; video.loop = true; video.muted = true; video.setAttribute('playsinline', ''); video.play();
          mesh.material = new THREE.MeshBasicMaterial({ map: new THREE.VideoTexture(video) });
        } else {
          new THREE.TextureLoader().load(slot.src, (texture) => {
            mesh.material = new THREE.MeshBasicMaterial({ map: texture });
          });
        }
      }
    } else {
      const mats = mesh.material;
      shapeConfig[currentShape].forEach((slotConfig, index) => {
        const slot = mediaSlotsData[slotConfig.id];
        if (slot && slot.src) {
          if (slot.isVideo) {
            const video = document.createElement('video');
            video.src = slot.src; video.autoplay = true; video.loop = true; video.muted = true; video.setAttribute('playsinline', ''); video.play();
            mats[index] = new THREE.MeshBasicMaterial({ map: new THREE.VideoTexture(video) });
          } else {
            new THREE.TextureLoader().load(slot.src, (texture) => {
              mats[index] = new THREE.MeshBasicMaterial({ map: texture });
            });
          }
        }
      });
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  function stiahni3DHTML() {
    const htmlContent = `<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vlastný 3D Objekt OP — ErikAI OS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"><\/script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin: 0; background: #030712; overflow: hidden; font-family: sans-serif; position: relative; }
  #canvas { width: 100vw; height: 100vh; position: relative; z-index: 2; }
  
  /* Intenzívne červeno-čierne pulzujúce pozadie */
  .pulse-bg {
    position: absolute; top: 50%; left: 50%; width: 550px; height: 550px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(239, 68, 68, 0.35) 0%, rgba(3, 7, 18, 0.95) 70%);
    border-radius: 50%; filter: blur(75px); pointer-events: none; z-index: 1;
    animation: breathe 5s infinite ease-in-out;
  }
  @keyframes breathe {
    0% { opacity: 0.15; transform: translate(-50%, -50%) scale(0.75); }
    50% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.3); }
    100% { opacity: 0.15; transform: translate(-50%, -50%) scale(0.75); }
  }

  .info { position: absolute; top: 20px; left: 20px; color: #fff; background: rgba(0,0,0,0.75); padding: 10px 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); font-size: 0.9rem; z-index: 10; backdrop-filter: blur(10px); }
  
  /* Štýlové plávajúce tlačidlo audio ikony */
  .audio-btn {
    position: absolute; bottom: 25px; right: 25px;
    background: rgba(17, 24, 39, 0.85);
    color: #fff; border: 1px solid rgba(239, 68, 68, 0.4);
    width: 55px; height: 55px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; cursor: pointer; z-index: 100;
    box-shadow: 0 10px 25px rgba(239, 68, 68, 0.3);
    transition: transform 0.2s, background 0.2s;
    backdrop-filter: blur(10px);
  }
  .audio-btn:hover { transform: scale(1.1); background: rgba(239, 68, 68, 0.2); }
</style>
</head>
<body>
  <div class="pulse-bg"></div>
  <div class="info">🧊 3D Objekt OP — ErikAI OS</div>
  
  ${backgroundAudioSrc ? `
    <button id="audioBtn" class="audio-btn" onclick="toggleAudio()" title="Zapnúť/Vypnúť hudbu">🔇</button>
    <audio id="bgAudio" loop><source src="${backgroundAudioSrc}" type="audio/mp3"></audio>
  ` : ''}

  <div id="canvas"></div>

<script>
  const mediaData = ${JSON.stringify(mediaSlotsData)};
  const shapeType = "${currentShape}";
  
  function toggleAudio() {
    const audio = document.getElementById('bgAudio');
    const btn = document.getElementById('audioBtn');
    if (!audio) return;
    
    if (audio.paused) {
      audio.play().then(() => {
        btn.textContent = "🔊";
      }).catch(e => console.log("Audio play error:", e));
    } else {
      audio.pause();
      btn.textContent = "🔇";
    }
  }

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(3.5, 2.2, 4.5);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.getElementById('canvas').appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // Dynamické pulzujúce červené svetlo v 3D scéne, ktoré imituje pozadie
  const pulseLight = new THREE.PointLight(0xef4444, 2, 10);
  pulseLight.position.set(0, 0, 3);
  scene.add(pulseLight);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambientLight);

  let geometry, mesh;
  let materials = shapeType === 'sphere' ? new THREE.MeshStandardMaterial({color: 0x1e293b}) : [];

  if (shapeType === 'cylinder') {
    geometry = new THREE.CylinderGeometry(1.2, 1.2, 2.2, 64);
    for(let i=0; i<3; i++) materials.push(new THREE.MeshStandardMaterial({color: 0x1e293b}));
  } else if (shapeType === 'sphere') {
    geometry = new THREE.SphereGeometry(1.4, 64, 64);
  } else {
    geometry = new THREE.BoxGeometry(2, 2, 2, 16, 16, 16);
    for(let i=0; i<6; i++) materials.push(new THREE.MeshStandardMaterial({color: 0x1e293b}));
  }

  mesh = new THREE.Mesh(geometry, materials);
  scene.add(mesh);

  // Aplikovanie médií
  if (shapeType === 'sphere' && mediaData[0]) {
    const item = mediaData[0];
    if(item.isVideo) {
      const v = document.createElement('video'); v.src = item.src; v.autoplay = true; v.loop = true; v.muted = true; v.play();
      mesh.material = new THREE.MeshBasicMaterial({map: new THREE.VideoTexture(v)});
    } else {
      new THREE.TextureLoader().load(item.src, t => mesh.material = new THREE.MeshBasicMaterial({map: t}));
    }
  } else {
    for(let key in mediaData) {
      const item = mediaData[key];
      if(item && item.src) {
        if(item.isVideo) {
          const v = document.createElement('video'); v.src = item.src; v.autoplay = true; v.loop = true; v.muted = true; v.play();
          mesh.material[key] = new THREE.MeshBasicMaterial({map: new THREE.VideoTexture(v)});
        } else {
          new THREE.TextureLoader().load(item.src, t => mesh.material[key] = new THREE.MeshBasicMaterial({map: t}));
        }
      }
    }
  }

  let clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    
    // Jemné pulzovanie 3D červeného svetla v synchronizácii s pozadím
    const elapsedTime = clock.getElapsedTime();
    pulseLight.intensity = 1.5 + Math.sin(elapsedTime * 1.5) * 1.2;

    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
<\/script>
</body>
</html>`;

    const blob = new Blob([htmlContent], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '3d_objekt_op_v5.html';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  window.onload = init3D;
</script>
</body>
</html>
