<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programy Menu | ErikAI OS</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #fafafa, #ececec);
      text-align: center;
      padding: 40px 20px;
      color: #222;
      margin: 0;
    }

    h1 {
      color: #d10000;
      font-size: 2.4em;
      margin-bottom: 20px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.15);
    }

    #cas {
      font-size: 18px;
      margin-bottom: 10px;
      color: #444;
      font-weight: 500;
    }

    #google_translate_element {
      margin-bottom: 25px;
    }

    .button-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 30px;
    }

    a {
      display: inline-block;
      background: linear-gradient(90deg, #d10000, #b00000);
      color: #fff;
      padding: 14px 30px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      width: 260px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      transition: all 0.25s ease;
    }

    a:hover {
      background: linear-gradient(90deg, #e60000, #c10000);
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.2);
    }

    footer {
      font-size: 13px;
      color: #666;
      margin-top: 40px;
      line-height: 1.6;
    }

    footer a {
      color: #d10000;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  
  <p id="cas"></p>

  <script>
    function aktualizujCas() {
      const teraz = new Date();
      const moznosti = {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      };
      document.getElementById('cas').innerText = 
        `🕓 Aktuálny čas: ${teraz.toLocaleDateString('sk-SK', moznosti)}`;
    }
    setInterval(aktualizujCas, 1000);
    aktualizujCas();
  </script>

  <div id="google_translate_element"></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'sk',
        includedLanguages: 'en,cs,fr,hu,de,pl,ro,ru,es,it,uk,sr,bn,ko,ja,zh-CN',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  
  <h1>📂 Programy Menu</h1>

  <div class="button-list">
    <a href="zoznam_straniek.html">🗂️ ErikAI OS Universe 1</a>
    <a href="erikaicorelang.html">🌐 ErikAI CoreLang 2 (špeciálny jazykový nástroj)</a>
    <a href="create_pwa.html">⚙️ ErikAI Create Easy PWA 3</a>
  </div>

  <footer>

      Creative Commons BY-NC-ND 4.0
    </a><br>

  </footer>

  <script>
    const povoleneRef = ["erikai-demoa1.github.io", "erikaios.online"];
    let pristupOk = povoleneRef.some(ref => document.referrer.includes(ref));
    if (!pristupOk) {
      alert("Prístup zakázaný: túto stránku nemožno otvoriť priamo.");
      window.location.href = "https://erikaios.online/";
    }
  </script>

</body>
</html>
