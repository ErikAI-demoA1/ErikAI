<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErikAI OS – Programy Menu</title>
  <style>
    /* 🌐 Moderný profesionálny štýl */
    body {
      font-family: "Poppins", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1a1a1a, #0d0d0d);
      color: #f2f2f2;
      text-align: center;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      padding: 25px 0 10px 0;
    }

    h1 {
      font-size: 2.5em;
      background: linear-gradient(90deg, #ff3333, #ff0000);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      margin: 0;
    }

    #cas {
      font-size: 17px;
      color: #ccc;
      margin-top: 8px;
      font-weight: 500;
    }

    #google_translate_element {
      margin: 20px 0;
      filter: drop-shadow(0 0 5px rgba(255, 0, 0, 0.4));
    }

    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .button-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 30px;
    }

    a {
      display: inline-block;
      width: 280px;
      background: linear-gradient(90deg, #d10000, #b00000);
      color: white;
      padding: 14px 30px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(255, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    a:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 6px 20px rgba(255, 0, 0, 0.45);
      background: linear-gradient(90deg, #ff0000, #c10000);
    }

    footer {
      font-size: 13px;
      color: #888;
      padding: 15px 0 25px 0;
      line-height: 1.5;
    }

    footer a {
      color: #ff4444;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* Jemný vstupný efekt */
    .fade-in {
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="fade-in">
  
  <header>
    <h1>📂 Programy Menu</h1>
    <p id="cas">🕓 Načítavam čas...</p>
  </header>

  <div id="google_translate_element"></div>

  <main>
    <div class="button-list">
      <a href="zoznam_straniek.html">🗂️ ErikAI OS Universe 1</a>
      <a href="erikaicorelang.html">🌐 ErikAI CoreLang 2 (jazykový nástroj)</a>
      <a href="create_pwa.html">⚙️ ErikAI Create Easy PWA 3</a>
      <a href="erikaiapkstudio.html">⚙️ ErikAI APK STUDIO 4</a>
    </div>
  </main>

  <footer>
    This work is licensed under the 
    <a href="http://creativecommons.org/licenses/by-nc-nd/4.0/" target="_blank">
      Creative Commons BY-NC-ND 4.0
    </a><br>
    © 2025 <strong>Erik Mohylák</strong> – All rights reserved.
  </footer>

  <script>
    // 🕒 Aktualizácia času
    function aktualizujCas() {
      const teraz = new Date();
      const moznosti = {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      };
      document.getElementById('cas').innerText = 
        `🕓 ${teraz.toLocaleDateString('sk-SK', moznosti)}`;
    }
    setInterval(aktualizujCas, 1000);
    aktualizujCas();

    // 🌍 Google Translate
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'sk',
        includedLanguages: 'en,cs,fr,hu,de,pl,ro,ru,es,it,uk,sr,bn,ko,ja,zh-CN',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <script>
    // 🔒 Ochrana pred priamym otvorením
    const povoleneRef = ["erikai-demoa1.github.io", "erikaios.online"];
    let pristupOk = povoleneRef.some(ref => document.referrer.includes(ref));
    if (!pristupOk) {
      alert("Prístup zakázaný: túto stránku nemožno otvoriť priamo.");
      window.location.href = "https://erikaios.online/";
    }
  </script>

</body>
</html>
