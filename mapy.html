<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>ErikAI — Moja poloha (Leaflet)</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-sA+e2qkGQ3Yk6l2n3gQw3YcFv2kE6X0C1b+q0m0g6wE=" crossorigin=""/>

<style>
html, body { height:100%; margin:0; font-family:Arial,Helvetica,sans-serif; }
#map { width:100%; height:100vh; display:block; touch-action: pan-x pan-y; }

#ui {
  position: fixed; left:10px; top:10px; z-index:1100;
  display:flex; flex-direction:column; gap:8px;
  pointer-events: auto;
}
.btn {
  background: rgba(0,0,0,0.6);
  color: #fff;
  border: none;
  padding: 8px 12px;
  border-radius: 8px;
  font-weight: 700;
  backdrop-filter: blur(4px);
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  cursor: pointer;
  pointer-events: auto;
}

#status {
  position: fixed; left:50%; transform:translateX(-50%); bottom:12px;
  background: rgba(255,255,255,0.9); color:#000; padding:6px 10px;
  border-radius:8px; font-weight:600; z-index:1100;
}
</style>
</head>
<body>

<div id="ui">
  <button id="centerBtn" class="btn">Zamerať na mňa</button>
  <button id="startBtn" class="btn">Spusti sledovanie</button>
  <button id="stopBtn" class="btn" disabled>Zastaviť sledovanie</button>
</div>

<div id="map"></div>
<div id="status">Stav: čakám na spustenie</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-o9N1j6k1XG4+6hU6a8f5kVf0bQmJ6D2Qv9v9z+7r4r8=" crossorigin=""></script>

<script>
// --- Inicializácia mapy ---
const map = L.map('map', { zoomControl: true }).setView([48.148598, 17.107748], 13);

// OpenStreetMap tiles
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// --- UI ---
const statusEl = document.getElementById('status');
const centerBtn = document.getElementById('centerBtn');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');

let watchId = null;
let positionMarker = null;
let accuracyCircle = null;

// --- Vytvorenie markeru ---
function createMarker(lat,lng){
  return L.circleMarker([lat,lng], {
    radius: 8,
    color: '#8B0000',
    fillColor: '#ff2d2d',
    fillOpacity: 1,
    weight: 2
  }).addTo(map);
}

// --- Aktualizácia markeru ---
function updatePosition(lat,lng,accuracy){
  if(!positionMarker){
    positionMarker = createMarker(lat,lng);
  } else {
    positionMarker.setLatLng([lat,lng]);
  }

  if(!accuracyCircle){
    accuracyCircle = L.circle([lat,lng], { radius: accuracy, color:'#ff6666', fillColor:'#ffcccc', fillOpacity:0.25 }).addTo(map);
  } else {
    accuracyCircle.setLatLng([lat,lng]);
    accuracyCircle.setRadius(accuracy);
  }
}

// --- Chyby geolokácie ---
function handleGeoError(err){
  console.warn('Geolocation error', err);
  if(err.code===1) statusEl.textContent='Stav: Prístup k polohe odmietnutý';
  else if(err.code===2) statusEl.textContent='Stav: Nenašlo sa poloha (chyba signálu)';
  else if(err.code===3) statusEl.textContent='Stav: Vypršal čas pri zisťovaní polohy';
  else statusEl.textContent='Stav: Neznáma chyba pri geolokácii';
}

// --- Sledovanie polohy ---
function startWatch(){
  if(!navigator.geolocation){
    statusEl.textContent='Stav: Geolokácia nie je podporovaná';
    return;
  }
  const options = { enableHighAccuracy:true, maximumAge:1000, timeout:10000 };
  watchId = navigator.geolocation.watchPosition(pos=>{
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;
    const acc = pos.coords.accuracy || 20;
    updatePosition(lat,lng,acc);
    statusEl.textContent=`Stav: Poloha ${lat.toFixed(5)}, ${lng.toFixed(5)} (presnosť ${Math.round(acc)} m)`;
  }, err => handleGeoError(err), options);

  startBtn.disabled=true;
  stopBtn.disabled=false;
  centerBtn.disabled=false;
}

// --- Zastavenie sledovania ---
function stopWatch(){
  if(watchId!==null){
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
    statusEl.textContent='Stav: Sledovanie zastavené';
  }
  startBtn.disabled=false;
  stopBtn.disabled=true;
}

// --- Zamerať mapu na marker ---
function centerOnMe(){
  if(!positionMarker){
    statusEl.textContent='Stav: Nie je dostupná žiadna poloha (spusti sledovanie)';
    return;
  }
  map.setView(positionMarker.getLatLng(), Math.max(map.getZoom(),15), { animate:true });
}

// --- Jednorázové zistenie polohy ---
function oneShotLocate(){
  if(!navigator.geolocation){
    statusEl.textContent='Stav: Geolokácia nie je podporovaná';
    return;
  }
  navigator.geolocation.getCurrentPosition(pos=>{
    updatePosition(pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy||20);
    map.setView([pos.coords.latitude,pos.coords.longitude],15);
    statusEl.textContent='Stav: Nájdená počiatočná poloha';
  }, err=>handleGeoError(err), { enableHighAccuracy:true, timeout:8000 });
}

// --- Tlačidlá ---
centerBtn.addEventListener('click', centerOnMe);
startBtn.addEventListener('click', startWatch);
stopBtn.addEventListener('click', stopWatch);

// --- Zoom ovládanie ---
L.control.zoom({ position:'topright' }).addTo(map);

// --- Inicializácia počiatočnej polohy ---
oneShotLocate();
</script>

</body>
</html>
