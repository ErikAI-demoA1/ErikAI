<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🌍 ErikAI Živá Poloha</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    text-align: center;
    background-color: #e6f0fa;
  }
  #map {
    width: 100%;
    height: 90vh;
  }
  #controls {
    padding: 10px;
  }
  button {
    padding: 8px 12px;
    font-size: 16px;
    margin: 5px;
    cursor: pointer;
  }
  body.dark-mode {
    background-color: #121212;
    color: white;
  }
</style>
</head>
<body>

<div id="controls">
  <button onclick="toggleTheme()">🌓 Zmeniť režim</button>
  <p id="status">Získavam polohu...</p>
</div>

<div id="map"></div>

<script>
let map, marker;

// Tmavý režim
function toggleTheme() {
  document.body.classList.toggle('dark-mode');
}

// Inicializácia mapy
function initMap() {
  map = new google.maps.Map(document.getElementById("map"), {
    zoom: 16,
    center: { lat: 0, lng: 0 },
    styles: [ // jemný tmavý štýl pre mapu
      { elementType: 'geometry', stylers: [{color: '#242f3e'}] },
      { elementType: 'labels.text.stroke', stylers: [{color: '#242f3e'}] },
      { elementType: 'labels.text.fill', stylers: [{color: '#746855'}] },
      { featureType: 'water', elementType: 'geometry', stylers: [{color: '#17263c'}] },
      { featureType: 'road', elementType: 'geometry', stylers: [{color: '#38414e'}] },
      { featureType: 'road', elementType: 'geometry.stroke', stylers: [{color: '#212a37'}] },
      { featureType: 'poi', elementType: 'geometry', stylers: [{color: '#263c3f'}] },
      { featureType: 'transit', elementType: 'geometry', stylers: [{color: '#2f3948'}] },
      { featureType: 'administrative', elementType: 'geometry', stylers: [{color: '#2f3948'}] }
    ]
  });

  // Skontrolujeme, či zariadenie podporuje geolokáciu
  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(
      (position) => {
        const pos = { lat: position.coords.latitude, lng: position.coords.longitude };
        document.getElementById('status').innerText = `🌐 Aktuálna poloha: ${pos.lat.toFixed(5)}, ${pos.lng.toFixed(5)}`;

        // Ak marker ešte neexistuje, vytvoríme ho
        if (!marker) {
          marker = new google.maps.Marker({
            position: pos,
            map: map,
            title: "Ty si tu!",
            icon: {
              path: google.maps.SymbolPath.CIRCLE,
              scale: 10,
              fillColor: "red",
              fillOpacity: 1,
              strokeWeight: 1,
              strokeColor: "white"
            }
          });
          map.setCenter(pos);
        } else {
          // Marker sa pohybuje podľa polohy
          marker.setPosition(pos);
          map.panTo(pos);
        }
      },
      () => {
        document.getElementById('status').innerText = "❌ Nepodarilo sa získať polohu.";
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
    );
  } else {
    document.getElementById('status').innerText = "❌ Geolokácia nie je podporovaná.";
  }
}
</script>

<script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap"></script>

</body>
</html>
