<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ErikAI — Turnajový generátor (Liga, Skupiny, Vyraďovačka)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#061426; --bg2:#0a1a36; --accent1:#06b6d4; --accent2:#8b5cf6;
    --card:#071228; --muted: #9fb2d1; --text:#e6eef8;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);color:var(--text)}
  .wrap{max-width:1280px;margin:10px auto;padding:12px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
  .logo{font-weight:800;font-size:18px;letter-spacing:1px;color:#fff}
  .sub{color:var(--muted);font-size:12px}
  .grid{display:flex;flex-direction:column;gap:14px}
  @media(min-width:900px){.grid{display:grid;grid-template-columns:340px 1fr}}

  .panel{background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.05);box-shadow:0 8px 20px rgba(0,0,0,0.4)}
  label{font-size:12px;color:var(--muted);display:block;margin-top:8px}
  input[type=text], select, textarea, input[type=number]{
    width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.2);color:var(--text);font-size:13px
  }
  textarea{min-height:70px;resize:vertical}
  button{background:linear-gradient(90deg,var(--accent2),var(--accent1));color:#041021;border:0;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px}
  button:hover{opacity:0.9}
  .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--muted);font-weight:600}
  .row{display:flex;gap:6px;margin-top:6px;align-items:center}
  .small{font-size:12px;color:var(--muted)}
  .teams-list{max-height:180px;overflow:auto;margin-top:6px;padding:6px;background:rgba(0,0,0,0.2);border-radius:8px}
  .team-item{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-radius:6px;margin-bottom:4px;background:rgba(255,255,255,0.02)}
  .controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

  .main-content{display:flex;flex-direction:column;gap:12px}
  .stage{min-height:380px;padding:12px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.05)}
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .tab{padding:7px 12px;border-radius:8px;cursor:pointer;background:rgba(255,255,255,0.03);font-weight:600;font-size:13px}
  .tab.active{background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#041021}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.05)}
  th{color:var(--accent1)}

  .match-card{background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.03)}
  .match-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .score-inputs{display:flex;align-items:center;gap:4px}
  .score-inputs input{width:45px;text-align:center;padding:4px;font-weight:bold}

  .bracket{display:flex;gap:16px;overflow-x:auto;padding:6px}
  .round{min-width:200px;display:flex;flex-direction:column;gap:10px}
  
  .export-panel{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

  /* TLAČOVÝ MÓD - PDF */
  #printReport { display: none; }
  @media print {
    body { background: #fff !important; color: #000 !important; }
    .wrap > header, .grid, .panel, script { display: none !important; }
    #printReport { display: block !important; padding: 20px; font-family: Arial, sans-serif; }
    #printReport h1 { font-size: 22px; color: #000; border-bottom: 2px solid #333; padding-bottom: 5px; }
    #printReport h2 { font-size: 16px; margin-top: 20px; color: #222; }
    #printReport table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    #printReport th, #printReport td { border: 1px solid #ccc; padding: 6px 8px; font-size: 12px; color: #000; text-align: left; }
    #printReport th { background: #eee !important; color: #000; }
    .print-match { border: 1px solid #ccc; padding: 6px 10px; margin-bottom: 4px; font-size: 12px; display: flex; justify-content: space-between; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="logo">ErikAI — Turnajový generátor</div>
      <div class="sub">Liga • Skupiny • Vyraďovačka (Auto-save & Export)</div>
    </div>
    <div class="export-panel">
      <button id="downloadImg" class="btn-ghost" style="font-size:12px;padding:6px 10px;">📷 Stiahnuť ako Obrázok</button>
      <button id="downloadPdf" class="btn-ghost" style="font-size:12px;padding:6px 10px;">📄 Tlačiť / PDF</button>
    </div>
  </header>

  <div class="grid">
    <!-- ĽAVÝ PANEL -->
    <div class="panel">
      <h3 style="margin:0 0 6px 0; font-size:15px">Nastavenia & Tímy</h3>
      
      <label>Formát súťaže</label>
      <select id="format">
        <option value="league">Liga (každý s každým)</option>
        <option value="groups">Skupinová fáza + Liga</option>
        <option value="knockout">Vyraďovačka (Pavúk)</option>
      </select>

      <label>Zoznam tímov (každý riadok = 1 tím)</label>
      <textarea id="teamInput" placeholder="Napr.:&#10;FC Erik&#10;Real Madrid&#10;Arsenal&#10;Barcelona"></textarea>
      
      <div class="row">
        <input id="teamName" type="text" placeholder="Pridať tím ručne...">
        <button id="addTeamBtn" style="flex:0 0 auto">Pridať</button>
      </div>
      
      <div class="teams-list" id="teamsList"></div>

      <div class="row" style="margin-top:10px">
        <div style="flex:1">
          <label>Počet skupín</label>
          <input id="groupCount" type="number" value="2" min="1" max="8">
        </div>
        <div style="flex:1">
          <label>Pavúk (slots)</label>
          <input id="knockSlots" type="number" value="8" min="2" max="32" step="2">
        </div>
      </div>

      <div class="controls">
        <button id="generateBtn" style="flex:1">🚀 Generovať rozpis</button>
        <button id="autoNames" class="btn-ghost">Demo 8 tímov</button>
        <button id="clearAll" class="btn-ghost" style="color:#f87171">Vymazať</button>
      </div>
      
      <div class="small" style="margin-top:10px;text-align:center;">💾 Zmeny sa ukladajú automaticky.</div>
    </div>

    <!-- PRAVÝ PANEL -->
    <div class="main-content">
      <div class="stage panel" id="captureArea">
        <div class="tabs">
          <div class="tab active" data-tab="matches">Zápasy & Skóre</div>
          <div class="tab" data-tab="table">Tabuľka / Poradie</div>
          <div class="tab" data-tab="bracket">Pavúk</div>
        </div>

        <!-- ZÁPASY -->
        <div id="viewMatches" class="view">
          <div id="matchesArea" style="max-height:480px; overflow-y:auto; padding-right:4px;"></div>
        </div>

        <!-- TABUĽKA -->
        <div id="viewTable" class="view" style="display:none">
          <div id="tableArea" style="max-height:480px; overflow-y:auto;"></div>
        </div>

        <!-- PAVÚK -->
        <div id="viewBracket" class="view" style="display:none">
          <div id="bracketArea" style="max-height:480px; overflow-x:auto;"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="printReport"></div>

<script>
let state = {
  teams: ['FC Erik', 'Real Madrid', 'Arsenal', 'Barcelona', 'Juventus', 'Bayern', 'PSG', 'Manchester City'],
  format: 'league',
  groups: [],
  matches: [],
  bracket: [],
  options: { groupCount: 2, knockSlots: 8 }
};

const lsKey = 'erikai_tournament_v3';

function saveState() {
  localStorage.setItem(lsKey, JSON.stringify(state));
}

function loadState() {
  const saved = localStorage.getItem(lsKey);
  if (saved) {
    try { state = JSON.parse(saved); } catch(e){}
  }
}

const teamInput = document.getElementById('teamInput');
const teamsList = document.getElementById('teamsList');
const formatSel = document.getElementById('format');
const groupCountInp = document.getElementById('groupCount');
const knockSlotsInp = document.getElementById('knockSlots');
const generateBtn = document.getElementById('generateBtn');
const matchesArea = document.getElementById('matchesArea');
const tableArea = document.getElementById('tableArea');
const bracketArea = document.getElementById('bracketArea');
const printReport = document.getElementById('printReport');

function initInputs() {
  formatSel.value = state.format;
  groupCountInp.value = state.options.groupCount;
  knockSlotsInp.value = state.options.knockSlots;
  teamInput.value = state.teams.join('\n');
}

function renderTeamsList() {
  teamsList.innerHTML = '';
  state.teams.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'team-item';
    div.innerHTML = `<span>${i+1}. ${t}</span> <button class="btn-ghost" style="padding:2px 6px;font-size:11px" onclick="removeTeam(${i})">✖</button>`;
    teamsList.appendChild(div);
  });
}

window.removeTeam = function(i) {
  state.teams.splice(i, 1);
  teamInput.value = state.teams.join('\n');
  renderTeamsList();
  saveState();
};

document.getElementById('addTeamBtn').onclick = () => {
  const val = document.getElementById('teamName').value.trim();
  if(!val) return;
  state.teams.push(val);
  document.getElementById('teamName').value = '';
  teamInput.value = state.teams.join('\n');
  renderTeamsList();
  saveState();
};

document.getElementById('autoNames').onclick = () => {
  state.teams = [];
  for(let i=1; i<=8; i++) state.teams.push('Tím ' + i);
  teamInput.value = state.teams.join('\n');
  renderTeamsList();
  saveState();
  generateTournament();
};

document.getElementById('clearAll').onclick = () => {
  if(!confirm('Naozaj vymazať všetko?')) return;
  state.teams = [];
  state.matches = [];
  state.groups = [];
  state.bracket = [];
  teamInput.value = '';
  renderTeamsList();
  rebuildUI();
  saveState();
};

function generateTournament() {
  const raw = teamInput.value.trim();
  if(raw) {
    state.teams = raw.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  }
  if(state.teams.length < 2) {
    alert('Zadaj aspoň 2 tímy!');
    return;
  }

  state.format = formatSel.value;
  state.options.groupCount = parseInt(groupCountInp.value) || 2;
  state.options.knockSlots = parseInt(knockSlotsInp.value) || 8;

  state.matches = [];
  state.groups = [];
  state.bracket = [];

  if(state.format === 'league') {
    state.matches = buildRoundRobin(state.teams);
  } else if(state.format === 'groups') {
    state.groups = buildGroups(state.teams, state.options.groupCount);
  } else if(state.format === 'knockout') {
    state.bracket = buildKnockout(state.teams, state.options.knockSlots);
  }

  saveState();
  rebuildUI();
}

function buildRoundRobin(teams) {
  const matches = [];
  for(let i=0; i<teams.length; i++) {
    for(let j=i+1; j<teams.length; j++) {
      matches.push({
        id: 'm_' + Math.random().toString(36).substr(2, 9),
        aName: teams[i],
        bName: teams[j],
        scoreA: null,
        scoreB: null
      });
    }
  }
  return matches;
}

function buildGroups(teams, count) {
  const groups = [];
  for(let i=0; i<count; i++) {
    groups.push({ name: String.fromCharCode(65+i), teams: [], matches: [] });
  }
  teams.forEach((t, idx) => {
    groups[idx % count].teams.push(t);
  });
  groups.forEach(g => {
    g.matches = buildRoundRobin(g.teams);
  });
  return groups;
}

function buildKnockout(teams, slots) {
  const seeded = teams.slice();
  while(seeded.length < slots) seeded.push('Voľný los');
  
  const round1 = [];
  for(let i=0; i<slots/2; i++) {
    round1.push({
      id: 'k_0_' + i,
      aName: seeded[i],
      bName: seeded[slots - 1 - i],
      scoreA: null,
      scoreB: null
    });
  }
  const bracket = [round1];
  let currentSlots = slots / 2;
  let rIdx = 1;
  while(currentSlots > 1) {
    currentSlots /= 2;
    const nextRound = [];
    for(let i=0; i<currentSlots; i++) {
      nextRound.push({
        id: `k_${rIdx}_${i}`,
        aName: 'TBD',
        bName: 'TBD',
        scoreA: null,
        scoreB: null
      });
    }
    bracket.push(nextRound);
    rIdx++;
  }
  return bracket;
}

generateBtn.onclick = generateTournament;

function rebuildUI() {
  renderMatchesView();
  renderTableView();
  renderBracketView();
  preparePrintReport();
}

function renderMatchesView() {
  matchesArea.innerHTML = '';
  
  if(state.format === 'league') {
    if(state.matches.length === 0) { matchesArea.innerHTML = '<div class="small">Zatiaľ nie sú vygenerované zápasy. Klikni na "Generovať rozpis".</div>'; return; }
    state.matches.forEach(m => matchesArea.appendChild(createMatchCard(m)));
  } else if(state.format === 'groups') {
    if(state.groups.length === 0) { matchesArea.innerHTML = '<div class="small">Žiadne skupiny.</div>'; return; }
    state.groups.forEach(g => {
      const h = document.createElement('h4'); h.style.margin = '8px 0 4px 0'; h.textContent = 'Skupina ' + g.name;
      matchesArea.appendChild(h);
      g.matches.forEach(m => matchesArea.appendChild(createMatchCard(m, g.name)));
    });
  } else if(state.format === 'knockout') {
    if(state.bracket.length === 0) { matchesArea.innerHTML = '<div class="small">Žiadny pavúk.</div>'; return; }
    // V móde vyraďovačky zobrazíme zápasy prvého kola na editáciu
    state.bracket[0].forEach(m => matchesArea.appendChild(createMatchCard(m)));
  }
}

function createMatchCard(m, groupName = null) {
  const div = document.createElement('div');
  div.className = 'match-card';
  div.innerHTML = `
    <div class="match-row">
      <div style="flex:1; font-weight:600; font-size:13px;">${m.aName}</div>
      <div class="score-inputs">
        <input type="number" min="0" value="${m.scoreA !== null ? m.scoreA : ''}" placeholder="-" onchange="updateScore('${m.id}', this.previousElementSibling.value ? this.previousElementSibling.value : 0, this.value, '${groupName || ''}')" oninput="updateScore('${m.id}', this.parentElement.children[0].value, this.parentElement.children[2].value, '${groupName || ''}')">
        <span>:</span>
        <input type="number" min="0" value="${m.scoreB !== null ? m.scoreB : ''}" placeholder="-" oninput="updateScore('${m.id}', this.parentElement.children[0].value, this.parentElement.children[2].value, '${groupName || ''}')">
      </div>
      <div style="flex:1; text-align:right; font-weight:600; font-size:13px;">${m.bName}</div>
    </div>
  `;
  return div;
}

window.updateScore = function(id, sA, sB, groupName) {
  const scoreA = (sA === '' || sA === null) ? null : parseInt(sA);
  const scoreB = (sB === '' || sB === null) ? null : parseInt(sB);

  if(groupName) {
    const g = state.groups.find(x => x.name === groupName);
    if(g) {
      const m = g.matches.find(x => x.id === id);
      if(m) { m.scoreA = scoreA; m.scoreB = scoreB; }
    }
  } else if(state.format === 'league') {
    const m = state.matches.find(x => x.id === id);
    if(m) { m.scoreA = scoreA; m.scoreB = scoreB; }
  } else if(state.format === 'knockout') {
    // Nájdi a aktualizuj v pavúku
    for(let r=0; r<state.bracket.length; r++) {
      const m = state.bracket[r].find(x => x.id === id);
      if(m) {
        m.scoreA = scoreA; m.scoreB = scoreB;
        // Ak sú obidva vstupy zadané, posuň víťaza do ďalšieho kola
        if(scoreA !== null && scoreB !== null && scoreA !== scoreB) {
          const winner = scoreA > scoreB ? m.aName : m.bName;
          propagateKnockoutWinner(r, id, winner);
        }
        break;
      }
    }
  }

  saveState();
  renderTableView();
  renderBracketView();
  preparePrintReport();
};

function propagateKnockoutWinner(roundIdx, matchId, winnerName) {
  const round = state.bracket[roundIdx];
  const matchIdx = round.findIndex(x => x.id === matchId);
  const nextRoundIdx = roundIdx + 1;
  if(state.bracket[nextRoundIdx]) {
    const nextMatchIdx = Math.floor(matchIdx / 2);
    const nextMatch = state.bracket[nextRoundIdx][nextMatchIdx];
    if(nextMatch) {
      if(matchIdx % 2 === 0) {
        nextMatch.aName = winnerName;
      } else {
        nextMatch.bName = winnerName;
      }
    }
  }
}

function renderTableView() {
  tableArea.innerHTML = '';
  if(state.format === 'groups') {
    state.groups.forEach(g => {
      const h = document.createElement('h4'); h.textContent = 'Tabuľka - Skupina ' + g.name;
      tableArea.appendChild(h);
      tableArea.appendChild(createTableElement(calculateStandings(g.teams, g.matches)));
    });
  } else if(state.format === 'league') {
    tableArea.appendChild(createTableElement(calculateStandings(state.teams, state.matches)));
  } else {
    tableArea.innerHTML = '<div class="small">Pre vyraďovačku sa tabuľka nevygeneruje, sleduj pavúka.</div>';
  }
}

function calculateStandings(teams, matches) {
  const stats = {};
  teams.forEach(t => {
    stats[t] = { name: t, P:0, W:0, D:0, L:0, GF:0, GA:0, GD:0, Pts:0 };
  });

  matches.forEach(m => {
    if(m.scoreA === null || m.scoreB === null) return;
    if(!stats[m.aName] || !stats[m.bName]) return;

    stats[m.aName].P++; stats[m.bName].P++;
    stats[m.aName].GF += m.scoreA; stats[m.aName].GA += m.scoreB;
    stats[m.bName].GF += m.scoreB; stats[m.bName].GA += m.scoreA;

    if(m.scoreA > m.scoreB) {
      stats[m.aName].W++; stats[m.aName].Pts += 3;
      stats[m.bName].L++;
    } else if(m.scoreA < m.scoreB) {
      stats[m.bName].W++; stats[m.bName].Pts += 3;
      stats[m.aName].L++;
    } else {
      stats[m.aName].D++; stats[m.aName].Pts += 1;
      stats[m.bName].D++; stats[m.bName].Pts += 1;
    }
  });

  Object.values(stats).forEach(s => s.GD = s.GF - s.GA);

  return Object.values(stats).sort((a,b) => b.Pts - a.Pts || b.GD - a.GD || b.GF - a.GF || a.name.localeCompare(b.name));
}

function createTableElement(standings) {
  const tbl = document.createElement('table');
  tbl.innerHTML = `
    <thead>
      <tr>
        <th>Por</th><th>Tím</th><th>Z</th><th>V</th><th>R</th><th>P</th><th>Skóre</th><th>Bardy</th>
      </tr>
    </thead>
    <tbody>
      ${standings.map((s, idx) => `
        <tr>
          <td>${idx+1}.</td>
          <td><strong>${s.name}</strong></td>
          <td>${s.P}</td><td>${s.W}</td><td>${s.D}</td><td>${s.L}</td>
          <td>${s.GF}:${s.GA}</td>
          <td><strong>${s.Pts}</strong></td>
        </tr>
      `).join('')}
    </tbody>
  `;
  return tbl;
}

function renderBracketView() {
  bracketArea.innerHTML = '';
  if(state.format !== 'knockout' || state.bracket.length === 0) {
    bracketArea.innerHTML = '<div class="small">Pavúk je dostupný iba pre formát Vyraďovačka.</div>';
    return;
  }

  const container = document.createElement('div');
  container.className = 'bracket';

  state.bracket.forEach((round, rIdx) => {
    const col = document.createElement('div');
    col.className = 'round';
    let roundName = `Kolo ${rIdx+1}`;
    if(rIdx === state.bracket.length - 1) roundName = 'Finále';
    else if(rIdx === state.bracket.length - 2) roundName = 'Semifinále';
    
    col.innerHTML = `<h4 style="margin:0 0 8px 0; font-size:13px; color:var(--accent1)">${roundName}</h4>`;
    
    round.forEach(m => {
      const card = document.createElement('div');
      card.className = 'match-card';
      card.innerHTML = `
        <div style="font-size:12px; margin-bottom:4px; display:flex; justify-content:space-between;">
          <span>${m.aName}</span> <strong>${m.scoreA !== null ? m.scoreA : '-'}</strong>
        </div>
        <div style="font-size:12px; display:flex; justify-content:space-between;">
          <span>${m.bName}</span> <strong>${m.scoreB !== null ? m.scoreB : '-'}</strong>
        </div>
      `;
      col.appendChild(card);
    });
    container.appendChild(col);
  });
  bracketArea.appendChild(container);
}

function preparePrintReport() {
  let formatName = 'Liga (každý s každým)';
  if(state.format === 'groups') formatName = 'Skupinová fáza + Liga';
  if(state.format === 'knockout') formatName = 'Vyraďovačka (Pavúk)';

  let html = `<h1>ErikAI — Report Turnaja</h1>`;
  html += `<p><strong>Formát:</strong> ${formatName}</p>`;
  
  html += `<h2>Zoznam tímov (${state.teams.length})</h2>`;
  html += `<ul>` + state.teams.map(t => `<li>${t}</li>`).join('') + `</ul>`;

  html += `<h2>Zápasy a Výsledky</h2>`;
  if(state.format === 'league') {
    state.matches.forEach(m => {
      html += `<div class="print-match"><span>${m.aName}</span> <strong>${m.scoreA !== null ? m.scoreA : '-'} : ${m.scoreB !== null ? m.scoreB : '-'}</strong> <span>${m.bName}</span></div>`;
    });
  } else if(state.format === 'groups') {
    state.groups.forEach(g => {
      html += `<h3>Skupina ${g.name}</h3>`;
      g.matches.forEach(m => {
        html += `<div class="print-match"><span>${m.aName}</span> <strong>${m.scoreA !== null ? m.scoreA : '-'} : ${m.scoreB !== null ? m.scoreB : '-'}</strong> <span>${m.bName}</span></div>`;
      });
    });
  } else if(state.format === 'knockout') {
    state.bracket.forEach((rnd, idx) => {
      html += `<h3>Kolo ${idx+1}</h3>`;
      rnd.forEach(m => {
        html += `<div class="print-match"><span>${m.aName}</span> <strong>${m.scoreA !== null ? m.scoreA : '-'} : ${m.scoreB !== null ? m.scoreB : '-'}</strong> <span>${m.bName}</span></div>`;
      });
    });
  }

  if(state.format === 'league') {
    html += `<h2>Tabuľka / Poradie</h2>`;
    const standings = calculateStandings(state.teams, state.matches);
    html += createPrintTableHTML(standings);
  } else if(state.format === 'groups') {
    html += `<h2>Tabuľky skupín</h2>`;
    state.groups.forEach(g => {
      html += `<h3>Skupina ${g.name}</h3>`;
      const standings = calculateStandings(g.teams, g.matches);
      html += createPrintTableHTML(standings);
    });
  }

  printReport.innerHTML = html;
}

function createPrintTableHTML(standings) {
  return `
    <table>
      <thead>
        <tr><th>Poradie</th><th>Tím</th><th>Z</th><th>V</th><th>R</th><th>P</th><th>Skóre</th><th>Body</th></tr>
      </thead>
      <tbody>
        ${standings.map((s, idx) => `
          <tr>
            <td>${idx+1}.</td>
            <td><strong>${s.name}</strong></td>
            <td>${s.P}</td><td>${s.W}</td><td>${s.D}</td><td>${s.L}</td>
            <td>${s.GF}:${s.GA}</td>
            <td><strong>${s.Pts}</strong></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    const target = t.dataset.tab;
    document.getElementById('viewMatches').style.display = target === 'matches' ? 'block' : 'none';
    document.getElementById('viewTable').style.display = target === 'table' ? 'block' : 'none';
    document.getElementById('viewBracket').style.display = target === 'bracket' ? 'block' : 'none';
  };
});

document.getElementById('downloadImg').onclick = () => {
  const area = document.getElementById('captureArea');
  html2canvas(area, { backgroundColor: '#071228' }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'erikai_turnaj.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
};

document.getElementById('downloadPdf').onclick = () => {
  window.print();
};

loadState();
initInputs();
renderTeamsList();
rebuildUI();
</script>
