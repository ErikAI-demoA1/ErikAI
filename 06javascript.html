<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6️⃣ JavaScript</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    h1 { color: #0077cc; }
    p { font-size: 16px; }
    button {
      padding: 10px 15px;
      font-size: 16px;
      background-color: #0077cc;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background-color: #005fa3; }
  </style>
</head>
<body>

  <h1>6️⃣ JavaScript</h1>
  <p id="text">Tento text zmení farbu, keď klikneš na tlačidlo.</p>
  <button onclick="zmenFarbu()">Zmeniť farbu</button>

  <script>
    function zmenFarbu() {
      const farby = ['#ff6347', '#0077cc', '#32cd32', '#ffa500', '#8a2be2'];
      const nahodnaFarba = farby[Math.floor(Math.random() * farby.length)];
      document.getElementById('text').style.color = nahodnaFarba;
    }
  </script>

  <p><a href="index.html">⬅️ Späť na menu</a></p>

</body>
</html>
