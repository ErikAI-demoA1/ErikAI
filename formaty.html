<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI Universal File Engine Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;850&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-deep: #030712;
        --bg-card: rgba(17, 24, 39, 0.8);
        --card-border: rgba(255, 255, 255, 0.08);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --neon-red: #ef4444;
        --neon-orange: #f97316;
        --accent-glow: rgba(239, 68, 68, 0.25);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: var(--bg-deep);
        background-image: 
            radial-gradient(circle at 10% 20%, rgba(239, 68, 68, 0.05) 0%, transparent 40%),
            radial-gradient(circle at 90% 80%, rgba(249, 115, 22, 0.04) 0%, transparent 40%),
            linear-gradient(135deg, var(--bg-deep) 0%, #0b0f19 100%);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px;
    }

    header {
        padding: 24px;
        background: var(--bg-card);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        backdrop-filter: blur(16px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        max-width: 1200px;
        margin: 0 auto 20px auto;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
    }

    header h1 {
        font-size: 1.6rem;
        font-weight: 950;
        background: linear-gradient(135deg, var(--text-main) 40%, var(--neon-red), var(--neon-orange));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    header p {
        margin-top: 5px;
        color: var(--text-muted);
        font-size: 0.9rem;
    }

    .os-badge {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: var(--neon-red);
        padding: 6px 14px;
        border-radius: 99px;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
        flex: 1;
    }

    .upload {
        border: 2px dashed rgba(239, 68, 68, 0.4);
        border-radius: 20px;
        padding: 40px;
        text-align: center;
        background: var(--bg-card);
        cursor: pointer;
        transition: all 0.25s ease;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    .upload:hover {
        border-color: var(--neon-red);
        background: rgba(17, 24, 39, 0.95);
        transform: translateY(-2px);
    }

    .upload input {
        display: none;
    }

    .upload-icon {
        font-size: 40px;
        margin-bottom: 10px;
    }

    .toolbar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 20px 0;
    }

    button,
    select,
    input[type="text"] {
        background: var(--bg-card);
        color: var(--text-main);
        border: 1px solid var(--card-border);
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 0.9rem;
        font-weight: 600;
        outline: none;
        backdrop-filter: blur(10px);
        transition: all 0.2s;
    }

    input[type="text"] {
        flex: 1;
        min-width: 220px;
    }

    input[type="text"]:focus, select:focus {
        border-color: var(--neon-red);
    }

    button {
        cursor: pointer;
        background: linear-gradient(135deg, var(--neon-red), var(--neon-orange));
        color: white;
        border: none;
        box-shadow: 0 4px 15px var(--accent-glow);
    }

    button:hover {
        transform: translateY(-2px);
        opacity: 0.95;
    }

    .btn-secondary {
        background: var(--bg-card) !important;
        border: 1px solid var(--card-border) !important;
        color: var(--text-main) !important;
        box-shadow: none !important;
    }

    .btn-secondary:hover {
        border-color: var(--neon-red) !important;
    }

    .files {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 15px;
    }

    .file-card {
        background: var(--bg-card);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 20px;
        backdrop-filter: blur(16px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .file-name {
        font-weight: 700;
        word-break: break-all;
        margin-bottom: 8px;
        font-size: 0.95rem;
    }

    .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 6px;
        background: rgba(56, 189, 248, 0.1);
        color: #38bdf8;
        font-size: 0.75rem;
        font-weight: 700;
        margin-bottom: 12px;
        width: fit-content;
    }

    .info {
        color: var(--text-muted);
        font-size: 0.85rem;
        line-height: 1.6;
        margin-bottom: 12px;
    }

    .status {
        margin-bottom: 15px;
        font-size: 0.82rem;
        font-weight: 600;
    }

    .preview {
        margin-top: 25px;
        padding: 25px;
        background: var(--bg-card);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        backdrop-filter: blur(16px);
        min-height: 180px;
    }

    .preview h2 {
        font-size: 1.2rem;
        margin-bottom: 15px;
        color: var(--neon-orange);
    }

    .preview img,
    .preview video {
        max-width: 100%;
        max-height: 450px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .preview pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: var(--bg-deep);
        padding: 16px;
        border-radius: 12px;
        border: 1px solid var(--card-border);
        max-height: 450px;
        overflow: auto;
        font-family: monospace;
        font-size: 0.88rem;
    }

    .empty {
        text-align: center;
        color: var(--text-muted);
        padding: 50px;
        grid-column: 1 / -1;
        font-size: 0.95rem;
    }

    footer {
        max-width: 1200px;
        margin: 30px auto 0 auto;
        color: var(--text-muted);
        font-size: 0.85rem;
        text-align: center;
        border-top: 1px solid var(--card-border);
        padding-top: 20px;
        width: 100%;
        line-height: 1.6;
    }
</style>
</head>

<body>

<header>
    <div>
        <h1>ErikAI Universal File Engine</h1>
        <p>Univerzálna detekcia, náhľad a správa projektových súborov</p>
    </div>
    <div class="os-badge">ErikAI OS 2026 Core</div>
</header>

<div class="container">

    <label class="upload">
        <input id="fileInput" type="file" multiple>
        <div class="upload-icon">📁</div>
        <h2>Vyber súbory alebo ich presuň sem</h2>
        <p>ErikAI automaticky rozpozná formát, príponu a schopnosti súboru.</p>
    </label>

    <div class="toolbar">
        <input
            id="search"
            type="text"
            placeholder="Hľadať súbor..."
        >

        <select id="category">
            <option value="all">Všetky kategórie</option>
            <option value="CAD">CAD / 3D</option>
            <option value="DATA">Dáta</option>
            <option value="IMAGE">Obrázky</option>
            <option value="VIDEO">Video</option>
            <option value="AUDIO">Audio</option>
            <option value="DOCUMENT">Dokumenty</option>
            <option value="CODE">Kód</option>
            <option value="ARCHIVE">Archívy</option>
            <option value="OTHER">Ostatné</option>
        </select>

        <button onclick="exportProject()">
            💾 Export ErikAI JSON
        </button>

        <button class="btn-secondary" onclick="clearFiles()">
            🗑️ Vymazať zoznam
        </button>
    </div>

    <div id="files" class="files">
        <div class="empty">
            Zatiaľ nebol pridaný žiadny súbor.
        </div>
    </div>

    <div class="preview">
        <h2>👁️ Náhľad súboru (Preview)</h2>
        <div id="previewContent" style="color: var(--text-muted);">
            Vyber súbor zo zoznamu pre zobrazenie náhľadu.
        </div>
    </div>

</div>

<footer>
    © 2025–2026 <strong>Erik Mohylák</strong> – ErikAI OS Ecosystem • Všetky práva vyhradené
</footer>

<script>

/* =========================================================
   ERIKAI UNIVERSAL FILE FORMAT REGISTRY (PRO VERSION)
   ========================================================= */

const FORMAT_REGISTRY = {
    // CAD / 3D
    "step":  { category: "CAD", name: "STEP 3D", preview: false },
    "stp":   { category: "CAD", name: "STEP 3D", preview: false },
    "iges":  { category: "CAD", name: "IGES 3D", preview: false },
    "igs":   { category: "CAD", name: "IGES 3D", preview: false },
    "stl":   { category: "CAD", name: "STL Model", preview: true },
    "obj":   { category: "CAD", name: "OBJ 3D", preview: true },
    "ply":   { category: "CAD", name: "PLY Mesh", preview: true },
    "gltf":  { category: "CAD", name: "glTF 3D", preview: true },
    "glb":   { category: "CAD", name: "GLB Binary 3D", preview: true },
    "dxf":   { category: "CAD", name: "AutoCAD DXF", preview: false },
    "catpart": { category: "CAD", name: "CATIA Part", preview: false },
    "catproduct": { category: "CAD", name: "CATIA Product", preview: false },

    // DATA
    "json": { category: "DATA", name: "JSON Data", preview: true },
    "xml":  { category: "DATA", name: "XML Dokument", preview: true },
    "csv":  { category: "DATA", name: "CSV Tabuľka", preview: true },
    "yaml": { category: "DATA", name: "YAML Config", preview: true },
    "yml":  { category: "DATA", name: "YAML Config", preview: true },

    // IMAGES
    "png":  { category: "IMAGE", name: "PNG Obrázok", preview: true },
    "jpg":  { category: "IMAGE", name: "JPEG Obrázok", preview: true },
    "jpeg": { category: "IMAGE", name: "JPEG Obrázok", preview: true },
    "gif":  { category: "IMAGE", name: "GIF Animácia", preview: true },
    "webp": { category: "IMAGE", name: "WebP Obrázok", preview: true },
    "avif": { category: "IMAGE", name: "AVIF Obrázok", preview: true },
    "svg":  { category: "IMAGE", name: "SVG Vektor", preview: true },
    "bmp":  { category: "IMAGE", name: "BMP Bitmap", preview: true },

    // VIDEO
    "mp4":  { category: "VIDEO", name: "MP4 Video", preview: true },
    "webm": { category: "VIDEO", name: "WebM Video", preview: true },
    "mov":  { category: "VIDEO", name: "MOV Video", preview: true },
    "m4v":  { category: "VIDEO", name: "M4V Video", preview: true },

    // AUDIO
    "mp3":  { category: "AUDIO", name: "MP3 Zvuk", preview: true },
    "wav":  { category: "AUDIO", name: "WAV Zvuk", preview: true },
    "ogg":  { category: "AUDIO", name: "OGG Audio", preview: true },
    "flac": { category: "AUDIO", name: "FLAC Lossless", preview: true },
    "m4a":  { category: "AUDIO", name: "M4A Audio", preview: true },

    // DOCUMENTS
    "pdf":  { category: "DOCUMENT", name: "PDF Dokument", preview: true },
    "txt":  { category: "DOCUMENT", name: "Textový súbor", preview: true },
    "rtf":  { category: "DOCUMENT", name: "RTF Dokument", preview: false },
    "doc":  { category: "DOCUMENT", name: "Word Dokument", preview: false },
    "docx": { category: "DOCUMENT", name: "Word Dokument", preview: false },
    "xls":  { category: "DOCUMENT", name: "Excel Tabuľka", preview: false },
    "xlsx": { category: "DOCUMENT", name: "Excel Tabuľka", preview: false },
    "ppt":  { category: "DOCUMENT", name: "PowerPoint", preview: false },
    "pptx": { category: "DOCUMENT", name: "PowerPoint", preview: false },

    // CODE
    "html": { category: "CODE", name: "HTML Kód", preview: true },
    "htm":  { category: "CODE", name: "HTML Kód", preview: true },
    "css":  { category: "CODE", name: "CSS Štýly", preview: true },
    "js":   { category: "CODE", name: "JavaScript", preview: true },
    "ts":   { category: "CODE", name: "TypeScript", preview: true },
    "py":   { category: "CODE", name: "Python Skript", preview: true },
    "cpp":  { category: "CODE", name: "C++ Kód", preview: true },
    "c":    { category: "CODE", name: "C Kód", preview: true },
    "java": { category: "CODE", name: "Java Kód", preview: true },
    "md":   { category: "CODE", name: "Markdown", preview: true },

    // ARCHIVES
    "zip": { category: "ARCHIVE", name: "ZIP Archív", preview: false },
    "rar": { category: "ARCHIVE", name: "RAR Archív", preview: false },
    "7z":  { category: "ARCHIVE", name: "7z Archív", preview: false },
    "tar": { category: "ARCHIVE", name: "TAR Archív", preview: false },

    // ERIKAI
    "erikai": { category: "ERIKAI", name: "ErikAI Projekt", preview: true }
};


/* =========================================================
   PROJECT DATA STATE
   ========================================================= */

let files = [];


/* =========================================================
   FILE INPUT HANDLER
   ========================================================= */

document.getElementById("fileInput")
    .addEventListener("change", function(event) {
        for (const file of event.target.files) {
            const extension = file.name.split(".").pop().toLowerCase();
            const format = FORMAT_REGISTRY[extension] || {
                category: "OTHER",
                name: extension.toUpperCase(),
                preview: false
            };

            files.push({
                id: crypto.randomUUID(),
                name: file.name,
                extension,
                size: file.size,
                type: file.type || "application/octet-stream",
                category: format.category,
                format: format.name,
                preview: format.preview,
                file
            });
        }
        renderFiles();
        // Clear input value so same file can be uploaded again if needed
        event.target.value = "";
    });


/* =========================================================
   RENDER FILES UI
   ========================================================= */

function renderFiles() {
    const container = document.getElementById("files");
    const search = document.getElementById("search").value.toLowerCase();
    const category = document.getElementById("category").value;

    const filtered = files.filter(file => {
        const matchesSearch = file.name.toLowerCase().includes(search);
        const matchesCategory = category === "all" || file.category === category;
        return matchesSearch && matchesCategory;
    });

    if (filtered.length === 0) {
        container.innerHTML = `<div class="empty">Žiadne vyhovujúce súbory v zozname.</div>`;
        return;
    }

    container.innerHTML = "";

    filtered.forEach(file => {
        const card = document.createElement("div");
        card.className = "file-card";

        card.innerHTML = `
            <div>
                <div class="file-name">${escapeHTML(file.name)}</div>
                <div class="badge">${file.format}</div>
                <div class="info">
                    Kategória: ${file.category}<br>
                    Veľkosť: ${formatBytes(file.size)}<br>
                    Prípona: .${file.extension}
                </div>
                <div class="status" style="color: ${file.preview ? '#10b981' : '#f59e0b'};">
                    ${file.preview ? "🟢 Náhľad dostupný" : "🟡 Vyžaduje špecializovaný parser"}
                </div>
            </div>
            <button onclick="previewFile('${file.id}')">
                👁️ Zobraziť náhľad
            </button>
        `;

        container.appendChild(card);
    });
}


/* =========================================================
   PREVIEW LOGIC
   ========================================================= */

async function previewFile(id) {
    const fileData = files.find(f => f.id === id);
    if (!fileData) return;

    const file = fileData.file;
    const preview = document.getElementById("previewContent");
    preview.innerHTML = "";

    // IMAGE
    if (fileData.category === "IMAGE") {
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        preview.appendChild(img);
        return;
    }

    // VIDEO
    if (fileData.category === "VIDEO") {
        const video = document.createElement("video");
        video.controls = true;
        video.src = URL.createObjectURL(file);
        preview.appendChild(video);
        return;
    }

    // AUDIO
    if (fileData.category === "AUDIO") {
        const audio = document.createElement("audio");
        audio.controls = true;
        audio.src = URL.createObjectURL(file);
        preview.appendChild(audio);
        return;
    }

    // TEXT / JSON / CODE / DATA
    if (
        fileData.category === "DATA" ||
        fileData.category === "CODE" ||
        fileData.extension === "txt" ||
        fileData.extension === "md"
    ) {
        try {
            const text = await file.text();
            const pre = document.createElement("pre");
            pre.textContent = text;
            preview.appendChild(pre);
        } catch (e) {
            preview.innerHTML = `<p style="color: var(--neon-red);">Chyba pri čítaní textového súboru.</p>`;
        }
        return;
    }

    // PDF
    if (fileData.extension === "pdf") {
        const iframe = document.createElement("iframe");
        iframe.src = URL.createObjectURL(file);
        iframe.width = "100%";
        iframe.height = "500px";
        iframe.style.border = "none";
        iframe.style.borderRadius = "12px";
        preview.appendChild(iframe);
        return;
    }

    // OTHER
    preview.innerHTML = `
        <p style="margin-bottom: 8px;">Formát rozpoznaný ako: <strong>${fileData.format}</strong></p>
        <p style="color: var(--text-muted);">ErikAI OS momentálne uchováva tento súbor v surovom RAW režime. Pre plnú hĺbkovú analýzu alebo renderovanie je pripravený ErikAI Project Export.</p>
    `;
}


/* =========================================================
   EXPORT ERIKAI PROJECT JSON
   ========================================================= */

function exportProject() {
    const project = {
        erikai_os: {
            engine: "ErikAI Universal File Engine",
            formatVersion: "2.0",
            author: "Erik Mohylák"
        },
        project: {
            id: crypto.randomUUID(),
            name: "ErikAI Universal Project Workspace",
            created: new Date().toISOString()
        },
        files: files.map(file => ({
            id: file.id,
            name: file.name,
            extension: file.extension,
            format: file.format,
            category: file.category,
            mimeType: file.type,
            size: file.size,
            capabilities: {
                preview: file.preview,
                import: true,
                edit: false,
                export: true
            }
        }))
    };

    const json = JSON.stringify(project, null, 4);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "ErikAI_Project_Export.json";
    a.click();
    URL.revokeObjectURL(url);
}


/* =========================================================
   UTILITIES & EVENT LISTENERS
   ========================================================= */

function formatBytes(bytes) {
    if (bytes === 0) return "0 B";
    const units = ["B", "KB", "MB", "GB"];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return (bytes / Math.pow(1024, i)).toFixed(2) + " " + units[i];
}

function escapeHTML(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function clearFiles() {
    if (files.length > 0 && !confirm("Naozaj chceš vymazať všetky nahrané súbory?")) return;
    files = [];
    renderFiles();
    document.getElementById("previewContent").innerHTML = "Vyber súbor zo zoznamu pre zobrazenie náhľadu.";
}

document.getElementById("search").addEventListener("input", renderFiles);
document.getElementById("category").addEventListener("change", renderFiles);

</script>
<script>
  // ==========================================
  // ERIKAI OS — UNIVERZÁLNY BEZPEČNOSTNÝ STRÁŽCA
  // ==========================================
  const povolenyHostitel = "erikai-demoa1.github.io";
  
  // Overenie, či prebehol proces v session pamäti alebo či prichádza zo správnej domény
  const jeOvereny = sessionStorage.getItem('erikai_auth_token') === 'VERIFIED_OK';
  let pristupOk = jeOvereny || document.referrer.includes(povolenyHostitel);

  // Ak sa niekto pokúsi otvoriť podstránku napriamo (na čierno)
  if (!pristupOk && window.location.hostname !== "127.0.0.1" && window.location.hostname !== "localhost") {
    
    // Vtipné upozornenie
    alert("🚨 Haha, chcel si sa sem dostať zadarmo bez overenia?! Tak takto teda nie! Šup-šup naspäť na začiatok, pekne od 1. kroku sa prihlásiť! 🏃‍♂️💨");
    
    // Presmerovanie na hlavnú vstupnú bránu ErikAI OS
    window.location.href = "https://erikai-demoa1.github.io/ErikAI/";
  }
</script>

</body>
</html>
