<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>ErikAI Voxel Craft 3D v2.3 - Seamless World & Better Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
:root {
  --bg: #0b0d13;
  --panel: rgba(18, 22, 32, 0.9);
  --accent: #10b981;
  --accent-blue: #3b82f6;
  --accent-red: #ef4444;
  --accent-amber: #f59e0b;
  --text: #ffffff;
}
* { box-sizing: border-box; user-select: none; touch-action: none; }
body, html {
  margin: 0; padding: 0; width: 100%; height: 100%;
  overflow: hidden; background: var(--bg); font-family: 'Segoe UI', sans-serif;
}

#hud {
  position: absolute; top: 12px; left: 12px;
  background: var(--panel); border: 1px solid #2e364f;
  padding: 12px 16px; border-radius: 10px; color: var(--text);
  font-size: 0.82rem; width: 330px; max-width: 90vw; z-index: 10;
  backdrop-filter: blur(8px); box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
#hud h3 { margin: 0 0 6px 0; color: var(--accent); font-size: 0.95rem; }
.stat-row { display: flex; justify-content: space-between; margin-bottom: 3px; }
.stat-val { font-weight: bold; color: var(--accent-blue); }
.coord-val { font-weight: bold; color: var(--accent-amber); font-family: monospace; }
.ram-ultra { font-weight: bold; color: #ec4899; }

#deathScreen {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(239, 68, 68, 0.88); display: none;
  flex-direction: column; justify-content: center; align-items: center;
  z-index: 100; color: white; text-align: center; padding: 20px;
  backdrop-filter: blur(5px);
}
#deathScreen h1 { font-size: 2.5rem; margin: 0 0 10px 0; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
#deathScreen p { font-size: 1.1rem; margin-bottom: 20px; }
#deathScreen button {
  padding: 12px 24px; background: white; color: #ef4444; border: none;
  border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

/* UI PRVKY: JOYSTICK A SKOK */
#joystickZone {
  position: absolute; bottom: 30px; left: 30px;
  width: 110px; height: 110px; background: rgba(255, 255, 255, 0.12);
  border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
  z-index: 20; touch-action: none; backdrop-filter: blur(4px);
}
#joystickKnob {
  position: absolute; top: 35px; left: 35px;
  width: 40px; height: 40px; background: var(--accent-blue);
  border-radius: 50%; box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
  pointer-events: none;
}
#jumpBtn {
  position: absolute; bottom: 40px; right: 35px;
  width: 70px; height: 70px; background: var(--accent);
  border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 50%;
  color: white; font-weight: bold; font-size: 1.1rem; display: flex;
  align-items: center; justify-content: center; z-index: 20;
  box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); cursor: pointer;
}
#jumpBtn:active { transform: scale(0.92); background: #059669; }

button.action-btn {
  padding: 8px 12px; background: var(--accent-red); color: white;
  border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
  pointer-events: auto; margin-top: 8px; width: 100%; font-size: 0.8rem;
}
</style>
</head>
<body>

<div id="hud">
  <h3>⚡ ErikAI Voxel Engine v2.3 (Seamless)</h3>
  <div class="stat-row"><span>Súradnice [X, Y, Z-Výška]:</span> <span id="coordVal" class="coord-val">0, 0, 0</span></div>
  <div class="stat-row"><span>Aktívne bloky v RAM:</span> <span id="ramCount" class="stat-val">0</span></div>
  <div class="stat-row"><span>Odhad spotreby RAM:</span> <span id="estRam" class="ram-ultra">~1.2 GB</span></div>
  <div class="stat-row"><span>Uložené bloky:</span> <span id="totalBlocks" class="stat-val">0</span></div>
  <div class="stat-row"><span>Veľkosť dát na disku:</span> <span id="storageSize" class="stat-val">0 B</span></div>
  <div class="stat-row"><span>Seed sveta:</span> <span id="seedVal" class="stat-val">0</span></div>
  <div class="stat-row"><span>FPS:</span> <span id="fpsVal" class="stat-val">60</span></div>
  <button class="action-btn" onclick="resetWorld()">🎲 Vymazať & Nový Svet</button>
</div>

<div id="deathScreen">
  <h1>💀 ZOMREL SI!</h1>
  <p>Prepadol si sa pod svet.</p>
  <button onclick="respawnPlayer()">🔄 Oživiť na svete</button>
</div>

<!-- OVLÁDACIE PRVKY -->
<div id="joystickZone"><div id="joystickKnob"></div></div>
<div id="jumpBtn">🦘 JUMP</div>

<script>
THREE.Object3D.DefaultUp.set(0, 0, 1);

const SimplexNoise = function(seed) {
  let s = seed || Math.random();
  const p = new Uint8Array(256);
  for (let i=0; i<256; i++) {
    s = (s * 9301 + 49297) % 233280;
    p[i] = Math.floor((s / 233280) * 256);
  }
  const perm = new Uint8Array(512);
  for (let i=0; i<512; i++) perm[i] = p[i & 255];
  return {
    noise2D: function(xin, yin) {
      let n0, n1, n2;
      let s = (xin+yin)*0.5*(Math.sqrt(3.0)-1.0);
      let i = Math.floor(xin+s), j = Math.floor(yin+s);
      let t = (i+j)*(3.0-Math.sqrt(3.0))/6.0;
      let x0 = xin-(i-t), y0 = yin-(j-t);
      let i1 = x0 > y0 ? 1 : 0, j1 = x0 > y0 ? 0 : 1;
      let x1 = x0 - i1 + (3.0-Math.sqrt(3.0))/6.0, y1 = y0 - j1 + (3.0-Math.sqrt(3.0))/6.0;
      let x2 = x0 - 1.0 + 2.0*(3.0-Math.sqrt(3.0))/6.0, y2 = y0 - 1.0 + 2.0*(3.0-Math.sqrt(3.0))/6.0;
      let ii = i & 255, jj = j & 255;
      let t0 = 0.5 - x0*x0-y0*y0; if(t0>0) n0 = Math.pow(t0, 4) * (perm[ii+perm[jj]]%2 === 0 ? 1 : -1); else n0 = 0.0;
      let t1 = 0.5 - x1*x1-y1*y1; if(t1>0) n1 = Math.pow(t1, 4) * (perm[ii+i1+perm[jj+j1]]%2 === 0 ? 1 : -1); else n1 = 0.0;
      let t2 = 0.5 - x2*x2-y2*y2; if(t2>0) n2 = Math.pow(t2, 4) * (perm[ii+1+perm[jj+1]]%2 === 0 ? 1 : -1); else n2 = 0.0;
      return 70.0 * (n0 + n1 + n2);
    }
  };
};

let currentSeed = Math.floor(Math.random() * 899999 + 100000);
let noise = SimplexNoise(currentSeed);

let scene, camera, renderer, player;
let activeBlocks = new Map();
let savedWorldData = {};
let RENDER_DISTANCE = 26; 
let isDead = false;

const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const materials = {
  grass: new THREE.MeshStandardMaterial({ color: 0x388e3c, roughness: 0.8 }),
  dirt: new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.9 }),
  stone: new THREE.MeshStandardMaterial({ color: 0x616161, roughness: 0.7 }),
  sand: new THREE.MeshStandardMaterial({ color: 0xfbc02d, roughness: 0.9 }),
  snow: new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.5 }),
  wood: new THREE.MeshStandardMaterial({ color: 0x4e342e, roughness: 0.8 }),
  leaves: new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.6 }),
  bedrock: new THREE.MeshStandardMaterial({ color: 0x212121, roughness: 0.9 })
};

let playerPos = { x: 0, y: 0, z: 10 };
let playerVelocityZ = 0;
let isGrounded = false;
let playerAngle = 0, cameraPitch = 0.45;

let joystickMove = { x: 0, y: 0 };
let keyboardKeys = { forward: false, backward: false, left: false, right: false };

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x7ec8e3);
  scene.fog = new THREE.FogExp2(0x7ec8e3, 0.015);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
  dirLight.position.set(100, 80, 150);
  scene.add(dirLight);

  createPlayerModel();
  loadWorldFromStorage();

  playerPos.x = 0;
  playerPos.y = 0;
  playerPos.z = getTerrainHeight(0,0) + 2;
  playerVelocityZ = 0;

  updateChunks();

  setupJoystick();
  setupJumpBtn();
  setupTouchLook();
  setupKeyboardControls();

  window.addEventListener('resize', onWindowResize);
  document.getElementById('seedVal').textContent = currentSeed;

  animate();
}

// KRAJŠIA DETAILNEJŠIA POSTAVIČKA
function createPlayerModel() {
  player = new THREE.Group();

  const matBody = new THREE.MeshStandardMaterial({ color: 0x1e88e5, roughness: 0.6 }); // Modré tričko
  const matPants = new THREE.MeshStandardMaterial({ color: 0x1565c0, roughness: 0.7 }); // Nohavice
  const matSkin = new THREE.MeshStandardMaterial({ color: 0xffcc80, roughness: 0.8 });  // Koža / tvár
  const matHair = new THREE.MeshStandardMaterial({ color: 0x4e342e, roughness: 0.9 });  // Vlasy

  // Trup
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 0.7), matBody);
  torso.position.z = 0.6;
  player.add(torso);

  // Hlava
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), matSkin);
  head.position.z = 1.15;
  player.add(head);

  // Vlasy
  const hair = new THREE.Mesh(new THREE.BoxGeometry(0.47, 0.47, 0.2), matHair);
  hair.position.set(0, -0.02, 1.35);
  player.add(hair);

  // Pravá noha
  const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.5), matPants);
  rightLeg.position.set(0.12, 0, 0.15);
  player.add(rightLeg);

  // Ľavá noha
  const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.5), matPants);
  leftLeg.position.set(-0.12, 0, 0.15);
  player.add(leftLeg);

  scene.add(player);
}

// PLYNULEJŠÍ A ZJEDNOTENÝ ŠUM TERÉNU (BEZ OSTRÝCH HRÁDZÍ)
function getTerrainHeight(x, y) {
  // Plynulý prechod pomocou radiálneho tlmenia stredu, aby bol štart vždy stabilný a bez dier
  let distFromCenter = Math.sqrt(x * x + y * y);
  let baseNoise = noise.noise2D(x * 0.02, y * 0.02) * 6 + noise.noise2D(x * 0.06, y * 0.06) * 2;
  
  // V strede (okolo 0,0) jemne vyhladíme terén do roviny, ale plynulo bez štvorcových okrajov
  if (distFromCenter < 10) {
    let factor = distFromCenter / 10;
    baseNoise = baseNoise * factor + 3 * (1 - factor);
  }
  
  return Math.floor(baseNoise) + 2;
}

function getBiomeMaterial(x, y, z, maxZ) {
  const temperature = noise.noise2D(x * 0.01 + 50, y * 0.01 + 50);
  if (z <= -16) return materials.bedrock;
  if (z > 10) return materials.snow;
  if (temperature < -0.3) return z === maxZ ? materials.snow : materials.stone;
  if (temperature > 0.45) return materials.sand;
  if (z === maxZ) return materials.grass;
  if (z > maxZ - 3) return materials.dirt;
  return materials.stone;
}

function isTreePosition(x, y) {
  // Žiadne stromy v tesnej blízkosti spawnu
  if (Math.abs(x) <= 4 && Math.abs(y) <= 4) return false;
  
  const z = getTerrainHeight(x, y);
  const temp = noise.noise2D(x * 0.01 + 50, y * 0.01 + 50);
  if (z <= 10 && temp >= -0.3 && temp <= 0.45) {
    return noise.noise2D(x * 0.35, y * 0.35) > 0.8;
  }
  return false;
}

function updateChunks() {
  const pX = Math.floor(playerPos.x);
  const pY = Math.floor(playerPos.y);
  let neededKeys = new Set();
  let addedCount = 0;

  for (let x = pX - RENDER_DISTANCE; x <= pX + RENDER_DISTANCE; x++) {
    for (let y = pY - RENDER_DISTANCE; y <= pY + RENDER_DISTANCE; y++) {
      const dist = Math.sqrt((x - pX)**2 + (y - pY)**2);
      if (dist > RENDER_DISTANCE) continue;

      const maxZ = getTerrainHeight(x, y);
      const minZ = Math.max(-16, maxZ - 6);

      for (let z = maxZ; z >= minZ; z--) {
        const key = `${x},${y},${z}`;
        neededKeys.add(key);

        if (!activeBlocks.has(key)) {
          const mat = getBiomeMaterial(x, y, z, maxZ);
          const mesh = new THREE.Mesh(boxGeo, mat);
          mesh.position.set(x, y, z);
          scene.add(mesh);
          activeBlocks.set(key, mesh);

          if (!savedWorldData[key]) {
            savedWorldData[key] = 1;
            addedCount++;
          }
        }
      }

      if (isTreePosition(x, y)) {
        const trunkH = 3;
        for (let tz = 1; tz <= trunkH; tz++) {
          const treeKey = `${x},${y},${maxZ + tz}`;
          neededKeys.add(treeKey);
          if (!activeBlocks.has(treeKey)) {
            const mesh = new THREE.Mesh(boxGeo, materials.wood);
            mesh.position.set(x, y, maxZ + tz);
            scene.add(mesh);
            activeBlocks.set(treeKey, mesh);
          }
        }
        for (let lx = -1; lx <= 1; lx++) {
          for (let ly = -1; ly <= 1; ly++) {
            for (let lz = trunkH + 1; lz <= trunkH + 2; lz++) {
              const leafKey = `${x+lx},${y+ly},${maxZ+lz}`;
              neededKeys.add(leafKey);
              if (!activeBlocks.has(leafKey)) {
                const mesh = new THREE.Mesh(boxGeo, materials.leaves);
                mesh.position.set(x+lx, y+ly, maxZ+lz);
                scene.add(mesh);
                activeBlocks.set(leafKey, mesh);
              }
            }
          }
        }
      }
    }
  }

  for (let [key, mesh] of activeBlocks.entries()) {
    if (!neededKeys.has(key)) {
      scene.remove(mesh);
      mesh.geometry.dispose();
      activeBlocks.delete(key);
    }
  }

  if (addedCount > 0) saveWorldToStorage();
  updateHUDStats();
}

function formatBytes(bytes) {
  if (bytes === 0) return '0 B';
  const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

function updateHUDStats() {
  const activeCount = activeBlocks.size;
  document.getElementById('ramCount').textContent = activeCount;
  
  const estRamMB = Math.round(300 + (activeCount * 0.075));
  document.getElementById('estRam').textContent = `~${(estRamMB / 1024).toFixed(2)} GB`;

  document.getElementById('totalBlocks').textContent = Object.keys(savedWorldData).length;
  document.getElementById('storageSize').textContent = formatBytes(new Blob([JSON.stringify(savedWorldData)]).size);
  document.getElementById('coordVal').textContent = `${Math.floor(playerPos.x)}, ${Math.floor(playerPos.y)}, ${Math.floor(playerPos.z)}`;
}

function saveWorldToStorage() {
  try {
    localStorage.setItem('erikai_voxel_world', JSON.stringify(savedWorldData));
    localStorage.setItem('erikai_voxel_seed', currentSeed.toString());
  } catch(e) {}
}

function loadWorldFromStorage() {
  const storedSeed = localStorage.getItem('erikai_voxel_seed');
  if (storedSeed) {
    currentSeed = parseInt(storedSeed);
    noise = SimplexNoise(currentSeed);
  }
  const data = localStorage.getItem('erikai_voxel_world');
  if (data) {
    try { savedWorldData = JSON.parse(data); } catch(e) { savedWorldData = {}; }
  }
}

// KOMPLETNÝ RESET NA NOVÝ NÁHODNÝ SVET
function resetWorld() {
  localStorage.removeItem('erikai_voxel_world');
  localStorage.removeItem('erikai_voxel_seed');
  savedWorldData = {};
  
  for (let [key, mesh] of activeBlocks.entries()) {
    scene.remove(mesh);
    mesh.geometry.dispose();
  }
  activeBlocks.clear();
  
  currentSeed = Math.floor(Math.random() * 899999 + 100000);
  noise = SimplexNoise(currentSeed);
  document.getElementById('seedVal').textContent = currentSeed;
  
  respawnPlayer();
}

function respawnPlayer() {
  isDead = false;
  document.getElementById('deathScreen').style.display = 'none';
  playerPos.x = 0;
  playerPos.y = 0;
  playerPos.z = getTerrainHeight(0, 0) + 2;
  playerVelocityZ = 0;
  updateChunks();
}

// NASTAVENIE JOYSTICKU
function setupJoystick() {
  const zone = document.getElementById('joystickZone');
  const knob = document.getElementById('joystickKnob');
  let touchId = null;
  let startX = 0, startY = 0;

  zone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (touchId === null) {
      const touch = e.changedTouches[0];
      touchId = touch.identifier;
      const rect = zone.getBoundingClientRect();
      startX = rect.left + rect.width / 2;
      startY = rect.top + rect.height / 2;
    }
  });

  window.addEventListener('touchmove', (e) => {
    if (touchId !== null) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === touchId) {
          const touch = e.changedTouches[i];
          let dx = touch.clientX - startX;
          let dy = touch.clientY - startY;
          const maxDist = 35;
          const dist = Math.sqrt(dx * dx + dy * dy);
          
          if (dist > maxDist) {
            dx = (dx / dist) * maxDist;
            dy = (dy / dist) * maxDist;
          }

          knob.style.transform = `translate(${dx}px, ${dy}px)`;
          joystickMove.x = dx / maxDist;
          joystickMove.y = -dy / maxDist;
        }
      }
    }
  });

  const resetKnob = (e) => {
    if (touchId !== null) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === touchId) {
          touchId = null;
          knob.style.transform = `translate(0px, 0px)`;
          joystickMove.x = 0;
          joystickMove.y = 0;
        }
      }
    }
  };

  window.addEventListener('touchend', resetKnob);
  window.addEventListener('touchcancel', resetKnob);
}

function setupJumpBtn() {
  const btn = document.getElementById('jumpBtn');
  const triggerJump = (e) => {
    e.preventDefault();
    if (isGrounded && !isDead) {
      playerVelocityZ = 0.32;
      isGrounded = false;
    }
  };
  btn.addEventListener('touchstart', triggerJump);
  btn.addEventListener('mousedown', triggerJump);
}

function setupTouchLook() {
  let touchStartX = 0, touchStartY = 0;
  window.addEventListener('touchstart', (e) => {
    if (e.target.id !== 'jumpBtn' && e.target.id !== 'joystickZone' && e.target.id !== 'joystickKnob' && e.target.tagName !== 'BUTTON') {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }
  });
  window.addEventListener('touchmove', (e) => {
    if (e.target.id !== 'jumpBtn' && e.target.id !== 'joystickZone' && e.target.id !== 'joystickKnob' && e.target.tagName !== 'BUTTON') {
      const deltaX = e.touches[0].clientX - touchStartX;
      const deltaY = e.touches[0].clientY - touchStartY;
      playerAngle -= deltaX * 0.005;
      cameraPitch = Math.max(0.1, Math.min(1.2, cameraPitch + deltaY * 0.005));
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }
  });
}

function setupKeyboardControls() {
  window.addEventListener('keydown', (e) => {
    if (e.key === 'w' || e.key === 'ArrowUp') keyboardKeys.forward = true;
    if (e.key === 's' || e.key === 'ArrowDown') keyboardKeys.backward = true;
    if (e.key === 'a' || e.key === 'ArrowLeft') keyboardKeys.left = true;
    if (e.key === 'd' || e.key === 'ArrowRight') keyboardKeys.right = true;
    if (e.key === ' ' && isGrounded) { playerVelocityZ = 0.32; isGrounded = false; }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'w' || e.key === 'ArrowUp') keyboardKeys.forward = false;
    if (e.key === 's' || e.key === 'ArrowDown') keyboardKeys.backward = false;
    if (e.key === 'a' || e.key === 'ArrowLeft') keyboardKeys.left = false;
    if (e.key === 'd' || e.key === 'ArrowRight') keyboardKeys.right = false;
  });
}

function updatePlayerMovement() {
  if (isDead) return;

  const speed = 0.17;
  let inputX = joystickMove.x;
  let inputY = joystickMove.y;

  if (keyboardKeys.forward) inputY += 1;
  if (keyboardKeys.backward) inputY -= 1;
  if (keyboardKeys.left) inputX -= 1;
  if (keyboardKeys.right) inputX += 1;

  if (inputX !== 0 || inputY !== 0) {
    let moveX = (-Math.sin(playerAngle) * inputY + Math.cos(playerAngle) * inputX) * speed;
    let moveY = (Math.cos(playerAngle) * inputY + Math.sin(playerAngle) * inputX) * speed;
    playerPos.x += moveX;
    playerPos.y += moveY;
  }

  const groundZ = getTerrainHeight(Math.round(playerPos.x), Math.round(playerPos.y)) + 1;
  
  playerVelocityZ -= 0.02;
  playerPos.z += playerVelocityZ;

  if (playerPos.z <= groundZ) {
    playerPos.z = groundZ;
    playerVelocityZ = 0;
    isGrounded = true;
  } else {
    isGrounded = false;
  }

  if (playerPos.z < -15) {
    isDead = true;
    document.getElementById('deathScreen').style.display = 'flex';
  }

  player.position.set(playerPos.x, playerPos.y, playerPos.z);
  player.rotation.z = playerAngle;

  const camDist = 8;
  camera.position.x = playerPos.x + Math.sin(playerAngle) * (camDist * Math.cos(cameraPitch));
  camera.position.y = playerPos.y - Math.cos(playerAngle) * (camDist * Math.cos(cameraPitch));
  camera.position.z = playerPos.z + camDist * Math.sin(cameraPitch);
  camera.lookAt(playerPos.x, playerPos.y, playerPos.z + 1);
}

let lastFrameTime = performance.now(), frameCount = 0;

function animate() {
  requestAnimationFrame(animate);
  if (!isDead) {
    updatePlayerMovement();
    updateChunks();
  }

  frameCount++;
  const now = performance.now();
  if (now - lastFrameTime >= 1000) {
    document.getElementById('fpsVal').textContent = frameCount;
    frameCount = 0; lastFrameTime = now;
  }
  renderer.render(scene, camera);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.onload = init;
</script>
</body>
</html>
