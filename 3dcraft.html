<style>

}

#deathScreen h1 { font-size: 2.5rem; margin: 0 0 10px 0; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }

#deathScreen button {
  padding: 16px 32px; background: white; color: #ef4444; border: none;

  box-shadow: 0 6px 25px rgba(0,0,0,0.5); pointer-events: auto;

  align-items: center; justify-content: center; z-index: 20;
  box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); cursor: pointer;
}
#jumpBtn:active { transform: scale(0.92); background: #059669; }

button.action-btn {
  padding: 8px 12px; background: var(--accent-red); color: white;

</div>

<!-- OVLÁDACIE PRVKY -->
<div id="joystickZone"><div id="joystickKnob"></div></div>
<div id="jumpBtn">🦘 JUMP</div>

<script>
THREE.Object3D.DefaultUp.set(0, 0, 1);

const SimplexNoise = function(seed) {
  let s = seed || Math.random();
  const p = new Uint8Array(256);
  for (let i=0; i<256; i++) {
    s = (s * 9301 + 49297) % 233280;
    p[i] = Math.floor((s / 233280) * 256);
  }
  const perm = new Uint8Array(512);
  for (let i=0; i<512; i++) perm[i] = p[i & 255];
  return {
    noise2D: function(xin, yin) {
      let n0, n1, n2;
      let s = (xin+yin)*0.5*(Math.sqrt(3.0)-1.0);
      let i = Math.floor(xin+s), j = Math.floor(yin+s);
      let t = (i+j)*(3.0-Math.sqrt(3.0))/6.0;
      let x0 = xin-(i-t), y0 = yin-(j-t);
      let i1 = x0 > y0 ? 1 : 0, j1 = x0 > y0 ? 0 : 1;
      let x1 = x0 - i1 + (3.0-Math.sqrt(3.0))/6.0, y1 = y0 - j1 + (3.0-Math.sqrt(3.0))/6.0;
      let x2 = x0 - 1.0 + 2.0*(3.0-Math.sqrt(3.0))/6.0, y2 = y0 - 1.0 + 2.0*(3.0-Math.sqrt(3.0))/6.0;
      let ii = i & 255, jj = j & 255;
      let t0 = 0.5 - x0*x0-y0*y0; if(t0>0) n0 = Math.pow(t0, 4) * (perm[ii+perm[jj]]%2 === 0 ? 1 : -1); else n0 = 0.0;
      let t1 = 0.5 - x1*x1-y1*y1; if(t1>0) n1 = Math.pow(t1, 4) * (perm[ii+i1+perm[jj+j1]]%2 === 0 ? 1 : -1); else n1 = 0.0;
      let t2 = 0.5 - x2*x2-y2*y2; if(t2>0) n2 = Math.pow(t2, 4) * (perm[ii+1+perm[jj+1]]%2 === 0 ? 1 : -1); else n2 = 0.0;
      return 70.0 * (n0 + n1 + n2);
    }
  };
};

let currentSeed = Math.floor(Math.random() * 899999 + 100000);
let noise = SimplexNoise(currentSeed);

let scene, camera, renderer, player, enemy;
let activeBlocks = new Map();
let solidBlocks = new Set();
let savedWorldData = {};
let RENDER_DISTANCE = 26; 
let isDead = false;
let respawnProtection = 0; // Ochranný časovač imunity po oživení

const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const materials = {
  grass: new THREE.MeshStandardMaterial({ color: 0x388e3c, roughness: 0.8 }),
  dirt: new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.9 }),
  stone: new THREE.MeshStandardMaterial({ color: 0x616161, roughness: 0.7 }),
  sand: new THREE.MeshStandardMaterial({ color: 0xfbc02d, roughness: 0.9 }),
  snow: new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.5 }),
  wood: new THREE.MeshStandardMaterial({ color: 0x4e342e, roughness: 0.8 }),
  leaves: new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.6 }),
  brick: new THREE.MeshStandardMaterial({ color: 0xb71c1c, roughness: 0.7 }),
  glass: new THREE.MeshStandardMaterial({ color: 0x81d4fa, roughness: 0.2, transparent: true, opacity: 0.7 }),
  bedrock: new THREE.MeshStandardMaterial({ color: 0x212121, roughness: 0.9 })
};

let playerPos = { x: 0, y: 0, z: 10 };
let playerVelocityZ = 0;
let isGrounded = false;
let playerAngle = 0, cameraPitch = 0.45;
let walkAnimationTime = 0;

// Bezpečný štart nepriateľa v diaľke (40 blokov)
let enemyPos = { x: 40, y: 40, z: 10 };
let enemyVelocityZ = 0;
let enemyGrounded = false;
let enemyWalkAnim = 0;

let joystickMove = { x: 0, y: 0 };
let joystickTouchId = null;
let keyboardKeys = { forward: false, backward: false, left: false, right: false };

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x7ec8e3);
  scene.fog = new THREE.FogExp2(0x7ec8e3, 0.015);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
  dirLight.position.set(100, 80, 150);
  scene.add(dirLight);

  player = createDetailedCharacter(0x1e88e5, 0x1565c0);
  enemy = createDetailedCharacter(0xd32f2f, 0xb71c1c);
  scene.add(player);
  scene.add(enemy);

  loadWorldFromStorage();

  playerPos.x = 0;
  playerPos.y = 0;
  playerPos.z = getTerrainHeight(0,0) + 3;
  playerVelocityZ = 0;

  enemyPos.x = 40;
  enemyPos.y = 40;
  enemyPos.z = getTerrainHeight(40, 40) + 3;
  enemyVelocityZ = 0;

  updateChunks();

  setupJoystick();
  setupJumpBtn();
  setupTouchLook();
  setupKeyboardControls();

  const respawnBtn = document.getElementById('respawnBtn');
  const triggerRespawn = (e) => {
    e.preventDefault();
    e.stopPropagation();
    respawnPlayer();
  };
  respawnBtn.addEventListener('click', triggerRespawn);
  respawnBtn.addEventListener('touchend', triggerRespawn);

  window.addEventListener('resize', onWindowResize);
  document.getElementById('seedVal').textContent = currentSeed;

  animate();
}

function createDetailedCharacter(shirtColor, pantsColor) {
  const group = new THREE.Group();
  const matShirt = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.6 });
  const matPants = new THREE.MeshStandardMaterial({ color: pantsColor, roughness: 0.7 });
  const matSkin = new THREE.MeshStandardMaterial({ color: 0xffcc80, roughness: 0.8 });
  const matHair = new THREE.MeshStandardMaterial({ color: 0x3e2723, roughness: 0.9 });
  const matEyes = new THREE.MeshStandardMaterial({ color: 0x000000 });
  const matShoes = new THREE.MeshStandardMaterial({ color: 0x212121 });

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.28, 0.6), matShirt);
  torso.position.z = 0.55;
  group.add(torso);

  const head = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.42, 0.42), matSkin);
  head.position.z = 1.1;
  group.add(head);

  const eye1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.05, 0.08), matEyes);
  eye1.position.set(0.22, 0.1, 1.15);
  group.add(eye1);
  const eye2 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.05, 0.08), matEyes);
  eye2.position.set(0.22, -0.1, 1.15);
  group.add(eye2);

  const ear1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.12), matSkin);
  ear1.position.set(0, 0.24, 1.1);
  group.add(ear1);
  const ear2 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.12), matSkin);
  ear2.position.set(0, -0.24, 1.1);
  group.add(ear2);

  const hair = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.44, 0.18), matHair);
  hair.position.set(0, 0, 1.32);
  group.add(hair);

  group.userData = {
    rightLeg: createLegPart(matPants, matShoes, 0.11, 0.15),
    leftLeg: createLegPart(matPants, matShoes, -0.11, 0.15),
    rightArm: createArmPart(matShirt, 0.14, 0.6),
    leftArm: createArmPart(matShirt, -0.14, 0.6)
  };

  group.add(group.userData.rightLeg);
  group.add(group.userData.leftLeg);
  group.add(group.userData.rightArm);
  group.add(group.userData.leftArm);

  return group;
}

function createLegPart(matPants, matShoes, yOffset, zPos) {
  const legGroup = new THREE.Group();
  legGroup.position.set(0, yOffset, zPos);
  const pants = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 0.35), matPants);
  pants.position.z = -0.15;
  legGroup.add(pants);
  const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.19, 0.12), matShoes);
  shoe.position.set(0.02, 0, -0.35);
  legGroup.add(shoe);
  return legGroup;
}

function createArmPart(matShirt, yOffset, zPos) {
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.18, 0.5), matShirt);
  arm.position.set(0, yOffset, zPos);
  return arm;
}

function getTerrainHeight(x, y) {
  let baseNoise = noise.noise2D(x * 0.02, y * 0.02) * 6 + noise.noise2D(x * 0.06, y * 0.06) * 2;
  return Math.floor(baseNoise) + 2;
}

function getBuildingType(x, y) {
  if (Math.abs(x) > 6 && Math.abs(y) > 6 && (x % 14 === 0) && (y % 14 === 0)) {
    let seedVal = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
    let type = Math.floor((seedVal - Math.floor(seedVal)) * 3);
    return type + 1;
  }
  return 0;
}

function isSolidBlock(x, y, z) {
  const groundZ = getTerrainHeight(x, y);
  if (z <= groundZ) return true;

  const bX = Math.round(x / 14) * 14;
  const bY = Math.round(y / 14) * 14;
  const bType = getBuildingType(bX, bY);
  if (bType > 0) {
    const bHeight = bType === 2 ? 8 : 4;
    const bGround = getTerrainHeight(bX, bY);
    if (z > bGround && z <= bGround + bHeight) {
      if (Math.abs(x - bX) <= 1 && Math.abs(y - bY) <= 1) {
        if (Math.abs(x - bX) === 1 || Math.abs(y - bY) === 1 || z === bGround + bHeight) {
          return true;
        }
      }
    }
  }

  const tX = Math.round(x);
  const tY = Math.round(y);
  if (isTreePosition(tX, tY)) {
    const tGround = getTerrainHeight(tX, tY);
    if (z > tGround && z <= tGround + 5) return true;
  }

  return solidBlocks.has(`${Math.round(x)},${Math.round(y)},${Math.round(z)}`);
}

function getBiomeMaterial(x, y, z, maxZ) {
  const temperature = noise.noise2D(x * 0.01 + 50, y * 0.01 + 50);
  if (z <= -16) return materials.bedrock;
  if (z > 10) return materials.snow;
  if (temperature < -0.3) return z === maxZ ? materials.snow : materials.stone;
  if (temperature > 0.45) return materials.sand;
  if (z === maxZ) return materials.grass;
  if (z > maxZ - 3) return materials.dirt;
  return materials.stone;
}

function isTreePosition(x, y) {
  if (Math.abs(x) <= 4 && Math.abs(y) <= 4) return false;
  const z = getTerrainHeight(x, y);
  const temp = noise.noise2D(x * 0.01 + 50, y * 0.01 + 50);
  if (z <= 10 && temp >= -0.3 && temp <= 0.45) {
    return noise.noise2D(x * 0.35, y * 0.35) > 0.82;
  }
  return false;
}

function updateChunks() {
  const pX = Math.floor(playerPos.x);
  const pY = Math.floor(playerPos.y);
  let neededKeys = new Set();
  solidBlocks.clear();
  let addedCount = 0;

  for (let x = pX - RENDER_DISTANCE; x <= pX + RENDER_DISTANCE; x++) {
    for (let y = pY - RENDER_DISTANCE; y <= pY + RENDER_DISTANCE; y++) {
      const dist = Math.sqrt((x - pX)**2 + (y - pY)**2);
      if (dist > RENDER_DISTANCE) continue;

      const maxZ = getTerrainHeight(x, y);
      const minZ = Math.max(-16, maxZ - 6);

      for (let z = maxZ; z >= minZ; z--) {
        const key = `${x},${y},${z}`;
        neededKeys.add(key);
        solidBlocks.add(key);

        if (!activeBlocks.has(key)) {
          const mat = getBiomeMaterial(x, y, z, maxZ);
          const mesh = new THREE.Mesh(boxGeo, mat);
          mesh.position.set(x, y, z);
          scene.add(mesh);
          activeBlocks.set(key, mesh);

          if (!savedWorldData[key]) {
            savedWorldData[key] = 1;
            addedCount++;
          }
        }
      }

      const bType = getBuildingType(x, y);
      if (bType > 0) {
        const bHeight = bType === 2 ? 8 : 4;
        const groundZ = getTerrainHeight(x, y);
        for (let bz = 1; bz <= bHeight; bz++) {
          for (let bx = -1; bx <= 1; bx++) {
            for (let by = -1; by <= 1; by++) {
              if (bx === -1 || bx === 1 || by === -1 || by === 1 || bz === bHeight) {
                const bKey = `${x+bx},${y+by},${groundZ+bz}`;
                neededKeys.add(bKey);
                solidBlocks.add(bKey);
                if (!activeBlocks.has(bKey)) {
                  let matToUse = materials.brick;
                  if (bz > 1 && bz < bHeight && (bx === 0 || by === 0)) matToUse = materials.glass;
                  const bMesh = new THREE.Mesh(boxGeo, matToUse);
                  bMesh.position.set(x+bx, y+by, groundZ+bz);
                  scene.add(bMesh);
                  activeBlocks.set(bKey, bMesh);
                }
              }
            }
          }
        }
      }

      if (isTreePosition(x, y)) {
        const trunkH = 3;
        for (let tz = 1; tz <= trunkH; tz++) {
          const treeKey = `${x},${y},${maxZ + tz}`;
          neededKeys.add(treeKey);
          solidBlocks.add(treeKey);
          if (!activeBlocks.has(treeKey)) {
            const mesh = new THREE.Mesh(boxGeo, materials.wood);
            mesh.position.set(x, y, maxZ + tz);
            scene.add(mesh);
            activeBlocks.set(treeKey, mesh);
          }
        }
        for (let lx = -1; lx <= 1; lx++) {
          for (let ly = -1; ly <= 1; ly++) {
            for (let lz = trunkH + 1; lz <= trunkH + 2; lz++) {
              const leafKey = `${x+lx},${y+ly},${maxZ+lz}`;
              neededKeys.add(leafKey);
              solidBlocks.add(leafKey);
              if (!activeBlocks.has(leafKey)) {
                const mesh = new THREE.Mesh(boxGeo, materials.leaves);
                mesh.position.set(x+lx, y+ly, maxZ+lz);
                scene.add(mesh);
                activeBlocks.set(leafKey, mesh);
              }
            }
          }
        }
      }
    }
  }

  for (let [key, mesh] of activeBlocks.entries()) {
    if (!neededKeys.has(key)) {
      scene.remove(mesh);
      mesh.geometry.dispose();
      activeBlocks.delete(key);
    }
  }

  if (addedCount > 0) saveWorldToStorage();
  updateHUDStats();
}

function updateHUDStats() {
  const activeCount = activeBlocks.size;
  document.getElementById('ramCount').textContent = activeCount;
  const estRamMB = Math.round(300 + (activeCount * 0.075));
  document.getElementById('estRam').textContent = `~${(estRamMB / 1024).toFixed(2)} GB`;
  document.getElementById('totalBlocks').textContent = Object.keys(savedWorldData).length;
  document.getElementById('coordVal').textContent = `${Math.floor(playerPos.x)}, ${Math.floor(playerPos.y)}, ${Math.floor(playerPos.z)}`;
}

function saveWorldToStorage() {
  try {
    localStorage.setItem('erikai_voxel_world', JSON.stringify(savedWorldData));
    localStorage.setItem('erikai_voxel_seed', currentSeed.toString());
  } catch(e) {}
}

function loadWorldFromStorage() {
  const storedSeed = localStorage.getItem('erikai_voxel_seed');
  if (storedSeed) {
    currentSeed = parseInt(storedSeed);
    noise = SimplexNoise(currentSeed);
  }
  const data = localStorage.getItem('erikai_voxel_world');
  if (data) {
    try { savedWorldData = JSON.parse(data); } catch(e) { savedWorldData = {}; }
  }
}

function resetWorld() {
  localStorage.removeItem('erikai_voxel_world');
  localStorage.removeItem('erikai_voxel_seed');
  savedWorldData = {};
  
  for (let [key, mesh] of activeBlocks.entries()) {
    scene.remove(mesh);
    mesh.geometry.dispose();
  }
  activeBlocks.clear();
  
  currentSeed = Math.floor(Math.random() * 899999 + 100000);
  noise = SimplexNoise(currentSeed);
  document.getElementById('seedVal').textContent = currentSeed;
  
  respawnPlayer();
}

function respawnPlayer() {
  isDead = false;
  document.getElementById('deathScreen').style.display = 'none';
  
  // 3-sekundová ochranná imunita po oživení
  respawnProtection = Date.now() + 3000;
  
  // Vynulovanie ovládania
  keyboardKeys = { forward: false, backward: false, left: false, right: false };
  joystickMove = { x: 0, y: 0 };
  joystickTouchId = null;
  const knob = document.getElementById('joystickKnob');
  if (knob) knob.style.transform = `translate(0px, 0px)`;

  // Pozícia hráča na začiatku
  playerPos.x = 0;
  playerPos.y = 0;
  playerPos.z = getTerrainHeight(0, 0) + 3.0;
  playerVelocityZ = 0;
  isGrounded = true;
  
  // Nepriateľ sa spawnul ďaleko v diaľke (40 blokov) s presnou výškou terénu
  enemyPos.x = 40;
  enemyPos.y = 40;
  enemyPos.z = getTerrainHeight(40, 40) + 3.0;
  enemyVelocityZ = 0;
  enemyGrounded = true;
  
  updateChunks();
}

// OVLÁDANIE A JOYSTICK
function setupJoystick() {
  const zone = document.getElementById('joystickZone');
  const knob = document.getElementById('joystickKnob');

  zone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (joystickTouchId === null && e.changedTouches.length > 0) {
      const touch = e.changedTouches[0];
      joystickTouchId = touch.identifier;
    }
  }, { passive: false });

  window.addEventListener('touchmove', (e) => {
    if (joystickTouchId !== null) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joystickTouchId) {
          const touch = e.changedTouches[i];
          const rect = zone.getBoundingClientRect();
          const startX = rect.left + rect.width / 2;
          const startY = rect.top + rect.height / 2;
          
          let dx = touch.clientX - startX;
          let dy = touch.clientY - startY;
          const maxDist = 35;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > maxDist) {
            dx = (dx / dist) * maxDist;
            dy = (dy / dist) * maxDist;
          }
          knob.style.transform = `translate(${dx}px, ${dy}px)`;
          joystickMove.x = dx / maxDist;
          joystickMove.y = -dy / maxDist;
        }
      }
    }
  }, { passive: false });

  const resetKnob = (e) => {
    if (joystickTouchId !== null) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joystickTouchId) {
          joystickTouchId = null;
          knob.style.transform = `translate(0px, 0px)`;
          joystickMove.x = 0;
          joystickMove.y = 0;
        }
      }
    }
  };
  window.addEventListener('touchend', resetKnob);
  window.addEventListener('touchcancel', resetKnob);
}

function setupJumpBtn() {
  const btn = document.getElementById('jumpBtn');
  const triggerJump = (e) => {
    e.preventDefault();
    if (isGrounded && !isDead) {
      playerVelocityZ = 0.36;
      isGrounded = false;
    }
  };
  btn.addEventListener('touchstart', triggerJump);
  btn.addEventListener('mousedown', triggerJump);
}

function setupTouchLook() {
  let touchStartX = 0, touchStartY = 0;
  window.addEventListener('touchstart', (e) => {
    if (isDead) return;
    const t = e.target;
    if (t.id !== 'jumpBtn' && t.id !== 'joystickZone' && t.id !== 'joystickKnob' && t.tagName !== 'BUTTON') {
      if (e.touches.length > 0) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }
  });
  window.addEventListener('touchmove', (e) => {
    if (isDead) return;
    const t = e.target;
    if (t.id !== 'jumpBtn' && t.id !== 'joystickZone' && t.id !== 'joystickKnob' && t.tagName !== 'BUTTON') {
      if (e.touches.length > 0) {
        const deltaX = e.touches[0].clientX - touchStartX;
        const deltaY = e.touches[0].clientY - touchStartY;
        playerAngle -= deltaX * 0.005;
        cameraPitch = Math.max(0.1, Math.min(1.2, cameraPitch + deltaY * 0.005));
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }
  });
}

function setupKeyboardControls() {
  window.addEventListener('keydown', (e) => {
    if (isDead) return;
    if (e.key === 'w' || e.key === 'ArrowUp') keyboardKeys.forward = true;
    if (e.key === 's' || e.key === 'ArrowDown') keyboardKeys.backward = true;
    if (e.key === 'a' || e.key === 'ArrowLeft') keyboardKeys.left = true;
    if (e.key === 'd' || e.key === 'ArrowRight') keyboardKeys.right = true;
    if (e.key === ' ' && isGrounded) { playerVelocityZ = 0.36; isGrounded = false; }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'w' || e.key === 'ArrowUp') keyboardKeys.forward = false;
    if (e.key === 's' || e.key === 'ArrowDown') keyboardKeys.backward = false;
    if (e.key === 'a' || e.key === 'ArrowLeft') keyboardKeys.left = false;
    if (e.key === 'd' || e.key === 'ArrowRight') keyboardKeys.right = false;
  });
}

function updateCharacterAnimation(charGroup, isMoving, isEnemy = false) {
  let animTime = isEnemy ? (enemyWalkAnim += 0.15) : (walkAnimationTime += 0.15);
  if (isMoving) {
    const swing = Math.sin(animTime) * 0.5;
    charGroup.userData.rightLeg.rotation.y = swing;
    charGroup.userData.leftLeg.rotation.y = -swing;
    charGroup.userData.rightArm.rotation.y = -swing;
    charGroup.userData.leftArm.rotation.y = swing;
  } else {
    charGroup.userData.rightLeg.rotation.y = 0;
    charGroup.userData.leftLeg.rotation.y = 0;
    charGroup.userData.rightArm.rotation.y = 0;
    charGroup.userData.leftArm.rotation.y = 0;
  }
}

function updatePlayerMovement() {
  if (isDead) return;

  const speed = 0.15;
  let inputX = joystickMove.x;
  let inputY = joystickMove.y;

  if (keyboardKeys.forward) inputY += 1;
  if (keyboardKeys.backward) inputY -= 1;
  if (keyboardKeys.left) inputX -= 1;
  if (keyboardKeys.right) inputX += 1;

  let isMoving = false;
  let nextX = playerPos.x;
  let nextY = playerPos.y;

  if (inputX !== 0 || inputY !== 0) {
    let moveX = (-Math.sin(playerAngle) * inputY + Math.cos(playerAngle) * inputX) * speed;
    let moveY = (Math.cos(playerAngle) * inputY + Math.sin(playerAngle) * inputX) * speed;
    nextX += moveX;
    nextY += moveY;
    isMoving = true;
  }

  const currentGround = getTerrainHeight(Math.round(playerPos.x), Math.round(playerPos.y));
  const targetGround = getTerrainHeight(Math.round(nextX), Math.round(nextY));

  if ((targetGround - currentGround <= 1) || !isGrounded) {
    if (!isSolidBlock(nextX, playerPos.y, Math.floor(playerPos.z)) && !isSolidBlock(nextX, playerPos.y, Math.floor(playerPos.z) + 1)) {
      playerPos.x = nextX;
    }
    if (!isSolidBlock(playerPos.x, nextY, Math.floor(playerPos.z)) && !isSolidBlock(playerPos.x, nextY, Math.floor(playerPos.z) + 1)) {
      playerPos.y = nextY;
    }
  }

  playerVelocityZ -= 0.02;
  playerPos.z += playerVelocityZ;

  const footZ = Math.floor(playerPos.z);
  if (isSolidBlock(playerPos.x, playerPos.y, footZ)) {
    if (playerVelocityZ < 0) {
      playerPos.z = footZ + 1.0;
      playerVelocityZ = 0;
      isGrounded = true;
    } else {
      playerPos.z -= playerVelocityZ;
      playerVelocityZ = 0;
    }
  } else {
    isGrounded = false;
  }

  if (playerPos.z < -15) {
    isDead = true;
    document.getElementById('deathScreen').style.display = 'flex';
  }

  player.position.set(playerPos.x, playerPos.y, playerPos.z);
  player.rotation.z = playerAngle;
  updateCharacterAnimation(player, isMoving, false);

  // POHYB NEPRIATEĽA
  const dx = playerPos.x - enemyPos.x;
  const dy = playerPos.y - enemyPos.y;
  const dist = Math.sqrt(dx * dx + dy * dy);

  // Kontrola smrti (ignoruje sa, ak prebieha 3-sekundová ochranná imunita po respawne)
  if (Date.now() > respawnProtection && dist < 0.7 && Math.abs(playerPos.z - enemyPos.z) < 1.2) {
    isDead = true;
    document.getElementById('deathScreen').style.display = 'flex';
  } else if (dist > 0.6) {
    const enemySpeed = 0.088;
    let eNextX = enemyPos.x + (dx / dist) * enemySpeed;
    let eNextY = enemyPos.y + (dy / dist) * enemySpeed;

    const eCurrentGround = getTerrainHeight(Math.round(enemyPos.x), Math.round(enemyPos.y));
    const eTargetGround = getTerrainHeight(Math.round(eNextX), Math.round(eNextY));

    if ((eTargetGround - eCurrentGround <= 1) || !enemyGrounded) {
      if (!isSolidBlock(eNextX, enemyPos.y, Math.floor(enemyPos.z)) && !isSolidBlock(eNextX, enemyPos.y, Math.floor(enemyPos.z) + 1)) {
        enemyPos.x = eNextX;
      }
      if (!isSolidBlock(enemyPos.x, eNextY, Math.floor(enemyPos.z)) && !isSolidBlock(enemyPos.x, eNextY, Math.floor(enemyPos.z) + 1)) {
        enemyPos.y = eNextY;
      }
    } else if (enemyGrounded && eTargetGround - eCurrentGround > 1) {
      enemyVelocityZ = 0.36;
      enemyGrounded = false;
    }

    updateCharacterAnimation(enemy, true, true);
  } else {
    updateCharacterAnimation(enemy, false, true);
  }

  enemyVelocityZ -= 0.02;
  enemyPos.z += enemyVelocityZ;
  const enemyFootZ = Math.floor(enemyPos.z);
  if (isSolidBlock(enemyPos.x, enemyPos.y, enemyFootZ)) {
    if (enemyVelocityZ < 0) {
      enemyPos.z = enemyFootZ + 1.0;
      enemyVelocityZ = 0;
      enemyGrounded = true;
    } else {
      enemyPos.z -= enemyVelocityZ;
      enemyVelocityZ = 0;
    }
  } else {
    enemyGrounded = false;
  }

  enemy.position.set(enemyPos.x, enemyPos.y, enemyPos.z);
  enemy.rotation.z = Math.atan2(dy, dx) - Math.PI/2;

  const camDist = 8;
  camera.position.x = playerPos.x + Math.sin(playerAngle) * (camDist * Math.cos(cameraPitch));
  camera.position.y = playerPos.y - Math.cos(playerAngle) * (camDist * Math.cos(cameraPitch));
  camera.position.z = playerPos.z + camDist * Math.sin(cameraPitch);
  camera.lookAt(playerPos.x, playerPos.y, playerPos.z + 1);
}

let lastFrameTime = performance.now(), frameCount = 0;

function animate() {
  requestAnimationFrame(animate);
  if (!isDead) {
    updatePlayerMovement();
    updateChunks();
  }

  frameCount++;
  const now = performance.now();
  if (now - lastFrameTime >= 1000) {
    document.getElementById('fpsVal').textContent = frameCount;
    frameCount = 0; lastFrameTime = now;
  }
  renderer.render(scene, camera);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.onload = init;
</script>
