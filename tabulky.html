<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 ErikAI Tabuľky 2.0</title>
<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
    text-align: center;
    padding: 20px;
  }
  h1 {
    color: #1a73e8;
    margin-bottom: 10px;
  }
  .controls {
    margin-bottom: 20px;
  }
  input {
    width: 70px;
    padding: 8px;
    margin: 5px;
    border-radius: 8px;
    border: 1px solid #ccc;
    text-align: center;
  }
  button {
    background: #1a73e8;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover {
    background: #1558a5;
  }
  table {
    border-collapse: collapse;
    margin: 0 auto;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }
  td {
    border: 1px solid #ddd;
    padding: 8px;
    min-width: 80px;
    height: 30px;
    text-align: center;
  }
  td:focus {
    outline: 2px solid #1a73e8;
    background-color: #e8f0fe;
  }
  .export-btn {
    margin-top: 20px;
  }
</style>
</head>
<body>

<h1>📊 ErikAI Tabuľky 2.0</h1>

<div class="controls">
  <label>Riadky:</label>
  <input type="number" id="rows" value="5" min="1" max="100">
  <label>Stĺpce:</label>
  <input type="number" id="cols" value="5" min="1" max="100">
  <button onclick="createTable()">Vytvoriť tabuľku</button>
</div>

<div id="tableContainer"></div>

<button class="export-btn" onclick="exportTable()">💾 Exportovať do HTML</button>

<script>
function createTable() {
  const rows = parseInt(document.getElementById("rows").value);
  const cols = parseInt(document.getElementById("cols").value);
  const container = document.getElementById("tableContainer");

  if (rows < 1 || cols < 1) {
    alert("Zadaj platné čísla!");
    return;
  }

  let html = "<table contenteditable='true'>";
  for (let r = 0; r < rows; r++) {
    html += "<tr>";
    for (let c = 0; c < cols; c++) {
      html += "<td></td>";
    }
    html += "</tr>";
  }
  html += "</table>";
  container.innerHTML = html;
}

function exportTable() {
  const tableHTML = document.getElementById("tableContainer").innerHTML;
  const blob = new Blob([tableHTML], { type: "text/html" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "ErikAI_Tabulka.html";
  link.click();
  alert("✅ Tabuľka bola exportovaná!");
}
</script>

</body>
</html>
