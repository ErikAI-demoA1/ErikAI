<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 ErikAI Tabuľky 3.0</title>
<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f5f7fb;
    text-align: center;
    padding: 20px;
    color: #222;
  }
  h1 {
    color: #1a73e8;
  }
  .controls {
    margin: 20px 0;
  }
  input {
    width: 80px;
    padding: 8px;
    margin: 5px;
    border: 1px solid #ccc;
    border-radius: 8px;
    text-align: center;
  }
  button {
    background: #1a73e8;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover { background: #1558a5; }
  table {
    border-collapse: collapse;
    margin: 0 auto;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }
  th, td {
    border: 1px solid #ddd;
    min-width: 80px;
    height: 30px;
    text-align: center;
    padding: 4px;
  }
  th {
    background: #e8f0fe;
    color: #333;
    font-weight: bold;
  }
  td:focus {
    outline: 2px solid #1a73e8;
    background-color: #e8f0fe;
  }
  .export-btns {
    margin-top: 20px;
  }
</style>
</head>
<body>

<h1>📊 ErikAI Tabuľky 3.0</h1>

<div class="controls">
  <label>Riadky:</label>
  <input type="number" id="rows" value="5" min="1" max="100">
  <label>Stĺpce:</label>
  <input type="number" id="cols" value="5" min="1" max="26">
  <button onclick="createTable()">Vytvoriť tabuľku</button>
</div>

<div id="tableContainer"></div>

<div class="export-btns">
  <button onclick="exportHTML()">💾 Stiahnuť ako HTML</button>
  <button onclick="exportCSV()">📈 Stiahnuť ako CSV (Excel)</button>
</div>

<script>
function createTable() {
  const rows = parseInt(document.getElementById("rows").value);
  const cols = parseInt(document.getElementById("cols").value);
  const container = document.getElementById("tableContainer");

  if (rows < 1 || cols < 1) {
    alert("Zadaj platné čísla!");
    return;
  }

  let html = "<table contenteditable='true'><thead><tr><th></th>";
  for (let c = 0; c < cols; c++) {
    html += `<th>${String.fromCharCode(65 + c)}</th>`;
  }
  html += "</tr></thead><tbody>";

  for (let r = 0; r < rows; r++) {
    html += `<tr><th>${r + 1}</th>`;
    for (let c = 0; c < cols; c++) {
      html += "<td></td>";
    }
    html += "</tr>";
  }

  html += "</tbody></table>";
  container.innerHTML = html;
}

function exportHTML() {
  const table = document.querySelector("table");
  if (!table) return alert("Najprv vytvor tabuľku!");
  
  const cleanTable = table.cloneNode(true);
  cleanTable.querySelectorAll("th:first-child").forEach(th => th.remove());
  cleanTable.querySelector("thead tr th:first-child").remove();

  const blob = new Blob([cleanTable.outerHTML], { type: "text/html" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "ErikAI_Tabulka.html";
  link.click();
  alert("✅ HTML tabuľka uložená!");
}

function exportCSV() {
  const rows = document.querySelectorAll("table tr");
  if (!rows.length) return alert("Najprv vytvor tabuľku!");

  let csv = [];
  rows.forEach((row, i) => {
    let cells = Array.from(row.querySelectorAll(i === 0 ? "th:not(:first-child)" : "td"));
    let values = cells.map(cell => `"${cell.textContent.trim()}"`);
    csv.push(values.join(","));
  });

  const blob = new Blob([csv.join("\n")], { type: "text/csv" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "ErikAI_Tabulka.csv";
  link.click();
  alert("✅ CSV (Excel) súbor uložený!");
}
</script>

</body>
</html>
