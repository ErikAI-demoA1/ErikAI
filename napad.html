<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ErikAI Web Hub</title>

<style>
:root {
  --bg: #eaf6ff;
  --card: #ffffff;
  --text: #111827;
  --muted: #6b7280;
  --accent: #0878ff;
  --accent2: #00b7ff;
  --border: rgba(0,0,0,0.08);
}

body.dark {
  --bg: #0d1117;
  --card: #161b22;
  --text: #f0f6fc;
  --muted: #9da7b3;
  --border: rgba(255,255,255,0.1);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(145deg, var(--bg), var(--card));
  color: var(--text);
  transition: 0.3s;
}

.container {
  max-width: 1400px;
  margin: auto;
  padding: 20px;
}

/* HEADER */

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 55px;
  height: 55px;
  border-radius: 15px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: bold;
  box-shadow: 0 8px 25px rgba(0,100,255,0.25);
}

h1 {
  margin: 0;
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
}

/* SEARCH */

.search-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.search-row {
  display: flex;
  gap: 10px;
}

.search-row input {
  flex: 1;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  font-size: 16px;
  outline: none;
}

button {
  border: none;
  border-radius: 11px;
  padding: 11px 16px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.2s;
}

button:hover {
  transform: translateY(-2px);
}

.search-btn {
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  color: white;
}

.theme-btn {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
}

/* QUICK SEARCH */

.quick {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.quick button {
  background: rgba(0,120,255,0.08);
  color: var(--accent);
}

/* RESULTS */

.results {
  margin-top: 20px;
}

.result-card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 15px;
  border-radius: 13px;
  margin-bottom: 10px;
}

.result-title {
  font-weight: bold;
  font-size: 17px;
  color: var(--accent);
}

.result-url {
  color: var(--muted);
  font-size: 12px;
  margin: 5px 0;
}

.result-buttons {
  margin-top: 10px;
}

.open-btn {
  background: var(--accent);
  color: white;
}

.external-btn {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}

/* PANELS */

.panel-header {
  margin-top: 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.panel-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
  gap: 15px;
  margin-top: 12px;
}

.web-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 15px;
  overflow: hidden;
  min-height: 400px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

.panel-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px;
  border-bottom: 1px solid var(--border);
}

.panel-title {
  font-size: 13px;
  font-weight: bold;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.panel-actions button {
  padding: 6px 9px;
  margin-left: 3px;
  font-size: 12px;
}

iframe {
  width: 100%;
  height: 400px;
  border: none;
  background: white;
}

/* EMPTY */

.empty {
  text-align: center;
  padding: 35px;
  color: var(--muted);
}

/* FOOTER */

footer {
  text-align: center;
  margin-top: 25px;
  color: var(--muted);
  font-size: 13px;
}

@media(max-width:650px) {

  header {
    align-items: flex-start;
  }

  .search-row {
    flex-direction: column;
  }

  .panel-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<header>

  <div class="brand">

    <div class="logo">E</div>

    <div>
      <h1>ErikAI Web Hub</h1>
      <div class="subtitle">
        Vlastné vyhľadávanie • viac webových panelov • ErikAI OS
      </div>
    </div>

  </div>

  <button class="theme-btn" onclick="toggleTheme()">
    🌓 Režim
  </button>

</header>


<!-- SEARCH -->

<section class="search-box">

  <div class="search-row">

    <input
      id="searchInput"
      type="text"
      placeholder="🔎 Čo chceš vyhľadať?"
      onkeydown="if(event.key==='Enter') searchGoogle()"
    >

    <button class="search-btn" onclick="searchGoogle()">
      🔍 Hľadať
    </button>

  </div>


  <div class="quick">

    <button onclick="quickSearch('Brawl Stars')">
      🎮 Brawl Stars
    </button>

    <button onclick="quickSearch('Slovensko')">
      🇸🇰 Slovensko
    </button>

    <button onclick="quickSearch('YouTube')">
      ▶️ YouTube
    </button>

    <button onclick="quickSearch('Google Maps')">
      🗺️ Mapy
    </button>

  </div>

</section>


<!-- GOOGLE SEARCH -->

<section class="results">

  <h2>🔎 ErikAI výsledky</h2>

  <div id="resultsContainer">

    <div class="empty">
      Zadaj vyhľadávanie a ErikAI pripraví výsledky.
    </div>

  </div>

</section>


<!-- PANELS -->

<div class="panel-header">

  <h2>🌐 Otvorené weby</h2>

  <button onclick="clearPanels()">
    🧹 Zavrieť všetky
  </button>

</div>


<div id="panelGrid" class="panel-grid">

  <div class="empty">
    Zatiaľ nie je otvorený žiadny web.
  </div>

</div>


<footer>

  ErikAI Web Hub — súčasť ErikAI OS<br>
  © 2025 Erik Mohylák

</footer>

</div>


<script>

/* =========================
   DARK MODE
========================= */

function toggleTheme() {

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "erikai_webhub_theme",
    document.body.classList.contains("dark")
      ? "dark"
      : "light"
  );

}


/* =========================
   LOAD THEME
========================= */

if (
  localStorage.getItem("erikai_webhub_theme") === "dark"
) {
  document.body.classList.add("dark");
}


/* =========================
   GOOGLE SEARCH
========================= */

function searchGoogle() {

  const query =
    document.getElementById("searchInput").value.trim();

  if (!query) {

    alert("Napíš, čo chceš vyhľadať.");
    return;

  }

  const results =
    document.getElementById("resultsContainer");

  /*
    Google výsledky sa nemusia dať
    vložiť priamo do iframe.
    
    Preto vytvoríme vlastný ErikAI
    výsledok, ktorý otvorí Google
    vyhľadávanie.
  */

  const googleURL =
    "https://www.google.com/search?q=" +
    encodeURIComponent(query);


  results.innerHTML = `

    <div class="result-card">

      <div class="result-title">
        🔎 Google — ${escapeHTML(query)}
      </div>

      <div class="result-url">
        www.google.com/search
      </div>

      <div class="result-buttons">

        <button
          class="open-btn"
          onclick="openPanel('${escapeAttribute(googleURL)}', 'Google — ${escapeAttribute(query)}')"
        >
          🌐 Otvoriť v ErikAI paneli
        </button>

        <button
          class="external-btn"
          onclick="window.open('${escapeAttribute(googleURL)}', '_blank')"
        >
          ↗️ Otvoriť samostatne
        </button>

      </div>

    </div>

  `;

}


/* =========================
   QUICK SEARCH
========================= */

function quickSearch(text) {

  document.getElementById("searchInput").value = text;

  searchGoogle();

}


/* =========================
   OPEN WEB PANEL
========================= */

function openPanel(url, title) {

  const grid =
    document.getElementById("panelGrid");


  /*
    Odstráni úvodnú hlášku.
  */

  const empty =
    grid.querySelector(".empty");

  if (empty) {
    empty.remove();
  }


  const panel =
    document.createElement("div");

  panel.className = "web-panel";


  panel.innerHTML = `

    <div class="panel-top">

      <div class="panel-title">
        🌐 ${escapeHTML(title)}
      </div>

      <div class="panel-actions">

        <button onclick="reloadPanel(this)">
          🔄
        </button>

        <button onclick="maximizePanel(this)">
          ⛶
        </button>

        <button onclick="openExternal(this)">
          ↗️
        </button>

        <button onclick="this.closest('.web-panel').remove()">
          ❌
        </button>

      </div>

    </div>

    <iframe
      src="${escapeAttribute(url)}"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>

  `;


  grid.appendChild(panel);


  /*
    Automaticky posuň stránku
    k novému panelu.
  */

  panel.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

}


/* =========================
   RELOAD PANEL
========================= */

function reloadPanel(button) {

  const iframe =
    button
      .closest(".web-panel")
      .querySelector("iframe");

  iframe.src = iframe.src;

}


/* =========================
   MAXIMIZE
========================= */

function maximizePanel(button) {

  const panel =
    button.closest(".web-panel");

  if (panel.requestFullscreen) {

    panel.requestFullscreen();

  }

}


/* =========================
   OPEN EXTERNAL
========================= */

function openExternal(button) {

  const iframe =
    button
      .closest(".web-panel")
      .querySelector("iframe");

  window.open(
    iframe.src,
    "_blank"
  );

}


/* =========================
   CLEAR PANELS
========================= */

function clearPanels() {

  document.getElementById("panelGrid").innerHTML = `

    <div class="empty">

      Zatiaľ nie je otvorený žiadny web.

    </div>

  `;

}


/* =========================
   SECURITY HELPERS
========================= */

function escapeHTML(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttribute(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
