<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ErikAI Web Panels</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;color:#eee;
 background:radial-gradient(circle at top,#182848,#05060a 70%);
 min-height:100vh
}
header{
 padding:25px;text-align:center;
 border-bottom:1px solid #ffffff18;
 backdrop-filter:blur(12px)
}
h1{margin:0;font-size:30px}
header p{color:#9da7b5}
.toolbar{
 display:flex;gap:10px;justify-content:center;
 flex-wrap:wrap;padding:20px
}
button,input{
 padding:11px 15px;border-radius:10px;
 border:1px solid #ffffff22;background:#ffffff0d;
 color:#fff
}
button{cursor:pointer;font-weight:bold}
button:hover{background:#ffffff1c}
input{width:min(500px,90vw)}
#panels{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
 gap:18px;padding:20px;max-width:1500px;margin:auto
}
.panel{
 background:#ffffff08;border:1px solid #ffffff18;
 border-radius:16px;overflow:hidden;
 box-shadow:0 10px 35px #0008;
 min-height:400px
}
.panelHead{
 display:flex;align-items:center;justify-content:space-between;
 padding:10px 14px;background:#0005
}
.panelHead span{font-weight:bold}
.panelHead button{padding:6px 10px}
iframe{
 width:100%;height:430px;border:0;background:white
}
.empty{text-align:center;color:#8e98a8;padding:60px 20px}
footer{text-align:center;color:#77808d;padding:25px;font-size:13px}
@media(max-width:600px){
 #panels{grid-template-columns:1fr;padding:10px}
 .panel{min-height:350px}
 iframe{height:350px}
}
</style>
</head>

<body>

<header>
<h1>🌌 ErikAI Web Panels</h1>
<p>Viac webových stránok na jednom mieste</p>
</header>

<div class="toolbar">
<input id="url" placeholder="https://priklad.sk">
<button onclick="addPanel()">➕ Pridať panel</button>
<button onclick="clearPanels()">🧹 Vymazať všetky</button>
<button onclick="theme()">🌓 Režim</button>
</div>

<div id="panels"></div>

<footer>
ErikAI Web Panels • Automatické lokálne uloženie
</footer>

<script>
const box=document.getElementById("panels");
let sites=JSON.parse(localStorage.getItem("erikai_panels")||"[]");

function save(){
 localStorage.setItem("erikai_panels",JSON.stringify(sites));
}

function render(){
 box.innerHTML="";

 if(!sites.length){
  box.innerHTML='<div class="empty">🌐 Zatiaľ tu nie je žiadny panel.<br>Pridaj webovú stránku vyššie.</div>';
  return;
 }

 sites.forEach((url,i)=>{
  const panel=document.createElement("section");
  panel.className="panel";

  const head=document.createElement("div");
  head.className="panelHead";

  const title=document.createElement("span");
  title.textContent="🌐 "+new URL(url).hostname;

  const remove=document.createElement("button");
  remove.textContent="✕";
  remove.onclick=()=>{
   sites.splice(i,1);
   save();
   render();
  };

  head.append(title,remove);

  const frame=document.createElement("iframe");
  frame.src=url;
  frame.loading="lazy";
  frame.allow="fullscreen";

  panel.append(head,frame);
  box.appendChild(panel);
 });
}

function addPanel(){
 let url=document.getElementById("url").value.trim();
 if(!url)return alert("Zadaj URL stránky.");

 if(!/^https?:\/\//i.test(url))
  url="https://"+url;

 try{new URL(url)}
 catch{return alert("Neplatný odkaz.");}

 if(sites.includes(url))
  return alert("Táto stránka už je pridaná.");

 sites.push(url);
 save();
 render();

 document.getElementById("url").value="";
}

function clearPanels(){
 if(confirm("Naozaj odstrániť všetky panely?")){
  sites=[];
  save();
  render();
 }
}

function theme(){
 document.body.classList.toggle("light");

 if(document.body.classList.contains("light"))
  document.body.style.background="linear-gradient(135deg,#eef6ff,#fff)";
 else
  document.body.style.background="";
}

render();
</script>

</body>
</html>
