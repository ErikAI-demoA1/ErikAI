<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ErikAI Kompas – Profesionálny</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fefefe;
      color: #111;
      margin: 0;
      padding: 20px;
    }
    body.dark-mode {
      background: #121212;
      color: #fff;
    }
    h2 {
      color: #d10000;
      margin-top: 10px;
    }
    .kompas-wrapper {
      margin: 20px auto;
      width: 250px;
      height: 250px;
      border: 4px solid red;
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle at center, #fff 90%, #ddd 100%);
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    .ručička {
      width: 4px;
      height: 100px;
      background: red;
      position: absolute;
      top: 25px;
      left: 50%;
      transform-origin: bottom center;
      transition: transform 0.2s ease-out;
      border-radius: 2px;
    }
    .stred {
      width: 12px;
      height: 12px;
      background: red;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .smer-label {
      position: absolute;
      font-weight: bold;
      color: #d10000;
    }
    .uhol {
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
    }
    .button {
      margin: 10px;
      padding: 10px 20px;
      background-color: #d10000;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .button:hover {
      background-color: #b30000;
    }
  </style>
</head>
<body>

<button class="button" onclick="toggleTheme()">🌓 Zmeniť režim</button>

<h2>🧭 ErikAI Kompas</h2>

<div class="kompas-wrapper" id="kompas">
  <div class="ručička" id="rucicka"></div>
  <div class="stred"></div>
</div>

<div class="uhol" id="uholText">Smer: 0° (Sever)</div>

<p class="upozornenie" style="max-width:500px; margin:auto; background:#fff3cd; padding:10px; border-left:6px solid #ffcc00;">
  ℹ️ ErikAI Kompas funguje <strong>lokálne</strong> na vašom zariadení, žiadne dáta sa neodosielajú. <br>
  ✅ Podporované: Android (Chrome), iOS (Safari od verzie 13.4)<br>
  ❗ Nepodporované na: starších zariadeniach, niektorých desktopových prehliadačoch, PC bez senzora.
</p>

<script>
  function toggleTheme() {
    document.body.classList.toggle('dark-mode');
  }

  function getSmer(angle) {
    const smery = ["Sever", "Severovýchod", "Východ", "Juhovýchod", "Juh", "Juhozápad", "Západ", "Severozápad"];
    const index = Math.round(angle / 45) % 8;
    return smery[index];
  }

  function aktualizujKompas(uhol) {
    const rucicka = document.getElementById("rucicka");
    const uholText = document.getElementById("uholText");
    rucicka.style.transform = `rotate(${uhol}deg)`;
    uholText.textContent = `Smer: ${Math.round(uhol)}° (${getSmer(uhol)})`;
  }

  function inicializujKompas() {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      // iOS
      DeviceOrientationEvent.requestPermission()
        .then(permissionState => {
          if (permissionState === "granted") {
            window.addEventListener("deviceorientationabsolute", handler);
          } else {
            alert("Prístup k senzoru zamietnutý.");
          }
        })
        .catch(console.error);
    } else {
      // Android a iné
      window.addEventListener("deviceorientationabsolute", handler);
    }
  }

  function handler(event) {
    if (event.alpha !== null) {
      const uhol = 360 - event.alpha;
      aktualizujKompas(uhol);
    }
  }

  inicializujKompas();
</script>

</body>
</html>
