<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI – Realistická kódová animácia</title>
<style>
  body { margin:0; background:#071021; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; }
  canvas { border-radius:12px; background:linear-gradient(180deg,#02061a,#072034); }
</style>
</head>
<body>

<canvas id="erikCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('erikCanvas');
const ctx = canvas.getContext('2d');

let t = 0;

// --- realistická animácia ErikAI ---
function drawErikAI() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // pozadie
    ctx.fillStyle = '#02061a';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // podlaha
    ctx.fillStyle = '#072034';
    ctx.fillRect(0,500,canvas.width,100);

    // telo
    ctx.save();
    ctx.translate(400,350 + Math.sin(t/60)*5); // mierne dýchanie
    ctx.fillStyle = '#06b6d4';
    ctx.fillRect(-25,0,50,100); // trup

    // ramená (mierny pohyb)
    ctx.strokeStyle = '#8b5cf6';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-25,20);
    ctx.lineTo(-60, 20 + Math.sin(t/20)*5);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(25,20);
    ctx.lineTo(60, 20 + Math.sin(t/22)*5);
    ctx.stroke();

    ctx.restore();

    // hlava
    ctx.save();
    ctx.translate(400,300 + Math.sin(t/50)*3); // dýchanie
    ctx.rotate(Math.sin(t/60)*0.04);
    ctx.fillStyle = '#06b6d4';
    ctx.beginPath();
    ctx.arc(0,0,50,0,Math.PI*2);
    ctx.fill();

    // oči
    const eyeOffsetX = 20;
    const eyeOffsetY = -10;
    const eyeMovement = Math.sin(t/15)*3;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-eyeOffsetX + eyeMovement, eyeOffsetY,10,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(eyeOffsetX + eyeMovement, eyeOffsetY,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#021';
    ctx.beginPath(); ctx.arc(-eyeOffsetX + eyeMovement, eyeOffsetY,5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(eyeOffsetX + eyeMovement, eyeOffsetY,5,0,Math.PI*2); ctx.fill();

    // polorobotické detaily
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-50,0); ctx.lineTo(0,50); ctx.stroke();
    ctx.strokeStyle = '#8b5cf6';
    ctx.beginPath(); ctx.moveTo(50,0); ctx.lineTo(0,50); ctx.stroke();

    ctx.restore();

    t++;
    requestAnimationFrame(drawErikAI);
}
drawErikAI();

// --- Web Speech API s opakovaním ---
function speakLoop(text, interval=8000){
    if('speechSynthesis' in window){
        const speak = ()=>{
            const msg = new SpeechSynthesisUtterance();
            msg.text = text;
            msg.lang = 'sk-SK';
            msg.pitch = 1.2;
            msg.rate = 0.9;
            msg.volume = 1;
            speechSynthesis.speak(msg);
        }
        speak();
        setInterval(speak, interval); // opakovanie každých 8 sekúnd
    }
}

// spusti hovor
speakLoop("Ahoj! Ja som ErikAI. Čas na rozlúčku.");

</script>
</body>
</html>
