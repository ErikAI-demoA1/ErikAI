<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧪 ErikAI UnitConverter - Vedci & Fyzici</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background: linear-gradient(120deg,#1f1c2c,#928dab);
    color: #fff;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    margin-top: 20px;
    font-size: 2em;
    text-shadow: 1px 1px 4px #000;
  }
  .converter {
    background: rgba(0,0,0,0.5);
    padding: 20px;
    border-radius: 15px;
    margin: 20px;
    width: 90%;
    max-width: 500px;
    box-shadow: 0 0 20px #000;
  }
  select, input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
    border: none;
    font-size: 1em;
  }
  input[type="number"] {
    text-align: right;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #ff4d4d;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1em;
    margin-top: 10px;
  }
  button:hover {
    background: #e60000;
  }
  .result {
    text-align: center;
    margin-top: 15px;
    font-size: 1.2em;
    font-weight: bold;
  }
</style>
</head>
<body>
<h1>🧪 ErikAI UnitConverter</h1>
<div class="converter">
  <label for="category">Vyber kategóriu:</label>
  <select id="category">
    <option value="length">Dĺžka</option>
    <option value="mass">Hmotnosť</option>
    <option value="temperature">Teplota</option>
    <option value="speed">Rýchlosť</option>
    <option value="energy">Energia</option>
    <option value="pressure">Tlak</option>
  </select>

  <label for="fromUnit">Z jednotky:</label>
  <select id="fromUnit"></select>

  <label for="toUnit">Na jednotku:</label>
  <select id="toUnit"></select>

  <label for="value">Hodnota:</label>
  <input type="number" id="value" placeholder="Zadaj číslo">

  <button id="convertBtn">Prepočítať</button>
  <button id="resetBtn">Reset</button>

  <div class="result" id="result"></div>
</div>

<script>
const units = {
  length: { m:1, km:1000, cm:0.01, mm:0.001, inch:0.0254, ft:0.3048, yd:0.9144, mile:1609.34, ly:9.461e15 },
  mass: { g:1, kg:1000, mg:0.001, µg:1e-6, lb:453.592, oz:28.3495, st:6350.29 },
  temperature: { C:'C', F:'F', K:'K', R:'R' },
  speed: { 'm/s':1, 'km/h':0.277778, mph:0.44704, knot:0.514444 },
  energy: { J:1, kJ:1000, cal:4.184, kcal:4184, eV:1.602e-19 },
  pressure: { Pa:1, kPa:1000, bar:1e5, atm:101325, psi:6894.76 }
};

const category = document.getElementById('category');
const fromUnit = document.getElementById('fromUnit');
const toUnit = document.getElementById('toUnit');
const valueInput = document.getElementById('value');
const resultDiv = document.getElementById('result');

function populateUnits(cat){
  fromUnit.innerHTML = '';
  toUnit.innerHTML = '';
  for(let key in units[cat]){
    const option1 = document.createElement('option');
    option1.value = key; option1.textContent = key;
    const option2 = option1.cloneNode(true);
    fromUnit.appendChild(option1);
    toUnit.appendChild(option2);
  }
}

category.addEventListener('change',()=>populateUnits(category.value));
populateUnits(category.value);

function convert(){
  let cat = category.value;
  let val = parseFloat(valueInput.value);
  let from = fromUnit.value;
  let to = toUnit.value;
  if(cat==='temperature'){
    let celsius;
    if(from==='C') celsius=val;
    if(from==='F') celsius=(val-32)/1.8;
    if(from==='K') celsius=val-273.15;
    if(from==='R') celsius=(val-491.67)/1.8;
    let res;
    if(to==='C') res=celsius;
    if(to==='F') res=celsius*1.8+32;
    if(to==='K') res=celsius+273.15;
    if(to==='R') res=(celsius+273.15)*1.8;
    resultDiv.textContent=`${val} ${from} = ${res} ${to}`;
  } else {
    let res = val * units[cat][from] / units[cat][to];
    resultDiv.textContent=`${val} ${from} = ${res} ${to}`;
  }
}

document.getElementById('convertBtn').addEventListener('click',convert);
document.getElementById('resetBtn').addEventListener('click',()=>{
  valueInput.value='';
  resultDiv.textContent='';
});
</script>
</body>
</html>
