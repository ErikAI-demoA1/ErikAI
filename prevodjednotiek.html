<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ ErikAI Unit Converter</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 30px;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .converter {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 20px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      max-width: 400px;
      width: 100%;
    }

    select, input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      font-size: 1em;
    }

    input[type="number"] {
      text-align: right;
    }

    .result {
      margin-top: 20px;
      font-size: 1.5em;
      font-weight: bold;
      text-align: center;
      background-color: rgba(0,0,0,0.2);
      padding: 10px;
      border-radius: 10px;
    }

    button {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      font-size: 1em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #ff5e5e;
      color: white;
      transition: 0.3s;
    }

    button:hover {
      background-color: #ff2e2e;
    }
  </style>
</head>
<body>
  <h1>✨ ErikAI Unit Converter</h1>
  <div class="converter">
    <input type="number" id="valueInput" placeholder="Zadaj hodnotu" value="0">

    <select id="unitFrom">
      <optgroup label="Dĺžka">
        <option value="m">Meter (m)</option>
        <option value="km">Kilometer (km)</option>
        <option value="cm">Centimeter (cm)</option>
        <option value="mm">Milimeter (mm)</option>
        <option value="mi">Mile (mi)</option>
      </optgroup>
      <optgroup label="Hmotnosť">
        <option value="g">Gram (g)</option>
        <option value="kg">Kilogram (kg)</option>
        <option value="t">Tona (t)</option>
        <option value="lb">Libra (lb)</option>
      </optgroup>
      <optgroup label="Teplota">
        <option value="c">Celsius (°C)</option>
        <option value="f">Fahrenheit (°F)</option>
        <option value="k">Kelvin (K)</option>
      </optgroup>
      <optgroup label="Objem">
        <option value="l">Liter (l)</option>
        <option value="ml">Milliliter (ml)</option>
        <option value="m3">Kubický meter (m³)</option>
      </optgroup>
    </select>

    <select id="unitTo">
      <optgroup label="Dĺžka">
        <option value="m">Meter (m)</option>
        <option value="km">Kilometer (km)</option>
        <option value="cm">Centimeter (cm)</option>
        <option value="mm">Milimeter (mm)</option>
        <option value="mi">Mile (mi)</option>
      </optgroup>
      <optgroup label="Hmotnosť">
        <option value="g">Gram (g)</option>
        <option value="kg">Kilogram (kg)</option>
        <option value="t">Tona (t)</option>
        <option value="lb">Libra (lb)</option>
      </optgroup>
      <optgroup label="Teplota">
        <option value="c">Celsius (°C)</option>
        <option value="f">Fahrenheit (°F)</option>
        <option value="k">Kelvin (K)</option>
      </optgroup>
      <optgroup label="Objem">
        <option value="l">Liter (l)</option>
        <option value="ml">Milliliter (ml)</option>
        <option value="m3">Kubický meter (m³)</option>
      </optgroup>
    </select>

    <button onclick="convert()">Prevod</button>
    <button onclick="resetAll()">Reset</button>

    <div class="result" id="result">Výsledok: 0</div>
  </div>

  <script>
    function convert() {
      const val = parseFloat(document.getElementById('valueInput').value);
      const from = document.getElementById('unitFrom').value;
      const to = document.getElementById('unitTo').value;

      let result;

      // Dĺžka
      const length = { m: 1, km: 1000, cm: 0.01, mm: 0.001, mi: 1609.34 };
      // Hmotnosť
      const weight = { g: 1, kg: 1000, t: 1000000, lb: 453.592 };
      // Objem
      const volume = { l: 1, ml: 0.001, m3: 1000 };
      
      if (from in length && to in length) {
        result = val * length[from] / length[to];
      } else if (from in weight && to in weight) {
        result = val * weight[from] / weight[to];
      } else if (from in volume && to in volume) {
        result = val * volume[from] / volume[to];
      } else if ((from === 'c' || from === 'f' || from === 'k') &&
                 (to === 'c' || to === 'f' || to === 'k')) {
        // Teplota
        if (from === 'c') {
          result = to === 'f' ? val * 9/5 + 32 :
                   to === 'k' ? val + 273.15 : val;
        } else if (from === 'f') {
          result = to === 'c' ? (val - 32) * 5/9 :
                   to === 'k' ? (val - 32) * 5/9 + 273.15 : val;
        } else if (from === 'k') {
          result = to === 'c' ? val - 273.15 :
                   to === 'f' ? (val - 273.15) * 9/5 + 32 : val;
        }
      } else {
        result = "Neplatná kombinácia jednotiek";
      }

      document.getElementById('result').innerText = `Výsledok: ${result}`;
    }

    function resetAll() {
      document.getElementById('valueInput').value = 0;
      document.getElementById('unitFrom').selectedIndex = 0;
      document.getElementById('unitTo').selectedIndex = 0;
      document.getElementById('result').innerText = "Výsledok: 0";
    }
  </script>
</body>
</html>
