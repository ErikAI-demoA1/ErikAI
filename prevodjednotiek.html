<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧪 ErikAI UnitConverter</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #1e1e2f, #3a3a5a);
    color: #fff;
    margin: 0;
    padding: 0;
  }
  header {
    background-color: #2b2b3c;
    padding: 20px;
    text-align: center;
    font-size: 1.5em;
    font-weight: bold;
    letter-spacing: 1px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  main {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    padding: 20px;
    gap: 20px;
  }
  .unit-card {
    background-color: #3a3a5a;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    width: 280px;
    text-align: center;
  }
  select, input {
    padding: 8px;
    margin: 5px 0;
    width: 80%;
    border-radius: 6px;
    border: none;
    font-size: 1em;
  }
  button {
    margin-top: 10px;
    padding: 10px 15px;
    background-color: #ff5e5e;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover {
    background-color: #ff3e3e;
  }
  p.result {
    margin-top: 10px;
    font-size: 1.2em;
    font-weight: bold;
  }
  footer {
    text-align: center;
    padding: 15px;
    background-color: #2b2b3c;
    box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>

<header>🧪 ErikAI UnitConverter – Profesionálny pre vedcov a fyzikov</header>

<main>
  <div class="unit-card">
    <h3>Dĺžka</h3>
    <input type="number" id="lengthValue" placeholder="Hodnota">
    <select id="lengthFrom">
      <option value="m">Meter (m)</option>
      <option value="km">Kilometer (km)</option>
      <option value="cm">Centimeter (cm)</option>
      <option value="mm">Milimeter (mm)</option>
      <option value="inch">Palec (inch)</option>
      <option value="ft">Stopa (ft)</option>
      <option value="mile">Míľa (mile)</option>
    </select>
    <select id="lengthTo">
      <option value="m">Meter (m)</option>
      <option value="km">Kilometer (km)</option>
      <option value="cm">Centimeter (cm)</option>
      <option value="mm">Milimeter (mm)</option>
      <option value="inch">Palec (inch)</option>
      <option value="ft">Stopa (ft)</option>
      <option value="mile">Míľa (mile)</option>
    </select>
    <button onclick="convertLength()">Prepočítať</button>
    <p class="result" id="lengthResult"></p>
  </div>

  <div class="unit-card">
    <h3>Hmotnosť</h3>
    <input type="number" id="massValue" placeholder="Hodnota">
    <select id="massFrom">
      <option value="kg">Kilogram (kg)</option>
      <option value="g">Gram (g)</option>
      <option value="mg">Miligram (mg)</option>
      <option value="lb">Libra (lb)</option>
      <option value="oz">Ozna (oz)</option>
    </select>
    <select id="massTo">
      <option value="kg">Kilogram (kg)</option>
      <option value="g">Gram (g)</option>
      <option value="mg">Miligram (mg)</option>
      <option value="lb">Libra (lb)</option>
      <option value="oz">Ozna (oz)</option>
    </select>
    <button onclick="convertMass()">Prepočítať</button>
    <p class="result" id="massResult"></p>
  </div>

  <div class="unit-card">
    <h3>Teplota</h3>
    <input type="number" id="tempValue" placeholder="Hodnota">
    <select id="tempFrom">
      <option value="C">°C</option>
      <option value="F">°F</option>
      <option value="K">K</option>
    </select>
    <select id="tempTo">
      <option value="C">°C</option>
      <option value="F">°F</option>
      <option value="K">K</option>
    </select>
    <button onclick="convertTemp()">Prepočítať</button>
    <p class="result" id="tempResult"></p>
  </div>

  <div class="unit-card">
    <h3>Rýchlosť</h3>
    <input type="number" id="speedValue" placeholder="Hodnota">
    <select id="speedFrom">
      <option value="m/s">m/s</option>
      <option value="km/h">km/h</option>
      <option value="mph">mph</option>
      <option value="knot">Knot</option>
    </select>
    <select id="speedTo">
      <option value="m/s">m/s</option>
      <option value="km/h">km/h</option>
      <option value="mph">mph</option>
      <option value="knot">Knot</option>
    </select>
    <button onclick="convertSpeed()">Prepočítať</button>
    <p class="result" id="speedResult"></p>
  </div>

  <div class="unit-card">
    <h3>Energia</h3>
    <input type="number" id="energyValue" placeholder="Hodnota">
    <select id="energyFrom">
      <option value="J">Joule (J)</option>
      <option value="kJ">kJ</option>
      <option value="cal">Cal</option>
      <option value="kcal">kcal</option>
      <option value="eV">eV</option>
    </select>
    <select id="energyTo">
      <option value="J">Joule (J)</option>
      <option value="kJ">kJ</option>
      <option value="cal">Cal</option>
      <option value="kcal">kcal</option>
      <option value="eV">eV</option>
    </select>
    <button onclick="convertEnergy()">Prepočítať</button>
    <p class="result" id="energyResult"></p>
  </div>

</main>

<footer>
© 2025 Erik Mohylák – UnitConverter pre vedcov a fyzikov
</footer>

<script>
function convertLength(){
  const val = parseFloat(document.getElementById('lengthValue').value);
  const from = document.getElementById('lengthFrom').value;
  const to = document.getElementById('lengthTo').value;
  const rates = {m:1, km:1000, cm:0.01, mm:0.001, inch:0.0254, ft:0.3048, mile:1609.34};
  const result = val * rates[from] / rates[to];
  document.getElementById('lengthResult').innerText = result.toFixed(4);
}

function convertMass(){
  const val = parseFloat(document.getElementById('massValue').value);
  const from = document.getElementById('massFrom').value;
  const to = document.getElementById('massTo').value;
  const rates = {kg:1, g:0.001, mg:0.000001, lb:0.453592, oz:0.0283495};
  const result = val * rates[from] / rates[to];
  document.getElementById('massResult').innerText = result.toFixed(4);
}

function convertTemp(){
  const val = parseFloat(document.getElementById('tempValue').value);
  const from = document.getElementById('tempFrom').value;
  const to = document.getElementById('tempTo').value;
  let c;
  if(from==='C') c = val;
  else if(from==='F') c = (val-32)/1.8;
  else c = val-273.15;
  let result;
  if(to==='C') result=c;
  else if(to==='F') result=c*1.8+32;
  else result=c+273.15;
  document.getElementById('tempResult').innerText=result.toFixed(2);
}

function convertSpeed(){
  const val = parseFloat(document.getElementById('speedValue').value);
  const from = document.getElementById('speedFrom').value;
  const to = document.getElementById('speedTo').value;
  const rates = { 'm/s':1, 'km/h':0.277778, 'mph':0.44704, 'knot':0.514444 };
  const result = val * rates[from] / rates[to];
  document.getElementById('speedResult').innerText = result.toFixed(4);
}

function convertEnergy(){
  const val = parseFloat(document.getElementById('energyValue').value);
  const from = document.getElementById('energyFrom').value;
  const to = document.getElementById('energyTo').value;
  const rates = {J:1, kJ:1000, cal:4.184, kcal:4184, eV:1.60218e-19};
  const result = val * rates[from] / rates[to];
  document.getElementById('energyResult').innerText = result.toExponential(4);
}
</script>

</body>
  </html>
