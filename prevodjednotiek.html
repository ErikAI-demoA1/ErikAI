<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErikAI UnitConverter - Scientific Edition</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #f0f0f0;
    margin: 0;
    padding: 0;
  }
  header {
    background-color: rgba(0,0,0,0.6);
    padding: 20px;
    text-align: center;
    font-size: 1.8em;
    font-weight: bold;
    letter-spacing: 1px;
    text-shadow: 1px 1px 5px black;
  }
  main {
    padding: 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
  }
  .card {
    background-color: rgba(255,255,255,0.05);
    border-radius: 15px;
    padding: 20px;
    width: 300px;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
    transition: transform 0.2s;
  }
  .card:hover {
    transform: scale(1.05);
  }
  h2 {
    margin-top: 0;
    text-align: center;
    color: #ffcc00;
  }
  label {
    display: block;
    margin: 10px 0 5px;
  }
  input, select, button {
    width: 100%;
    padding: 8px;
    border-radius: 8px;
    border: none;
    margin-bottom: 10px;
  }
  button {
    background-color: #ffcc00;
    color: #000;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover {
    background-color: #ffd633;
  }
  .result {
    background-color: rgba(255,255,255,0.1);
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
  }
  footer {
    text-align: center;
    margin: 20px;
    font-size: 0.9em;
    color: #ccc;
  }
</style>
</head>
<body>
<header>ErikAI UnitConverter - Scientific Edition</header>
<main>

<!-- Jednotkové konverzie -->
<div class="card">
  <h2>Jednotky</h2>
  <label for="unitType">Vyber typ jednotky:</label>
  <select id="unitType">
    <option value="length">Dĺžka (m → km)</option>
    <option value="mass">Hmotnosť (kg → g)</option>
    <option value="temperature">Teplota (°C → °F)</option>
    <option value="speed">Rýchlosť (m/s → km/h)</option>
    <option value="energy">Energia (J → kJ)</option>
  </select>

  <label for="unitInput">Hodnota:</label>
  <input type="number" id="unitInput">

  <button onclick="convertUnit()">Prevod</button>
  <div class="result" id="unitResult"></div>
</div>

<!-- Kombinované výpočty -->
<div class="card">
  <h2>Kombinované výpočty</h2>
  <label for="formulaType">Vyber vzorec:</label>
  <select id="formulaType">
    <option value="force">Sila (F = m * a)</option>
    <option value="pressure">Tlak (P = F / A)</option>
    <option value="density">Hustota (ρ = m / V)</option>
    <option value="kineticEnergy">Kinetická energia (KE = 0.5 * m * v²)</option>
    <option value="work">Práca (W = F * d)</option>
  </select>

  <label for="val1">Hodnota 1:</label>
  <input type="number" id="val1">
  <label for="val2">Hodnota 2:</label>
  <input type="number" id="val2">
  <label for="val3">Hodnota 3 (ak treba):</label>
  <input type="number" id="val3">

  <button onclick="calculateFormula()">Vypočítať</button>
  <div class="result" id="formulaResult"></div>
</div>

<!-- Fyzikálne konštanty -->
<div class="card">
  <h2>Konštanty</h2>
  <select id="constantsSelect" onchange="showConstant()">
    <option value="">Vyber konštantu</option>
    <option value="G">Gravitácia G</option>
    <option value="c">Rýchlosť svetla c</option>
    <option value="h">Planckova konštanta h</option>
    <option value="e">Elementárny náboj e</option>
    <option value="NA">Avogadrova konštanta NA</option>
  </select>
  <div class="result" id="constantResult"></div>
</div>

</main>

<footer>© 2025 Erik Mohylák – Vedecký UnitConverter</footer>

<script>
function convertUnit() {
  const type = document.getElementById('unitType').value;
  const val = parseFloat(document.getElementById('unitInput').value);
  let res;
  if (type === 'length') res = val / 1000 + " km";
  else if (type === 'mass') res = val * 1000 + " g";
  else if (type === 'temperature') res = (val * 9/5) + 32 + " °F";
  else if (type === 'speed') res = val * 3.6 + " km/h";
  else if (type === 'energy') res = val / 1000 + " kJ";
  document.getElementById('unitResult').innerText = res;
}

function calculateFormula() {
  const formula = document.getElementById('formulaType').value;
  const v1 = parseFloat(document.getElementById('val1').value);
  const v2 = parseFloat(document.getElementById('val2').value);
  const v3 = parseFloat(document.getElementById('val3').value);
  let res;
  switch(formula) {
    case 'force': res = v1 * v2 + " N"; break;
    case 'pressure': res = v1 / v2 + " Pa"; break;
    case 'density': res = v1 / v2 + " kg/m³"; break;
    case 'kineticEnergy': res = 0.5 * v1 * v2 * v2 + " J"; break;
    case 'work': res = v1 * v2 + " J"; break;
  }
  document.getElementById('formulaResult').innerText = res;
}

const constants = {
  G: "6.674 × 10⁻¹¹ m³·kg⁻¹·s⁻²",
  c: "2.998 × 10⁸ m/s",
  h: "6.626 × 10⁻³⁴ J·s",
  e: "1.602 × 10⁻¹⁹ C",
  NA: "6.022 × 10²³ mol⁻¹"
};

function showConstant() {
  const val = document.getElementById('constantsSelect').value;
  document.getElementById('constantResult').innerText = constants[val] || "";
}
</script>
</body>
</html>
